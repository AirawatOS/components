# A DRIVER (kind=driver). Confined by the Component Host: its only I/O is the broker. It reads the AOI
# (space.aoi) as CONTEXT, fills the bbox with H3 cells, and writes a geo.terrain measure per cell.
component_id: ds:airawat:driver/terrain
kind: driver
version: 0.1.0
provider: ds:airawat:developer
display_name: Terrain
entrypoint: run.py
confinement_min: L1
reads: [space.aoi]
writes: [geo.terrain]
# EXTERNAL CONTRACT (real-DEM mode): the driver may egress ONLY to these hosts, and needs these tenant-
# supplied secrets (the tenant sets/rotates them at install; the broker injects — the driver never sees
# the key). The synthetic-DEM reference build doesn't call out, but the declaration is the contract.
egress: [earthengine.googleapis.com]
secrets: [GEE_API_KEY]
scopes:
  - { verb: read,  scope: space.aoi }
  - { verb: write, scope: geo.terrain, tenant: kmc }
