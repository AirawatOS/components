# A DRIVER (kind=driver). Confined by the Component Host: its only I/O is the broker. It reads the AOI
# (space.aoi) as CONTEXT, fills the bbox with H3 cells, and writes a geo.terrain measure per cell.
component_id: ds:airawat:driver/terrain
kind: driver
version: 0.1.0
provider: ds:airawat:developer
display_name: Terrain
entrypoint: run.py
confinement_min: L1
reads: [space.aoi]
writes: [geo.terrain]
# EXTERNAL CONTRACT: the driver may egress ONLY to these hosts. Open-Meteo's elevation API is FREE + KEYLESS,
# so NO secrets are required (an honest empty secrets list — the driver never needs the key). REAL elevation
# only — no synthetic fallback. (Superseded by terrain-dem, Copernicus GLO-30 via GEE.)
egress:
  - { host: api.open-meteo.com, rate_per_min: 30, user_agent: "AirawatOS/terrain (+https://airawat.org; contact@airawat.org)" }
secrets: []
sources:
  - { ref: "ds:airawat:ref/source/open-meteo", host: api.open-meteo.com, provides: [geo.terrain] }
scopes:
  - { verb: read,  scope: space.aoi }
  - { verb: write, scope: geo.terrain }
