# A DRIVER (kind=driver) — the PUBLIC-TRANSPORT network from OpenStreetMap/Overpass (ADR-0060 L1). Metro/rail
# LINES (ways) + stations/halts + bus stops (nodes) written into the existing governed geo.osm_feature schema,
# distinguished by the `feature` class (as roads use the highway class). Real OSM only; no tenant/AOI default.
component_id: ds:airawat:driver/osm-transit
kind: driver
version: 0.1.2   # 0.1.2: bundles ids.py (as osm-roads does) — inside the geospatial container the shared _common/ids.py is not on the path ('No module named ids'). 0.1.1: declares the geospatial runtime — the driver imports osmium, which only that runtime provides (staging: 'No module named osmium')
provider: ds:airawat:developer
display_name: Transit (OpenStreetMap)
entrypoint: run.py
confinement_min: L1
runtime:
  profile: geospatial          # osmium (PBF parse/clip) + h3 — as osm-roads / gazetteer-builder
reads:
  - space.aoi
writes:
  - geo.osm_feature
config: [OSM_PBF_FILE_ID]              # filestore digest of the uploaded regional OSM PBF (reused from City Setup)
assets:                               # reuse the SAME PBF the tenant uploaded for osm-roads/osm-facilities
  - { name: OSM_PBF, kind: osm-pbf, populates: OSM_PBF_FILE_ID, optional: true, hint: "Regional OpenStreetMap extract (.osm.pbf). Reused from City Setup so transit reads locally instead of hitting Overpass." }
egress:
  - { host: overpass-api.de, rate_per_min: 30, user_agent: "AirawatOS/osm-transit (+https://airawat.org; manishsv@gmail.com)" }
sources:
  - { ref: "ds:airawat:ref/source/osm", host: overpass-api.de, provides: [geo.osm_feature] }
scopes:
  - { verb: read,  scope: space.aoi }
  - { verb: write, scope: geo.osm_feature }
