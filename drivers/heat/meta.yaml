# A DRIVER (kind=driver, ADR-0060 L0→L1 acquisition). Confined — its only I/O is the broker. Reads the AOI
# (space.aoi), samples a grid of points across it, and fetches the temperature at each from Open-Meteo (free,
# keyless) in ONE egress call, writing an environment.lst_observation per point. Open-Meteo returns 2 m AIR
# temperature — a keyless real proxy for surface heat; true satellite LST is a future raster driver. Feeds
# cell-indexer (METHOD=mean) → cell.heat. Deterministic offline fallback (urban-heat-island field) when the
# egress path is unavailable, so the vertical runs keyless; run mode records openmeteo|synthetic.
component_id: ds:airawat:driver/heat
kind: driver
version: 0.1.0
provider: ds:airawat:developer
display_name: Urban Heat (Open-Meteo)
entrypoint: run.py
confinement_min: L1
reads: [space.aoi]
writes: [environment.lst_observation]
egress:
  - { host: api.open-meteo.com, rate_per_min: 30, user_agent: "AirawatOS/heat (+https://airawat.org; contact@airawat.org)" }
sources:
  - { ref: "ds:airawat:ref/source/open-meteo", host: api.open-meteo.com, provides: [environment.lst_observation] }
scopes:
  - { verb: read,  scope: space.aoi }
  - { verb: write, scope: environment.lst_observation, tenant: kmc }
