# A DRIVER (kind=driver) — CRITICAL FACILITIES from OpenStreetMap (ADR-0060 L1, Wave-1 physical).
# Extracts POIs (schools, hospitals, police/fire, govt, utilities, worship, markets, transport) from the
# tenant's uploaded OSM PBF via osmium → geo.facility (native Point, H3-indexed). Real OSM only; no default;
# PBF-only (no Overpass fallback). Runs as a host subprocess (osmium), same as osm-roads.
component_id: ds:airawat:driver/osm-facilities
kind: driver
version: 0.2.0   # 0.2.0: Public Services / Points of Interest split — adds sanitation (toilets, drinking water, waste / recycling), banking (banks, ATMs), welfare (community / social centres), recreation (parks, playgrounds, sports, stadiums) and more types in the existing categories (labs, nursing homes, ambulance, post offices, fuel / EV charging, malls, museums, theatres, telecom towers); category keys unchanged. Was 0.1.1.   # 0.1.1: declares the geospatial runtime — the driver imports osmium, which only that runtime provides (staging: 'No module named osmium')
provider: ds:airawat:developer
display_name: Critical Facilities (OpenStreetMap)
entrypoint: run.py
confinement_min: L1
runtime:
  profile: geospatial          # osmium (PBF parse/clip) + h3 — as osm-roads / gazetteer-builder
reads:
  - space.aoi
  - geo.facility
writes:
  - geo.facility
config: [OSM_PBF_FILE_ID]              # filestore digest of the uploaded regional OSM PBF (set by the Settings upload)
assets:                               # DATA the tenant provides via driver Settings (uploaded to the filestore)
  - { name: OSM_PBF, kind: osm-pbf, populates: OSM_PBF_FILE_ID, optional: true, hint: "Regional OpenStreetMap extract (.osm.pbf — e.g. Geofabrik Maharashtra ~300 MB). The same PBF used by the Roads driver; facilities are read locally, no Overpass." }
sources:
  - { ref: "ds:airawat:ref/source/osm", host: openstreetmap.org, provides: [geo.facility] }
scopes:
  - { verb: read,  scope: space.aoi }
  - { verb: read,  scope: geo.facility }
  - { verb: write, scope: geo.facility }
