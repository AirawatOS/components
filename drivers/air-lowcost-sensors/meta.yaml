# A DRIVER (kind=driver). Confined by the Component Host — its only I/O is the broker. Ingests an
# iDSS low-cost sensor network (a district-scoped vendor API with LOGIN/JWT auth) into air.sensor_reading
# POINTS. The broker performs the login (username/password from Vault) + caches and injects the bearer
# token per this driver's egress AUTH PROFILE — this code never sees the credentials or the token. district-
# scoped (the district id is per-tenant config), a real-data source for the air-quality vertical.
component_id: ds:airawatdeveloper:driver/air-lowcost-sensors   # ADR-0094: software stewarded by the developer participant (not airawat)
kind: driver
version: 0.3.0   # 0.3.0: declare config (IDSS_DISTRICT/IDSS_BASE…) so it's settable in the Settings console (ADR-0092/0099); default base → :4000
provider: ds:airawatdeveloper:developer
display_name: Low-Cost Air Sensors
entrypoint: run.py
confinement_min: L1
reads: [space.aoi]
writes: [air.sensor_reading]
# Per-holder config surfaced in the Settings console + injected as env at run time. IDSS_DISTRICT is the vendor
# district id (no hardcoded city) — the operator picks it per tenant; IDSS_BASE points at the vendor API.
config: [IDSS_BASE, IDSS_DISTRICT, IDSS_WINDOW_HOURS, AS_OF_DATE, PM_MAX_PLAUSIBLE]
# Structured egress: rate cap + identifying UA + a broker-side login/JWT AUTH PROFILE. The $refs name Vault
# secrets (set at install) — no credential value lives in the manifest/listing. The broker logs in, caches
# the JWT (per its exp), and injects `Authorization: Bearer <token>` on every data call.
egress:
  - host: 13.205.88.131
    rate_per_min: 40
    user_agent: "AirawatOS/idss-lowcost (+https://airawat.org)"
    auth:
      login_url: http://13.205.88.131:4000/auth/login
      method: POST
      body: { username: $IDSS_USERNAME, password: $IDSS_PASSWORD }
      token_path: token
      present: { header: Authorization, prefix: "Bearer " }
secrets: [IDSS_USERNAME, IDSS_PASSWORD]
scopes:
  - { verb: read,  scope: space.aoi }
  - { verb: write, scope: air.sensor_reading }
