# A DRIVER (kind=driver) — confined; its only I/O is the broker. This one is a SIMULATION sensor:
# it synthesises a peak-day crowd-density timeline (no external egress) and writes cell.crowd_density.
# In production the same schema is written by a fusion of CCTV people-counting, bus GPS and telco density.
component_id: ds:airawatdeveloper:driver/kumbh-crowd-sim
kind: driver
version: 0.1.1
provider: ds:airawatdeveloper:developer
display_name: Kumbh Crowd Sensor (simulation)
entrypoint: run.py
confinement_min: L1
egress: []                                   # a simulator — reaches no external host
reads: []
writes: [cell.crowd_density]                 # the GOVERNED schema it writes
scopes:
  - { verb: write, scope: cell.crowd_density }
