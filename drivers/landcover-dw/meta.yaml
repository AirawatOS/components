# A DRIVER (kind=driver) — LAND COVER from Google Dynamic World via Earth Engine (ADR-0060 L0→L2).
# It reads the AOI (space.aoi), asks GEE to reduce the Dynamic World composite per H3 cell (server-side),
# and writes cell.builtup + cell.greencover FRACTIONS directly (fused acquire+index). ML-derived → ai-derived.
component_id: ds:airawat:driver/landcover-dw
kind: driver
version: 0.1.0
provider: ds:airawat:developer
display_name: Land Cover (Dynamic World / GEE)
entrypoint: run.py
# CONFINEMENT: needs earthengine-api + google-auth — deps the host Python must NOT carry. So it runs in the
# shared EARTH-OBSERVATION runtime container (components/runtimes/earth-observation), which already provides
# earthengine-api + h3; this driver ships NO image of its own — just declares the profile and is mounted in.
# The runtime's L2 policy allows exactly the broker + this driver's declared egress (the GEE hosts below).
# An L1 host-shim is insufficient (the ee client makes direct HTTPS it would block).
confinement_min: L2
runtime:
  profile: earth-observation           # placement key → components/runtimes/earth-observation image
reads: [space.aoi]
writes: [cell.builtup, cell.greencover]
# EXTERNAL CONTRACT: the driver may egress ONLY to these hosts (GEE auth + compute). Declared for
# certification + audit; enforced at the container network boundary in a real L2 deployment.
egress:
  - { host: oauth2.googleapis.com,               rate_per_min: 30, user_agent: "AirawatOS/landcover-dw" }
  - { host: earthengine.googleapis.com,          rate_per_min: 120, user_agent: "AirawatOS/landcover-dw" }
  - { host: earthengine-highvolume.googleapis.com, rate_per_min: 300, user_agent: "AirawatOS/landcover-dw" }
# SECRET: a Google service-account key. Stored in Vault (secret/<tenant>/<component>/GEE_SERVICE_ACCOUNT_KEY),
# supplied by the tenant at install, materialised into the container env at run (the ee client needs the raw
# key — the declared exception to broker secret-injection; see SETUP.md). NEVER in code/registry.
secrets: [GEE_SERVICE_ACCOUNT_KEY]
config:  [GEE_PROJECT, GEE_SERVICE_ACCOUNT]          # non-secret run config (project id + SA email)
sources:
  - { ref: "ds:airawat:ref/source/dynamic-world", host: earthengine.googleapis.com, provides: [cell.builtup, cell.greencover] }
scopes:
  - { verb: read,  scope: space.aoi }
  - { verb: write, scope: cell.builtup,    tenant: kmc }
  - { verb: write, scope: cell.greencover, tenant: kmc }
