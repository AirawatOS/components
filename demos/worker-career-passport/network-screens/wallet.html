<!doctype html><html lang=en><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1">
<title>Your livelihood account</title>
<!--
  NETWORK-DRAWN SCREEN (ADR-0136): the account holder's wallet — every current credential, from any issuer, with a PDF
  and a public check. Served by the network at /embed/screen/wallet; generic for every app. Reached with a ticket in the
  URL fragment (#t=<ticket>) that the app obtained for the signed-in holder; the app itself never reads the wallet.
-->
<style>
:root{--ink:#15202b;--dim:#5f7183;--line:#e4e9ef;--bg:#f3f5f8;--card:#fff;--brand:#1f4fa3;--ok:#0b6b3a;--err:#b42318}
*{box-sizing:border-box} body{margin:0;font:16px/1.55 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink)}
header{background:var(--brand);color:#fff;padding:14px 16px;display:flex;align-items:center;gap:10px}
header b{font-size:17px} header span{font-size:12px;opacity:.85}
main{max-width:560px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
h1{font-size:19px;margin:0 0 4px} h2{font-size:16px;margin:0} .iss{font-size:13px;color:var(--dim);margin:2px 0 6px}
.muted{color:var(--dim);font-size:13px} .err{color:var(--err)}
table{width:100%;border-collapse:collapse;font-size:14px} th{text-align:left;color:var(--dim);font-weight:500;width:40%;padding:5px 0;border-top:1px solid var(--line);vertical-align:top} td{padding:5px 0;border-top:1px solid var(--line);word-break:break-word}
.btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
button,.btn{padding:9px 14px;border:0;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;background:var(--brand);color:#fff;text-decoration:none;display:inline-block}
.sec{background:#e8edf4;color:var(--ink)}
footer{max-width:560px;margin:0 auto;padding:0 16px 24px;color:var(--dim);font-size:12px}
</style></head><body>
<header><b>Avsar</b><span>your livelihood account · run for workers by the Ministry of Labour</span></header>
<main id=m><div class=card><p class=muted>Loading…</p></div></main>
<footer>Your credentials belong to you. Apps see only what you choose to share.</footer>
<script src="/demo/vendor/jspdf-2.5.1.umd.min.js" defer></script>
<script src="/demo/vendor/qrcode-generator-1.4.4.min.js" defer></script>
<script>
(function(){
  var T=new URLSearchParams(location.hash.slice(1)).get('t'), M=document.getElementById('m');
  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  var LABEL={uan:'UAN',full_name:'Name',certificate_no:'Certificate no.',occupation:'Work',platform:'Platform',worker_platform_id:'ID on platform',
    engaged_since:'Since',registered_on:'Registered on',date_of_birth:'Date of birth',status:'Status',kyc_method:'Identity check',kyc_verified_on:'Checked on',verified_on:'Verified on',method:'Method'};
  function rows(cl){ var out=[];
    Object.keys(LABEL).forEach(function(k){ if(cl[k]!=null&&cl[k]!=='') out.push([LABEL[k],cl[k]]); });
    if(Array.isArray(cl.platforms)&&cl.platforms.length) out.push(['Platforms',cl.platforms.map(function(p){return p.name;}).join(', ')]);
    if(cl.aadhaar_last4) out.push(['Aadhaar','xxxx-xxxx-'+cl.aadhaar_last4]);
    return out; }
  function pdf(c){
    var cl=c.claims||{}, r=rows(cl).filter(function(x){return x[0]!='Name';}).slice(0,7);
    var doc=new jspdf.jsPDF({orientation:'landscape',unit:'mm',format:[90,170]}), url=location.origin+'/embed/verify?id='+encodeURIComponent(c.id);
    doc.setFillColor(31,79,163); doc.rect(0,0,170,18,'F'); doc.setTextColor(255,255,255); doc.setFont('helvetica','bold'); doc.setFontSize(12);
    doc.text(String(c.title||c.type).slice(0,52),8,11.5); doc.setTextColor(21,32,43); doc.setFontSize(15); doc.text(String(cl.full_name||''),8,30);
    var y=39; doc.setFontSize(8.5); r.forEach(function(x){ doc.setFont('helvetica','normal'); doc.setTextColor(95,113,131); doc.text(x[0],8,y);
      doc.setTextColor(21,32,43); doc.setFont('helvetica','bold'); doc.text(String(x[1]).slice(0,34),40,y); y+=6.2; });
    var q=qrcode(0,'M'); q.addData(url); q.make(); var n=q.getModuleCount(), size=50, cell=size/n, x0=112, y0=23;
    doc.setFillColor(21,32,43); for(var i=0;i<n;i++)for(var j=0;j<n;j++) if(q.isDark(i,j)) doc.rect(x0+j*cell,y0+i*cell,cell,cell,'F');
    doc.setFontSize(7); doc.setTextColor(95,113,131); doc.setFont('helvetica','normal'); doc.text('Scan to check it is genuine and current',x0+size/2,y0+size+4,{align:'center'});
    doc.setDrawColor(228,233,239); doc.line(8,81,162,81); doc.setFontSize(6.5); doc.text('Issued by '+(c.issuer_name||c.issuer_tenant||''),8,86);
    doc.text('Avsar livelihood account',162,86,{align:'right'});
    doc.save(String(c.title||'credential').toLowerCase().replace(/[^a-z0-9]+/g,'-').slice(0,60)+'.pdf');
  }
  if(!T){ M.innerHTML='<div class=card><h1>Open your account from an app</h1><p class=muted>This link needs to come from an app you are signed in to.</p></div>'; return; }
  fetch('/embed/wallet/view',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({ticket:T})}).then(function(r){return r.json();}).then(function(d){
    if(d.error){ M.innerHTML='<div class=card><h1>Link expired</h1><p class=err>'+esc(d.error)+'</p></div>'; return; }
    var all=d.credentials||[], cur=all.filter(function(c){return c.status!='revoked';}), gone=all.length-cur.length;
    var back=d.return_url?'<a class="btn sec" href="'+esc(d.return_url)+'">Back to '+esc(d.app||'the app')+'</a>':'';
    M.innerHTML='<div class=card><h1>Your credentials</h1><p class=muted>'+cur.length+' current'+(gone?' · '+gone+' replaced and no longer valid, not shown':'')+'. Each is signed by its issuer.</p>'+
      (back?'<div class=btns>'+back+'</div>':'')+'</div>'+
      cur.map(function(c,i){ return '<div class=card><h2>'+esc(c.title||c.type)+'</h2><p class=iss>Issued by '+esc(c.issuer_name||c.issuer_tenant)+(c.issued_at?' on '+esc(String(c.issued_at).slice(0,10)):'')+'</p>'+
        '<table>'+rows(c.claims||{}).map(function(x){return '<tr><th>'+esc(x[0])+'</th><td>'+esc(x[1])+'</td></tr>';}).join('')+'</table>'+
        '<div class=btns><button data-i="'+i+'">Download PDF</button><a class="btn sec" target=_blank rel=noopener href="/embed/verify?id='+encodeURIComponent(c.id)+'">Check it</a></div></div>'; }).join('');
    Array.prototype.forEach.call(M.querySelectorAll('button[data-i]'),function(b){ b.onclick=function(){
      try{ pdf(cur[+b.getAttribute('data-i')]); b.textContent='Downloaded ✓'; }catch(e){ b.textContent='PDF failed: '+e.message; } }; });
  }).catch(function(){ M.innerHTML='<div class=card><p class=err>Your account could not be reached.</p></div>'; });
})();
</script>
</body></html>
