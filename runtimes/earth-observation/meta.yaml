# A RUNTIME PROFILE (ADR-0030 clean-room, ported from AirOS specs/11). A shared, per-profile container that
# bundles a coherent library set; DRIVERS declare `runtime.profile: earth-observation` and are MOUNTED in —
# they never ship their own image. One image runs every EO driver (GEE/raster/satellite). GEE lives here.
component_id:   ds:airawat:runtime/earth-observation   # a CERTIFIABLE component (kind=runtime, ADR-0022/0030)
kind:           runtime
version:        0.1.0
provider:       ds:airawat:developer
implements:     platform.runtime_invoke@0.1.0          # the governed placement interface (ADR-0058) it satisfies
runtime_id:     earth-observation
profile:        earth-observation
analytics_tier: descriptive                 # acquire/observe the world (satellite, raster) → raw facts
display_name:   Earth Observation (satellite · raster · Google Earth Engine)
image:          manishsv/airawatos-runtime-earth-observation:0.1.0
image_digest:   sha256:0ea3541eefd6831d43f7ce40c65b0af16aa0b5d34fdbf3d00d22bbf88fbef6b3   # CERTIFIED image content id = `docker image inspect .Id` (config digest the launcher checks; NOT the Hub manifest digest 7515d3…)
provides:       [earthengine-api, google-auth, rasterio, numpy, scipy, shapely, pyproj, earthaccess, h3]
isolation:      shared                       # per-profile shared runner (first-party); a tenant Clean Room is L3+
confidential:   false
level:          L2                            # container isolation; egress = broker + the driver's declared hosts
