# A whole decision-support vertical, declared once (ADR-0106 S1). Inline lists/maps so it
# parses with or without PyYAML. `aos deploy --sandbox` stands this up in your dev tenant.
solution: water-safety
environment: development
# L3 risk assessments (derived from many inputs) — stand-alone measures, no L1 entity dependency
# (ADR-0060 §3a). A cell-level measure (cell.*) would additionally require a published L1 entity.
schemas: [{id: risk.flood, x-kind: measure}, {id: risk.exposure, x-kind: measure}]
roles: [water.duty-officer]
workflow: workflow.graph.yaml
# reuse members are PINNED (name@x.y.z) — ADR-0098 lockfile: the bundle records exact versions so it is
# reproducible; an unpinned reuse member floats to latest (aos deploy warns). build members are your own.
members: {reuse: [lifecycle-engine@0.1.0, decision-router@0.1.0, effectiveness-engine-aos@0.1.0], build: [engines/infer]}
viz_layers: [risk.flood, risk.exposure]
decider: water.duty-officer
subscriptions: [{on: governance.recommendation, do: decision.route}]
contributions: []
