component_id: ds:janaagraha:driver/works-register-extractor
kind: driver
version: 0.4.0                    # 0.4.0: CITY-WIDE — discover + ingest every by-ward CSV from the CKAN package (ward label derived from resource name; WARD_OFFSET/WARD_LIMIT batch slices; chunked write_many; one bad ward skipped not fatal). 0.3.0: trustworthy amounts via per-row gross−deduction==nett consistency gate + banner-preamble header detection + source-agnostic columns. 0.2.0: aos SDK migration — ctx.fetch brokered egress
provider: ds:janaagraha:developer
entrypoint: run.py
confinement_min: L1
title: Works Register Extractor
description: >
  Ingests BBMP public work-orders from the OpenCity open dataset (ODbL) and writes governed public-works facts
  for the Public Expenditure Dashboard: works.work_order + works.contract + works.contractor + works.payment,
  each carrying provenance back to the source CSV. Realizes ds:janaagraha:service_spec/public-expenditure-dashboard.
reads: []
writes: [works.work_order, works.contract, works.contractor, works.payment]
egress:
  - { host: data.opencity.in, rate_per_min: 120, user_agent: "AirawatOS/works-register-extractor (+https://airawat.org; manishsv@gmail.com)" }
config: [OPENCITY_CSV_URL, OPENCITY_DATASET, WARD, WARD_OFFSET, WARD_LIMIT, MAX_ROWS]
sources:
  - { ref: "ds:janaagraha:ref/source/opencity-bbmp", host: data.opencity.in, provides: [works.work_order, works.contract, works.contractor, works.payment] }
scopes:
  - { verb: write, scope: works.work_order, tenant: janaagraha }
  - { verb: write, scope: works.contract,   tenant: janaagraha }
  - { verb: write, scope: works.contractor, tenant: janaagraha }
  - { verb: write, scope: works.payment,    tenant: janaagraha }
