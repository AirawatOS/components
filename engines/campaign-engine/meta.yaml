# CAMPAIGN ENGINE (kind=engine) — the field-verification loop for tax-gap candidates: create a campaign, assign officers
# to candidates (→ an ACTIONABLE Inbox item), and record on-site ground truth → a governance.decision that verifies or
# dismisses each candidate (ADR-0029: AI flags, humans decide). Handlers: campaign-create, campaign-assign, verify-submit,
# campaign-progress. Editable + versioned in Studio.
component_id: ds:airawatdeveloper:engine/campaign-engine
kind: engine
version: 0.1.3   # ADR-0100 C2: config-driven verify-decide + copy_fields passthrough (decoupled from tax); republish over drifted 0.1.2
provider: ds:airawat:developer
display_name: Campaign Engine
entrypoint: run.py
implements:
  - campaign.assign@0.1.0
  - campaign.create@0.1.0
  - campaign.record_verification@0.1.0
verbs:
  campaign-create: campaign.create@0.1.0
  campaign-assign: campaign.assign@0.1.0
  verify-submit: campaign.record_verification@0.1.0
verbs_exempt:
  - campaign-progress   # read-only progress report over the engine's own assignments; no cross-participant delivery
required_schemas: [campaign.campaign, campaign.assignment, tax.candidate, org.employee, platform.inbox_item]
reads: [campaign.campaign, campaign.assignment, tax.candidate, org.employee, platform.inbox_item]
writes: [campaign.campaign, campaign.assignment, tax.candidate, governance.decision, platform.inbox_item]
