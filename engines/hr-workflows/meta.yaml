# HR WORKFLOWS ENGINE (kind=engine) — the LOGIC for HR self-service: leave, attendance, expense (apply/decide).
# The host dispatches /bridge/{leave-apply,leave-decide,attendance-mark,expense-apply,expense-decide} to this
# engine's HANDLERS (run.py). Writes are attributed component://hr-workflows obo the employee (ADR-0052) — so THIS
# engine holds the write grants (the HR Desk app is just screens). Editable + versioned in Studio like any component.
component_id: ds:airawatdeveloper:engine/hr-workflows
kind: engine
version: 0.3.0
provider: ds:airawat:developer
display_name: HR Workflows Engine
entrypoint: run.py
# reads employees + own HR records (for balances); DELEGATES policy resolution + ledger settlement to sibling engines
# (ctx.call → policy-engine / finance-engine) — so it needs NO org-tree or finance grants of its own.
required_schemas: [org.employee, hr.leave_request]
writes: [hr.leave_request, hr.attendance, hr.expense_claim, platform.inbox_item]
