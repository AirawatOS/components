# An INT-0001 analytics engine (kind=engine, SPEC-0004). Confined: reads facts + writes analyses/signals
# ONLY through the broker. Climbs the ladder (descriptive → prescriptive) and emits a Recommendation.
component_id: ds:airawat:engine/air-diagnosis
kind: engine
version: 0.1.0
provider: ds:airawat:developer
display_name: Air-Quality Diagnosis Engine
entrypoint: run.py          # what the Component Host launches (platform-spec PLAT-HOST-008)
confinement_min: L1         # minimum host confinement level this component must run under
reads: [air.station_reading]
writes: [intelligence.analysis, intelligence.signal]
scopes:
  - { verb: read,  scope: air.station_reading }
  - { verb: write, scope: intelligence.analysis, tenant: kmc }
  - { verb: write, scope: intelligence.signal,   tenant: kmc }
