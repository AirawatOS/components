# CITY INTELLIGENCE (kind=engine) — the City Scan ANALYST as a certified, confined, ROUTED component (not baked
# into the host). Implements the `city.analyst` interface: the verb `city-ask` takes an operator's question, reads
# the tenant's GOVERNED map layers (risk.flood, cell.crowd_density, vision.detection, governance.recommendation) via
# its OWN read grants, computes the cross-layer facts (cells that are BOTH flooding and crowded, people exposed,
# worst sites, open recommendations), grounds the confined model on ONLY those facts, and returns a cited answer.
# In-process HANDLERS engine (ADR-0030/#166): its I/O is the ctx surface (kfind + ai_complete) — nothing else.
# AI informs, a human commander decides (ADR-0029). Routed via governed verb_binding (#268), so /bridge/city-ask
# resolves here with NO host code and NO baking — swap or upgrade by publishing a new version.
component_id: ds:airawatdeveloper:engine/city-intelligence
kind: engine
version: 0.4.5   # 0.4.5: cells denser than the densest 2011 census ward (113,590 /km²; DENSITY_PLAUSIBLE_MAX) are not ranked on density — shown under 'not ranked — modelled density looks implausible' (GHSL over-allocates commercial cores). 0.4.4: the engine writes the ranked tables (never truncated; exact place labels for the map link) and the evidence line; the model writes only a short headline + bullets; a cut-off reply drops its dangling fragment and is marked shortened. 0.4.3: cells named by their nearest gazetteer place ('near Jayanagar (1.6 km)'), from space.place; lat/lon only when no named place is within 2.5 km. 0.4.2: Markdown answers (tables for ranked cells, lat/lon not h3 ids, one short evidence line); the congestion proxy ranks only the denser half of the city (outskirts with almost no roads no longer top it). 0.4.1: answer budget 900 → 1800 (the reasoning model used it all thinking → empty answer); an empty model reply shows the computed facts instead of 'No answer'. 0.4.0: a general city analyst — reads the city.cell_profile rollup (raw cell layers as fallback), the works rollups and ALL open recommendations; topic-chosen facts; missing layers stated; proxies labelled
provider: ds:airawat:developer
display_name: City Intelligence
entrypoint: run.py
confinement_min: L1
implements: [city.analyst@0.1.0]
verbs:
  city-ask: city.analyst@0.1.0
required_schemas: [governance.recommendation, city.coverage]   # 0.4.0: every other layer is OPTIONAL — absent layers are reported, not required
reads: [risk.flood, cell.crowd_density, vision.detection, governance.recommendation, city.coverage, intelligence.effectiveness, city.cell_profile, cell.heat, cell.rainfall, cell.weather_forecast, cell.builtup, cell.greencover, cell.hydrology, demographics.population, cell.buildings, cell.roads, geo.facility, works.city_summary, works.ward_rollup, works.contractor_rollup, space.place]
writes: []
scopes:
  - { verb: read, scope: risk.flood }
  - { verb: read, scope: cell.crowd_density }
  - { verb: read, scope: vision.detection }
  - { verb: read, scope: governance.recommendation }
  - { verb: read, scope: city.coverage }
  - { verb: read, scope: intelligence.effectiveness }
  - { verb: read, scope: city.cell_profile }
  - { verb: read, scope: cell.heat }
  - { verb: read, scope: cell.rainfall }
  - { verb: read, scope: cell.weather_forecast }
  - { verb: read, scope: cell.builtup }
  - { verb: read, scope: cell.greencover }
  - { verb: read, scope: cell.hydrology }
  - { verb: read, scope: demographics.population }
  - { verb: read, scope: cell.buildings }
  - { verb: read, scope: cell.roads }
  - { verb: read, scope: geo.facility }
  - { verb: read, scope: works.city_summary }
  - { verb: read, scope: works.ward_rollup }
  - { verb: read, scope: works.contractor_rollup }
  - { verb: read, scope: space.place }
