# CITY INTELLIGENCE (kind=engine) — the City Scan ANALYST as a certified, confined, ROUTED component (not baked
# into the host). Implements the `city.analyst` interface: the verb `city-ask` takes an operator's question, reads
# the tenant's GOVERNED map layers (risk.flood, cell.crowd_density, vision.detection, governance.recommendation) via
# its OWN read grants, computes the cross-layer facts (cells that are BOTH flooding and crowded, people exposed,
# worst sites, open recommendations), grounds the confined model on ONLY those facts, and returns a cited answer.
# In-process HANDLERS engine (ADR-0030/#166): its I/O is the ctx surface (kfind + ai_complete) — nothing else.
# AI informs, a human commander decides (ADR-0029). Routed via governed verb_binding (#268), so /bridge/city-ask
# resolves here with NO host code and NO baking — swap or upgrade by publishing a new version.
component_id: ds:airawatdeveloper:engine/city-intelligence
kind: engine
version: 0.5.1   # 0.5.1: reads cached across questions for 15 min per (tenant, schema, filter) — a question re-read up to ten whole datasets and took ~60 s, past the public proxy's 60 s timeout; '__warm__' loads them without the model (the tour and the Ask panel call it). 0.5.0: knows the rest of the city's data — facilities by category with straight-line distance to the nearest (toilets, schools, police, banks, parks… — osm-facilities 0.2.0), lakes (which shrank most, shore built-up, a named lake by year), night-lights growth 2014–2025 (brightened vs newly lit, a proxy), local civic issues from news (national stories left out), works paid by year and wards by tenders, and a PROFILE of a named ward / locality / lake ('tell me about Nilasandra') against the city median; inventory lists facility points, lakes, night lights, building outlines, AOD, CAMS, wards. 0.4.8: 'top 5 priorities / if you were responsible' → engine-computed CANDIDATE priorities (flood-prone low-lying areas, health access > 1.5 km, under-funded dense wards, transit gaps > 800 m bus AND > 2 km metro, PM2.5 above the 24-hour standard), each with people affected, top places, measure and caveat; layers that cannot support a priority (a flat heat layer, an implausible green layer) are said, not ranked; bigger answer budget (the open question used all 3,000 tokens reasoning → empty); an empty model reply shows the engine's tables with a note, not a raw stats dump; the facility category 'healthcare' is matched (health questions treated every cell as uncovered). 0.4.7: 'what data do you have' answers with ONE inventory table of every layer (was routed to the congestion topic by the word 'access'); an AIR topic (PM2.5 of the latest interpolated hour only, worst cells, PM2.5 × people, hotspots, measured stations); a ward NEED-vs-SPEND ranking (census 2011 density, PM2.5, metro distance, works paid per person — equal-weight percentile ranks, a ranking aid) with every cell of each listed ward returned for the map; keywords match at word starts ('hotspot' is not heat, 'airport' is not air). 0.4.6: mobility — joins walkability, transit access and chokepoints (driver/mobility-indexes); transit and walkability topics; congestion questions also get the chokepoint PROXY. 0.4.5: cells denser than the densest 2011 census ward (113,590 /km²; DENSITY_PLAUSIBLE_MAX) are not ranked on density — shown under 'not ranked — modelled density looks implausible' (GHSL over-allocates commercial cores). 0.4.4: the engine writes the ranked tables (never truncated; exact place labels for the map link) and the evidence line; the model writes only a short headline + bullets; a cut-off reply drops its dangling fragment and is marked shortened. 0.4.3: cells named by their nearest gazetteer place ('near Jayanagar (1.6 km)'), from space.place; lat/lon only when no named place is within 2.5 km. 0.4.2: Markdown answers (tables for ranked cells, lat/lon not h3 ids, one short evidence line); the congestion proxy ranks only the denser half of the city (outskirts with almost no roads no longer top it). 0.4.1: answer budget 900 → 1800 (the reasoning model used it all thinking → empty answer); an empty model reply shows the computed facts instead of 'No answer'. 0.4.0: a general city analyst — reads the city.cell_profile rollup (raw cell layers as fallback), the works rollups and ALL open recommendations; topic-chosen facts; missing layers stated; proxies labelled
provider: ds:airawat:developer
display_name: City Intelligence
entrypoint: run.py
confinement_min: L1
implements: [city.analyst@0.1.0]
verbs:
  city-ask: city.analyst@0.1.0
required_schemas: [governance.recommendation, city.coverage]   # 0.4.0: every other layer is OPTIONAL — absent layers are reported, not required
reads: [risk.flood, cell.crowd_density, vision.detection, governance.recommendation, city.coverage, intelligence.effectiveness, city.cell_profile, cell.heat, cell.rainfall, cell.weather_forecast, cell.builtup, cell.greencover, cell.hydrology, demographics.population, cell.buildings, cell.roads, geo.facility, works.city_summary, works.ward_rollup, works.contractor_rollup, space.place, mobility.walkability, mobility.transit_access, mobility.chokepoint, air.quality, air.hotspot, air.sensor_reading, demographics.census_ward, works.ward_cell, procurement.ward_cell, news.item, civic.issue, water.lake, water.lake_cell, econ.nightlight_trend, space.ward, space.aoi, geo.building, cell.aod, cell.cams]
writes: []
