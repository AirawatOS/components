# An ENGINE (kind=engine) — MODEL EVALUATION on the platform's own tasks. Runs pending intelligence.eval_run records:
# every model × active case of a suite, sent through the broker's /v1/complete NAMING the model (the gateway routes by
# task + model — the production path), scored deterministically, written as intelligence.eval_result, summarised on the
# run. With SEED_DOC it builds a norm-extraction suite from a knowledge.document, each case exactly the call
# engine/rule-extract makes; expected answers come from APPROVED governance.rule records for that section.
# Managed from the Model Lab app.
component_id: ds:airawatdeveloper:engine/model-eval
kind: engine
version: 0.2.3   # 0.2.3: occlusion / obstruction definitions in prompts and form help; B09 animals; B01 animal classes; SEED_ONLY_ACTIVE. 0.2.2: B03 vehicle classes match UVH-26 detectors; SEED_UPDATE refreshes unlabelled cases; component:… models are left to their engine. 0.2.1: SEED_FOLDER builds the urban-visual-intelligence suite from a Files folder (visual_tests.py). 0.2.0: image inputs (sent as chat image parts; read through the broker), a private case never reaches an external model, counts / labels / text scorers (ADR-0134). 0.1.9: THINKING=on|off sends the gateway's per-request thinking switch on every call (noted on the run). 0.1.8: json_fields reads the LAST JSON object, so an answer may show its working first. 0.1.7: json_fields compares numbers within 1% (4.5 = 4.50) and lists the wrong fields. 0.1.6: runs resume — the engine pauses a run before the runtime's time limit (STOP_AFTER, default 1,400 s), keeps it pending with its results, and the next start continues it with the settings it began with. 0.1.5: MAX_TOKENS sets the answer budget for a whole run (noted on the run) — thinking models spend part of the case budget reasoning. 0.1.4: CASES=with_norms runs only labelled cases that expect at least one norm (noted on the run). 0.1.3: a rescore without RERUN_TRUNCATED keeps the original score of an answer stored cut at 6,000 characters (re-parsing the cut text lost norms). 0.1.2: lakh / crore figures count as the numbers they are (10 lakh = 1,000,000); full answers kept (was cut at 6,000 characters) with the parsed norms; RESCORE_RUN re-scores a stored run (RERUN_TRUNCATED=1 re-asks only the cut answers). 0.1.1: 0.1.1: a model the gateway does not serve for 'chat' is tried under 'eval' — models registered for evaluation only, never on a production route
provider: ds:airawat:developer
display_name: Model Evaluation
entrypoint: run.py
confinement_min: L1
reads: [intelligence.eval_case, intelligence.eval_run, knowledge.document, knowledge.version, knowledge.chunk, governance.rule]
writes: [intelligence.eval_case, intelligence.eval_run, intelligence.eval_result]
config: [SEED_DOC, SEED_FOLDER, SEED_UPDATE, SEED_ONLY_ACTIVE, SEED_TESTS, SEED_DEV_SHARE, SEED_SUITE, SEED_FOCUS, SEED_LIMIT, MAX_CASES, CASES, MAX_TOKENS, THINKING, STOP_AFTER, RESCORE_RUN, RERUN_TRUNCATED]
files: [get]          # image inputs, read through the broker (ADR-0134)
scopes:
  - { verb: read,  scope: intelligence.provider }
  - { verb: read,  scope: platform.file }          # SEED_FOLDER: the images of one Files folder (ADR-0134)
  - { verb: read,  scope: intelligence.eval_case }
  - { verb: read,  scope: intelligence.eval_run }
  - { verb: read,  scope: knowledge.document }
  - { verb: read,  scope: knowledge.version }
  - { verb: read,  scope: knowledge.chunk }
  - { verb: read,  scope: governance.rule }
  - { verb: write, scope: intelligence.eval_case }
  - { verb: write, scope: intelligence.eval_run }
  - { verb: write, scope: intelligence.eval_result }
