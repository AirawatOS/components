# TAX GAP ENGINE (kind=engine) — the config-driven analytical spine for property-tax enforcement. Fuzzy record-linkage
# (mobile/name/address, weighted) + spatial join (point-in-polygon) + geocode banding + geometric hygiene + change
# detection → scored tax.candidate + a governance.recommendation (AI flags, humans decide). EVERY threshold + weight is
# read from tax.match_policy (Tax Config Console-editable) — nothing hardcoded. Handlers: matchpolicy-get/set,
# match-preview (weight tuning), gap-scan (the spine). Editable + versioned in Studio.
component_id: ds:airawatdeveloper:engine/tax-gap-engine
kind: engine
version: 0.2.6   # + H3 rollup to cell.tax_gap (renders as City Scan choropleth)
provider: ds:airawat:developer
display_name: Tax Gap Engine
entrypoint: run.py
implements:
  - tax.gap_scan@0.1.0
  - tax.matchpolicy_get@0.1.0
  - tax.matchpolicy_set@0.1.0
verbs:
  gap-scan: tax.gap_scan@0.1.0
  matchpolicy-get: tax.matchpolicy_get@0.1.0
  matchpolicy-set: tax.matchpolicy_set@0.1.0
verbs_exempt:
  - match-preview   # stateless scoring preview to tune weights in the config console; reads/writes no governed data
# reads: the config, the ledger/utility/cadastre/footprint/change layers it triangulates.
required_schemas: [tax.match_policy, tax.assessment, util.connection, geo.parcel, geo.building, tax.change_signal]
reads: [tax.match_policy, tax.assessment, util.connection, geo.parcel, geo.building, tax.change_signal]
# writes: the matching policy (config console), the flagged candidates, and the AI recommendation behind each flag.
writes: [tax.match_policy, tax.candidate, governance.recommendation, cell.tax_gap]
