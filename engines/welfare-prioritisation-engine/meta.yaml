# WELFARE PRIORITISATION ENGINE (ADR-0069 slice 2 · ADR-0046 hourglass · ADR-0029 spine). Turns the gap picture
# into "what to do about it": ranks the publishable welfare gaps by how many people are CONFIDENTLY below the
# floor (the lower credible bound, not the optimistic point) × how deep the shortfall is × the equity weight, fits
# an optional fiscal budget (greedy, most people helped per rupee), and emits a governance.recommendation per top
# opportunity — a PROPOSED option a human authority admits into a Decision. It never recommends off a provisional
# (unpublishable) estimate. AI recommends; the authority decides.
component_id: ds:airawatdeveloper:engine/welfare-prioritisation-engine
kind: engine
version: 0.1.6   # + governed verbs (implements:/verbs:) via tools/verb_conformance.py
provider: ds:airawat:developer
display_name: Welfare Prioritisation Engine
entrypoint: run.py
implements:
  - welfare.prioritise@0.1.0
  - welfare.prioritise_cells@0.1.0
verbs:
  welfare-prioritise: welfare.prioritise@0.1.0
  welfare-prioritise-cells: welfare.prioritise_cells@0.1.0
required_schemas: [stat.estimate, welfare.gap, welfare.floor, welfare.capability, welfare.deprivation, civic.household, env.resource_budget, welfare.cost_model, welfare.intervention, governance.recommendation, welfare.priority]
reads:  [stat.estimate, welfare.gap, welfare.floor, welfare.capability, welfare.deprivation, civic.household, env.resource_budget, welfare.cost_model, welfare.intervention]
writes: [governance.recommendation, welfare.priority]
