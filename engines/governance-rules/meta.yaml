# An analytics ENGINE (kind=engine). Confined — its only I/O is the broker. The RULES side of the Decision
# hourglass (ADR-0046): it evaluates governance.rule (structured thresholds) against the fact surface they
# `apply_to` (here air.quality over an AOI), finds the highest-PRIORITY rule that fires, and emits ONE
# governance.recommendation carrying that rule's action at its declared STRENGTH (mandatory/advisory),
# cited to the rule + its source instrument. Deterministic — no LLM. AI never decides; it recommends, and
# an authority admits the recommendation into a governance.decision downstream.
component_id: ds:airawat:engine/governance-rules
kind: engine
version: 0.1.0
provider: ds:airawat:developer
display_name: Governance Rules (facts → recommendation)
entrypoint: run.py
confinement_min: L1
reads: [space.aoi, governance.rule, air.quality]
writes: [governance.recommendation]
scopes:
  - { verb: read,  scope: space.aoi }
  - { verb: read,  scope: governance.rule }
  - { verb: read,  scope: air.quality }
  - { verb: write, scope: governance.recommendation, tenant: kmc }
