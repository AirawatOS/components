# PAYROLL ENGINE (kind=engine) — apportions LABOUR cost to projects: for a period, each project.allocation (employee →
# project at %) becomes a project-tagged salary transaction (cost = hr.compensation.monthly_cost × percent), posted via
# the finance-engine (ctx.call → finance-post) so it rolls into the project's budget + the rollup's `spent`. NO
# fabrication: allocations lacking compensation / budget are reported skipped. Idempotent per (allocation, period).
# Delegates all writes to the finance-engine (holds NO finance write grant of its own). Editable + versioned in Studio.
component_id: ds:airawatdeveloper:engine/payroll-engine
kind: engine
version: 0.3.0
provider: ds:airawat:developer
display_name: Payroll Engine
entrypoint: run.py
# 0.3.0: headless SCHEDULED run needs RUN-TOKEN read grants — the steward grant is built from `reads`+`writes`
# (the interactive user-token path used required_schemas, but a headless cron has no user token). It posts under
# its OWN run-token, so the scheduled path also needs the finance write grants.
required_schemas: [project.allocation, org.employee, hr.compensation, finance.budget, finance.transaction, finance.account]
reads: [project.allocation, org.employee, hr.compensation, finance.budget, finance.transaction, finance.account]
writes: [finance.transaction, finance.budget]
