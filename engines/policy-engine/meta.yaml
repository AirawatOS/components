# POLICY ENGINE (kind=engine) — resolves the applicable org.policy for an employee × domain (most-specific first),
# from their classification context (rank via posting→position→level, stream, role, unit). Reads the org tree via
# ITS OWN read grants (no elevated token). Any module calls it via /bridge/policy-resolve or ctx.call.
component_id: ds:airawatdeveloper:engine/policy-engine
kind: engine
version: 0.1.3   # + policy-resolve-legacy handler (ADR-0091 V2): bespoke resolver retained behind the `evaluate` alias
#        0.1.2: org-classify context provider (ADR-0088-S2): subject→classification facts for the rule-engine
provider: ds:airawat:developer
display_name: Policy Engine
entrypoint: run.py
implements:
  - org.policy_resolve@0.1.0
verbs:
  policy-resolve: org.policy_resolve@0.1.0
required_schemas: [org.employee, org.posting, org.position, hr.job_level, org.policy]
writes: []
