# A SKILL (kind=skill, INT-0002). The atomic reasoner: Facts × Rules → cited governance.recommendation.
# HYBRID reasoning — a deterministic core selects the governing governance.rule that fires against the AOI's
# PM2.5 facts (auditable, no model), and the LLM writes the human-readable advisory grounded ONLY in that
# fired rule + the measured stats. Confined: broker only. AI recommends; an authority decides downstream
# (decision-router → inbox → governance.decision). No synthetic data — if no rule fires it says so; if the
# model is unavailable it falls back to a templated rationale, loudly.
component_id: ds:airawatdeveloper:skill/air-quality-advisory
kind: skill
version: 0.2.0
provider: ds:airawat:developer
display_name: Air Quality Advisory
entrypoint: run.py
confinement_min: L1
# --- skill contract (INT-0002) ---
domain: air-quality
applies_to_facts: [air.quality]      # the fact surface it reads
rules_domain: air.quality            # governance.rule.applies_to it consumes
metric: pm25                         # primary metric for deterministic evaluation
reasoning: hybrid                    # deterministic | assisted | hybrid
triggers: [manual, schedule, on-fact-change]
instructions: SKILL.md               # persona + method for the narrative step
# --- governed vocabulary ---
reads: [space.aoi, governance.rule, air.quality]
writes: [governance.recommendation]
scopes:
  - { verb: read,  scope: space.aoi }
  - { verb: read,  scope: governance.rule }
  - { verb: read,  scope: air.quality }
  - { verb: write, scope: governance.recommendation }
