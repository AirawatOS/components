component_id: ds:airawatdeveloper:app/settings
kind: app
version: 0.2.0   # 0.2.0: AI model tab — the organisation chooses its model per task (chat, code); sensitive requests stay Airawat-hosted
# 0.1.8: Supply chain tab + generic component Actions (Activate) button
provider: ds:airawatdeveloper:developer
display_name: Settings
entrypoint: index.html
bundle: dist
sandboxed: true
public: false
required_schemas: [platform.component_config, prov.egress]
roles: [platform.tenant-admin]
system: true           # ADR-0092: the tenant's single config console — on every tenant, undeletable (replaces the CORE Connections + Components apps). Tenant-admin gated via `roles`.
