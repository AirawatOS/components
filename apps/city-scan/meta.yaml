# The City Scan VIEWER (kind=app, ADR-0060). The first login onto a City Digital Baseline: it renders the
# L2 cell indicators (built-up, green cover, heat) as H3 hexagons over the AOI and — beside them — the
# city.coverage TRUST REPORT (coverage %, source, confidence, gaps, and the authority class: authoritative |
# open-data | ai-derived). Self-contained (inline SVG, no basemap/tiles — the cell boundaries ARE the map),
# reading only through the host bridge (/bridge/query) over its declared schemas.
component_id: ds:airawat:app/city-scan
kind: app
version: 0.1.0
provider: ds:airawat:developer
display_name: City Scan
entrypoint: index.html
required_schemas: [space.aoi, geo.landcover, geo.terrain, cell.builtup, cell.greencover, cell.heat, city.coverage]
sandboxed: true
# DECLARED APP EGRESS (broker-for-apps): the viewer may reach ONLY these external hosts, and only through the
# host's /bridge/fetch (the CSP still blocks direct calls). Used for the OpenStreetMap tile basemap (© OSM).
egress:
  - { host: tile.openstreetmap.org, rate_per_min: 120, user_agent: "AirawatOS/city-scan (+https://airawat.org; contact@airawat.org)" }
sources:
  - { ref: "ds:airawat:ref/source/osm", host: tile.openstreetmap.org, provides: [viz.basemap] }
