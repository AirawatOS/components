# The City Scan VIEWER (kind=app, ADR-0060). The first login onto a City Digital Baseline: it renders the
# L2 cell indicators (built-up, green cover, heat) as H3 hexagons over the AOI and — beside them — the
# city.coverage TRUST REPORT (coverage %, source, confidence, gaps, and the authority class: authoritative |
# open-data | ai-derived). Self-contained (inline SVG, no basemap/tiles — the cell boundaries ARE the map),
# reading only through the host bridge (/bridge/query) over its declared schemas.
component_id: ds:airawat:app/city-scan
kind: app
version: 0.4.9   # 0.4.9: analyst answers rendered as Markdown (tables, bullets, bold — escaped first), an expand/shrink control, the evidence block only when it adds tags/coverage, Bodhan voice dictation on the question box (a spoken question sends itself; hidden when the tenant has no Bodhan key); EVERY layer is listed only if this tenant has its data. 0.4.8: renamed display_name City Scan → Visualize (ADR-0075 — shared surface named for the capability); component_id unchanged
provider: ds:airawat:developer
display_name: Visualize   # ADR-0075: the shared map surface, named for the capability (was "City Scan"); component_id stays city-scan
entrypoint: index.html
# Declares the governed viz.layer CATALOG — which, per the host bridge, also authorises reading any map layer
# the catalog exposes. So new indicator layers (hydrology, population, buildings…) appear with just a descriptor
# + data — no edit here. space.aoi/geo.landcover/city.coverage are the fixed frame/basemap/trust reads.
required_schemas: [viz.layer, space.aoi, geo.landcover, city.coverage, geo.osm_feature, geo.hydro_feature, air.sensor_reading, geo.building]
sandboxed: true
# DECLARED APP EGRESS (broker-for-apps): the viewer may reach ONLY these external hosts, and only through the
# host's /bridge/fetch (the CSP still blocks direct calls). Basemap tiles (all keyless, cached on disk by the
# bridge): OSM standard, CARTO Dark Matter / Positron (dark + light), and Esri World Imagery (satellite).
egress:
  - { host: tile.openstreetmap.org, rate_per_min: 300, user_agent: "AirawatOS/city-scan (+https://airawat.org; manishsv@gmail.com)" }
  - { host: a.basemaps.cartocdn.com, rate_per_min: 600, user_agent: "AirawatOS/city-scan (+https://airawat.org; manishsv@gmail.com)" }
  - { host: server.arcgisonline.com, rate_per_min: 600, user_agent: "AirawatOS/city-scan (+https://airawat.org; manishsv@gmail.com)" }
sources:
  - { ref: "ds:airawat:ref/source/osm", host: tile.openstreetmap.org, provides: [viz.basemap] }
