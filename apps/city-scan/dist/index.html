<title>City Scan — City Digital Baseline</title>
<link rel="stylesheet" href="./vendor/maplibre-gl.css" onerror="this.remove()">
<style>
  :root{
    --ground:#0e1621; --panel:#16212e; --panel2:#1b2836; --edge:#243545; --edge2:#2f4358;
    --ink:#e8eff6; --muted:#93a6b8; --dim:#6b7f92; --accent:#38bdf8;
    --auth-open:#34d399; --auth-ai:#fbbf24; --auth-real:#60a5fa;
    font-synthesis:none;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--ground);color:var(--ink);
    font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;overflow:hidden}
  .mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-variant-numeric:tabular-nums}
  .num{font-variant-numeric:tabular-nums}
  header{padding:18px 22px 18px 84px;border-bottom:1px solid var(--edge);display:flex;align-items:baseline;gap:16px;flex-wrap:wrap}
  /* ^ left pad clears the app-host shell's floating "✕ Exit" pill (top-left chrome) */
  header h1{margin:0;font-size:18px;font-weight:650;letter-spacing:-.01em}
  header h1 b{color:var(--accent);font-weight:650}
  .sub{color:var(--muted);font-size:12.5px}
  .sub .dot{color:var(--dim);margin:0 7px}
  .grid{display:grid;--lc:212px;--rc:340px;grid-template-columns:var(--lc) 1fr var(--rc);
    grid-template-rows:1fr;gap:0;height:calc(100% - 63px);transition:grid-template-columns .22s ease}
  .grid.lc0{--lc:0}.grid.rc0{--rc:0}
  aside{padding:18px 16px;border-right:1px solid var(--edge);overflow:auto;transition:padding .2s,opacity .15s}
  .grid.lc0 aside{padding:0;opacity:0;pointer-events:none;border:none}
  .railtog{position:absolute;top:12px;z-index:6;width:22px;height:36px;border:1px solid var(--edge2);
    background:#0e1c2ad9;color:var(--muted);border-radius:8px;cursor:pointer;font-size:15px;line-height:1;
    display:flex;align-items:center;justify-content:center;transition:.13s}
  .railtog:hover{color:var(--ink);border-color:var(--accent)}
  .railtog.l{left:10px}.railtog.r{right:10px}
  .rail-h{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--dim);margin:0 0 10px}
  .layers{display:flex;flex-direction:column;gap:7px}
  .lgrp{font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--dim);font-weight:700;margin:13px 0 2px}
  .lgrp:first-child{margin-top:0}
  .layer-btn{display:flex;align-items:center;gap:10px;padding:9px 11px;border:1px solid var(--edge);
    border-radius:9px;background:var(--panel);color:var(--ink);cursor:pointer;text-align:left;transition:.13s;width:100%}
  .layer-btn:hover{border-color:var(--edge2);background:var(--panel2)}
  .layer-btn.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
  .swatch{width:12px;height:12px;border-radius:3px;flex:none}
  .layer-btn .lb{flex:1}
  .layer-btn .lb b{display:block;font-weight:600;font-size:13.5px}
  .layer-btn .lb span{color:var(--muted);font-size:11.5px}
  .legend{margin-top:22px}
  .ovsec{margin-top:22px}
  .ovbtns{display:flex;flex-direction:column;gap:7px}
  .ovbtn{display:flex;align-items:center;gap:9px;padding:8px 11px;border:1px solid var(--edge);border-radius:9px;
    background:var(--panel);color:var(--muted);cursor:pointer;text-align:left;font-size:13px;transition:.13s}
  .ovbtn:hover{border-color:var(--edge2)}
  .ovbtn.on{color:var(--ink);border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
  .ovbtn .dotb{width:10px;height:10px;border-radius:50%;flex:none;opacity:.45}
  .ovbtn.on .dotb{opacity:1}
  .bar{height:10px;border-radius:5px;margin:8px 0 5px}
  .legend .ends{display:flex;justify-content:space-between;color:var(--muted);font-size:11.5px}
  .map-wrap{position:relative;overflow:hidden;background:#0b1017}
  #map{position:absolute;inset:0}
  #deck canvas{outline:none}
  .zoomctl{position:absolute;left:10px;bottom:10px;z-index:6;display:flex;flex-direction:column;gap:4px}
  .zoomctl button{width:30px;height:30px;border:1px solid var(--edge2);background:#0e1c2ad9;color:var(--ink);
    border-radius:8px;cursor:pointer;font-size:17px;line-height:1;display:flex;align-items:center;justify-content:center}
  .zoomctl button:hover{border-color:var(--accent);color:var(--accent)}
  .zoomctl button.rst{font-size:13px}
  .tip{position:absolute;pointer-events:none;background:#0a1320f2;border:1px solid var(--edge2);z-index:7;
    border-radius:7px;padding:7px 9px;font-size:12px;opacity:0;transition:.06s;transform:translate(8px,8px);white-space:nowrap}
  .tip b{color:var(--accent)}
  .attrib{position:absolute;right:6px;bottom:6px;background:#0a1320cc;border:1px solid var(--edge);z-index:6;
    border-radius:5px;padding:2px 8px;font-size:10.5px;color:var(--muted)}
  .trust{padding:18px 16px;border-left:1px solid var(--edge);overflow:auto;transition:padding .2s,opacity .15s}
  .grid.rc0 .trust{padding:0;opacity:0;pointer-events:none;border:none}
  .cov{border:1px solid var(--edge);border-radius:10px;padding:12px 13px;margin-bottom:10px;background:var(--panel)}
  .cov .top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:9px}
  .cov .noun{font-weight:600;font-size:13px}
  .pill{font-size:10.5px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;
    padding:3px 8px;border-radius:999px;white-space:nowrap}
  .pill.open{background:#0c2a20;color:var(--auth-open);border:1px solid #1c4a38}
  .pill.ai{background:#2c220a;color:var(--auth-ai);border:1px solid #4d3d12}
  .pill.real{background:#0f2340;color:var(--auth-real);border:1px solid #244a78}
  .covbar{height:7px;border-radius:4px;background:#0c1520;overflow:hidden;margin:2px 0 8px}
  .covbar>i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,#2b6cb0,var(--accent))}
  .kv{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);padding:1.5px 0}
  .kv b{color:var(--ink);font-weight:600}
  .gaps{margin-top:8px;font-size:11.5px;color:#e0b877;border-top:1px dashed var(--edge);padding-top:7px}
  .gaps .g{display:flex;gap:6px}.gaps .g::before{content:"△";color:#b98a3a}
  /* --- rolled-up trust cards --- */
  .trustsum{font-size:12px;color:var(--muted);margin:0 0 11px}.trustsum b{font-weight:700}
  .cov .top{cursor:pointer}
  .cov .cvx{margin-left:2px;color:var(--dim);font-size:11px;transition:transform .15s}
  .cov.open .cvx{transform:rotate(180deg)}
  .pill.tg-ok{background:#0f2417;color:#3fb950;border:1px solid #1c3a25}
  .pill.tg-mid{background:#2c220a;color:#d29922;border:1px solid #4d3d12}
  .pill.tg-low{background:#3d1418;color:#ff7b72;border:1px solid #6e2b30}
  .pill.na{background:#161b22;color:var(--muted);border:1px solid var(--edge)}
  .tbrow{display:flex;gap:6px;flex-wrap:wrap;margin:2px 0 8px}
  .tb{display:flex;flex-direction:column;gap:1px;background:#0c1520;border:1px solid var(--edge);border-radius:7px;padding:5px 9px;flex:1;min-width:70px}
  .tbk{font-size:9px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
  .tbv{font-size:12.5px;font-weight:700}
  .tbv.ok{color:#3fb950}.tbv.mid{color:#d29922}.tbv.low{color:#ff7b72}.tbv.na{color:var(--muted)}
  .covsub{font-size:12px;color:var(--muted)}
  .cov-empty{opacity:.65}
  .covdetail{display:none;margin-top:9px;border-top:1px dashed var(--edge);padding-top:9px}
  .cov.open .covdetail{display:block}
  .trail{margin:2px 0 10px}
  .trn{display:flex;gap:9px;align-items:flex-start}
  .trdot{flex:none;width:9px;height:9px;border-radius:50%;background:var(--accent);margin-top:3px;box-shadow:0 0 0 3px #12233a}
  .trline{width:1px;height:11px;background:var(--edge);margin:1px 0 1px 4px}
  .trt{font-size:12.5px;font-weight:600;color:var(--ink)} .trs{font-size:10.5px;color:var(--muted)}
  footer{border-top:1px solid var(--edge);padding:9px 18px;color:var(--dim);font-size:11.5px}
  .empty{padding:40px;color:var(--muted);text-align:center}
  .loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--muted);z-index:5}
  /* cell drill-down detail panel (click a hex to zoom in on it) */
  .cellpanel{position:absolute;left:14px;top:56px;z-index:7;width:224px;background:#0c1622f2;
    border:1px solid var(--edge2);border-radius:11px;padding:12px 13px;box-shadow:0 10px 34px #0007;backdrop-filter:blur(3px)}
  .cptop{display:flex;align-items:center;justify-content:space-between;font-size:11px;letter-spacing:.09em;
    text-transform:uppercase;color:var(--dim);margin-bottom:2px}
  .cptop .cpbtns{display:flex;align-items:center;gap:2px}
  .cptop button{background:none;border:none;color:var(--muted);font-size:16px;line-height:1;cursor:pointer;padding:0 3px}
  .cptop button#cpx{font-size:19px}
  .cptop button:hover{color:var(--accent)}
  .cellpanel.collapsed{width:auto;min-width:150px;padding-bottom:10px}
  .tgl{font-size:10.5px;border:1px solid var(--edge2);background:#0e1c2a;color:var(--muted);border-radius:6px;
    padding:2px 8px;cursor:pointer;margin-left:8px;white-space:nowrap}
  .tgl:hover{border-color:var(--accent)}
  .tgl.on{color:var(--accent);border-color:var(--accent)}
  .cellpanel .kv span:last-child{display:flex;align-items:center}
  .cellpanel .cph{font-size:12px;color:var(--accent);margin-bottom:9px}
  .cellpanel .kv{padding:2.5px 0;font-size:12.5px}
  .cellpanel .kv.sep{border-top:1px dashed var(--edge);margin-top:6px;padding-top:7px}
  .drillhint{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);z-index:6;pointer-events:none;
    background:#0a1320d9;border:1px solid var(--edge2);border-radius:999px;padding:4px 13px;color:var(--muted);
    font-size:11.5px;opacity:0;transition:opacity .3s}
  .drillhint.show{opacity:1}
  /* lazy-load busy pill (shown while a layer/overlay fetches on demand) */
  .busy{position:absolute;left:50%;top:16px;transform:translateX(-50%);z-index:8;pointer-events:none;
    background:#0c1622f2;border:1px solid var(--edge2);border-radius:999px;padding:6px 15px;color:var(--muted);
    font-size:12px;box-shadow:0 8px 24px #0006}
  .busy::before{content:"";display:inline-block;width:9px;height:9px;margin-right:8px;vertical-align:-1px;
    border:2px solid var(--edge2);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  /* TIME SCRUBBER — animate a temporal layer over its time axis (forecast series / dated snapshots) */
  .scrubber{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);z-index:7;width:min(560px,80%);
    display:flex;align-items:center;gap:12px;background:#0c1622f2;border:1px solid var(--edge2);border-radius:12px;
    padding:9px 14px;box-shadow:0 10px 34px #0007;backdrop-filter:blur(4px)}
  .scrubber button{flex:none;width:30px;height:30px;border-radius:50%;border:none;background:var(--accent);
    color:#04121e;font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center}
  .scrubber button:hover{filter:brightness(1.1)}
  .scrubber input[type=range]{flex:1;accent-color:var(--accent);cursor:pointer}
  .scrubber .tlab{flex:none;text-align:right;min-width:104px}
  .scrubber .tlab b{display:block;font-size:12.5px;color:var(--ink);font-variant-numeric:tabular-nums}
  .scrubber .tlab span{font-size:10.5px;color:var(--dim)}
</style>

<header>
  <h1><b>City Scan</b> — City Digital Baseline</h1>
  <div class="sub" id="sub">loading…</div>
</header>

<div class="grid" id="app">
  <aside>
    <p class="rail-h">Layers</p>
    <div class="layers" id="layers"></div>
    <div class="legend" id="legend" hidden>
      <p class="rail-h" style="margin-bottom:4px">Legend</p>
      <div class="bar" id="legbar"></div>
      <div class="ends"><span id="legmin"></span><span id="legmax"></span></div>
    </div>
    <div class="ovsec" id="ovsec" hidden>
      <p class="rail-h">Overlays</p>
      <div class="ovbtns">
        <button class="ovbtn on" id="ovwater" hidden><span class="dotb" style="background:#60a5fa"></span>Drainage</button>
        <button class="ovbtn on" id="ovroads" hidden><span class="dotb" style="background:#e2e8f0"></span>Roads</button>
        <button class="ovbtn" id="ovfac" hidden><span class="dotb" style="background:#ef4444"></span>Facilities</button>
      </div>
    </div>
  </aside>

  <div class="map-wrap">
    <div id="map"></div>
    <div class="loading" id="mapload">initialising map…</div>
    <div class="cellpanel" id="cellpanel" hidden></div>
    <div class="drillhint" id="drillhint">click a cell to drill in · Esc to exit</div>
    <div class="scrubber" id="scrubber" hidden></div>
    <div class="busy" id="busy" hidden></div>
    <div class="tip" id="tip"></div>
    <button class="railtog l" id="togL" title="Show/hide layers">‹</button>
    <button class="railtog r" id="togR" title="Show/hide report">›</button>
    <div class="zoomctl"><button id="tilt" class="rst" title="Toggle 2.5D view — extruded hex towers; ctrl/right-drag to orbit">⬢</button><button id="zin" title="Zoom in">+</button><button id="zout" title="Zoom out">−</button><button id="zreset" class="rst" title="Reset view">⌖</button></div>
    <div id="opacctl" style="position:absolute;top:12px;left:44px;z-index:8;display:flex;align-items:center;gap:7px;background:#0e1c2ae6;border:1px solid var(--edge2);border-radius:9px;padding:5px 11px;box-shadow:0 2px 10px #0006">
      <span style="font-size:12px;opacity:.75" title="Layer opacity">◐</span>
      <input id="opac" type="range" min="15" max="100" value="60" style="width:120px;accent-color:var(--accent);cursor:pointer" title="Layer transparency — lower to see the map + places underneath">
      <span id="opacval" style="font-size:10.5px;color:var(--dim);min-width:30px">60%</span></div>
    <div class="attrib" id="attrib">Basemap © OpenStreetMap contributors</div>
  </div>

  <div class="trust">
    <p class="rail-h">Coverage &amp; trust report</p>
    <div id="cov"></div>
  </div>
</div>

<!-- deck.gl (GPU map): core+layers+geo-layers bundled into one self-contained IIFE (esbuild), self-hosted
     under the sandbox CSP (script-src 'self'). window.deck exposes Deck/MapView/H3HexagonLayer/TileLayer/… -->
<script src="./vendor/deck-bundle.min.js"></script>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
// color_scale (viz.layer enum) → a MULTI-STOP perceptual ramp (wide hue range → towers/cells differentiate
// clearly, not shades of one colour). New scale = one entry; new LAYER = zero app edits.
const RAMPS={
  viridis:[[68,1,84],[59,82,139],[33,145,140],[92,200,99],[253,231,37]],   // purple→blue→teal→green→yellow
  turbo:  [[48,18,59],[54,124,215],[30,196,163],[166,220,50],[249,150,50],[152,15,10]],
  reds:   [[38,22,16],[103,37,28],[176,58,42],[227,120,64],[255,214,150]],
  blues:  [[8,29,49],[16,73,115],[28,130,182],[70,175,230],[176,224,252]],
  aqi:    [[38,138,66],[190,204,50],[245,170,50],[230,72,58],[126,40,120]],  // green→yellow→orange→red→purple
  greys:  [[26,32,40],[74,86,99],[136,150,163],[208,218,230]]};
const EMPTY_RGBA=[28,34,44,110];   // a TRUE-zero cell (absence) → muted slate, recedes as background vs low-but-present
const GAMMA=0.55;                  // perceptual curve: spread skewed distributions (few dense cells) across the range
const clamp01=t=>Math.max(0,Math.min(1,t));
function rampColor(stops,t){       // interpolate a multi-stop ramp at t∈[0,1]
  t=clamp01(t); const n=stops.length-1, x=t*n, i=Math.min(n-1,Math.floor(x)), f=x-i, a=stops[i], b=stops[i+1];
  return [Math.round(a[0]+(b[0]-a[0])*f), Math.round(a[1]+(b[1]-a[1])*f), Math.round(a[2]+(b[2]-a[2])*f)];
}
const rampCSS=stops=>`linear-gradient(90deg,${stops.map((c,i)=>`rgb(${c[0]},${c[1]},${c[2]}) ${Math.round(i/(stops.length-1)*100)}%`).join(",")})`;
const dget=(o,path)=>String(path||"value").split(".").reduce((v,k)=>(v==null?v:v[k]),o);
const fmtFor=u=> u==="%"?(v=>Math.round(v*100)+"%"): u==="°C"?(v=>v.toFixed(1)+"°"): u==="m"?(v=>Math.round(v)+" m")
              : (v=>(Math.round(v*100)/100)+(u?(" "+u):""));
let APPID="city-scan";

async function bridge(path,body){
  const r=await fetch(path,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
  return r.json();
}
async function q(schema){
  try{ const d=await bridge("/bridge/query",{app_id:APPID,schema,limit:50000});
       return (d.results||d.objects||d||[]).map(x=>x.object||x); }catch(e){ return []; }
}
async function qf(schema,filter){                              // server-side filtered query (e.g. one cell's footprints)
  try{ const d=await bridge("/bridge/query",{app_id:APPID,schema,filter,limit:20000});
       return (d.results||d.objects||d||[]).map(x=>x.object||x); }catch(e){ return []; }
}

let DATA={}, LAYERS=[], active=null, deckgl=null, view=null, mode3d=false, showRoads=true, showWater=true, drillCell=null;
let tIdx=0, tPlaying=false, tTimer=null;   // TIME SCRUBBER: current frame index, playing?, animation timer
let drillBuildings=[], footLoading=false, showBuildings=true, panelCollapsed=false, showFacilities=false, showSensors=false;   // drilled cell state + overlays
let layerAlpha=0.6;    // user-controllable choropleth opacity (slider) — lower ⇒ basemap + places show through
const ELEV_MAX=5200;   // metres a max-value hex rises to in 2.5D (extruded towers) — taller ⇒ value differences read clearly
const NOMINAL_H=9;     // Open Buildings carries no height → extrude footprints to a nominal ~3-storey height
// geo.facility category → marker colour (schools/hospitals/police-fire/govt/utilities/…)
const FCOL={healthcare:[239,68,68],education:[59,130,246],emergency:[249,115,22],government:[168,85,247],
            utility:[234,179,8],transport:[6,182,212],religious:[236,72,153],commerce:[34,197,94],other:[148,163,184]};
const fcol=c=>FCOL[c]||FCOL.other;

// ---- LAZY LOADING: first paint fetches only the active layer + coverage; every other choropleth loads on
//      click, and the heavy vector overlays (66k roads / drainage / facilities) load only when toggled or drilled.
let SCOPE=null;   // union AOI bbox (module scope so the lazy loaders can clip cross-tenant strays too)
const _M=0.03, inB=p=> !SCOPE||!p||(p[0]>=SCOPE[0]-_M&&p[0]<=SCOPE[2]+_M&&p[1]>=SCOPE[1]-_M&&p[1]<=SCOPE[3]+_M);
const firstpt=g=>{let c=(g||{}).coordinates;while(Array.isArray(c)&&c.length&&Array.isArray(c[0]))c=c[0];return c;};

function parseCells(rows,L){                                    // rows → H3 hexagons, with GENERIC temporal detection
  // A layer animates when its DATA carries multiple time frames — detected generically, no per-layer code.
  // Two shapes are supported, both driven by the layer's declared value_field (L.vf):
  //   (A) EMBEDDED SERIES  — one row per cell carrying o.series=[{t,<field>}] (e.g. hourly forecast).
  //   (B) DATED SNAPSHOTS  — many rows per cell, one per observed_at (e.g. air.quality per-hour). Grouped here.
  const vf=L.vf;
  const geom=o=>{ const g=o.cell_ref||o.space||{}; return {h3:g.h3_id||g.h3, c:g.centroid, b:g.boundary}; };
  // ---- (A) embedded per-cell series ------------------------------------------------------------
  if(rows.some(o=>Array.isArray(o.series)&&o.series.length)){
    const cells=rows.map(o=>{ const g=geom(o); return {h3:g.h3,c:g.c,b:g.b,v:dget(o,vf),series:o.series}; })
      .filter(c=>c.h3&&typeof c.v==="number"&&inB(c.c));
    const dd={type:"hex",rows:cells, lo:cells.length?Math.min(...cells.map(c=>c.v)):0, hi:cells.length?Math.max(...cells.map(c=>c.v)):1};
    const ws=cells.find(c=>Array.isArray(c.series)&&c.series.length);
    if(ws){ const sk=(vf in ws.series[0]) ? vf : Object.keys(ws.series[0]).find(k=>k!=="t"&&typeof ws.series[0][k]==="number");
      L.temporal=true; L.times=ws.series.map(s=>s.t); L.sfield=sk;
      let hi=0; for(const c of cells){ if(Array.isArray(c.series)) for(const s of c.series){ const v=s[sk]; if(typeof v==="number"&&v>hi) hi=v; } }
      dd.thi=hi||1; }
    return dd;
  }
  // ---- (B) dated snapshots → group records by observed_at into frames ---------------------------
  let times=[...new Set(rows.map(o=>o.observed_at).filter(Boolean))].sort();
  if(times.length>1){
    if(times.length>MAX_FRAMES) times=times.slice(-MAX_FRAMES);   // bound client memory — keep the most recent frames

async function load(){

  APPID=cfg.app_id||"city-scan";
  const aois=await q("space.aoi"); const aoi=aois[0]||{};

  for(const a of aois){ const bb=a.bbox; if(Array.isArray(bb)&&bb.length===4)
    SB=SB?[Math.min(SB[0],bb[0]),Math.min(SB[1],bb[1]),Math.max(SB[2],bb[2]),Math.max(SB[3],bb[3])]:bb.slice(); }
  SCOPE=SB;
  const GEOM_LAYERS=["geo.building","geo.facility"];             // drill/overlay geometry layers — NOT choropleths
  const descs=(await q("viz.layer")).filter(d=>d&&d.render==="map"&&d.enabled!==false&&d.source_schema&&d.value_field
                                     &&!GEOM_LAYERS.includes(d.source_schema))

  const seen={}, specs=[];

    specs.push({key:d.source_schema,label:d.label||d.source_schema,desc:d.description||"",vf:d.value_field,

}

      html+=`<button class="layer-btn ${on?"on":""}" data-k="${L.key}">
        <span class="swatch" style="background:${rampCSS(L.ramp).replace('90deg','135deg')}"></span>
        <span class="lb"><b>${esc(L.label)}</b>${sub?`<span>${sub}</span>`:""}</span></button>`;
    }
  }
  $("layers").innerHTML=html;
  document.querySelectorAll('.layer-btn[data-k]').forEach(b=>b.onclick=async()=>{
    active=(active===b.dataset.k)?null:b.dataset.k; stopPlay(); tIdx=0;   // click the active layer again → hide it (basemap only)
    const L=LAYERS.find(l=>l.key===active);
    if(L && !DATA.data[L.key]){ setBusy("Loading "+L.label+"…"); render(); await ensureLayer(L); setBusy(null); }  // lazy fetch on first select
    drawLayers(); render();
  });
  document.querySelectorAll('.layer-btn[data-ov="sensors"]').forEach(b=>b.onclick=async()=>{
    showSensors=!showSensors; if(showSensors){ setBusy("Loading air sensors…"); await ensureOverlay("sensors"); setBusy(null); } drawLayers(); render();
  });
}
// ── Trust roll-up: turn a raw city.coverage record into human bands + a headline + a source trail ──────
const NOUN_LABEL={'cell.heat':'Heat','cell.builtup':'Built-up','cell.greencover':'Green cover',
 'geo.landcover':'Land cover','environment.lst_observation':'Land-surface temp','cell.rainfall':'Rainfall',
 'cell.weather_forecast':'Weather forecast','cell.hydrology':'Hydrology','geo.terrain':'Terrain',
 'geo.building':'Building footprints','cell.buildings':'Buildings','geo.facility':'Critical facilities',
 'demographics.population':'Population','cell.population':'Population','geo.hydro_feature':'Rivers & water'};
const SRCTYPE={authoritative:{t:'Official',c:'real'},'open-data':{t:'Open data',c:'open'},'ai-derived':{t:'AI estimate',c:'ai'}};
const SRCNAME={'open-meteo':'Open-Meteo','esa-worldcover':'ESA WorldCover','osm':'OpenStreetMap',
 'dynamic-world':'Google Dynamic World','ghsl':'GHSL','copernicus-dem':'Copernicus DEM','openaq':'OpenAQ','cpcb':'CPCB'};
function nounLabel(n){return NOUN_LABEL[n]||String(n||'').split('.').pop().replace(/_/g,' ');}
function srcName(s){if(!s)return null;const k=String(s).split('/').pop();return SRCNAME[k]||k;}
function layerKind(c){
  if((c.gaps||[]).some(g=>/no data/i.test(g))) return 'empty';
  if(/observation$|^environment\.|^met\./.test(c.layer_noun||'')||(c.gaps||[]).some(g=>/input feed/i.test(g))) return 'input';
  return 'layer';
}
function bandCov(p){p=p||0;return p>=90?{b:'Full',c:'ok'}:p>=40?{b:'Partial',c:'mid'}:p>0?{b:'Sparse',c:'low'}:{b:'None',c:'na'};}
function bandFresh(d){if(!d)return null;const t=Date.parse(String(d).slice(0,10));if(isNaN(t))return null;
  const days=(Date.now()-t)/864e5;return days<=180?{b:'Fresh',c:'ok'}:days<=760?{b:'Recent',c:'mid'}:{b:'Stale',c:'low'};}
function bandConf(c){if(c.authority&&c.authority!=='ai-derived')return{b:'High',c:'ok'};
  const v=c.confidence;if(v==null)return{b:'—',c:'na'};return v>=0.7?{b:'High',c:'ok'}:v>=0.4?{b:'Medium',c:'mid'}:{b:'Low',c:'low'};}
function trustOf(c){
  const cov=bandCov(c.coverage_pct),fresh=bandFresh(c.freshness||c.assessed_at),conf=bandConf(c);
  const auth={authoritative:3,'open-data':2,'ai-derived':1}[c.authority]||1, W={ok:2,mid:1,low:0,na:0};
  let s=auth+W[cov.c]+(fresh?({ok:1,mid:.5,low:0})[fresh.c]:.5)+({ok:1,mid:.5,low:0,na:.5})[conf.c];
  let trust=s>=5.5?{b:'Good',c:'ok'}:s>=3.5?{b:'Fair',c:'mid'}:{b:'Weak',c:'low'};
  if(cov.b==='None')trust={b:'Weak',c:'low'};
  return {cov,fresh,conf,trust};
}
function trailNodes(c){
  const nodes=[{t:nounLabel(c.layer_noun),sub:(SRCTYPE[c.authority]||{}).t||'layer'}];
  const viaG=(c.gaps||[]).find(g=>/inherited via/i.test(g));
  if(viaG){const m=viaG.match(/via\s+([a-z0-9_.]+)/i);if(m&&m[1]!=='origin'&&m[1]!==c.layer_noun)nodes.push({t:nounLabel(m[1]),sub:'derived from'});}
  if(c.source_ref)nodes.push({t:srcName(c.source_ref),sub:'source'+(c.freshness?' · '+String(c.freshness).slice(0,10):'')});
  return nodes;
}
function drawTrust(){
  const cov=(DATA.coverage||[]).slice().sort((a,b)=>(a.layer_noun>b.layer_noun?1:-1));
  if(!cov.length){$("cov").innerHTML='<div class="empty">No coverage report yet.</div>';return;}
  const real=cov.filter(c=>layerKind(c)==='layer');
  const good=real.filter(c=>trustOf(c).trust.b==='Good').length;
  $("cov").innerHTML=(real.length?`<div class="trustsum">${good} of ${real.length} map layers rated <b class="tbv ok" style="font-weight:700">Good</b> · click a layer for its data trail</div>`:'')
    + cov.map(c=>{
    const kind=layerKind(c), name=nounLabel(c.layer_noun), st=SRCTYPE[c.authority];
    if(kind==='empty') return `<div class="cov cov-empty"><div class="top" style="cursor:default"><span class="noun">${esc(name)}</span><span class="pill na">no data</span></div>
      <div class="covsub">Not built for this city yet — connect its key/file in City Setup, then re-build.</div></div>`;
    const T=trustOf(c), pct=Math.round(c.coverage_pct||0);
    const badges = kind==='input'
      ? `<span class="tb"><span class="tbk">Role</span><span class="tbv na">Input feed</span></span>
         <span class="tb"><span class="tbk">Freshness</span><span class="tbv ${T.fresh?T.fresh.c:'na'}">${T.fresh?T.fresh.b:'—'}</span></span>`
      : `<span class="tb"><span class="tbk">Confidence</span><span class="tbv ${T.conf.c}">${T.conf.b}</span></span>
         <span class="tb"><span class="tbk">Freshness</span><span class="tbv ${T.fresh?T.fresh.c:'na'}">${T.fresh?T.fresh.b:'—'}</span></span>
         <span class="tb"><span class="tbk">Coverage</span><span class="tbv ${T.cov.c}">${T.cov.b}</span></span>`;
    const head = kind==='input' ? `<span class="pill ${st?st.c:'ai'}">${esc(st?st.t:'input')}</span>`
                                : `<span class="pill tg-${T.trust.c}">${T.trust.b}</span>`;
    const trail=trailNodes(c).map((n,j,a)=>`<div class="trn"><span class="trdot"></span><div><div class="trt">${esc(n.t)}</div><div class="trs">${esc(n.sub)}</div></div></div>${j<a.length-1?'<div class="trline"></div>':''}`).join('');
    return `<div class="cov"><div class="top"><span class="noun">${esc(name)}</span>${head}<span class="cvx">▾</span></div>
      <div class="tbrow">${badges}</div>
      ${kind==='layer'?`<div class="covbar"><i style="width:${pct}%"></i></div>`:''}
      <div class="covdetail">
        <div class="trail">${trail}</div>
        <div class="kv"><span>Source type</span><b>${esc(st?st.t:'—')}</b></div>
        ${kind==='layer'?`<div class="kv"><span>Coverage</span><b class="num">${pct}% of AOI cells</b></div>`:''}
        <div class="kv"><span>Confidence score</span><b class="num">${c.confidence==null?'—':c.confidence}</b></div>
        <div class="kv"><span>As of</span><b class="num">${esc(String(c.freshness||c.assessed_at||'—').slice(0,10))}</b></div>
        ${(c.gaps||[]).length?`<div class="gaps">${(c.gaps||[]).map(g=>`<div class="g">${esc(g)}</div>`).join('')}</div>`:''}
      </div></div>`;}).join("");
  $("cov").querySelectorAll('.cov').forEach(el=>{const top=el.querySelector('.top');
    if(top&&el.querySelector('.covdetail')) top.onclick=()=>el.classList.toggle('open');});
}
function fitView(bbox){
  const [w,s,e,n]=bbox, lon=(w+e)/2, lat=(s+n)/2;
  const span=Math.max(e-w,(n-s))||0.1, zoom=Math.max(3,Math.min(15,Math.log2(360/span)));
  return {longitude:lon,latitude:lat,zoom,pitch:0,bearing:0};
}

(async function(){
  if(!window.deck||!deck.Deck){ $("mapload").textContent="map engine failed to load"; return; }
  DATA=await load();
  active=(LAYERS[0]||{}).key;
  const fresh=(DATA.coverage||[]).map(c=>c.freshness||c.assessed_at).filter(Boolean).sort().pop();
  $("sub").innerHTML=`${esc((DATA.aoi||{}).name||"AOI")}<span class="dot">·</span>${LAYERS.length} indicator layers`
    +`<span class="dot">·</span>${(DATA.coverage||[]).length} assessed<span class="dot">·</span>as of ${esc((fresh||"—").slice(0,10))}`;
  if(!LAYERS.length){ $("mapload").remove(); $("map").innerHTML='<div class="empty">No baseline data for this workspace yet.</div>'; drawTrust(); return; }
  view=fitView(DATA.aoi.bbox||DATA.scope||[72.8,18.9,72.99,19.28]);
  deckgl=new deck.Deck({
    parent:$("map"), initialViewState:view, controller:true, useDevicePixels:false,
    views:[new deck.MapView({repeat:false})],
    onViewStateChange:({viewState})=>{ view=viewState; },
    onHover:info=>tip(info),
    getCursor:({isDragging})=>isDragging?"grabbing":"grab",
    layers:[]
  });
  $("mapload").remove();
  drawLayers(); drawTrust(); render();                        // FIRST PAINT — instant (only the active layer is loaded)
  // Vector overlays: always available; their (heavy) geometry loads lazily. Default drainage+roads on, facilities off.
  $("ovsec").hidden=false; $("ovwater").hidden=false; $("ovroads").hidden=false; $("ovfac").hidden=false;   // Air Sensors readings live in the Air Quality layer group, not here
  $("ovwater").classList.toggle("on",showWater); $("ovroads").classList.toggle("on",showRoads); $("ovfac").classList.toggle("on",showFacilities);
  $("ovwater").onclick=async()=>{ showWater=!showWater; $("ovwater").classList.toggle("on",showWater); if(showWater) await ensureOverlay("water"); render(); };
  $("ovroads").onclick=async()=>{ showRoads=!showRoads; $("ovroads").classList.toggle("on",showRoads); if(showRoads){ setBusy("Loading roads…"); await ensureOverlay("roads"); setBusy(null); } render(); };
  $("ovfac").onclick=async()=>{ showFacilities=!showFacilities; $("ovfac").classList.toggle("on",showFacilities); if(showFacilities){ setBusy("Loading facilities…"); await ensureOverlay("facilities"); setBusy(null); } render(); };
  // background-load the default-on overlays AFTER first paint so they appear without blocking (drainage is light; roads are 66k)
  ensureOverlay("water").then(render);
  ensureOverlay("roads").then(render);
  const setV=v=>{ view=v; deckgl.setProps({initialViewState:v}); };
  $("zin").onclick=()=>setV({...view,zoom:Math.min(19,view.zoom+0.6),transitionDuration:150});
  $("zout").onclick=()=>setV({...view,zoom:Math.max(3,view.zoom-0.6),transitionDuration:150});
  $("zreset").onclick=()=>setV({...fitView(DATA.aoi.bbox||DATA.scope),pitch:mode3d?50:0,transitionDuration:250});
  if($("opac")) $("opac").oninput=e=>{ layerAlpha=Math.max(0.05,(+e.target.value)/100); if($("opacval"))$("opacval").textContent=e.target.value+"%"; render(); };   // live choropleth transparency
  $("tilt").onclick=()=>{                                       // 2D ⇄ 2.5D: tilt the camera + extrude the hexes into towers
    mode3d=!mode3d;
    $("tilt").style.color=mode3d?"var(--accent)":""; $("tilt").style.borderColor=mode3d?"var(--accent)":"";
    view={...view, pitch:mode3d?50:0, bearing:mode3d?view.bearing:0};
    deckgl.setProps({initialViewState:{...view,transitionDuration:450}});
    render();                                                  // re-emit layers with extruded:mode3d (updateTriggers)
  };
  const g=$("app");
  $("togL").onclick=()=>{g.classList.toggle("lc0");$("togL").textContent=g.classList.contains("lc0")?"›":"‹";};
  $("togR").onclick=()=>{g.classList.toggle("rc0");$("togR").textContent=g.classList.contains("rc0")?"‹":"›";};
  document.addEventListener("keydown",e=>{ if(e.key==="Escape") exitDrill(); });   // Esc leaves the drilled cell
  const hint=$("drillhint"); hint.classList.add("show"); setTimeout(()=>hint.classList.remove("show"),4200);
})();
</script>
