<title>Visualize</title>
<link rel="stylesheet" href="./vendor/maplibre-gl.css" onerror="this.remove()">
<style>
  :root{                                   /* DARK — default; theme flows in via [data-theme] (ADR-0077) */
    --ground:#0e1621; --panel:#16212e; --panel2:#1b2836; --edge:#243545; --edge2:#2f4358;
    --ink:#e8eff6; --muted:#93a6b8; --dim:#6b7f92; --accent:#38bdf8;
    --auth-open:#34d399; --auth-ai:#fbbf24; --auth-real:#60a5fa;
    font-synthesis:none;
  }
  :root[data-theme="light"]{
    --ground:#f6f8fa; --panel:#ffffff; --panel2:#eef2f6; --edge:#d6dce3; --edge2:#c2cad3;
    --ink:#161c24; --muted:#586372; --dim:#7a8696; --accent:#0a6fb0;
    --auth-open:#1a7f37; --auth-ai:#9a6700; --auth-real:#0a5cc2;
  }
  :root[data-theme="high-contrast"]{
    --ground:#000000; --panel:#000000; --panel2:#0a0a0a; --edge:#ffffff; --edge2:#ffffff;
    --ink:#ffffff; --muted:#f2f2f2; --dim:#e0e0e0; --accent:#ffd400;
    --auth-open:#4ce07a; --auth-ai:#ffd400; --auth-real:#8cc4ff;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--ground);color:var(--ink);
    font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;overflow:hidden}
  .mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-variant-numeric:tabular-nums}
  .num{font-variant-numeric:tabular-nums}
  header{padding:18px 22px 18px 84px;border-bottom:1px solid var(--edge);display:flex;align-items:baseline;gap:16px;flex-wrap:wrap}
  /* ^ left pad clears the app-host shell's floating "✕ Exit" pill (top-left chrome) */
  header h1{margin:0;font-size:18px;font-weight:650;letter-spacing:-.01em}
  header h1 b{color:var(--accent);font-weight:650}
  .sub{color:var(--muted);font-size:12.5px}
  .sub .dot{color:var(--dim);margin:0 7px}
  .grid{display:grid;--lc:212px;--rc:340px;grid-template-columns:var(--lc) 1fr var(--rc);
    grid-template-rows:1fr;gap:0;height:calc(100% - 63px);transition:grid-template-columns .22s ease}
  .grid.lc0{--lc:0}.grid.rc0{--rc:0}
  aside{padding:18px 16px;border-right:1px solid var(--edge);overflow:hidden;display:flex;flex-direction:column;transition:padding .2s,opacity .15s}
  .layerscroll{flex:1 1 auto;overflow:auto;min-height:0;margin:0 -4px;padding:0 4px}
  .grid.lc0 aside{padding:0;opacity:0;pointer-events:none;border:none}
  .railtog{position:absolute;top:12px;z-index:6;width:22px;height:36px;border:1px solid var(--edge2);
    background:#0e1c2ad9;color:var(--muted);border-radius:8px;cursor:pointer;font-size:15px;line-height:1;
    display:flex;align-items:center;justify-content:center;transition:.13s}
  .railtog:hover{color:var(--ink);border-color:var(--accent)}
  .railtog.l{left:10px}.railtog.r{right:10px}
  .rail-h{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--dim);margin:0 0 10px}
  .railhead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
  .reloadall{border:1px solid var(--edge2);background:#0e1c2a;color:var(--muted);border-radius:6px;
    padding:3px 9px;font-size:10.5px;cursor:pointer;transition:.13s}
  .reloadall:hover{color:var(--accent);border-color:var(--accent)}
  .reloadall:disabled{opacity:.6;cursor:default}
  .exok{color:#3fb950}
  .layers{display:flex;flex-direction:column;gap:5px}
  /* tree nav: group (▾) → subgroup (▾) → layer leaves */
  .tgrp{display:flex;align-items:center;gap:6px;font-size:11px;letter-spacing:.07em;text-transform:uppercase;
    color:var(--ink);font-weight:700;margin:12px 0 3px;cursor:pointer;user-select:none}
  .tgrp:first-child{margin-top:0}
  .tgrp:hover,.tsub:hover{color:var(--accent)}
  .tsub{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);font-weight:600;
    margin:5px 0 3px 4px;cursor:pointer;user-select:none}
  .tw{display:inline-block;width:11px;font-size:10px;color:var(--dim);flex:none}
  .tsub~.layer-btn,.tsub+.layer-btn{margin-left:14px;width:calc(100% - 14px)}
  .layer-btn.pin{border-color:var(--edge2);box-shadow:inset 0 0 0 1px var(--edge2)}
  .layer-btn.on.pin{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
  /* bottom half of the rail: Legend (top) then the "About this layer" explanation, pinned + scrollable */
  .railbottom{flex:none;border-top:1px solid var(--edge);margin:8px -16px 0;padding:12px 16px 2px;max-height:48%;overflow:auto;display:flex;flex-direction:column;gap:14px}
  .explain{}
  .exhint{font-size:12px;color:var(--dim);margin:0;line-height:1.5}
  .extitle{font-size:13.5px;font-weight:700;color:var(--ink);margin:0 0 7px;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
  .exunit{font-size:11px;font-weight:500;color:var(--muted)}
  .solb{font-size:9.5px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;color:var(--accent);
    border:1px solid var(--accent);border-radius:999px;padding:1px 7px;opacity:.85}
  .exbody{font-size:12px;color:var(--muted);line-height:1.55;margin:0}
  .exstat{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:9px;padding-top:8px;
    border-top:1px dashed var(--edge);font-size:11.5px;color:var(--muted)}
  .exstat b{color:var(--ink);font-variant-numeric:tabular-nums}
  .exwarn{color:#d29922}
  .exprov{margin:9px 0 0;padding:8px 9px;border:1px solid var(--line,#22344a);border-radius:7px;font-size:11.5px;line-height:1.5}
  .exprov div{display:flex;gap:8px}.exprov .k{color:var(--dim);min-width:74px;flex:none}.exprov .v{color:var(--ink);word-break:break-word}
  .exsub{font-size:10.5px;color:var(--dim);margin-top:4px;line-height:1.4}
  .exreload{flex:none;border:1px solid var(--edge2);background:#0e1c2a;color:var(--muted);border-radius:6px;
    padding:3px 9px;font-size:11px;cursor:pointer;transition:.13s}
  .exreload:hover{color:var(--accent);border-color:var(--accent)}
  .lgrp{font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--dim);font-weight:700;margin:13px 0 2px}
  .lgrp:first-child{margin-top:0}
  .layer-btn{display:flex;align-items:center;gap:10px;padding:9px 11px;border:1px solid var(--edge);
    border-radius:9px;background:var(--panel);color:var(--ink);cursor:pointer;text-align:left;transition:.13s;width:100%}
  .layer-btn:hover{border-color:var(--edge2);background:var(--panel2)}
  .layer-btn.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
  .swatch{width:12px;height:12px;border-radius:3px;flex:none}
  .layer-btn .lb{flex:1}
  .layer-btn .lb b{display:block;font-weight:600;font-size:13.5px}
  .layer-btn .lb span{color:var(--muted);font-size:11.5px}
  .legend{margin:0}
  .ovsec{margin-top:22px}
  .ovbtns{display:flex;flex-direction:column;gap:7px}
  .ovbtn{display:flex;align-items:center;gap:9px;padding:8px 11px;border:1px solid var(--edge);border-radius:9px;
    background:var(--panel);color:var(--muted);cursor:pointer;text-align:left;font-size:13px;transition:.13s}
  .ovbtn:hover{border-color:var(--edge2)}
  .ovbtn.on{color:var(--ink);border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
  .ovbtn .dotb{width:10px;height:10px;border-radius:50%;flex:none;opacity:.45}
  .ovbtn.on .dotb{opacity:1}
  .bar{height:10px;border-radius:5px;margin:8px 0 5px}
  .legend .ends{display:flex;justify-content:space-between;color:var(--muted);font-size:11.5px}
  .map-wrap{position:relative;overflow:hidden;background:#0b1017}
  #map{position:absolute;inset:0}
  #deck canvas{outline:none}
  .zoomctl{position:absolute;left:10px;bottom:10px;z-index:6;display:flex;flex-direction:column;gap:4px}
  .zoomctl button{width:30px;height:30px;border:1px solid var(--edge2);background:#0e1c2ad9;color:var(--ink);
    border-radius:8px;cursor:pointer;font-size:17px;line-height:1;display:flex;align-items:center;justify-content:center}
  .zoomctl button:hover{border-color:var(--accent);color:var(--accent)}
  .zoomctl button.rst{font-size:13px}
  /* basemap style switcher */
  .bmctl{position:absolute;left:10px;bottom:158px;z-index:6;display:flex;flex-direction:column;gap:2px;
    background:#0e1c2ad9;border:1px solid var(--edge2);border-radius:9px;padding:4px}
  .bmbtn{border:none;background:none;color:var(--muted);font-size:11px;padding:4px 10px 4px 8px;border-radius:6px;
    cursor:pointer;text-align:left;white-space:nowrap;transition:.12s}
  .bmbtn:hover{color:var(--ink);background:var(--panel)}
  .bmbtn.on{background:var(--panel2);color:var(--accent);font-weight:600}
  .tip{position:absolute;pointer-events:none;background:#0a1320f2;border:1px solid var(--edge2);z-index:7;
    border-radius:7px;padding:7px 9px;font-size:12px;opacity:0;transition:.06s;transform:translate(8px,8px);white-space:nowrap}
  .tip b{color:var(--accent)}
  .attrib{position:absolute;right:6px;bottom:6px;background:#0a1320cc;border:1px solid var(--edge);z-index:6;
    border-radius:5px;padding:2px 8px;font-size:10.5px;color:var(--muted)}
  .trust{padding:18px 16px;border-left:1px solid var(--edge);overflow:auto;transition:padding .2s,opacity .15s}
  .grid.rc0 .trust{padding:0;opacity:0;pointer-events:none;border:none}
  .cov{border:1px solid var(--edge);border-radius:10px;padding:12px 13px;margin-bottom:10px;background:var(--panel)}
  .cov .top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:9px}
  .cov .noun{font-weight:600;font-size:13px}
  .pill{font-size:10.5px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;
    padding:3px 8px;border-radius:999px;white-space:nowrap}
  .pill.open{background:#0c2a20;color:var(--auth-open);border:1px solid #1c4a38}
  .pill.ai{background:#2c220a;color:var(--auth-ai);border:1px solid #4d3d12}
  .pill.real{background:#0f2340;color:var(--auth-real);border:1px solid #244a78}
  .covbar{height:7px;border-radius:4px;background:#0c1520;overflow:hidden;margin:2px 0 8px}
  .covbar>i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,#2b6cb0,var(--accent))}
  .kv{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);padding:1.5px 0}
  .kv b{color:var(--ink);font-weight:600}
  .gaps{margin-top:8px;font-size:11.5px;color:#e0b877;border-top:1px dashed var(--edge);padding-top:7px}
  .gaps .g{display:flex;gap:6px}.gaps .g::before{content:"△";color:#b98a3a}
  /* --- rolled-up trust cards --- */
  .trustsum{font-size:12px;color:var(--muted);margin:0 0 11px}.trustsum b{font-weight:700}
  .cov .top{cursor:pointer}
  .cov .cvx{margin-left:2px;color:var(--dim);font-size:11px;transition:transform .15s}
  .cov.open .cvx{transform:rotate(180deg)}
  .pill.tg-ok{background:#0f2417;color:#3fb950;border:1px solid #1c3a25}
  .pill.tg-mid{background:#2c220a;color:#d29922;border:1px solid #4d3d12}
  .pill.tg-low{background:#3d1418;color:#ff7b72;border:1px solid #6e2b30}
  .pill.na{background:#161b22;color:var(--muted);border:1px solid var(--edge)}
  .tbrow{display:flex;gap:6px;flex-wrap:wrap;margin:2px 0 8px}
  .tb{display:flex;flex-direction:column;gap:1px;background:#0c1520;border:1px solid var(--edge);border-radius:7px;padding:5px 9px;flex:1;min-width:70px}
  .tbk{font-size:9px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
  .tbv{font-size:12.5px;font-weight:700}
  .tbv.ok{color:#3fb950}.tbv.mid{color:#d29922}.tbv.low{color:#ff7b72}.tbv.na{color:var(--muted)}
  .covsub{font-size:12px;color:var(--muted)}
  .cov-empty{opacity:.65}
  .covdetail{display:none;margin-top:9px;border-top:1px dashed var(--edge);padding-top:9px}
  .cov.open .covdetail{display:block}
  .trail{margin:2px 0 10px}
  .trn{display:flex;gap:9px;align-items:flex-start}
  .trdot{flex:none;width:9px;height:9px;border-radius:50%;background:var(--accent);margin-top:3px;box-shadow:0 0 0 3px #12233a}
  .trline{width:1px;height:11px;background:var(--edge);margin:1px 0 1px 4px}
  .trt{font-size:12.5px;font-weight:600;color:var(--ink)} .trs{font-size:10.5px;color:var(--muted)}
  footer{border-top:1px solid var(--edge);padding:9px 18px;color:var(--dim);font-size:11.5px}
  .empty{padding:40px;color:var(--muted);text-align:center}
  .loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--muted);z-index:5}
  /* cell drill-down detail panel (click a hex to zoom in on it) */
  .cellpanel{position:absolute;left:14px;top:56px;z-index:7;width:224px;background:#0c1622f2;
    border:1px solid var(--edge2);border-radius:11px;padding:12px 13px;box-shadow:0 10px 34px #0007;backdrop-filter:blur(3px)}
  .cptop{display:flex;align-items:center;justify-content:space-between;font-size:11px;letter-spacing:.09em;
    text-transform:uppercase;color:var(--dim);margin-bottom:2px}
  .cptop .cpbtns{display:flex;align-items:center;gap:2px}
  .cptop button{background:none;border:none;color:var(--muted);font-size:16px;line-height:1;cursor:pointer;padding:0 3px}
  .cptop button#cpx{font-size:19px}
  .cptop button:hover{color:var(--accent)}
  .cellpanel.collapsed{width:auto;min-width:150px;padding-bottom:10px}
  .tgl{font-size:10.5px;border:1px solid var(--edge2);background:#0e1c2a;color:var(--muted);border-radius:6px;
    padding:2px 8px;cursor:pointer;margin-left:8px;white-space:nowrap}
  .tgl:hover{border-color:var(--accent)}
  .tgl.on{color:var(--accent);border-color:var(--accent)}
  .cellpanel .kv span:last-child{display:flex;align-items:center}
  .cellpanel .cph{font-size:12px;color:var(--accent);margin-bottom:9px}
  .cellpanel .kv{padding:2.5px 0;font-size:12.5px}
  .cellpanel .kv.sep{border-top:1px dashed var(--edge);margin-top:6px;padding-top:7px}
  .drillhint{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);z-index:6;pointer-events:none;
    background:#0a1320d9;border:1px solid var(--edge2);border-radius:999px;padding:4px 13px;color:var(--muted);
    font-size:11.5px;opacity:0;transition:opacity .3s}
  .drillhint.show{opacity:1}
  .rampsel{margin-top:6px;display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted)}
  .rampsel select{flex:1;background:#0e1c2a;color:inherit;border:1px solid var(--edge2);border-radius:6px;font-size:11.5px;padding:2px 4px}
  .rampsel button{border:none;background:none;color:var(--muted);cursor:pointer;font-size:11px;text-decoration:underline;padding:0}
  /* place search — find a named place, fly there and open its cell (as a click would) */
  .psearch{position:absolute;left:50%;top:12px;transform:translateX(-50%);z-index:9;width:min(320px,60%)}
  .psearch input{width:100%;box-sizing:border-box;background:#0e1c2ae6;border:1px solid var(--edge2);border-radius:9px;
    color:inherit;font:inherit;font-size:13px;padding:7px 11px 7px 30px;outline:none}
  .psearch input:focus{border-color:var(--accent)}
  .psearch .pico{position:absolute;left:10px;top:7px;font-size:13px;opacity:.7;pointer-events:none}
  .psres{margin-top:4px;background:#0c1622f7;border:1px solid var(--edge2);border-radius:9px;overflow:hidden;box-shadow:0 8px 24px #0006}
  .psres:empty{display:none}
  .psres div{padding:6px 11px;font-size:12.5px;cursor:pointer;display:flex;justify-content:space-between;gap:10px}
  .psres div span{color:var(--muted);font-size:11px}
  .psres div.on,.psres div:hover{background:#ffffff14}
  /* lazy-load busy pill (shown while a layer/overlay fetches on demand) */
  .busy{position:absolute;left:50%;top:54px;transform:translateX(-50%);z-index:8;pointer-events:none;
    background:#0c1622f2;border:1px solid var(--edge2);border-radius:999px;padding:6px 15px;color:var(--muted);
    font-size:12px;box-shadow:0 8px 24px #0006}
  .busy::before{content:"";display:inline-block;width:9px;height:9px;margin-right:8px;vertical-align:-1px;
    border:2px solid var(--edge2);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  /* TIME SCRUBBER — animate a temporal layer over its time axis (forecast series / dated snapshots) */
  .scrubber{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);z-index:7;width:min(560px,80%);
    display:flex;align-items:center;gap:12px;background:#0c1622f2;border:1px solid var(--edge2);border-radius:12px;
    padding:9px 14px;box-shadow:0 10px 34px #0007;backdrop-filter:blur(4px)}
  .scrubber[hidden]{display:none}
  /* TREND CHART — the animated layer's city-wide curve, the current frame marked; drag by its header */
  .trend{position:absolute;top:56px;right:44px;z-index:8;width:370px;background:#0c1622f2;border:1px solid var(--edge2);
    border-radius:11px;box-shadow:0 10px 34px #0007;backdrop-filter:blur(4px);user-select:none}
  .trend[hidden]{display:none}
  .trend .th{display:flex;align-items:center;gap:8px;padding:7px 10px 5px;cursor:move;font-size:12px;color:var(--ink)}
  .trend .th b{flex:1;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .trend .th button{border:none;background:none;color:var(--muted);cursor:pointer;font-size:15px;line-height:1;padding:0 2px}
  .trend .tv{padding:0 10px 2px;font-size:11.5px;color:var(--muted);display:flex;gap:14px;flex-wrap:nowrap;white-space:nowrap;overflow:hidden;height:16px}
  .trend .tv i{font-style:normal;font-weight:600}
  .trend svg{display:block;cursor:pointer}
  .scrubber .tchart{flex:none;width:30px;height:30px;border-radius:50%;background:transparent;border:1px solid var(--edge2);font-size:14px}                 /* the [hidden] attr must beat display:flex above (else it always shows) */
  .scrubber button{flex:none;width:30px;height:30px;border-radius:50%;border:none;background:var(--accent);
    color:#04121e;font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center}
  .scrubber button:hover{filter:brightness(1.1)}
  .scrubber input[type=range]{flex:1;accent-color:var(--accent);cursor:pointer}
  .scrubber .tlab{flex:none;text-align:right;min-width:104px}
  .scrubber .tlab b{display:block;font-size:12.5px;color:var(--ink);font-variant-numeric:tabular-nums}
  .scrubber .tlab span{font-size:10.5px;color:var(--dim)}
</style>

<header>
  <h1><b>Visualize</b></h1>
  <div class="sub" id="sub">loading…</div>
</header>

<div class="grid rc0" id="app">
  <aside>
    <div class="railhead"><p class="rail-h" style="margin:0">Layers</p><button class="reloadall" id="reloadall" title="Re-fetch the active layer + all shown overlays from the registry">↻ Reload all</button></div>
    <div class="layerscroll" id="layerscroll">
      <div class="layers" id="layers"></div>
    </div>
    <div class="railbottom">
      <div class="legend" id="legend" hidden>
        <p class="rail-h" style="margin-bottom:4px">Legend</p>
        <div class="bar" id="legbar"></div>
        <div class="ends"><span id="legmin"></span><span id="legmax"></span></div>
        <div class="rampsel" id="rampsel"></div>
        <div id="legmeta" style="margin-top:7px;color:var(--muted);font-size:11px;line-height:1.5"></div>
      </div>
      <div class="explain" id="explain"></div>
    </div>
  </aside>

  <div class="map-wrap">
    <div id="map"></div>
    <div class="loading" id="mapload">initialising map…</div>
    <div class="cellpanel" id="cellpanel" hidden></div>
    <div class="drillhint" id="drillhint">click a cell to drill in · Esc to exit</div>
    <div class="psearch"><span class="pico">🔍</span><input id="psq" type="search" autocomplete="off" placeholder="Find a place — e.g. Nilasandra, Jayanagar…" aria-label="Find a place"><div class="psres" id="psres"></div></div>
    <div class="scrubber" id="scrubber" hidden></div>
    <div class="trend" id="trend" hidden></div>
    <div class="busy" id="busy" hidden></div>
    <div class="tip" id="tip"></div>
    <button class="railtog l" id="togL" title="Show/hide layers">‹</button>
    <button class="railtog r" id="togR" title="Show/hide report">›</button>

  const cov=(DATA.coverage||[]).slice().sort((a,b)=>(a.layer_noun>b.layer_noun?1:-1));
  if(!cov.length){$("cov").innerHTML='<div class="empty">No coverage report yet.</div>';return;}
  const real=cov.filter(c=>layerKind(c)==='layer');
  const good=real.filter(c=>trustOf(c).trust.b==='Good').length;
  $("cov").innerHTML=(real.length?`<div class="trustsum">${good} of ${real.length} map layers rated <b class="tbv ok" style="font-weight:700">Good</b> · click a layer for its data trail</div>`:'')
    + cov.map(c=>{
    const kind=layerKind(c), name=nounLabel(c.layer_noun), st=SRCTYPE[c.authority];
    if(kind==='empty') return `<div class="cov cov-empty"><div class="top" style="cursor:default"><span class="noun">${esc(name)}</span><span class="pill na">no data</span></div>
      <div class="covsub">Not built for this city yet — connect its key/file in City Setup, then re-build.</div></div>`;
    const T=trustOf(c), pct=Math.round(c.coverage_pct||0);
    const badges = kind==='input'
      ? `<span class="tb"><span class="tbk">Role</span><span class="tbv na">Input feed</span></span>
         <span class="tb"><span class="tbk">Freshness</span><span class="tbv ${T.fresh?T.fresh.c:'na'}">${T.fresh?T.fresh.b:'—'}</span></span>`
      : `<span class="tb"><span class="tbk">Confidence</span><span class="tbv ${T.conf.c}">${T.conf.b}</span></span>
         <span class="tb"><span class="tbk">Freshness</span><span class="tbv ${T.fresh?T.fresh.c:'na'}">${T.fresh?T.fresh.b:'—'}</span></span>
         <span class="tb"><span class="tbk">Coverage</span><span class="tbv ${T.cov.c}">${T.cov.b}</span></span>`;
    const head = kind==='input' ? `<span class="pill ${st?st.c:'ai'}">${esc(st?st.t:'input')}</span>`
                                : `<span class="pill tg-${T.trust.c}">${T.trust.b}</span>`;
    const trail=trailNodes(c).map((n,j,a)=>`<div class="trn"><span class="trdot"></span><div><div class="trt">${esc(n.t)}</div><div class="trs">${esc(n.sub)}</div></div></div>${j<a.length-1?'<div class="trline"></div>':''}`).join('');
    return `<div class="cov"><div class="top"><span class="noun">${esc(name)}</span>${head}<span class="cvx">▾</span></div>
      <div class="tbrow">${badges}</div>
      ${kind==='layer'?`<div class="covbar"><i style="width:${pct}%"></i></div>`:''}
      <div class="covdetail">
        <div class="trail">${trail}</div>
        <div class="kv"><span>Source type</span><b>${esc(st?st.t:'—')}</b></div>
        ${kind==='layer'?`<div class="kv"><span>Coverage</span><b class="num">${pct}% of AOI cells</b></div>`:''}
        <div class="kv"><span>Confidence score</span><b class="num">${c.confidence==null?'—':c.confidence}</b></div>
        <div class="kv"><span>As of</span><b class="num">${esc(String(c.freshness||c.assessed_at||'—').slice(0,10))}</b></div>
        ${(c.gaps||[]).length?`<div class="gaps">${(c.gaps||[]).map(g=>`<div class="g">${esc(g)}</div>`).join('')}</div>`:''}
      </div></div>`;}).join("");
  $("cov").querySelectorAll('.cov').forEach(el=>{const top=el.querySelector('.top');
    if(top&&el.querySelector('.covdetail')) top.onclick=()=>el.classList.toggle('open');});
}
function fitView(bbox){
  const [w,s,e,n]=bbox, lon=(w+e)/2, lat=(s+n)/2;
  const span=Math.max(e-w,(n-s))||0.1, zoom=Math.max(3,Math.min(15,Math.log2(360/span)));
  return {longitude:lon,latitude:lat,zoom,pitch:0,bearing:0};
}

(async function(){
  if(!window.deck||!deck.Deck){ $("mapload").textContent="map engine failed to load"; return; }
  DATA=await load();
  active=(LAYERS[0]||{}).key;
  // The header names the place + how many layers are available. Data recency is NOT a single city-wide date
  // (each layer has its own freshness) — so we show it per-layer in the legend when a layer is active, instead
  // of a misleading one-size "as of" (which previously reflected only the stale baseline-coverage assessment).
  updateHeader();
  if(!LAYERS.length){ $("mapload").remove(); $("map").innerHTML='<div class="empty">No baseline data for this workspace yet.</div>'; drawTrust(); return; }
  view=fitView(DATA.aoi.bbox||DATA.scope||[72.8,18.9,72.99,19.28]);
  deckgl=new deck.Deck({
    parent:$("map"), initialViewState:view, controller:true, useDevicePixels:false,
    views:[new deck.MapView({repeat:false})],
    onViewStateChange:({viewState})=>{ const z0=view&&view.zoom; view=viewState;   // lake names appear from zoom 13
      if(active==="water.lake_cell"&&((z0>=13)!==(viewState.zoom>=13))) render(); },
    onHover:info=>tip(info),
    getCursor:({isDragging})=>isDragging?"grabbing":"grab",
    layers:[]
  });
  $("mapload").remove();
  drawLayers(); drawExplain(); drawTrust(); render();         // FIRST PAINT — instant (only the active layer is loaded)
  // Vector overlays: always available; their (heavy) geometry loads lazily. Default drainage+roads on, facilities off.
  // Overlays (Drainage / Roads / Facilities) are now items INSIDE the grouped layer menu (drawLayers), not a
  // separate "Overlays" section — their toggle wiring lives there.
  // AI-City sites + Land-use plan (3D) overlays removed from City Scan — those are Plan/solution features, not the
  // City Baseline. Their buttons stay hidden; showSites/showPlan default false so their layers never render.
  // Overlays (roads / drainage / facilities) are OFF on load — the base map shows first; each loads lazily only when the user toggles it on.
  const setV=v=>{ view=v; deckgl.setProps({initialViewState:v}); };
  $("zin").onclick=()=>setV({...view,zoom:Math.min(19,view.zoom+0.6),transitionDuration:150});
  $("zout").onclick=()=>setV({...view,zoom:Math.max(3,view.zoom-0.6),transitionDuration:150});
  $("zreset").onclick=()=>setV({...fitView(DATA.aoi.bbox||DATA.scope),pitch:mode3d?50:0,transitionDuration:250});
  if($("opac")) $("opac").oninput=e=>{ layerAlpha=Math.max(0.05,(+e.target.value)/100); if($("opacval"))$("opacval").textContent=e.target.value+"%"; render(); };   // live choropleth transparency
  if($("reloadall")) $("reloadall").onclick=()=>reloadAll();   // re-fetch active layer + shown overlays
  document.querySelectorAll('.bmbtn').forEach(b=>b.onclick=()=>setBasemap(b.dataset.bm));   // basemap style switcher
  document.querySelectorAll('.bmbtn').forEach(b=>b.classList.toggle('on', b.dataset.bm===basemap));
  { const a=$("attrib"); if(a) a.textContent="Basemap "+(BASEMAPS[basemap]||BASEMAPS.standard).attr; }
  $("tilt").onclick=()=>{                                       // 2D ⇄ 2.5D: tilt the camera + extrude the hexes into towers
    mode3d=!mode3d;
    $("tilt").style.color=mode3d?"var(--accent)":""; $("tilt").style.borderColor=mode3d?"var(--accent)":"";
    view={...view, pitch:mode3d?50:0, bearing:mode3d?view.bearing:0};
    deckgl.setProps({initialViewState:{...view,transitionDuration:450}});
    render();                                                  // re-emit layers with extruded:mode3d (updateTriggers)
  };
  const g=$("app");
  $("togL").onclick=()=>{g.classList.toggle("lc0");$("togL").textContent=g.classList.contains("lc0")?"›":"‹";};
  $("togR").onclick=()=>{g.classList.toggle("rc0");$("togR").textContent=g.classList.contains("rc0")?"‹":"›";};
  $("togR").textContent=g.classList.contains("rc0")?"‹":"›";   // right rail (Coverage & trust) starts collapsed
  document.addEventListener("keydown",e=>{ if(e.key==="Escape") exitDrill(); });
  initPlaceSearch();   // Esc leaves the drilled cell
  const hint=$("drillhint"); hint.classList.add("show"); setTimeout(()=>hint.classList.remove("show"),4200);
})();
</script>
<!-- Visualize embedded analyst: grounded spatial Q&A over governed layers + knowledge, with map highlight -->
<script>
(function(){
  const wrap=document.createElement('div'); wrap.id='askwrap';
  wrap.innerHTML='<button id="askbtn" title="Ask the city analyst">🔍 Ask</button>'
   +'<div id="askpanel" hidden><div class="askhd"><span>City analyst</span><span class="askact"><span id="askwide" title="Expand">⤢</span><span id="askx" title="Close">×</span></span></div>'
   +'<div id="asklog"><div class="am ai">Ask about the city, grounded in governed data — e.g. “which areas are most congested?”, “where should we add healthcare centres?”.</div></div>'
   +'<div class="askin"><input id="askq" data-voice placeholder="Ask a question…" autocomplete="off"><button id="asksend">→</button></div></div>';
  document.body.appendChild(wrap);
  const css=document.createElement('style'); css.textContent=
   '#askwrap{position:fixed;right:16px;bottom:16px;z-index:30;font:14px system-ui,sans-serif}'
   +'#askbtn{background:#38bdf8;color:#04121f;border:none;border-radius:999px;padding:10px 16px;font-weight:600;cursor:pointer;box-shadow:0 2px 12px #0007}'
   +'#askpanel{position:absolute;right:0;bottom:48px;width:370px;max-height:64vh;display:flex;flex-direction:column;background:#0e1c2a;border:1px solid #22344a;border-radius:12px;box-shadow:0 6px 24px #0009;overflow:hidden}'
   +'#askpanel[hidden]{display:none}'
   +'.askhd{padding:9px 12px;background:#13273b;color:#e6edf5;font-weight:600;display:flex;justify-content:space-between}'
   +'#askx,#askwide{cursor:pointer;color:#8aa0b6;padding:0 4px}.askact{display:flex;gap:6px}#askwide:hover,#askx:hover{color:#e6edf5}'
   +'#askpanel.wide{width:min(880px,calc(100vw - 32px));max-height:86vh}#askpanel.wide .am{max-width:96%}'
   +'.am.md{white-space:normal}.am.md:has(.md-tbl){max-width:100%;align-self:stretch}.am.md p{margin:0 0 6px}.am.md p:last-child{margin-bottom:0}.am.md h4{margin:6px 0 4px;font-size:13.5px}'
   +'.am.md ul,.am.md ol{margin:4px 0 6px 18px;padding:0}.am.md li{margin:2px 0}.am.md li.sub{margin-left:14px}'
   +'.am.md .md-tbl{display:block;width:auto;overflow-x:auto;max-width:100%;margin:6px 0;font-size:12.5px;color:inherit}.am.md table{border-collapse:collapse;font-size:12.5px;min-width:100%;color:#e6edf5}'
   +'.am.md th,.am.md td{border:1px solid #22344a;padding:4px 8px;text-align:left;vertical-align:top;white-space:nowrap}'
   +'.am.md th{background:#16304a;color:#cdd9e5;font-weight:600}.am.md td{font-variant-numeric:tabular-nums}'
   +'.am.md .cellref{border-bottom:1px dashed #f87171;cursor:pointer}.am.md .cellref.pin{background:#7f1d1d;color:#fff;border-radius:3px;padding:0 3px}.am.md .cellref:hover,.am.md tr.hl td{background:#3b1d1d}'
   +'.am.md code{background:#0a1622;padding:0 4px;border-radius:4px;font-size:12px}'
   +'.askin .aos-mic-group,.askin .aos-mic,.askin .aos-mic-lang{margin:0}.askin .aos-mic,.askin .aos-mic-lang{background:#0a1622;color:#e6edf5;border-color:#22344a}'
   +'#asklog{flex:1;overflow:auto;padding:10px;display:flex;flex-direction:column;gap:8px;min-height:90px}'
   +'.am{padding:8px 11px;border-radius:10px;max-width:88%;white-space:pre-wrap;line-height:1.45;font-size:13.5px}'
   +'.am.me{align-self:flex-end;background:#38bdf8;color:#04121f}'
   +'.am.ai{align-self:flex-start;background:#13273b;color:#e6edf5}'
   +'.am .src{margin-top:6px;font-size:11.5px;color:#7dd3fc}'
   +'.eq{margin-top:8px;border-top:1px solid #22344a;padding-top:7px}'
   +'.eq-h{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:#8aa0b6;font-weight:700;margin-bottom:5px}'
   +'.eq-row{display:flex;align-items:center;gap:6px;font-size:11.5px;margin:3px 0;flex-wrap:wrap}'
   +'.eq-row .ly{font-weight:600;color:#cdd9e5;min-width:104px}'
   +'.eq-tag{font-size:10px;font-weight:700;padding:1px 6px;border-radius:999px;white-space:nowrap}'
   +'.eq-obs{background:#12301f;color:#57bd86;border:1px solid #1f5236}'
   +'.eq-inf{background:#332815;color:#d69a3e;border:1px solid #5b4a1f}'
   +'.eq-un{background:#331d1c;color:#e0736b;border:1px solid #5c2c2a}'
   +'.eq-m{color:#8aa0b6;font-size:11px}'
   +'.askin{display:flex;gap:6px;padding:10px;border-top:1px solid #22344a}'
   +'#askq{flex:1;background:#0a1622;border:1px solid #22344a;color:#e6edf5;border-radius:8px;padding:8px 10px}'
   +'#asksend{background:#38bdf8;color:#04121f;border:none;border-radius:8px;padding:0 13px;font-weight:700;cursor:pointer}';
  document.head.appendChild(css);
  const G=id=>document.getElementById(id);
  const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  function md(src){
    const lines=String(src||'').replace(/\r/g,'').split('\n'), out=[]; let list=null;
    const inl=t=>esc(t).replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>').replace(/`([^`]+)`/g,'<code>$1</code>');
    const close=()=>{ if(list){ out.push('</'+list+'>'); list=null; } };
    const isRow=l=>/^\s*\|.*\|\s*$/.test(l), cells=l=>l.trim().replace(/^\|/,'').replace(/\|$/,'').split('|').map(c=>c.trim());
    for(let i=0;i<lines.length;i++){
      const l=lines[i]; let m;
      if(isRow(l)&&i+1<lines.length&&/^\s*\|?\s*:?-{2,}/.test(lines[i+1])){
        close(); const head=cells(l), rows=[]; i+=2;
        while(i<lines.length&&isRow(lines[i])){ rows.push(cells(lines[i])); i++; } i--;
        out.push('<div class="md-tbl"><table><thead><tr>'+head.map(c=>'<th>'+inl(c)+'</th>').join('')+'</tr></thead><tbody>'
          +rows.map(r=>'<tr>'+r.map(c=>'<td>'+inl(c)+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>');
        continue; }
      if((m=l.match(/^\s*#{1,6}\s+(.*)$/))){ close(); out.push('<h4>'+inl(m[1])+'</h4>'); continue; }
      if((m=l.match(/^(\s*)[-*•]\s+(.*)$/))){ if(list!=='ul'){ close(); out.push('<ul>'); list='ul'; }
        out.push('<li'+(m[1].length>=2?' class="sub"':'')+'>'+inl(m[2])+'</li>'); continue; }
      if((m=l.match(/^\s*\d+[.)]\s+(.*)$/))){ if(list!=='ol'){ close(); out.push('<ol>'); list='ol'; } out.push('<li>'+inl(m[1])+'</li>'); continue; }
      close(); if(l.trim()) out.push('<p>'+inl(l)+'</p>');
    }
    close(); return out.join('');
  }
  // place label / "lat, lon" → the H3 cells it names, from the FACTS the answer was grounded on (each listed row
  // carries its h3 + place + lat_lon). The model never prints h3 ids, so this is how a name maps back to its cell.
  function cellRefs(facts){
    const m={};
    const walk=v=>{ if(Array.isArray(v)) v.forEach(walk);
      else if(v&&typeof v==='object'){ if(v.h3&&(v.place||v.lat_lon)){ [v.place,v.lat_lon].forEach(k=>{ if(k){ (m[k]=m[k]||[]).includes(v.h3)||m[k].push(v.h3); } }); }
        else Object.values(v).forEach(walk); } };
    walk(facts||{}); return m;
  }
  function linkCells(html,refs){
    const keys=Object.keys(refs).sort((a,b)=>b.length-a.length); const marks=[];
    for(const k of keys){ const e=esc(k); if(!html.includes(e)) continue;
      html=html.split(e).join('\u0000'+marks.length+'\u0000'); marks.push('<span class="cellref" data-h3="'+refs[k].join(',')+'">'+e+'</span>'); }
    return html.replace(/\u0000(\d+)\u0000/g,(_,i)=>marks[+i]);
  }
  function askKey(){ return [...ASK_HOVER].join(',')+'|'+[...ASK_PIN].join(','); }
  function setAskHover(list){
    const next=new Set(list||[]); if([...next].join(',')===[...ASK_HOVER].join(',')) return;
    ASK_HOVER=next; ASK_HOVER_KEY=askKey(); if(typeof render==='function') render();
  }
  function setAskPin(list){
    ASK_PIN=new Set(list||[]); ASK_HOVER_KEY=askKey(); if(typeof render==='function') render();
    G('asklog').querySelectorAll('.cellref.pin').forEach(x=>x.classList.remove('pin'));
  }
  function addMsg(role,html){const l=G('asklog');const d=document.createElement('div');d.className='am '+role;d.innerHTML=html;l.appendChild(d);l.scrollTop=l.scrollHeight;return d;}
  // Evidence-quality panel: how GOOD is the evidence behind the answer (not just the conclusion) — per governed
  // layer: observed vs inferred, coverage %, freshness, confidence. Grounds "quality & uncertainty of evidence".
  const LAYER_NAME={'risk.flood':'Flood risk','cell.crowd_density':'Crowd density','vision.detection':'CCTV count',
                    'cell.crush_risk':'Crush risk','cell.hydrology':'Hydrology','geo.terrain':'Terrain'};
  function agelbl(m){ if(m==null) return null; m=Math.abs(m);
    return m<90?m+'m old':m<1440?Math.round(m/60)+'h old':Math.round(m/1440)+'d old'; }
  function evidenceQualityHtml(eq){
    if(!eq||typeof eq!=='object') return '';
    const rows=Object.keys(eq).map(k=>{
      const v=eq[k]||{}; const mix=v.observed_vs_inferred||{};
      const tags=Object.keys(mix).map(m=>{
        const cls=m==='observed'?'eq-obs':(m==='inferred'?'eq-inf':'eq-un');
        return '<span class="eq-tag '+cls+'">'+esc(m)+' '+mix[m]+'</span>';}).join(' ');
      const bits=[];
      if(v.coverage_pct!=null) bits.push('coverage '+Math.round(v.coverage_pct)+'%');
      else if(v.gaps) bits.push('gaps: '+esc(String(v.gaps)));
      const fresh=agelbl(v.freshness_min); if(fresh) bits.push(fresh);
      if(v.mean_confidence!=null) bits.push('conf '+v.mean_confidence);
      if(!tags&&!bits.length) return '';
      return '<div class="eq-row"><span class="ly">'+esc(LAYER_NAME[k]||k)+'</span>'+tags
        +(bits.length?'<span class="eq-m">· '+esc(bits.join(' · '))+'</span>':'')+'</div>';
    }).join('');
    return rows?('<div class="eq"><div class="eq-h">Evidence quality</div>'+rows+'</div>'):'';
  }
  let ASKING=false;
  G('askbtn').onclick=()=>{const p=G('askpanel');p.hidden=!p.hidden;if(!p.hidden)G('askq').focus();};
  G('askx').onclick=()=>{G('askpanel').hidden=true; setAskHover([]); setAskPin([]);};
  const refOf=t=>{ const r=t&&t.closest&&t.closest('.cellref'); if(r) return r;
    const tr=t&&t.closest&&t.closest('tr'); return tr?tr.querySelector('.cellref'):null; };
  G('asklog').addEventListener('mouseover',e=>{ const r=refOf(e.target);
    G('asklog').querySelectorAll('tr.hl').forEach(x=>x.classList.remove('hl'));
    if(r){ const tr=r.closest('tr'); if(tr) tr.classList.add('hl'); }
    setAskHover(r?r.dataset.h3.split(','):[]); });
  G('asklog').addEventListener('mouseleave',()=>{ G('asklog').querySelectorAll('tr.hl').forEach(x=>x.classList.remove('hl')); setAskHover([]); });
  G('asklog').addEventListener('click',e=>{ const r=refOf(e.target); if(!r||!window.h3) return;
    const cells=r.dataset.h3.split(',');
    if([...ASK_PIN].join(',')===cells.join(',')){ setAskPin([]); return; }      // click the pinned name again → unpin
    setAskPin(cells); r.classList.add('pin');
    try{ const c=h3.cellToLatLng(cells[0]);
      // 3D: a gentler tilt so the (tall) bar stands where the eye lands, not far above the screen centre
      view={...view,longitude:c[1],latitude:c[0],zoom:Math.max(view.zoom||11,14),pitch:mode3d?35:(view.pitch||0),transitionDuration:700};
      deckgl.setProps({initialViewState:view}); }catch(err){} });
  const setWide=w=>{ G('askpanel').classList.toggle('wide',w); G('askwide').textContent=w?'⤡':'⤢'; G('askwide').title=w?'Shrink':'Expand'; };
  try{ setWide(localStorage.getItem('aosAskWide')==='1'); }catch(e){}
  G('askwide').onclick=()=>{ const w=!G('askpanel').classList.contains('wide'); setWide(w); try{ localStorage.setItem('aosAskWide',w?'1':'0'); }catch(e){} };
  G('askq').addEventListener('input',e=>{ if(!e.isTrusted&&G('askq').value.trim()) ask(); });   // dictated (synthetic input) → ask
  if(!document.querySelector('script[src="/shared/voice.js"]')){ const vs=document.createElement('script'); vs.src='/shared/voice.js'; vs.defer=true; document.head.appendChild(vs); }
  async function ask(){
    if(ASKING) return;
    const q=G('askq').value.trim(); if(!q) return;
    G('askq').value=''; ASKING=true;
    addMsg('me',esc(q));
    const slot=addMsg('ai','<span style="opacity:.6">Analysing governed layers…</span>');
    try{
      const d=await bridge('/bridge/city-ask',{question:q});
      setAskPin([]);
      slot.classList.add('md'); slot.innerHTML=linkCells(md(d.answer||'No answer.'),cellRefs(d.facts))
        +((d.sources&&d.sources.length)?('<div class="src">Sources: '+esc(d.sources.join(' · '))+'</div>'):'')
        +evidenceQualityHtml(d.facts&&d.facts.evidence_quality);
      ASK_HL=Array.isArray(d.highlight)?d.highlight:[];
      if(typeof render==='function') render();
      if(ASK_HL.length && window.h3){ try{ const c=h3.cellToLatLng(ASK_HL[0]);
        view={...view,longitude:c[1],latitude:c[0],zoom:Math.max(view.zoom||11,13),transitionDuration:800};
        deckgl.setProps({initialViewState:view}); }catch(e){} }
    }catch(e){ slot.innerHTML='Could not answer: '+esc(e.message||e); }
    ASKING=false; G('asklog').scrollTop=G('asklog').scrollHeight; G('askq').focus();
  }
  G('asksend').onclick=ask;
  G('askq').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();ask();}});
})();
</script>
