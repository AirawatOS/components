<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Files</title>
<link rel="stylesheet" href="/shared/aos.css">
<link rel="stylesheet" href="/shared/workspace.css">
<style>
  /* App-specific only — tokens and base parts come from aos.css, the layout from workspace.css */
  .fx-name{display:flex;align-items:center;gap:9px;min-width:0}
  .fx-name .ic{font-size:17px;width:22px;text-align:center;flex:none}
  .fx-name .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .fx-acts{display:inline-flex;gap:1px}
  .fx-acts button{background:none;border:0;cursor:pointer;font-size:14px;padding:3px 6px;border-radius:6px;color:var(--dim)}
  .fx-acts button:hover{background:var(--panel);color:var(--ink)} .fx-acts button.danger:hover{color:var(--danger)}
  .fx-star.on{color:var(--warn)}
  .fx-drop.over{outline:2px dashed var(--accent);outline-offset:-6px;background:var(--panel2)}
  .fx-tree .ws-item{padding-left:calc(14px + var(--d,0) * 14px)}
  .fx-tree .car{width:12px;color:var(--dim);flex:none;text-align:center}
  .fx-up{position:fixed;right:16px;bottom:16px;width:320px;max-width:calc(100vw - 32px);z-index:50;background:var(--panel);color:var(--ink);
         border:1px solid var(--line2);border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.35);padding:12px 14px;font-size:13px}
  .fx-up[hidden]{display:none}
  .fx-up-top{display:flex;align-items:center;gap:8px} .fx-up-top b{flex:1;font-variant-numeric:tabular-nums}
  .fx-up-name{color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:6px 0 8px}
  .fx-up-bar{height:6px;border-radius:3px;background:var(--panel2);overflow:hidden}
  .fx-up-bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
  .fx-up-note{color:var(--dim);font-size:12px;margin-top:8px}
  .fx-view{position:fixed;inset:0;z-index:60;background:rgba(8,12,18,.94);display:flex;flex-direction:column}
  .fx-view[hidden]{display:none}
  .fx-view-top{display:flex;align-items:center;gap:8px;padding:10px 14px;color:#e2e8f0;font-size:13px;border-top:1px solid rgba(148,163,184,.25)}
  .fx-view-top b{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
  .fx-view-top span{color:#94a3b8;font-variant-numeric:tabular-nums}
  .fx-view-stage{flex:1;min-height:0;margin-top:40px;display:flex;align-items:center;justify-content:center;position:relative;overflow:auto}
  .fx-view-stage img{max-width:100%;max-height:100%;object-fit:contain;cursor:zoom-in}
  .fx-view-stage.zoom{align-items:flex-start;justify-content:flex-start}
  .fx-view-stage.zoom img{max-width:none;max-height:none;cursor:zoom-out}
  .fx-view-nav{position:fixed;top:50%;transform:translateY(-50%);font-size:28px;padding:10px 14px;z-index:61}
  .fx-view-nav.prev{left:10px} .fx-view-nav.next{right:10px}
  .fx-hist{border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:8px;padding:8px 10px;margin:0 0 8px;font-size:12px}
</style>
</head>
<body class="ws">
<a href="#ws-main" class="aos-skip">Skip to content</a>
<nav class="ws-top" id="ws-top" aria-label="Location"></nav>
<div class="ws-app">
  <aside class="ws-left" id="ws-left" aria-label="Files navigation">
    <div class="ws-left-top">
      <input id="ws-search" type="search" placeholder="Search files…" autocomplete="off" aria-label="Search files">
      <button class="ws-ib" id="ws-collapse" title="Hide this pane">«</button>
    </div>
    <button class="btn pri ws-new" id="fx-new">＋ New</button>
    <div class="ws-nav">
      <button class="ws-nav-item" data-v="folder"><span class="ic">📁</span>My files</button>
      <button class="ws-nav-item" data-v="recent"><span class="ic">🕒</span>Recent</button>
      <button class="ws-nav-item" data-v="starred"><span class="ic">★</span>Starred<span class="ct" id="fx-nstar"></span></button>
    </div>
    <div class="ws-sect">Folders</div>
    <div class="ws-scroll fx-tree" id="fx-tree"></div>
    <div class="ws-left-foot" id="fx-foot-left">
      <button class="ws-nav-item" id="fx-shares" hidden><span class="ic">📤</span>Organisation transfers</button>
    </div>
    <div class="ws-railbox"><button class="ws-ib" id="ws-expand" title="Show this pane">»</button><div class="ws-railname" id="ws-railname">Files</div></div>
  </aside>

  <main class="ws-main" id="ws-main">
    <div class="ws-toolbar">
      <h2 id="fx-title">My files</h2><span class="grow"></span>
      <button class="btn sm" id="fx-up" title="Upload one or more files">⬆︎ Upload</button>
      <button class="btn sm" id="fx-newfolder">＋ Folder</button>
      <button class="btn sm ghost" id="fx-refresh" title="Refresh" aria-label="Refresh">⟳</button>
      <input type="file" id="fx-file" multiple hidden>
      <input type="file" id="fx-dir" webkitdirectory directory multiple hidden>
    </div>
    <div class="ws-body fx-drop" id="fx-drop"></div>
    <div class="ws-foot" id="fx-foot"></div>
  </main>

  <aside class="ws-right" id="ws-right" aria-label="Details">
    <div class="ws-right-head"><span class="t"></span>
      <button class="ws-ib" id="ws-rprev" title="Previous (↑)">↑</button><button class="ws-ib" id="ws-rnext" title="Next (↓)">↓</button>
      <button class="ws-ib" id="ws-rclose" title="Close (Esc)">✕</button></div>
    <div class="ws-right-sub"></div>
    <div class="ws-tabs"><button class="ws-tab on" data-t="info">Info</button><button class="ws-tab" data-t="hist">History</button></div>
    <div class="ws-right-body" id="ws-rbody"></div>
  </aside>
</div>

<div class="fx-view" id="fx-view" role="dialog" aria-modal="true" aria-label="Image viewer" hidden>
  <div class="fx-view-stage" id="fx-vstage"><img id="fx-vimg" alt=""></div>
  <div class="fx-view-top"><b id="fx-vname"></b><span id="fx-vpos"></span>
    <button class="btn" id="fx-vdl" title="Download">⬇︎ Download</button><button class="btn" id="fx-vclose" title="Close (Esc)">✕ Close</button></div>
  <button class="btn fx-view-nav prev" id="fx-vprev" title="Previous (←)">‹</button>
  <button class="btn fx-view-nav next" id="fx-vnext" title="Next (→)">›</button>
</div>
<div class="fx-up" id="fx-upbox" role="status" aria-live="polite" hidden>
  <div class="fx-up-top"><b id="fx-upcount">Uploading…</b><button class="btn sm" id="fx-upcancel">Cancel</button></div>
  <div class="fx-up-name" id="fx-upname"></div>
  <div class="fx-up-bar"><i id="fx-upbar"></i></div>
  <div class="fx-up-note">Keep Files open until this finishes — switching apps or closing the tab stops the upload. Uploading the same files again skips those already here.</div>
</div>

<script src="/shared/i18n.js"></script>
<script src="/shared/aos.js"></script>
<script src="/shared/workspace.js"></script>
<script>
(function () {
  var ME = { tenant: "", sub: "", isAdmin: false };
  var ALL = [];          // all non-archived platform.file records (owner-scoped by the host)
  var CWD = "/";         // current folder path
  var MODE = "folder";   // folder | recent | starred | search  (VIEW is the image viewer's state)
  var Q = "";            // search text
  var SORT = { k: "name", dir: 1 };
  var SEL = null;        // id of the selected item
  var ROWS = [];         // items shown in the main pane, in order
  var OPENED = {};       // folder paths expanded in the left tree
  var RTAB = "info";

  // ---- path helpers ----
  function join(dir, name) { return dir === "/" ? "/" + name : dir + "/" + name; }
  function parentOf(dir) { if (dir === "/") return "/"; var p = dir.slice(0, dir.lastIndexOf("/")); return p || "/"; }
  function segs(dir) { return dir === "/" ? [] : dir.slice(1).split("/"); }
  function ns() {
    var t = (ME.tenant || "t").toString().replace(/^ds:/, "").split(":")[0].toLowerCase().replace(/[^a-z0-9-]/g, "-");
    return t || "t";
  }
  function newId() { return "ds:" + ns() + ":file/" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
  function nowIso() { return new Date().toISOString(); }
  function fmtSize(b) {
    if (b == null) return "";
    if (b < 1024) return b + " B";
    var u = ["KB", "MB", "GB", "TB"], i = -1;
    do { b /= 1024; i++; } while (b >= 1024 && i < u.length - 1);
    return b.toFixed(b < 10 ? 1 : 0) + " " + u[i];
  }
  function fmtDate(s) { if (!s) return ""; try { return new Date(s).toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" }); } catch (e) { return ""; } }
  function fmtTime(s) { if (!s) return ""; try { return new Date(s).toLocaleString(undefined, { year: "numeric", month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" }); } catch (e) { return s; } }
  function esc(s) { return WS.esc(s); }
  function isFolder(r) { return (r.kind || "file") === "folder"; }
  function pathOf(r) { return join(r.folder || "/", r.name); }

  // ---- data ----
  async function refresh() {
    try {
      var rows = await AOS.query("platform.file", {});
      ALL = (rows || []).filter(function (r) { return !r.archived; });
    } catch (e) { ALL = []; AOS.toast && AOS.toast("Could not load files"); }
    while (CWD !== "/" && !folderExists(CWD)) CWD = parentOf(CWD);
    if (SEL && !ALL.some(function (r) { return r.id === SEL; })) { SEL = null; WS.closeRight(); }
    render();
  }
  function folderExists(path) {
    if (path === "/") return true;
    var name = path.slice(path.lastIndexOf("/") + 1), par = parentOf(path);
    return ALL.some(function (r) { return isFolder(r) && (r.folder || "/") === par && r.name === name; });
  }
  function childrenOf(dir) {
    return ALL.filter(function (r) { return (r.folder || "/") === dir; }).sort(function (a, b) {
      var fa = isFolder(a), fb = isFolder(b);
      if (fa !== fb) return fa ? -1 : 1;
      return (a.name || "").localeCompare(b.name || "");
    });
  }

  // ---- navigation ----
  function go(view, dir) {
    MODE = view; if (dir != null) CWD = dir;
    if (view !== "search") { Q = ""; document.getElementById("ws-search").value = ""; }
    SEL = null; WS.closeRight();
    if (view === "folder") segs(CWD).reduce(function (p, s) { p = join(p, s); OPENED[p] = true; return p; }, "/");
    render();
  }
  function enter(r) { if (isFolder(r)) go("folder", pathOf(r)); else openFile(r); }

  // ---- render ----
  function render() { renderNav(); renderTree(); renderMain(); renderCrumbs(); if (SEL) renderRight(); }

  function renderNav() {
    document.querySelectorAll(".ws-nav-item[data-v]").forEach(function (b) {
      b.classList.toggle("on", b.dataset.v === MODE && !(MODE === "folder" && CWD !== "/"));
    });
    var ns_ = ALL.filter(function (r) { return r.starred && !isFolder(r); }).length;
    document.getElementById("fx-nstar").textContent = ns_ || "";
  }

  function renderTree() {
    var T = document.getElementById("fx-tree"); T.innerHTML = "";
    function add(dir, depth) {
      childrenOf(dir).filter(isFolder).forEach(function (f) {
        var p = pathOf(f), kids = ALL.some(function (x) { return isFolder(x) && (x.folder || "/") === p; });
        var el = document.createElement("div");
        el.className = "ws-item" + (MODE === "folder" && CWD === p ? " sel" : ""); el.style.setProperty("--d", depth);
        el.innerHTML = '<span class="car">' + (kids ? (OPENED[p] ? "▾" : "▸") : "") + '</span><span>📁</span><span class="nm">' + esc(f.name) + "</span>";
        el.title = p;
        el.onclick = function (e) {
          if (kids && e.target.classList.contains("car")) { OPENED[p] = !OPENED[p]; renderTree(); return; }
          go("folder", p);
        };
        T.appendChild(el);
        if (kids && OPENED[p]) add(p, depth + 1);
      });
    }
    add("/", 0);
    if (!T.children.length) T.innerHTML = '<div class="muted" style="padding:4px 16px">No folders yet.</div>';
  }

  function renderCrumbs() {
    var items = [];
    if (MODE === "folder") {
      items.push({ label: "My files", onClick: function () { go("folder", "/"); } });
      var p = ""; segs(CWD).forEach(function (s) { p = p + "/" + s; var t = p; items.push({ label: s, onClick: function () { go("folder", t); } }); });
    } else items.push({ label: MODE === "search" ? "Search: " + Q : MODE === "recent" ? "Recent" : "Starred" });
    var sel = SEL && ALL.find(function (r) { return r.id === SEL; });
    if (sel && !isFolder(sel)) items.push({ label: sel.name });
    WS.crumbs(items);
  }

  function listForView() {
    if (MODE === "search") {
      var q = Q.toLowerCase();
      return ALL.filter(function (r) { return (r.name || "").toLowerCase().indexOf(q) >= 0; });
    }
    if (MODE === "starred") return ALL.filter(function (r) { return r.starred && !isFolder(r); });
    if (MODE === "recent") return ALL.filter(function (r) { return !isFolder(r); })
      .sort(function (a, b) { return (b.updated_at || b.created_at || "").localeCompare(a.updated_at || a.created_at || ""); }).slice(0, 50);
    return childrenOf(CWD);
  }
  function sorted(list) {
    if (MODE === "recent" && SORT.k === "name" && SORT.dir === 1 && !SORT.touched) return list;   // recent: newest first by default
    var k = SORT.k, d = SORT.dir;
    return list.slice().sort(function (a, b) {
      var fa = isFolder(a), fb = isFolder(b); if (fa !== fb) return fa ? -1 : 1;
      var x, y;
      if (k === "size") { x = a.size_bytes || 0; y = b.size_bytes || 0; return (x - y) * d; }
      if (k === "date") { x = a.updated_at || a.created_at || ""; y = b.updated_at || b.created_at || ""; return x.localeCompare(y) * d; }
      return (a.name || "").localeCompare(b.name || "") * d;
    });
  }

  function renderMain() {
    var title = MODE === "folder" ? (CWD === "/" ? "My files" : CWD.slice(CWD.lastIndexOf("/") + 1))
              : MODE === "search" ? "Search results" : MODE === "recent" ? "Recent" : "Starred";
    document.getElementById("fx-title").textContent = title;
    var B = document.getElementById("fx-drop"), F = document.getElementById("fx-foot");
    ROWS = sorted(listForView());
    var nf = ROWS.filter(isFolder).length, nfile = ROWS.length - nf;
    F.textContent = ROWS.length ? [nf ? nf + " folder" + (nf === 1 ? "" : "s") : "", nfile ? nfile + " file" + (nfile === 1 ? "" : "s") : ""].filter(Boolean).join(" · ")
      + (MODE === "folder" ? " · drop files or folders here to upload" : "") : "";
    if (!ROWS.length) {
      B.innerHTML = '<div class="ws-empty"><div class="big">' + (MODE === "search" ? "🔎" : MODE === "starred" ? "☆" : "📂") + "</div>" +
        (MODE === "search" ? "Nothing named “" + esc(Q) + "”." : MODE === "starred" ? "No starred files. Star a file to find it here." :
         MODE === "recent" ? "No files yet." : "This folder is empty.<br>Upload files or a whole folder, drag them here, or create a folder.") + "</div>";
      return;
    }
    var showLoc = MODE !== "folder";
    function th(k, label, cls) {
      var arrow = SORT.k === k ? (SORT.dir > 0 ? " ↑" : " ↓") : "";
      return '<th class="sort ' + (cls || "") + '" data-k="' + k + '">' + label + arrow + "</th>";
    }
    var h = '<table class="ws-table"><thead><tr>' + th("name", "Name") + (showLoc ? "<th>Location</th>" : "") +
      th("date", "Modified") + th("size", "Size", "num") + '<th class="acts"></th></tr></thead><tbody>';
    ROWS.forEach(function (r, i) {
      h += '<tr data-i="' + i + '" class="' + (r.id === SEL ? "sel" : "") + '" tabindex="-1">' +
        '<td><div class="fx-name"><span class="ic">' + (isFolder(r) ? "📁" : fileIcon(r)) + '</span><span class="n" title="' + esc(r.name) + '">' +
        WS.hl(r.name, MODE === "search" ? Q : "") + "</span>" + (r.starred ? ' <span class="fx-star on" title="Starred">★</span>' : "") + "</div></td>" +
        (showLoc ? '<td class="muted">' + esc(r.folder || "/") + "</td>" : "") +
        '<td class="muted">' + esc(fmtDate(r.updated_at || r.created_at)) + '</td><td class="num muted">' + (isFolder(r) ? "—" : esc(fmtSize(r.size_bytes))) +
        '</td><td class="acts"></td></tr>';
    });
    B.innerHTML = h + "</tbody></table>";
    B.querySelectorAll("th.sort").forEach(function (t) {
      t.onclick = function () { var k = t.dataset.k; SORT = { k: k, dir: SORT.k === k ? -SORT.dir : 1, touched: true }; renderMain(); };
    });
    B.querySelectorAll("tbody tr").forEach(function (tr) {
      var r = ROWS[+tr.dataset.i];
      tr.querySelector("td.acts").appendChild(actsFor(r));
      tr.onclick = function (e) { if (e.target.closest(".fx-acts")) return; select(r.id); };
      tr.ondblclick = function (e) { if (e.target.closest(".fx-acts")) return; enter(r); };
      tr.onkeydown = function (e) { if (e.key === "Enter") enter(r); };
    });
  }

  function actsFor(r) {
    var acts = document.createElement("span"); acts.className = "fx-acts";
    if (!isFolder(r)) {
      if (kindOf(r) !== "download") acts.appendChild(actBtn("👁", "Open", function () { openFile(r); }));
      acts.appendChild(actBtn("⬇︎", "Download", function () { window.location.href = fileUrl(r); }));
      if (ME.isAdmin) acts.appendChild(actBtn("📤", "Send to another organisation", function () { shareFile(r); }));
      var star = actBtn(r.starred ? "★" : "☆", r.starred ? "Unstar" : "Star", function () { toggleStar(r); });
      star.className = "fx-star" + (r.starred ? " on" : ""); acts.appendChild(star);
    } else acts.appendChild(actBtn("↪", "Open folder", function () { enter(r); }));
    acts.appendChild(actBtn("✏︎", "Rename", function () { rename(r); }));
    var del = actBtn("🗑", "Delete", function () { confirmDelete(r, del); }); del.className = "danger"; acts.appendChild(del);
    return acts;
  }
  function actBtn(txt, label, fn) {
    var b = document.createElement("button"); b.textContent = txt; b.title = label; b.setAttribute("aria-label", label);
    b.onclick = function (e) { e.stopPropagation(); fn(); }; return b;
  }
  function fileIcon(r) {
    var t = (r.content_type || "").toLowerCase(), n = (r.name || "").toLowerCase();
    if (t.indexOf("image") === 0) return "🖼";
    if (t.indexOf("video") === 0) return "🎬";
    if (t.indexOf("audio") === 0) return "🎵";
    if (t.indexOf("pdf") >= 0 || n.endsWith(".pdf")) return "📕";
    if (t.indexOf("zip") >= 0 || t.indexOf("gzip") >= 0 || /\.(zip|tar|gz|tgz)$/.test(n)) return "🗜";
    if (/\.(csv|xlsx?|numbers)$/.test(n) || t.indexOf("sheet") >= 0) return "📊";
    if (/\.(js|py|html?|json|yaml|yml|css|ts|md)$/.test(n)) return "📃";
    return "📄";
  }

  // ---- right pane: the selected item ----
  function select(id) {
    SEL = id; var r = ALL.find(function (x) { return x.id === id; }); if (!r) return;
    document.querySelectorAll("#fx-drop tbody tr").forEach(function (tr) { tr.classList.toggle("sel", ROWS[+tr.dataset.i] && ROWS[+tr.dataset.i].id === id); });
    var tr = document.querySelector('#fx-drop tbody tr.sel'); if (tr) { tr.scrollIntoView({ block: "nearest" }); tr.focus({ preventScroll: true }); }
    WS.openRight(r.name, isFolder(r) ? "Folder · " + (r.folder || "/") : (r.content_type || "file") + " · " + fmtSize(r.size_bytes));
    renderCrumbs(); renderRight();
  }
  function step(d) {
    var i = ROWS.findIndex(function (r) { return r.id === SEL; }) + d;
    if (i >= 0 && i < ROWS.length) select(ROWS[i].id);
  }
  function renderRight() {
    var r = ALL.find(function (x) { return x.id === SEL; }), B = document.getElementById("ws-rbody"); if (!r) return;
    WS.tab(RTAB);
    if (RTAB === "hist") return renderHistory(r);
    var kv = isFolder(r)
      ? [["Type", "Folder"], ["Location", r.folder || "/"], ["Contains", childrenOf(pathOf(r)).length + " items"], ["Created", fmtTime(r.created_at)]]
      : [["Type", r.content_type || "—"], ["Size", fmtSize(r.size_bytes)], ["Location", r.folder || "/"],
         ["Modified", fmtTime(r.updated_at || r.created_at)], ["Created", fmtTime(r.created_at)], ["Starred", r.starred ? "Yes" : "No"]];
    var h = "";
    if (!isFolder(r) && kindOf(r) === "image") h += '<div class="ws-preview"><img alt="" src="' + esc(viewUrl(r)) + '"></div>';
    h += '<div class="ws-kv">' + kv.map(function (p) { return "<div>" + esc(p[0]) + "</div><div>" + esc(p[1]) + "</div>"; }).join("") + "</div>";
    h += '<div class="row" style="display:flex;gap:6px;flex-wrap:wrap;margin-top:12px" id="fx-racts"></div>';
    B.innerHTML = h;
    var A = document.getElementById("fx-racts");
    function btn(label, fn, cls) { var b = document.createElement("button"); b.className = "btn sm " + (cls || ""); b.textContent = label; b.onclick = fn; A.appendChild(b); return b; }
    btn(isFolder(r) ? "Open folder" : kindOf(r) === "download" ? "Download" : "Open", function () { enter(r); }, "pri");
    if (!isFolder(r) && kindOf(r) !== "download") btn("Download", function () { window.location.href = fileUrl(r); });
    btn("Rename", function () { rename(r); });
    var del = btn("Delete", function () { confirmDelete(r, del); });
    var img = B.querySelector(".ws-preview img"); if (img) img.onclick = function () { openFile(r); };
  }
  async function renderHistory(r) {
    var B = document.getElementById("ws-rbody"); B.innerHTML = '<div class="muted">Loading history…</div>';
    var res; try { res = await AOS.run("history", { id: r.id }); } catch (e) { res = { error: String(e) }; }
    if (RTAB !== "hist" || SEL !== r.id) return;
    var H = (res && res.history) || [];
    if (!H.length) { B.innerHTML = '<div class="muted">' + (res && res.error ? "Could not load history." : "No history recorded.") + "</div>"; return; }
    B.innerHTML = H.map(function (v, i) {
      var o = v.object || {}, older = (H[i + 1] || {}).object || null, what = "created";
      if (older) what = o.archived && !older.archived ? "deleted" : o.name !== older.name ? "renamed from “" + older.name + "”" :

    ME.sub = s.sub || "";
    ME.isAdmin = (s.roles || []).some(function (r) { return r === "platform.tenant-admin" || r === "platform.steward" || r === "admin"; });
    WS.init({ onStep: step, onTab: function (t) { RTAB = t; renderRight(); },
              onCloseRight: function () { SEL = null; document.querySelectorAll("#fx-drop tbody tr.sel").forEach(function (t) { t.classList.remove("sel"); }); renderCrumbs(); } });
    document.getElementById("fx-new").onclick = function (e) {
      WS.menu(e.currentTarget, [
        { icon: "⬆︎", label: "Upload files", onClick: pickFiles },
        { icon: "📁", label: "Upload a folder", onClick: pickFolder },
        { icon: "＋", label: "New folder", onClick: function () { if (MODE !== "folder") go("folder", CWD); newFolder(); } }
      ]);
    };
    document.getElementById("fx-up").onclick = pickFiles;
    document.getElementById("fx-newfolder").onclick = function () { if (MODE !== "folder") go("folder", CWD); newFolder(); };
    document.getElementById("fx-upcancel").onclick = function () { CANCEL = true; document.getElementById("fx-upcount").textContent = "Stopping after this file…"; };
    document.getElementById("fx-file").onchange = onFiles;
    document.getElementById("fx-dir").onchange = onFiles;
    document.getElementById("fx-refresh").onclick = refresh;
    document.querySelectorAll(".ws-nav-item[data-v]").forEach(function (b) { b.onclick = function () { go(b.dataset.v, b.dataset.v === "folder" ? "/" : null); }; });
    var srch = document.getElementById("ws-search");
    srch.oninput = function () { Q = srch.value.trim(); if (Q) { MODE = "search"; SEL = null; WS.closeRight(); render(); } else go("folder"); };
    srch.onkeydown = function (e) { if (e.key === "Escape") { srch.value = ""; go("folder"); } if (e.key === "Enter" && ROWS[0]) select(ROWS[0].id); };
    // Organisation-to-organisation transfers stay an admin action until per-person sharing (ADR-0103-R1) ships.
    var sharesBtn = document.getElementById("fx-shares");
    if (ME.isAdmin) { sharesBtn.hidden = false; sharesBtn.onclick = openShares; }
    wireDrop();
    wireViewer();
    refresh();
  });
})();
</script>
</body>
</html>
