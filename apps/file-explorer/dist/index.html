<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Files</title>
<link rel="stylesheet" href="/shared/aos.css">
<style>
  /* App-specific only — tokens, base components + themes come from aos.css */
  .fx-wrap { max-width: 960px; margin: 0 auto; padding: 16px; }
  .fx-bar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
  .fx-bar .fx-spacer { flex: 1; }
  .fx-up { position: fixed; right: 16px; bottom: 16px; width: 320px; max-width: calc(100vw - 32px); z-index: 50;
           background: var(--surface, #fff); color: var(--text, #0f172a); border: 1px solid var(--border, #e2e8f0);
           border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,.18); padding: 12px 14px; font-size: 13px; }
  .fx-up[hidden] { display: none; }
  .fx-up-top { display: flex; align-items: center; gap: 8px; }
  .fx-up-top b { flex: 1; font-variant-numeric: tabular-nums; }
  .fx-up-name { color: var(--muted, #64748b); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin: 6px 0 8px; }
  .fx-up-bar { height: 6px; border-radius: 3px; background: var(--surface-2, #e2e8f0); overflow: hidden; }
  .fx-up-bar i { display: block; height: 100%; width: 0; background: var(--accent, #2563eb); transition: width .2s; }
  .fx-up-note { color: var(--muted, #64748b); font-size: 12px; margin-top: 8px; }
  .fx-crumbs { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; font-size: 14px; margin-bottom: 12px; }
  .fx-crumbs a { color: var(--accent, #2563eb); cursor: pointer; text-decoration: none; }
  .fx-crumbs a:hover { text-decoration: underline; }
  .fx-crumbs .sep { color: var(--muted, #888); }
  .fx-list { border: 1px solid var(--border, #e2e2e2); border-radius: 10px; overflow: hidden; }
  .fx-row { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-top: 1px solid var(--border, #eee); }
  .fx-row:first-child { border-top: none; }
  .fx-row:hover { background: var(--surface-2, rgba(0,0,0,.03)); }
  .fx-ico { font-size: 20px; width: 24px; text-align: center; flex: none; }
  .fx-name { flex: 1; min-width: 0; }
  .fx-name .n { font-weight: 500; cursor: pointer; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .fx-name .n.file { cursor: default; font-weight: 400; }
  .fx-name a.n { color: var(--accent, #2563eb); }
  .fx-meta { color: var(--muted, #888); font-size: 12px; font-variant-numeric: tabular-nums; flex: none; min-width: 88px; text-align: right; }
  .fx-acts { display: flex; gap: 2px; flex: none; }
  .fx-acts button { background: none; border: none; cursor: pointer; font-size: 15px; padding: 4px 6px; border-radius: 6px; color: var(--muted, #777); }
  .fx-acts button:hover { background: var(--surface-3, rgba(0,0,0,.06)); color: var(--txt, inherit); }
  .fx-acts button.danger:hover { color: #c0392b; }
  .fx-empty { text-align: center; color: var(--muted, #888); padding: 48px 16px; }
  .fx-empty .big { font-size: 40px; margin-bottom: 8px; }
  .fx-star.on { color: #e0a800; }
  .fx-drop { border: 2px dashed transparent; border-radius: 12px; transition: border-color .15s, background .15s; }
  .fx-drop.over { border-color: var(--accent, #2563eb); background: var(--surface-2, rgba(37,99,235,.05)); }
</style>
</head>
<body>
<a href="#main" class="aos-skip">Skip to content</a>
<main id="main" class="fx-wrap">
  <div class="fx-bar">
    <h1 style="margin:0;font-size:22px">📁 Files</h1>
    <span class="fx-spacer"></span>
    <button class="btn" id="fx-up" title="Upload one or more files (Ctrl/Cmd-click or Shift-click to pick several)">⬆︎ Upload files</button>
    <button class="btn" id="fx-updir" title="Upload a whole folder, keeping its sub-folders">📁 Upload folder</button>
    <button class="btn" id="fx-newfolder">➕ New folder</button>
    <button class="btn" id="fx-shares">📤 Shares</button>
    <button class="btn" id="fx-refresh" aria-label="Refresh">🔄</button>
    <input type="file" id="fx-file" multiple hidden>
    <input type="file" id="fx-dir" webkitdirectory directory multiple hidden>
  </div>
  <div class="fx-crumbs" id="fx-crumbs"></div>
  <div class="fx-drop" id="fx-drop">
    <div class="fx-list" id="fx-list"></div>
  </div>
  <div class="fx-up" id="fx-upbox" role="status" aria-live="polite" hidden>
    <div class="fx-up-top"><b id="fx-upcount">Uploading…</b><button class="btn" id="fx-upcancel">Cancel</button></div>
    <div class="fx-up-name" id="fx-upname"></div>
    <div class="fx-up-bar"><i id="fx-upbar"></i></div>
    <div class="fx-up-note">Keep Files open until this finishes — switching apps or closing the tab stops the upload. Uploading the same files again skips those already here.</div>
  </div>
</main>

<script src="/shared/i18n.js"></script>
<script src="/shared/aos.js"></script>
<script>
(function () {
  var ME = { tenant: "", sub: "", isAdmin: false };   // org→org transfer is an admin action (user→user sharing = ADR-0103, later)
  var ALL = [];         // all non-archived platform.file records (owner-scoped by the host)
  var CWD = "/";        // current folder path

  // ---- path helpers ----
  function join(dir, name) { return dir === "/" ? "/" + name : dir + "/" + name; }
  function parentOf(dir) { if (dir === "/") return "/"; var p = dir.slice(0, dir.lastIndexOf("/")); return p || "/"; }
  function segs(dir) { return dir === "/" ? [] : dir.slice(1).split("/"); }

  function ns() {
    var t = (ME.tenant || "t").toString().replace(/^ds:/, "").split(":")[0].toLowerCase().replace(/[^a-z0-9-]/g, "-");
    return t || "t";
  }
  function newId() { return "ds:" + ns() + ":file/" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
  function nowIso() { return new Date().toISOString(); }

  function fmtSize(b) {
    if (b == null) return "";
    if (b < 1024) return b + " B";
    var u = ["KB", "MB", "GB", "TB"], i = -1;
    do { b /= 1024; i++; } while (b >= 1024 && i < u.length - 1);
    return b.toFixed(b < 10 ? 1 : 0) + " " + u[i];
  }
  function fmtDate(s) { if (!s) return ""; try { return new Date(s).toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" }); } catch (e) { return ""; } }
  function esc(s) { return AOS.esc ? AOS.esc(s) : String(s == null ? "" : s); }

  function isFolder(r) { return (r.kind || "file") === "folder"; }

  // ---- data ----
  async function refresh() {
    try {
      var rows = await AOS.query("platform.file", {});
      ALL = (rows || []).filter(function (r) { return !r.archived; });
    } catch (e) { ALL = []; AOS.toast && AOS.toast("Could not load files"); }
    // if CWD no longer exists (folder deleted), climb to a valid ancestor
    while (CWD !== "/" && !folderExists(CWD)) CWD = parentOf(CWD);
    render();
  }
  function folderExists(path) {
    if (path === "/") return true;
    var name = path.slice(path.lastIndexOf("/") + 1), par = parentOf(path);
    return ALL.some(function (r) { return isFolder(r) && (r.folder || "/") === par && r.name === name; });
  }
  function childrenOf(dir) {
    var here = ALL.filter(function (r) { return (r.folder || "/") === dir; });
    here.sort(function (a, b) {
      var fa = isFolder(a), fb = isFolder(b);
      if (fa !== fb) return fa ? -1 : 1;                 // folders first
      return (a.name || "").localeCompare(b.name || "");
    });
    return here;
  }

  // ---- render ----
  function render() {
    renderCrumbs();
    var list = document.getElementById("fx-list");
    list.innerHTML = "";
    var kids = childrenOf(CWD);
    if (!kids.length) {
      list.innerHTML = '<div class="fx-empty"><div class="big">📂</div>This folder is empty.<br>Upload files or a whole folder, drag them here, or create a folder to get started.</div>';
      return;
    }
    kids.forEach(function (r) { list.appendChild(rowEl(r)); });
  }

  function renderCrumbs() {
    var c = document.getElementById("fx-crumbs");
    c.innerHTML = "";
    var root = document.createElement("a"); root.textContent = "🏠 Home"; root.onclick = function () { CWD = "/"; render(); };
    c.appendChild(root);
    var path = "";
    segs(CWD).forEach(function (s) {
      path = path + "/" + s;
      var sep = document.createElement("span"); sep.className = "sep"; sep.textContent = "›"; c.appendChild(sep);
      var a = document.createElement("a"); a.textContent = s; var target = path;
      a.onclick = function () { CWD = target; render(); };
      c.appendChild(a);
    });
  }

  function rowEl(r) {
    var row = document.createElement("div"); row.className = "fx-row";
    var ico = document.createElement("div"); ico.className = "fx-ico"; ico.textContent = isFolder(r) ? "📁" : fileIcon(r);
    var nameWrap = document.createElement("div"); nameWrap.className = "fx-name";
    if (isFolder(r)) {
      var fn = document.createElement("div"); fn.className = "n"; fn.textContent = r.name;
      fn.onclick = function () { CWD = join(CWD, r.name); render(); };
      nameWrap.appendChild(fn);
    } else {
      var a = document.createElement("a"); a.className = "n file"; a.textContent = r.name;
      a.href = fileUrl(r); a.setAttribute("download", r.name);
      nameWrap.appendChild(a);
    }
    var meta = document.createElement("div"); meta.className = "fx-meta";
    meta.textContent = isFolder(r) ? "" : (fmtSize(r.size_bytes) + " · " + fmtDate(r.updated_at || r.created_at));

    var acts = document.createElement("div"); acts.className = "fx-acts";
    if (!isFolder(r)) {
      acts.appendChild(actBtn("⬇︎", "Download", function () { window.location.href = fileUrl(r); }));
      if (ME.isAdmin) acts.appendChild(actBtn("📤", "Send to another organisation", function () { shareFile(r); }));
      var star = actBtn(r.starred ? "★" : "☆", "Star", function () { toggleStar(r); });
      star.className = "fx-star" + (r.starred ? " on" : "");
      acts.appendChild(star);
    }
    acts.appendChild(actBtn("✏︎", "Rename", function () { rename(r); }));
    var del = actBtn("🗑", "Delete", function () { confirmDelete(r, del); });
    del.className = "danger"; acts.appendChild(del);

    row.appendChild(ico); row.appendChild(nameWrap); row.appendChild(meta); row.appendChild(acts);
    return row;
  }
  function actBtn(txt, label, fn) {
    var b = document.createElement("button"); b.textContent = txt; b.title = label; b.setAttribute("aria-label", label); b.onclick = fn; return b;
  }
  function fileIcon(r) {
    var t = (r.content_type || "").toLowerCase(), n = (r.name || "").toLowerCase();
    if (t.indexOf("image") === 0) return "🖼";
    if (t.indexOf("video") === 0) return "🎬";
    if (t.indexOf("audio") === 0) return "🎵";
    if (t.indexOf("pdf") >= 0 || n.endsWith(".pdf")) return "📕";
    if (t.indexOf("zip") >= 0 || t.indexOf("gzip") >= 0 || /\.(zip|tar|gz|tgz)$/.test(n)) return "🗜";
    if (/\.(csv|xlsx?|numbers)$/.test(n) || t.indexOf("sheet") >= 0) return "📊";
    if (/\.(js|py|html?|json|yaml|yml|css|ts|md)$/.test(n)) return "📃";
    return "📄";
  }
  function fileUrl(r) {
    return "/bridge/file?id=" + encodeURIComponent(r.file_id || "") +
           "&name=" + encodeURIComponent(r.name || "file") +
           "&type=" + encodeURIComponent(r.content_type || "");
  }

  // ---- actions ----
  function pickFiles() { document.getElementById("fx-file").click(); }
  function pickFolder() { document.getElementById("fx-dir").click(); }
  var MAX_BYTES = 25 * 1024 * 1024, BUSY = false, CANCEL = false;
  function panel(show, done, total, name) {
    var box = document.getElementById("fx-upbox"); box.hidden = !show; if (!show) return;
    document.getElementById("fx-upcount").textContent = CANCEL ? "Stopping after this file…" : "Uploading " + done + " of " + total;
    document.getElementById("fx-upname").textContent = name || "";
    document.getElementById("fx-upname").title = name || "";
    document.getElementById("fx-upbar").style.width = (total ? Math.round(100 * done / total) : 0) + "%";
  }
  function warnLeave(e) { if (!BUSY) return; e.preventDefault(); e.returnValue = "An upload is still running."; return e.returnValue; }
  // A file already in `dir` with this name and size: an earlier, interrupted upload of the same folder got it.
  function alreadyHere(dir, name, size) {
    return ALL.some(function (r) { return !isFolder(r) && (r.folder || "/") === dir && r.name === name && r.size_bytes === size; });
  }
  // Files picked or dropped: {file, rel} where rel is the path inside what was picked ("Plans/2026/a.pdf", or just
  // "a.pdf"). Each file lands in CWD + rel's folder part; missing folders are created on the way.
  function fromFileList(list) {
    var out = [];
    for (var i = 0; i < list.length; i++) out.push({ file: list[i], rel: list[i].webkitRelativePath || list[i].name });
    return out;
  }
  async function onFiles(ev) {
    var input = ev && ev.target, list = input ? input.files : ev;
    var items = fromFileList(list || []);                    // a FileList from the picker (or any list of File objects)
    if (input) input.value = "";
    await uploadItems(items);
  }
  async function uploadItems(items) {
    if (!items.length) return;
    if (BUSY) { AOS.toast && AOS.toast("An upload is already running — wait for it to finish"); return; }
    var hidden = items.filter(function (it) { return it.rel.split("/").some(function (s) { return s.charAt(0) === "." || s === "Thumbs.db" || s === "desktop.ini"; }); });
    var big = items.filter(function (it) { return hidden.indexOf(it) < 0 && it.file.size > MAX_BYTES; });
    var todo = items.filter(function (it) { return hidden.indexOf(it) < 0 && big.indexOf(it) < 0; });
    BUSY = true; CANCEL = false; var ok = 0, failed = [], made = {}, base = CWD, have = 0, stopped = 0;
    window.addEventListener("beforeunload", warnLeave);
    try {
      for (var i = 0; i < todo.length; i++) {
        if (CANCEL) { stopped = todo.length - i; break; }
        var it = todo[i], parts = it.rel.split("/").filter(Boolean), name = parts.pop() || it.file.name;
        panel(true, i, todo.length, name);
        try {
          var dir = base;
          for (var k = 0; k < parts.length; k++) dir = await ensureFolder(dir, parts[k].replace(/[\/]/g, "-"), made);
          if (alreadyHere(dir, name, it.file.size)) { have++; continue; }
          await uploadOne(it.file, dir, name); ok++;
        } catch (e) { failed.push(name + ": " + (e && e.message || "upload failed")); }
      }
    } finally { BUSY = false; CANCEL = false; panel(false); window.removeEventListener("beforeunload", warnLeave); }
    var msg = ok + " file" + (ok === 1 ? "" : "s") + " uploaded";
    var nf = Object.keys(made).length; if (nf) msg += " into " + nf + " new folder" + (nf === 1 ? "" : "s");
    if (have) msg += " · " + have + " already here";
    if (stopped) msg += " · cancelled with " + stopped + " not uploaded";
    if (big.length) msg += " · " + big.length + " skipped (over 25 MB)";
    if (hidden.length) msg += " · " + hidden.length + " hidden or system file" + (hidden.length === 1 ? "" : "s") + " skipped";
    if (failed.length) msg += " · " + failed.length + " failed";
    AOS.toast && AOS.toast(msg);
    if (failed.length) AOS.toast && AOS.toast(failed.slice(0, 3).join(" · ") + (failed.length > 3 ? " …" : ""));
    await refresh();
  }
  // The path of folder `name` inside `dir`, creating its record when neither the loaded tree nor this upload has it.
  async function ensureFolder(dir, name, made) {
    var path = join(dir, name);
    if (made[path] || folderExists(path)) return path;
    await AOS.save({ schema: "platform.file", id: newId(), kind: "folder", name: name, folder: dir, created_at: nowIso(), updated_at: nowIso() });
    made[path] = true; return path;
  }
  // A dropped folder: walk its entries (Chrome, Edge, Firefox, Safari all expose webkitGetAsEntry on drop).
  async function fromDrop(dt) {
    var entries = [];
    for (var i = 0; i < (dt.items || []).length; i++) {
      var en = dt.items[i].webkitGetAsEntry && dt.items[i].webkitGetAsEntry(); if (en) entries.push(en);
    }
    if (!entries.length) return fromFileList(dt.files || []);
    var out = [];
    async function walk(en, prefix) {
      if (en.isFile) { var f = await new Promise(function (ok, no) { en.file(ok, no); }); out.push({ file: f, rel: prefix + f.name }); return; }
      if (!en.isDirectory) return;
      var reader = en.createReader(), batch;
      do {                                                   // readEntries returns at most ~100 at a time
        batch = await new Promise(function (ok, no) { reader.readEntries(ok, no); });
        for (var j = 0; j < batch.length; j++) await walk(batch[j], prefix + en.name + "/");
      } while (batch.length);
    }
    for (var e = 0; e < entries.length; e++) await walk(entries[e], "");
    return out;
  }
  async function uploadOne(f, dir, name) {
    dir = dir || CWD; name = name || f.name;
    if (f.size > 25 * 1024 * 1024)                           // app-host cap — fail fast with a clear message
      throw new Error("too large (" + (f.size/1048576).toFixed(1) + " MB; max 25 MB) — split the file or use a smaller export");
    var ctype = f.type || "application/octet-stream";
    var q = "?name=" + encodeURIComponent(name) + "&type=" + encodeURIComponent(ctype);
    var res = await fetch("/bridge/file-upload" + q, { method: "POST", headers: { "X-Upload-Type": ctype }, body: f });
    if (!res.ok) {                                           // surface the server's real reason, not a generic failure
      var msg = "upload failed (" + res.status + ")";
      try { var j = await res.json(); if (j && j.error) msg = j.error; } catch (_) {}
      throw new Error(msg);
    }
    var up = await res.json();                              // {file_id, filename, content_type, size}
    await AOS.save({
      schema: "platform.file", id: newId(), kind: "file",
      name: name, folder: dir, file_id: up.file_id,
      content_type: up.content_type || ctype, size_bytes: up.size,
      created_at: nowIso(), updated_at: nowIso()
    });
  }

  function newFolder() {
    AOS.form("New folder", [{ id: "name", label: "Folder name", type: "text", required: true }], {
      submitLabel: "Create",
      onSubmit: async function (v) {
        var name = (v.name || "").trim().replace(/[\/]/g, "-");
        if (!name) return;
        if (childrenOf(CWD).some(function (r) { return isFolder(r) && r.name === name; })) { AOS.toast && AOS.toast("A folder with that name already exists"); return; }
        await AOS.save({ schema: "platform.file", id: newId(), kind: "folder", name: name, folder: CWD, created_at: nowIso(), updated_at: nowIso() });
        await refresh();
      }
    });
  }

  function rename(r) {
    AOS.form("Rename", [{ id: "name", label: "Name", type: "text", required: true, value: r.name }], {
      submitLabel: "Save",
      onSubmit: async function (v) {
        var name = (v.name || "").trim().replace(/[\/]/g, "-");
        if (!name || name === r.name) return;
        var oldPath = isFolder(r) ? join(r.folder || "/", r.name) : null;
        await AOS.save(Object.assign({}, r, { name: name, updated_at: nowIso() }));
        // if a folder was renamed, re-parent its descendants (folder path is stored as a string on each child)
        if (oldPath) {
          var newPath = join(r.folder || "/", name);
          var moves = ALL.filter(function (x) { return x.id !== r.id && ((x.folder || "/") === oldPath || (x.folder || "/").indexOf(oldPath + "/") === 0); });
          for (var i = 0; i < moves.length; i++) {
            var m = moves[i];
            await AOS.save(Object.assign({}, m, { folder: (m.folder || "/").replace(oldPath, newPath), updated_at: nowIso() }));
          }
        }
        await refresh();
      }
    });
  }

  // two-click inline confirm — avoids a blocking window.confirm dialog
  function confirmDelete(r, btn) {
    if (btn._armed) { doDelete(r); return; }
    btn._armed = true; btn.textContent = "✓?"; btn.title = "Click again to confirm delete";
    setTimeout(function () { if (btn._armed) { btn._armed = false; btn.textContent = "🗑"; btn.title = "Delete"; } }, 2500);
  }
  async function doDelete(r) {
    // soft-delete (blob is immutable + content-addressed; we hide the pointer). A folder also hides its contents.
    var kill = [r];
    if (isFolder(r)) {
      var path = join(r.folder || "/", r.name);
      kill = kill.concat(ALL.filter(function (x) { return (x.folder || "/") === path || (x.folder || "/").indexOf(path + "/") === 0; }));
    }
    for (var i = 0; i < kill.length; i++) await AOS.save(Object.assign({}, kill[i], { archived: true, updated_at: nowIso() }));
    AOS.toast && AOS.toast((isFolder(r) ? "Folder" : "File") + " deleted");
    await refresh();
  }

  async function toggleStar(r) {
    await AOS.save(Object.assign({}, r, { starred: !r.starred, updated_at: nowIso() }));
    await refresh();
  }

  // ---- cross-tenant share (ADR-0085 S2) ----
  function shareFile(r) {
    AOS.form("Send “" + r.name + "” to another organisation", [
      { id: "to_tenant", label: "Recipient organisation code (tenant)", type: "text", required: true },
      { id: "purpose", label: "Purpose (optional)", type: "text" }
    ], {
      submitLabel: "Send offer",
      onSubmit: async function (v) {
        var to = (v.to_tenant || "").trim().toLowerCase();
        if (!to) return;
        try {
          var res = await AOS.post("/bridge/file-share", { app_id: AOS.appId, to_tenant: to, file_ids: [r.file_id], purpose: v.purpose || "" });
          if (res && res.error) { AOS.toast("Share failed: " + res.error); return; }
          AOS.toast("Offered to " + to + " — awaiting their admin’s acceptance");
        } catch (e) { AOS.toast("Share failed"); }
      }
    });
  }

  function fxModal(title) {
    var ov = document.createElement("div");
    ov.style.cssText = "position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:60";
    var box = document.createElement("div");
    box.style.cssText = "background:var(--bg,#fff);color:var(--txt,inherit);max-width:640px;width:92%;max-height:80vh;overflow:auto;border-radius:12px;padding:18px 20px;box-shadow:0 12px 40px rgba(0,0,0,.3)";
    var h = document.createElement("div"); h.style.cssText = "display:flex;align-items:center;margin-bottom:12px";
    var t = document.createElement("h2"); t.style.cssText = "margin:0;font-size:18px;flex:1"; t.textContent = title;
    var x = document.createElement("button"); x.className = "btn"; x.textContent = "✕"; x.onclick = function () { document.body.removeChild(ov); };
    h.appendChild(t); h.appendChild(x); box.appendChild(h);
    var body = document.createElement("div"); box.appendChild(body);
    ov.appendChild(box); ov.addEventListener("click", function (e) { if (e.target === ov) document.body.removeChild(ov); });
    document.body.appendChild(ov);
    return { body: body, close: function () { if (ov.parentNode) document.body.removeChild(ov); } };
  }

  async function openShares() {
    var m = fxModal("📤 Organisation file shares");
    m.body.innerHTML = '<p style="color:var(--muted,#888);font-size:13px;margin:0 0 10px">Files handed between organisations (tenants). A recipient organisation’s admin accepts an incoming offer. <em>Sharing with a specific person is coming separately.</em></p><p style="color:var(--muted,#888)">Loading…</p>';
    var data;
    try { data = await AOS.get("/bridge/file-shares"); }
    catch (e) { m.body.innerHTML = '<p>Could not load shares.</p>'; return; }
    var shares = data.shares || [], me = data.me, meSub = data.me_sub, isAdmin = data.is_admin;
    var incoming = shares.filter(function (s) { return s.to_tenant === me; });
    var outgoing = shares.filter(function (s) { return s.from_tenant === me && s.offered_by === meSub; });  // only shares YOU sent
    m.body.innerHTML = "";
    m.body.appendChild(shareSection("Received", incoming, me, isAdmin, m));
    m.body.appendChild(shareSection("Sent", outgoing, me, isAdmin, m));
  }

  function shareSection(label, list, me, isAdmin, m) {
    var wrap = document.createElement("div"); wrap.style.marginBottom = "16px";
    var h = document.createElement("h3"); h.style.cssText = "font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted,#888);margin:8px 0"; h.textContent = label;
    wrap.appendChild(h);
    if (!list.length) { var e = document.createElement("p"); e.style.cssText = "color:var(--muted,#888);font-size:13px;margin:4px 0"; e.textContent = "Nothing here."; wrap.appendChild(e); return wrap; }
    list.forEach(function (s) {
      var row = document.createElement("div");
      row.style.cssText = "border:1px solid var(--border,#e2e2e2);border-radius:8px;padding:10px 12px;margin-bottom:8px";
      var who = (label === "Received") ? ("from " + s.from_tenant) : ("to " + s.to_tenant);
      var names = (s.files || []).map(function (f) { return f.name; }).join(", ");
      var head = document.createElement("div"); head.style.cssText = "display:flex;align-items:center;gap:8px";
      var badge = document.createElement("span");
      var color = s.status === "accepted" ? "#1a7f37" : s.status === "declined" ? "#c0392b" : "#b08900";
      badge.style.cssText = "font-size:11px;font-weight:600;padding:2px 8px;border-radius:10px;color:#fff;background:" + color;
      badge.textContent = s.status;
      var title = document.createElement("div"); title.style.flex = "1";
      title.innerHTML = "<strong>" + esc(names || "(files)") + "</strong> <span style='color:var(--muted,#888)'>" + esc(who) + "</span>";
      head.appendChild(title); head.appendChild(badge); row.appendChild(head);
      if (s.purpose) { var p = document.createElement("div"); p.style.cssText = "font-size:12px;color:var(--muted,#888);margin-top:4px"; p.textContent = "“" + s.purpose + "”"; row.appendChild(p); }
      if (label === "Received" && s.status === "offered") {
        var acts = document.createElement("div"); acts.style.cssText = "margin-top:8px;display:flex;gap:8px";
        if (isAdmin) {
          acts.appendChild(mkbtn("Accept", true, function () { decideShare(s.id, "accept", m); }));
          acts.appendChild(mkbtn("Decline", false, function () { decideShare(s.id, "decline", m); }));
        } else {
          var note = document.createElement("span"); note.style.cssText = "font-size:12px;color:var(--muted,#888)";
          note.textContent = "A tenant admin must accept this.";
          acts.appendChild(note);
        }
        row.appendChild(acts);
      }
      if (label === "Sent" && (s.status === "offered" || s.status === "accepted")) {
        var sacts = document.createElement("div"); sacts.style.cssText = "margin-top:8px";
        var wb = mkbtn("Withdraw", false, null);
        wb.onclick = function () { withdrawShare(s, wb, m); };
        sacts.appendChild(wb);
        row.appendChild(sacts);
      }
      wrap.appendChild(row);
    });
    return wrap;
  }
  function mkbtn(label, primary, fn) {
    var b = document.createElement("button"); b.className = "btn"; b.textContent = label; b.onclick = fn;
    if (primary) b.style.cssText = "background:var(--accent,#2563eb);color:#fff";
    return b;
  }

  function withdrawShare(s, btn, m) {
    if (!btn._armed) {                                     // two-click confirm (no blocking dialog)
      btn._armed = true; btn.textContent = "Confirm?";
      setTimeout(function () { if (btn._armed) { btn._armed = false; btn.textContent = "Withdraw"; } }, 2500);
      return;
    }
    AOS.post("/bridge/file-share/withdraw", { app_id: AOS.appId, share_id: s.id }).then(function (res) {
      if (res && res.error) { AOS.toast(res.error); return; }
      AOS.toast(res.was === "accepted"
        ? "Withdrawn — note: " + s.to_tenant + " already accepted a copy"
        : "Withdrawn — " + s.to_tenant + " can no longer access it");
      m.close(); openShares();
    }).catch(function () { AOS.toast("Could not withdraw"); });
  }

  async function decideShare(shareId, decision, m) {
    try {
      var res = await AOS.post("/bridge/file-share/decide", { app_id: AOS.appId, share_id: shareId, decision: decision });
      if (res && res.error) { AOS.toast(res.error); return; }
      if (decision === "accept") { AOS.toast("Accepted — " + (res.received || 0) + " file(s) saved to “/Shared with me”"); await refresh(); }
      else AOS.toast("Declined");
      m.close(); openShares();
    } catch (e) { AOS.toast("Could not " + decision); }
  }

  // ---- drag & drop ----
  function wireDrop() {
    var d = document.getElementById("fx-drop");
    ["dragenter", "dragover"].forEach(function (ev) { d.addEventListener(ev, function (e) { e.preventDefault(); d.classList.add("over"); }); });
    ["dragleave", "drop"].forEach(function (ev) { d.addEventListener(ev, function (e) { e.preventDefault(); d.classList.remove("over"); }); });
    d.addEventListener("drop", async function (e) {
      if (!e.dataTransfer) return;
      try { await uploadItems(await fromDrop(e.dataTransfer)); }
      catch (err) { AOS.toast && AOS.toast("Could not read what was dropped — " + (err && err.message || err)); }
    });
  }

  // ---- boot ----
  AOS.boot(function (ctx) {
    var s = (ctx && ctx.session) || {};
    ME.tenant = AOS.tenant || s.tenant || "";
    ME.sub = s.sub || "";
    ME.isAdmin = (s.roles || []).some(function (r) { return r === "platform.tenant-admin" || r === "platform.steward" || r === "admin"; });
    document.getElementById("fx-up").onclick = pickFiles;
    document.getElementById("fx-updir").onclick = pickFolder;
    document.getElementById("fx-upcancel").onclick = function () { CANCEL = true; document.getElementById("fx-upcount").textContent = "Stopping after this file…"; };
    document.getElementById("fx-dir").onchange = onFiles;
    document.getElementById("fx-newfolder").onclick = newFolder;
    // Organisation-to-organisation transfers are an admin action; regular users get a clean Files app until
    // per-person sharing (ADR-0103) ships.
    var sharesBtn = document.getElementById("fx-shares");
    if (ME.isAdmin) { sharesBtn.onclick = openShares; sharesBtn.textContent = "📤 Org transfers"; }
    else { sharesBtn.style.display = "none"; }
    document.getElementById("fx-refresh").onclick = refresh;
    document.getElementById("fx-file").onchange = onFiles;
    wireDrop();
    refresh();
  });
})();
</script>
</body>
</html>
