# AN APP (kind=app) — Setup. The ONE unified setup console (ADR-0075): it discovers every solution's governed
# `platform.setup` contribution (world-readable, like viz.layer) and renders + drives its steps — install the
# solution's component closure, collect the keys it needs, run its ingest/train steps, put it on schedules — all
# through the existing governed bridges (/bridge/install · /bridge/secret · /bridge/run · /bridge/schedule ·
# /bridge/query for readiness probes). Domain-agnostic: air / flood / heat / property-tax all set up here, the
# same way. Replaces per-domain setup apps (City Setup, air-admin). Host-served SPA; all I/O via the bridge.
component_id: ds:airawat:app/setup
kind: app
version: 0.1.1   # 0.1.1: secret step supports multiple components (one key → many drivers) + asset-step note
provider: ds:airawat:developer
display_name: Setup
icon: "🧰"
roles: [tenant-admin, platform.tenant-admin]
required_schemas: [platform.setup, platform.schedule, space.aoi, cell.buildings, cell.roads,
                   demographics.population, geo.terrain, air.sensor_reading, air.feature_matrix,
                   air.model, air.quality]
