<!doctype html><html><head><meta charset="utf-8"><title>Funder Console</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{--bg:#120f0a;--pan:#1c1710;--pan2:#15110b;--edge:#3a2f1c;--ink:#fbf3e2;--dim:#c3ac86;--money:#e8c24b;--money2:#2a2210;
    --welf:#2fd0c8;--infra:#6fa2f0;--good:#3ecb7f;--gate:#f0954a;--bad:#e0736f}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:ui-sans-serif,system-ui,-apple-system,sans-serif}
  #app{position:absolute;inset:0;display:flex;flex-direction:column;overflow:hidden}
  header{padding:13px 22px;border-bottom:1px solid var(--edge);display:flex;gap:16px;align-items:center;flex-wrap:wrap}
  header .k{font:11px ui-monospace,monospace;letter-spacing:.2em;text-transform:uppercase;color:var(--money)}
  header h1{margin:2px 0 0;font-family:ui-serif,Georgia,serif;font-size:21px;font-weight:600}
  header .sp{margin-left:auto;display:flex;gap:8px;align-items:center}
  .btn{padding:9px 14px;border-radius:9px;border:1px solid var(--money);background:linear-gradient(180deg,#e8c24b22,#e8c24b10);color:#f6e7bf;font-size:12.5px;font-weight:650;cursor:pointer}
  .btn.ghost{border-color:var(--edge);background:var(--pan);color:var(--dim)}
  .btn.teal{border-color:var(--welf);background:linear-gradient(180deg,#2fd0c822,#2fd0c810);color:#bff}
  .btn:disabled{opacity:.5}
  #msg{font-size:12px;color:var(--dim);padding:6px 22px;min-height:15px}
  main{flex:1;overflow:auto;padding:14px 22px 40px}
  h2{font:11px ui-monospace,monospace;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);margin:22px 0 12px}
  h2:first-child{margin-top:4px}
  .progs{display:flex;gap:12px;flex-wrap:wrap}
  .prog{background:var(--pan);border:1px solid var(--edge);border-radius:13px;padding:14px 16px;min-width:250px;flex:1}
  .prog h3{margin:0 0 3px;font-size:15px}
  .prog .env{font-size:22px;font-weight:800;color:var(--money);font-variant-numeric:tabular-nums}
  .prog .co{margin-top:8px;display:flex;gap:6px;flex-wrap:wrap}
  .chip{font:11px ui-monospace,monospace;background:var(--pan2);border:1px solid var(--edge);border-radius:6px;padding:2px 8px;color:var(--dim)}
  .chip b{color:var(--ink)}
  .stackc{background:var(--pan);border:1px solid var(--edge);border-radius:14px;padding:15px 17px;margin-bottom:12px}
  .stackc .top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
  .stackc .top .p{font-size:14px;font-weight:600}
  .stackc .top .p .d{font:11px ui-monospace,monospace;color:var(--dim)}
  .pill{padding:3px 9px;border-radius:999px;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;white-space:nowrap}
  .pill.funded{background:#0e2b1c;color:var(--good);border:1px solid #1f5c33}
  .pill.gap{background:#2a2210;color:var(--money);border:1px solid #5c451f}
  .stackbar{display:flex;height:34px;border-radius:9px;overflow:hidden;border:1px solid var(--edge);margin:11px 0 4px;background:#0f0c07}
  .seg{display:flex;align-items:center;justify-content:center;color:#120f0a;font-size:11.5px;font-weight:700;white-space:nowrap;min-width:2px}
  .scale{display:flex;justify-content:space-between;font:10.5px ui-monospace,monospace;color:var(--dim)}
  .awards{margin-top:12px;display:flex;flex-direction:column;gap:8px}
  .aw{display:flex;align-items:center;gap:11px;padding:9px 11px;border:1px solid var(--edge);border-radius:11px;background:var(--pan2);flex-wrap:wrap}
  .aw .f{flex:1;min-width:150px}.aw .f b{font-size:13px}.aw .f .d{font:10.5px ui-monospace,monospace;color:var(--dim)}
  .aw .amt{font-weight:800;color:var(--money);font-variant-numeric:tabular-nums}
  .aw .rel{display:flex;gap:6px;align-items:center}
  .aw input{width:66px;padding:7px;border-radius:8px;border:1px solid var(--edge);background:var(--pan);color:var(--ink);font-size:12.5px}
  .aw .mine{border-color:var(--money)}
  .bargate{font-size:11px;margin-top:4px}
  .empty{color:var(--dim);font-size:13px;padding:22px;text-align:center;border:1px dashed var(--edge);border-radius:12px}
  details.ops{margin-top:22px;background:var(--pan);border:1px solid var(--edge);border-radius:14px;padding:6px 16px}
  details.ops summary{cursor:pointer;font:700 12px ui-monospace,monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);padding:10px 0}
  .form{display:grid;grid-template-columns:repeat(5,1fr);gap:9px;align-items:end;padding:6px 0 14px}
  @media(max-width:820px){.form{grid-template-columns:1fr 1fr}}
  .form label{font-size:11px;color:var(--dim);display:flex;flex-direction:column;gap:4px}
  .form input,.form select{padding:9px;border-radius:9px;border:1px solid var(--edge);background:var(--pan2);color:var(--ink);font-size:12.5px}
  .sub{font:700 10.5px ui-monospace,monospace;color:var(--money);grid-column:1/-1;margin-top:4px}
  .load{position:absolute;inset:0;display:grid;place-items:center;background:var(--bg);z-index:9;color:var(--dim)}
</style></head><body>
<div id="app">
  <header>
    <div><div class="k" id="eyebrow">Federated Funding · ADR-0072</div><h1>Funder Console</h1></div>
    <div class="sp"><button class="btn ghost" id="refresh">↻ Refresh</button></div>
  </header>
  <div id="msg"></div>
  <main id="main"><div class="empty">loading…</div></main>
</div>
<div class="load" id="load0">loading…</div>
<script>
const $=id=>document.getElementById(id), esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let APPID="funder-console", TENANT=null, PROGRAMS=[], AWARDS=[], STACKS={}, MONITOR=null;
const cr=n=>n==null?"—":"₹"+Number(n).toLocaleString("en-IN",{maximumFractionDigits:2})+"cr";
const tenantOf=id=>{const p=String(id).split(":");return p.length>2&&p[0]==="ds"?p[1]:"";};
const slug=id=>String(id).split("/").slice(-1)[0];
const FCOL={};const PALETTE=["#e8c24b","#6fa2f0","#2fd0c8","#c98adf","#e0863a"];
function fcol(f){ if(!FCOL[f]) FCOL[f]=PALETTE[Object.keys(FCOL).length%PALETTE.length]; return FCOL[f]; }
async function bridge(p,b){const r=await fetch(p,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(b||{}),credentials:"include"});if(!r.ok){let t="";try{t=(await r.json()).error||"";}catch(e){}throw new Error(t||(p+" "+r.status));}return r.json();}
async function q(schema){try{const d=await bridge("/bridge/query",{app_id:APPID,schema,limit:300});return (d.results||d.objects||d||[]).map(x=>x.object||x);}catch(e){return [];}}

function funderTenants(){
  const s=new Set([TENANT]);
  PROGRAMS.forEach(p=>(p.co_funders||[]).forEach(c=>{const t=tenantOf(c.funder);if(t)s.add(t);}));
  AWARDS.forEach(a=>{const t=tenantOf(a.funder);if(t)s.add(t);});
  return [...s];
}
function progCard(p){
  return `<div class="prog"><h3>${esc(p.title||p.scheme||slug(p.id))}</h3>
    <div class="env">${cr(p.envelope_cr)}</div><div class="d" style="font-size:11px;color:var(--dim)">envelope · ${esc(p.scheme||'')}</div>
    <div class="co">${(p.co_funders||[]).map(c=>`<span class="chip"><b>${esc(tenantOf(c.funder)||c.funder)}</b> ${Math.round((c.share||0)*100)}%</span>`).join("")||'<span class="chip">no co-funders</span>'}</div></div>`;
}
function stackCard(proposal){
  const s=STACKS[proposal]||{}; const bd=s.breakdown||[];
  const ask=s.ask_cr||0, committed=s.committed_cr||0;
  const segs=bd.map(a=>{const w=ask?Math.min(100,(a.amount_cr||0)/ask*100):0;
    return `<div class="seg" style="flex:0 0 ${w}%;background:${fcol(a.funder)}" title="${esc(a.funder)}">${w>12?(tenantOf(a.funder)||'')+' '+cr(a.amount_cr):''}</div>`;}).join("");
  const gapPct=ask&&committed<ask?(ask-committed)/ask*100:0;
  const gapSeg=gapPct>0?`<div class="seg" style="flex:0 0 ${gapPct}%;background:#241d0d;color:var(--dim)">${gapPct>10?'gap '+cr(ask-committed):''}</div>`:'';
  const awrows=bd.map(a=>{
    const mine=tenantOf(a.funder)===TENANT, rel=a.released_cr||0, remaining=(a.amount_cr||0)-rel;
    const aid=`ds:${tenantOf(a.funder)}:funding/award/${slug(proposal)}-${slug(a.funder)}`;
    return `<div class="aw"><div class="f"><b>${esc(tenantOf(a.funder)||a.funder)}</b> ${a.share!=null?'· '+Math.round(a.share*100)+'%':''}
        <div class="d">${esc(a.status||'committed')} · released ${cr(rel)} / ${cr(a.amount_cr)}</div></div>
      <div class="amt">${cr(a.amount_cr)}</div>
      ${mine?`<div class="rel"><input class="mine" type="number" min="0" step="1" value="${Math.round(Math.min(remaining, (a.amount_cr||0)/2))}" data-amt="${esc(aid)}">
        <button class="btn teal" data-rel="${esc(aid)}" ${remaining<=0?'disabled':''}>Release ▸</button></div>`
        :`<span class="chip">co-funder</span>`}</div>`;}).join("");
  return `<div class="stackc"><div class="top"><div class="p">Proposal <span class="d">${esc(slug(proposal))}</span></div>
      <span class="pill ${s.funded?'funded':'gap'}">${s.funded?'FULLY FUNDED':cr(s.gap_cr)+' gap'}</span></div>
    <div class="stackbar">${segs}${gapSeg}</div>
    <div class="scale"><span>₹0</span><span>${committed>=ask&&ask>0?'Σ awards ≥ ask ✓':cr(committed)+' committed'}</span><span>${cr(ask)}</span></div>
    <div class="awards">${awrows}</div></div>`;
}
function monitorSection(){
  const projs=(MONITOR&&MONITOR.projects)||[];
  if(!projs.length) return "";
  return `<h2>Monitoring · progress subscriptions &amp; milestone credentials</h2>`+projs.map(p=>{
    const s=p.subscription;
    const spill = s? `<span class="pill ${s.status==='active'?'funded':'gap'}">${s.status==='active'?'SUBSCRIBED':'REVOKED'}</span>` : `<span class="chip">no subscription</span>`;
    const vcs=(p.vcs||[]).map(v=>`<span class="chip" style="border-color:${v.verified?'var(--welf)':'var(--bad)'};color:${v.verified?'var(--welf)':'var(--bad)'}">${v.verified?'✓':'✗'} VC · ${esc(v.milestone||'milestone')} · <b>${esc((v.issuer||'').toUpperCase())}</b></span>`).join("")||'<span class="chip">no milestone VC received yet</span>';
    return `<div class="stackc"><div class="top"><div class="p">Project <span class="d">${esc(slug(p.project))}</span></div>${spill}</div>
      <div style="margin-top:5px;font-size:12px;color:var(--dim)">provider <b style="color:var(--ink)">${esc((p.provider||'').toUpperCase())}</b> · read scope ${s?esc((s.scope||[]).join(', ')):'—'}</div>
      <div style="margin-top:9px;display:flex;gap:6px;flex-wrap:wrap">${vcs}</div></div>`;
  }).join("");
}
function render(){
  const props=[...new Set(AWARDS.map(a=>a.proposal))];
  $("main").innerHTML =
    `<h2>Programmes we publish</h2><div class="progs">${PROGRAMS.length?PROGRAMS.map(progCard).join(""):'<div class="empty">No programmes yet — publish one below.</div>'}</div>`
    +`<h2>Funding stacks · awards toward proposals</h2>${props.length?props.map(stackCard).join(""):'<div class="empty">No awards yet.</div>'}`
    +monitorSection()
    +opsDrawer();
  document.querySelectorAll("[data-rel]").forEach(btn=>btn.onclick=()=>release(btn.dataset.rel));
  const pa=$("op_add"); if(pa) pa.onclick=publishProgram;
  const aw=$("op_award"); if(aw) aw.onclick=issueAward;
}
function opsDrawer(){
  const progOpts=PROGRAMS.map(p=>`<option value="${esc(p.id)}">${esc(p.title||slug(p.id))}</option>`).join("");
  return `<details class="ops"><summary>⚙ Operator actions — publish a programme / issue an award</summary>
    <div class="form"><div class="sub">Publish programme</div>
      <label>Title<input id="pg_title" value="PMAY-U (in-situ redevelopment)"></label>
      <label>Scheme<input id="pg_scheme" value="PMAY-U"></label>
      <label>Envelope ₹cr<input id="pg_env" type="number" value="50000"></label>
      <label>My share<input id="pg_share" type="number" step="0.05" value="0.6"></label>
      <label>&nbsp;<button class="btn" id="op_add">Publish</button></label>
    </div>
    <div class="form"><div class="sub">Issue an award (my tenant commits its share)</div>
      <label>Programme<select id="aw_prog">${progOpts}</select></label>
      <label>Proposal id<input id="aw_prop" value="ds:kmc:project/proposal/residential-crowding-relief--v2"></label>
      <label>Share<input id="aw_share" type="number" step="0.05" value="0.6"></label>
      <label>Amount ₹cr<input id="aw_amt" type="number" value="108"></label>
      <label>&nbsp;<button class="btn" id="op_award">Award ▸</button></label>
    </div></details>`;
}
async function loadStacks(){
  const funders=funderTenants(); const props=[...new Set(AWARDS.map(a=>a.proposal))];
  for(const p of props){ try{ STACKS[p]=await bridge("/bridge/funding-stack",{proposal:p,funders}); }catch(e){ STACKS[p]={error:e.message}; } }
}
async function load(){
  $("msg").textContent="loading…";
  PROGRAMS=await q("funding.program"); AWARDS=await q("funding.award");
  await loadStacks();
  try{ MONITOR=await bridge("/bridge/funding-monitor",{funder:`ds:${TENANT}:agency/${TENANT}`}); }catch(e){ MONITOR=null; }
  $("msg").textContent=""; render();
}
async function release(awardId){
  const amt=parseFloat((document.querySelector(`[data-amt="${awardId}"]`)||{}).value)||0;
  $("msg").textContent="releasing tranche (checking milestone gate cross-tenant)…";
  try{ const r=await bridge("/bridge/funding-release-tranche",{award:awardId,amount_cr:amt});
    if(r.gate==="OPEN") $("msg").textContent=`✓ gate OPEN · released ${cr(r.released)} · verified by ${slug(r.verified_by)} · txn ${slug(r.transaction)}`;
    else $("msg").textContent=`⛔ ${r.gate||'blocked'} — ${r.error||''}`;
    await load(); }
  catch(e){ $("msg").textContent="release failed: "+e.message; }
}
async function publishProgram(){
  const share=parseFloat($("pg_share").value)||0.6;
  const body={funder:`ds:${TENANT}:agency/${TENANT}`,title:$("pg_title").value,scheme:$("pg_scheme").value,
    envelope_cr:parseFloat($("pg_env").value)||0,co_funders:[{funder:`ds:${TENANT}:agency/${TENANT}`,share}]};
  $("msg").textContent="publishing programme…";
  try{ await bridge("/bridge/funding-publish-program",body); $("msg").textContent="✓ programme published"; await load(); }
  catch(e){ $("msg").textContent="publish failed: "+e.message; }
}
async function issueAward(){
  const body={program:$("aw_prog").value,proposal:$("aw_prop").value,funder:`ds:${TENANT}:agency/${TENANT}`,
    share:parseFloat($("aw_share").value)||null,amount_cr:parseFloat($("aw_amt").value)||0};
  $("msg").textContent="issuing award…";
  try{ const r=await bridge("/bridge/funding-award",body); $("msg").textContent=`✓ award issued ${cr(r.amount_cr)} (my stack sees ${cr(r.committed_cr)})`; await load(); }
  catch(e){ $("msg").textContent="award failed: "+e.message; }
}
$("refresh").onclick=load;
(async()=>{
  try{
    const cfg=await fetch("./config.json").then(r=>r.json()).catch(()=>({})); APPID=cfg.app_id||APPID; TENANT=cfg.tenant||null;
    if(TENANT) $("eyebrow").textContent="Federated Funding · "+TENANT.toUpperCase();
    await load(); $("load0").remove();
  }catch(e){ $("load0").textContent="error: "+e.message; }
})();
</script></body></html>
