<!doctype html><meta charset="utf-8"><title>Network Admin</title>
<style>
  :root{--bg:#0a0f16;--card:#111823;--line:#1e2733;--ink:#e6edf3;--dim:#8b949e;--accent:#7c93ff;--gold:#e3b341}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  header{padding:12px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;background:linear-gradient(180deg,#0e1622,#0a0f16)}
  h1{margin:0;font-size:16px} h1 b{color:var(--accent)} .sub{color:var(--dim);font-size:12px} .who{margin-left:auto;color:var(--dim);font-size:12px}
  /* mental-model rail: The Language (nouns·verbs·roles·packs) · Participants · Governance */
  .shell{display:flex;height:calc(100vh - 54px)}
  .rail{width:212px;min-width:212px;border-right:1px solid var(--line);overflow:auto;background:#0b0f16;padding:4px 0 16px}
  .rgrp{font:700 10px/1.2 system-ui;letter-spacing:.11em;text-transform:uppercase;color:#6b7684;padding:16px 16px 7px;display:flex;align-items:baseline;gap:6px}
  .rgrp .rgh{font-weight:400;letter-spacing:.02em;text-transform:none;color:#4a5563;font-size:10px}
  .ritem{display:flex;align-items:baseline;gap:8px;padding:8px 16px;cursor:pointer;color:var(--ink);font-size:13.5px;border-left:2px solid transparent;user-select:none}
  .ritem:hover{background:#111823}
  .ritem.on{background:#16202e;border-left-color:var(--accent);color:#fff;font-weight:500}
  .ritem .rh{margin-left:auto;color:var(--dim);font-size:10.5px;font-family:ui-monospace,Menlo,monospace}
  .wrap{flex:1;padding:16px 22px;overflow:auto}
  .lbl{color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.05em;margin:6px 0 10px}
  .hint{color:var(--dim);font-size:12px;margin:-4px 0 14px;max-width:640px}
  table{width:100%;max-width:900px;border-collapse:collapse;font-size:13px}
  th,td{border-bottom:1px solid #171f2a;padding:9px 12px;text-align:left}
  th{color:var(--dim);font-weight:500}
  .mono{font-family:ui-monospace,Menlo,monospace}
  .pill{display:inline-block;border-radius:999px;padding:1px 9px;font-size:11px;border:1px solid}
  .pending{color:var(--gold);border-color:#6b5316;background:#241d0c}
  .approved{color:#3fb950;border-color:#1a5a2e;background:#0f2417}
  .rejected{color:#ff9b9b;border-color:#5a2327;background:#241013}
  .btn{border:1px solid var(--line);background:#16202e;color:var(--ink);border-radius:7px;padding:5px 11px;font-size:12px;cursor:pointer;margin-right:6px}
  .btn.ok{background:#123021;border-color:#1a5a2e;color:#3fb950} .btn.no{background:#241013;border-color:#5a2327;color:#ff9b9b}
  .chip{display:inline-block;background:#0a0f16;border:1px solid var(--line);border-radius:999px;padding:2px 9px;font-size:12px;margin:0 5px 5px 0}
  .muted{color:var(--dim)} .empty{color:var(--dim);padding:40px;text-align:center}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin-bottom:10px}
  .toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#0f2417;border:1px solid #1a5a2e;color:#3fb950;padding:9px 16px;border-radius:9px;font-size:13px;opacity:0;transition:opacity .2s}
  .toast.show{opacity:1} .toast.err{background:#241013;border-color:#5a2327;color:#ff9b9b}
  /* Specifications: IDE-like left nav + right detail */
  .ide{display:flex;height:calc(100vh - 98px)}
  .nav{width:280px;min-width:280px;border-right:1px solid var(--line);overflow:auto;padding:8px 0;background:#0c1119}
  .nav .srch{margin:4px 10px 8px;width:calc(100% - 20px);background:#0a0f16;border:1px solid var(--line);color:var(--ink);border-radius:7px;padding:6px 9px;font-size:12px}
  .grp{margin:2px 0}
  .grp>.gh{display:flex;align-items:center;gap:6px;padding:5px 12px;cursor:pointer;color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.05em;user-select:none}
  .grp>.gh:hover{color:var(--ink)} .grp .caret{transition:transform .12s;font-size:9px} .grp.closed .caret{transform:rotate(-90deg)} .grp.closed .items{display:none}
  .sit{padding:5px 12px 5px 26px;cursor:pointer;font-size:12.5px;display:flex;align-items:center;gap:7px;border-left:2px solid transparent}
  .sit:hover{background:#111823} .sit.on{background:#16202e;border-left-color:var(--accent);color:var(--ink)}
  .sit .sv{margin-left:auto;color:var(--dim);font-size:10px}
  .det{flex:1;overflow:auto;padding:18px 22px}
  .det h2{margin:0 0 2px;font-size:17px;font-family:ui-monospace,Menlo,monospace}
  .det .meta{color:var(--dim);font-size:12px;margin-bottom:14px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .sec{color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.05em;margin:18px 0 8px;border-bottom:1px solid #171f2a;padding-bottom:5px}
  pre.defn{background:#0c1119;border:1px solid var(--line);border-radius:10px;padding:14px 16px;overflow:auto;font-family:ui-monospace,Menlo,monospace;font-size:12px;line-height:1.55;max-width:820px;color:#c9d4e0}
  .tl{list-style:none;padding:0;margin:0;max-width:640px}
  .tl li{position:relative;padding:0 0 14px 20px;border-left:1px solid var(--line)}
  .tl li:last-child{border-left-color:transparent} .tl .dot{position:absolute;left:-5px;top:3px;width:9px;height:9px;border-radius:50%;background:var(--dim);border:2px solid var(--bg)}
  .tl .dot.approved{background:#3fb950} .tl .dot.rejected{background:#ff9b9b} .tl .dot.proposed{background:var(--accent)}
  .tl .ev{font-size:13px} .tl .ev .t{text-transform:capitalize;font-weight:500} .tl .when{color:var(--dim);font-size:11px;margin-left:6px}
  .tl .by{color:var(--dim);font-size:12px} .tl .note{color:#a9b6c4;font-size:12px;font-style:italic;margin-top:2px}
  .sens{border:1px solid} .sens.public{color:#3fb950;border-color:#1a5a2e;background:#0f2417}
  .sens.internal{color:var(--accent);border-color:#2b3a4d;background:#16202e} .sens.sensitive{color:var(--gold);border-color:#6b5316;background:#241d0c}
</style>
<header><h1>🌐 Airawat<b>Network</b></h1><span class="sub">· Standards Console</span><span class="who" id="who"></span></header>
<div class="shell">
  <nav class="rail">
    <div class="rgrp">The Language <span class="rgh">the shared contract</span></div>
    <a class="ritem" data-v="specs">🧩 Nouns<span class="rh">schemas</span></a>
    <a class="ritem" data-v="verbs">🔌 Verbs<span class="rh">interfaces</span></a>
    <a class="ritem" data-v="roles">👥 Roles<span class="rh">actors</span></a>
    <a class="ritem" data-v="packs">📦 Domain Packs<span class="rh">bundles</span></a>
    <div class="rgrp">Participants</div>
    <a class="ritem" data-v="participants">🔗 Directory<span class="rh">members</span></a>
    <div class="rgrp">Governance</div>
    <a class="ritem" data-v="requests">⚖️ Change Requests<span class="rh">propose → approve</span></a>
  </nav>
  <div class="wrap" id="wrap"><div class="empty">loading…</div></div>
</div>
<div class="toast" id="toast"></div>
<script>
let VIEW='specs';   // default to Nouns — the Language (the contract) is what the console is about
async function jget(p){const r=await fetch(p);if(!r.ok)throw new Error(p+' '+r.status);return r.json();}
async function jpost(p,b){const r=await fetch(p,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});return {ok:r.ok,status:r.status,j:await r.json().catch(()=>({}))};}
function toast(m,e){const t=document.getElementById('toast');t.textContent=m;t.className='toast show'+(e?' err':'');setTimeout(()=>t.className='toast',2200);}
function esc(s){if(s==null)return '';if(typeof s!=='string')s=(s.value!=null?s.value:JSON.stringify(s));return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

function boot(){
  fetch('/session').then(r=>r.json()).then(s=>{document.getElementById('who').textContent=s.authenticated?('● '+s.sub):'';}).catch(()=>{});
  document.querySelectorAll('.ritem').forEach(el=>el.onclick=()=>setView(el.dataset.v));
  setView(VIEW);
}
function setView(v){VIEW=v;document.querySelectorAll('.ritem').forEach(x=>x.classList.toggle('on',x.dataset.v===v));render();}
function render(){ ({specs:specs,verbs:verbs,roles:()=>catalog('roles'),packs:()=>catalog('packs'),participants:participants,requests:requests}[VIEW]||specs)(); }

// --- Participant Directory: the network's roster of admitted participants (left nav by kind + detail) --
const PKIND={developer:'🛠️',vendor:'🏭',steward:'🏛️',operator:'⚙️',participant:'🔗'};
let PART_SEL=null;
function pkindOf(p){ const k=(p.kind||'participant'); if(k!=='participant')return k;
  const seg=(p.participant_id||'').split(':')[2]||''; return seg.split('/')[0]||'participant'; }
async function participants(){
  const W=document.getElementById('wrap'); W.className=''; W.innerHTML='<div class="empty">loading…</div>';
  let d; try{ d=await jpost('/bridge/participants',{}); if(!d.ok)throw new Error(d.j.error||''); d=d.j; }
  catch(e){ W.innerHTML='<div class="empty">'+(esc(e.message)||'could not load the directory')+'</div>'; return; }
  const parts=(d.participants||[]).slice().sort((a,b)=>(a.participant_id||'').localeCompare(b.participant_id||''));
  const by={}; parts.forEach(p=>{const k=pkindOf(p);(by[k]=by[k]||[]).push(p);});
  const kinds=Object.keys(by).sort();
  W.innerHTML=`<div class="ide">
    <div class="nav">
      <input class="srch" id="psrch" placeholder="filter ${parts.length} participants…">
      <div id="ptree"></div></div>
    <div class="det" id="pdet"><div class="empty">Select a participant to view its directory entry and keys.</div></div>
  </div>`;
  function drawTree(q){
    const t=document.getElementById('ptree'); q=(q||'').toLowerCase();
    t.innerHTML=kinds.map(k=>{
      const items=by[k].filter(p=>!q||(p.participant_id||'').toLowerCase().includes(q));
      if(!items.length)return '';
      return `<div class="grp"><div class="gh"><span class="caret">▼</span>${PKIND[k]||'🔗'} ${esc(k)} <span class="muted" style="margin-left:auto">${items.length}</span></div>
        <div class="items">${items.map(p=>{
          const short=(p.participant_id||'').split(':').slice(1).join(':');
          const bad=p.certificate_status&&p.certificate_status!=='valid';
          return `<div class="sit${PART_SEL===p.participant_id?' on':''}" data-pid="${esc(p.participant_id)}" title="${esc(p.participant_id)}">
            <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(short)}</span>
            <span class="sv" style="color:${bad?'#ff9b9b':'#3fb950'}">${bad?'✕':'✓'}</span></div>`;
        }).join('')}</div></div>`;
    }).join('')||'<div class="empty" style="padding:20px">no match</div>';
    t.querySelectorAll('.gh').forEach(h=>h.onclick=()=>h.parentElement.classList.toggle('closed'));
    t.querySelectorAll('.sit').forEach(el=>el.onclick=()=>{PART_SEL=el.dataset.pid;t.querySelectorAll('.sit').forEach(x=>x.classList.remove('on'));el.classList.add('on');showPart(el.dataset.pid);});
  }
  drawTree('');
  document.getElementById('psrch').oninput=e=>drawTree(e.target.value);
  if(PART_SEL){ const el=document.querySelector(`.sit[data-pid="${CSS.escape(PART_SEL)}"]`); if(el){el.classList.add('on');showPart(PART_SEL);} }
}
async function showPart(pid){
  const D=document.getElementById('pdet'); D.innerHTML='<div class="empty">loading…</div>';
  const rec=await jpost('/bridge/participant-resolve',{participant_id:pid}).then(r=>r.ok?r.j:null).catch(()=>null);
  if(!rec){ D.innerHTML='<div class="empty">could not resolve this participant</div>'; return; }
  const kind=rec.kind||'participant';
  const cs=rec.certificate_status||'unknown'; const csBad=cs!=='valid';
  const keys=rec.keys||[];
  D.innerHTML=`<h2>${esc((pid.split(':').slice(1).join(':')))}</h2>
    <div class="meta"><span class="pill" style="border:1px solid #2b3a4d;color:var(--accent);background:#16202e">${PKIND[pkindOf(rec)]||'🔗'} ${esc(kind)}</span>
      <span class="pill ${csBad?'rejected':'approved'}">cert ${esc(cs)}</span>
      ${rec.jurisdiction?`<span>· jurisdiction <b>${esc(rec.jurisdiction)}</b></span>`:''}
      <span>· ${keys.length} key(s)</span></div>
    <div class="sec">Keys</div>
    ${keys.length?keys.map(k=>`<div class="card"><div class="mono" style="font-size:11px;color:var(--dim)">${esc(k.id||'')}</div>
      <div style="margin-top:6px;display:flex;gap:8px;flex-wrap:wrap;align-items:center">
        <span class="pill" style="border:1px solid var(--line);color:var(--dim)">${esc(k.algorithm||'')}</span>
        <span class="pill ${(k.status==='active')?'approved':'rejected'}">${esc(k.status||'')}</span>
        <span class="muted" style="font-size:11px">v${esc(k.version||'')}${k.valid_time&&k.valid_time.from?' · from '+esc(k.valid_time.from):''}</span></div>
      <div class="mono" style="margin-top:8px;font-size:11px;word-break:break-all;color:#a9b6c4">${esc(k.public_key||'')}</div></div>`).join('')
    :'<div class="muted">no keys</div>'}
    <div class="sec">Authority signature</div>
    <div class="card mono" style="font-size:11px;word-break:break-all;color:#a9b6c4">${esc(rec.signature||'—')}</div>
    <div class="sec">Signed directory entry</div>
    <pre class="defn">${esc(JSON.stringify(rec,null,2))}</pre>`;
}

// --- Specifications: IDE-like left nav (schemas by domain) + right panel (definition + history) -------
let SPEC_SEL=null;
async function specs(){
  const W=document.getElementById('wrap'); W.className=''; W.innerHTML='<div class="empty">loading…</div>';
  let d; try{ d=await jpost('/bridge/schemas',{}); if(!d.ok)throw 0; d=d.j; }catch(e){ W.innerHTML='<div class="empty">could not load the catalog</div>'; return; }
  const schemas=(d.schemas||[]).slice().sort((a,b)=>(a.schema_id||'').localeCompare(b.schema_id||''));
  const pend=d.pending||[];
  const by={}; schemas.forEach(s=>{const k=(s.schema_id||'').split('.')[0]||'other';(by[k]=by[k]||[]).push(s);});
  const domains=Object.keys(by).sort();
  W.innerHTML=`<div class="ide">
    <div class="nav">
      <input class="srch" id="ssrch" placeholder="filter ${schemas.length} schemas…">
      <div id="tree"></div></div>
    <div class="det" id="sdet"><div class="empty">Select a specification to view its definition and history.</div>
      ${pend.length?`<div class="sec" style="margin-top:0">${pend.length} pending proposal(s)</div>`:''}</div>
  </div>`;
  function drawTree(q){
    const t=document.getElementById('tree'); q=(q||'').toLowerCase();
    t.innerHTML=domains.map(dom=>{
      const items=by[dom].filter(s=>!q||(s.schema_id||'').toLowerCase().includes(q));
      if(!items.length)return '';
      return `<div class="grp" data-dom="${esc(dom)}"><div class="gh"><span class="caret">▼</span>🧩 ${esc(dom)} <span class="muted" style="margin-left:auto">${items.length}</span></div>
        <div class="items">${items.map(s=>{
          const p=pend.some(r=>r.schema_id===s.schema_id);
          return `<div class="sit${SPEC_SEL===s.schema_id?' on':''}" data-sid="${esc(s.schema_id)}">${esc(s.schema_id)}${p?' <span class="pill pending" style="font-size:9px;padding:0 6px">upd</span>':''}<span class="sv">v${esc(s.version||'')}</span></div>`;
        }).join('')}</div></div>`;
    }).join('')||'<div class="empty" style="padding:20px">no match</div>';
    t.querySelectorAll('.gh').forEach(h=>h.onclick=()=>h.parentElement.classList.toggle('closed'));
    t.querySelectorAll('.sit').forEach(el=>el.onclick=()=>{SPEC_SEL=el.dataset.sid;t.querySelectorAll('.sit').forEach(x=>x.classList.remove('on'));el.classList.add('on');showSpec(el.dataset.sid);});
  }
  drawTree('');
  document.getElementById('ssrch').oninput=e=>drawTree(e.target.value);
  if(SPEC_SEL){ const el=document.querySelector(`.sit[data-sid="${CSS.escape(SPEC_SEL)}"]`); if(el){el.classList.add('on');showSpec(SPEC_SEL);} }
}
async function showSpec(sid){
  const D=document.getElementById('sdet'); D.innerHTML='<div class="empty">loading…</div>';
  const [rec,hist]=await Promise.all([
    jpost('/bridge/schema-resolve',{schema_id:sid}).then(r=>r.j).catch(()=>({})),
    jpost('/bridge/schema-history',{schema_id:sid}).then(r=>r.j).catch(()=>({versions:[],events:[]}))
  ]);
  const sens=rec.sensitivity||'internal';
  const defn=rec.definition||{};
  const versions=hist.versions||[]; const events=hist.events||[];
  D.innerHTML=`<h2>${esc(sid)}</h2>
    <div class="meta"><span class="pill sens ${sens}">${sens}</span>
      <span>latest <b>v${esc(rec.version||'—')}</b></span>
      <span>· ${versions.length} version(s)</span>
      <span>· issued by ${esc((rec.issued_by||'').split('/').pop()||'—')}</span>
      ${rec.definition_digest?`<span class="mono" style="font-size:10px" title="${esc(rec.definition_digest)}">· ${esc((rec.definition_digest||'').slice(0,18))}…</span>`:''}</div>
    <div class="sec">Definition (JSON Schema)</div>
    <pre class="defn">${esc(JSON.stringify(defn,null,2))}</pre>
    <div class="sec">History — governance provenance</div>
    ${events.length?`<ul class="tl">${events.map(ev=>`<li><span class="dot ${ev.type}"></span>
        <div class="ev"><span class="t">${esc(ev.type)}</span> <span class="mono">v${esc(ev.version||'')}</span><span class="when">${fmt(ev.at)}</span></div>
        <div class="by">${ev.type==='proposed'?'by ':'by '}${esc((ev.actor||'').replace(/^user:\/\//,''))}</div>
        ${ev.justification?`<div class="note">“${esc(ev.justification)}”</div>`:''}${ev.reason?`<div class="note">${esc(ev.reason)}</div>`:''}</li>`).join('')}</ul>`
      :'<div class="muted">no recorded change-requests — this schema predates the request ledger.</div>'}`;
}
function fmt(iso){ if(!iso)return ''; try{return new Date(iso).toLocaleString(undefined,{dateStyle:'medium',timeStyle:'short'});}catch(e){return iso;} }

// --- Verbs: the governed INTERFACE catalog — APIs / messages / events ---------------------
const MICON={request:'⇄',event:'📣',stream:'⇉'};
let VERB_SEL=null;
async function verbs(){
  const W=document.getElementById('wrap'); W.className=''; W.innerHTML='<div class="empty">loading…</div>';
  let d; try{ d=await jpost('/bridge/interfaces',{}); if(!d.ok)throw 0; d=d.j; }catch(e){ W.innerHTML='<div class="empty">could not load the interface catalog</div>'; return; }
  const ifs=(d.interfaces||[]).slice().sort((a,b)=>(a.interface_id||'').localeCompare(b.interface_id||''));
  const by={}; ifs.forEach(s=>{const k=(s.interface_id||'').split('.')[0]||'other';(by[k]=by[k]||[]).push(s);});
  const domains=Object.keys(by).sort();
  W.innerHTML=`<div class="ide">
    <div class="nav"><input class="srch" id="vsrch" placeholder="filter ${ifs.length} interfaces…"><div id="vtree"></div></div>
    <div class="det" id="vdet">
      ${ifs.length?'<div class="empty">Select an interface to view its request/response contract.</div>'
        :'<div class="empty">No interfaces yet. A <b>Verb</b> is a request/response (API) or event/message contract a capability exposes — the third leg of the language, alongside Nouns (schemas) and Roles (actors).</div>'}
    </div></div>`;
  function draw(q){
    const t=document.getElementById('vtree'); q=(q||'').toLowerCase();
    t.innerHTML=domains.map(dom=>{
      const items=by[dom].filter(s=>!q||(s.interface_id||'').toLowerCase().includes(q));
      if(!items.length)return '';
      return `<div class="grp"><div class="gh"><span class="caret">▼</span>🔌 ${esc(dom)} <span class="muted" style="margin-left:auto">${items.length}</span></div>
        <div class="items">${items.map(s=>`<div class="sit${VERB_SEL===s.interface_id?' on':''}" data-iid="${esc(s.interface_id)}">${MICON[s.modality]||'⇄'} ${esc(s.interface_id)}<span class="sv">v${esc(s.version||'')}</span></div>`).join('')}</div></div>`;
    }).join('')||'<div class="empty" style="padding:20px">no match</div>';
    t.querySelectorAll('.gh').forEach(h=>h.onclick=()=>h.parentElement.classList.toggle('closed'));
    t.querySelectorAll('.sit').forEach(el=>el.onclick=()=>{VERB_SEL=el.dataset.iid;t.querySelectorAll('.sit').forEach(x=>x.classList.remove('on'));el.classList.add('on');showVerb(el.dataset.iid);});
  }
  draw('');
  const vs=document.getElementById('vsrch'); if(vs)vs.oninput=e=>draw(e.target.value);
  if(VERB_SEL){const el=document.querySelector(`.sit[data-iid="${CSS.escape(VERB_SEL)}"]`); if(el){el.classList.add('on');showVerb(VERB_SEL);}}
}
async function showVerb(iid){
  const D=document.getElementById('vdet'); D.innerHTML='<div class="empty">loading…</div>';
  const rec=await jpost('/bridge/interface-resolve',{interface_id:iid}).then(r=>r.ok?r.j:null).catch(()=>null);
  if(!rec){D.innerHTML='<div class="empty">could not resolve this interface</div>';return;}
  const defn=rec.definition||{}; const mod=rec.modality||defn.modality||'request';
  const block=(title,obj)=>obj?`<div class="sec">${title}</div><pre class="defn">${esc(JSON.stringify(obj,null,2))}</pre>`:'';
  D.innerHTML=`<h2>${esc(iid)}</h2>
    <div class="meta"><span class="pill" style="border:1px solid #6b5316;color:var(--gold);background:#241d0c">${MICON[mod]||'⇄'} ${esc(mod)}</span>
      <span>latest <b>v${esc(rec.version||'—')}</b></span>
      <span>· issued by ${esc((rec.issued_by||'').split('/').pop()||'—')}</span>
      ${rec.definition_digest?`<span class="mono" style="font-size:10px" title="${esc(rec.definition_digest)}">· ${esc((rec.definition_digest||'').slice(0,18))}…</span>`:''}</div>
    ${defn.description?`<div class="hint" style="max-width:70ch">${esc(defn.description)}</div>`:''}
    ${block(mod==='event'?'Event payload (JSON Schema)':'Request (JSON Schema)', defn.request||defn.event)}
    ${block('Response (JSON Schema)', defn.response)}
    ${(defn.errors||[]).length?`<div class="sec">Errors</div>${defn.errors.map(e=>`<div class="card"><b class="mono">${esc(e.code||'')}</b> <span class="muted">${esc(e.when||'')}</span></div>`).join('')}`:''}
    <div class="sec">Authority signature</div>
    <div class="card mono" style="font-size:11px;word-break:break-all;color:#a9b6c4">${esc(rec.signature||'—')}</div>`;
}

const KICON={role:'👤',schema:'🧩',interface:'⇄',pack:'📦',join:'🏙️'};
async function requests(){
  const W=document.getElementById('wrap'); W.className='wrap'; W.innerHTML='<div class="empty">loading…</div>';
  let d; try{ d=await jget('/bridge/change-requests'); }catch(e){ W.innerHTML='<div class="empty">not authorized — standards body only</div>'; return; }
  const reqs=d.requests||[];
  let html='<div class="lbl">Change requests — roles · schemas · domain packs</div><div class="hint">Proposals filed by developers and tenant admins to extend the specification. Approving SIGNS the role / schema / pack into the governed catalog; rejecting records a reason. This decision is the authority act.</div>';
  if(!reqs.length){ W.innerHTML=html+'<div class="muted">no requests</div>'; return; }
  html+='<table><tr><th>kind</th><th>subject</th><th>detail</th><th>requested by</th><th>status</th><th></th></tr>'+
    reqs.map((r,i)=>{
      const detail=r.kind==='pack'?`${esc(r.domain||'')} · ${(r.roles||[]).length} role(s)`:r.kind==='schema'?esc((r.justification||'').slice(0,40)):esc(r.domain||'');
      return `<tr><td>${KICON[r.kind]||''} ${esc(r.kind)}</td><td class="mono">${esc(r.subject)}</td>
      <td class="muted" style="max-width:220px">${detail}</td>
      <td class="muted">${esc((r.requested_by||'').split('/').pop())}</td>
      <td><span class="pill ${r.status}">${r.status}</span></td>
      <td><button class="btn" data-i="${i}" data-act="view">View</button>${r.status==='pending'
          ?` <button class="btn ok" data-i="${i}" data-act="approve">Approve</button><button class="btn no" data-i="${i}" data-act="reject">Reject</button>`
          :` <span class="muted mono" style="font-size:11px">${esc((r.published||r.reason||'').split('/').pop())}</span>`}</td></tr>`;
    }).join('')+'</table>';
  W.innerHTML=html;
  W.querySelectorAll('[data-act]').forEach(b=>b.onclick=async()=>{
    const r=reqs[+b.dataset.i], act=b.dataset.act;
    if(act==='view'){ return reviewReq(r); }        // never approve blind — open the full proposed artifact
    let reason='';
    if(act==='reject'){ reason=prompt('Reason for rejection?',''); if(reason===null)return; }
    await decideReq(r, act, reason);
  });
}

// decide a change-request (shared by the inline buttons and the review sheet)
async function decideReq(r, act, reason){
  const res=await jpost('/bridge/change-request-decide',{kind:r.kind,subject:r.subject,decision:act,reason:reason||''});
  res.ok?(toast(act==='approve'?'approved + published':'rejected'),requests()):toast(res.j.error||'refused',true);
}

// REVIEW a change-request in full BEFORE deciding — shows the exact proposed definition (ADR-0038 governance
// gate: the approver signs it into the catalog, so they must see precisely what they are signing).
function reviewReq(r){
  const defn=r.definition, hasDef=defn&&typeof defn==='object';
  const meta=`<div class="meta" style="margin:6px 0 4px"><span class="pill ${esc(r.status)}">${esc(r.status)}</span>
      <span>${esc(r.kind)}</span> <span class="mono">${esc(r.subject||'')}</span>
      ${r.version?`<span>· v${esc(r.version)}</span>`:''}${r.sensitivity?`<span>· ${esc(r.sensitivity)}</span>`:''}
      <span>· by ${esc((r.requested_by||'').split('/').pop()||'—')}</span>
      ${r.requested_at?`<span>· ${esc((r.requested_at||'').slice(0,10))}</span>`:''}</div>`;
  const just=r.justification?`<div class="sec">Justification</div><div class="hint" style="max-width:76ch">${esc(r.justification)}</div>`:'';
  const body=hasDef
      ?`<div class="sec">Proposed definition</div><pre class="defn" style="max-height:46vh;overflow:auto">${esc(JSON.stringify(defn,null,2))}</pre>`
      :(r.kind==='pack'||r.kind==='role')
          ?`<div class="sec">Contents</div><pre class="defn" style="max-height:46vh;overflow:auto">${esc(JSON.stringify({roles:r.roles||[],members:r.members||[],domain:r.domain||''},null,2))}</pre>`
          :`<div class="muted">No structured definition on this request.</div>`;
  const actions=r.status==='pending'
      ?`<button class="btn no" id="rj">Reject</button><button class="btn ok" id="ap">Approve + sign</button>`
      :`<span class="muted mono">${esc(r.published||r.reason||'')}</span>`;
  const ov=document.createElement('div');
  ov.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:9999;padding:22px';
  ov.innerHTML=`<div style="background:var(--panel,#131a22);border:1px solid var(--line,#233);border-radius:10px;max-width:780px;width:100%;max-height:88vh;overflow:auto;padding:18px">
      <div class="row" style="justify-content:space-between;align-items:center"><h2 style="margin:0">Review change request</h2><button class="btn" id="cl">Close</button></div>
      ${meta}${just}${(r.kind==='schema'||r.kind==='interface')?'<div id="advai" class="card" style="border-color:#3a4a5a;background:#0f1922"><span class="muted">🤖 Semantic Administrator AI — analysing…</span></div>':''}${body}
      <div class="row" style="justify-content:flex-end;gap:8px;margin-top:14px">${actions}</div></div>`;
  document.body.appendChild(ov);
  const close=()=>ov.remove();
  ov.onclick=e=>{if(e.target===ov)close();};
  ov.querySelector('#cl').onclick=close;
  // AI advisor: for a schema/interface request, show the house-rule verdict + reuse candidates + recommendation.
  if(r.kind==='schema'||r.kind==='interface'){ (async()=>{
    const box=ov.querySelector('#advai'); if(!box) return;
    const sid=(r.subject||'').split('@')[0];
    const res=await jpost('/bridge/schema-advise',{schema_id:sid,kind:r.kind,definition:r.definition||{}}).catch(()=>null);
    if(!res||!res.ok){box.innerHTML='<span class="muted">🤖 advisor unavailable</span>';return;}
    const a=res.j; const rec=a.recommendation;
    // admin framing — the reviewer APPROVES/REJECTS (not proposes)
    const VMAP={'propose':['✅ Safe to approve','#3fb950'],'fix-and-propose':['⛔ Recommend reject — fix house rules','#ff9b9b'],'reuse':['⛔ Recommend reject — reuse an existing schema','#f0b429']};
    const vm=VMAP[rec]||['🤖 '+rec,'#9ab']; const col=vm[1];
    const viol=(a.house_rule_violations||[]); const reuse=(a.reuse_candidates||[]);
    box.innerHTML=`<div style="font-weight:600;color:${col}">🤖 ${esc(vm[0])}</div>
      <div class="muted" style="margin:3px 0 6px">${esc(a.why||'')}</div>
      ${viol.length?`<div class="sub">House-rule violations</div><ul style="margin:2px 0 6px 16px">${viol.map(v=>`<li class="mono" style="font-size:11px">${esc(v)}</li>`).join('')}</ul>`:'<div class="sub" style="color:#3fb950">✓ passes all house rules</div>'}
      ${reuse.length?`<div class="sub">Possible reuse (avoid duplicating)</div>${reuse.map(c=>`<div class="mono" style="font-size:11px">• ${esc(c.schema_id)} <span class="muted">(match ${c.score}${c.shared_fields&&c.shared_fields.length?', shares '+esc(c.shared_fields.slice(0,5).join(', ')):''})</span></div>`).join('')}`:''}`;
  })(); }
  const ap=ov.querySelector('#ap'), rj=ov.querySelector('#rj');
  if(ap) ap.onclick=async()=>{ap.disabled=true;ap.textContent='signing…';await decideReq(r,'approve','');close();};
  if(rj) rj.onclick=async()=>{const reason=prompt('Reason for rejection? (shared back to the developer)','');if(reason===null)return;await decideReq(r,'reject',reason);close();};
}

async function catalog(kind){
  const W=document.getElementById('wrap'); W.className='wrap'; W.innerHTML='<div class="empty">loading…</div>';
  let d; try{ d=await jget('/bridge/catalog?kind='+kind); }catch(e){ W.innerHTML='<div class="empty">could not load</div>'; return; }
  if(kind==='roles'){
    const roles=d.roles||[];
    W.innerHTML='<div class="lbl">Canonical roles ('+roles.length+')</div><div class="hint">The governed ACTOR vocabulary. Components may only declare roles that appear here.</div>'+
      '<table><tr><th>role</th><th>domain</th><th>label</th></tr>'+roles.map(r=>`<tr><td class="mono">${esc(r.role)}</td><td>${esc(r.domain||'')}</td><td class="muted">${esc(r.label||'')}</td></tr>`).join('')+'</table>';
  }else{
    const packs=(d.packs||[]).filter(p=>(p.roles||[]).length||(p.members||[]).length);
    W.innerHTML='<div class="lbl">Domain packs ('+packs.length+')</div><div class="hint">Sector bundles pinning schemas (nouns) + roles (actors). A tenant installs a pack to get its vocabulary.</div>'+
      packs.map(p=>`<div class="card"><b class="mono">${esc(p.pack_id.split('/').pop())}</b> <span class="muted">· ${esc(p.domain||'')} · v${esc(p.version||'')}</span>
        <div style="margin-top:8px"><span class="muted" style="font-size:11px">roles:</span> ${(p.roles||[]).length?p.roles.map(r=>`<span class="chip">${esc(r)}</span>`).join(''):'<span class="muted">none</span>'}</div>
        <div><span class="muted" style="font-size:11px">schemas:</span> ${(p.members||[]).length?p.members.map(m=>`<span class="chip">${esc(m.schema_id)}</span>`).join(''):'<span class="muted">none</span>'}</div></div>`).join('');
  }
}
boot();
</script>
