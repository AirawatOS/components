<style>
  :root{color-scheme:light dark}
  *{box-sizing:border-box}
  body{font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;margin:0;background:#0d1117;color:#e6edf3}
  header{padding:14px 20px;background:#161b22;border-bottom:1px solid #21262d;display:flex;align-items:center;gap:10px}
  header b{font-size:16px}.who{margin-left:auto;color:#8b949e;font-size:13px}
  main{max-width:820px;margin:0 auto;padding:18px}
  .card{background:#161b22;border:1px solid #21262d;border-radius:12px;padding:14px 16px;margin:12px 0}
  .btn{background:#3b82f6;color:#fff;border:0;border-radius:8px;padding:7px 12px;cursor:pointer;font-size:13px}
  .btn.ghost{background:#21262d;color:#e6edf3}.btn.warn{background:#8957e5}.btn.danger{background:#b62324}
  input,textarea,select{width:100%;background:#0d1117;border:1px solid #30363d;color:#e6edf3;border-radius:8px;padding:9px;margin:5px 0;font:inherit}
  .muted{color:#8b949e;font-size:13px}
  .pill{display:inline-block;border-radius:999px;padding:1px 9px;font-size:12px}
  .active{background:#12331f;color:#3fb950}.suspended{background:#3a2e12;color:#d29922}.retired{background:#3a1518;color:#f85149}
  .svc{border-top:1px solid #21262d;padding:12px 0}.svc:first-child{border-top:0}
  .row{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  h3{margin:.3em 0}details summary{cursor:pointer;color:#58a6ff}
</style>
<header><b>🗂️ Service Console</b><span id="scope" class="pill"></span><span id="who" class="who"></span></header>
<main>
  <div id="new"></div>
  <div class="card"><div class="row"><b id="listTitle">Services</b><button class="btn ghost" onclick="load()">Refresh</button></div>
    <div id="list" class="muted" style="margin-top:8px">Loading…</div></div>
</main>
<script>
const api=(p,b)=>fetch(p,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b||{})}).then(r=>r.json());
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let ME={}, STEWARD=false;
async function boot(){
  try{ ME=await (await fetch('/session')).json(); }catch(e){ ME={}; }
  const roles=ME.roles||[];
  STEWARD = roles.includes('platform.steward') || ['airawat','airawatnetwork'].includes(ME.tenant);
  document.getElementById('who').textContent = (ME.sub||'') ;
  document.getElementById('scope').className='pill '+(STEWARD?'suspended':'active');
  document.getElementById('scope').textContent = STEWARD?'Network Steward — all agencies':'Agency: '+(ME.tenant||'?');
  document.getElementById('listTitle').textContent = STEWARD?'All service offerings':'My services';
  if(!STEWARD) renderNew();
  load();
}
function renderNew(){
  document.getElementById('new').innerHTML=`<div class="card"><h3>Register / update a service</h3>
   <div class="grid"><input id="sid" placeholder="service_id (e.g. birth-certificate)">
     <input id="dom" placeholder="domain (e.g. urban, health, safety)"></div>
   <input id="title" placeholder="Title shown to citizens (e.g. Birth Certificate)">
   <input id="desc" placeholder="Short description">
   <div class="grid"><input id="inter" placeholder="steps: search,select,init,status,track" value="search,select,init,status,track">
     <input id="ep" placeholder="endpoint (e.g. solution://${esc(ME.tenant||'city')}/registry)" value="solution://${esc(ME.tenant||'city')}/svc"></div>
   <button class="btn" onclick="save()">Publish service</button><div id="saveOut" class="muted"></div></div>`;
}
async function save(){
  const g=id=>document.getElementById(id).value.trim(), out=document.getElementById('saveOut');
  if(!g('sid')||!g('title')){ out.textContent='service_id and title are required'; return; }
  out.textContent='Publishing…';
  const r=await api('/bridge/service-offering-save',{service_id:g('sid'),domain:g('dom'),title:g('title'),
    description:g('desc'),interaction:g('inter').split(',').map(s=>s.trim()).filter(Boolean),endpoint:g('ep'),access_mode:'on_platform'});
  out.textContent = r.published ? ('✓ published '+r.published.split('/').pop()) : ('✗ '+(r.detail||r.error||'failed'));
  load();
}
async function load(){
  const body = STEWARD ? {} : {tenant: ME.tenant};
  const d = await api('/bridge/service-offerings', body);
  const offs = (d.offerings||[]).filter(o=>STEWARD || o.tenant===ME.tenant);
  document.getElementById('list').innerHTML = offs.length ? offs.map(o=>row(o)).join('') : '<span class="muted">No services.</span>';
}
function row(o){
  const st=o.status||'active';
  const actions = STEWARD
    ? `<button class="btn warn" onclick="mng('steward','${o.id}','suspend')">Suspend</button>
       <button class="btn ghost" onclick="mng('steward','${o.id}','reinstate')">Reinstate</button>
       <button class="btn danger" onclick="mng('steward','${o.id}','retire')">Retire</button>`
    : (st==='retired'
        ? `<button class="btn ghost" onclick="mng('agency','${o.tenant}','${o.service_id}',true)">Reinstate</button>`
        : `<button class="btn danger" onclick="mng('agency','${o.tenant}','${o.service_id}',false)">Retire</button>`);
  return `<div class="svc"><div class="row"><div><b>${esc(o.title||o.service_id)}</b>
     <span class="pill ${st}">${st}</span> <span class="muted">${esc(o.domain||'')}${STEWARD?' · '+esc(o.tenant):''}</span><br>
     <span class="muted">${esc(o.description||'')} · ${(o.interaction||[]).join(' → ')} · → ${esc(o.endpoint||'')}</span></div>
     <div class="row">${actions}</div></div></div>`;
}
async function mng(as, a, b, c){
  const body = as==='steward' ? {as:'steward', offering_id:a, action:b} : {as:'agency', tenant:a, service_id:b, reinstate:c};
  const r = await api('/bridge/service-offering-manage', body);
  load();
}
boot();
</script>
