<!doctype html><meta charset="utf-8"><title>Ward Air Board</title>
<body style="margin:0;font-family:-apple-system,Segoe UI,Roboto,sans-serif;background:#0d1117;color:#e6edf3">
<div style="max-width:760px;margin:0 auto;padding:28px">
  <h2>🌬️ Ward Air Quality Board</h2>
  <p style="color:#8b949e">The Interaction layer of the "Ward Air Quality Alert" solution — built in Studio.</p>
  <div id="who" style="margin:14px 0;padding:12px 14px;border:1px solid #21262d;border-radius:10px;background:#161b22">…</div>
  <p style="color:#8b949e;font-size:13px">Next: this board shows per-ward air quality once <code>air.ward_quality</code> is approved and the ward engine runs.</p>
</div>
<script>
fetch('/session').then(r=>r.json()).then(s=>{
  document.getElementById('who').innerHTML='Signed in to <b>'+(s.tenant||'—')+'</b> as <b>'+((s.sub||'').split('/').pop()||'—')+'</b>';
}).catch(()=>{document.getElementById('who').textContent='(not signed in)';});
</script>
