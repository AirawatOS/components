# The PERSONAL AGENT (ADR-0081) — a per-user assistant that plans across the user's installed apps and acts on
# their behalf via each app's App-Agent tools. It runs as a scoped delegate (the signed-in user's session), so it
# can only do what the user could; every side-effect is confirmed and attributed component://<app> obo user.
component_id: ds:airawatdeveloper:app/personal-assistant
kind: app
name: Assistant
version: 0.3.2   # 0.3.2: sends its chat id (conversation) so the sensitive-data rule applies per chat (host patch 4)
# 0.3.1: 0.3.1: an empty briefing says it failed (with Try again) instead of 'Nothing urgent'
# 0.3.0: 0.3.0: workspace look (same frame as Files/Data/Docs/Sheets) — saved chats in the left pane (platform.agent_chat), answers rendered as safe markdown, briefing on request
# 0.2.0: agent picker — talk to the Assistant (all active skills) or to one Agent Studio agent (its skills + persona)
provider: ds:airawatdeveloper:developer
entrypoint: index.html
personal: true
default_install: true   # ships with the OS: auto-shelved per tenant on admin login                 # self-service: any signed-in tenant user; owner is forced to the actor
icon: "✨"
summary: Your personal AI assistant — plans across your installed apps and acts on your behalf (with confirm).
required_schemas: [doc.document, platform.agent_chat]
writes: [platform.agent_session, platform.agent_chat]                     # the agent delegates writes to the owning app (e.g. docs), never writes directly
audience: []
agent:
  summary: "Personal orchestrator: discovers your installed app-agents, plans, and delegates with confirm-gated writes."
