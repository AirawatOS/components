# Admin (kind=app). Tenant administration — assign users to roles and scope which roles see which apps.
# A SYSTEM app (default-installed, undeletable) scoped to tenant_admin, so every tenant admin has it and
# no ordinary user sees it. Uses the host role bridges (/bridge/roles, /bridge/role-grant, /bridge/app-install).
component_id: ds:airawat:app/admin
kind: app
version: 0.1.1
provider: ds:airawat:developer
display_name: Admin
entrypoint: index.html
bundle: dist
sandboxed: true
required_schemas: []
system: true
roles: [platform.tenant-admin]
# City Setup uses an OSM slippy-map to draw the AOI — tiles come through the host's declared-egress
# /bridge/fetch (the CSP still blocks direct calls); the app can reach ONLY this host (© OpenStreetMap).
egress:
  - { host: tile.openstreetmap.org, rate_per_min: 300, user_agent: "AirawatOS/admin-citysetup (+https://airawat.org; contact@airawat.org)" }
