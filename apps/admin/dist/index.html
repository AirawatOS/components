<!doctype html><meta charset="utf-8"><title>Admin</title>
<style>
  :root{--bg:#0d1117;--card:#161b22;--line:#21262d;--ink:#e6edf3;--dim:#8b949e;--accent:#3b82f6}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  header{padding:12px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}
  h1{margin:0;font-size:16px} .who{margin-left:auto;color:var(--dim);font-size:12px}
  .tabs{display:flex;gap:4px;padding:12px 18px 0}
  .tab{padding:6px 14px;border:1px solid var(--line);border-radius:8px;cursor:pointer;color:var(--dim);font-size:13px}
  .tab.on{background:#1b2530;color:var(--ink);border-color:#2f3d4d}
  .wrap{padding:16px 18px}
  .lbl{color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.05em;margin:4px 0 10px}
  .hint{color:var(--dim);font-size:12px;margin:-4px 0 14px}
  table{border-collapse:collapse;font-size:13px}
  th,td{border-bottom:1px solid #1a1f27;padding:8px 12px;text-align:left}
  th{color:var(--dim);font-weight:500;white-space:nowrap}
  th.role{writing-mode:horizontal-tb;font-family:ui-monospace,Menlo,monospace;font-size:12px}
  td.user{font-weight:600;white-space:nowrap} td.user .sub{color:#5f6b78;font-size:11px;font-family:ui-monospace,Menlo,monospace;font-weight:400}
  td.cell{text-align:center;cursor:pointer;user-select:none}
  .dot{display:inline-block;width:20px;height:20px;line-height:20px;border-radius:50%;border:1px solid var(--line);font-size:12px}
  .dot.on{background:#132a17;border-color:#238636;color:#3fb950}
  .dot.off{background:#0d1117;color:#3a434d}
  .dot.idp{background:#1b2530;border-color:#2f3d4d;color:#8b949e;cursor:default}
  .cell.busy{opacity:.4}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:12px}
  .approw{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .approw .nm{font-weight:600;min-width:130px}
  .chip{display:inline-block;background:#0d1117;border:1px solid var(--line);border-radius:999px;padding:1px 9px;font-size:12px;margin:0 4px 0 0;font-family:ui-monospace,Menlo,monospace}
  .badge{font-size:10px;color:var(--dim);border:1px solid var(--line);border-radius:999px;padding:1px 7px;text-transform:uppercase;letter-spacing:.04em}
  input.v{background:#0d1117;border:1px solid var(--line);color:var(--ink);border-radius:7px;padding:5px 9px;font:12px ui-monospace,Menlo,monospace;flex:1;min-width:160px}
  .btn{border:1px solid var(--line);background:#21262d;color:var(--ink);border-radius:7px;padding:5px 11px;font-size:12px;cursor:pointer}
  .btn.primary{background:var(--accent);border-color:var(--accent)}
  .muted{color:var(--dim)} .empty{color:var(--dim);padding:32px;text-align:center}
  .toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#132a17;border:1px solid #238636;color:#3fb950;padding:9px 16px;border-radius:9px;font-size:13px;opacity:0;transition:opacity .2s}
  .toast.show{opacity:1} .toast.err{background:#3d1418;border-color:#8b2c30;color:#ff9b9b}
  .legend{display:flex;gap:16px;margin:12px 0 0;font-size:12px;color:var(--dim);align-items:center}
</style>
<header><h1>🛡️ Admin</h1><span class="who" id="who"></span></header>
<div class="tabs"><span class="tab on" data-t="people">People &amp; Roles</span><span class="tab" data-t="apps">App Access</span></div>
<div class="wrap" id="wrap"><div class="empty">loading…</div></div>
<div class="toast" id="toast"></div>
<script>
let TAB='people';
async function jget(p){const r=await fetch(p);if(!r.ok)throw new Error(p+' '+r.status);return r.json();}
async function jpost(p,b){const r=await fetch(p,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});return {ok:r.ok,status:r.status,j:await r.json().catch(()=>({}))};}
function toast(m,e){const t=document.getElementById('toast');t.textContent=m;t.className='toast show'+(e?' err':'');setTimeout(()=>t.className='toast',2000);}
function esc(s){return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

async function boot(){
  fetch('/session').then(r=>r.json()).then(s=>{document.getElementById('who').textContent=s.authenticated?('● '+s.sub):'';}).catch(()=>{});
  document.querySelectorAll('.tab').forEach(el=>el.onclick=()=>{
    document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));el.classList.add('on');
    TAB=el.dataset.t; render();
  });
  render();
}
async function render(){ TAB==='people'?people():apps(); }

async function people(){
  const wrap=document.getElementById('wrap'); wrap.innerHTML='<div class="empty">loading…</div>';
  let d; try{ d=await jget('/bridge/roles'); }catch(e){ wrap.innerHTML='<div class="empty">not authorized (tenant admin only)</div>'; return; }
  const roles=(d.roles||[]).map(r=>r.role).sort();
  const users=(d.users||[]).filter(u=>!u.roles.includes('resident')||true);   // show all tenant users
  const granted=new Set((d.grants||[]).map(g=>g.subject+'|'+g.role));
  if(!roles.length){ wrap.innerHTML='<div class="lbl">People &amp; Roles</div><div class="hint">No assignable roles yet. Roles appear here when an app that targets them is installed from the Marketplace.</div>'; return; }
  let html='<div class="lbl">People &amp; Roles</div><div class="hint">Assign users to the tenant’s roles. A user then sees the apps scoped to that role. Roles from the identity provider are shown locked.</div>';
  html+='<table><tr><th>User</th>'+roles.map(r=>`<th class="role">${esc(r)}</th>`).join('')+'</tr>';
  users.forEach(u=>{
    html+=`<tr><td class="user">${esc(u.username)}<div class="sub">${esc(u.subject)}</div></td>`;
    roles.forEach(role=>{
      const idp=(u.roles||[]).includes(role);
      const on=granted.has(u.subject+'|'+role);
      if(idp) html+=`<td class="cell"><span class="dot idp" title="from identity provider — not editable here">✓</span></td>`;
      else html+=`<td class="cell" data-sub="${esc(u.subject)}" data-role="${esc(role)}" data-on="${on?1:0}"><span class="dot ${on?'on':'off'}">${on?'●':'○'}</span></td>`;
    });
    html+='</tr>';
  });
  html+='</table><div class="legend"><span><span class="dot on" style="width:14px;height:14px;line-height:14px">●</span> granted</span><span><span class="dot off" style="width:14px;height:14px;line-height:14px">○</span> click to grant</span><span><span class="dot idp" style="width:14px;height:14px;line-height:14px">✓</span> from identity (locked)</span></div>';
  wrap.innerHTML=html;
  wrap.querySelectorAll('td.cell[data-sub]').forEach(td=>td.onclick=async()=>{
    if(td.classList.contains('busy'))return; td.classList.add('busy');
    const on=td.dataset.on==='1';
    const r=await jpost('/bridge/role-grant',{subject:td.dataset.sub,role:td.dataset.role,revoke:on});
    td.classList.remove('busy');
    if(r.ok){ toast((on?'revoked ':'granted ')+td.dataset.role); people(); }
    else toast(r.j.error||'failed',true);
  });
}

async function apps(){
  const wrap=document.getElementById('wrap'); wrap.innerHTML='<div class="empty">loading…</div>';
  let d; try{ d=await jget('/apps'); }catch(e){ wrap.innerHTML='<div class="empty">could not load apps</div>'; return; }
  let html='<div class="lbl">App Access</div><div class="hint">Which roles may see each app on the desktop. Empty = everyone in the tenant. System apps are fixed.</div>';
  (d.apps||[]).forEach(a=>{
    const roles=(a.roles||[]);
    html+=`<div class="card"><div class="approw"><span class="nm">${esc(a.name)}</span>`;
    if(a.system){
      html+=`<span class="badge">system</span>`+(roles.length?roles.map(r=>`<span class="chip">${esc(r)}</span>`).join(''):'<span class="muted">everyone</span>');
    }else{
      html+=`<input class="v" data-app="${esc(a.id)}" value="${esc(roles.join(', '))}" placeholder="roles (comma-separated) — empty = everyone">
             <button class="btn primary" data-save="${esc(a.id)}">Save</button>`;
    }
    html+='</div></div>';
  });
  wrap.innerHTML=html;
  wrap.querySelectorAll('[data-save]').forEach(b=>b.onclick=async()=>{
    const id=b.dataset.save; const inp=wrap.querySelector(`input[data-app="${id}"]`);
    const roles=inp.value.split(',').map(s=>s.trim()).filter(Boolean);
    const r=await jpost('/bridge/app-install',{app_id:id,roles});
    r.ok?(toast('updated '+id),apps()):toast(r.j.error||'failed',true);
  });
}
boot();
</script>
