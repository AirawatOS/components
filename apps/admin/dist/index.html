<!doctype html><meta charset="utf-8"><title>Admin</title>
<style>
  :root{--bg:#0d1117;--card:#161b22;--line:#21262d;--ink:#e6edf3;--dim:#8b949e;--accent:#3b82f6}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  header{padding:12px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}
  h1{margin:0;font-size:16px} .who{margin-left:auto;color:var(--dim);font-size:12px}
  .tabs{display:flex;gap:4px;padding:12px 18px 0}
  .tab{padding:6px 14px;border:1px solid var(--line);border-radius:8px;cursor:pointer;color:var(--dim);font-size:13px}
  .tab.on{background:#1b2530;color:var(--ink);border-color:#2f3d4d}
  .layout{display:flex;height:calc(100vh - 98px)}
  .col{width:300px;flex:none;border-right:1px solid var(--line);display:flex;flex-direction:column}
  .search{margin:12px;background:#0d1117;border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:7px 10px;font-size:13px}
  .items{flex:1;overflow:auto}
  .it{padding:9px 14px;border-bottom:1px solid #1a1f27;cursor:pointer}
  .it:hover{background:#161b22} .it.sel{background:#1b2530;border-left:2px solid var(--accent)}
  .it .nm{font-weight:600;font-size:13px} .it .sub{color:#5f6b78;font-size:11px;font-family:ui-monospace,Menlo,monospace;word-break:break-all}
  .pager{flex:none;display:flex;align-items:center;gap:8px;padding:8px 12px;border-top:1px solid var(--line);color:var(--dim);font-size:12px}
  .pbtn{border:1px solid var(--line);background:#161b22;color:var(--ink);border-radius:6px;padding:3px 9px;cursor:pointer}
  .pbtn:disabled{opacity:.4;cursor:default}
  .detail{flex:1;overflow:auto;padding:18px 22px}
  .lbl{color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.05em;margin:18px 0 8px}
  .chip{display:inline-flex;align-items:center;gap:6px;background:#0d1117;border:1px solid var(--line);border-radius:999px;padding:3px 6px 3px 11px;font-size:12px;margin:0 6px 6px 0;font-family:ui-monospace,Menlo,monospace}
  .chip .x{cursor:pointer;color:#8b949e;border:1px solid var(--line);border-radius:50%;width:16px;height:16px;line-height:14px;text-align:center}
  .chip .x:hover{color:#ff9b9b;border-color:#8b2c30;background:#3d1418}
  .chip.locked{color:var(--dim)} .chip .lk{font-size:10px;color:#5f6b78}
  .add{display:flex;gap:8px;align-items:center;position:relative;max-width:420px}
  .add input{flex:1;background:#0d1117;border:1px solid var(--line);color:var(--ink);border-radius:7px;padding:7px 10px;font-size:13px}
  .menu{position:absolute;top:38px;left:0;right:0;background:#161b22;border:1px solid var(--line);border-radius:8px;max-height:220px;overflow:auto;z-index:5;box-shadow:0 10px 30px rgba(0,0,0,.5)}
  .menu div{padding:8px 12px;cursor:pointer;font-size:13px} .menu div:hover{background:#1b2530}
  .menu .none{color:var(--dim);cursor:default}
  .muted{color:var(--dim)} .empty{color:var(--dim);padding:40px;text-align:center}
  .count{color:var(--dim);font-size:12px;margin-left:6px}
  .toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#132a17;border:1px solid #238636;color:#3fb950;padding:9px 16px;border-radius:9px;font-size:13px;opacity:0;transition:opacity .2s}
  .toast.show{opacity:1} .toast.err{background:#3d1418;border-color:#8b2c30;color:#ff9b9b}
</style>
<header><h1>🛡️ Admin</h1><span class="who" id="who"></span></header>
<div class="tabs"><span class="tab on" data-t="city">City Setup</span><span class="tab" data-t="user">By User</span><span class="tab" data-t="role">By Role</span><span class="tab" data-t="requests">Role Requests</span><span class="tab" data-t="apps">App Access</span></div>
<div id="view"></div>
<div class="toast" id="toast"></div>
<script>
let TAB='city';
let POLL=null;
const enc=encodeURIComponent;
async function jget(p){const r=await fetch(p);if(!r.ok)throw new Error(p+' '+r.status);return r.json();}
async function jpost(p,b){const r=await fetch(p,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});return {ok:r.ok,status:r.status,j:await r.json().catch(()=>({}))};}
function toast(m,e){const t=document.getElementById('toast');t.textContent=m;t.className='toast show'+(e?' err':'');setTimeout(()=>t.className='toast',2000);}
function esc(s){return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function debounce(fn){let t;return(...a)=>{clearTimeout(t);t=setTimeout(()=>fn(...a),220);};}

function boot(){
  fetch('/session').then(r=>r.json()).then(s=>{document.getElementById('who').textContent=s.authenticated?('● '+s.sub):'';}).catch(()=>{});
  document.querySelectorAll('.tab').forEach(el=>el.onclick=()=>{
    document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));el.classList.add('on');TAB=el.dataset.t;render();
  });
  render();
}
function render(){
  if(POLL){clearInterval(POLL);POLL=null;}
  TAB==='city'?citySetup():TAB==='user'?byUser():TAB==='role'?byRole():TAB==='requests'?requests():apps();
}

// ---- City Setup (ADR-0060): initiate the City Digital Baseline for this tenant ------------------
const MATURITY=['L0 · Requested','L1 · Baseline','L2 · Cells','L3 · Intelligence','L4 · Decisions'];
async function citySetup(){
  const V=document.getElementById('view');
  V.innerHTML='<div class="detail" style="height:calc(100vh - 98px);overflow:auto"><div class="empty">loading…</div></div>';
  const D=V.querySelector('.detail');
  let d; try{ d=await jget('/bridge/city-onboard'); }catch(e){ D.innerHTML='<div class="empty">not authorized</div>'; return; }
  if(!d.admin){ D.innerHTML='<div class="empty">City setup is for tenant admins.</div>'; return; }
  const run=d.run, mat=(d.maturity==null?null:d.maturity), running=run&&(run.status==='running'||run.status==='queued');
  const done=run&&run.status==='done', failed=run&&run.status==='failed';
  const stateBadge = mat!=null
    ? `<span style="color:#3fb950">● ${esc(MATURITY[mat]||('L'+mat))}</span>`
    : `<span class="muted">no baseline yet</span>`;
  let html=`<div class="lbl">City Digital Baseline</div>
    <div style="max-width:720px">
      <div style="color:var(--dim);font-size:12px;margin:-2px 0 14px">Tenant <b style="color:var(--ink);font-family:ui-monospace,Menlo,monospace">${esc(d.tenant)}</b> — establish the on-demand baseline for your city (ADR-0060). Give the area of interest and Airawat acquires land cover, heat and terrain, indexes them into H3 cells, and reports coverage &amp; trust. Current state: ${stateBadge}.</div>`;
  if(running){
    html+=`<div style="background:#132033;border:1px solid #1f3350;border-radius:10px;padding:14px 16px">
      <div style="font-weight:600">⏳ Baseline running…</div>
      <div class="muted" style="font-size:12px;margin-top:4px">Acquiring layers → indexing cells → assessing coverage. This takes a minute or two.</div>
      ${run&&run.log?`<pre style="white-space:pre-wrap;background:#0d1117;border:1px solid var(--line);border-radius:8px;padding:10px;margin-top:10px;font-size:11px;max-height:200px;overflow:auto">${esc(run.log.slice(-1500))}</pre>`:''}</div>`;
    D.innerHTML=html;
    POLL=setInterval(()=>{ if(TAB==='city') citySetup(); },3000);
    return;
  }
  if(done){
    html+=`<div style="background:#0f2417;border:1px solid #1c3a25;border-radius:10px;padding:14px 16px;margin-bottom:14px">
      <div style="font-weight:600;color:#3fb950">✓ Baseline ready${run.steps_ok!=null?` — ${run.steps_ok} step(s) succeeded`:''}</div>
      <div class="muted" style="font-size:12px;margin-top:4px">Workspace advanced to <b style="color:var(--ink)">${esc(MATURITY[d.maturity]||'L1')}</b>. Open <b>City Scan</b> to explore built-up, green cover, heat and terrain with the coverage &amp; trust report. A notification was sent to the commissioner.</div></div>`;
  }
  if(failed){
    html+=`<div style="background:#2a1416;border:1px solid #4a2226;border-radius:10px;padding:14px 16px;margin-bottom:14px">
      <div style="font-weight:600;color:#ff9b9b">✗ Last run failed</div>
      ${run.log?`<pre style="white-space:pre-wrap;background:#0d1117;border:1px solid var(--line);border-radius:8px;padding:10px;margin-top:8px;font-size:11px;max-height:180px;overflow:auto">${esc(run.log.slice(-1500))}</pre>`:''}</div>`;
  }
  // the initiate form (also shown to re-run / after done|failed)
  html+=`<div class="lbl" style="margin-top:8px">${mat!=null?'Re-run baseline':'Initiate setup'}</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:520px">
      <label style="grid-column:1/3;font-size:12px;color:var(--dim)">City / area name
        <input id="cs-name" class="search" style="margin:4px 0 0;width:100%" placeholder="e.g. Greater Mumbai"></label>
      <label style="font-size:12px;color:var(--dim)">West (lng)<input id="cs-w" class="search" style="margin:4px 0 0;width:100%" placeholder="72.80"></label>
      <label style="font-size:12px;color:var(--dim)">South (lat)<input id="cs-s" class="search" style="margin:4px 0 0;width:100%" placeholder="18.90"></label>
      <label style="font-size:12px;color:var(--dim)">East (lng)<input id="cs-e" class="search" style="margin:4px 0 0;width:100%" placeholder="72.98"></label>
      <label style="font-size:12px;color:var(--dim)">North (lat)<input id="cs-n" class="search" style="margin:4px 0 0;width:100%" placeholder="19.10"></label>
      <label style="grid-column:1/3;font-size:12px;color:var(--dim)">Priorities (comma)
        <input id="cs-pri" class="search" style="margin:4px 0 0;width:100%" placeholder="growth, heat" value="growth, heat"></label>
    </div>
    <div style="margin-top:14px"><button class="pbtn" id="cs-go" style="background:var(--accent);border-color:var(--accent);color:#fff;padding:8px 18px;font-size:14px">${mat!=null?'Re-run baseline':'Initiate City Setup'}</button>
    <span class="muted" style="font-size:12px;margin-left:10px">Enter the bounding box of the area to cover (keep it city-sized).</span></div>`;
  D.innerHTML=html;
  D.querySelector('#cs-go').onclick=async()=>{
    const name=D.querySelector('#cs-name').value.trim();
    const bbox=['#cs-w','#cs-s','#cs-e','#cs-n'].map(id=>parseFloat(D.querySelector(id).value));
    if(!name) return toast('enter a city name',true);
    if(bbox.some(v=>isNaN(v))) return toast('enter all four bbox values',true);
    if(!(bbox[0]<bbox[2]&&bbox[1]<bbox[3])) return toast('need west<east and south<north',true);
    const priorities=D.querySelector('#cs-pri').value.split(',').map(s=>s.trim()).filter(Boolean);
    const r=await jpost('/bridge/city-onboard',{name,bbox,priorities});
    if(r.ok){ toast('baseline started'); citySetup(); }
    else toast(r.j.error||'failed',true);
  };
}

// ---- Role Requests: file a request for a new canonical role; the standards body decides -----------
async function requests(){
  const V=document.getElementById('view');
  V.innerHTML='<div class="detail" style="height:calc(100vh - 98px);overflow:auto"><div class="empty">loading…</div></div>';
  const D=V.querySelector('.detail');
  let d; try{ d=await jget('/bridge/role-requests'); }catch(e){ D.innerHTML='<div class="empty">not authorized</div>'; return; }
  const reqs=(d.requests||[]).sort((a,b)=>(a.status>b.status?1:-1));
  let html=`<div class="lbl">Request a new role</div>
    <div class="hint" style="color:var(--dim);font-size:12px;margin:-4px 0 12px">Roles are governed vocabulary. Ask the standards body (AirawatNetwork) to add one; it becomes usable once approved. You file — they decide.</div>
    <div class="add" style="max-width:640px;flex-wrap:wrap;gap:8px">
      <input id="rq-role" placeholder="role (e.g. flood-marshal)" style="flex:0 0 180px">
      <input id="rq-domain" placeholder="domain (e.g. urban)" style="flex:0 0 130px">
      <input id="rq-just" placeholder="why it's needed" style="flex:1;min-width:200px">
      <button class="pbtn" id="rq-file">File request</button></div>
    <div class="lbl" style="margin-top:22px">Requests</div>`;
  if(!reqs.length) html+='<div class="muted">no requests yet</div>';
  else{ html+='<table style="width:100%;max-width:820px"><tr><th>role</th><th>domain</th><th>status</th><th>requested by</th><th></th></tr>'+
    reqs.map(r=>{
      const badge=r.status==='approved'?'<span style="color:#3fb950">✓ approved</span>':r.status==='rejected'?`<span style="color:#ff9b9b">✗ rejected</span>`:'<span style="color:#e3a008">● pending</span>';
      const act=r.status==='pending'?`<button class="pbtn" data-ap="${esc(r.role)}">Approve</button> <button class="pbtn" data-rj="${esc(r.role)}">Reject</button>`:esc(r.reason||r.published||'');
      return `<tr><td style="font-family:ui-monospace,Menlo,monospace">${esc(r.role)}</td><td>${esc(r.domain||'')}</td><td>${badge}</td><td class="muted" style="font-size:12px">${esc((r.requested_by||'').split('/').pop())}</td><td>${act}</td></tr>`;
    }).join('')+'</table>'; }
  D.innerHTML=html;
  D.querySelector('#rq-file').onclick=async()=>{
    const role=D.querySelector('#rq-role').value.trim(), domain=D.querySelector('#rq-domain').value.trim(), just=D.querySelector('#rq-just').value.trim();
    if(!role)return toast('enter a role',true);
    const r=await jpost('/bridge/role-request',{role,domain,justification:just});
    r.ok?(toast('filed — awaiting the standards body'),requests()):toast(r.j.error||'failed',true);
  };
  D.querySelectorAll('[data-ap]').forEach(b=>b.onclick=async()=>{
    const r=await jpost('/bridge/role-request-decide',{role:b.dataset.ap,decision:'approve'});
    r.ok?(toast('approved + published'),requests()):toast(r.j.error||'refused',true);
  });
  D.querySelectorAll('[data-rj]').forEach(b=>b.onclick=async()=>{
    const r=await jpost('/bridge/role-request-decide',{role:b.dataset.rj,decision:'reject',reason:'not needed'});
    r.ok?(toast('rejected'),requests()):toast(r.j.error||'refused',true);
  });
}

// ---- generic searchable+paginated master list (left column) -------------------------------------
function masterDetail(cfg){
  const V=document.getElementById('view');
  V.innerHTML=`<div class="layout"><div class="col">
      <input class="search" id="q" placeholder="${cfg.placeholder}">
      <div class="items" id="items"><div class="empty">loading…</div></div>
      <div class="pager"><button class="pbtn" id="prev">‹</button><span id="range"></span><button class="pbtn" id="next">›</button></div>
    </div><div class="detail" id="detail"><div class="empty">${cfg.hint}</div></div></div>`;
  let page=0, q='';
  async function load(){
    let d; try{ d=await jget(cfg.list(q,page)); }catch(e){ document.getElementById('items').innerHTML='<div class="empty">not authorized</div>'; return; }
    const rows=cfg.rows(d); const items=document.getElementById('items');
    items.innerHTML=rows.length?rows.map(r=>`<div class="it" data-k="${esc(r.key)}"><div class="nm">${esc(r.name)}</div>${r.sub?`<div class="sub">${esc(r.sub)}</div>`:''}</div>`).join(''):'<div class="empty">'+(q?'no matches':'none')+'</div>';
    items.querySelectorAll('.it').forEach(el=>el.onclick=()=>{items.querySelectorAll('.it').forEach(x=>x.classList.remove('sel'));el.classList.add('sel');cfg.open(rows.find(r=>r.key===el.dataset.k));});
    const total=d.total||rows.length, a=total?page*(d.page_size||25)+1:0, b=Math.min(a-1+rows.length,total);
    document.getElementById('range').textContent=`${a}–${b} of ${total}`;
    document.getElementById('prev').disabled=page<=0; document.getElementById('next').disabled=b>=total;
  }
  document.getElementById('q').oninput=debounce(e=>{q=e.target.value.trim();page=0;load();});
  document.getElementById('prev').onclick=()=>{if(page>0){page--;load();}};
  document.getElementById('next').onclick=()=>{page++;load();};
  load();
}

// ---- By User: pick a user → edit their granted roles --------------------------------------------
function byUser(){
  masterDetail({
    placeholder:'search users…', hint:'Select a user to manage their roles.',
    list:(q,p)=>`/bridge/users?q=${enc(q)}&page=${p}&page_size=25`,
    rows:d=>(d.users||[]).map(u=>({key:u.subject,name:u.username,sub:u.subject,roles:u.roles})),
    open:u=>userDetail(u)
  });
}
async function userDetail(u){
  const D=document.getElementById('detail'); D.innerHTML='<div class="empty">loading…</div>';
  const d=await jget('/bridge/user-roles?subject='+enc(u.key));
  const idp=new Set(d.identity||[]), granted=d.granted||[];
  D.innerHTML=`<div style="font-weight:600;font-size:15px">${esc(u.name)}</div><div class="sub" style="color:#5f6b78;font-family:ui-monospace,Menlo,monospace;font-size:11px">${esc(u.key)}</div>
    <div class="lbl">From identity provider (locked)</div>
    <div>${[...idp].length?[...idp].map(r=>`<span class="chip locked">${esc(r)} <span class="lk">IdP</span></span>`).join(''):'<span class="muted">none</span>'}</div>
    <div class="lbl">Assigned roles</div>
    <div id="granted">${granted.length?granted.map(r=>`<span class="chip">${esc(r)} <span class="x" data-rm="${esc(r)}" title="revoke">✕</span></span>`).join(''):'<span class="muted">none</span>'}</div>
    <div class="lbl">Assign a role</div>
    <div class="add"><input id="ar" placeholder="type to search roles…" autocomplete="off"><div class="menu" id="menu" style="display:none"></div></div>`;
  D.querySelectorAll('[data-rm]').forEach(x=>x.onclick=async()=>{
    const r=await jpost('/bridge/role-grant',{subject:u.key,role:x.dataset.rm,revoke:true});
    r.ok?(toast('revoked '+x.dataset.rm),userDetail(u)):toast(r.j.error||'failed',true);
  });
  const inp=D.querySelector('#ar'), menu=D.querySelector('#menu');
  const search=debounce(async()=>{
    const q=inp.value.trim(); const d2=await jget(`/bridge/roles?q=${enc(q)}&page_size=8`);
    const opts=(d2.roles||[]).map(r=>r.role).filter(r=>!granted.includes(r)&&!idp.has(r));
    menu.style.display='block';
    menu.innerHTML=opts.length?opts.map(r=>`<div data-r="${esc(r)}">${esc(r)}</div>`).join(''):'<div class="none">no matching roles</div>';
    menu.querySelectorAll('[data-r]').forEach(el=>el.onclick=async()=>{
      const r=await jpost('/bridge/role-grant',{subject:u.key,role:el.dataset.r});
      r.ok?(toast('granted '+el.dataset.r),userDetail(u)):toast(r.j.error||'failed',true);
    });
  });
  inp.oninput=search; inp.onfocus=search;
  document.addEventListener('click',e=>{if(!D.querySelector('.add').contains(e.target))menu.style.display='none';},{once:true});
}

// ---- By Role: pick a role → manage members ------------------------------------------------------
function byRole(){
  masterDetail({
    placeholder:'search roles…', hint:'Select a role to manage its members.',
    list:(q,p)=>`/bridge/roles?q=${enc(q)}&page=${p}&page_size=25`,
    rows:d=>(d.roles||[]).map(r=>({key:r.role,name:r.role,sub:[r.domain?('· '+r.domain):'',(r.source||[]).length?('from '+r.source.join(', ')):''].filter(Boolean).join('  ')})),
    open:r=>roleDetail(r)
  });
}
async function roleDetail(role,page){
  page=page||0;
  const D=document.getElementById('detail'); if(!page)D.innerHTML='<div class="empty">loading…</div>';
  const d=await jget(`/bridge/role-members?role=${enc(role.key)}&page=${page}&page_size=25`);
  const mem=d.members||[];
  D.innerHTML=`<div style="font-weight:600;font-size:15px">${esc(role.name)}<span class="count">${d.total} member(s)</span></div>
    <div class="lbl">Add member</div>
    <div class="add"><input id="am" placeholder="type to search users…" autocomplete="off"><div class="menu" id="menu" style="display:none"></div></div>
    <div class="lbl">Members</div>
    <div id="mem">${mem.length?mem.map(m=>`<span class="chip ${m.via==='identity'?'locked':''}">${esc(m.subject.split('/').pop())} ${m.via==='identity'?'<span class="lk">IdP</span>':`<span class="x" data-rm="${esc(m.subject)}" title="revoke">✕</span>`}</span>`).join(''):'<span class="muted">no members</span>'}</div>
    <div class="pager" style="border:0;padding:10px 0"><button class="pbtn" id="mprev">‹</button><span>${d.total?page*25+1:0}–${Math.min(page*25+mem.length,d.total)} of ${d.total}</span><button class="pbtn" id="mnext">›</button></div>`;
  D.querySelectorAll('[data-rm]').forEach(x=>x.onclick=async()=>{
    const r=await jpost('/bridge/role-grant',{subject:x.dataset.rm,role:role.key,revoke:true});
    r.ok?(toast('revoked'),roleDetail(role,page)):toast(r.j.error||'failed',true);
  });
  D.querySelector('#mprev').disabled=page<=0; D.querySelector('#mprev').onclick=()=>{if(page>0)roleDetail(role,page-1);};
  D.querySelector('#mnext').disabled=(page*25+mem.length)>=d.total; D.querySelector('#mnext').onclick=()=>roleDetail(role,page+1);
  const inp=D.querySelector('#am'), menu=D.querySelector('#menu');
  const search=debounce(async()=>{
    const q=inp.value.trim(); const d2=await jget(`/bridge/users?q=${enc(q)}&page_size=8`);
    menu.style.display='block';
    const opts=(d2.users||[]);
    menu.innerHTML=opts.length?opts.map(u=>`<div data-s="${esc(u.subject)}">${esc(u.username)}</div>`).join(''):'<div class="none">no users</div>';
    menu.querySelectorAll('[data-s]').forEach(el=>el.onclick=async()=>{
      const r=await jpost('/bridge/role-grant',{subject:el.dataset.s,role:role.key});
      r.ok?(toast('added'),roleDetail(role,page)):toast(r.j.error||'failed',true);
    });
  });
  inp.oninput=search; inp.onfocus=search;
  document.addEventListener('click',e=>{if(!D.querySelector('.add').contains(e.target))menu.style.display='none';},{once:true});
}

// ---- App Access: which roles see each app -------------------------------------------------------
async function apps(){
  const V=document.getElementById('view');
  V.innerHTML='<div class="detail" style="height:calc(100vh - 98px);overflow:auto"><div class="empty">loading…</div></div>';
  const d=await jget('/apps'); const D=V.querySelector('.detail');
  let html='<div class="lbl">App Access — which roles may see each app (empty = everyone). System apps are fixed.</div>';
  (d.apps||[]).forEach(a=>{
    const roles=(a.roles||[]);
    html+=`<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 0;border-bottom:1px solid #1a1f27">
      <span style="font-weight:600;min-width:130px">${esc(a.name)}</span>`;
    if(a.system) html+=`<span class="muted" style="font-size:11px">system</span>`+(roles.length?roles.map(r=>`<span class="chip">${esc(r)}</span>`).join(''):'<span class="muted">everyone</span>');
    else html+=`<input class="search" style="margin:0;flex:1;min-width:180px" data-app="${esc(a.id)}" value="${esc(roles.join(', '))}" placeholder="roles (comma) — empty = everyone">
                <button class="pbtn" data-save="${esc(a.id)}">Save</button>`;
    html+='</div>';
  });
  D.innerHTML=html;
  D.querySelectorAll('[data-save]').forEach(b=>b.onclick=async()=>{
    const inp=D.querySelector(`input[data-app="${b.dataset.save}"]`);
    const roles=inp.value.split(',').map(s=>s.trim()).filter(Boolean);
    const r=await jpost('/bridge/app-install',{app_id:b.dataset.save,roles});
    r.ok?toast('updated'):toast(r.j.error||'failed',true);
  });
}
boot();
</script>
