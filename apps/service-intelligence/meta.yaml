version: 0.1.0
provider: ds:airawatdeveloper:developer
display_name: Service Intelligence
icon: 📈
entrypoint: index.html
required_schemas: [platform.case, platform.task, urban.payment, network.service_offering]
writes: []
sandboxed: true
roles: [platform.tenant-admin, urban.commissioner]
