<!doctype html><html><head><meta charset="utf-8"><title>Results Console</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{--bg:#0a1310;--pan:#10201a;--pan2:#0c1712;--edge:#23372d;--ink:#eafef4;--dim:#8fb6a4;
    --money:#e8c24b;--money2:#241d0d;--infra:#6fa2f0;--infra2:#0e1c33;--welf:#2fd0c8;--welf2:#0b2320;--gate:#f0954a;--bad:#e0736f}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:ui-sans-serif,system-ui,-apple-system,sans-serif}
  #app{position:absolute;inset:0;display:flex;flex-direction:column;overflow:hidden}
  header{padding:13px 22px;border-bottom:1px solid var(--edge);display:flex;gap:16px;align-items:center;flex-wrap:wrap}
  header .k{font:11px ui-monospace,monospace;letter-spacing:.2em;text-transform:uppercase;color:var(--welf)}
  header h1{margin:2px 0 0;font-family:ui-serif,Georgia,serif;font-size:21px;font-weight:600}
  header .sp{margin-left:auto;display:flex;gap:8px;align-items:center}
  select{padding:9px 11px;border-radius:10px;border:1px solid var(--edge);background:var(--pan);color:var(--ink);font-size:13.5px;min-width:230px}
  .btn{padding:9px 14px;border-radius:9px;border:1px solid var(--welf);background:linear-gradient(180deg,#2fd0c822,#2fd0c810);color:#bff;font-size:12.5px;font-weight:650;cursor:pointer}
  .btn.ghost{border-color:var(--edge);background:var(--pan);color:var(--dim)}
  .btn.gold{border-color:var(--money);background:linear-gradient(180deg,#e8c24b22,#e8c24b10);color:#f6e7bf}
  .btn:disabled{opacity:.5}
  #msg{font-size:12px;color:var(--dim);padding:6px 22px;min-height:15px}
  main{flex:1;overflow:auto;padding:14px 22px 40px}
  /* ribbon */
  .ribbon{display:flex;gap:0;overflow-x:auto;padding-bottom:6px}
  .st{flex:1 1 0;min-width:210px;background:var(--pan);border:1px solid var(--edge);border-radius:15px;padding:15px;position:relative;margin-right:26px}
  .st:last-child{margin-right:0}
  .st::after{content:"→";position:absolute;right:-21px;top:50%;transform:translateY(-50%);color:var(--dim);font-size:20px;font-weight:700}
  .st:last-child::after{content:""}
  .st .cap{font:700 10.5px ui-monospace,monospace;letter-spacing:.1em;text-transform:uppercase}
  .st.need .cap,.st.outcome .cap{color:var(--welf)} .st.outlay .cap{color:var(--money)} .st.output .cap{color:var(--infra)}
  .st h3{margin:3px 0 8px;font-size:16px;font-weight:650}
  .st .big{font-size:24px;font-weight:800;font-variant-numeric:tabular-nums}
  .st.outlay .big{color:var(--money)} .st.output .big{color:var(--infra)} .st.outcome .big{color:var(--welf)}
  .st p{margin:6px 0 0;font-size:12.5px;color:var(--dim);line-height:1.5}
  .bar{height:9px;border-radius:6px;background:#0a1611;border:1px solid var(--edge);overflow:hidden;margin:9px 0 4px}
  .bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--money),#f0c96a)}
  .bar.w>i{background:linear-gradient(90deg,var(--welf),#7fe6df)}
  .cols{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:20px}
  @media(max-width:820px){.cols{grid-template-columns:1fr}}
  .card{background:var(--pan);border:1px solid var(--edge);border-radius:14px;padding:15px 17px}
  .card h2{font:11px ui-monospace,monospace;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);margin:0 0 12px}
  .orow{display:flex;align-items:center;gap:11px;padding:9px 11px;border:1px solid var(--edge);border-radius:11px;background:var(--pan2);margin-bottom:8px}
  .orow .ic{width:30px;height:30px;border-radius:8px;background:var(--infra2);border:1px solid var(--infra);display:grid;place-items:center;color:var(--infra);flex:none;font-size:14px}
  .orow .nm{flex:1;min-width:0}.orow .nm b{font-size:13.5px}.orow .nm .d{font-size:11px;color:var(--dim);font-family:ui-monospace,monospace}
  .orow .cost{font-weight:800;color:var(--money);font-variant-numeric:tabular-nums}
  .oc .line{display:flex;justify-content:space-between;font-size:13px;margin:5px 0}
  .oc .line b{font-variant-numeric:tabular-nums}
  .moved{font-size:30px;font-weight:800;color:var(--welf);font-variant-numeric:tabular-nums}
  .chip{display:inline-block;font:11px ui-monospace,monospace;color:var(--dim);background:var(--pan2);border:1px solid var(--edge);border-radius:6px;padding:2px 7px;margin:3px 3px 0 0}
  .note{font-size:11.5px;color:var(--gate);margin-top:8px}
  .prov{font-size:11px;color:var(--dim);margin-top:6px;font-style:italic}
  .empty{color:var(--dim);font-size:13px;padding:22px;text-align:center;border:1px dashed var(--edge);border-radius:12px}
  /* operator drawer */
  details.ops{margin-top:20px;background:var(--pan);border:1px solid var(--edge);border-radius:14px;padding:6px 16px}
  details.ops summary{cursor:pointer;font:700 12px ui-monospace,monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);padding:10px 0}
  .form{display:grid;grid-template-columns:repeat(6,1fr);gap:9px;align-items:end;padding:6px 0 14px}
  @media(max-width:820px){.form{grid-template-columns:1fr 1fr}}
  .form label{font-size:11px;color:var(--dim);display:flex;flex-direction:column;gap:4px}
  .form input,.form select{padding:9px;border-radius:9px;border:1px solid var(--edge);background:var(--pan2);color:var(--ink);font-size:13px}
  .load{position:absolute;inset:0;display:grid;place-items:center;background:var(--bg);z-index:9;color:var(--dim)}
</style></head><body>
<div id="app">
  <header>
    <div><div class="k" id="eyebrow">Outlay → Output → Outcome</div><h1>Results Console</h1></div>
    <div class="sp">
      <select id="proj"><option value="">Loading projects…</option></select>
      <button class="btn ghost" id="refresh">↻</button>
    </div>
  </header>
  <div id="msg"></div>
  <main id="main"><div class="empty">Pick a project to trace its thread — money spent → units delivered → people moved above the floor.</div></main>
</div>
<div class="load" id="load0">loading…</div>
<script>
const $=id=>document.getElementById(id), esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let APPID="results-console", TENANT=null, PROJECT=null, THREAD=null, RECEIVED=null;
const cr=n=>n==null?"—":"₹"+Number(n).toLocaleString("en-IN",{maximumFractionDigits:2})+"cr";
const num=n=>n==null?"—":Math.round(n).toLocaleString("en-IN");
async function bridge(p,b){const r=await fetch(p,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(b||{}),credentials:"include"});if(!r.ok){let t="";try{t=(await r.json()).error||"";}catch(e){}throw new Error(t||(p+" "+r.status));}return r.json();}
async function q(schema){try{const d=await bridge("/bridge/query",{app_id:APPID,schema,limit:200});return (d.results||d.objects||d||[]).map(x=>x.object||x);}catch(e){return [];}}

function ribbon(t){
  const need=t.need||{}, pro=t.proposal||{}, out=t.outlay||{}, outs=t.outputs||[], oc=t.outcome||{};
  const spent=out.spent_cr||0, alloc=out.allocated_cr||0, pctS=alloc?Math.min(100,spent/alloc*100):0;
  const base=oc.baseline||0, moved=oc.persons_moved||0, pctM=base?Math.min(100,moved/base*100):0;
  const totalUnits=outs.reduce((s,o)=>s+(o.qty||0),0);
  return `<div class="ribbon">
    <div class="st need"><div class="cap">① Need · why</div><h3>Diagnosis</h3>
      <p>${esc((need.summary||need.recommendation||"—")).slice(0,150)}</p></div>
    <div class="st outlay"><div class="cap">② Outlay · money</div><h3>Spend</h3>
      <div class="big">${cr(spent)}</div><div class="bar"><i style="width:${pctS}%"></i></div>
      <p>of ${cr(alloc)} allocated${out.committed_revenue_cr?`<br><b style="color:var(--money)">${cr(out.committed_revenue_cr)}</b> committed by funders`:''}${out.realized_revenue_cr?` · <b style="color:var(--welf)">${cr(out.realized_revenue_cr)}</b> received`:(RECEIVED?`<br><b style="color:var(--welf)">${cr(RECEIVED)}</b> received`:'')}</p></div>
    <div class="st output"><div class="cap">④ Output · delivered</div><h3>Delivery</h3>
      <div class="big">${outs.length}</div>
      <p>${outs.length?esc(outs.map(o=>num(o.qty)+" "+o.unit).join(" · ")):"nothing recorded yet"}</p></div>
    <div class="st outcome"><div class="cap">⑤ Outcome · benefit</div><h3>People moved</h3>
      <div class="big">${num(moved)}</div><div class="bar w"><i style="width:${pctM}%"></i></div>
      <p>of ${num(base)} below the floor</p></div>
  </div>`;
}
function detail(t){
  const outs=t.outputs||[], oc=t.outcome||{}, pro=t.proposal||{};
  const outputsHtml = outs.length? outs.map(o=>`<div class="orow"><div class="ic">▦</div>
      <div class="nm"><b>${esc(o.type||'output')}</b><div class="d">${esc(o.id?o.id.split('/').pop():'')}</div></div>
      <div style="text-align:right"><div><b>${num(o.qty)}</b> <span style="color:var(--dim);font-size:11px">${esc(o.unit||'')}</span></div>
        <div class="cost">${cr(o.cost_cr)}</div></div></div>`).join("")
    : `<div class="empty">No outputs recorded. Use <b>Operator actions</b> below to record a delivery.</div>`;
  const attributed=(oc.attributed_outputs||[]).length;
  const ocHtml = oc.id? `<div class="oc">
      <div class="line"><span>Baseline below floor</span><b>${num(oc.baseline)}</b></div>
      <div class="line"><span>Remaining after delivery</span><b>${num(oc.actual)}</b></div>
      <div style="margin:10px 0 2px"><span style="font-size:11px;color:var(--dim)">Persons moved above the floor</span><div class="moved">${num(oc.persons_moved)}</div></div>
      <div style="margin-top:8px">${(oc.attributed_outputs||[]).map(a=>`<span class="chip">↳ ${esc(a.split('/').pop())}</span>`).join("")||'<span class="chip">no attribution</span>'}</div>
      <div class="prov">attributed to ${attributed} output(s) — the output→outcome edge</div>
      <div class="note">Projected from real baseline + delivered outputs — replace with post-works re-survey.</div>
    </div>`
    : `<div class="empty">Outcome not measured yet. Record outputs, then <b>Re-measure outcome</b>.</div>`;
  return `<div class="cols">
    <div class="card"><h2>Output ledger — what was delivered</h2>${outputsHtml}
      <div style="margin-top:8px;font-size:12px;color:var(--dim)">Proposal <b style="color:var(--ink)">${esc((pro.id||'').split('/').pop())}</b> · ask ${cr(pro.ask_cr)}</div></div>
    <div class="card"><h2>Outcome — did the need move?</h2>${ocHtml}</div>
  </div>
  <details class="ops"><summary>⚙ Operator actions — record a delivery / re-measure</summary>
    <div class="form">
      <label>Output type<select id="f_type">
        <option value="dwelling_unit">dwelling_unit</option><option value="service_connection">service_connection</option>
        <option value="length_m">length_m</option><option value="priority_cells_treated">priority_cells_treated</option>
        <option value="facility">facility</option><option value="other">other</option></select></label>
      <label>Quantity<input id="f_qty" type="number" min="0" step="1" value="1000"></label>
      <label>Unit<input id="f_unit" value="units"></label>
      <label>Cost (₹cr)<input id="f_cost" type="number" min="0" step="0.5" value="10"></label>
      <label>Milestone<input id="f_ms" value="m1"></label>
      <label>&nbsp;<button class="btn gold" id="f_add">＋ Record delivery</button></label>
    </div>
    <div style="padding:0 0 12px"><button class="btn" id="f_close">↻ Re-measure outcome</button>
      <span style="font-size:11.5px;color:var(--dim);margin-left:10px">Recording a delivery posts a balanced finance transaction against the project budget.</span></div>
  </details>`;
}
function render(){
  if(!THREAD){$("main").innerHTML=`<div class="empty">Pick a project.</div>`;return;}
  $("main").innerHTML=ribbon(THREAD)+detail(THREAD);
  const add=$("f_add"); if(add) add.onclick=recordOutput;
  const cl=$("f_close"); if(cl) cl.onclick=closeOutcome;
}
async function load(){
  if(!PROJECT){THREAD=null;render();return;}
  $("msg").textContent="loading thread…";
  try{ THREAD=await bridge("/bridge/results-thread",{project:PROJECT});
    try{ RECEIVED=(await bridge("/bridge/funding-received",{project:PROJECT})).received_cr; }catch(e){ RECEIVED=null; }
    $("msg").textContent=""; render(); }
  catch(e){ $("msg").textContent="thread unavailable: "+e.message; }
}
async function recordOutput(){
  const body={project:PROJECT, proposal:(THREAD.proposal||{}).id, output_type:$("f_type").value,
    quantity:parseFloat($("f_qty").value)||0, unit:$("f_unit").value||"units", cost_cr:parseFloat($("f_cost").value)||0,
    milestone:$("f_ms").value||"m1"};
  $("msg").textContent="recording delivery + posting transaction…"; $("f_add").disabled=true;
  try{ const r=await bridge("/bridge/results-record-output",body);
    $("msg").textContent="✓ output recorded"+(r.transaction?" · transaction "+r.transaction.split('/').pop()+" posted (₹"+body.cost_cr+"cr)":"");
    await load(); }
  catch(e){ $("msg").textContent="record failed: "+e.message; }
  finally{ const a=$("f_add"); if(a) a.disabled=false; }
}
async function closeOutcome(){
  $("msg").textContent="re-measuring outcome…"; const b=$("f_close"); if(b) b.disabled=true;
  try{ const r=await bridge("/bridge/results-close-outcome",{project:PROJECT});
    $("msg").textContent="✓ outcome: "+num(r.persons_moved)+" persons moved (attributed to "+r.attributed_outputs+" outputs)";
    await load(); }
  catch(e){ $("msg").textContent="re-measure failed: "+e.message; }
  finally{ const b2=$("f_close"); if(b2) b2.disabled=false; }
}
$("proj").onchange=e=>{PROJECT=e.target.value||null;load();};
$("refresh").onclick=load;
(async()=>{
  try{
    const cfg=await fetch("./config.json").then(r=>r.json()).catch(()=>({})); APPID=cfg.app_id||APPID; TENANT=cfg.tenant||null;
    if(TENANT) $("eyebrow").textContent="Outlay → Output → Outcome · "+TENANT;
    const projs=(await q("project.project")).filter(p=>p.name||p.id);
    $("proj").innerHTML=`<option value="">Select a project…</option>`+projs.map(p=>`<option value="${esc(p.id)}">${esc(p.name||p.id.split('/').pop())}</option>`).join("");
    if(projs.length===1){ PROJECT=projs[0].id; $("proj").value=PROJECT; await load(); }
    $("load0").remove();
  }catch(e){ $("load0").textContent="error: "+e.message; }
})();
</script></body></html>
