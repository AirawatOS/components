# RESULTS CONSOLE (kind=app) — the funder/operator face of the outlay→output→outcome thread (ADR-0071/0072).
# For a chosen project it renders the whole chain as one ribbon: NEED (recommendation) → OUTLAY (budget spent,
# double-entry) → OUTPUT (delivered units + their cost) → OUTCOME (need re-measured, persons moved, attributed to
# the outputs). Drives the results-ledger-engine verbs to RECORD a delivery (which posts a balanced finance
# transaction) and RE-MEASURE the outcome — so a funder reading the progress subscription sees ₹ → units → people,
# every link a signed, located, dated, attributed fact. Reads the thread; all writes ride the engine's grant.
component_id: ds:airawatdeveloper:app/results-console
kind: app
version: 0.1.0
provider: ds:airawat:developer
display_name: Results Console
entrypoint: index.html
bundle: dist
sandboxed: true
required_schemas: [project.project, project.proposal, finance.budget, project.output, project.outcome, governance.recommendation]
reads: [project.project, project.proposal, finance.budget, project.output, project.outcome, governance.recommendation]
writes: []
roles: [platform.tenant-admin]
