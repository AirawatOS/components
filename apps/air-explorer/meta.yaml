# A UI app (kind=app). It holds NO component run-token and NO registry handle: it runs in the browser
# and calls the kernel under the SIGNED-IN USER's token, mediated by the app-host (PLAT-HOST-005).
# It declares required_schemas (its DATA allow-list), not broker scopes.
component_id: ds:airawat:app/air-explorer
kind: app
version: 0.2.1   # 0.2.1: OSM basemap under the PM2.5 choropleth (host tile-proxy) + CPCB station markers
provider: ds:airawat:developer
display_name: Air Explorer
icon: 🌫️
entrypoint: index.html      # SPA entry inside the bundle
bundle: dist                # the static bundle directory served under /apps/<id>/
sandboxed: true             # third-party default → null-origin iframe + host-mediated calls
required_schemas: [air.quality, air.hotspot, air.sensor_reading, governance.recommendation]
roles: [urban.pollution-control-officer]   # the officer this workbench serves — installing it makes the role grantable in the tenant