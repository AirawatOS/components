<!doctype html><meta charset="utf-8"><title>Policy Console</title>
<!--
  POLICY CONSOLE — govern ALL tenant policy in one place. A policy = {domain, applies_to, rules}. `applies_to`
  targets whom (min level rank / stream / role / unit); `rules` is the domain-specific payload. Modules resolve
  the applicable policy per employee via /bridge/policy-resolve (most-specific wins). Writes org.policy (admin).
-->
<style>
  :root{--bg:#0b0f14;--panel:#141a22;--line:#222b36;--ink:#e6edf3;--dim:#8b949e;--accent:#7c5cff;--good:#2ea043}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  .wrap{display:flex;height:100%}
  .nav{width:180px;flex:0 0 auto;border-right:1px solid var(--line);padding:14px 10px;background:rgba(10,14,20,.4)}
  .nav h1{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--dim);margin:2px 8px 12px}
  .nav a{display:flex;align-items:center;gap:9px;padding:9px 11px;border-radius:9px;color:var(--ink);cursor:pointer;margin-bottom:3px;font-weight:500}
  .nav a:hover{background:#161d27}.nav a.on{background:#221a44;color:#d8ccff}
  .nav a .c{margin-left:auto;font-size:11px;color:var(--dim);background:#0d1117;border:1px solid var(--line);border-radius:20px;padding:0 7px}
  .nav hr{border:0;border-top:1px solid var(--line);margin:10px 6px}
  .main{flex:1;min-width:0;overflow:auto;padding:20px 24px}
  .head{display:flex;align-items:center;margin-bottom:14px}.head h2{margin:0;font-size:18px}.head .sub{color:var(--dim);margin-left:10px;font-size:12px}
  .right{margin-left:auto}
  .btn{border:1px solid var(--line);background:#1b232e;color:var(--ink);border-radius:8px;padding:7px 13px;font-size:13px;cursor:pointer}
  .btn:hover{border-color:#33455a}.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}.btn.pri:hover{filter:brightness(1.1)}
  .btn.sm{padding:3px 9px;font-size:12px}.btn.ghost{background:none}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:12px}
  table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);font-size:13px;vertical-align:top}
  th{color:var(--dim);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.04em}
  tr:hover td{background:#121821}
  .pill{display:inline-block;font-size:11px;padding:1px 8px;border-radius:20px;border:1px solid var(--line);color:var(--dim);margin:1px 2px}
  .pill.dom{color:#d8ccff;border-color:#3a2f66}.pill.active{color:#7ee2a8;border-color:#1f6f43}.pill.draft{color:#e6c34a;border-color:#7a5c12}
  .empty{color:var(--dim);padding:24px;text-align:center;border:1px dashed var(--line);border-radius:12px}
  label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--dim);margin:0 0 4px}
  input,select,textarea{width:100%;background:#0d1117;border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:8px 10px;font-size:13px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.grid.g3{grid-template-columns:1fr 1fr 1fr}
  .row{margin-bottom:12px}.muted{color:var(--dim)}.err{color:#ff9b9b;font-size:12px;margin-top:8px}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:flex-start;justify-content:center;padding:5vh 16px;z-index:30}
  .modal.open{display:flex}.sheet{background:#0f151d;border:1px solid var(--line);border-radius:14px;padding:20px;width:640px;max-width:100%;max-height:90vh;overflow:auto}
  .sheet h3{margin:0 0 14px}
  .kv{font-size:12px;color:var(--dim)} .kv b{color:var(--ink);font-weight:600}
</style>

<div class="wrap">
  <nav class="nav">
    <h1>📐 Policy</h1>
    <a data-d="all"><span>📚</span> All <span class="c" id="c-all">0</span></a>
    <a data-d="leave"><span>🏖️</span> Leave <span class="c" id="c-leave">0</span></a>
    <a data-d="travel"><span>✈️</span> Travel <span class="c" id="c-travel">0</span></a>
    <a data-d="expense"><span>🧾</span> Expense <span class="c" id="c-expense">0</span></a>
    <a data-d="attendance"><span>⏱️</span> Attendance <span class="c" id="c-attendance">0</span></a>
    <hr>
    <a data-d="__resolve"><span>🔎</span> Resolve</a>
  </nav>
  <main class="main" id="main"></main>
</div>
<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>

<script>
const api=(p,b)=>fetch(p,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b||{})}).then(r=>r.json());
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const APP='policy-console';
const DOMAINS=['leave','travel','expense','attendance'];
let TENANT='', LEVELS=[], STREAMS=[], UNITS=[], ROLES=[], EMPS=[], POLICIES=[], VIEW='all';
const byCode=(a,c)=>a.find(x=>x.code===c)||{};
const byId=(a,i)=>a.find(x=>x.id===i)||{};
const rankName=r=>{const l=LEVELS.slice().sort((a,b)=>a.rank-b.rank).find(x=>x.rank===r);return l?l.name:('rank '+r);};
async function query(schema){ try{ const r=await api('/bridge/query',{app_id:APP,schema}); return (r.results||[]).map(x=>x.object||x);}catch(e){return [];} }

async function boot(){
  try{const se=await fetch('/session').then(r=>r.json()); TENANT=se.tenant||(se.sub||'').replace(/^user:\/\//,'').split('/')[0];}catch(e){}
  try{ROLES=((await api('/bridge/catalog?kind=roles',{})).roles||[]).map(r=>r.role).filter(Boolean).sort();}catch(e){}
  [LEVELS,STREAMS,UNITS,EMPS,POLICIES]=await Promise.all([query('hr.job_level'),query('hr.career_stream'),query('org.org_unit'),query('org.employee'),query('org.policy')]);
  document.querySelectorAll('.nav a').forEach(a=>a.onclick=()=>{VIEW=a.dataset.d;render();});
  counts(); render();
}
function counts(){ document.getElementById('c-all').textContent=POLICIES.length;
  DOMAINS.forEach(d=>document.getElementById('c-'+d).textContent=POLICIES.filter(p=>p.domain===d).length); }
function render(){
  document.querySelectorAll('.nav a').forEach(a=>a.classList.toggle('on',a.dataset.d===VIEW));
  if(VIEW==='__resolve') return rResolve();
  const list = VIEW==='all'?POLICIES:POLICIES.filter(p=>p.domain===VIEW);
  const rows = list.map(p=>`<tr>
      <td><b>${esc(p.name)}</b></td>
      <td><span class="pill dom">${esc(p.domain)}</span></td>
      <td>${appliesLabel(p.applies_to)}</td>
      <td class="kv">${rulesLabel(p)}</td>
      <td><span class="pill ${p.status==='active'?'active':'draft'}">${esc(p.status||'active')}</span></td>
      <td><button class="btn sm ghost" onclick='edit("${esc(p.id)}")'>edit</button></td></tr>`).join('');
  document.getElementById('main').innerHTML=`<div class="head"><h2>${VIEW==='all'?'All policies':(VIEW[0].toUpperCase()+VIEW.slice(1)+' policy')}</h2>
      <span class="sub">who it applies to × the rule</span>
      <div class="right"><button class="btn pri" onclick='add()'>＋ New policy</button></div></div>`
    + (list.length?`<div class="card" style="padding:0"><table><thead><tr><th>Name</th><th>Domain</th><th>Applies to</th><th>Rule</th><th>Status</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>`
       :`<div class="empty">No ${VIEW==='all'?'':VIEW+' '}policies yet.</div>`);
}
function appliesLabel(a){ a=a||{}; const bits=[];
  if(a.min_rank!=null) bits.push('level ≥ '+esc(rankName(a.min_rank)));
  if(a.max_rank!=null) bits.push('≤ '+esc(rankName(a.max_rank)));
  if(a.stream) bits.push('stream '+esc(byCode(STREAMS,a.stream).name||a.stream));
  if(a.role) bits.push('role '+esc(a.role));
  if(a.org_unit) bits.push('unit '+esc((byId(UNITS,a.org_unit).name)||a.org_unit));
  return bits.length?bits.map(b=>`<span class="pill">${b}</span>`).join(' '):'<span class="muted">everyone</span>'; }
function rulesLabel(p){ const r=p.rules||{};
  if(p.domain==='leave') return `${esc(r.leave_type||'—')}: <b>${esc(r.annual_entitlement)}</b> days/yr${r.accrual_per_month?(' · +'+esc(r.accrual_per_month)+'/mo'):''}${r.carry_forward_max!=null?(' · carry '+esc(r.carry_forward_max)):''}`;
  if(p.domain==='travel') return `class <b>${esc(r.travel_class||'—')}</b>${r.per_diem!=null?(' · per-diem '+esc(r.per_diem)):''}`;
  if(p.domain==='expense') return `approval limit <b>${esc(r.approval_limit)}</b>`;
  return Object.entries(r).map(([k,v])=>`${esc(k)}=<b>${esc(v)}</b>`).join(' · ')||'—'; }

/* ---------- RESOLVE preview ---------- */
function rResolve(){
  document.getElementById('main').innerHTML=`<div class="head"><h2>Resolve</h2><span class="sub">which policy applies to a person</span></div>
    <div class="card"><div class="grid">
        <div class="row"><label>Employee</label><select id="r_emp">${EMPS.map(e=>`<option value="${esc(e.id)}">${esc(e.name)} · ${esc(e.emp_code||'')}</option>`).join('')}</select></div>
        <div class="row"><label>Domain</label><select id="r_dom">${DOMAINS.map(d=>`<option>${d}</option>`).join('')}</select></div></div>
      <button class="btn pri" onclick="doResolve()">Resolve</button></div>
    <div id="r_out"></div>`;
}
async function doResolve(){
  const emp=document.getElementById('r_emp').value, dom=document.getElementById('r_dom').value;
  const r=await api('/bridge/policy-resolve',{domain:dom,employee:emp});
  const c=r.context||{};
  const ctx=`<div class="card"><div class="kv">Context — level rank <b>${c.rank!=null?esc(c.rank)+' ('+esc(rankName(c.rank))+')':'—'}</b> · stream <b>${esc(c.stream?(byCode(STREAMS,c.stream).name||c.stream):'—')}</b> · roles <b>${esc((c.roles||[]).join(', ')||'—')}</b> · unit <b>${esc(c.org_unit?(byId(UNITS,c.org_unit).name||c.org_unit):'—')}</b></div></div>`;
  const pl=(r.policies||[]);
  const list = pl.length ? `<div class="card" style="padding:0"><table><thead><tr><th>Applies (most-specific first)</th><th>Rule</th></tr></thead><tbody>`
      + pl.map(p=>`<tr><td><b>${esc(p.name)}</b><br>${appliesLabel(p.applies_to)}</td><td class="kv">${rulesLabel(p)}</td></tr>`).join('')+`</tbody></table></div>`
    : `<div class="empty">No ${esc(dom)} policy matches this person.</div>`;
  document.getElementById('r_out').innerHTML=ctx+list;
}

/* ---------- FORM ---------- */
let EDIT=null;
const optC=(a,sel,f)=>`<option value="">—</option>`+a.map(o=>`<option value="${esc(o.code)}"${o.code===sel?' selected':''}>${esc(f(o))}</option>`).join('');
const optId=(a,sel,f)=>`<option value="">—</option>`+a.map(o=>`<option value="${esc(o.id)}"${o.id===sel?' selected':''}>${esc(f(o))}</option>`).join('');
const optV=(vals,sel)=>vals.map(v=>`<option${v===sel?' selected':''}>${esc(v)}</option>`).join('');
const rankOpt=sel=>`<option value="">—</option>`+LEVELS.slice().sort((a,b)=>a.rank-b.rank).map(l=>`<option value="${l.rank}"${String(l.rank)===String(sel)?' selected':''}>${esc(l.name)} (rank ${l.rank})</option>`).join('');
const val=id=>{const e=document.getElementById(id);return e?e.value.trim():'';};
function add(){ EDIT={domain:(VIEW!=='all'&&VIEW!=='__resolve')?VIEW:'leave',status:'active',applies_to:{},rules:{}}; openForm(); }
function edit(id){ EDIT=JSON.parse(JSON.stringify(byId(POLICIES,id))); openForm(); }
function rulesForm(dom,r){ r=r||{};
  if(dom==='leave') return `<div class="grid g3">
      <div class="row"><label>Leave type</label><select id="k_leave_type">${optV(['casual','sick','earned','unpaid','other'],r.leave_type||'casual')}</select></div>
      <div class="row"><label>Annual entitlement (days)</label><input id="k_annual_entitlement" type="number" value="${esc(r.annual_entitlement!=null?r.annual_entitlement:'')}" placeholder="30"></div>
      <div class="row"><label>Accrual / month</label><input id="k_accrual_per_month" type="number" value="${esc(r.accrual_per_month!=null?r.accrual_per_month:'')}" placeholder="2.5"></div></div>
    <div class="row" style="max-width:240px"><label>Carry-forward max</label><input id="k_carry_forward_max" type="number" value="${esc(r.carry_forward_max!=null?r.carry_forward_max:'')}" placeholder="15"></div>`;
  if(dom==='travel') return `<div class="grid">
      <div class="row"><label>Travel class</label><input id="k_travel_class" value="${esc(r.travel_class||'')}" placeholder="AC-2 tier / Economy"></div>
      <div class="row"><label>Per-diem</label><input id="k_per_diem" type="number" value="${esc(r.per_diem!=null?r.per_diem:'')}" placeholder="1500"></div></div>`;
  if(dom==='expense') return `<div class="row" style="max-width:260px"><label>Approval limit</label><input id="k_approval_limit" type="number" value="${esc(r.approval_limit!=null?r.approval_limit:'')}" placeholder="50000"></div>`;
  if(dom==='attendance') return `<div class="grid">
      <div class="row"><label>Grace minutes</label><input id="k_grace_minutes" type="number" value="${esc(r.grace_minutes!=null?r.grace_minutes:'')}" placeholder="15"></div>
      <div class="row"><label>WFH allowed?</label><select id="k_wfh_allowed">${optV(['no','yes'],r.wfh_allowed?'yes':'no')}</select></div></div>`;
  return `<div class="row"><label>Rules (JSON)</label><textarea id="k_json" rows="3">${esc(JSON.stringify(r||{}))}</textarea></div>`;
}
function collectRules(dom){ const num=id=>{const v=val(id);return v===''?undefined:Number(v);};
  if(dom==='leave'){const o={leave_type:val('k_leave_type'),annual_entitlement:num('k_annual_entitlement')};
    if(num('k_accrual_per_month')!==undefined)o.accrual_per_month=num('k_accrual_per_month'); if(num('k_carry_forward_max')!==undefined)o.carry_forward_max=num('k_carry_forward_max'); return o;}
  if(dom==='travel'){const o={};if(val('k_travel_class'))o.travel_class=val('k_travel_class');if(num('k_per_diem')!==undefined)o.per_diem=num('k_per_diem');return o;}
  if(dom==='expense'){const o={};if(num('k_approval_limit')!==undefined)o.approval_limit=num('k_approval_limit');return o;}
  if(dom==='attendance'){const o={};if(num('k_grace_minutes')!==undefined)o.grace_minutes=num('k_grace_minutes');o.wfh_allowed=(val('k_wfh_allowed')==='yes');return o;}
  try{return JSON.parse(val('k_json')||'{}');}catch(e){return {};} }
function openForm(){ const p=EDIT, a=p.applies_to||{};
  document.getElementById('sheet').innerHTML=`<h3>${p.id?'Edit':'New'} policy</h3>
    <div class="grid"><div class="row"><label>Name</label><input id="f_name" value="${esc(p.name||'')}" placeholder="Officer leave — L4+"></div>
      <div class="row"><label>Domain</label><select id="f_domain" onchange="switchDom(this.value)">${optV(DOMAINS,p.domain||'leave')}</select></div></div>
    <div class="card" style="background:#0d1117"><div class="muted" style="margin-bottom:8px">Applies to <span class="muted">(leave a field blank = no constraint)</span></div>
      <div class="grid g3"><div class="row"><label>Min level (≥)</label><select id="f_min_rank">${rankOpt(a.min_rank)}</select></div>
        <div class="row"><label>Max level (≤)</label><select id="f_max_rank">${rankOpt(a.max_rank)}</select></div>
        <div class="row"><label>Stream</label><select id="f_stream">${optC(STREAMS,a.stream,x=>x.name)}</select></div></div>
      <div class="grid"><div class="row"><label>Role</label><select id="f_role"><option value="">—</option>${ROLES.map(r=>`<option${r===a.role?' selected':''}>${esc(r)}</option>`).join('')}</select></div>
        <div class="row"><label>Org unit</label><select id="f_org_unit">${optId(UNITS,a.org_unit,u=>u.name)}</select></div></div></div>
    <div class="card" style="background:#0d1117"><div class="muted" style="margin-bottom:8px">Rule</div><div id="rulesbox">${rulesForm(p.domain||'leave',p.rules)}</div></div>
    <div class="row" style="max-width:200px"><label>Status</label><select id="f_status">${optV(['active','draft','retired'],p.status||'active')}</select></div>
    <div id="ferr" class="err"></div>
    <div style="display:flex;gap:8px;margin-top:14px"><button class="btn pri" onclick="submitForm()">Save</button><button class="btn ghost" onclick="closeModal()">Cancel</button></div>`;
  document.getElementById('modal').classList.add('open');
}
function switchDom(d){ EDIT.rules=collectRules(EDIT.domain||'leave'); EDIT.domain=d; document.getElementById('rulesbox').innerHTML=rulesForm(d,EDIT.rules); }
function closeModal(){ document.getElementById('modal').classList.remove('open'); EDIT=null; }
async function submitForm(){ const p=EDIT; p.domain=val('f_domain'); p.name=val('f_name');
  if(!p.name){document.getElementById('ferr').textContent='Name is required';return;}
  const a={}; const nr=id=>{const v=val(id);return v===''?undefined:Number(v);};
  if(nr('f_min_rank')!==undefined)a.min_rank=nr('f_min_rank'); if(nr('f_max_rank')!==undefined)a.max_rank=nr('f_max_rank');
  if(val('f_stream'))a.stream=val('f_stream'); if(val('f_role'))a.role=val('f_role'); if(val('f_org_unit'))a.org_unit=val('f_org_unit');
  p.applies_to=a; p.rules=collectRules(p.domain); p.status=val('f_status')||'active'; p.schema='org.policy';
  p.id=p.id||`ds:${TENANT}:policy/${(p.domain)}-${(p.name||'p').toLowerCase().replace(/[^a-z0-9]+/g,'-').slice(0,24)}-${Date.now().toString(36).slice(-4)}`;
  p.created_at=p.created_at||new Date().toISOString();
  const r=await api('/bridge/save',{app_id:APP,id:p.id,object:p});
  if(r.error){document.getElementById('ferr').textContent=r.error+(r.detail?(' — '+r.detail):'');return;}
  closeModal(); POLICIES=await query('org.policy'); counts(); render();
}
boot();
</script>
