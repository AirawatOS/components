# An APP (kind=app) — the Court Console: the single work surface for a court's case lifecycle
# (file → scrutiny → registration → hearing → disposal). Reads governed justice.* + platform.* via
# /bridge/query; writes them via /bridge/save (delegated: component://court-console obo the signed-in
# court officer). Every transition is an attributed, governed write — no direct DB, no bespoke backend.
component_id: ds:airawatdeveloper:app/court-console
kind: app
version: 0.1.6   # slice 5: court-fee payment (justice.payment)
provider: ds:airawat:developer
display_name: Court Console
icon: "⚖️"
entrypoint: index.html
bundle: dist
sandboxed: true
# READS — the case file as the court holds it
required_schemas: [justice.court, justice.case, justice.filing, justice.scrutiny_result, justice.hearing, justice.appearance, justice.disposal, justice.case_party, platform.case, platform.task, platform.inbox_item, justice.process_order, justice.process_service, justice.payment]
# WRITES — the lifecycle transitions (authority scope; the solution install grants these per tenant)
writes: [justice.court, justice.case, justice.filing, justice.scrutiny_result, justice.hearing, justice.appearance, justice.disposal, justice.case_party, platform.case, platform.task, platform.inbox_item, justice.process_order, justice.process_service, justice.payment]
# audience: court staff (tenant admin holds the umbrella role in slice 1; role separation is slice 2)
roles: [platform.tenant-admin, justice.advocate, justice.litigant, justice.scrutiny-officer, justice.registrar, justice.bench-clerk, justice.judge, justice.process-server]
# PER-ACTION role gate (slice 3): only these roles may write each action-fact. Schemas not listed here
# (justice.case, justice.court, platform.*) are the shared case spine, writable by any court role at its stage.
write_roles:
  - {schema: justice.filing, roles: justice.advocate|justice.litigant}
  - {schema: justice.case_party, roles: justice.advocate|justice.litigant}
  - {schema: justice.scrutiny_result, roles: justice.scrutiny-officer}
  - {schema: justice.hearing, roles: justice.bench-clerk}
  - {schema: justice.appearance, roles: justice.bench-clerk|justice.judge}
  - {schema: justice.disposal, roles: justice.judge}
  - {schema: justice.process_order, roles: justice.advocate|justice.litigant|justice.bench-clerk}
  - {schema: justice.process_service, roles: justice.process-server|justice.bench-clerk}
  - {schema: justice.payment, roles: justice.advocate|justice.litigant}
