<!doctype html><meta charset="utf-8"><title>Court Console</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{--bg:#0e1116;--card:#161b22;--card2:#1b2230;--line:#26303d;--ink:#e6edf3;--dim:#9aa7b4;--faint:#6b7684;
        --accent:#c9a227;--accent2:#7fd7f0;--ok:#3fb950;--warn:#d29922;--bad:#f85149;--rail:#12202a}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:14px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  header{display:flex;align-items:center;gap:12px;padding:11px 20px;border-bottom:1px solid var(--line);background:#0b0e13}
  header .crest{font-size:20px}
  header h1{margin:0;font-size:16px;font-weight:650;font-family:Georgia,"Times New Roman",serif;letter-spacing:.2px}
  header .who{margin-left:auto;color:var(--dim);font-size:12px}
  nav{display:flex;gap:2px;padding:0 14px;border-bottom:1px solid var(--line);background:#0b0e13;overflow-x:auto}
  nav button{background:none;border:none;border-bottom:2px solid transparent;color:var(--dim);padding:11px 15px;font-size:13.5px;cursor:pointer;white-space:nowrap}
  nav button.on{color:var(--ink);border-bottom-color:var(--accent)}
  nav button .b{display:inline-block;min-width:18px;padding:0 5px;margin-left:6px;border-radius:9px;background:var(--card2);color:var(--dim);font-size:11px;text-align:center}
  .wrap{max-width:1080px;margin:0 auto;padding:20px}
  h2{font-family:Georgia,serif;font-weight:600;font-size:21px;margin:0 0 4px}
  .sub{color:var(--dim);font-size:13px;margin:0 0 18px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:14px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media(max-width:620px){.grid2{grid-template-columns:1fr}}
  label{display:block;font-size:12px;color:var(--dim);margin:0 0 4px;font-weight:600}
  input,select,textarea{width:100%;background:#0d1117;border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:9px 11px;font-size:14px;font-family:inherit}
  textarea{min-height:64px;resize:vertical}
  .btn{border:1px solid #2f3d4d;background:var(--card2);color:var(--ink);border-radius:8px;padding:8px 15px;font-size:13.5px;cursor:pointer}
  .btn:hover{border-color:var(--accent2)} .btn:disabled{opacity:.5;cursor:default}
  .btn.go{background:#233417;border-color:#3f6a2a;color:#b7e59a}
  .btn.pri{background:#3a2f10;border-color:#6a561d;color:var(--accent)}
  .btn.bad{background:#3a1d1d;border-color:#6a2b2b;color:#f0a0a0}
  .btn.sm{padding:5px 10px;font-size:12.5px}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{text-align:left;color:var(--faint);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.04em;padding:8px 10px;border-bottom:1px solid var(--line)}
  td{padding:9px 10px;border-bottom:1px solid #1b2230;vertical-align:top}
  tr:hover td{background:#12171f}
  .pill{display:inline-block;font-size:11px;font-weight:600;padding:2px 9px;border-radius:20px;white-space:nowrap}
  .s-filed{background:#2a2f10;color:var(--accent)} .s-registered{background:#10283a;color:var(--accent2)}
  .s-disposed{background:#132a1b;color:var(--ok)} .s-returned{background:#3a2113;color:var(--warn)}
  .mono{font-family:ui-monospace,Menlo,monospace;font-size:12px;color:var(--dim)}
  .empty{color:var(--faint);padding:34px;text-align:center;font-size:13.5px}
  .toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#0b0e13;border:1px solid var(--line);border-radius:10px;padding:10px 16px;font-size:13px;box-shadow:0 8px 30px rgba(0,0,0,.5);opacity:0;transition:opacity .2s;pointer-events:none;max-width:90%}
  .toast.show{opacity:1} .toast.ok{border-color:#2f5d2f} .toast.bad{border-color:#6a2b2b;color:#f0a0a0}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto;z-index:20}
  .modal.show{display:flex}
  .modal .panel{background:var(--card);border:1px solid var(--line);border-radius:14px;max-width:640px;width:100%;padding:20px 22px}
  .tl{list-style:none;margin:14px 0 0;padding:0;border-left:2px solid var(--line);margin-left:8px}
  .tl li{position:relative;padding:0 0 16px 20px}
  .tl li::before{content:"";position:absolute;left:-7px;top:3px;width:11px;height:11px;border-radius:50%;background:var(--accent);border:2px solid var(--bg)}
  .tl .t{font-weight:600;font-size:13.5px} .tl .m{color:var(--dim);font-size:12.5px} .tl .d{color:var(--faint);font-size:11.5px;font-family:ui-monospace,Menlo,monospace}
  .x{float:right;cursor:pointer;color:var(--faint);font-size:20px;line-height:1}
</style>

<header>
  <span class="crest">⚖️</span>
  <h1>Court Console</h1>
  <span class="who" id="who">…</span>
</header>
<nav id="nav"></nav>
<div class="wrap" id="view"><div class="empty">Loading…</div></div>
<div class="toast" id="toast"></div>
<div class="modal" id="modal"><div class="panel" id="mpanel"></div></div>

<script>
const APP_ID="court-console";   // short id — /bridge/query + /bridge/save key CERTIFIED by the last path segment
let SESS={}, TENANT="", CACHE={}, TAB="file";
const TABS=[["file","File a case"],["scrutiny","Scrutiny"],["registration","Registration"],
            ["hearings","Cause list & hearings"],["process","Process & service"],["fees","Fees & payments"],["bail","Bail"],["adr","ADR / Mediation"],["certcopy","Certified copies"],["disposal","Disposal"],["cases","All cases"]];

const $=id=>document.getElementById(id);
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function toast(m,cls){const t=$("toast");t.textContent=m;t.className="toast show "+(cls||"");setTimeout(()=>t.className="toast",2600);}
function nowISO(){return new Date().toISOString().replace(/\.\d+Z$/,"Z");}
function fmt(d){if(!d)return"—";try{return new Date(d).toLocaleDateString(undefined,{day:"2-digit",month:"short",year:"numeric"});}catch(e){return d;}}
function slug(p){return p+"-"+Date.now().toString(36)+Math.floor(Math.random()*1e4).toString(36);}
function nid(kind,local){return `ds:${TENANT}:justice/${kind}/${local||slug(kind)}`;}
function pid(kind,local){return `ds:${TENANT}:platform/${kind}/${local||slug(kind)}`;}

async function jget(p){const r=await fetch(p);return r.ok?r.json():{};}
async function jpost(p,b){const r=await fetch(p,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(b||{})});
  let j={};try{j=await r.json();}catch(e){} return {ok:r.ok,status:r.status,j};}
async function query(schema){const {j}=await jpost("/bridge/query",{schema,app_id:APP_ID});return (j.results||[]).map(x=>x.object||x);}
async function save(obj){obj.tenant=obj.tenant||TENANT;const {ok,j}=await jpost("/bridge/save",{object:obj,app_id:APP_ID});
  if(!ok)throw new Error((j&&(j.error||j.detail))||"save failed");return j;}
// Slice 2 — route the next step into the owning ROLE's universal Inbox (actor=role://…). The shared Inbox app
// surfaces it to whoever holds that role; opening it deep-links back to this console's relevant tab.
async function inbox(role,title,caseRef,tab){
  try{ await save({schema:"platform.inbox_item",id:pid("inbox_item","ib-"+slug("x").split("-").pop()),
    actor:"role://"+role,kind:"task",title,ref:caseRef,subject_ref:caseRef,status:"unread",
    source:"court-console",handler:"/apps/court-console/#"+(tab||""),created_at:nowISO()}); }catch(e){}
}

/* ===== Reusable 🎤 DICTATE — record in-frame, transcribe via /bridge/transcribe (Bodhan), insert into a field.
   Mic is delegated by the app-host shell (iframe allow="microphone"). Degrades gracefully if voice is
   unconfigured/unsupported. Same helper is reused wherever a narrative field wants voice. ===== */
async function attachMic(btn,target,opts){ if(!btn||!target)return; opts=opts||{};
  let rec=null,chunks=[],on=false;
  btn.onclick=async(e)=>{ e&&e.preventDefault();
    if(on){ rec&&rec.stop(); return; }
    if(!navigator.mediaDevices||!window.MediaRecorder){ toast("Voice input isn’t supported in this browser","bad"); return; }
    let stream; try{ stream=await navigator.mediaDevices.getUserMedia({audio:true}); }
    catch(err){ toast("Microphone permission was denied","bad"); return; }
    chunks=[]; rec=new MediaRecorder(stream); on=true; btn.textContent="⏺"; btn.classList.add("bad");
    rec.ondataavailable=ev=>{ if(ev.data&&ev.data.size)chunks.push(ev.data); };
    rec.onstop=async()=>{ on=false; stream.getTracks().forEach(t=>t.stop()); btn.textContent="…"; btn.classList.remove("bad");
      const blob=new Blob(chunks,{type:(chunks[0]&&chunks[0].type)||"audio/webm"});
      const b64=await new Promise(res=>{ const r=new FileReader(); r.onloadend=()=>res(String(r.result).split(",")[1]||""); r.readAsDataURL(blob); });
      let j={}; try{ j=await (await fetch("/bridge/transcribe",{method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({audio:b64,mime:blob.type,language:opts.language||""})})).json(); }catch(err){ j={error:String(err)}; }
      btn.textContent="🎤";
      if(j.error){ toast(j.error,"bad"); return; }
      const txt=(j.text||"").trim(); if(!txt){ toast("No speech detected — try again","bad"); return; }
      const cur=target.value||""; target.value=cur?(cur.replace(/\s*$/,"")+" "+txt):txt; target.dispatchEvent(new Event("input")); target.focus();
    };
    rec.start(); toast("Recording… click 🎤 again to stop");
  };
}

async function refresh(){
  const [cases,filings,scrut,hearings,disp,pcases,porders,pservices,payments,bails,adrs,ccopies]=await Promise.all(
    ["justice.case","justice.filing","justice.scrutiny_result","justice.hearing","justice.disposal","platform.case","justice.process_order","justice.process_service","justice.payment","justice.bail","justice.adr_referral","justice.certified_copy"].map(query));
  CACHE={cases,filings,scrut,hearings,disp,pcases,porders,pservices,payments,bails,adrs,ccopies};
}
// helpers over the cache
const byCase=(arr,cid)=>arr.filter(x=>x.case_ref===cid);
const scrutOf=cid=>byCase(CACHE.scrut,cid);
const accepted=cid=>scrutOf(cid).some(s=>s.outcome==="accepted");
const hearingsOf=cid=>byCase(CACHE.hearings,cid).sort((a,b)=>(a.scheduled_for||"").localeCompare(b.scheduled_for||""));
const heldAny=cid=>hearingsOf(cid).some(h=>h.status==="held");

function counts(){return {
  scrutiny:CACHE.cases.filter(c=>c.status==="filed"&&!accepted(c.id)).length,
  registration:CACHE.cases.filter(c=>c.status==="filed"&&accepted(c.id)).length,
  hearings:CACHE.cases.filter(c=>c.status==="registered").length,
  disposal:CACHE.cases.filter(c=>c.status==="registered"&&heldAny(c.id)).length,
};}

// Slice 3: each role sees only the tabs it owns (+ "All cases"); an admin sees everything.
const ROLE_TABS={"justice.advocate":["file","process","fees","bail","certcopy","cases"],"justice.litigant":["file","process","fees","bail","certcopy","cases"],
  "justice.scrutiny-officer":["scrutiny","cases"],"justice.registrar":["registration","certcopy","cases"],
  "justice.bench-clerk":["hearings","process","cases"],"justice.judge":["disposal","hearings","bail","adr","cases"],
  "justice.process-server":["process","cases"],"justice.mediator":["adr","cases"]};
const ADMIN_ROLES=["platform.tenant-admin","platform.steward","admin"];
function allowedTabs(){
  const R=SESS.roles||[];
  if(R.some(r=>ADMIN_ROLES.includes(r))) return TABS.map(t=>t[0]);   // admin: all
  const s=new Set(); R.forEach(r=>(ROLE_TABS[r]||[]).forEach(t=>s.add(t)));
  return s.size? [...s] : TABS.map(t=>t[0]);                          // fallback: all (dev)
}
function renderNav(){const c=counts();const allow=allowedTabs();
  $("nav").innerHTML=TABS.filter(([k])=>allow.includes(k)).map(([k,label])=>{
  const n=c[k];const badge=n?`<span class="b">${n}</span>`:"";
  return `<button class="${k===TAB?'on':''}" onclick="go('${k}')">${esc(label)}${badge}</button>`;}).join("");}
function go(t){TAB=t;renderNav();render();}

function statusPill(s){return `<span class="pill s-${esc(s)}">${esc(s)}</span>`;}

function render(){
  const v=$("view");
  if(TAB==="file")return renderFile(v);
  if(TAB==="scrutiny")return renderList(v,"Scrutiny queue","Filings awaiting scrutiny for completeness & correctness.",
     CACHE.cases.filter(c=>c.status==="filed"&&!accepted(c.id)),scrutinyActions);
  if(TAB==="registration")return renderList(v,"Registration","Scrutiny-cleared cases awaiting a case number.",
     CACHE.cases.filter(c=>c.status==="filed"&&accepted(c.id)),registerActions);
  if(TAB==="hearings")return renderHearings(v);
  if(TAB==="process")return renderProcess(v);
  if(TAB==="fees")return renderFees(v);
  if(TAB==="bail")return renderBail(v);
  if(TAB==="adr")return renderADR(v);
  if(TAB==="certcopy")return renderCC(v);
  if(TAB==="disposal")return renderList(v,"Disposal","Heard cases awaiting judgment / final order.",
     CACHE.cases.filter(c=>c.status==="registered"&&heldAny(c.id)),disposeActions);
  if(TAB==="cases")return renderCases(v);
}

/* ---------- FILE ---------- */
function renderFile(v){
  v.innerHTML=`<h2>File a case</h2><p class="sub">e-Filing — opens a case and routes it to scrutiny.</p>
  <div class="card"><div class="grid2">
    <div><label>Filing type *</label><select id="f_type">
      <option value="complaint">Complaint</option><option value="plaint">Plaint (civil suit)</option>
      <option value="petition">Petition</option><option value="appeal">Appeal</option>
      <option value="application">Application</option><option value="caveat">Caveat</option></select></div>
    <div><label>Case type</label><input id="f_ctype" placeholder="e.g. criminal-complaint, civil-suit"></div>
    <div><label>Complainant / Petitioner *</label><input id="f_comp" placeholder="Name of the party filing"></div>
    <div><label>Respondent / Accused *</label><input id="f_resp" placeholder="Opposing party"></div>
  </div>
  <div style="margin-top:12px"><label>Relief sought *</label><textarea id="f_relief" placeholder="What the party asks the court to do"></textarea></div>
  <div class="row" style="margin-top:14px"><button class="btn go" id="f_submit" onclick="fileCase()">⚖ File case</button>
    <span class="mono" id="f_court"></span></div></div>`;
  const court=(CACHE.__court||{});
  $("f_court").textContent=court.id?("→ "+(court.name||court.id)):"(no court configured — will create Court No.1)";
}
async function ensureCourt(){
  // justice.court is a closed schema with NO tenant field, so it can't go through the tenant-stamping
  // /bridge/save path — it's seeded at install. Reuse the seeded court; fall back to the conventional id.
  let courts=await query("justice.court");
  if(courts.length){CACHE.__court=courts[0];return courts[0];}
  const court={id:nid("court","mc-01"),name:"Court No.1"};
  CACHE.__court=court;return court;
}
async function fileCase(){
  const b=$("f_submit");const comp=$("f_comp").value.trim(),resp=$("f_resp").value.trim(),relief=$("f_relief").value.trim();
  if(!comp||!resp||!relief)return toast("Complainant, respondent and relief are required","bad");
  b.disabled=true;b.textContent="Filing…";
  try{
    const court=await ensureCourt();
    const ts=Date.now().toString(36);
    const caseId=nid("case","ct-"+ts), filingId=nid("filing","f-"+ts), pcId=pid("case","pc-"+ts);
    const filingNo="FIL-"+new Date().getFullYear()+"-"+Math.floor(Math.random()*9000+1000);
    const title=`${comp} v. ${resp}`;
    await save({schema:"justice.filing",id:filingId,case_ref:caseId,mode:"e-filing",status:"submitted",
      filing_type:$("f_type").value,filed_at:nowISO(),filed_by:SESS.sub||"",filing_number:filingNo,
      relief_sought:relief,observed_at:nowISO()});
    await save({schema:"justice.case",id:caseId,court_ref:court.id,case_number:"",
      case_type:$("f_ctype").value.trim()||"unspecified",stage:"filing",status:"filed",filed_on:nowISO(),
      identifiers:[{scheme:"filing_number",value:filingNo}]});
    await save({schema:"justice.case_party",id:nid("case_party","cp-c-"+ts),case_ref:caseId,role:"complainant",name:comp,party_id:comp,party_type:"individual"});
    await save({schema:"justice.case_party",id:nid("case_party","cp-r-"+ts),case_ref:caseId,role:"respondent",name:resp,party_id:resp,party_type:"individual"});
    await save({schema:"platform.case",id:pcId,service:"justice-case-management",workflow:"justice.case_lifecycle",
      title,status:"active",current_step:"scrutiny",subjects:[caseId],opened_at:nowISO(),opened_by:SESS.sub||"",
      history:[{event:"filed",at:nowISO(),actor:SESS.sub||""}]});
    await save({schema:"platform.task",id:pid("task","t-scr-"+ts),case:pcId,verb:"verify",status:"open",
      title:"Scrutinise filing "+filingNo,assignee:"role://justice.scrutiny-officer",workflow_step:"scrutiny",created_at:nowISO()});
    await inbox("justice.scrutiny-officer","Scrutinise filing "+filingNo+" — "+title,caseId,"scrutiny");
    toast("Filed — "+title+" ("+filingNo+")","ok");
    await refresh();go("scrutiny");
  }catch(e){toast(e.message,"bad");b.disabled=false;b.textContent="⚖ File case";}
}

/* ---------- generic case list ---------- */
function caseRowMeta(c){
  const f=byCase(CACHE.filings,c.id)[0]||{};
  const pc=CACHE.pcases.find(p=>(p.subjects||[]).includes(c.id));
  return {title:(pc&&pc.title)||c.case_number||f.filing_number||c.id.split("/").pop(),filing:f};
}
function renderList(v,title,sub,rows,actionsFn){
  v.innerHTML=`<h2>${esc(title)}</h2><p class="sub">${esc(sub)}</p>`+
    (rows.length?`<div class="card" style="padding:0"><table><thead><tr>
      <th>Case</th><th>Type</th><th>Filed</th><th>Status</th><th></th></tr></thead><tbody>`+
      rows.map(c=>{const m=caseRowMeta(c);return `<tr>
        <td><b>${esc(m.title)}</b><div class="mono">${esc(c.case_number||m.filing.filing_number||"")}</div></td>
        <td>${esc(c.case_type||m.filing.filing_type||"")}</td>
        <td>${fmt(c.filed_on)}</td><td>${statusPill(c.status)}</td>
        <td class="row" style="justify-content:flex-end">${actionsFn(c)}</td></tr>`;}).join("")+
      `</tbody></table></div>`
    :`<div class="empty">Nothing here right now.</div>`);
}
function scrutinyActions(c){return `<button class="btn go sm" onclick="scrutinise('${c.id}','accepted')">Accept</button>
  <button class="btn bad sm" onclick="scrutinise('${c.id}','defects-found')">Return</button>`;}
function registerActions(c){return `<button class="btn pri sm" onclick="registerCase('${c.id}')">Register & number</button>`;}
function disposeActions(c){return `<button class="btn pri sm" onclick="openDispose('${c.id}')">Dispose</button>`;}

async function scrutinise(cid,outcome){
  try{
    const ts=Date.now().toString(36);const f=byCase(CACHE.filings,cid)[0]||{};
    await save({schema:"justice.scrutiny_result",id:nid("scrutiny_result","sr-"+ts),case_ref:cid,
      filing_ref:f.id||"",outcome,defects:outcome==="accepted"?[]:["Defects noted; returned for correction"],scrutinised_at:nowISO()});
    const pc=CACHE.pcases.find(p=>(p.subjects||[]).includes(cid));
    if(outcome==="accepted"){
      await save({schema:"platform.task",id:pid("task","t-reg-"+ts),case:(pc&&pc.id)||"",verb:"approve",status:"open",
        title:"Register case (assign number)",assignee:"role://justice.registrar",workflow_step:"registration",created_at:nowISO()});
      await inbox("justice.registrar","Register case (assign number) — "+cid.split("/").pop(),cid,"registration");
      toast("Scrutiny cleared — sent to registration","ok");
    }else{
      if(f.id)await save({...f,status:"returned"});
      toast("Returned for correction","");
    }
    await refresh();render();renderNav();
  }catch(e){toast(e.message,"bad");}
}
async function registerCase(cid){
  try{
    const c=CACHE.cases.find(x=>x.id===cid);const ts=Date.now().toString(36);
    const yr=new Date().getFullYear();
    const seq=CACHE.cases.filter(x=>x.case_number).length+1;
    const num="CC/"+seq+"/"+yr;
    const ids=(c.identifiers||[]).filter(i=>i.scheme!=="case_number").concat([{scheme:"case_number",value:num}]);
    await save({...c,case_number:num,stage:"registered",status:"registered",identifiers:ids});
    const pc=CACHE.pcases.find(p=>(p.subjects||[]).includes(cid));
    if(pc)await save({...pc,current_step:"hearing",history:(pc.history||[]).concat([{event:"registered",at:nowISO(),actor:SESS.sub||""}])});
    await save({schema:"platform.task",id:pid("task","t-sch-"+ts),case:(pc&&pc.id)||"",verb:"fulfil",status:"open",
      title:"Schedule first hearing",assignee:"role://justice.bench-clerk",workflow_step:"hearing",created_at:nowISO()});
    await inbox("justice.bench-clerk","Schedule first hearing — "+num,cid,"hearings");
    toast("Registered as "+num,"ok");await refresh();render();renderNav();
  }catch(e){toast(e.message,"bad");}
}

/* ---------- HEARINGS ---------- */
function renderHearings(v){
  const regd=CACHE.cases.filter(c=>c.status==="registered");
  v.innerHTML=`<h2>Cause list & hearings</h2><p class="sub">Schedule, hold, or adjourn hearings for registered cases.</p>`+
   (regd.length?regd.map(c=>{
     const m=caseRowMeta(c);const hs=hearingsOf(c.id);
     return `<div class="card"><div class="row" style="justify-content:space-between">
       <div><b>${esc(m.title)}</b> <span class="mono">${esc(c.case_number)}</span></div>
       <button class="btn sm" onclick="openSchedule('${c.id}')">＋ Schedule hearing</button></div>`+
       (hs.length?`<table style="margin-top:10px"><thead><tr><th>When</th><th>Purpose</th><th>Status</th><th></th></tr></thead><tbody>`+
         hs.map(h=>`<tr><td>${fmt(h.scheduled_for)}</td><td>${esc(h.purpose)}</td>

}
function openADR(cid){$("mpanel").innerHTML=`<span class="x" onclick="closeModal()">×</span><h2>Refer to ADR</h2>
    <label>Type *</label><select id="a_type"><option value="mediation">Mediation</option><option value="conciliation">Conciliation</option><option value="arbitration">Arbitration</option><option value="lok-adalat">Lok Adalat</option></select>
    <label style="margin-top:10px">Neutral (mediator/arbitrator)</label><input id="a_neutral" placeholder="Name">
    <div class="row" style="margin-top:16px"><button class="btn go" onclick="referADR('${cid}')">Refer</button></div>`;showModal();}
async function referADR(cid){try{const ts=Date.now().toString(36);
    await save({schema:"justice.adr_referral",id:nid("adr_referral","adr-"+ts),case_ref:cid,adr_type:$("a_type").value,
      neutral:$("a_neutral").value.trim(),status:"referred",referred_by:SESS.sub||"",referred_at:nowISO(),observed_at:nowISO()});
    await inbox("justice.mediator","ADR referral to conduct — "+(CACHE.cases.find(x=>x.id===cid)||{}).case_number,cid,"adr");
    toast("Referred to ADR","ok");closeModal();await refresh();render();renderNav();}catch(e){toast(e.message,"bad");}}
async function recordADR(rid,cid,outcome){try{const r=CACHE.adrs.find(x=>x.id===rid);
    await save({...r,status:outcome,outcome:outcome==="settled"?"Settled in ADR":"Returned to court",observed_at:nowISO()});
    await inbox("justice.judge","ADR "+outcome+" — "+(CACHE.cases.find(x=>x.id===cid)||{}).case_number,cid,"adr");
    toast("ADR "+outcome,"ok");await refresh();render();renderNav();}catch(e){toast(e.message,"bad");}}

/* ---------- CERTIFIED COPIES (slice 5c) ---------- */
const ccOf=cid=>byCase(CACHE.ccopies,cid).sort((a,b)=>(a.observed_at||"").localeCompare(b.observed_at||""));
function renderCC(v){
  const rows=CACHE.cases.slice().sort((a,b)=>(b.filed_on||"").localeCompare(a.filed_on||""));
  const isReg=(SESS.roles||[]).includes("justice.registrar")||(SESS.roles||[]).some(r=>ADMIN_ROLES.includes(r));
  const canReq=(SESS.roles||[]).some(r=>["justice.advocate","justice.litigant"].includes(r))||(SESS.roles||[]).some(r=>ADMIN_ROLES.includes(r));
  v.innerHTML=`<h2>Certified copies</h2><p class="sub">Request certified copies of court records; the registry prepares and issues them.</p>`+
   (rows.length?rows.map(c=>{const m=caseRowMeta(c);const cs=ccOf(c.id);
     return `<div class="card"><div class="row" style="justify-content:space-between">
       <div><b>${esc(m.title)}</b> <span class="mono">${esc(c.case_number||m.filing.filing_number||"")}</span></div>
       ${canReq?`<button class="btn sm" onclick="openCC('${c.id}')">＋ Request copy</button>`:''}</div>`+
       (cs.length?`<table style="margin-top:10px"><thead><tr><th>Document</th><th>Copies</th><th>Status</th><th></th></tr></thead><tbody>`+
         cs.map(x=>`<tr><td>${esc(x.document_ref||"record")}</td><td>${esc(x.copies||1)}</td>
           <td><span class="pill ${x.status==='issued'?'s-disposed':x.status==='rejected'?'s-returned':'s-filed'}">${esc(x.status)}</span></td>
           <td class="row" style="justify-content:flex-end">${(isReg&&x.status==='requested')?
             `<button class="btn go sm" onclick="issueCC('${x.id}','${c.id}','issued')">Issue</button><button class="btn bad sm" onclick="issueCC('${x.id}','${c.id}','rejected')">Reject</button>`:''}</td></tr>`).join("")+
         `</tbody></table>`:`<p class="sub" style="margin:8px 0 0">No requests.</p>`)+`</div>`;
   }).join(""):`<div class="empty">No cases yet.</div>`);
}
function openCC(cid){$("mpanel").innerHTML=`<span class="x" onclick="closeModal()">×</span><h2>Request certified copy</h2>
    <label>Document *</label><input id="c_doc" placeholder="e.g. judgment, order dated…">
    <label style="margin-top:10px">Copies</label><input id="c_n" type="number" value="1">
    <div class="row" style="margin-top:16px"><button class="btn go" onclick="requestCC('${cid}')">Request</button></div>`;showModal();}
async function requestCC(cid){const doc=$("c_doc").value.trim(); if(!doc)return toast("Document required","bad");
  try{const ts=Date.now().toString(36);
    await save({schema:"justice.certified_copy",id:nid("certified_copy","cc-"+ts),case_ref:cid,requested_by:SESS.sub||"",
      document_ref:doc,copies:parseInt($("c_n").value)||1,status:"requested",observed_at:nowISO()});
    await inbox("justice.registrar","Certified copy requested — "+(CACHE.cases.find(x=>x.id===cid)||{}).case_number,cid,"certcopy");
    toast("Copy requested","ok");closeModal();await refresh();render();renderNav();}catch(e){toast(e.message,"bad");}}
async function issueCC(xid,cid,outcome){try{const x=CACHE.ccopies.find(y=>y.id===xid);
    await save({...x,status:outcome,issued_by:SESS.sub||"",issued_at:nowISO(),observed_at:nowISO()});
    toast("Copy "+outcome,outcome==="issued"?"ok":"");await refresh();render();renderNav();}catch(e){toast(e.message,"bad");}}

/* ---------- ALL CASES + timeline ---------- */
function renderCases(v){
  const rows=CACHE.cases.slice().sort((a,b)=>(b.filed_on||"").localeCompare(a.filed_on||""));
  v.innerHTML=`<h2>All cases</h2><p class="sub">Every case the court holds — click a row for its timeline.</p>`+
   (rows.length?`<div class="card" style="padding:0"><table><thead><tr><th>Case</th><th>Number</th><th>Type</th><th>Filed</th><th>Status</th></tr></thead><tbody>`+
     rows.map(c=>{const m=caseRowMeta(c);return `<tr style="cursor:pointer" onclick="timeline('${c.id}')">
       <td><b>${esc(m.title)}</b></td><td class="mono">${esc(c.case_number||"—")}</td>
       <td>${esc(c.case_type||"")}</td><td>${fmt(c.filed_on)}</td><td>${statusPill(c.status)}</td></tr>`;}).join("")+
     `</tbody></table></div>`:`<div class="empty">No cases filed yet.</div>`);
}
function timeline(cid){
  const c=CACHE.cases.find(x=>x.id===cid);const m=caseRowMeta(c);
  const ev=[];
  byCase(CACHE.filings,cid).forEach(f=>ev.push([f.filed_at,"Filed","Filing "+(f.filing_number||"")+" — "+(f.filing_type||"")]));
  scrutOf(cid).forEach(s=>ev.push([s.scrutinised_at,"Scrutiny — "+s.outcome,(s.defects||[]).join("; ")||"Cleared"]));
  if(c.case_number)ev.push([null,"Registered","Case number "+c.case_number]);
  hearingsOf(cid).forEach(h=>ev.push([h.scheduled_for,"Hearing — "+h.status,(h.purpose||"")+(h.outcome?" · "+h.outcome:"")]));
  byCase(CACHE.disp,cid).forEach(d=>ev.push([d.disposed_at,"Disposed — "+d.disposal_type,"In favour of "+(d.in_favour_of||"—")+(d.order_text?(" · Order: "+d.order_text):"")]));
  ev.sort((a,b)=>String(a[0]||"").localeCompare(String(b[0]||"")));
  $("mpanel").innerHTML=`<span class="x" onclick="closeModal()">×</span><h2>${esc(m.title)}</h2>
    <p class="sub">${esc(c.case_number||m.filing.filing_number||"")} · ${statusPill(c.status)}</p>
    <ul class="tl">${ev.map(e=>`<li><div class="t">${esc(e[1])}</div><div class="m">${esc(e[2])}</div><div class="d">${e[0]?fmt(e[0]):""}</div></li>`).join("")}</ul>`;
  showModal();
}
function showModal(){$("modal").classList.add("show");}
function closeModal(){$("modal").classList.remove("show");}
$("modal").addEventListener("click",e=>{if(e.target.id==="modal")closeModal();});

(async function(){
  SESS=await jget("/session");
  TENANT=SESS.tenant||"";
  $("who").textContent=SESS.authenticated?("● "+(SESS.sub||"")+" · "+TENANT):"not signed in";
  if(!SESS.authenticated){$("view").innerHTML='<div class="empty">Please sign in as a court officer.</div>';return;}
  // Slice 2: land each role on the step they own (they can also navigate freely).
  const R=SESS.roles||[];
  const home={"justice.advocate":"file","justice.litigant":"file","justice.scrutiny-officer":"scrutiny",
              "justice.registrar":"registration","justice.bench-clerk":"hearings","justice.judge":"disposal"};
  for(const r of R){ if(home[r]){ TAB=home[r]; break; } }
  try{await refresh();}catch(e){$("view").innerHTML='<div class="empty">Could not load cases: '+esc(e.message)+'</div>';return;}
  renderNav();render();
})();
</script>
