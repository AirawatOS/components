<!doctype html><meta charset="utf-8"><title>Components</title>
<style>
  :root{--bg:#0d1117;--card:#161b22;--line:#21262d;--ink:#e6edf3;--dim:#8b949e;--accent:#3b82f6}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  header{padding:14px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}
  h1{margin:0;font-size:17px} .who{margin-left:auto;color:var(--dim);font-size:12px}
  .wrap{max-width:880px;margin:0 auto;padding:18px 16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
  .top{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
  .nm{font-weight:600} .kind{border:1px solid var(--line);border-radius:999px;padding:1px 8px;font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.04em}
  .cid{color:#5f6b78;font-size:11px;font-family:ui-monospace,Menlo,monospace;word-break:break-all;margin:2px 0 10px}
  .lbl{color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.05em;margin:12px 0 6px}
  .chip{display:inline-block;background:#0d1117;border:1px solid var(--line);border-radius:999px;padding:2px 9px;font-size:12px;margin:0 6px 6px 0;font-family:ui-monospace,Menlo,monospace}
  .keyrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:6px 0}
  .kn{font-family:ui-monospace,Menlo,monospace;font-size:13px;min-width:130px}
  .set{color:#3fb950;font-size:12px} .unset{color:#e5484d;font-size:12px}
  input{background:#0d1117;border:1px solid var(--line);color:var(--ink);border-radius:7px;padding:6px 9px;font:12px ui-monospace,Menlo,monospace;flex:1;min-width:120px}
  .btn{border:1px solid var(--line);background:#21262d;color:var(--ink);border-radius:7px;padding:6px 12px;font-size:12px;cursor:pointer}
  .btn.primary{background:var(--accent);border-color:var(--accent)}
  table{width:100%;border-collapse:collapse;font-size:12px;margin-top:4px}
  th{color:var(--dim);text-align:left;font-weight:500;padding:5px 8px;border-bottom:1px solid var(--line)}
  td{padding:4px 8px;border-bottom:1px solid #1a1f27;font-family:ui-monospace,Menlo,monospace}
  .allowed{color:#3fb950} .denied{color:#e5484d} .warn{color:#e3a008}
  .muted{color:var(--dim);font-size:12px}
  .badge{display:inline-block;border-radius:999px;padding:1px 8px;font-size:11px;margin-left:8px;border:1px solid}
  .badge.denied{color:#ff9b9b;border-color:#8b2c30;background:#3d1418}
  .badge.warn{color:#e3a008;border-color:#9e6a03;background:#2b1d0e}
  .toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#132a17;border:1px solid #238636;color:#3fb950;padding:9px 16px;border-radius:9px;font-size:13px;opacity:0;transition:opacity .2s}
  .toast.show{opacity:1} .toast.err{background:#3d1418;border-color:#8b2c30;color:#ff9b9b}
  .empty{color:var(--dim);text-align:center;padding:40px}
</style>
<header><h1>🧩 Components</h1><span class="who" id="who"></span></header>
<div class="wrap" id="wrap"><div class="empty">loading…</div></div>
<div class="toast" id="toast"></div>
<script>
let APPID;
async function jget(p){const r=await fetch(p);if(!r.ok)throw new Error(p+' '+r.status);return r.json();}
async function jpost(p,b){const r=await fetch(p,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});return {ok:r.ok,status:r.status,j:await r.json().catch(()=>({}))};}
async function query(schema,filter){const r=await jpost('/bridge/query',{app_id:APPID,schema,filter:filter||{}});return r.ok?(r.j.results||[]):[];}
function toast(m,e){const t=document.getElementById('toast');t.textContent=m;t.className='toast show'+(e?' err':'');setTimeout(()=>t.className='toast',2200);}
function esc(s){return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
// turn a raw upstream status into an ACTION the tenant can take
function statusInfo(s){
  s=String(s==null?'':s);
  if(/^2\d\d$/.test(s)) return {t:s,c:'allowed',hint:'ok'};
  if(s==='401'||s==='403') return {t:s,c:'denied',hint:'key rejected — rotate it'};
  if(s==='404') return {t:s,c:'warn',hint:'endpoint not found — check the component'};
  if(/^5\d\d$/.test(s)) return {t:s,c:'warn',hint:'upstream error — retry later'};
  if(s.startsWith('unreachable')) return {t:'unreachable',c:'muted',hint:'network / DNS — not a key issue'};
  return {t:s||'—',c:'muted',hint:''};
}

async function boot(){
  const cfg=await fetch('./config.json').then(r=>r.json()); APPID=cfg.app_id;
  fetch('/session').then(r=>r.json()).then(s=>{document.getElementById('who').textContent=s.authenticated?('● '+s.sub):'';});
  const [{components},egress]=await Promise.all([jget('/bridge/components'), query('prov.egress',{})]);
  const wrap=document.getElementById('wrap');
  if(!components.length){wrap.innerHTML='<div class="empty">No components installed.</div>';return;}
  const byComp={}; egress.sort((a,b)=>(b.at||'').localeCompare(a.at||'')).forEach(e=>{(byComp[e.component]=byComp[e.component]||[]).push(e);});
  wrap.innerHTML='';
  for(const c of components) wrap.appendChild(await card(c, byComp[c.id]||[]));
}

async function card(c, log){
  const el=document.createElement('div'); el.className='card';
  const eg=(c.egress||[]).map(h=>`<span class="chip">${esc(h)}</span>`).join('')||'<span class="muted">none</span>';
  el.innerHTML=`<div class="top"><span class="nm">${esc(c.title||c.id.split('/').pop())}</span><span class="kind">${esc(c.kind||'')}</span><span class="muted">tenant ${esc(c.tenant||'')}</span></div>
    <div class="cid">${esc(c.id)}</div>
    <div class="lbl">Declared egress</div><div>${eg}</div>
    <div class="lbl">API keys</div><div data-keys></div>
    <div class="lbl">External-call log (${log.length})</div><div data-log></div>`;
  // keys
  const kbox=el.querySelector('[data-keys]');
  if(!(c.secrets||[]).length){ kbox.innerHTML='<span class="muted">no secrets required</span>'; }
  else {
    const status=(await jpost('/bridge/secret',{action:'status',component:c.id})).j.secrets_set||[];
    const setNames=new Set(status.map(s=>s.name));
    c.secrets.forEach(name=>{
      const ver=(status.find(s=>s.name===name)||{}).version;
      // if the most recent call that used this key was rejected, nudge the admin to rotate it
      const last=log.find(e=>e.secret===name && String(e.upstream_status||'').length);
      const si=last?statusInfo(last.upstream_status):null;
      const nudge=(si && (si.c==='denied')) ? `<span class="badge ${si.c}">⚠ last call ${si.t} — ${esc(si.hint)}</span>` : '';
      const row=document.createElement('div'); row.className='keyrow';
      row.innerHTML=`<span class="kn">${esc(name)}</span>`+(setNames.has(name)?`<span class="set">● set (v${ver})</span>`:`<span class="unset">○ not set</span>`)
        +nudge+`<input type="text" placeholder="new value" data-v><button class="btn primary" data-do>${setNames.has(name)?'Rotate':'Set'}</button>`;
      row.querySelector('[data-do]').onclick=async()=>{
        const val=row.querySelector('[data-v]').value; if(!val)return toast('enter a value',true);
        const act=setNames.has(name)?'rotate':'set';
        const r=await jpost('/bridge/secret',{action:act,component:c.id,name,value:val});
        r.ok?(toast(name+' '+act+'d')&&boot()):toast(r.j.error||('failed '+r.status),true);
      };
      kbox.appendChild(row);
    });
  }
  // egress log table
  const lb=el.querySelector('[data-log]');
  if(!log.length){ lb.innerHTML='<span class="muted">no external calls recorded</span>'; }
  else {
    lb.innerHTML='<table><tr><th>when</th><th>host</th><th>path</th><th>secret</th><th>outcome</th><th>upstream</th></tr>'+
      log.slice(0,12).map(e=>{const si=statusInfo(e.upstream_status);return `<tr><td>${esc((e.at||'').replace('T',' ').replace('Z',''))}</td><td>${esc(e.host||'')}</td><td>${esc(e.path||'')}</td>
        <td>${esc(e.secret||'')}</td><td class="${e.outcome==='allowed'?'allowed':'denied'}">${esc(e.outcome)}${e.reason?' ('+esc(e.reason)+')':''}</td>
        <td class="${si.c}" title="${esc(si.hint)}">${esc(si.t)}${si.hint&&si.t!=='—'?' · '+esc(si.hint):''}</td></tr>`;}).join('')+'</table>';
  }
  return el;
}
boot();
</script>
