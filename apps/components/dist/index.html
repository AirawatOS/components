<!doctype html><meta charset="utf-8"><title>Components</title>
<style>
  :root{--bg:#0d1117;--card:#161b22;--line:#21262d;--ink:#e6edf3;--dim:#8b949e;--accent:#3b82f6}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  header{padding:12px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}
  h1{margin:0;font-size:16px} .who{margin-left:auto;color:var(--dim);font-size:12px}
  .search{background:#0d1117;border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:6px 10px;font-size:13px;width:220px}
  .layout{display:flex;height:calc(100vh - 49px)}
  .list{width:320px;flex:none;border-right:1px solid var(--line);overflow:auto;display:flex;flex-direction:column}
  .items{flex:1;overflow:auto}
  .it{padding:11px 14px;border-bottom:1px solid #1a1f27;cursor:pointer}
  .it:hover{background:#161b22} .it.sel{background:#1b2530;border-left:2px solid var(--accent)}
  .it .nm{font-weight:600;font-size:13px} .it .sub{color:#5f6b78;font-size:11px;font-family:ui-monospace,Menlo,monospace;word-break:break-all}
  .it .tags{margin-top:3px;display:flex;gap:6px;flex-wrap:wrap}
  .tag{font-size:10px;color:var(--dim);border:1px solid var(--line);border-radius:999px;padding:0 6px;text-transform:uppercase;letter-spacing:.04em}
  .pager{flex:none;display:flex;align-items:center;gap:8px;padding:8px 12px;border-top:1px solid var(--line);color:var(--dim);font-size:12px}
  .pbtn{border:1px solid var(--line);background:#161b22;color:var(--ink);border-radius:6px;padding:3px 9px;cursor:pointer}
  .pbtn:disabled{opacity:.4;cursor:default}
  .detail{flex:1;overflow:auto;padding:18px 20px}
  .tabs{display:flex;gap:4px;margin:14px 0 10px}
  .tab{padding:6px 14px;border:1px solid var(--line);border-radius:8px;cursor:pointer;color:var(--dim);font-size:13px}
  .tab.on{background:#1b2530;color:var(--ink);border-color:#2f3d4d}
  .cid{color:#5f6b78;font-size:11px;font-family:ui-monospace,Menlo,monospace;word-break:break-all;margin:2px 0 12px}
  .lbl{color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.05em;margin:16px 0 6px}
  .chip{display:inline-block;background:#0d1117;border:1px solid var(--line);border-radius:999px;padding:2px 9px;font-size:12px;margin:0 6px 6px 0;font-family:ui-monospace,Menlo,monospace}
  .keyrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:6px 0}
  .kn{font-family:ui-monospace,Menlo,monospace;font-size:13px;min-width:130px}
  .set{color:#3fb950;font-size:12px} .unset{color:#e5484d;font-size:12px}
  input.v{background:#0d1117;border:1px solid var(--line);color:var(--ink);border-radius:7px;padding:6px 9px;font:12px ui-monospace,Menlo,monospace;flex:1;min-width:120px}
  .btn{border:1px solid var(--line);background:#21262d;color:var(--ink);border-radius:7px;padding:6px 12px;font-size:12px;cursor:pointer}
  .btn.primary{background:var(--accent);border-color:var(--accent)}
  table{width:100%;border-collapse:collapse;font-size:12px;margin-top:4px}
  th{color:var(--dim);text-align:left;font-weight:500;padding:5px 8px;border-bottom:1px solid var(--line)}
  td{padding:4px 8px;border-bottom:1px solid #1a1f27;font-family:ui-monospace,Menlo,monospace}
  .allowed{color:#3fb950} .denied{color:#e5484d} .warn{color:#e3a008} .muted{color:var(--dim)}
  .badge{display:inline-block;border-radius:999px;padding:1px 8px;font-size:11px;margin-left:8px;border:1px solid}
  .badge.denied{color:#ff9b9b;border-color:#8b2c30;background:#3d1418} .badge.warn{color:#e3a008;border-color:#9e6a03;background:#2b1d0e}
  .empty{color:var(--dim);text-align:center;padding:48px}
  .toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#132a17;border:1px solid #238636;color:#3fb950;padding:9px 16px;border-radius:9px;font-size:13px;opacity:0;transition:opacity .2s}
  .toast.show{opacity:1} .toast.err{background:#3d1418;border-color:#8b2c30;color:#ff9b9b}
</style>
<header><h1>🧩 Components</h1><input class="search" id="q" placeholder="search components…"><span class="who" id="who"></span></header>
<div class="layout">
  <div class="list"><div class="items" id="items"><div class="empty">loading…</div></div>
    <div class="pager"><button class="pbtn" id="prev">‹ Prev</button><span id="range"></span><button class="pbtn" id="next">Next ›</button></div></div>
  <div class="detail" id="detail"><div class="empty">Select a component.</div></div>
</div>
<div class="toast" id="toast"></div>
<script>
let APPID, Q='', PAGE=0, SIZE=20, SEL=null, LOG=[], CUR=null;
async function jget(p){const r=await fetch(p);if(!r.ok)throw new Error(p+' '+r.status);return r.json();}
async function jpost(p,b){const r=await fetch(p,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});return {ok:r.ok,status:r.status,j:await r.json().catch(()=>({}))};}
function toast(m,e){const t=document.getElementById('toast');t.textContent=m;t.className='toast show'+(e?' err':'');setTimeout(()=>t.className='toast',2200);}
function esc(s){return (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function egressHosts(a){return (a||[]).map(e=>(e&&typeof e==='object')?(e.host+(e.auth?' · login':'')):e);}
function statusInfo(s){s=String(s==null?'':s);
  if(/^2\d\d$/.test(s))return{t:s,c:'allowed',hint:'ok'};
  if(s==='401'||s==='403')return{t:s,c:'denied',hint:'key rejected — rotate it'};
  if(s==='404')return{t:s,c:'warn',hint:'endpoint not found — check the component'};
  if(/^5\d\d$/.test(s))return{t:s,c:'warn',hint:'upstream error — retry later'};
  if(s.startsWith('unreachable'))return{t:'unreachable',c:'muted',hint:'network / DNS — not a key issue'};
  return{t:s||'—',c:'muted',hint:''};}

async function boot(){
  const cfg=await fetch('./config.json').then(r=>r.json()); APPID=cfg.app_id;
  fetch('/session').then(r=>r.json()).then(s=>{document.getElementById('who').textContent=s.authenticated?('● '+s.sub):'';});
  let t; document.getElementById('q').oninput=e=>{clearTimeout(t);t=setTimeout(()=>{Q=e.target.value.trim();PAGE=0;loadList();},250);};
  document.getElementById('prev').onclick=()=>{if(PAGE>0){PAGE--;loadList();}};
  document.getElementById('next').onclick=()=>{PAGE++;loadList();};
  loadList();
}
async function loadList(){
  const d=await jget(`/bridge/components?q=${encodeURIComponent(Q)}&page=${PAGE}&page_size=${SIZE}`);
  const items=document.getElementById('items');
  if(!d.components.length){items.innerHTML='<div class="empty">'+(Q?'no matches':'no components')+'</div>';}
  else items.innerHTML=d.components.map(c=>`<div class="it" data-id="${esc(c.id)}">
    <div class="nm">${esc(c.title||c.id.split('/').pop())}</div><div class="sub">${esc(c.id)}</div>
    <div class="tags"><span class="tag">${esc(c.kind||'')}</span>${(c.egress||[]).length?`<span class="tag">${c.egress.length} egress</span>`:''}${(c.secrets||[]).length?`<span class="tag">${c.secrets.length} key</span>`:''}</div></div>`).join('');
  items.querySelectorAll('.it').forEach(el=>el.onclick=()=>{items.querySelectorAll('.it').forEach(x=>x.classList.remove('sel'));el.classList.add('sel');select(d.components.find(c=>c.id===el.dataset.id));});
  const a=d.total?PAGE*SIZE+1:0, b=Math.min((PAGE+1)*SIZE,d.total);
  document.getElementById('range').textContent=`${a}–${b} of ${d.total}`;
  document.getElementById('prev').disabled=PAGE<=0; document.getElementById('next').disabled=b>=d.total;
}
function chips(a){return (a&&a.length)?a.map(x=>`<span class="chip">${esc(x)}</span>`).join(''):'<span class="muted">none</span>';}
async function select(c){
  SEL=c; LOG=[]; CUR=null;
  const D=document.getElementById('detail');
  D.innerHTML=`<div style="font-weight:600;font-size:15px">${esc(c.title||c.id.split('/').pop())} <span class="tag">${esc(c.kind||'')}</span></div>
    <div class="cid">${esc(c.id)} · tenant ${esc(c.tenant||'')}</div>
    <div class="tabs"><span class="tab on" data-t="settings">Settings</span><span class="tab" data-t="sources">Sources &amp; Attribution</span><span class="tab" data-t="schedule">Schedule</span><span class="tab" data-t="logs">Logs</span></div>
    <div id="tab-settings">
      <div class="lbl">Reads (registries)</div><div>${chips(c.reads)}</div>
      <div class="lbl">Writes (registries)</div><div>${chips(c.writes)}</div>
      <div class="lbl">Declared egress</div><div>${chips(egressHosts(c.egress))}</div>
      <div class="lbl">API keys</div><div id="keys"></div>
    </div>
    <div id="tab-schedule" style="display:none">
      <div class="lbl">Run</div>
      <div class="keyrow"><button class="btn primary" id="runnow">▶ Run now</button>
        <span class="muted">manually trigger one run — same confined path a schedule uses</span></div>
      <div class="lbl">Schedules (cron)</div><div id="scheds"><div class="muted">loading…</div></div>
      <div class="keyrow" style="margin-top:8px">
        <select class="v" id="cronpreset" style="flex:none;min-width:150px">
          <option value="">preset…</option><option value="*/15 * * * *">every 15 min</option>
          <option value="0 * * * *">hourly</option><option value="0 2 * * *">daily 02:00</option>
          <option value="0 3 * * 1">weekly Mon 03:00</option></select>
        <input class="v" id="cronval" placeholder="min hour dom mon dow  (e.g. 0 2 * * *)">
        <button class="btn primary" id="addsched">+ Add</button></div>
      <div class="lbl">Recent runs</div><div id="runs"><div class="muted">—</div></div>
    </div>
    <div id="tab-sources" style="display:none"><div class="lbl">Data sources &amp; attribution</div><div id="sources"><div class="muted">—</div></div></div>
    <div id="tab-logs" style="display:none"><div class="lbl">External-call log</div><div id="log"><div class="muted">loading…</div></div></div>`;
  D.querySelectorAll('.tab').forEach(el=>el.onclick=()=>{
    D.querySelectorAll('.tab').forEach(x=>x.classList.remove('on')); el.classList.add('on');
    const t=el.dataset.t;
    document.getElementById('tab-settings').style.display=t==='settings'?'':'none';
    document.getElementById('tab-sources').style.display=t==='sources'?'':'none';
    document.getElementById('tab-schedule').style.display=t==='schedule'?'':'none';
    document.getElementById('tab-logs').style.display=t==='logs'?'':'none';
    if(t==='schedule')loadSchedule();
    if(t==='sources')renderSources();
  });
  document.getElementById('runnow').onclick=runNow;
  document.getElementById('cronpreset').onchange=e=>{if(e.target.value)document.getElementById('cronval').value=e.target.value;};
  document.getElementById('addsched').onclick=addSchedule;
  await loadMoreLog();     // load first page of the log first (the keys nudge reads it)
  loadKeys();
}
function renderSources(){
  const S=document.getElementById('sources'); if(!S)return;
  const srcs=(SEL&&SEL.sources)||[];
  if(!srcs.length){S.innerHTML='<span class="muted">this component declares no external data sources — nothing to attribute</span>';return;}
  const lk=(u,t)=>u?`<a href="${esc(u)}" target="_blank" rel="noopener" style="color:var(--accent);font-size:12px">${t} ↗</a>`:'';
  S.innerHTML=srcs.map(s=>{const lic=s.license||{};
    const rl=s.rate_limit?[s.rate_limit.per_min?s.rate_limit.per_min+'/min':'',s.rate_limit.per_hour?s.rate_limit.per_hour+'/hr':''].filter(Boolean).join(' · '):'';
    return `<div style="border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:0 0 12px;background:var(--card)">
      <div style="font-weight:600">${esc(s.name||s.source_id||'')}${s.provider?` <span class="muted" style="font-weight:400">· ${esc(s.provider)}</span>`:''}</div>
      <div style="margin:8px 0">${esc(s.attribution||'')}</div>
      <div class="keyrow" style="gap:14px">${lic.id?`<span class="chip">${esc(lic.id)}</span>`:''}${lk(lic.url,'licence')}${lk(s.terms_url,'terms')}${lk(s.url,'source')}</div>
      <div class="muted" style="font-size:12px;margin-top:6px">${rl?('rate limit '+esc(rl)+' · '):''}${s.user_agent?('UA '+esc(s.user_agent)):''}</div>
    </div>`;}).join('')
    +`<div class="muted" style="font-size:12px;margin-top:4px">Resolved by the platform from each fact's source — the same credits appear wherever this data is shown.</div>`;
}
async function loadSchedule(){
  const S=document.getElementById('scheds');
  try{
    const d=await jget('/bridge/schedules?component='+encodeURIComponent(SEL.id));
    const rows=d.schedules||[];
    S.innerHTML=rows.length?('<table><tr><th>cron</th><th>enabled</th><th>last run</th><th>status</th><th>next run</th><th></th></tr>'+
      rows.map(s=>`<tr><td>${esc(s.cron)}</td>
        <td class="${s.enabled!==false?'allowed':'muted'}">${s.enabled!==false?'on':'off'}</td>
        <td>${esc((s.last_run||'—').replace('T',' ').replace('Z',''))}</td>
        <td class="${s.last_status==='ok'?'allowed':(s.last_status?'warn':'muted')}">${esc(s.last_status||'—')}</td>
        <td>${esc((s.next_run||'—').replace('T',' ').replace('Z',''))}</td>
        <td><button class="btn" data-tog="${esc(s.id)}" data-en="${s.enabled!==false}">${s.enabled!==false?'Disable':'Enable'}</button></td></tr>`).join('')+'</table>')
      :'<span class="muted">no schedules — this component only runs manually or on an event</span>';
    S.querySelectorAll('[data-tog]').forEach(b=>b.onclick=async()=>{
      const s=rows.find(x=>x.id===b.dataset.tog);
      const r=await jpost('/bridge/schedule',{id:s.id,component:s.component,cron:s.cron,enabled:!(s.enabled!==false),overlap:s.overlap});
      r.ok?(toast('schedule updated'),loadSchedule()):toast(r.j.error||'failed',true);});
  }catch(e){S.innerHTML='<span class="muted">scheduler unavailable</span>';}
  loadRuns();
}
async function loadRuns(){
  const R=document.getElementById('runs'); if(!R)return;
  try{const d=await jget('/bridge/runs?component='+encodeURIComponent(SEL.id)+'&limit=10');
    const rs=d.runs||[];
    R.innerHTML=rs.length?('<table><tr><th>when</th><th>trigger</th><th>status</th></tr>'+
      rs.map(r=>`<tr><td>${esc((r.at||'').replace('T',' ').replace('Z',''))}</td><td>${esc(r.reason||'')}</td>
        <td class="${r.status==='ok'?'allowed':'warn'}" title="${esc(r.log||r.detail||'')}">${esc(r.status)}</td></tr>`).join('')+'</table>')
      :'<span class="muted">no runs yet</span>';
  }catch(e){R.innerHTML='<span class="muted">—</span>';}
}
async function runNow(){
  const b=document.getElementById('runnow'); b.disabled=true; b.textContent='running…';
  const r=await jpost('/bridge/run',{component:SEL.id});
  b.disabled=false; b.textContent='▶ Run now';
  r.ok?toast('run '+(r.j.status||'done')):toast(r.j.error||'run failed',true);
  loadRuns();
}
async function addSchedule(){
  const cron=document.getElementById('cronval').value.trim();
  if(!cron)return toast('enter a cron expression',true);
  const r=await jpost('/bridge/schedule',{component:SEL.id,cron,enabled:true});
  if(r.ok){toast('schedule added');document.getElementById('cronval').value='';document.getElementById('cronpreset').value='';loadSchedule();}
  else toast(r.j.error||'failed',true);
}
async function loadMoreLog(){
  const r=await jpost('/bridge/query',{app_id:APPID,schema:'prov.egress',filter:{component:SEL.id},paginate:true,limit:25,cursor:CUR});
  LOG=LOG.concat(r.j.results||[]); CUR=r.j.next_cursor||null;
  renderLog();
}
function renderLog(){
  const L=document.getElementById('log'); if(!L)return;
  if(!LOG.length){L.innerHTML='<span class="muted">no external calls recorded</span>';return;}
  L.innerHTML='<table><tr><th>when</th><th>host</th><th>path</th><th>secret</th><th>outcome</th><th>upstream</th></tr>'+
    LOG.map(e=>{const si=statusInfo(e.upstream_status);return `<tr><td>${esc((e.at||'').replace('T',' ').replace('Z',''))}</td><td>${esc(e.host||'')}</td><td>${esc(e.path||'')}</td>
      <td>${esc(e.secret||'')}</td><td class="${e.outcome==='allowed'?'allowed':'denied'}">${esc(e.outcome)}${e.reason?' ('+esc(e.reason)+')':''}</td>
      <td class="${si.c}" title="${esc(si.hint)}">${esc(si.t)}${si.hint&&si.t!=='—'?' · '+esc(si.hint):''}</td></tr>`;}).join('')+'</table>'
    +(CUR?'<button class="btn" id="more" style="margin-top:10px">Load more</button>':'<div class="muted" style="margin-top:8px">— end —</div>');
  const m=document.getElementById('more'); if(m)m.onclick=loadMoreLog;
}
async function loadKeys(){
  const K=document.getElementById('keys'); if(!K)return;
  if(!(SEL.secrets||[]).length){K.innerHTML='<span class="muted">no secrets required</span>';return;}
  const status=(await jpost('/bridge/secret',{action:'status',component:SEL.id})).j.secrets_set||[];
  const setNames=new Map(status.map(s=>[s.name,s.version]));
  K.innerHTML='';
  SEL.secrets.forEach(sec=>{
    const s=(typeof sec==='string')?{name:sec}:sec;           // tolerate bare-name or rich {name,label,description,url}
    const name=s.name;
    const last=LOG.find(e=>e.secret===name && String(e.upstream_status||'').length);
    const si=last?statusInfo(last.upstream_status):null;
    const nudge=(si&&si.c==='denied')?`<span class="badge ${si.c}">⚠ last call ${si.t} — ${esc(si.hint)}</span>`:'';
    const wrap=document.createElement('div');wrap.style.cssText='margin:0 0 14px';
    const getlink=s.url?` · <a href="${esc(s.url)}" target="_blank" rel="noopener" style="color:var(--accent)">Get key ↗</a>`:'';
    const desc=(s.description||s.label)?`<div style="color:var(--dim);font-size:12px;margin:2px 0 6px;max-width:520px">${esc(s.label?(s.label+' — '):'')}${esc(s.description||'')}${getlink}</div>`:'';
    const row=document.createElement('div');row.className='keyrow';
    row.innerHTML=`<span class="kn">${esc(name)}</span>`+(setNames.has(name)?`<span class="set">● set (v${setNames.get(name)})</span>`:`<span class="unset">○ not set</span>`)
      +nudge+`<input class="v" type="text" placeholder="new value" data-v><button class="btn primary" data-do>${setNames.has(name)?'Rotate':'Set'}</button>`;
    row.querySelector('[data-do]').onclick=async()=>{const val=row.querySelector('[data-v]').value;if(!val)return toast('enter a value',true);
      const act=setNames.has(name)?'rotate':'set';const r=await jpost('/bridge/secret',{action:act,component:SEL.id,name,value:val});
      r.ok?(toast(name+' '+act+'d'),loadKeys()):toast(r.j.error||('failed '+r.status),true);};
    wrap.innerHTML=desc; wrap.appendChild(row); K.appendChild(wrap);
  });
}
boot();
</script>
