<!doctype html><meta charset="utf-8"><title>Chat</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{--bg:#0d1117;--panel:#161b22;--panel2:#0f141a;--line:#21262d;--txt:#e6edf3;--dim:#8b949e;--accent:#7c5cff;--accent2:#2f81f7;--good:#3fb950;--mine:#2f5fd0;--ai:#3a2f6b}
  *{box-sizing:border-box} html,body{height:100%;margin:0}
  body{background:var(--bg);color:var(--txt);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;overflow:hidden}
  .hbar{display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--line);flex:0 0 auto}
  .brand{font-weight:700;display:flex;align-items:center;gap:7px} .brand .logo{width:22px;height:22px;border-radius:6px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;font-size:13px}
  .me{margin-left:auto;font-size:12px;color:var(--dim);border:1px solid var(--line);border-radius:16px;padding:3px 10px}
  .body{flex:1;display:flex;min-height:0}
  .side{width:270px;background:var(--panel2);border-right:1px solid var(--line);display:flex;flex-direction:column;flex:0 0 auto}
  .side .top{padding:9px 10px;display:flex;gap:6px;align-items:center;border-bottom:1px solid var(--line)}
  .side .top b{flex:1} .chlist{flex:1;overflow:auto;padding:6px}
  .ch{padding:9px 10px;border-radius:10px;cursor:pointer;display:flex;gap:9px;align-items:center;border:1px solid transparent}
  .ch:hover{background:#1b222c} .ch.on{background:#1b2430;border-color:#2b3a55}
  .av{width:34px;height:34px;border-radius:50%;flex:0 0 auto;display:grid;place-items:center;font-size:15px;background:#233; color:#cfe}
  .av.ai{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}
  .ch .meta{min-width:0;flex:1} .ch .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ch .p{font-size:12px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .empty{color:var(--dim);text-align:center;padding:30px 16px}
  .main{flex:1;display:flex;flex-direction:column;min-width:0}
  .chhead{display:flex;align-items:center;gap:10px;padding:9px 14px;border-bottom:1px solid var(--line);background:var(--panel);flex:0 0 auto}
  .chhead .t{font-weight:650} .chhead .sub{font-size:12px;color:var(--dim)}
  .thread{flex:1;overflow:auto;padding:18px 16px;display:flex;flex-direction:column;gap:10px;background:var(--bg)}
  .row{display:flex;gap:9px;max-width:76%} .row.mine{align-self:flex-end;flex-direction:row-reverse}
  .bubble{padding:9px 12px;border-radius:14px;white-space:pre-wrap;word-wrap:break-word;background:var(--panel);border:1px solid var(--line)}
  .row.mine .bubble{background:var(--mine);border-color:var(--mine);color:#fff}
  .row.ai .bubble{background:var(--ai);border-color:#4a3d86}
  .who{font-size:11px;color:var(--dim);margin:0 0 3px 2px} .row.mine .who{text-align:right}
  .sav{width:30px;height:30px;border-radius:50%;flex:0 0 auto;display:grid;place-items:center;font-size:13px;background:#233;color:#cfe}
  .sav.ai{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}
  .composer{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--line);background:var(--panel);flex:0 0 auto}
  .composer textarea{flex:1;resize:none;max-height:120px;background:var(--bg);color:var(--txt);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font:inherit}
  .send{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border:0;border-radius:12px;padding:0 16px;font:600 14px/1 inherit;cursor:pointer}
  .send:disabled{opacity:.5}
  .welcome{flex:1;display:grid;place-items:center;color:var(--dim);text-align:center;padding:30px}
  .btn{background:#21262d;color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:6px 11px;font:inherit;cursor:pointer}
  .btn.primary{background:var(--accent2);border-color:var(--accent2);color:#fff}
  .ic{cursor:pointer;color:var(--dim);border:1px solid var(--line);border-radius:8px;padding:5px 9px;background:var(--bg)} .ic:hover{color:var(--txt)}
  .modal{position:fixed;inset:0;background:rgba(4,7,12,.6);display:flex;align-items:center;justify-content:center;z-index:60}
  .sheet{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;width:460px;max-width:92vw}
  .sheet h3{margin:0 0 4px} .sheet label{font-size:12px;color:var(--dim);display:block;margin:10px 0 3px}
  .in{width:100%;background:var(--bg);color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:9px 10px;font:inherit}
  .sub{color:var(--dim);font-size:12px} .spin{display:inline-block;width:12px;height:12px;border:2px solid #ffffff55;border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  .typing{align-self:flex-start;color:var(--dim);font-size:12px;padding:2px 6px}
</style>
<div class="hbar">
  <span class="brand"><span class="logo">💬</span>Chat</span>
  <span class="me" id="me"></span>
</div>
<div class="body">
  <div class="side">
    <div class="top"><b>Conversations</b><button class="ic" id="aiBtn" title="New AI chat">✨</button><button class="ic" id="newBtn" title="New conversation">＋</button></div>
    <div class="chlist" id="chlist"></div>
  </div>
  <div class="main" id="main">
    <div class="welcome" id="welcome">Pick a conversation, or start one with ＋ (people) or ✨ (the AI assistant).</div>
  </div>
</div>
<script>
const $=id=>document.getElementById(id);
const esc=s=>(s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const AI='agent://ai';
let ME='', TENANT='', CHANS=[], CUR=null, poll=null;
async function api(p,b){return fetch(p,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b||{})}).then(r=>r.json());}
const uname=p=>(p||'').replace(/^agent:\/\/ai$/,'AI').replace(/^user:\/\/[^/]+\//,'').replace(/^participant:\/\//,'');
const isAI=p=>p===AI;
function avatar(p,cls){const ai=isAI(p);return `<div class="${cls} ${ai?'ai':''}">${ai?'✨':esc((uname(p)[0]||'?').toUpperCase())}</div>`;}
function chTitle(c){ if(c.title) return c.title; const others=(c.members||[]).filter(m=>m!==ME); return others.map(uname).join(', ')||'Chat'; }
function chIcon(c){ if((c.members||[]).includes(AI)) return '✨'; return (c.kind==='group')?'👥':'👤'; }

async function boot(){
  try{const s=await fetch('/session').then(r=>r.json()); ME=s.sub||''; TENANT=s.tenant||'';}catch(e){}
  $('me').textContent=uname(ME)+' · '+TENANT;
  $('newBtn').onclick=()=>newChat(false);
  $('aiBtn').onclick=()=>startAI();
  await loadChans();
  if(CHANS.length) openChan(CHANS[0].id);
}
async function loadChans(){ const r=await api('/bridge/chat-channels'); CHANS=r.channels||[]; renderChans(); }
function renderChans(){
  const L=$('chlist');
  if(!CHANS.length){ L.innerHTML='<div class="empty">No conversations yet.<br>Start one with ＋ or ✨.</div>'; return; }
  L.innerHTML=CHANS.map(c=>`<div class="ch ${CUR&&c.id===CUR.id?'on':''}" data-id="${esc(c.id)}">
     ${avatar((c.members||[]).includes(AI)?AI:(c.members||[]).find(m=>m!==ME)||ME,'av')}
     <div class="meta"><div class="t">${esc(chTitle(c))} ${chIcon(c)}</div><div class="p">${esc(c._last||((c.members||[]).map(uname).join(', ')))}</div></div></div>`).join('');
  L.querySelectorAll('[data-id]').forEach(el=>el.onclick=()=>openChan(el.dataset.id));
}
async function openChan(id){
  const c=CHANS.find(x=>x.id===id); if(!c)return; CUR=c; renderChans();
  $('main').innerHTML=`<div class="chhead">${avatar((c.members||[]).includes(AI)?AI:(c.members||[]).find(m=>m!==ME)||ME,'av')}
      <div><div class="t">${esc(chTitle(c))}</div><div class="sub">${esc((c.members||[]).map(uname).join(', '))}</div></div></div>
    <div class="thread" id="thread"></div>
    <div class="composer"><textarea id="msg" rows="1" placeholder="Message…"></textarea><button class="send" id="send">Send</button></div>`;
  const ta=$('msg');
  ta.oninput=()=>{ta.style.height='auto';ta.style.height=Math.min(ta.scrollHeight,120)+'px';};
  ta.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send();}};
  $('send').onclick=send;
  await refresh(true);
  if(poll)clearInterval(poll); poll=setInterval(()=>refresh(false),4000);
}
async function refresh(scroll){
  if(!CUR)return; const r=await api('/bridge/chat-messages',{channel_ref:CUR.id});
  renderThread(r.messages||[]); if(scroll) scrollEnd();
}
function renderThread(msgs){
  const T=$('thread'); if(!T)return;
  const atBottom = T.scrollHeight-T.scrollTop-T.clientHeight < 60;
  T.querySelectorAll('.typing').forEach(e=>e.remove());
  T.innerHTML=msgs.map(m=>{const mine=m.sender===ME, ai=isAI(m.sender);
    return `<div class="row ${mine?'mine':''} ${ai?'ai':''}">${avatar(m.sender,'sav')}
      <div><div class="who">${mine?'You':esc(uname(m.sender))}</div><div class="bubble">${esc(m.body)}</div></div></div>`;}).join('');
  if(atBottom) scrollEnd();
}
function scrollEnd(){const T=$('thread'); if(T)T.scrollTop=T.scrollHeight+400;}
function showTyping(){const T=$('thread'); if(!T)return; const d=document.createElement('div'); d.className='typing'; d.innerHTML='✨ AI is typing… <span class="spin"></span>'; T.appendChild(d); scrollEnd();}
async function send(){
  const ta=$('msg'); const text=(ta.value||'').trim(); if(!text||!CUR)return;
  ta.value=''; ta.style.height='auto'; $('send').disabled=true;
  // optimistic echo
  const T=$('thread'); if(T){T.insertAdjacentHTML('beforeend',`<div class="row mine">${avatar(ME,'sav')}<div><div class="who">You</div><div class="bubble">${esc(text)}</div></div></div>`); scrollEnd();}
  if((CUR.members||[]).includes(AI)) showTyping();
  try{ await api('/bridge/chat-send',{channel_ref:CUR.id,body:text}); await refresh(true); await loadChans(); }
  catch(e){}
  $('send').disabled=false; $('msg').focus();
}
function startAI(){ createChan({title:'AI Assistant', members:[AI], kind:'ai'}); }
function newChat(){
  const m=modal(`<h3>New conversation</h3>
    <label>People <span class="sub">— usernames in this tenant, comma-separated</span></label>
    <input class="in" id="ppl" placeholder="e.g. ca1, judge1">
    <label style="display:flex;align-items:center;gap:8px;margin-top:12px;color:var(--txt)"><input type="checkbox" id="withai"> Include the ✨ AI assistant</label>
    <label>Title <span class="sub">(optional)</span></label><input class="in" id="ttl" placeholder="Team room">
    <div style="text-align:right;margin-top:14px"><button class="btn" id="x">Cancel</button> <button class="btn primary" id="go">Start</button></div>`);
  m.q('#x').onclick=m.close;
  m.q('#go').onclick=()=>{
    const ppl=(m.q('#ppl').value||'').split(/[,\s]+/).map(s=>s.trim()).filter(Boolean).map(u=>u.includes('://')?u:('user://'+TENANT+'/'+u));
    const members=ppl.slice(); if(m.q('#withai').checked)members.push(AI);
    if(!members.length){m.q('#ppl').focus();return;}
    m.close(); createChan({title:(m.q('#ttl').value||'').trim(), members});
  };
}
async function createChan(spec){
  const r=await api('/bridge/chat-create',spec);
  if(r.channel){ CHANS.unshift(r.channel); renderChans(); openChan(r.channel.id); }
}
function modal(html){const w=document.createElement('div');w.className='modal';w.innerHTML=`<div class="sheet">${html}</div>`;document.body.appendChild(w);w.onclick=e=>{if(e.target===w)w.remove();};return {q:s=>w.querySelector(s),close:()=>w.remove()};}
boot();
</script>
