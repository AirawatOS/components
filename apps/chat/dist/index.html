<!doctype html><meta charset="utf-8"><title>Chat with AI Experts</title>
<style>
  :root{--bg:#0d1117;--panel:#161b22;--line:#21262d;--txt:#e6edf3;--dim:#8b949e;--accent:#2f81f7;--good:#3fb950;--warn:#d29922;--err:#f85149}
  *{box-sizing:border-box} html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--txt);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column}
  header{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
  header .t{font-weight:650;font-size:15px} header .t small{color:var(--dim);font-weight:400}
  select{margin-left:auto;background:var(--bg);color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:13px;max-width:60%}
  #log{flex:1;overflow-y:auto;padding:20px 16px;display:flex;flex-direction:column;gap:14px}
  .wrap{max-width:760px;width:100%;margin:0 auto}
  .msg{display:flex;gap:10px;align-items:flex-start}
  .msg.user{flex-direction:row-reverse}
  .av{flex:0 0 30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:14px;background:#1f2937;border:1px solid var(--line)}
  .msg.user .av{background:#132a4a;border-color:#1d4272}
  .bub{padding:10px 13px;border-radius:12px;background:var(--panel);border:1px solid var(--line);max-width:76%;white-space:pre-wrap;word-wrap:break-word}
  .msg.user .bub{background:#132a4a;border-color:#1d4272}
  .bub b.cref{color:var(--accent);font-weight:600}
  .src{margin-top:9px;padding-top:8px;border-top:1px dashed var(--line);font-size:12px;color:var(--dim)}
  .src .h{color:var(--dim);text-transform:uppercase;letter-spacing:.5px;font-size:10.5px;margin-bottom:3px}
  .src .item{margin:2px 0} .src .tag{display:inline-block;font-size:10px;border:1px solid var(--line);border-radius:5px;padding:0 5px;margin-right:5px;color:var(--dim)}
  .typing{color:var(--dim)} .err{color:var(--err)}
  footer{border-top:1px solid var(--line);background:var(--panel);padding:12px 16px}
  .in{max-width:760px;margin:0 auto;display:flex;gap:8px}
  textarea{flex:1;resize:none;background:var(--bg);color:var(--txt);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:inherit;max-height:120px}
  button{background:var(--accent);color:#fff;border:0;border-radius:10px;padding:0 18px;font-weight:600;cursor:pointer}
  button:disabled{opacity:.5;cursor:default}
  .foot{max-width:760px;margin:6px auto 0;color:var(--dim);font-size:11px;text-align:center}
</style>
<header>
  <div class="av">🧠</div>
  <div class="t">Chat with an AI Expert<br><small>grounded in rules, measurements & cited knowledge — it proposes, it never decides</small></div>
  <select id="expert"></select>
</header>
<div id="log"><div class="wrap" id="stream"></div></div>
<footer>
  <div class="in">
    <textarea id="input" rows="1" placeholder="Ask the expert…"></textarea>
    <button id="send">Send</button>
  </div>
  <div class="foot" id="foot"></div>
</footer>
<script>
const S=document.getElementById('stream'), LOG=document.getElementById('log'), IN=document.getElementById('input'), SEND=document.getElementById('send'), SEL=document.getElementById('expert'), FOOT=document.getElementById('foot');
let EXPERTS=[], EXPERT=null, HIST=[];
const esc=s=>(s==null?'':String(s)).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const pretty=s=>(s||'').replace(/[-_]/g,' ').replace(/\b\w/g,c=>c.toUpperCase());
const nameOf=e=>e.title||pretty((e.component_id||'').split('/').pop());
function fmt(t){return esc(t).replace(/\[(\d+)\]/g,'<b class="cref">[$1]</b>').replace(/\n/g,'<br>');}
function scroll(){LOG.scrollTop=LOG.scrollHeight;}
function bubble(role,html){
  const m=document.createElement('div'); m.className='msg '+role;
  m.innerHTML=`<div class="av">${role==='user'?'🧑':'🧠'}</div><div class="bub">${html}</div>`;
  S.appendChild(m); scroll(); return m.querySelector('.bub');
}
function sourcesHtml(sources){
  if(!sources||!sources.length) return '';
  const recs=sources.filter(s=>s.type==='recommendation'), kn=sources.filter(s=>s.type==='knowledge');
  let h='<div class="src"><div class="h">Sources</div>';
  recs.forEach(r=>h+=`<div class="item"><span class="tag">recommendation</span>${esc(r.title||r.id)}</div>`);
  kn.forEach(k=>h+=`<div class="item"><span class="tag">[${k.n}] knowledge</span>${esc(k.title||'document')}${k.locator&&k.locator.label?' · '+esc(k.locator.label):''}</div>`);
  return h+'</div>';
}
function greet(e){
  S.innerHTML='';
  if(!e){ bubble('expert','No AI Experts are installed yet. Open the <b>Marketplace</b> and install one (e.g. the Air Quality Expert) to chat with it.'); return; }
  bubble('expert',`Hello — I'm the <b>${esc(nameOf(e))}</b>. ${esc(e.description||'')}<br><br>Ask me about my domain. I answer from the governance rules in force and the latest measurements, and I show my sources.`);
}
async function send(){
  const msg=IN.value.trim(); if(!msg||!EXPERT) return;
  bubble('user',fmt(msg)); IN.value=''; IN.style.height='auto'; HIST.push({role:'user',content:msg});
  SEND.disabled=true;
  const tip=bubble('expert','<span class="typing">…thinking</span>');
  try{
    const r=await fetch('/bridge/expert-chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({expert_id:EXPERT.component_id,message:msg,history:HIST})}).then(r=>r.json());
    if(r.error){ tip.innerHTML='<span class="err">'+esc(r.error)+'</span>'; }
    else{ tip.innerHTML=fmt(r.answer)+sourcesHtml(r.sources); HIST.push({role:'assistant',content:r.answer}); FOOT.textContent=r.model?'grounded':''; }
  }catch(e){ tip.innerHTML='<span class="err">could not reach the expert ('+esc(e.message)+')</span>'; }
  SEND.disabled=false; scroll();
}
IN.addEventListener('input',()=>{IN.style.height='auto';IN.style.height=Math.min(IN.scrollHeight,120)+'px';});
IN.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send();}});
SEND.onclick=send;
(async function(){
  let d={}; try{ d=await fetch('/bridge/market').then(r=>r.json()); }catch(e){}
  const inst=new Set(d.installed||[]);
  EXPERTS=(d.components||[]).filter(c=>c.kind==='agent'&&inst.has(c.component_id));
  if(!EXPERTS.length){ SEL.innerHTML='<option>No experts installed</option>'; SEL.disabled=true; IN.disabled=true; SEND.disabled=true; greet(null); return; }
  SEL.innerHTML=EXPERTS.map(e=>`<option value="${esc(e.component_id)}">${esc(nameOf(e))}</option>`).join('');
  EXPERT=EXPERTS[0];
  SEL.onchange=()=>{EXPERT=EXPERTS.find(e=>e.component_id===SEL.value);HIST=[];greet(EXPERT);};
  greet(EXPERT); IN.focus();
})();
</script>
