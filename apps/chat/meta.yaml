# Chat — the Airawat Workspace messenger (kind=app). PART OF THE BASE OS PRODUCTIVITY SUITE.
# UNIFIED conversation: a channel's members are principals — user:// (a person), agent:// (an AI assistant/
# expert) or participant:// (someone in another tenant). Messaging a channel that has an agent member gets an
# automatic AI reply (routed server-side via the model gateway, Kimi K3) — so chatting with a person, with the
# AI, or a group of both is the SAME app + schema. Membership-scoped: you only see channels you belong to.
#
# Writes go through the dedicated /bridge/chat-* bridges (membership-enforced + AI routing), NOT /bridge/save —
# so this app is NOT `personal` (channels are shared among members). Available to every signed-in user (roles []).
component_id: ds:airawat:app/chat
kind: app
version: 0.1.0
provider: ds:airawat:developer
display_name: Chat
icon: 💬
entrypoint: index.html
bundle: dist
sandboxed: true
required_schemas: [chat.channel, chat.message]
writes: [chat.channel, chat.message]
roles: []

default_install: true   # part of the base-OS default suite every tenant receives