<style>
  :root{--bg:#0d1117;--panel:#161b22;--panel2:#0f141a;--line:#21262d;--txt:#e6edf3;--dim:#8b949e;--accent:#2f81f7;--good:#3fb950;--warn:#d29922;--err:#f85149}
  *{box-sizing:border-box} html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font:14px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  body{display:flex;flex-direction:column;height:100vh}
  .hbar{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--line);flex:0 0 auto}
  .hbar b{font-size:15px}
  .btn{background:var(--accent);color:#fff;border:0;border-radius:7px;padding:6px 12px;cursor:pointer;font-size:13px;font-weight:500}
  .btn.ghost{background:#21262d;color:var(--txt)}.btn.sm{padding:3px 8px;font-size:12px}.btn.danger{background:#b62324}.btn:disabled{opacity:.5}
  .body{flex:1;display:flex;min-height:0}
  .left{width:230px;background:var(--panel2);border-right:1px solid var(--line);overflow:auto;flex:0 0 auto}
  .navh{padding:8px 12px;color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.05em}
  .navi{padding:8px 12px;cursor:pointer;border-left:2px solid transparent;font-size:13px}
  .navi:hover{background:#131922}.navi.on{background:#131922;border-left-color:var(--accent)}
  .navi .s{color:var(--dim);font-size:11px}
  .edit{flex:1;min-width:0;overflow:auto;padding:18px 22px}
  .right{width:320px;flex:0 0 auto;min-width:0;overflow:hidden;background:var(--panel2);border-left:1px solid var(--line);display:flex;flex-direction:column;transition:width .12s}
  .right.collapsed{width:40px}.right.collapsed .rbody,.right.collapsed .rh b,.right.collapsed .rin{display:none}
  .rh{display:flex;align-items:center;gap:6px;padding:10px;border-bottom:1px solid var(--line);cursor:pointer;white-space:nowrap}
  .rbody{flex:1;overflow:auto;padding:10px;min-width:0}
  .msg{margin:8px 0;font-size:13px}.msg.u{text-align:right}.bub{display:inline-block;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:7px 10px;max-width:88%;white-space:pre-wrap;text-align:left}
  .msg.u .bub{background:#12233b;border-color:#23406a}
  .rin{display:flex;gap:6px;padding:8px;border-top:1px solid var(--line);min-width:0}
  .rin input{min-width:0}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;margin:12px auto;max-width:760px}
  h3{margin:.2em 0 .6em;font-size:14px}
  input,select,textarea{width:100%;background:var(--bg);border:1px solid #30363d;color:var(--txt);border-radius:7px;padding:8px;margin:3px 0;font:inherit}
  label{font-size:12px;color:var(--dim);margin-top:6px;display:block}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .rowline{display:grid;grid-template-columns:1.2fr 1fr .6fr auto;gap:6px;align-items:center;margin:6px 0}
  .stepline{display:grid;grid-template-columns:auto .9fr 1.1fr 1.2fr 1fr auto;gap:6px;align-items:center;margin:6px 0}
  .num{width:22px;height:22px;border-radius:50%;background:#21262d;display:grid;place-items:center;font-size:12px}
  .chk{display:flex;align-items:center;gap:8px;padding:6px 8px;border:1px solid var(--line);border-radius:7px;margin:4px 0;cursor:pointer}
  .chk input{width:auto;margin:0}
  .muted{color:var(--dim);font-size:13px}.ok{color:var(--good)}.err{color:var(--err)}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:50}
  .modal.open{display:flex}.sheet{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px;width:520px;max-width:92vw;max-height:88vh;overflow:auto}
  .pill{display:inline-block;background:#21262d;border-radius:999px;padding:1px 9px;font-size:12px;margin-left:6px}
  /* 0.3.0 */
  .tabs{display:flex;gap:2px;max-width:760px;margin:0 auto 4px;border-bottom:1px solid var(--line);position:sticky;top:-18px;background:var(--bg);z-index:3;padding-top:4px}
  .tabs button{background:none;border:0;color:var(--dim);padding:9px 12px;font:inherit;font-weight:600;cursor:pointer;border-bottom:2px solid transparent}
  .tabs button.on{color:var(--txt);border-bottom-color:var(--accent)} .tabs .n{font-weight:400;font-size:11px;color:var(--dim);margin-left:4px}
  .fld{border:1px solid var(--line);border-radius:9px;padding:10px;margin:8px 0;background:var(--panel2)}
  .fld .top{display:grid;grid-template-columns:auto 1.4fr 1fr auto auto;gap:6px;align-items:center}
  .fld .more{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:6px}
  .hint{font-size:12px;color:var(--dim)} .warn{color:var(--warn)}
  table.t{width:100%;border-collapse:collapse;font-size:13px} table.t td,table.t th{border-bottom:1px solid var(--line);padding:6px 4px;text-align:left;vertical-align:top}
  table.t th{color:var(--dim);font-weight:500;font-size:12px}
  .check{padding:4px 0} .check.bad{color:var(--err)} .check.good{color:var(--good)}
  pre{white-space:pre-wrap;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;font-size:11px;max-height:340px;overflow:auto}
</style>

<script>
const api=(p,b)=>fetch(p,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b||{})}).then(r=>r.json());
const get=p=>fetch(p).then(r=>r.json());
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const slug=s=>String(s||'').toLowerCase().trim().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
const skey=s=>slug(s).replace(/-/g,'_');
const ctitle=t=>String(t||'').replace(/^credential\./,'').replace(/[_-]/g,' ').replace(/\b\w/g,c=>c.toUpperCase());
const tcase=s=>String(s||'').replace(/[-_]/g,' ').replace(/\b\w/g,c=>c.toUpperCase());
const APP='service-studio', SOLUTION='ds:airawatdeveloper:solution/declarative-service';
const PROP_HIDDEN=['property_id','zone','address','land_use','area_sqm'];            // filled from a property lookup
const FIELD_TYPES=[['text','Text'],['textarea','Long text'],['number','Number'],['date','Date'],['choice','Choice list'],['property','🏠 Property lookup'],['location','📍 Location picker']];
const BASIS=[['flat','Flat amount'],['per_sqm','Per sq m'],['percent_of_value','% of value'],['per_unit','Per unit'],['slab','Slabs (by area)']];
let ME={}, ROLES=[], CTYPES=[], CITIES=[], DOMAINS=[], AREAS=[], UNITS=[], SVCS=[], ALLSVCS=[], SEL=null, HIST=[], DOCTYPES=[], FEEROWS=[];
let AJUR=null, ALLOWED=[], TAB='basics', ORIG=null, TESTED=null, PV={}, PVLOOK=null, GRANTS=null;
let B={}, FIELDS=[], STEPS=[], DOCS=[], REQCREDS=new Set();

// ================= the MODEL: offering JSON ⇄ editor state (pure — no DOM; round-trip tested) =================
function blankState(){
  return {B:{service_id:'',title:'',domain:'urban',description:'',jurisdiction:'',entitlement:'residence',audience:'civic.resident',
             fees_on:false, fee_service:'', payment:'none', route_zone:false, escalate_to:''},
          FIELDS:[{key:'',label:'',type:'text',required:false,section:'',help:'',options:'',show_field:'',show_values:'',prefill:false,scope_dim:''}],
          STEPS:[{step:'',role:'',task:'',issues:'',sla:'',office:false,effect:'none',holder_field:'',raw_effects:null,inspection:''}],
          DOCS:[], REQCREDS:[]};
}
function parseOffering(o){
  const rs=o.request_schema||{}, props=rs.properties||{}, req=rs.required||[], ff=o.fulfillment||{};
  const order=(rs['x-order']||[]).filter(k=>k in props).concat(Object.keys(props).filter(k=>!(rs['x-order']||[]).includes(k)));
  const smap=o.scope_map||{};
  const st={B:{service_id:o.service_id||'',title:o.title||'',domain:o.domain||'urban',description:o.description||'',jurisdiction:o.jurisdiction||'',
               entitlement:o.entitlement||'residence',audience:o.audience||'civic.resident',
               fees_on:o.fee_ref==='urban.fee_schedule', fee_service:ff.fee_service||(o.fee_ref?o.service_id:''), payment:ff.payment||'none', escalate_to:ff.escalate_to||'',
               route_zone:smap.area==='zone' && Object.values(props).some(p=>p['x-lookup']==='urban.property')},
            FIELDS:[], STEPS:[], DOCS:[], REQCREDS:o.required_credentials||[]};
  let sec='';
  for(const k of order){ const p=props[k]||{};
    if(p['x-from']) continue;                                                    // hidden lookup fields are regenerated
    if(p['x-section']) sec=p['x-section'];
    const si=p['x-show-if']||{}, sf=Object.keys(si)[0]||'';
    let type=p.format==='date'?'date':p['x-widget']==='textarea'?'textarea':p.type==='number'?'number':'text', options='', scope_dim='';
    if(p['x-lookup']==='urban.property') type='property';
    const dim=Object.keys(smap).find(d=>smap[d]===k);
    if(dim && Array.isArray(p.enum)){ type='location'; scope_dim=dim; }
    else if(Array.isArray(p.enum)){ type='choice'; const L=p['x-enum-labels']||{}; options=p.enum.map(v=>L[v]&&L[v]!==tcase(v)?v+' = '+L[v]:v).join('\n'); }
    st.FIELDS.push({key:k,label:p.title||k,type,required:req.includes(k),section:sec,help:p.description||'',options,
      show_field:sf, show_values:sf?[].concat(si[sf]).join(', '):'', prefill:p['x-prefill']==='identity.name', scope_dim});
  }
  if(!st.FIELDS.length) st.FIELDS=blankState().FIELDS;
  const slas=ff.sla_hours||{};
  st.STEPS=(ff.workflow||[]).map(s=>{ const e=s.effects||null; let effect='none', holder_field='';
      if(e && e.length===2 && e[0].close && e[1].write && e[0].close.schema==='urban.property_holding' && e[1].write.schema==='urban.property_holding'){
        effect='transfer_holding'; holder_field=String(e[1].write.holder_name||'').replace('$form.',''); }
      else if(e && e.length===2 && e[0].close && e[0].close.schema==='urban.property' && (e[0].close.patch||{}).tenure==='freehold') effect='convert_freehold';
      else if(e) effect='custom';
      return {step:s.step,role:s.role,task:s.task||'',issues:s.issues||'',sla:slas[s.step]!=null?String(slas[s.step]):'',office:s.office_by==='zone',
              effect,holder_field,raw_effects:effect==='custom'?e:null, inspection:((s.inspection||{}).checklist||[]).join('\n')}; });
  if(!st.STEPS.length) st.STEPS=blankState().STEPS;
  st.DOCS=(ff.documents||[]).map(d=>{ const w=d.when||{}, f=Object.keys(w)[0]||''; return {type:d.type, when_field:f, when_values:f?[].concat(w[f]).join(', '):''}; });
  return st;
}
function buildBody(){
  const props={}, req=[], order=[]; let lastSec=null, propKey=null;
  for(const f of FIELDS){ const k=f.key||skey(f.label); if(!k) continue;
    const p={type:'string', title:f.label||tcase(k)};
    if(f.type==='number') p.type='number';
    if(f.type==='date') p.format='date';
    if(f.type==='textarea') p['x-widget']='textarea';
    if(f.help) p.description=f.help;
    if(f.section && f.section!==lastSec){ p['x-section']=f.section; lastSec=f.section; }
    if(f.type==='choice'){ const opts=String(f.options||'').split(/\n|,/).map(x=>x.trim()).filter(Boolean).map(x=>{ const m=x.split('='); return [slug(m[0]), (m[1]||'').trim()]; });
      p.enum=opts.map(o=>o[0]); const L=Object.fromEntries(opts.filter(o=>o[1]).map(o=>[o[0],o[1]])); if(Object.keys(L).length) p['x-enum-labels']=L; }
    if(f.type==='location' && f.scope_dim){ const opts = f.scope_dim==='area' ? AREAS.map(a=>[a.id, a.name+(a.level?' ('+a.level+')':'')])
          : f.scope_dim==='org_unit' ? UNITS.map(u=>[u.id, u.name]) : CITIES.map(c=>[c.code, c.name]);
      if(opts.length){ p.enum=opts.map(o=>o[0]); p['x-enum-labels']=Object.fromEntries(opts); } }
    if(f.type==='property'){ p['x-lookup']='urban.property'; propKey=k; }
    if(f.show_field){ const v=String(f.show_values||'').split(',').map(x=>slug(x)).filter(Boolean); p['x-show-if']={[f.show_field]: v.length===1?v[0]:v}; }
    if(f.prefill) p['x-prefill']='identity.name';
    props[k]=p; order.push(k); if(f.required) req.push(k);
    if(f.type==='property') for(const h of PROP_HIDDEN){ props[h]={type:'string','x-from':k+'.'+h}; order.push(h); }
  }
  const scope_map={};
  FIELDS.forEach(f=>{ const k=f.key||skey(f.label); if(k && f.type==='location' && f.scope_dim) scope_map[f.scope_dim]=k; });
  if(propKey && B.route_zone) scope_map.area='zone';
  const sla={}, wf=STEPS.filter(s=>s.role).map(s=>{ const step=slug(s.step)||slug(s.task)||'step';
    if(String(s.sla).trim()!=='' && !isNaN(+s.sla)) sla[step]=+s.sla;
    const o={step, role:s.role, ...(s.office && propKey && B.route_zone ? {office_by:'zone'} : {}), task:s.task||s.step};
    if(s.issues) o.issues=s.issues;
    const chk=String(s.inspection||'').split('\n').map(x=>x.trim()).filter(Boolean); if(chk.length) o.inspection={checklist:chk};
    if(s.effect==='transfer_holding' && propKey && s.holder_field) o.effects=[
      {close:{schema:'urban.property_holding', match:{property:'$form.'+propKey}, patch:{until:'$today'}}},
      {write:{schema:'urban.property_holding', property:'$form.'+propKey, holder_name:'$form.'+s.holder_field, holder_ref:'$applicant',
              relation:'owner', share_pct:100, since:'$today', source_doc:'$case'}}];
    else if(s.effect==='convert_freehold' && propKey) o.effects=[
      {close:{schema:'urban.property', match:{id:'$form.'+propKey}, patch:{tenure:'freehold'}}},
      {close:{schema:'urban.lease', match:{property:'$form.'+propKey, status:'active'}, patch:{status:'converted'}}}];
    else if(s.effect==='custom' && s.raw_effects) o.effects=s.raw_effects;
    return o; });
  const ful={};
  if(B.fees_on && B.fee_service) ful.fee_service=B.fee_service;
  if(B.fees_on && B.payment==='before_submit') ful.payment='before_submit';
  const docs=DOCS.filter(d=>d.type).map(d=>{ const v=String(d.when_values||'').split(',').map(x=>slug(x)).filter(Boolean);
    return {type:d.type, when: d.when_field&&v.length ? {[d.when_field]: v.length===1?v[0]:v} : {}}; });
  if(docs.length) ful.documents=docs;
  if(Object.keys(sla).length) ful.sla_hours=sla;
  if(B.escalate_to) ful.escalate_to=B.escalate_to;
  ful.workflow=wf;
  const body={tenant:ME.tenant, service_id:slug(B.service_id), domain:B.domain, title:B.title, description:B.description,
    interaction:['search'].concat(B.fees_on?['select']:[],['init','status']), jurisdiction:B.jurisdiction, audience:B.audience||'civic.resident',
    solution:SOLUTION, required_credentials:[...REQCREDS], scope_map, fulfillment:ful,
    request_schema:{type:'object', required:req, properties:props, 'x-order':order}};
  if(B.entitlement && B.entitlement!=='residence') body.entitlement=B.entitlement;
  if(B.fees_on) body.fee_ref='urban.fee_schedule';
  if(Object.keys(sla).length) body.sla_ref=Object.entries(sla).map(([k,v])=>k+' '+v+'h').join(', ');
  return body;
}
function applyState(st){ B=st.B; FIELDS=st.FIELDS; STEPS=st.STEPS; DOCS=st.DOCS; REQCREDS=new Set(st.REQCREDS); }

// ================= the EDITOR (UI over the model) =================
async function boot(){
  try{ ME=await get('/session'); }catch(e){ ME={}; }
  document.getElementById('scope').textContent='· '+(ME.tenant||'');
  try{ ROLES=((await get('/bridge/catalog?kind=roles')).roles||[]).map(r=>r.role).filter(Boolean).sort(); }catch(e){}
  try{ CTYPES=((await get('/bridge/catalog?kind=credential-types')).credential_types||[]); }catch(e){}
  try{ DOMAINS=((await get('/bridge/catalog?kind=domains')).domains||[]).map(d=>d.domain||d).filter(Boolean); }catch(e){}
  try{ CITIES=((await api('/bridge/jurisdictions',{})).jurisdictions||[]); }catch(e){}
  try{ AREAS=((await get('/bridge/catalog?kind=areas')).areas||[]); }catch(e){}
  try{ UNITS=((await get('/bridge/catalog?kind=org_units')).org_units||[]); }catch(e){}
  try{ DOCTYPES=((await api('/bridge/query',{app_id:APP,schema:'urban.document_type'})).results||[]).map(x=>x.object||x).sort((a,b)=>String(a.name).localeCompare(b.name)); }catch(e){}
  await loadFees();
  // where this department may offer services: ITS OWN jurisdiction (the network tenant record) and the places within it
  AJUR = CITIES.find(j=>j.code===ME.tenant_jurisdiction) || CITIES.find(j=>j.tenant===ME.tenant) || null;
  const inScope=j=>{ let c=j, seen=new Set(); while(c && !seen.has(c.code)){ if(AJUR && c.code===AJUR.code) return true; seen.add(c.code); c=CITIES.find(x=>x.code===c.parent); } return false; };
  ALLOWED = AJUR ? CITIES.filter(inScope).sort((x,y)=>(x.code===AJUR.code?-1:0)-(y.code===AJUR.code?-1:0)) : [];
  await loadNav(); newSvc();
}
async function loadFees(){ try{ FEEROWS=((await api('/bridge/query',{app_id:APP,schema:'urban.fee_schedule'})).results||[]).map(x=>x.object||x); }catch(e){ FEEROWS=[]; } }
async function loadNav(){
  try{ const d=await api('/bridge/service-offerings',{}); ALLSVCS=d.offerings||[]; SVCS=ALLSVCS.filter(o=>o.tenant===ME.tenant); }catch(e){ SVCS=[]; }
  document.getElementById('nav').innerHTML = SVCS.length ? SVCS.map((o,i)=>
    `<div class="navi ${SEL===o.service_id?'on':''}" onclick="loadSvc(${i})"><div>${esc(o.title||o.service_id)}</div>
       <div class="s">${esc(o.status||'')} · ${((o.fulfillment||{}).workflow||[]).length} steps${o.fee_ref?' · fee':''}</div></div>`).join('')
    : '<div class="muted" style="padding:10px">No services yet.</div>';
}
function newSvc(){ SEL=null; ORIG=null; TESTED=null; PV={}; PVLOOK=null; const st=blankState(); st.B.jurisdiction=AJUR?AJUR.code:'';
  st.B.domain=DOMAINS.includes('urban')?'urban':(DOMAINS[0]||'urban'); st.STEPS[0].role=ROLES.find(r=>r.startsWith('urban.'))||ROLES[0]||'';
  applyState(st); TAB='basics'; renderEditor(); loadNav(); }
function pickFamily(){                                   // start blank, or from one of the service families (templates)
  document.getElementById('sheet').innerHTML=`<h3>New service</h3><div class="hint">Start from a family — a complete, working pattern you then adapt — or from a blank form.</div>
    ${Object.entries(FAMILIES).map(([k,f])=>`<div class="chk" style="display:block;cursor:pointer" onclick="fromFamily('${k}')"><b>${esc(f.label)}</b><div class="hint">${esc(f.about)}</div></div>`).join('')}
    <div class="chk" style="display:block;cursor:pointer" onclick="document.getElementById('modal').classList.remove('open');newSvc()"><b>Blank service</b><div class="hint">Build every part yourself (or describe it to the AI Expert).</div></div>`;
  document.getElementById('modal').classList.add('open');
}
function fromFamily(k){
  document.getElementById('modal').classList.remove('open');
  const f=FAMILIES[k], o=JSON.parse(JSON.stringify(f.offering));
  newSvc();
  const st=parseOffering({...o, tenant:ME.tenant, service_id:(ME.tenant?ME.tenant+'-':'')+slug(o.title), jurisdiction:AJUR?AJUR.code:'', title:o.title, audience:'civic.resident'});
  applyState(st); TAB='basics'; renderEditor();
}
function loadSvc(i){ const o=SVCS[i]; SEL=o.service_id; ORIG=o; TESTED=null; PV={}; PVLOOK=null; applyState(parseOffering(o)); TAB='basics'; renderEditor(); loadNav(); }

const opt=(list,sel,lab)=>list.map(x=>{ const v=Array.isArray(x)?x[0]:x, l=Array.isArray(x)?x[1]:(lab?lab(x):x); return `<option value="${esc(v)}"${v===sel?' selected':''}>${esc(l)}</option>`; }).join('');
const roleOpts=sel=>opt(ROLES,sel,r=>r.replace(/^urban\./,'').replace(/-/g,' ').replace(/\b\w/g,c=>c.toUpperCase())+' ('+r+')');
const choiceFields=()=>FIELDS.filter(f=>f.type==='choice'&&(f.key||f.label)).map(f=>[f.key||skey(f.label), f.label||f.key]);
const textFields=()=>FIELDS.filter(f=>['text'].includes(f.type)&&(f.key||f.label)).map(f=>[f.key||skey(f.label), f.label||f.key]);
const hasProperty=()=>FIELDS.some(f=>f.type==='property');
const feeCode=()=>B.fee_service || slug(B.service_id);
const myFeeRows=()=>FEEROWS.filter(r=>r.service===feeCode());

function renderEditor(){
  const n={form:FIELDS.filter(f=>f.key||f.label).length, docs:DOCS.length, fees:B.fees_on?myFeeRows().length:0, wf:STEPS.filter(s=>s.role).length};
  const T=[['basics','Basics',''],['form','Form',n.form],['docs','Documents',n.docs],['fees','Fees & payment',B.fees_on?n.fees+' rules':'off'],['wf','Workflow',n.wf+' steps'],['test','Preview & test',isTested()?'✓ tested':'not tested'],['review','Review & publish','']];
  document.getElementById('edit').innerHTML = `<div class="tabs">${T.map(([k,l,c])=>`<button class="${TAB===k?'on':''}" onclick="TAB='${k}';renderEditor()">${l}${c!==''?`<span class="n">${esc(c)}</span>`:''}</button>`).join('')}</div>
    <div id="pane"></div>`;
  ({basics:paneBasics, form:paneForm, docs:paneDocs, fees:paneFees, wf:paneWf, test:paneTest, review:paneReview})[TAB]();
}
function paneBasics(){
  const taken = slug(B.service_id) && ALLSVCS.some(o=>o.service_id===slug(B.service_id) && o.tenant!==ME.tenant);
  document.getElementById('pane').innerHTML = `<div class="card"><h3>Service</h3>
    <div class="grid"><div><label>Title shown to citizens</label><input value="${esc(B.title)}" placeholder="Lease deed" oninput="B.title=this.value;if(!SEL&&!B._sidTouched){B.service_id=(ME.tenant?ME.tenant+'-':'')+slug(this.value);document.getElementById('sid').value=B.service_id;}"></div>
      <div><label>Service id <span class="muted">(unique across the network)</span></label><input id="sid" value="${esc(B.service_id)}" ${SEL?'disabled':''} oninput="B.service_id=this.value;B._sidTouched=true">
        ${taken?'<div class="hint warn">⚠ another department already uses this id — choose another</div>':''}</div></div>
    <label>What it is, in one or two sentences</label><textarea rows="3" oninput="B.description=this.value">${esc(B.description)}</textarea>
    <div class="grid"><div><label>Who can apply <span class="muted">(governed role)</span></label><select onchange="B.audience=this.value">${opt(ROLES,B.audience)}</select></div>
      <div><label>Where it is offered</label>${!ALLOWED.length
          ? '<div class="hint warn" style="padding:8px 0">⚠ Your department has no jurisdiction on the network — ask the network steward to set it.</div>'
          : ALLOWED.length===1 ? `<div style="padding:8px 0">📍 <b>${esc(ALLOWED[0].name)}</b> <span class="muted">— your department's jurisdiction</span></div>`
          : `<select onchange="B.jurisdiction=this.value">${opt(ALLOWED.map(j=>[j.code,j.name+(j.code===AJUR.code?' — all of it':' only')]),B.jurisdiction)}</select>
             <div class="hint">Your department serves ${esc(AJUR.name)}; you can offer a service there or in one place within it.</div>`}</div></div>
    <div class="grid"><div><label>Domain</label><select onchange="B.domain=this.value">${opt(DOMAINS.length?DOMAINS:['urban'],B.domain)}</select></div><div></div></div></div>`;
}

function feeCalc(rows, f){            // mirrors the department's fee calculator (staging patch 8) for the Studio's "try it"
  const num=v=>v===''||v==null||isNaN(+v)?null:+v; const area=num(f.area_sqm), items=[];
  for(const r of rows){ const c=r.conditions||{};
    if(c.land_use && c.land_use!==f.land_use) continue; if(c.category && c.category!==f.category) continue;
    if(c.zone && String(c.zone).split('/').pop()!==String(f.zone||'').split('/').pop()) continue;
    if(c.min_area_sqm!=null && (area==null||area<c.min_area_sqm)) continue; if(c.max_area_sqm!=null && (area==null||area>c.max_area_sqm)) continue;
    const rate=r.rate||0; let amt=null;
    if(r.basis==='flat') amt=rate; else if(r.basis==='per_sqm') amt=area==null?null:rate*area; else if(r.basis==='percent_of_value') amt=num(f.value)==null?null:rate*num(f.value)/100;
    else if(r.basis==='per_unit') amt=rate*(num(f.units)||1); else if(r.basis==='slab'){ const sl=(r.slabs||[]).find(x=>x.upto==null||(area||0)<=x.upto); amt=sl?sl.rate:null; }
    items.push([r.fee_head, amt]); }
  return items;
}

  if(B.fees_on){ const facts={area_sqm:PVLOOK&&PVLOOK.area_sqm, land_use:PVLOOK&&PVLOOK.land_use, zone:PVLOOK&&PVLOOK.zone, value:PV.declared_value||PV.value, units:PV.units||PV.days};
    const items=feeCalc(myFeeRows(),facts), tot=items.reduce((a,[,v])=>a+(v||0),0);
    line(items.length>0 && items.every(([,v])=>v!=null), items.length?'Fee ₹'+Math.round(tot).toLocaleString('en-IN')+' — '+items.map(([h,v])=>esc(h)+(v==null?' (cannot compute)':' ₹'+Math.round(v).toLocaleString('en-IN'))).join(', ')+(B.payment==='before_submit'?' · paid before submitting':''):'No fee rule applies to this application', false); }
  // 3. routing, officers, due times
  if(!GRANTS) GRANTS=await q('governance.role_grant',{});
  const zone=PVLOOK&&PVLOOK.zone; let t=Date.now();
  for(const st of b.fulfillment.workflow){
    const holders=GRANTS.filter(g=>g.role===st.role && !g.revoked && (!st.office_by || !g.scope || !g.scope.area || (zone && areaChain(zone).includes(g.scope.area))));
    const sla=(b.fulfillment.sla_hours||{})[st.step]; if(sla) t+=sla*3600e3;
    const office=st.office_by&&zone?(UNITS.find(u=>u.area===zone)||{}).name||PVLOOK.zone_name:'';
    line(holders.length>0, `<b>${esc(tcase(st.step))}</b> → ${esc(st.role)}${office?' at <b>'+esc(office)+'</b>':''}: ${holders.length?holders.map(g=>esc(String(g.subject).split('/').pop())).join(', '):'<b>no officer holds this role'+(st.office_by?' for this zone':'')+'</b> — post one in Org Setup'}${sla?' · due by '+new Date(t).toLocaleString('en-IN',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}):''}`, false);
    // 4. what approval would change (department's real records — read only)
    for(const e of (st.effects||[])){ const c=e.close, w=e.write;
      const val=v=>typeof v==='string'&&v.startsWith('$form.')?(props[v.slice(6)]&&props[v.slice(6)]['x-lookup']?(PVLOOK&&PVLOOK.property):PV[v.slice(6)]):v;
      if(c){ const match=Object.fromEntries(Object.entries(c.match||{}).map(([k,v])=>[k,val(v)]));
        if(Object.values(match).some(v=>!v)){ line(null,`On approval: would update ${esc(c.schema)} — needs the test answers`); continue; }
        const recs=(await q(c.schema,match)).filter(r=>!r.until);
        line(true,`On approval: ${recs.length?recs.map(r=>esc(c.schema.split('.').pop())+' '+esc(r.holder_name||r.property_id||r.deed_no||String(r.id).split('/').pop())+(c.patch.tenure?' tenure '+esc(r.tenure)+' → '+esc(c.patch.tenure):'')+(c.patch.status?' '+esc(r.status)+' → '+esc(c.patch.status):'')+(c.patch.until?' closed':'')).join('; '):'no matching '+esc(c.schema)+' record'}`); }
      if(w){ line(true,`On approval: creates ${esc(w.schema.split('.').pop())} — ${esc(val(w.holder_name)||'(name from the form)')}${w.relation?' as '+esc(w.relation):''}`); } }
    if(st.issues) line(true,`On approval: issues <b>${esc(ctitle(st.issues))}</b> to the applicant's wallet, with: ${esc(Object.keys(PV).filter(k=>PV[k]).concat(PVLOOK?['property_id','address','zone']:[]).join(', '))}`);
  }
  out.innerHTML=rows.join('')+(blocking?'<div class="err" style="margin-top:8px">Fix the ✗ items and run again.</div>':'<div class="ok" style="margin-top:8px">✓ Test passed — you can publish from Review &amp; publish.</div>');
  if(!blocking){ TESTED=defHash(); const tb=[...document.querySelectorAll('.tabs button')].find(x=>x.textContent.startsWith('Preview')); if(tb) tb.innerHTML='Preview & test<span class="n">✓ tested</span>'; }
}

async function publish(){
  const btn=document.getElementById('pub'), out=document.getElementById('pubOut'); btn.disabled=true; out.textContent=' Publishing…';
  const b=buildBody(); const r=await api('/bridge/service-offering-save', b);
  btn.disabled=false;
  if(r.published){ SEL=b.service_id; await loadNav(); ORIG=SVCS.find(o=>o.service_id===SEL)||null; out.innerHTML=' <span class="ok">✓ Published — citizens can find it in My Services.</span>'; }
  else out.innerHTML=' <span class="err">✗ '+esc(typeof r.detail==='string'?r.detail:JSON.stringify(r.detail||r.error||'failed'))+'</span>';
}
function applySpec(s){                              // the AI expert's proposal (v2 offering shape) → the editor, via the round-trip parser
  const keepId = SEL ? B.service_id : (ME.tenant?ME.tenant+'-':'')+slug(s.service_id||s.title||'service').replace(new RegExp('^'+(ME.tenant||'')+'-'),'');
  const st = parseOffering({...s, service_id:keepId, jurisdiction:B.jurisdiction||(AJUR?AJUR.code:''), audience:B.audience||s.audience||'civic.resident', domain:s.domain||B.domain});
  if(!st.B.title) st.B.title=B.title; if(!st.B.description) st.B.description=B.description;
  st.STEPS.forEach(x=>{ if(!x.role) x.role=''; });
  applyState(st); TAB='form'; renderEditor();
}

function toggleAI(){ document.getElementById('right').classList.toggle('collapsed'); }

// ---- Service AI Expert ----
function pushMsg(who,text){ const c=document.getElementById('chat'); const d=document.createElement('div'); d.className='msg '+(who==='user'?'u':''); d.innerHTML='<span class="bub">'+esc(text)+'</span>'; c.appendChild(d); c.scrollTop=c.scrollHeight; return d; }
async function ask(){
  const inp=document.getElementById('ai'), msg=inp.value.trim(); if(!msg)return; inp.value='';
  if(document.getElementById('right').classList.contains('collapsed')) toggleAI();
  pushMsg('user',msg); HIST.push({role:'user',text:msg});
  const wait=pushMsg('ai','…designing the service — this can take up to a minute');
  const fee_codes={}; FEEROWS.forEach(r=>{ (fee_codes[r.service]=fee_codes[r.service]||[]).push(r.fee_head+(r.rate!=null?' (₹'+r.rate+(r.basis==='per_sqm'?'/sq m':'')+')':'')); });
  const vocab={document_types:DOCTYPES.map(d=>({code:d.code,name:d.name})), fee_codes};
  let r; try{ r=await api('/bridge/service-expert',{message:msg,history:HIST,spec:buildBody(),vocab}); }catch(e){ r={reply:'model error'}; }
  wait.remove();
  pushMsg('ai', r.reply || ('⚠ The AI Expert could not answer: '+(r.error||r.detail||'no reply')+' — please try again.')); HIST.push({role:'assistant',text:r.reply||''});
  if((r.notes||[]).length) pushMsg('ai', '⚠ Please check:\n• '+r.notes.join('\n• '));
  if(r.spec && Object.keys(r.spec).length){ const d=document.getElementById('chat'); const b=document.createElement('div'); b.className='msg';
    b.innerHTML='<button class="btn sm" style="margin:4px 0">✨ Apply to editor</button>'; b.querySelector('button').onclick=()=>applySpec(r.spec);
    d.appendChild(b); d.scrollTop=d.scrollHeight; }
  (r.new_credential_types||[]).forEach(ct=>{ const d=document.getElementById('chat'); const b=document.createElement('div'); b.className='msg';
    b.innerHTML=`<div class="bub">📄 New credential type suggested: <b>${esc(ct.title||ct.type)}</b> (needs network approval)<br><button class="btn ghost sm" style="margin-top:6px">Propose to network</button></div>`;
    b.querySelector('button').onclick=()=>proposeCred(ct); d.appendChild(b); d.scrollTop=d.scrollHeight; });
}
async function proposeCred(ct){
  const type=ct.type&&ct.type.startsWith('credential.')?ct.type:('credential.'+skey(ct.type||ct.title));
  const props={}, req=[]; (ct.claims||[]).forEach(f=>{ const k=skey(f); if(k){ props[k]={type:'string'}; req.push(k); } });
  const defn={'x-kind':'fragment',type:'object',additionalProperties:false,required:req.length?req:undefined,properties:props};
  const r=await api('/bridge/schema-request',{schema_id:type,version:'0.1.0',definition:defn,kind:'fragment',justification:'Proposed via Service Studio: '+(ct.title||type)});
  pushMsg('ai', r.filed ? ('✓ Proposed '+type+' — '+(r.note||'pending network approval')) : ('✗ '+(r.detail||r.error||'could not propose')));
}
if(typeof document!=='undefined') boot();
</script>
