# Slides — the Airawat Workspace presentation app (kind=app). PART OF THE BASE OS PRODUCTIVITY SUITE.
# Personal + AI-native: each user has their own decks, stored as governed doc.deck facts (ordered slides;
# bitemporal → version history). Slide rail + per-slide editor + Present mode; the inline ✨AI drafts a whole
# deck from a topic via the shared /bridge/ai-assist (Kimi K3). `personal: true` = self-service + owner-scoped.
component_id: ds:airawatdeveloper:app/slides
kind: app
version: 0.2.0   # 0.2.0: the shared workspace layout (/shared/workspace.css + .js, same frame as Files and Data): left — search, ＋ New, My … / Recent, the list; main — title, save status, actions, the editor; right — Info and History (Docs: also the AI assistant); breadcrumb under the shell's controls; the old header (with a wrong 'not signed in' badge) removed. Was 0.1.0.
provider: ds:airawatdeveloper:developer
display_name: Slides
icon: 🖼️
entrypoint: index.html
bundle: dist
sandboxed: true
personal: true
required_schemas: [doc.deck]
writes: [doc.deck]
roles: []

default_install: true   # part of the base-OS default suite every tenant receives
# ADR-0081: this app's App-Agent tools — the personal agent discovers + delegates to these
agent_tools:
  - {name: create_slides, kind: write, params: "title,brief", desc: Draft and create a slide deck}
