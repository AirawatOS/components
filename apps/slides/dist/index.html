<!doctype html><meta charset="utf-8"><title>Slides</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{--bg:#0d1117;--panel:#161b22;--panel2:#0f141a;--line:#21262d;--txt:#e6edf3;--dim:#8b949e;--accent:#7c5cff;--accent2:#2f81f7;--good:#3fb950;--warn:#d29922;--err:#f85149;--slidebg:#f7f6f3;--slideink:#1a1a1a}
  *{box-sizing:border-box} html,body{height:100%;margin:0}
  body{background:var(--bg);color:var(--txt);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;overflow:hidden}
  .hbar{display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--line);flex:0 0 auto}
  .brand{font-weight:700;display:flex;align-items:center;gap:7px} .brand .logo{width:22px;height:22px;border-radius:6px;background:linear-gradient(135deg,var(--warn),var(--err));display:grid;place-items:center;font-size:13px}
  .titlein{flex:1;background:transparent;border:0;color:var(--txt);font:600 15px/1.4 inherit;padding:6px 8px;border-radius:8px} .titlein:hover,.titlein:focus{background:var(--bg);outline:none}
  .status{font-size:12px;color:var(--dim);min-width:80px;text-align:right} .status.saving{color:var(--warn)} .status.saved{color:var(--good)}
  .body{flex:1;display:flex;min-height:0}
  .side{width:210px;background:var(--panel2);border-right:1px solid var(--line);display:flex;flex-direction:column;flex:0 0 auto}
  .side .top{padding:9px 10px;display:flex;gap:6px;border-bottom:1px solid var(--line)} .side .top b{flex:1;align-self:center}
  .list{flex:1;overflow:auto;padding:6px} .item{padding:8px 9px;border-radius:8px;cursor:pointer;border:1px solid transparent}
  .item:hover{background:#1b222c} .item.on{background:#1b2430;border-color:#2b3a55} .item .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis} .item .m{font-size:11px;color:var(--dim)}
  .center{flex:1;display:flex;flex-direction:column;min-width:0}
  .toolbar{display:flex;gap:8px;align-items:center;padding:6px 12px;border-bottom:1px solid var(--line);background:var(--panel)}
  .btn{background:#21262d;color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:6px 11px;font:inherit;cursor:pointer} .btn.primary{background:var(--accent2);border-color:var(--accent2);color:#fff}
  .aiBtn{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border:0;border-radius:8px;padding:6px 12px;font:600 13px/1 inherit;cursor:pointer} .present{background:var(--good);border-color:var(--good);color:#04250f}
  .work{flex:1;display:flex;min-height:0}
  .rail{width:150px;overflow:auto;border-right:1px solid var(--line);background:var(--panel2);padding:8px;flex:0 0 auto}
  .thumb{border:1px solid var(--line);border-radius:6px;background:var(--slidebg);color:var(--slideink);aspect-ratio:16/9;padding:7px;margin-bottom:8px;cursor:pointer;overflow:hidden;position:relative}
  .thumb.on{outline:2px solid var(--accent2)} .thumb .n{position:absolute;top:2px;left:4px;font-size:9px;color:#999} .thumb .tt{font-weight:700;font-size:9px;margin-top:8px;line-height:1.15;overflow:hidden}
  .thumb .del{position:absolute;top:2px;right:3px;color:#b33;font-size:11px;cursor:pointer;display:none} .thumb:hover .del{display:block}
  .addslide{width:100%;border:1px dashed var(--line);background:transparent;color:var(--dim);border-radius:6px;padding:6px;cursor:pointer}
  .editor{flex:1;overflow:auto;padding:22px;display:flex;justify-content:center}
  .canvas{width:100%;max-width:820px}
  .slideedit{background:var(--slidebg);color:var(--slideink);border-radius:10px;aspect-ratio:16/9;padding:44px 52px;box-shadow:0 10px 30px rgba(0,0,0,.35);display:flex;flex-direction:column}
  .slideedit input.st{border:0;background:transparent;font:800 30px/1.2 inherit;color:var(--slideink);width:100%;outline:none;margin-bottom:14px}
  .slideedit textarea.sb{border:0;background:transparent;font:400 19px/1.6 inherit;color:#222;width:100%;flex:1;outline:none;resize:none}
  .notes{max-width:820px;margin:12px auto 0;width:100%} .notes textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;color:var(--txt);padding:8px 10px;font:inherit;resize:vertical;min-height:44px}
  .notes .lbl{font-size:11px;color:var(--dim);margin:6px 2px 3px}
  .welcome{flex:1;display:grid;place-items:center;color:var(--dim);text-align:center;padding:30px}
  /* present */
  .present-ov{position:fixed;inset:0;background:#0a0a0a;z-index:80;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .stage{width:min(94vw,1200px);aspect-ratio:16/9;background:var(--slidebg);color:var(--slideink);border-radius:10px;padding:6vh 6vw;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.6)}
  .stage h1{font-size:min(6vw,58px);margin:0 0 3vh} .stage ul{font-size:min(3.4vw,32px);line-height:1.5;margin:0;padding-left:1.2em} .stage li{margin:.4em 0}
  .pbar{position:fixed;bottom:16px;display:flex;gap:16px;align-items:center;color:#aaa;font-size:13px}
  .pbar .ic{cursor:pointer;color:#ddd;border:1px solid #333;border-radius:8px;padding:5px 10px} .pbar .ic:hover{background:#1c1c1c}
  .modal{position:fixed;inset:0;background:rgba(4,7,12,.6);display:flex;align-items:center;justify-content:center;z-index:60}
  .sheet{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;width:480px;max-width:92vw}
  .in{width:100%;background:var(--bg);color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:9px 10px;font:inherit;margin-top:6px} textarea.in{resize:vertical;min-height:70px}
  .sub{color:var(--dim);font-size:12px} .spin{display:inline-block;width:12px;height:12px;border:2px solid #ffffff55;border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px} @keyframes sp{to{transform:rotate(360deg)}}
  .ic{cursor:pointer;color:var(--dim);border:1px solid var(--line);border-radius:8px;padding:5px 9px;background:var(--bg)} .ic:hover{color:var(--txt)}
</style>
<div class="hbar">
  <span class="brand"><span class="logo">📽️</span>Slides</span>
  <input class="titlein" id="title" placeholder="Untitled presentation" autocomplete="off">
  <span class="status" id="status"></span>
  <span class="ic" id="delBtn" title="Move to trash">🗑</span>
</div>
<div class="body">
  <div class="side">
    <div class="top"><b>Presentations</b><button class="btn primary" id="newBtn" title="New">＋</button></div>
    <div class="list" id="list"></div>
  </div>
  <div class="center">
    <div class="toolbar">
      <button class="aiBtn" id="aiBtn">✨ Generate deck</button>
      <span style="flex:1"></span>
      <span class="sub" id="counter"></span>
      <button class="btn present" id="presentBtn">▶ Present</button>
    </div>
    <div class="work" id="work"><div class="welcome" id="welcome">Create a deck with ＋, or ✨ generate one from a topic.</div></div>
  </div>
</div>
<script>
const $=id=>document.getElementById(id);
const esc=s=>(s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let ME='',TENANT='',DECKS=[],CUR=null,slides=[],idx=0,savet=null;
async function api(p,b){return fetch(p,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)}).then(r=>r.json());}
async function boot(){
  try{const s=await fetch('/session').then(r=>r.json());ME=s.sub||'';TENANT=s.tenant||'';}catch(e){}
  await load(); $('newBtn').onclick=newDeck; $('delBtn').onclick=trash;
  $('title').oninput=()=>{if(CUR){CUR.title=$('title').value;schedule();renderList();}};
  $('aiBtn').onclick=aiDeck; $('presentBtn').onclick=present;
  if(DECKS.length)open(DECKS[0].id); else newDeck();
}
async function load(){const r=await api('/bridge/query',{app_id:'slides',schema:'doc.deck'});
  DECKS=(r.results||[]).map(x=>x.object||x).filter(d=>!d.archived);
  DECKS.sort((a,b)=>(b.updated_at||'').localeCompare(a.updated_at||''));renderList();}
function renderList(){const L=$('list');
  if(!DECKS.length){L.innerHTML='<div class="sub" style="padding:16px;text-align:center">No presentations yet.</div>';return;}
  L.innerHTML=DECKS.map(d=>`<div class="item ${CUR&&d.id===CUR.id?'on':''}" data-id="${esc(d.id)}"><div class="t">${esc(d.title||'Untitled')}</div><div class="m">${(d.slides||[]).length} slides</div></div>`).join('');
  L.querySelectorAll('[data-id]').forEach(el=>el.onclick=()=>open(el.dataset.id));}
function blankSlide(){return{title:'',bullets:[''],notes:''};}
function newDeck(){const id='ds:'+TENANT+':doc/deck/'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
  const now=new Date().toISOString();CUR={schema:'doc.deck',id,title:'',owner:ME,slides:[{title:'Title slide',bullets:['Subtitle or author'],notes:''}],created_at:now,updated_at:now};
  DECKS.unshift(CUR);slides=CUR.slides;idx=0;paint();renderList();setTimeout(()=>$('title').focus(),30);}
function open(id){const d=DECKS.find(x=>x.id===id);if(!d)return;CUR=d;slides=(d.slides&&d.slides.length?d.slides:[blankSlide()]).map(s=>({title:s.title||'',bullets:(s.bullets||[]).slice(),notes:s.notes||''}));idx=0;paint();renderList();}
function paint(){$('title').value=CUR.title||'';renderWork();setStatus(CUR._saved?'saved':'');}
function setStatus(s){const el=$('status');el.className='status'+(s==='saving'?' saving':s==='saved'?' saved':'');el.textContent=s==='saving'?'Saving…':s==='saved'?'Saved ✓':'';el.style.color='';}
function schedule(){setStatus('saving');clearTimeout(savet);savet=setTimeout(save,900);}
async function save(){if(!CUR)return;CUR.slides=slides;CUR.title=$('title').value;CUR.updated_at=new Date().toISOString();
  const obj=Object.assign({},CUR);delete obj._saved;const r=await api('/bridge/save',{app_id:'slides',object:obj});
  if(r.saved){CUR._saved=true;setStatus('saved');}else{setStatus('');$('status').textContent='⚠ '+(r.error||'save failed');$('status').style.color='var(--err)';}}
async function trash(){if(!CUR)return;if(!confirm('Trash "'+(CUR.title||'Untitled')+'"?'))return;
  CUR.archived=true;await api('/bridge/save',{app_id:'slides',object:Object.assign({},CUR,{slides,archived:true})});
  DECKS=DECKS.filter(d=>d.id!==CUR.id);CUR=null;if(DECKS.length)open(DECKS[0].id);else newDeck();}
function renderWork(){
  const W=$('work');
  W.innerHTML=`<div class="rail" id="rail"></div>
    <div class="editor"><div class="canvas">
      <div class="slideedit"><input class="st" id="st" placeholder="Slide title"><textarea class="sb" id="sb" placeholder="One bullet per line"></textarea></div>
      <div class="notes"><div class="lbl">Speaker notes</div><textarea id="notes" rows="2" placeholder="Notes for this slide (not shown when presenting)"></textarea></div>
    </div></div>`;
  renderRail();
  const s=slides[idx]||blankSlide();
  $('st').value=s.title||''; $('sb').value=(s.bullets||[]).join('\n'); $('notes').value=s.notes||'';
  $('st').oninput=()=>{slides[idx].title=$('st').value;schedule();renderRail();renderList();};
  $('sb').oninput=()=>{slides[idx].bullets=$('sb').value.split('\n');schedule();renderRail();};
  $('notes').oninput=()=>{slides[idx].notes=$('notes').value;schedule();};
  $('counter').textContent=slides.length+' slide'+(slides.length!==1?'s':'');
}
function renderRail(){const R=$('rail');if(!R)return;
  R.innerHTML=slides.map((s,i)=>`<div class="thumb ${i===idx?'on':''}" data-i="${i}"><span class="n">${i+1}</span><span class="del" data-del="${i}">✕</span><div class="tt">${esc(s.title||'Untitled')}</div></div>`).join('')
    +`<button class="addslide" id="addslide">＋ Add slide</button>`;
  R.querySelectorAll('[data-i]').forEach(el=>el.onclick=e=>{if(e.target.dataset.del!==undefined)return;idx=+el.dataset.i;renderWork();});
  R.querySelectorAll('[data-del]').forEach(el=>el.onclick=e=>{e.stopPropagation();const i=+el.dataset.del;if(slides.length<=1)return;slides.splice(i,1);if(idx>=slides.length)idx=slides.length-1;schedule();renderWork();renderList();});
  $('addslide').onclick=()=>{slides.splice(idx+1,0,blankSlide());idx++;schedule();renderWork();renderList();};
}
// ---- present ----
function present(){let p=idx;const ov=document.createElement('div');ov.className='present-ov';document.body.appendChild(ov);
  const draw=()=>{const s=slides[p]||{};const b=(s.bullets||[]).filter(x=>x.trim());
    ov.innerHTML=`<div class="stage"><h1>${esc(s.title||'')}</h1>${b.length?'<ul>'+b.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>':''}</div>
      <div class="pbar"><span class="ic" id="pprev">‹ Prev</span><span>${p+1} / ${slides.length}</span><span class="ic" id="pnext">Next ›</span><span class="ic" id="pexit">Esc ✕</span></div>`;
    ov.querySelector('#pprev').onclick=()=>{if(p>0){p--;draw();}};
    ov.querySelector('#pnext').onclick=()=>{if(p<slides.length-1){p++;draw();}};
    ov.querySelector('#pexit').onclick=close;};
  const key=e=>{if(e.key==='ArrowRight'||e.key===' '){if(p<slides.length-1){p++;draw();}}
    else if(e.key==='ArrowLeft'){if(p>0){p--;draw();}}else if(e.key==='Escape')close();};
  function close(){document.removeEventListener('keydown',key);ov.remove();idx=p;renderRail();}
  document.addEventListener('keydown',key);draw();
}
// ---- AI: topic → deck ----
function aiDeck(){const m=modal(`<h3>✨ Generate a deck with AI</h3>
    <div class="sub">Describe the presentation — the AI drafts the slides (replaces the current deck).</div>
    <textarea class="in" id="p" placeholder="e.g. A 6-slide briefing on the ward drainage upgrade programme for the city council"></textarea>
    <div style="text-align:right;margin-top:10px"><span class="sub" id="s"></span> <button class="btn" id="x">Cancel</button> <button class="btn primary" id="go">Generate</button></div>`);
  m.q('#x').onclick=m.close;
  m.q('#go').onclick=async()=>{const p=(m.q('#p').value||'').trim();if(!p)return;m.q('#s').innerHTML='<span class="spin"></span> drafting…';
    const prompt=p+"\n\nReturn a slide deck as plain text. Separate slides with a line containing only '---'. For each slide: the FIRST line is the slide title, then 3-5 bullet lines each starting with '- '. No commentary, no code fences.";
    let r={};try{r=await api('/bridge/ai-assist',{app_id:'slides',task:'draft',prompt,format:'plain'});}catch(e){}
    const txt=(r.content||'').trim();if(!txt){m.q('#s').textContent='⚠ no response';return;}
    const parsed=parseDeck(txt);if(!parsed.length){m.q('#s').textContent='⚠ could not parse';return;}
    slides=parsed;idx=0;if(!$('title').value)$('title').value=p.slice(0,60);if(CUR)CUR.title=$('title').value;schedule();renderWork();renderList();m.close();};
}
function parseDeck(txt){const blocks=txt.split(/\n\s*---+\s*\n/);const out=[];
  blocks.forEach(bl=>{const lines=bl.split('\n').map(l=>l.replace(/\r/,'')).filter(l=>l.trim()!=='');if(!lines.length)return;
    let title=lines[0].replace(/^#+\s*/,'').replace(/^slide\s*\d+[:.\-]\s*/i,'').trim();
    const bullets=lines.slice(1).map(l=>l.replace(/^[-*•]\s*/,'').trim()).filter(Boolean);
    out.push({title,bullets:bullets.length?bullets:[''],notes:''});});
  return out;}
function modal(html){const w=document.createElement('div');w.className='modal';w.innerHTML=`<div class="sheet">${html}</div>`;document.body.appendChild(w);w.onclick=e=>{if(e.target===w)w.remove();};return{q:s=>w.querySelector(s),close:()=>w.remove()};}
boot();
</script>
