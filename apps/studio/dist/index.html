<!doctype html><meta charset="utf-8"><title>Studio</title>
<style>
  :root{--bg:#0d1117;--card:#161b22;--line:#21262d;--ink:#e6edf3;--dim:#8b949e;--accent:#3b82f6}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  header{padding:14px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px}
  h1{margin:0;font-size:17px}
  .tabs{display:flex;gap:4px;margin-left:8px}
  .tab{padding:6px 14px;border:1px solid var(--line);border-radius:8px;cursor:pointer;color:var(--dim);font-size:13px}
  .tab.on{background:#1b2530;color:var(--ink);border-color:#2f3d4d}
  .who{margin-left:auto;color:var(--dim);font-size:12px}
  .wrap{max-width:820px;margin:0 auto;padding:18px 16px}
  .newbtn{border:1px solid var(--line);background:#1b2530;color:var(--ink);border-radius:8px;padding:7px 14px;font-size:13px;cursor:pointer;margin-bottom:14px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:12px}
  .card h3{margin:0 0 2px;font-size:14px} .cid{color:#5f6b78;font-size:11px;font-family:ui-monospace,Menlo,monospace;margin-bottom:10px;word-break:break-all}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:7px 0}
  label{color:var(--dim);font-size:12px;min-width:96px}
  input[type=text],textarea,select{background:#0d1117;border:1px solid var(--line);color:var(--ink);border-radius:7px;padding:6px 9px;font:13px ui-monospace,Menlo,monospace;flex:1;min-width:120px}
  textarea{width:100%;min-height:44px;resize:vertical}
  .sw{display:flex;align-items:center;gap:6px} .pill{border:1px solid var(--line);border-radius:999px;padding:1px 8px;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--dim)}
  .pill.on{color:#3fb950;border-color:#238636} .pill.off{color:#e5484d;border-color:#8b2c30}
  .steps{width:100%;border-collapse:collapse;margin:6px 0;font-size:12px}
  .steps th{color:var(--dim);text-align:left;font-weight:500;padding:4px 6px;border-bottom:1px solid var(--line)}
  .steps td{padding:3px 6px;border-bottom:1px solid #1a1f27} .steps input{font-size:12px;padding:4px 6px}
  .act{display:flex;gap:8px;margin-top:12px}
  .btn{border:1px solid var(--line);background:#21262d;color:var(--ink);border-radius:8px;padding:7px 14px;font-size:13px;cursor:pointer}
  .btn.primary{background:var(--accent);border-color:var(--accent)} .btn.mini{padding:3px 8px;font-size:12px}
  .toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#132a17;border:1px solid #238636;color:#3fb950;padding:9px 16px;border-radius:9px;font-size:13px;opacity:0;transition:opacity .2s}
  .toast.show{opacity:1} .toast.err{background:#3d1418;border-color:#8b2c30;color:#ff9b9b}
  .empty{color:var(--dim);text-align:center;padding:40px}
</style>
<header>
  <h1>🛠️ Studio</h1>
  <div class="tabs"><span class="tab on" data-t="subs">Triggers</span><span class="tab" data-t="wf">Workflows</span></div>
  <span class="who" id="who"></span>
</header>
<div class="wrap" id="wrap"><div class="empty">loading…</div></div>
<div class="toast" id="toast"></div>
<script>
let APPID, TAB='subs';
async function q(schema){const r=await fetch('/bridge/query',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({app_id:APPID,schema,filter:{}})});if(!r.ok)throw new Error('query '+r.status);return (await r.json()).results||[];}
async function save(object){const r=await fetch('/bridge/save',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({object})});const j=await r.json().catch(()=>({}));return {ok:r.ok,status:r.status,j};}
function toast(msg,err){const t=document.getElementById('toast');t.textContent=msg;t.className='toast show'+(err?' err':'');setTimeout(()=>t.className='toast',2200);}
function esc(s){return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

async function boot(){
  const cfg=await fetch('./config.json').then(r=>r.json()); APPID=cfg.app_id;
  fetch('/session').then(r=>r.json()).then(s=>{document.getElementById('who').textContent=s.authenticated?('● '+s.sub):'';});
  document.querySelectorAll('.tab').forEach(el=>el.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));el.classList.add('on');TAB=el.dataset.t;render();});
  render();
}
async function render(){ TAB==='subs'?renderSubs():renderWorkflows(); }

/* ---- TRIGGERS (platform.subscription) ---- */
async function renderSubs(){
  const w=document.getElementById('wrap'); w.innerHTML='<div class="empty">loading triggers…</div>';
  let subs; try{subs=await q('platform.subscription');}catch(e){w.innerHTML='<div class="empty">'+esc(e.message)+'</div>';return;}
  const nb=document.createElement('button'); nb.className='newbtn'; nb.textContent='+ New trigger';
  nb.onclick=()=>subCard({id:'ds:kmc:subscription/'+Date.now().toString(36),name:'',enabled:true,match:{subject_schema:'',where:{}},action:{kind:'http',url:''}},true);
  w.innerHTML=''; w.appendChild(nb);
  if(!subs.length) w.insertAdjacentHTML('beforeend','<div class="empty">No triggers yet.</div>');
  subs.forEach(s=>subCard(s,false));
}
function subCard(s,isNew){
  const w=document.getElementById('wrap'); const c=document.createElement('div'); c.className='card';
  const en=s.enabled!==false;
  c.innerHTML=`<h3>${esc(s.name||'(unnamed trigger)')} <span class="pill ${en?'on':'off'}" data-en>${en?'enabled':'disabled'}</span></h3>
    <div class="cid">${esc(s.id)}</div>
    <div class="row"><label>Name</label><input type="text" data-f="name" value="${esc(s.name||'')}"></div>
    <div class="row"><label>When schema</label><input type="text" data-f="ss" value="${esc((s.match||{}).subject_schema||'')}" placeholder="signal.alert"></div>
    <div class="row"><label>Where (JSON)</label><textarea data-f="where">${esc(JSON.stringify((s.match||{}).where||{}))}</textarea></div>
    <div class="row"><label>Then POST</label><input type="text" data-f="url" value="${esc((s.action||{}).url||'')}" placeholder="http://…/advise"></div>
    <div class="act">
      <button class="btn" data-toggle>${en?'Disable':'Enable'}</button>
      <button class="btn primary" data-save>Save</button>
    </div>`;
  let enabled=en;
  c.querySelector('[data-toggle]').onclick=()=>{enabled=!enabled;c.querySelector('[data-toggle]').textContent=enabled?'Disable':'Enable';const p=c.querySelector('[data-en]');p.textContent=enabled?'enabled':'disabled';p.className='pill '+(enabled?'on':'off');};
  c.querySelector('[data-save]').onclick=async()=>{
    let where; try{where=JSON.parse(c.querySelector('[data-f=where]').value||'{}');}catch(e){return toast('Where must be valid JSON',true);}
    const obj={schema:'platform.subscription',id:s.id,name:c.querySelector('[data-f=name]').value,enabled:enabled,
      match:{subject_schema:c.querySelector('[data-f=ss]').value,where},action:{kind:'http',url:c.querySelector('[data-f=url]').value}};
    const r=await save(obj); r.ok?toast('Saved — automation will reload'):toast(r.j.error||('save '+r.status),true);
  };
  isNew ? w.insertBefore(c,w.children[1]||null) : w.appendChild(c);
}

/* ---- WORKFLOWS (platform.workflow) ---- */
async function renderWorkflows(){
  const w=document.getElementById('wrap'); w.innerHTML='<div class="empty">loading workflows…</div>';
  let wfs; try{wfs=await q('platform.workflow');}catch(e){w.innerHTML='<div class="empty">'+esc(e.message)+'</div>';return;}
  const nb=document.createElement('button'); nb.className='newbtn'; nb.textContent='+ New workflow';
  nb.onclick=()=>wfCard({id:'ds:kmc:workflow/'+Date.now().toString(36),title:'',steps:[]},true);
  w.innerHTML=''; w.appendChild(nb);
  if(!wfs.length) w.insertAdjacentHTML('beforeend','<div class="empty">No workflows yet.</div>');
  wfs.forEach(x=>wfCard(x,false));
}
function wfCard(wf,isNew){
  const w=document.getElementById('wrap'); const c=document.createElement('div'); c.className='card';
  let steps=JSON.parse(JSON.stringify(wf.steps||[]));
  c.innerHTML=`<h3><input type="text" data-f="title" value="${esc(wf.title||'')}" placeholder="Workflow title" style="font-size:14px;font-weight:600"></h3>
    <div class="cid">${esc(wf.id)}</div><div data-tbl></div>
    <div class="act"><button class="btn mini" data-add>+ Step</button><button class="btn primary" data-save>Save</button></div>`;
  const tbl=c.querySelector('[data-tbl]');
  function drawTable(){
    tbl.innerHTML='<table class="steps"><tr><th>step_id</th><th>title</th><th>role</th><th>after (csv)</th><th></th></tr>'+
      steps.map((s,i)=>`<tr>
        <td><input type="text" data-s="${i}" data-k="step_id" value="${esc(s.step_id||'')}"></td>
        <td><input type="text" data-s="${i}" data-k="title" value="${esc(s.title||'')}"></td>
        <td><input type="text" data-s="${i}" data-k="assignee_role" value="${esc(s.assignee_role||'')}"></td>
        <td><input type="text" data-s="${i}" data-k="after" value="${esc((s.after||[]).join(','))}"></td>
        <td><button class="btn mini" data-del="${i}">✕</button></td></tr>`).join('')+'</table>';
    tbl.querySelectorAll('input[data-s]').forEach(inp=>inp.oninput=()=>{const i=+inp.dataset.s,k=inp.dataset.k;
      if(k==='after') steps[i][k]=inp.value.split(',').map(x=>x.trim()).filter(Boolean); else steps[i][k]=inp.value;});
    tbl.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{steps.splice(+b.dataset.del,1);drawTable();});
  }
  drawTable();
  c.querySelector('[data-add]').onclick=()=>{steps.push({step_id:'step'+(steps.length+1),title:'',verb:'fulfil',assignee_role:'',after:[]});drawTable();};
  c.querySelector('[data-save]').onclick=async()=>{
    const obj={schema:'platform.workflow',id:wf.id,title:c.querySelector('[data-f=title]').value,version:wf.version||'1.0',steps};
    const r=await save(obj); r.ok?toast('Workflow saved'):toast(r.j.error||('save '+r.status),true);
  };
  isNew ? w.insertBefore(c,w.children[1]||null) : w.appendChild(c);
}
boot();
</script>
