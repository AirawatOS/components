# Studio — the low-code configurator. Edits the DATA that drives the platform: platform.subscription
# (triggers/automations) and platform.workflow (SOP DAGs). No code — just declarations, saved to the
# registry via the host's admin-gated /bridge/save. Editing a subscription hot-reloads the automation.
component_id: ds:airawat:app/studio    # published by the platform developer (NOT a tenant) — apps are airawat-stewarded; tenant DATA it authors stays ds:<tenant>:…
kind: app
version: 0.1.2   # nav: layer-by-kind + clickable spec view + aligned tree; schema-request: complete x-kind envelope + editable AI proposal
provider: ds:airawat:developer
display_name: Studio
entrypoint: index.html
required_schemas: [studio.project, platform.subscription, platform.workflow]
sandboxed: true
system: true            # a platform dev tool: default-available (not a per-tenant install)…
developer_only: true    # …but INT-0004 §6 gates it to a user in a development tenant (a Developer participant)
