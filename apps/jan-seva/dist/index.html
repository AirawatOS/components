<style>
  :root{color-scheme:light dark}
  *{box-sizing:border-box}
  body{font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;margin:0;background:#0d1117;color:#e6edf3}
  header{padding:14px 20px;background:#161b22;border-bottom:1px solid #21262d;display:flex;align-items:center;gap:8px}
  header b{font-size:17px}
  .who{margin-left:auto;font-size:13px;color:#8b949e;text-align:right;line-height:1.35}
  .who a{color:#58a6ff;cursor:pointer;text-decoration:none}
  main{max-width:660px;margin:0 auto;padding:18px}
  .card{background:#161b22;border:1px solid #21262d;border-radius:12px;padding:16px;margin:12px 0}
  .btn{background:#3b82f6;color:#fff;border:0;border-radius:8px;padding:9px 15px;cursor:pointer;font-size:14px;font-weight:500}
  .btn:disabled{opacity:.5}
  .btn.ghost{background:#21262d;color:#e6edf3}
  input,textarea,select{width:100%;background:#0d1117;border:1px solid #30363d;color:#e6edf3;border-radius:8px;padding:10px;margin:6px 0;font:inherit}
  label{font-size:13px;color:#8b949e;display:block;margin-top:8px}
  .muted{color:#8b949e;font-size:13px}
  .pill{display:inline-block;background:#21262d;border-radius:999px;padding:2px 10px;font-size:12px;margin-left:6px}
  .svc{border-top:1px solid #21262d;padding:12px 0}.svc:first-child{border-top:0}
  .row{display:flex;gap:8px;align-items:center;justify-content:space-between}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .ok{color:#3fb950}.err{color:#f85149}
  .cred{border-radius:8px;padding:8px 10px;margin:6px 0;font-size:13px}
  .cred.ok{background:#12331f;color:#3fb950}.cred.err{background:#3a1518;color:#f85149}
  h3{margin:.2em 0}
</style>
<header><b>🏛️ Jan Seva</b> <span class="muted" style="font-weight:400">· Citizen Services</span>
  <span id="who" class="who"></span></header>
<main>
  <div id="gate"></div>
  <div id="app" style="display:none">
    <div class="card">
      <div class="row"><input id="q" placeholder="Search a service — e.g. complaint, water"/><button class="btn" id="go">Search</button></div>
      <div id="results" class="muted">Type a service and search — you'll see the services offered in <b id="cityname">your city</b>.</div>
    </div>
    <div id="detail"></div>
    <div class="card">
      <div class="row"><b>My requests</b><button class="btn ghost" id="refresh">Refresh</button></div>
      <div id="txns" class="muted" style="margin-top:8px">—</div>
    </div>
  </div>
</main>
<script>
const api = (p, b) => fetch(p, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(b||{})}).then(r=>r.json());
const esc = s => String(s==null?'':s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const APP = 'jan-seva';
let CATALOG = [], SEL = null, CITIES = [], PROFILE = null, ME = null;

// ---- boot: who am I? do I have a profile (where I live)? else show Join ----
async function boot(){
  try{ ME = await (await fetch('/session')).json(); }catch(e){ ME = {}; }
  try{ CITIES = ((await api('/bridge/jurisdictions',{})).jurisdictions||[]).filter(j=>j.kind==='city'); }catch(e){ CITIES=[]; }
  PROFILE = null;
  if(ME && ME.sub){ try{ PROFILE = (await api('/bridge/profile-get',{})).profile; }catch(e){} }
  if(ME && ME.sub && PROFILE) renderApp(); else renderJoin();
}
const cityName = code => (CITIES.find(c=>c.code===code)||{}).name || code;
const cityOptions = sel => CITIES.map(c=>`<option value="${esc(c.code)}"${c.code===sel?' selected':''}>${esc(c.name)}</option>`).join('');

// ---- Join: self-signup + set where you live ----
function renderJoin(){
  document.getElementById('who').textContent='';
  document.getElementById('app').style.display='none';
  document.getElementById('gate').innerHTML = `<div class="card">
    <h3>Join Jan Seva</h3>
    <div class="muted">Register once as a citizen. We'll show you the services offered where you live — and remember you if you move.</div>
    <label>Your name</label><input id="jn" placeholder="e.g. Asha Patil"/>
    <div class="grid2">
      <div><label>Pick a username</label><input id="ju" placeholder="e.g. asha.patil"/></div>
      <div><label>Contact (optional)</label><input id="jc" placeholder="email or phone"/></div>
    </div>
    <div class="grid2">
      <div><label>Where do you live?</label><select id="jr">${cityOptions()}</select></div>
      <div><label>Own property elsewhere? (optional)</label><select id="jp"><option value="">— none —</option>${cityOptions()}</select></div>
    </div>
    <button class="btn" id="joinBtn" style="margin-top:12px">Create my citizen account</button>
    <div id="joinOut" class="muted" style="margin-top:8px"></div></div>`;
  document.getElementById('joinBtn').onclick = doJoin;
}
async function doJoin(){
  const g=id=>document.getElementById(id), out=g('joinOut'), btn=g('joinBtn');
  const username=g('ju').value.trim(), name=g('jn').value.trim();
  if(!username||!name){ out.innerHTML='<span class="err">Name and username are required.</span>'; return; }
  btn.disabled=true; out.textContent='Creating your account…';
  const prop = g('jp').value ? [g('jp').value] : [];
  const r = await api('/bridge/citizen-register', {username, name, contact:g('jc').value.trim(), residence:[g('jr').value], property:prop});
  if(r.ok){ out.innerHTML='<span class="ok">✓ Welcome, '+esc(name)+'! Taking you to your home…</span>'; notifyShell();
    setTimeout(()=>{ try{ top.location='/'; }catch(e){ location.href='/'; } }, 700); }
  else { btn.disabled=false; out.innerHTML='<span class="err">✗ '+esc(r.detail||r.error||'could not register')+'</span>'; }
}

// ---- identity bar + "I moved" ----
function renderWho(){
  const home = PROFILE && PROFILE.primary ? cityName(PROFILE.primary) : '—';
  document.getElementById('who').innerHTML =
    `${esc((PROFILE&&PROFILE.name)||ME.sub)} · 📍 ${esc(home)} · <a onclick="moved()">I moved</a> · <a onclick="logout()">Sign out</a>`;
  document.getElementById('cityname').textContent = home;
}
function moved(){
  document.getElementById('detail').innerHTML = `<div class="card"><h3>Change your city</h3>
    <div class="muted">Your account, history and open requests stay — only which services you see will change.</div>
    <label>I now live in</label><select id="mv">${cityOptions(PROFILE&&PROFILE.primary)}</select>
    <button class="btn" id="mvBtn" style="margin-top:10px">Update</button>
    <div id="mvOut" class="muted" style="margin-top:8px"></div></div>`;
  document.getElementById('detail').scrollIntoView({behavior:'smooth'});
  document.getElementById('mvBtn').onclick = async ()=>{
    const city=document.getElementById('mv').value, out=document.getElementById('mvOut');
    out.textContent='Updating…';
    const keepProp = (PROFILE&&PROFILE.property)||[];
    const r = await api('/bridge/profile-save', {app_id:APP, name:(PROFILE&&PROFILE.name)||'', residence:[city], property:keepProp});
    if(r.profile){ out.innerHTML='<span class="ok">✓ Moved to '+esc(cityName(city))+'.</span>'; PROFILE.primary=city; PROFILE.residence=[city]; renderWho(); document.getElementById('detail').innerHTML=''; search(); }
    else out.innerHTML='<span class="err">✗ '+esc(r.error||'failed')+'</span>';
  };
}
async function logout(){ try{ await fetch('/logout',{method:'POST'}); }catch(e){} notifyShell(); boot(); }
// tell the outer run-shell to refresh its identity badge after a sign-in/out change inside the frame
function notifyShell(){ try{ parent.postMessage({type:'airawat-session'}, '*'); }catch(e){} }

function renderApp(){
  document.getElementById('gate').innerHTML='';
  document.getElementById('app').style.display='';
  renderWho();
  document.getElementById('go').onclick = search;
  document.getElementById('q').addEventListener('keydown', e=>{if(e.key==='Enter') search();});
  document.getElementById('refresh').onclick = track;
  search();   // browse: show ALL services available to this citizen on load (national + their city), no guessing
  track();
}

// ---- discover → file → track (jurisdiction-scoped by the citizen's profile) ----
async function search(){
  const r = await api('/bridge/service-search', {query: document.getElementById('q').value});
  CATALOG = (r.message || {}).catalog || [];
  const el = document.getElementById('results');
  el.innerHTML = CATALOG.length ? CATALOG.map((o,i)=>
    `<div class="svc"><div class="row"><div><b>${esc(o.title)}</b><span class="pill">${esc(o.domain)}</span><br>
       <span class="muted">${esc(o.description||'')}</span></div>
       <button class="btn ghost" onclick="pick(${i})">Open</button></div></div>`).join('')
    : '<span class="muted">No services offered in your city for that search.</span>';
}
const titleCase = s => String(s||'').replace(/[-_]/g,' ').replace(/\b\w/g,c=>c.toUpperCase());
let CREDMATCH = {};    // required credential type -> matched wallet VC id (reuse)
async function pick(i){
  SEL = CATALOG[i];
  const canQuote = (SEL.interaction||[]).includes('select');
  // render the intake form the agency AUTHORED (request_schema) — else a plain description box (backward compat)
  const rs = SEL.request_schema || {}; const props = rs.properties || {}; const req = rs.required || [];
  const keys = Object.keys(props);
  const form = keys.length ? keys.map(k=>{
      const p = props[k]||{}; const lbl = esc(p.title||k) + (req.includes(k) ? ' *' : '');
      const t = p.format==='date' ? 'date' : (p.type==='number' ? 'number' : 'text');
      return p['x-widget']==='textarea'
        ? `<label>${lbl}</label><textarea data-k="${esc(k)}" rows="3"></textarea>`
        : `<label>${lbl}</label><input data-k="${esc(k)}" type="${t}">`;
    }).join('')
    : `<label>Describe your request</label><textarea id="msg" rows="3" placeholder="e.g. garbage uncollected at ward 5 for 3 days"></textarea>`;
  // REUSE: required documents pulled from the citizen's wallet (no re-upload); block if a required VC is missing
  const rc = SEL.required_credentials || []; CREDMATCH = {}; let missing = false, credHtml = '';
  if(rc.length){
    let held = []; try{ held = (await api('/bridge/my-credentials',{})).held||[]; }catch(e){}
    credHtml = `<label>Required documents (reused from your wallet)</label>` + rc.map(t=>{
        const h = held.find(c=>c.type===t); if(h){ CREDMATCH[t]=h.vc; return `<div class="cred ok">✓ ${esc(h.title||titleCase(t))} — from your wallet</div>`; }
        missing = true; return `<div class="cred err">✗ ${esc(titleCase(t))} — accept it in My Documents first</div>`;
      }).join('');
  }
  document.getElementById('detail').innerHTML =
    `<div class="card"><h3>${esc(SEL.title)}</h3>
       <div class="muted">provided by <b>${esc(SEL.tenant)}</b> · steps: ${(SEL.interaction||[]).join(' → ')}</div>
       ${canQuote?'<button class="btn ghost" style="margin-top:8px" onclick="quote()">Get fee quote</button>':''}
       <div id="quote" class="muted"></div>
       ${credHtml}
       <div id="form">${form}</div>
       <button class="btn" id="submit" onclick="fileIt()"${missing?' disabled':''}>Consent &amp; Submit</button>
       ${missing?'<div class="err" style="font-size:13px;margin-top:6px">Get the missing document from its own service first — it will appear in My Documents, then you can reuse it here.</div>':''}
       <div id="out" class="muted" style="margin-top:8px"></div></div>`;
  document.getElementById('detail').scrollIntoView({behavior:'smooth'});
}
async function quote(){
  const r = await api('/bridge/service-route', {app_id:APP, action:'select', service_id:SEL.service_id});
  const q = (r.message||{}).quote;
  document.getElementById('quote').innerHTML = q && q.amount
    ? `Fee: <b>₹${q.amount} ${esc(q.currency)}</b> (${q.breakdown.map(b=>esc(b.item)+' ₹'+b.amount).join(', ')})`
    : 'No fee for this service.';
}
async function fileIt(){
  const out = document.getElementById('out'), btn = document.getElementById('submit');
  btn.disabled = true; out.textContent = 'Requesting your consent…';
  await api('/bridge/service-consent', {app_id:APP, service_id:SEL.service_id, provider:SEL.tenant, expires_at:'2027-01-01T00:00:00Z'});
  out.textContent = 'Submitting to ' + SEL.tenant + '…';
  // collect the authored form's values → {form, description}. description = a human summary for the officer's inbox.
  const form = {}; document.querySelectorAll('#form [data-k]').forEach(el=>{ if(el.value!=='') form[el.dataset.k]=el.value; });
  const legacy = document.getElementById('msg');
  const props = (SEL.request_schema||{}).properties||{};
  const description = legacy ? legacy.value : Object.entries(form).map(([k,v])=>((props[k]&&props[k].title)||k)+': '+v).join(' · ');
  const credential_refs = Object.values(CREDMATCH);   // reused wallet VCs the provider will verify
  const r = await api('/bridge/service-route', {app_id:APP, action:'init', service_id:SEL.service_id, message:{form, description, credential_refs}});
  const m = r.message || {};
  out.innerHTML = m.reference
    ? `<span class="ok">✓ Submitted.</span> Reference <b>${esc(m.reference)}</b> — ${esc(SEL.tenant)} has your request.`
    : `<span class="err">✗ ${esc(r.error||'could not submit')}</span>`;
  btn.disabled = false; track();
}
async function track(){
  const d = await api('/bridge/service-transactions', {});
  const t = (d.transactions || []).slice().reverse();
  document.getElementById('txns').innerHTML = t.length
    ? t.map(x=>`<div class="row" style="padding:4px 0"><span>${esc(x.service_id)}</span>
        <span><span class="pill">${esc(x.status)}</span> ${x.case?'<span class="muted">'+esc(x.case.split('/').pop())+'</span>':''}</span></div>`).join('')
    : '<span class="muted">No requests yet.</span>';
}
boot();
</script>
