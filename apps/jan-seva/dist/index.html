<style>
  :root{color-scheme:light dark}
  *{box-sizing:border-box}
  body{font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;margin:0;background:#0d1117;color:#e6edf3}
  header{padding:14px 20px;background:#161b22;border-bottom:1px solid #21262d;display:flex;align-items:center;gap:8px}
  header b{font-size:17px}
  .who{margin-left:auto;font-size:13px;color:#8b949e;text-align:right;line-height:1.35}
  .who a{color:#58a6ff;cursor:pointer;text-decoration:none}
  main{max-width:660px;margin:0 auto;padding:18px}
  .card{background:#161b22;border:1px solid #21262d;border-radius:12px;padding:16px;margin:12px 0}
  .btn{background:#3b82f6;color:#fff;border:0;border-radius:8px;padding:9px 15px;cursor:pointer;font-size:14px;font-weight:500}
  .btn:disabled{opacity:.5}
  .btn.ghost{background:#21262d;color:#e6edf3}
  input,textarea,select{width:100%;background:#0d1117;border:1px solid #30363d;color:#e6edf3;border-radius:8px;padding:10px;margin:6px 0;font:inherit}
  label{font-size:13px;color:#8b949e;display:block;margin-top:8px}
  .muted{color:#8b949e;font-size:13px}
  .pill{display:inline-block;background:#21262d;border-radius:999px;padding:2px 10px;font-size:12px;margin-left:6px}
  .svc{border-top:1px solid #21262d;padding:12px 0}.svc:first-child{border-top:0}
  .row{display:flex;gap:8px;align-items:center;justify-content:space-between}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .ok{color:#3fb950}.err{color:#f85149}
  .cred{border-radius:8px;padding:8px 10px;margin:6px 0;font-size:13px}
  .cred.ok{background:#12331f;color:#3fb950}.cred.err{background:#3a1518;color:#f85149}
  h3{margin:.2em 0}
  .sec{margin:16px 0 2px;font-weight:600;font-size:14px;border-bottom:1px solid #21262d;padding-bottom:4px}
  /* 0.4.0 — tabs, service cards, 3-step application, progress */
  .tabs{display:flex;gap:4px;position:sticky;top:0;z-index:5;background:#0d1117;padding:10px 0 6px;border-bottom:1px solid #21262d}
  .tabs button{flex:1;background:none;border:0;color:#8b949e;font:inherit;font-weight:600;padding:9px 6px;border-radius:8px;cursor:pointer}
  .tabs button.on{background:#161b22;color:#e6edf3;box-shadow:inset 0 -2px 0 #3b82f6}
  .badge{display:inline-block;min-width:18px;padding:0 6px;border-radius:999px;background:#d29922;color:#0d1117;font-size:11px;line-height:18px;margin-left:4px}
  .badge[hidden]{display:none}
  .gw{border:1px solid #30363d;border-radius:10px;padding:12px;background:#0d1117}
  .search{font-size:16px;padding:12px 14px}
  .dept{margin:16px 0 4px;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:#8b949e}
  .svc{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:12px;border:1px solid #21262d;border-radius:10px;margin:6px 0;cursor:pointer}
  .svc:hover{border-color:#3b82f6;background:#131a24}.svc .muted{margin-top:2px}
  .go{color:#58a6ff;font-weight:600;white-space:nowrap;font-size:14px}
  .note{background:#2a2410;border:1px solid #4d3d12;color:#e3b341;border-radius:10px;padding:10px 12px;margin:12px 0;font-size:14px}
  .note a,.back,a{color:#58a6ff;cursor:pointer}
  .back{font-size:13px;display:inline-block;margin-bottom:6px}
  h2{margin:.1em 0 .2em;font-size:20px}
  .desc{color:#c9d1d9;font-size:14px;margin:8px 0}
  .flow{font-size:12px;color:#8b949e;background:#0d1117;border-radius:8px;padding:6px 10px}
  .stepper{display:flex;list-style:none;padding:0;margin:16px 0 8px;gap:6px;counter-reset:st}
  .stepper li{flex:1;font-size:13px;color:#8b949e;padding:8px 6px;border-top:3px solid #30363d;counter-increment:st}
  .stepper li::before{content:counter(st)". "}
  .stepper li.on{color:#e6edf3;border-color:#3b82f6;font-weight:600}.stepper li.done{color:#3fb950;border-color:#238636}
  .help{font-size:12px;color:#8b949e;margin-top:2px}.req{color:#f85149}
  .fld{margin-bottom:4px}
  .nav{display:flex;justify-content:space-between;gap:8px;margin-top:16px}
  .btn.sm{padding:5px 10px;font-size:13px}
  .doc{display:flex;gap:10px;align-items:center;justify-content:space-between;border:1px solid #21262d;border-radius:8px;padding:10px 12px;margin:6px 0;font-size:14px}
  .doc.ok{border-color:#238636;background:#0f2417}.doc.err{border-color:#da3633;background:#2a1215}
  table.rv{width:100%;border-collapse:collapse;font-size:14px}table.rv td{padding:6px 4px;border-bottom:1px solid #21262d;vertical-align:top}
  table.rv td:first-child{color:#8b949e;width:42%}
  .amt{font-size:18px}
  .consent{display:flex;gap:8px;align-items:flex-start;margin-top:14px;color:#c9d1d9;font-size:14px}.consent input{width:auto;margin-top:3px}
  .card.done{text-align:center}.card.done .big{font-size:40px;color:#3fb950}.ref{font-size:18px;letter-spacing:.03em}
  .chip{font-size:12px;border-radius:999px;padding:3px 10px;white-space:nowrap}
  .chip.b{background:#0c2d6b;color:#79c0ff}.chip.g{background:#0f3d1e;color:#3fb950}.chip.r{background:#4a1416;color:#ff7b72}
  .chip.y{background:#3d2e00;color:#e3b341}.chip.m{background:#21262d;color:#8b949e}
  .track{display:flex;list-style:none;padding:0;margin:12px 0 0;gap:4px}
  .track li{flex:1;font-size:12px;color:#8b949e;padding-top:6px;border-top:3px solid #30363d}
  .track li.done{color:#3fb950;border-color:#238636}.track li.on{color:#e6edf3;border-color:#3b82f6;font-weight:600}
  @media (max-width:520px){ main{padding:10px} .svc{flex-direction:column;align-items:flex-start} .stepper li,.track li{font-size:11px} }

<header><b>🏛️ My Services</b> <span class="muted" style="font-weight:400">· <span data-i18n="js.tagline">Citizen Services</span></span>

<script>
AI18n.add({

      "js.search_hint":"सेवा टाइप करके खोजें — आपको <b id=\"cityname\">आपके शहर</b> में उपलब्ध सेवाएँ दिखेंगी।",
      "js.my_requests":"मेरे अनुरोध","js.refresh":"ताज़ा करें","js.signin_title":"जन सेवा में साइन इन करें",
      "js.signin_desc":"जहाँ आप रहते हैं वहाँ की नागरिक सेवाओं तक पहुँचें।","js.username":"उपयोगकर्ता नाम",
      "js.signin":"साइन इन","js.enter_username":"अपना उपयोगकर्ता नाम दर्ज करें।","js.signing_in":"साइन इन हो रहा है…",
      "js.no_citizen":"ऐसा कोई नागरिक नहीं — अपना उपयोगकर्ता नाम जाँचें, या खाता बनाएँ।",
      "js.new_citizen":"नए नागरिक?","js.create_account":"खाता बनाएँ →","js.consent_submit":"सहमति दें और जमा करें",
      "js.describe":"अपना अनुरोध बताएँ"}
});
const api = (p, b) => fetch(p, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(b||{})}).then(r=>r.json());
const esc = s => String(s==null?'':s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const APP = 'jan-seva';
let CATALOG = [], SEL = null, CITIES = [], PROFILE = null, ME = null;

// ---- boot: who am I? do I have a profile (where I live)? else show Join ----
async function boot(){
  try{ ME = await (await fetch('/session')).json(); }catch(e){ ME = {}; }
  AI18n.init({locale: (ME && ME.locale) || 'en'});   // render in the citizen's chosen language (from their profile)
  try{ CITIES = ((await api('/bridge/jurisdictions',{})).jurisdictions||[]).filter(j=>j.kind==='city'); }catch(e){ CITIES=[]; }
  PROFILE = null;
  if(ME && ME.sub){ try{ PROFILE = (await api('/bridge/profile-get',{})).profile; }catch(e){} }
  if(ME && ME.sub && PROFILE) renderApp(); else renderJoin();
}
const cityName = code => (CITIES.find(c=>c.code===code)||{}).name || code;
const cityOptions = sel => CITIES.map(c=>`<option value="${esc(c.code)}"${c.code===sel?' selected':''}>${esc(c.name)}</option>`).join('');

// ---- gate: SIGN IN (returning citizen) — with a link to create an account ----
function renderJoin(){
  document.getElementById('who').textContent='';
  document.getElementById('app').style.display='none';
  document.getElementById('gate').innerHTML = `<div class="card">
    <h3>${esc(AI18n.t('js.signin_title'))}</h3>
    <div class="muted">${esc(AI18n.t('js.signin_desc'))}</div>
    <label>${esc(AI18n.t('js.username'))}</label><input id="li" placeholder="e.g. asha.patil"/>
    <label>Password <span class="muted" style="text-transform:none">(leave blank if you have none)</span></label>
    <input id="lp" type="password" autocomplete="current-password" placeholder="Password"/>
    <button class="btn" id="loginBtn" style="margin-top:10px">${esc(AI18n.t('js.signin'))}</button>
    <div id="loginOut" class="muted" style="margin-top:8px"></div>
    <div style="margin-top:14px;border-top:1px solid #21262d;padding-top:12px;font-size:14px">
      ${esc(AI18n.t('js.new_citizen'))} <a onclick="renderJoinForm()" style="color:#58a6ff;cursor:pointer">${esc(AI18n.t('js.create_account'))}</a>
    </div></div>`;
  const li=document.getElementById('li');
  document.getElementById('loginBtn').onclick = doLogin;
  li.addEventListener('keydown', e=>{ if(e.key==='Enter') doLogin(); });
}
async function doLogin(){
  const u=document.getElementById('li').value.trim(), out=document.getElementById('loginOut');
  const pw=(document.getElementById('lp')||{}).value||'';
  if(!u){ out.innerHTML='<span class="err">'+esc(AI18n.t('js.enter_username'))+'</span>'; return; }
  out.textContent=AI18n.t('js.signing_in');
  // SAME mechanism as the platform /login (reference IdP, citizens realm) — now carries a password so a
  // password-protected citizen can sign in; a passwordless citizen just leaves it blank.
  let r={},status=0; try{ const x=await fetch('/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({realm:'citizens',username:u.toLowerCase(),password:pw})}); status=x.status; r=await x.json(); }catch(e){}
  if(r && r.ok){ notifyShell(); setTimeout(()=>{ try{ top.location='/'; }catch(e){ location.href='/'; } }, 300); }
  else if(status===401){ out.innerHTML='<span class="err">'+esc(r.error||'Wrong username or password. If you have no password, leave it blank; new here? Create an account.')+'</span>'; }
  else out.innerHTML='<span class="err">'+esc(AI18n.t('js.no_citizen'))+'</span>';
}
// ---- create an account (self-signup) ----
function renderJoinForm(){
  document.getElementById('gate').innerHTML = `<div class="card">
    <h3>Create your citizen account</h3>
    <div class="muted">Register once. We'll show the services offered where you live — and remember you if you move.</div>
    <label>Your name</label><input id="jn" placeholder="e.g. Asha Patil"/>
    <div class="grid2">
      <div><label>Pick a username</label><input id="ju" placeholder="e.g. asha.patil"/></div>
      <div><label>Contact (optional)</label><input id="jc" placeholder="email or phone"/></div>
    </div>
    <div class="grid2">
      <div><label>Where do you live?</label><select id="jr">${cityOptions()}</select></div>
      <div><label>Own property elsewhere? (optional)</label><select id="jp"><option value="">— none —</option>${cityOptions()}</select></div>
    </div>
    <button class="btn" id="joinBtn" style="margin-top:12px">Create my citizen account</button>
    <div id="joinOut" class="muted" style="margin-top:8px"></div>
    <div style="margin-top:12px;font-size:14px">Already registered? <a onclick="renderJoin()" style="color:#58a6ff;cursor:pointer">← Sign in</a></div></div>`;
  document.getElementById('joinBtn').onclick = doJoin;
}
async function doJoin(){
  const g=id=>document.getElementById(id), out=g('joinOut'), btn=g('joinBtn');
  const username=g('ju').value.trim(), name=g('jn').value.trim();
  if(!username||!name){ out.innerHTML='<span class="err">Name and username are required.</span>'; return; }
  btn.disabled=true; out.textContent='Creating your account…';
  const prop = g('jp').value ? [g('jp').value] : [];
  const r = await api('/bridge/citizen-register', {username, name, contact:g('jc').value.trim(), residence:[g('jr').value], property:prop});
  if(r.ok){ out.innerHTML='<span class="ok">✓ Welcome, '+esc(name)+'! Taking you to your home…</span>'; notifyShell();
    setTimeout(()=>{ try{ top.location='/'; }catch(e){ location.href='/'; } }, 700); }
  else { btn.disabled=false; out.innerHTML='<span class="err">✗ '+esc(r.detail||r.error||'could not register')+'</span>'; }
}

// ---- identity bar + "I moved" ----
function renderWho(){
  const home = PROFILE && PROFILE.primary ? cityName(PROFILE.primary) : '—';
  // the CITY is the change-city control (tap Nashik → change). Sign out lives on the desktop shell, not here.
  document.getElementById('who').innerHTML =
    `${esc((PROFILE&&PROFILE.name)||ME.sub)} · 📍 <a onclick="moved()" title="Change your city">${esc(home)} ✎</a>`;
  document.getElementById('cityname').textContent = home;
}
function moved(){
  showTab('svc'); if(SEL) closeSvc();
  document.getElementById('detail').innerHTML = `<div class="card"><h3>Change your city</h3>
    <div class="muted">Your account, history and open requests stay — only which services you see will change.</div>
    <label>I now live in</label><select id="mv">${cityOptions(PROFILE&&PROFILE.primary)}</select>
    <button class="btn" id="mvBtn" style="margin-top:10px">Update</button>
    <div id="mvOut" class="muted" style="margin-top:8px"></div></div>`;
  document.getElementById('detail').scrollIntoView({behavior:'smooth'});
  document.getElementById('mvBtn').onclick = async ()=>{
    const city=document.getElementById('mv').value, out=document.getElementById('mvOut');
    out.textContent='Updating…';
    const keepProp = (PROFILE&&PROFILE.property)||[];
    const r = await api('/bridge/profile-save', {app_id:APP, name:(PROFILE&&PROFILE.name)||'', residence:[city], property:keepProp});
    if(r.profile){ out.innerHTML='<span class="ok">✓ Moved to '+esc(cityName(city))+'.</span>'; PROFILE.primary=city; PROFILE.residence=[city]; renderWho(); document.getElementById('detail').innerHTML=''; search(); }
    else out.innerHTML='<span class="err">✗ '+esc(r.error||'failed')+'</span>';
  };
}
async function logout(){ try{ await fetch('/logout',{method:'POST'}); }catch(e){} notifyShell(); boot(); }
// tell the outer run-shell to refresh its identity badge after a sign-in/out change inside the frame
function notifyShell(){ try{ parent.postMessage({type:'airawat-session'}, '*'); }catch(e){} }

// ---- MY ACCOUNT: verified identity, linked department records, wallet, DigiLocker (sandbox) ----
let WALLET = {offers:[], held:[]}, DLSTAT = {};
const accept = id => id ? api('/bridge/credential-accept', {credential_id:id}) : Promise.resolve({});
const ISSUER = {'city-da':'City Development Authority','city-mc':'City Municipal Corporation','uit':'Urban Improvement Trust',
  'housing-board':'State Housing Board','sidc':'Industrial Development Corporation','state-udd':'Urban Development Department',
  'dlb':'Directorate of Local Bodies','uidai':'UIDAI (simulated eKYC)','digilocker-sandbox':'DigiLocker (sandbox)'};
const issuerName = t => ISSUER[t] || t;
async function loadWallet(){ try{ WALLET = await api('/bridge/my-credentials', {}); }catch(e){ WALLET = {offers:[], held:[]}; } WALLET.held = WALLET.held||[]; WALLET.offers = WALLET.offers||[]; }
async function renderAccount(){          // My Account and My Documents are their own apps now — keep only the state this app needs
  try{ DLSTAT = await api('/bridge/digilocker', {action:'status'}); }catch(e){ DLSTAT = {}; }
  await loadWallet(); updateBadges();
}
function openApp(id){ try{ if(parent && parent.open_){ parent.open_(id); return; } }catch(e){} top.location = '/run?app=' + id; }
/* ===== 🎤 Voice intake — speak your complaint in any language; transcribed via the gateway (Bodhan STT).
   Records in-frame → 16kHz WAV → chunk-upload to filestore → transcribe by file_id → into the field. ===== */
function _toWav(buf){ const sr=buf.sampleRate,len=buf.length,nch=buf.numberOfChannels,mono=new Float32Array(len);
  for(let c=0;c<nch;c++){const ch=buf.getChannelData(c);for(let i=0;i<len;i++)mono[i]+=ch[i]/nch;}
  const ab=new ArrayBuffer(44+len*2),dv=new DataView(ab),ws=(o,s)=>{for(let i=0;i<s.length;i++)dv.setUint8(o+i,s.charCodeAt(i));};
  ws(0,"RIFF");dv.setUint32(4,36+len*2,true);ws(8,"WAVE");ws(12,"fmt ");dv.setUint32(16,16,true);dv.setUint16(20,1,true);dv.setUint16(22,1,true);
  dv.setUint32(24,sr,true);dv.setUint32(28,sr*2,true);dv.setUint16(32,2,true);dv.setUint16(34,16,true);ws(36,"data");dv.setUint32(40,len*2,true);
  let o=44;for(let i=0;i<len;i++){let s=Math.max(-1,Math.min(1,mono[i]));dv.setInt16(o,s<0?s*0x8000:s*0x7FFF,true);o+=2;} return new Blob([ab],{type:"audio/wav"}); }
async function attachMic(btn,target,opts){ if(!btn||!target)return; opts=opts||{}; const idle=btn.textContent||"🎤"; const note=m=>{try{opts.status&&opts.status(m);}catch(e){}};
  let rec=null,chunks=[],on=false,tick=null,secs=0;
  btn.onclick=async(e)=>{ e&&e.preventDefault(); if(on){rec&&rec.stop();return;}
    if(!navigator.mediaDevices||!window.MediaRecorder){note("Voice input isn’t supported here");return;}
    let stream; try{stream=await navigator.mediaDevices.getUserMedia({audio:true});}catch(err){note("Microphone permission denied");return;}
    chunks=[];rec=new MediaRecorder(stream);on=true;secs=0;btn.textContent="⏺ 0s";tick=setInterval(()=>{secs++;btn.textContent="⏺ "+secs+"s";},1000);
    rec.ondataavailable=ev=>{if(ev.data&&ev.data.size)chunks.push(ev.data);};
    rec.onstop=async()=>{on=false;clearInterval(tick);stream.getTracks().forEach(t=>t.stop());btn.textContent="…";
      let wav; try{const ab=await new Blob(chunks,{type:(chunks[0]&&chunks[0].type)||"audio/webm"}).arrayBuffer();
        const AC=window.AudioContext||window.webkitAudioContext; let audio=await new AC().decodeAudioData(ab);
        try{const off=new OfflineAudioContext(1,Math.max(1,Math.ceil(audio.duration*16000)),16000);const s=off.createBufferSource();s.buffer=audio;s.connect(off.destination);s.start();audio=await off.startRendering();}catch(e){}
        wav=_toWav(audio);}catch(err){btn.textContent=idle;note("Could not process the recording");return;}
      let fid=null; try{const up="v"+Date.now().toString(36)+Math.random().toString(36).slice(2,8),CH=700*1024,N=Math.max(1,Math.ceil(wav.size/CH));
        for(let i=0;i<N;i++){btn.textContent="⇧ "+Math.round(i/N*100)+"%";const part=wav.slice(i*CH,(i+1)*CH),last=(i===N-1);
          const r=await fetch("/bridge/upload-chunk?up="+up+"&seq="+i+(last?"&fin=1":""),{method:"POST",headers:{"Content-Type":"application/octet-stream"},body:part}).then(x=>x.json());
          if(r.error){btn.textContent=idle;note(r.error);return;} if(last)fid=r.file_id;}
      }catch(err){btn.textContent=idle;note("Upload failed");return;}
      btn.textContent="…"; let j={}; try{j=await fetch("/bridge/transcribe",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({file_id:fid,mime:"audio/wav",language:opts.language||""})}).then(x=>x.json());}catch(err){j={error:String(err)};}
      btn.textContent=idle; if(j.error){note(j.error);return;} const txt=(j.text||"").trim(); if(!txt){note("No speech detected — try again");return;}
      const cur=target.value||""; target.value=cur?(cur.replace(/\s*$/,"")+" "+txt):txt; target.dispatchEvent(new Event("input")); target.focus();
    };
    rec.start();
  };
}
function _micify(box){ if(!box)return; box.querySelectorAll("textarea").forEach(ta=>{ if(ta._mic)return; ta._mic=1;
  const b=document.createElement("button"); b.type="button"; b.textContent="🎤 Speak"; b.className="btn ghost"; b.style.cssText="margin:2px 0 8px;padding:4px 10px;font-size:13px";
  const st=document.createElement("span"); st.style.cssText="font-size:12px;color:#8b949e;margin-left:8px";
  ta.insertAdjacentElement("afterend", st); ta.insertAdjacentElement("afterend", b);
  attachMic(b, ta, {status:m=>{st.textContent=m; setTimeout(()=>{if(st.textContent===m)st.textContent="";},4000);}});
}); }
let LOOKUP = {}, DOCREFS = {};
const DOCNAME = {'identity-proof':'Identity proof','address-proof':'Address proof','ownership-proof':'Proof of ownership (sale deed, lease deed or patta)',
  'sale-deed':'Registered sale deed','lease-deed':'Lease deed / patta','allotment-letter':'Allotment letter','death-certificate':'Death certificate of the holder',
  'succession-certificate':'Succession certificate or will','affidavit':'Affidavit (prescribed format)','no-dues':'No-dues certificate','site-plan':'Site plan',
  'building-plan':'Building plan drawings','tax-receipt':'Latest property-tax receipt','indemnity-bond':'Indemnity bond'};
function formValues(){
  const form = {};
  document.querySelectorAll('#form [data-k]').forEach(el=>{
    const box = el.closest('.fld'); if(box && box.style.display==='none') return;     // a hidden conditional field is not sent
    if(el.dataset.lookup){ const r = LOOKUP[el.dataset.k]; if(r){ form[el.dataset.k] = r.property; } else if(el.value!=='') form[el.dataset.k]=el.value.trim().toUpperCase(); return; }
    if(el.value!=='') form[el.dataset.k]=el.value; });
  return form;
}
function applyShowIf(){
  const v = {}; document.querySelectorAll('#form [data-k]').forEach(el=>{ v[el.dataset.k]=el.value; });
  document.querySelectorAll('#form .fld[data-showif]').forEach(box=>{
    let c={}; try{ c=JSON.parse(box.dataset.showif); }catch(e){}
    const ok = Object.entries(c).every(([f,want])=> Array.isArray(want) ? want.includes(v[f]) : v[f]===want);
    box.style.display = ok ? '' : 'none';
  });
}
async function lookupProperty(k){
  const el = document.querySelector(`#form [data-k="${k}"]`), out = document.getElementById('lk_'+k);
  const id = (el.value||'').trim().toUpperCase(); if(!id){ out.innerHTML='<span class="err">Enter the Unified Property ID.</span>'; return; }
  out.innerHTML = '<span class="muted">Looking up '+esc(id)+'…</span>'; delete LOOKUP[k];
  const r = await api('/bridge/urban-property', {authority: SEL.tenant, property_id: id});
  if(!r.property){ out.innerHTML = '<span class="err">✗ '+esc(r.error||'not found')+'</span>'; return; }
  const p = r.property; LOOKUP[k] = p;
  document.querySelectorAll('#form [data-from]').forEach(h=>{ const [src, attr] = h.dataset.from.split('.'); if(src===k) h.value = (p[attr]==null?'':p[attr]); });
  out.innerHTML = `<div class="cred ok">✓ <b>${esc(p.property_id)}</b> · ${esc(p.address||'')}<br>
      ${esc(titleCase(p.property_type||''))} · ${esc(titleCase(p.land_use||''))} · ${p.area_sqm!=null?esc(p.area_sqm)+' sq m':''}
      ${p.zone_name?' · '+esc(p.zone_name):''}${p.scheme_name?' · '+esc(p.scheme_name):''} · ${esc(titleCase(p.tenure||''))}</div>
    <button class="btn ghost" type="button" style="padding:4px 10px;font-size:13px" onclick="linkProperty('${esc(k)}')">🔗 This is my property — link it to my account</button>
    <span id="lnk_${esc(k)}" class="muted"></span>`;
}
async function linkProperty(k){
  const p = LOOKUP[k], out = document.getElementById('lnk_'+k); if(!p) return;
  out.textContent = ' Checking with the department…';
  const r = await api('/bridge/urban-link', {authority: SEL.tenant, property_id: p.property_id});
  if(r.linked && r.credential && r.credential.id && !r.already){ await accept(r.credential.id); renderAccount(); }
  out.innerHTML = r.linked ? ' <span class="ok">✓ Linked — the department\'s signed record is now in your wallet.</span>'
                           : ' <span class="err">✗ '+esc(r.error||'could not link')+'</span>';
}
const titleCase = s => String(s||'').replace(/[-_]/g,' ').replace(/\b\w/g,c=>c.toUpperCase());
let CREDMATCH = {};    // required credential type -> matched wallet VC (reuse)
// ===================== Jan Seva 0.4.0 — three tabs; a service opens as a 3-step application =====================
const DEPT = {'city-da':'City Development Authority','city-mc':'City Municipal Corporation','uit':'Urban Improvement Trust',
  'housing-board':'State Housing Board','sidc':'Industrial Development Corporation','state-udd':'Urban Development Department',
  'dlb':'Directorate of Local Bodies','nashik':'Nashik Municipal Corporation','pune':'Pune Municipal Corporation',
  'new-delhi':'New Delhi Municipal Council','esic':'ESIC','ncs':'National Career Service'};
const deptName = t => DEPT[t] || ISSUER[t] || titleCase(t);
const STATUS = {received:['Submitted','b'], in_progress:['Being processed','b'], open:['Being processed','b'], confirmed:['Being processed','b'],
  resolved:['Approved','g'], closed:['Closed','g'], rejected:['Not approved','r'], returned:['Returned — documents needed','y'], withdrawn:['Withdrawn','m']};
const statusChip = s => { const [l,c] = STATUS[s] || [titleCase(s||'—'),'m']; return `<span class="chip ${c}">${esc(l)}</span>`; };
const roleName = r => titleCase(String(r||'').split('.').pop());
const firstSentence = s => { s = String(s||''); const i = s.indexOf('. '); return i > 0 ? s.slice(0, i+1) : s; };
const fmtDate = s => { try{ return new Date(s).toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'}); }catch(e){ return s||''; } };
let TAB = 'svc', TXNS = [];

function showTab(t){

  ['svc','req'].forEach(x=>{ document.getElementById('tab-'+x).hidden = (x!==t); });

function updateBadges(){
  const n = (WALLET.offers||[]).length + (DLSTAT.verified ? 0 : 1);
  const open = TXNS.filter(t=>['received','in_progress','open','confirmed','returned'].includes(t.status)).length;

     <a onclick="openApp('my-account')">Open My Account →</a></div>`;
}

// ---- Services: search as you type, grouped by department ----
async function search(){
  const q = document.getElementById('q').value;
  const r = await api('/bridge/service-search', {query: q});
  CATALOG = (r.message || {}).catalog || [];
  const el = document.getElementById('results');
  if(!CATALOG.length){ el.innerHTML = '<div class="muted" style="padding:8px 0">No services match that in '+esc(document.getElementById('cityname').textContent)+'.</div>'; return; }
  const groups = {}; CATALOG.forEach((o,i)=>{ (groups[o.tenant] = groups[o.tenant] || []).push([o,i]); });
  el.innerHTML = Object.entries(groups).map(([t, list])=>`<div class="dept">${esc(deptName(t))}</div>` + list.map(([o,i])=>
    `<div class="svc" onclick="pick(${i})"><div><b>${esc(o.title)}</b><div class="muted">${esc(firstSentence(o.description))}</div></div>
       <span class="go">Apply →</span></div>`).join('')).join('');
}

// ---- A service: 1 Details → 2 Documents → 3 Review & submit ----
let STEP = 1;
function orderedKeys(rs){
  const props = rs.properties || {}, ord = rs['x-order'] || [];
  return ord.filter(k=>k in props).concat(Object.keys(props).filter(k=>!ord.includes(k)));
}
async function pick(i){
  SEL = CATALOG[i]; LOOKUP = {}; DOCREFS = {}; CREDMATCH = {}; STEP = 1; FEE = 0; PAYREF = null;
  const rs = SEL.request_schema || {}; const props = rs.properties || {}; const req = rs.required || [];
  const keys = orderedKeys(rs); let lastSec = null;
  const form = keys.length ? keys.map(k=>{
      const p = props[k]||{}; const lbl = esc(p.title||titleCase(k)) + (req.includes(k) ? ' <span class="req">*</span>' : '');
      if(p['x-from']) return `<input type="hidden" data-k="${esc(k)}" data-from="${esc(p['x-from'])}">`;
      let h = '';
      if(p['x-section'] && p['x-section']!==lastSec){ lastSec=p['x-section']; h += `<div class="sec">${esc(lastSec)}</div>`; }
      const si = p['x-show-if'] ? ` data-showif="${esc(JSON.stringify(p['x-show-if']))}"` : '';
      const help = p.description ? `<div class="help">${esc(p.description)}</div>` : '';
      const t = p.format==='date' ? 'date' : (p.type==='number' ? 'number' : 'text');
      const pre = p['x-prefill']==='identity.name' && DLSTAT.name ? ` value="${esc(DLSTAT.name)}"` : '';
      let w;
      if(p['x-lookup']==='urban.property'){
        w = `<div class="row"><input data-k="${esc(k)}" data-lookup="urban.property" placeholder="e.g. UP-CDA-000123" style="text-transform:uppercase">
             <button class="btn ghost" type="button" onclick="lookupProperty('${esc(k)}')">Find</button></div><div id="lk_${esc(k)}"></div>`;
      } else if(Array.isArray(p.enum)){
        const L = p['x-enum-labels']||{};
        w = `<select data-k="${esc(k)}"><option value="">Choose…</option>` + p.enum.map(v=>`<option value="${esc(v)}">${esc(L[v]||titleCase(v))}</option>`).join('') + `</select>`;
      } else w = p['x-widget']==='textarea' ? `<textarea data-k="${esc(k)}" rows="3"></textarea>` : `<input data-k="${esc(k)}" type="${t}"${pre}>`;
      return h + `<div class="fld"${si}><label>${lbl}</label>${help}${w}</div>`;
    }).join('')
    : `<div class="fld"><label>${AI18n.t('js.describe')} <span class="req">*</span></label><textarea id="msg" rows="4" placeholder="e.g. garbage uncollected at ward 5 for 3 days"></textarea></div>`;
  const ff = SEL.fulfillment || {}; const sla = Object.values(ff.sla_hours||{}).reduce((a,b)=>a+b,0);
  const steps = (ff.workflow||[]).map(s=>titleCase(s.step)+' ('+roleName(s.role)+')');
  document.getElementById('svcList').hidden = true; document.getElementById('banner').hidden = true;
  document.getElementById('detail').innerHTML = `<div class="card">
      <a class="back" onclick="closeSvc()">← All services</a>
      <h2>${esc(SEL.title)}</h2>
      <div class="muted">${esc(deptName(SEL.tenant))}${sla?' · usually decided within '+Math.ceil(sla/24)+' working days':''}</div>
      <p class="desc">${esc(SEL.description||'')}</p>
      ${steps.length?`<div class="flow">What happens: ${['Submit'].concat(steps,['Decision']).map(esc).join(' → ')}</div>`:''}
      <ol class="stepper"><li data-s="1">Details</li><li data-s="2">Documents</li><li data-s="3">Review &amp; submit</li></ol>
      <div id="s1"><div id="form">${form}</div></div>
      <div id="s2" hidden><div id="docs"></div></div>
      <div id="s3" hidden><div id="review"></div></div>
      <div id="out" class="muted" style="margin-top:8px"></div>
      <div class="nav"><button class="btn ghost" id="prevB" onclick="go(STEP-1)">Back</button><button class="btn" id="nextB" onclick="go(STEP+1)">Continue</button></div>
    </div>`;
  _micify(document.getElementById('form'));
  const fm = document.getElementById('form'); fm.addEventListener('change', applyShowIf); fm.addEventListener('input', ()=>{ document.getElementById('out').textContent=''; });
  applyShowIf(); setStep(1);
}
function closeSvc(){ SEL = null; document.getElementById('detail').innerHTML=''; document.getElementById('svcList').hidden=false; document.getElementById('banner').hidden=false; window.scrollTo(0,0); }
function setStep(n){
  STEP = n;
  [1,2,3].forEach(s=>{ document.getElementById('s'+s).hidden = (s!==n); });
  document.querySelectorAll('.stepper li').forEach(li=>{ const s=+li.dataset.s; li.className = s<n?'done':(s===n?'on':''); });
  document.getElementById('prevB').style.visibility = n>1 ? 'visible' : 'hidden';
  const nb = document.getElementById('nextB'); nb.textContent = n<3 ? 'Continue' : 'Submit application'; nb.disabled = false;
  window.scrollTo(0,0);
}
function missingRequired(){
  const rs = SEL.request_schema||{}, props = rs.properties||{}, form = formValues();
  if(document.getElementById('msg')) return document.getElementById('msg').value.trim() ? [] : [AI18n.t('js.describe')];
  return (rs.required||[]).filter(k=>{ const el=document.querySelector(`#form [data-k="${k}"]`); const box=el&&el.closest('.fld');
      if(box && box.style.display==='none') return false;
      if(el && el.dataset.lookup) return !LOOKUP[k];
      return form[k]==null || form[k]===''; }).map(k=>(props[k]||{}).title||titleCase(k));
}
async function go(n){
  const out = document.getElementById('out'); out.textContent = '';
  if(n < STEP){ setStep(n); return; }
  if(STEP===1){ const m = missingRequired(); if(m.length){ out.innerHTML='<span class="err">Please complete: '+m.map(esc).join(', ')+'</span>'; return; } setStep(2); renderDocs(); return; }
  if(STEP===2){ setStep(3); renderReview(); return; }
  if(STEP===3) return fileIt();
}

// ---- Step 2: one documents list — the required credentials + the service's checklist, matched against the wallet ----
let LOCKER = null;
async function renderDocs(){
  const box = document.getElementById('docs'); box.innerHTML = '<span class="muted">Checking your wallet…</span>';
  await loadWallet();
  if(DLSTAT.verified && LOCKER===null){ try{ LOCKER = (await api('/bridge/digilocker',{action:'list'})).documents || []; }catch(e){ LOCKER=[]; } }
  const v = {}; document.querySelectorAll('#form [data-k]').forEach(el=>{ v[el.dataset.k]=el.value; });
  const D = ((SEL.fulfillment)||{}).documents || [];
  const need = D.filter(d=>Object.entries(d.when||{}).every(([f,w])=>Array.isArray(w)?w.includes(v[f]):v[f]===w));
  const ALIAS = {'ownership-proof':['ownership-proof','sale-deed','lease-deed']};
  const inWallet = t => (WALLET.held||[]).find(h=>h.type==='credential.digilocker_document' && (ALIAS[t]||[t]).includes((h.claims||{}).doc_type));
  const inLocker = t => (LOCKER||[]).find(d=>!d.in_wallet && !d.pushed && (ALIAS[t]||[t]).includes(d.doc_type));
  CREDMATCH = {}; DOCREFS = {}; let blocked = false;
  const reqC = (SEL.required_credentials||[]).map(t=>{ const h=(WALLET.held||[]).find(c=>c.type===t);
      if(h){ CREDMATCH[t]=h.vc; return `<div class="doc ok"><span>✓ <b>${esc(h.title||titleCase(t.split('.').pop()))}</b></span><span class="muted">in your wallet · will be attached</span></div>`; }
      blocked = true;
      return `<div class="doc err"><span>✗ <b>${t==='credential.identity_verified'?'Verified identity':esc(titleCase(t.split('.').pop()))}</b> — required</span>
        ${t==='credential.identity_verified'?`<button class="btn sm" onclick="openApp('my-account')">Verify in My Account</button>`:''}</div>`; });
  const docs = need.map(d=>{ const name = DOCNAME[d.type]||titleCase(d.type); const h = inWallet(d.type);
      if(h){ DOCREFS[d.type]={vc:h.vc, title:h.title}; return `<div class="doc ok"><span>✓ <b>${esc(name)}</b><br><span class="muted">${esc(h.title)} · from DigiLocker</span></span><span class="muted">will be attached</span></div>`; }
      const l = inLocker(d.type);
      if(l) return `<div class="doc"><span>📄 <b>${esc(name)}</b><br><span class="muted">${esc(l.title)} is in your DigiLocker</span></span>
          <button class="btn sm" onclick="fetchForApp('${esc(l.uri)}',this)">Fetch from DigiLocker</button></div>`;
      return `<div class="doc"><span>📄 <b>${esc(name)}</b><br><span class="muted">Not in your wallet — you can still apply; the office may ask for it.</span></span></div>`; });
  box.innerHTML = (reqC.length||docs.length) ? `<div class="sec">Documents</div>${reqC.join('')}${docs.join('')}
      <div class="help" style="margin-top:6px">Documents from your wallet are signed by their issuer — the office sees them as verified, no upload needed.</div>`
    : '<div class="muted">No documents are needed for this service.</div>';
  document.getElementById('nextB').disabled = blocked;
}
async function fetchForApp(uri, btn){
  btn.disabled = true; btn.textContent = 'Fetching…';
  const r = await api('/bridge/digilocker', {action:'fetch', uri});
  if(!r.fetched){ btn.textContent = '✗ ' + (r.error||'failed'); return; }
  if(r.credential && r.credential.id && !r.already) await accept(r.credential.id);
  LOCKER = null; renderDocs(); renderAccount();
}

// ---- Step 3: review what will be sent, the fee (calculated automatically), consent, submit ----
async function renderReview(){
  const rs = SEL.request_schema||{}, props = rs.properties||{}, form = formValues();
  const rows = orderedKeys(rs).filter(k=>!(props[k]||{})['x-from'] && form[k]!=null && form[k]!=='').map(k=>
      `<tr><td>${esc((props[k]||{}).title||titleCase(k))}</td><td>${esc(LOOKUP[k] ? LOOKUP[k].property_id+' — '+(LOOKUP[k].address||'') : (Array.isArray((props[k]||{}).enum)?titleCase(form[k]):form[k]))}</td></tr>`).join('');
  const msg = document.getElementById('msg');
  const att = Object.values(CREDMATCH).length + Object.values(DOCREFS).length;
  document.getElementById('review').innerHTML = `<div class="sec">Your application</div>
      ${msg?`<p>${esc(msg.value)}</p>`:`<table class="rv">${rows}</table>`}
      <div class="sec">Documents attached</div><div>${att ? Object.values(DOCREFS).map(d=>'✓ '+esc(d.title)).concat(Object.keys(CREDMATCH).map(t=>'✓ '+(t==='credential.identity_verified'?'Verified identity':titleCase(t.split('.').pop())))).join('<br>') : '<span class="muted">None</span>'}</div>
      <div class="sec">Fee</div><div id="fee" class="muted">Calculating…</div>
      <label class="consent"><input type="checkbox" id="agree"> I agree that the <b>${esc(deptName(SEL.tenant))}</b> may process this application and see the documents attached.</label>`;
  document.getElementById('nextB').disabled = true;
  document.getElementById('agree').onchange = canSubmit;
  if((SEL.interaction||[]).includes('select')){
    try{ const r = await api('/bridge/service-route', {app_id:APP, action:'select', service_id:SEL.service_id, message:{form}});
      const q = (r.message||{}).quote;
      FEE = q && q.amount ? q.amount : 0;
      const payNow = FEE && (SEL.fulfillment||{}).payment==='before_submit';
      document.getElementById('fee').innerHTML = FEE
        ? `<b class="amt">₹${FEE.toLocaleString('en-IN')}</b> ` + q.breakdown.map(b=>esc(b.item)+(b.basis&&b.basis!=='flat'?' ('+esc(b.basis)+')':'')).join(', ')
          + (payNow ? `<div id="pay" style="margin-top:8px">${PAYREF ? payDone() : `<button class="btn" onclick="openPay()">Pay ₹${FEE.toLocaleString('en-IN')}</button> <span class="help">The fee is paid before the application is submitted.</span>`}</div>`
                    : `<div class="help">Pay at the office when it asks — you will be told before any payment is due.</div>`)
        : 'No fee.';
      canSubmit();
    }catch(e){ document.getElementById('fee').textContent = 'The office will tell you the fee.'; }
  } else document.getElementById('fee').textContent = 'No fee.';
}
let FEE = 0, PAYREF = null;
function needPay(){ return FEE > 0 && (SEL.fulfillment||{}).payment==='before_submit'; }
function canSubmit(){ const ag = document.getElementById('agree'); const nb = document.getElementById('nextB');
  if(nb && STEP===3) nb.disabled = !(ag && ag.checked) || (needPay() && !PAYREF); }
const payDone = () => `<div class="doc ok"><span>✓ <b>Fee paid</b> — receipt ${esc(PAYREF.receipt_no)}</span><span class="muted">in your wallet · will be attached</span></div>`;
function openPay(){
  document.getElementById('pay').innerHTML = `<div class="gw"><div class="row"><b>Payment gateway</b><span class="pill" style="background:#3d2e00;color:#e3b341">TEST · no real money</span></div>
      <div class="muted" style="margin:4px 0 8px">Paying <b>₹${FEE.toLocaleString('en-IN')}</b> to the ${esc(deptName(SEL.tenant))}</div>
      ${[['upi','UPI'],['card','Debit / credit card'],['netbanking','Net banking']].map(([v,l],i)=>`<label class="consent" style="margin:4px 0"><input type="radio" name="pm" value="${v}"${i?'':' checked'}> ${l}</label>`).join('')}
      <div class="nav"><button class="btn ghost" onclick="renderReview()">Cancel</button><button class="btn" id="payB" onclick="doPay()">Pay ₹${FEE.toLocaleString('en-IN')}</button></div></div>`;
}
async function doPay(){
  const b = document.getElementById('payB'); b.disabled = true; b.textContent = 'Processing…';
  const method = (document.querySelector('input[name=pm]:checked')||{}).value || 'upi';
  const r = await api('/bridge/urban-pay', {service_id: SEL.service_id, form: formValues(), method});
  if(!r.paid){ b.disabled = false; b.textContent = 'Retry'; document.getElementById('out').innerHTML = '<span class="err">✗ '+esc(r.error||'payment failed')+'</span>'; return; }
  if(r.credential && r.credential.id) await accept(r.credential.id);
  await loadWallet();
  const h = (WALLET.held||[]).find(c=>c.type==='credential.urban_fee_receipt' && (c.claims||{}).receipt_no===r.receipt_no);
  PAYREF = {receipt_no: r.receipt_no, vc: h && h.vc};
  document.getElementById('pay').innerHTML = payDone(); canSubmit(); renderAccount();
}
async function fileIt(){
  const out = document.getElementById('out'), btn = document.getElementById('nextB');
  btn.disabled = true; out.textContent = 'Submitting…';
  const form = formValues(); const props = (SEL.request_schema||{}).properties||{};
  const legacy = document.getElementById('msg');
  const description = legacy ? legacy.value : Object.entries(form).filter(([k])=>!(props[k]||{})['x-from']).map(([k,v])=>((props[k]&&props[k].title)||k)+': '+(LOOKUP[k]?LOOKUP[k].property_id:v)).join(' · ');
  const docs = Object.values(DOCREFS);
  const credential_refs = Object.values(CREDMATCH).concat(docs.map(d=>d.vc).filter(Boolean)).concat(PAYREF&&PAYREF.vc?[PAYREF.vc]:[]);
  const fullDesc = (PAYREF ? 'Fee paid: ₹'+FEE.toLocaleString('en-IN')+' (receipt '+PAYREF.receipt_no+') · ' : '') + (docs.length ? 'Documents (verified): ' + docs.map(d=>d.title).join(', ') + ' · ' : '') + description;
  await api('/bridge/service-consent', {app_id:APP, service_id:SEL.service_id, provider:SEL.tenant, expires_at:'2027-01-01T00:00:00Z'});
  const r = await api('/bridge/service-route', {app_id:APP, action:'init', service_id:SEL.service_id, message:{form, description: fullDesc, credential_refs}});
  const m = r.message || {};
  if(!m.reference){ out.innerHTML = `<span class="err">✗ ${esc(r.detail||r.error||'Could not submit — please try again.')}</span>`; btn.disabled = false; return; }
  const ff = SEL.fulfillment||{}; const first = (ff.workflow||[])[0];
  document.getElementById('detail').innerHTML = `<div class="card done">
      <div class="big">✓</div><h2>Application submitted</h2>
      <div>Your reference: <b class="ref">${esc(m.reference)}</b></div>
      <p class="muted">The <b>${esc(deptName(SEL.tenant))}</b> has your application${first?' — it is now with the '+esc(roleName(first.role))+(first.office_by?' of your zone office':''):''}.
        You'll see every step in <b>My requests</b>${(ff.workflow||[]).some(s=>s.issues)?', and the decision will arrive in your wallet':''}.</p>
      <div class="nav"><button class="btn ghost" onclick="closeSvc()">Back to services</button><button class="btn" onclick="closeSvc();showTab('req')">Track it in My requests</button></div></div>`;
  track();
}

// ---- My requests: one card per application, with progress ----
async function track(){
  const d = await api('/bridge/service-transactions', {});
  TXNS = (d.transactions || []).filter(t=>t.case).slice().reverse();
  const el = document.getElementById('txns');
  if(!TXNS.length){ el.innerHTML = '<div class="card muted">No applications yet. Find a service under <a onclick="showTab(\'svc\')">Services</a>.</div>'; updateBadges(); return; }
  el.innerHTML = TXNS.map((t,i)=>{ const o = CATALOG.find(c=>c.service_id===t.service_id) || {};
      return `<div class="card req"><div class="row"><div><b>${esc(o.title||titleCase(t.service_id))}</b>
          <div class="muted">${esc(deptName(t.provider))} · ${esc(fmtDate(t.created_at))} · Ref <b>${esc(String(t.case).split('/').pop().toUpperCase())}</b></div></div>
          ${statusChip(t.status)}</div><div class="prog" id="pg${i}"></div></div>`; }).join('');
  updateBadges();
  TXNS.forEach(async (t,i)=>{                   // live progress from the department's own case (data at source)
    try{ const s = await api('/bridge/service-status', {app_id:APP, case:t.case}); const m = s.message||{};
      const o = CATALOG.find(c=>c.service_id===t.service_id) || {}; const wf = ((o.fulfillment||{}).workflow||[]).map(x=>x.step);
      const cur = m.current_step, closed = m.status==='closed';
      const stages = ['submitted'].concat(wf, ['decision']);
      let at = cur==='received'||cur==='submitted' ? 1 : (wf.indexOf(cur) >= 0 ? wf.indexOf(cur)+1 : 0);
      if(closed) at = stages.length;
      const label = s => s==='submitted'?'Submitted':s==='decision'?(cur==='rejected'?'Not approved':cur==='returned'?'Returned':'Decision'):titleCase(s);
      document.getElementById('pg'+i).innerHTML = '<ol class="track">' + stages.map((s,j)=>`<li class="${j<at?'done':j===at?'on':''}">${esc(label(s))}</li>`).join('') + '</ol>'
        + (cur==='returned' ? '<div class="note">The office returned this application — documents are needed. Apply again with them.</div>' : '');
    }catch(e){}
  });
}

boot();
</script>
