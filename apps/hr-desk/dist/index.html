<!doctype html><meta charset="utf-8"><title>HR Desk</title>
<!--
  HR DESK — employee self-service (Leave + Attendance) + a manager's approval queue.
  • Leave:      apply → routed to your reporting MANAGER (from the org backbone) → they approve/reject.
  • Attendance: check in / out for the day.
  • Approvals:  leave your team has filed, awaiting YOUR decision.
  Writes go through /bridge/leave-apply · /bridge/leave-decide · /bridge/attendance-mark (component-attributed,
  NOT admin-gated) so any staff member acts on their own records. Reads via /bridge/query.
-->
<style>
  :root{--bg:#0b0f14;--panel:#141a22;--line:#222b36;--ink:#e6edf3;--dim:#8b949e;--accent:#3b82f6;--good:#2ea043}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  .wrap{display:flex;height:100%}
  .nav{width:190px;flex:0 0 auto;border-right:1px solid var(--line);padding:14px 10px;background:rgba(10,14,20,.4)}
  .nav h1{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--dim);margin:2px 8px 4px}
  .nav .me{font-size:12px;color:var(--dim);margin:0 8px 12px}
  .nav a{display:flex;align-items:center;gap:9px;padding:9px 11px;border-radius:9px;color:var(--ink);cursor:pointer;margin-bottom:3px;font-weight:500}
  .nav a:hover{background:#161d27}.nav a.on{background:#17233a;color:#cfe0ff}
  .nav a .c{margin-left:auto;font-size:11px;color:#cfe0ff;background:#17233a;border:1px solid #2a3b57;border-radius:20px;padding:0 7px}
  .main{flex:1;min-width:0;overflow:auto;padding:22px 26px;max-width:760px}
  h2{margin:0 0 4px;font-size:18px}.sub{color:var(--dim);margin:0 0 16px;font-size:13px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:16px}
  label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--dim);margin:0 0 4px}
  input,select,textarea{width:100%;background:#0d1117;border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:8px 10px;font-size:13px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.grid.g3{grid-template-columns:1fr 1fr 1fr}
  .row{margin-bottom:12px}
  .btn{border:1px solid var(--line);background:#1b232e;color:var(--ink);border-radius:8px;padding:8px 14px;font-size:13px;cursor:pointer}
  .btn:hover{border-color:#33455a}.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}.btn.pri:hover{filter:brightness(1.08)}
  .btn.ok{background:var(--good);border-color:var(--good);color:#fff}.btn.no:hover{border-color:#8b2c30;color:#ff9b9b}
  .btn.sm{padding:4px 10px;font-size:12px}
  table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);font-size:13px}
  th{color:var(--dim);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.04em}
  .pill{display:inline-block;font-size:11px;padding:1px 9px;border-radius:20px;border:1px solid var(--line);color:var(--dim)}
  .pill.approved{color:#7ee2a8;border-color:#1f6f43}.pill.pending{color:#e6c34a;border-color:#7a5c12}.pill.rejected{color:#ff9b9b;border-color:#8b2c30}
  .empty{color:var(--dim);padding:24px;text-align:center;border:1px dashed var(--line);border-radius:12px}
  .big{font-size:26px;font-weight:600;margin:2px 0}
  .muted{color:var(--dim)} .err{color:#ff9b9b;font-size:12px;margin-top:8px}
  #toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#17233a;border:1px solid #33455a;color:#cfe0ff;padding:10px 16px;border-radius:10px;z-index:50;opacity:0;transition:opacity .3s}
</style>

<div class="wrap">
  <nav class="nav">
    <h1>🗓️ HR Desk</h1><div class="me" id="me">…</div>
    <a data-t="leave"><span>🏖️</span> Leave</a>
    <a data-t="attendance"><span>⏱️</span> Attendance</a>
    <a data-t="expenses"><span>🧾</span> Expenses</a>
    <a data-t="approvals"><span>✅</span> Approvals <span class="c" id="c-appr">0</span></a>
  </nav>
  <main class="main" id="main"></main>
</div>
<div id="toast"></div>

<script>
const api=(p,b)=>fetch(p,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b||{})}).then(r=>r.json());
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const APP='hr-desk';
let SUB='', TENANT='', ME=null, TAB='leave', EMPS=[];
const val=id=>{const e=document.getElementById(id);return e?e.value.trim():'';};
const nameOfEmp=id=>{const e=EMPS.find(x=>x.id===id);return e?(e.name||e.emp_code||id):id;};
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.style.opacity='1';clearTimeout(t._h);t._h=setTimeout(()=>t.style.opacity='0',3000);}
async function query(schema,filter){ try{ const r=await api('/bridge/query',{app_id:APP,schema,filter:filter||{}}); return (r.results||[]).map(x=>x.object||x); }catch(e){ return []; } }

async function boot(){
  try{const se=await fetch('/session').then(r=>r.json()); SUB=se.sub||''; TENANT=se.tenant||(SUB.replace(/^user:\/\//,'').split('/')[0]);}catch(e){}
  EMPS=await query('org.employee');
  ME=EMPS.find(e=>e.citizen===SUB)||null;
  document.getElementById('me').textContent = ME?(ME.name+' · '+(ME.emp_code||'')):'(no employee record linked)';
  document.querySelectorAll('.nav a').forEach(a=>a.onclick=()=>{TAB=a.dataset.t;render();});
  await refreshApprovalsCount(); render();
}
async function refreshApprovalsCount(){
  if(!ME){document.getElementById('c-appr').textContent='0';return;}
  const [pl,pe]=await Promise.all([query('hr.leave_request',{manager_login:SUB}),query('hr.expense_claim',{manager_login:SUB})]);
  const n=pl.filter(l=>l.manager_login===SUB&&l.status==='pending').length + pe.filter(e=>e.manager_login===SUB&&e.status==='pending').length;
  document.getElementById('c-appr').textContent=n;
}
function render(){
  document.querySelectorAll('.nav a').forEach(a=>a.classList.toggle('on',a.dataset.t===TAB));
  ({leave:rLeave,attendance:rAtt,expenses:rExpenses,approvals:rApprovals}[TAB])();
}

/* ---------- LEAVE ---------- */
let LEAVE={pol:{},mine:[]};                    // per-type leave policy rules + my requests (for balances)
const daysBetween=(a,b)=>Math.max(1, Math.round((new Date(b)-new Date(a))/86400000)+1);
function accrued(r){ if(r.accrual_per_month){ const m=new Date().getMonth()+1; return Math.min(r.annual_entitlement, +(r.accrual_per_month*m).toFixed(1)); } return r.annual_entitlement; }
function daysOf(status,type){ const yr=String(new Date().getFullYear());
  return LEAVE.mine.filter(l=>l.leave_type===type && l.status===status && String(l.from_date||'').startsWith(yr)).reduce((s,l)=>s+(l.days||0),0); }
function balance(type){ const r=LEAVE.pol[type]; if(!r||r.annual_entitlement==null) return null;
  const acc=accrued(r), t=daysOf('approved',type), p=daysOf('pending',type); return {entitlement:r.annual_entitlement,accrued:acc,taken:t,pending:p,available:Math.max(0,acc-t-p)}; }
async function rLeave(){
  // policy-driven balances (resolves for ME) + my requests
  let pols=[]; try{ pols=(await api('/bridge/policy-resolve',{domain:'leave'})).policies||[]; }catch(e){}
  LEAVE.pol={}; pols.forEach(p=>{const t=(p.rules||{}).leave_type; if(t&&!LEAVE.pol[t])LEAVE.pol[t]=p.rules;});  // most-specific first → keep first per type
  LEAVE.mine=(await query('hr.leave_request',{applicant_login:SUB})).filter(l=>l.applicant_login===SUB);
  const types=['casual','sick','earned','unpaid','other'];
  const withPol=types.filter(t=>LEAVE.pol[t]);
  const balCards = withPol.length ? `<div class="card"><div class="muted" style="margin-bottom:8px">Your leave balances <span class="muted">(per policy)</span></div>
      <table><thead><tr><th>Type</th><th>Entitlement</th><th>Accrued</th><th>Taken</th><th>Pending</th><th>Available</th></tr></thead><tbody>`
      + withPol.map(t=>{const b=balance(t);return `<tr><td>${esc(t)}</td><td>${b.entitlement}</td><td>${b.accrued}</td><td>${b.taken}</td><td>${b.pending}</td><td><b>${b.available}</b></td></tr>`;}).join('')
      + `</tbody></table></div>` : '';
  const typeOpt=t=>{const b=balance(t);return `<option value="${t}">${t}${b?` — ${b.available} left`:''}</option>`;};
  const main=document.getElementById('main');
  main.innerHTML=`<h2>Leave</h2><div class="sub">Apply for leave — it goes to your manager${ME&&ME.manager?' ('+esc(nameOfEmp(ME.manager))+')':''} for approval.</div>
    ${balCards}
    <div class="card"><div class="grid g3">
        <div class="row"><label>Type</label><select id="lt" onchange="lhint()">${types.map(typeOpt).join('')}</select></div>
        <div class="row"><label>From</label><input id="lf" type="date" onchange="lhint()"></div>
        <div class="row"><label>To</label><input id="lto" type="date" onchange="lhint()"></div></div>
      <div class="row"><label>Reason</label><input id="lr" placeholder="optional"></div>
      <div id="lhint" class="muted" style="font-size:12px;margin-bottom:6px"></div>
      <div id="lerr" class="err"></div>
      <button class="btn pri" onclick="applyLeave()"${ME?'':' disabled title="no employee record linked to your login"'}>Apply for leave</button>
      ${ME?'':'<div class="muted" style="margin-top:8px">Ask your admin to set your <b>Login user</b> on your employee record in Org Setup.</div>'}</div>
    <h2 style="font-size:15px">My requests</h2><div id="mine"></div>`;
  const mine=LEAVE.mine.slice().sort((a,b)=>(b.created_at||'').localeCompare(a.created_at||''));
  document.getElementById('mine').innerHTML = mine.length ? `<div class="card"><table><thead><tr><th>Type</th><th>From</th><th>To</th><th>Days</th><th>Reason</th><th>Status</th></tr></thead><tbody>`
      + mine.map(l=>`<tr><td>${esc(l.leave_type)}</td><td>${esc(l.from_date)}</td><td>${esc(l.to_date)}</td><td>${esc(l.days!=null?l.days:'—')}</td><td>${esc(l.reason||'—')}</td><td><span class="pill ${esc(l.status)}">${esc(l.status)}</span></td></tr>`).join('')
      + `</tbody></table></div>` : `<div class="empty">No leave requests yet.</div>`;
}
function lhint(){ const t=val('lt'), from=val('lf'), to=val('lto'); const b=balance(t); const el=document.getElementById('lhint'); if(!el)return;
  const d=(from&&to)?daysBetween(from,to):null;
  el.textContent = b ? `${d!=null?d+' day(s) requested · ':''}${b.available} of ${b.accrued} accrued ${t} leave available` : (t?`No balance policy for ${t} leave — unlimited / unpaid`:''); }
async function applyLeave(){
  const from=val('lf'), to=val('lto'); if(!from||!to){document.getElementById('lerr').textContent='From and To dates are required';return;}
  const type=val('lt'), days=daysBetween(from,to), b=balance(type);
  if(b && days>b.available){ document.getElementById('lerr').textContent=`Only ${b.available} day(s) of ${type} leave available (accrued ${b.accrued} − taken ${b.taken} − pending ${b.pending}). Requested ${days}.`; return; }
  const r=await api('/bridge/leave-apply',{app_id:APP,leave_type:type,from_date:from,to_date:to,days,reason:val('lr')});
  if(r.error){document.getElementById('lerr').textContent=r.error+(r.detail?(' — '+r.detail):'');return;}
  toast(r.routed_to?('Applied — sent to '+(r.manager||'your manager')+' for approval'):'Applied (no manager set — pending)');
  render();
}

/* ---------- ATTENDANCE ---------- */
async function rAtt(){
  const main=document.getElementById('main'); const today=new Date().toISOString().slice(0,10);
  let rec=null; if(ME){ rec=(await query('hr.attendance',{employee:ME.id})).find(a=>a.date===today)||null; }
  main.innerHTML=`<h2>Attendance</h2><div class="sub">${esc(today)}</div>
    <div class="card"><div class="grid">
        <div><div class="muted">Check-in</div><div class="big">${rec&&rec.check_in?esc(rec.check_in):'—'}</div></div>
        <div><div class="muted">Check-out</div><div class="big">${rec&&rec.check_out?esc(rec.check_out):'—'}</div></div></div>
      <div style="display:flex;gap:8px;margin-top:10px">
        <button class="btn ok" onclick="mark('check_in')"${(!ME||rec&&rec.check_in)?' disabled':''}>Check in</button>
        <button class="btn pri" onclick="mark('check_out')"${(!ME||!(rec&&rec.check_in)||rec&&rec.check_out)?' disabled':''}>Check out</button></div>
      ${ME?'':'<div class="muted" style="margin-top:8px">No employee record linked to your login.</div>'}</div>
    <h2 style="font-size:15px">Recent</h2><div id="hist"></div>`;
  if(ME){ const hist=(await query('hr.attendance',{employee:ME.id})).sort((a,b)=>(b.date||'').localeCompare(a.date||'')).slice(0,14);
    document.getElementById('hist').innerHTML = hist.length ? `<div class="card"><table><thead><tr><th>Date</th><th>In</th><th>Out</th><th>Status</th></tr></thead><tbody>`
      + hist.map(a=>`<tr><td>${esc(a.date)}</td><td>${esc(a.check_in||'—')}</td><td>${esc(a.check_out||'—')}</td><td>${esc(a.status||'present')}</td></tr>`).join('')+`</tbody></table></div>`
      : `<div class="empty">No attendance yet.</div>`; }
}
async function mark(action){ const r=await api('/bridge/attendance-mark',{app_id:APP,action}); if(r.error){toast(r.error);return;} toast(action==='check_in'?('Checked in at '+r.check_in):('Checked out at '+r.check_out)); render(); }

/* ---------- APPROVALS ---------- */
/* ---------- EXPENSES ---------- */
async function rExpenses(){
  const main=document.getElementById('main');
  main.innerHTML=`<h2>Expenses</h2><div class="sub">Claim a reimbursement — it goes to your manager; on approval it posts to the ledger.</div>
    <div class="card"><div class="grid g3">
        <div class="row"><label>Category</label><select id="e_cat">${['travel','office','meals','other'].map(c=>`<option>${c}</option>`).join('')}</select></div>
        <div class="row"><label>Amount</label><input id="e_amt" type="number" placeholder="12000"></div>
        <div class="row"><label>Incurred on</label><input id="e_date" type="date"></div></div>
      <div class="grid"><div class="row"><label>Description</label><input id="e_desc" placeholder="Field visit — taxi + stay"></div>
        <div class="row"><label>Project <span class="muted">(optional)</span></label><input id="e_proj" placeholder="project code"></div></div>
      <div id="eerr" class="err"></div>
      <button class="btn pri" onclick="applyExpense()"${ME?'':' disabled'}>Submit claim</button>
      ${ME?'':'<div class="muted" style="margin-top:8px">No employee record linked to your login.</div>'}</div>
    <h2 style="font-size:15px">My claims</h2><div id="mine"></div>`;
  const mine=(await query('hr.expense_claim',{applicant_login:SUB})).filter(e=>e.applicant_login===SUB).sort((a,b)=>(b.created_at||'').localeCompare(a.created_at||''));
  document.getElementById('mine').innerHTML = mine.length ? `<div class="card"><table><thead><tr><th>Category</th><th>Amount</th><th>Description</th><th>Project</th><th>Status</th></tr></thead><tbody>`
      + mine.map(e=>`<tr><td>${esc(e.category||'—')}</td><td>${esc(e.amount)}</td><td>${esc(e.description||'—')}</td><td>${esc(e.project||'—')}</td><td><span class="pill ${esc(e.status)}">${esc(e.status)}</span></td></tr>`).join('')
      + `</tbody></table></div>` : `<div class="empty">No claims yet.</div>`;
}
async function applyExpense(){
  const amt=Number(val('e_amt')); if(!amt||amt<=0){document.getElementById('eerr').textContent='Amount is required';return;}
  const b={app_id:APP,category:val('e_cat'),amount:amt,description:val('e_desc'),incurred_on:val('e_date')}; if(val('e_proj'))b.project=val('e_proj');
  const r=await api('/bridge/expense-apply',b);
  if(r.error){document.getElementById('eerr').textContent=r.error+(r.detail?(' — '+r.detail):'');return;}
  toast(r.routed_to?('Claim sent to '+(r.manager||'your manager')):'Claim filed (pending)'); render();
}

/* ---------- APPROVALS (leave + expense) ---------- */
async function rApprovals(){
  const main=document.getElementById('main');
  const [pl,pe,buds]=await Promise.all([query('hr.leave_request',{manager_login:SUB}),query('hr.expense_claim',{manager_login:SUB}),query('finance.budget')]);
  const leaves=pl.filter(l=>l.manager_login===SUB&&l.status==='pending').sort((a,b)=>(a.created_at||'').localeCompare(b.created_at||''));
  const exps=pe.filter(e=>e.manager_login===SUB&&e.status==='pending').sort((a,b)=>(a.created_at||'').localeCompare(b.created_at||''));
  const budOpts=id=>`<option value="">— charge to budget —</option>`+buds.map(b=>{const av=(b.allocated||0)-(b.committed||0)-(b.spent||0);return `<option value="${esc(b.id)}">${esc(b.name)} (${av} left)</option>`;}).join('');
  const leaveTbl = leaves.length ? `<h2 style="font-size:15px">Leave</h2><div class="card"><table><thead><tr><th>Employee</th><th>Type</th><th>From</th><th>To</th><th>Days</th><th></th></tr></thead><tbody>`
      + leaves.map(l=>`<tr><td><b>${esc(nameOfEmp(l.employee))}</b></td><td>${esc(l.leave_type)}</td><td>${esc(l.from_date)}</td><td>${esc(l.to_date)}</td><td>${esc(l.days!=null?l.days:'—')}</td>
         <td style="white-space:nowrap"><button class="btn ok sm" onclick="decideLeave('${esc(l.id)}','approve')">Approve</button> <button class="btn sm no" onclick="decideLeave('${esc(l.id)}','reject')">Reject</button></td></tr>`).join('')+`</tbody></table></div>` : '';
  const expTbl = exps.length ? `<h2 style="font-size:15px">Expense</h2><div class="card"><table><thead><tr><th>Employee</th><th>Category</th><th>Amount</th><th>Project</th><th>Budget</th><th></th></tr></thead><tbody>`
      + exps.map(e=>`<tr><td><b>${esc(nameOfEmp(e.employee))}</b></td><td>${esc(e.category||'—')}</td><td>${esc(e.amount)}</td><td>${esc(e.project||'—')}</td>
         <td><select id="eb_${esc(e.id.split('/').pop())}">${budOpts()}</select></td>
         <td style="white-space:nowrap"><button class="btn ok sm" onclick="decideExpense('${esc(e.id)}','approve')">Approve</button> <button class="btn sm no" onclick="decideExpense('${esc(e.id)}','reject')">Reject</button></td></tr>`).join('')+`</tbody></table></div>` : '';
  main.innerHTML=`<h2>Approvals</h2><div class="sub">Your team's requests awaiting your decision.</div>`
    + (leaveTbl||expTbl ? (leaveTbl+expTbl) : `<div class="empty">Nothing awaiting your approval.</div>`);
}
async function decideLeave(id,decision){ const r=await api('/bridge/leave-decide',{app_id:APP,leave_id:id,decision}); if(r.error){toast(r.error);return;} toast('Leave '+r.status); await refreshApprovalsCount(); render(); }
async function decideExpense(id,decision){
  const sel=document.getElementById('eb_'+id.split('/').pop()); const budget=sel?sel.value:'';
  if(decision==='approve'&&!budget){toast('Pick a budget to charge');return;}
  const r=await api('/bridge/expense-decide',{app_id:APP,expense_id:id,decision,budget});
  if(r.error){toast(r.error);return;} toast(decision==='approve'?('Approved — posted to ledger'):'Rejected'); await refreshApprovalsCount(); render();
}


/* ===== AI ASSISTANT (baked-in) ===== */
/* ===== Reusable AI Assistant drawer — the SHARED pattern baked into every Airawat app =====
   Grounds the model on cfg.context() (this app's governed data), shows chips + a chat box, and — when the
   model proposes one — renders a CONFIRM button that runs cfg.run(name,params) through the app's OWN governed
   bridge. The AI never acts on its own (ADR-0029). Identical across apps; only the cfg differs. */
function AIAssist(cfg){
  const S=document.createElement('style');S.textContent=`
  #aiFab{position:fixed;right:18px;bottom:18px;z-index:60;background:linear-gradient(135deg,#6d5efc,#9b5efc);color:#fff;border:0;border-radius:999px;padding:11px 16px;font:600 13.5px system-ui;cursor:pointer;box-shadow:0 6px 20px rgba(0,0,0,.4)}
  #aiDrawer{position:fixed;top:0;right:0;height:100%;width:392px;max-width:93vw;background:#0f151d;border-left:1px solid #222b36;z-index:61;display:none;flex-direction:column;box-shadow:-8px 0 30px rgba(0,0,0,.45)}
  #aiDrawer.open{display:flex}
  #aiDrawer header{padding:13px 16px;border-bottom:1px solid #222b36;display:flex;align-items:center;gap:8px}
  #aiDrawer header b{font-size:14px}#aiDrawer header .x{margin-left:auto;cursor:pointer;color:#8b949e;font-size:18px}
  #aiLog{flex:1;overflow:auto;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
  .aiMsg{font-size:13.5px;line-height:1.5}.aiMsg.u{color:#9fd0ff;align-self:flex-end;max-width:85%}
  .aiMsg.a{color:#e6edf3;background:#141a22;border:1px solid #222b36;border-radius:10px;padding:9px 11px;max-width:92%}
  .aiChips{display:flex;flex-wrap:wrap;gap:6px;padding:0 16px 8px}
  .aiChip{font-size:12px;border:1px solid #2a3542;border-radius:999px;padding:5px 10px;color:#a9b6c4;cursor:pointer;background:#121821}
  .aiAct{margin-top:8px}.aiAct button{background:#1f9d55;border:0;color:#fff;border-radius:8px;padding:8px 12px;font:600 13px system-ui;cursor:pointer}
  #aiForm{display:flex;gap:8px;padding:12px 16px;border-top:1px solid #222b36}
  #aiIn{flex:1;background:#0d1117;border:1px solid #222b36;color:#e6edf3;border-radius:9px;padding:9px 11px;font:13.5px system-ui;resize:none;max-height:120px}
  #aiSend{background:#6d5efc;border:0;color:#fff;border-radius:9px;padding:0 14px;cursor:pointer;font:600 13px system-ui}
  .aiSpin{display:inline-block;width:12px;height:12px;border:2px solid #333d49;border-top-color:#9b5efc;border-radius:50%;animation:aisp .7s linear infinite;vertical-align:-2px}
  @keyframes aisp{to{transform:rotate(360deg)}}`;
  document.head.appendChild(S);
  const fab=document.createElement('button');fab.id='aiFab';fab.textContent='✨ Assistant';document.body.appendChild(fab);
  const d=document.createElement('div');d.id='aiDrawer';
  d.innerHTML=`<header><b>✨ ${cfg.title||'Assistant'}</b><span class="x">✕</span></header>
    <div id="aiLog"></div>
    <div class="aiChips">${(cfg.chips||[]).map(c=>`<span class="aiChip">${String(c).replace(/</g,'&lt;')}</span>`).join('')}</div>
    <div id="aiForm"><textarea id="aiIn" rows="1" placeholder="Ask about your data…"></textarea><button id="aiSend">Send</button></div>`;
  document.body.appendChild(d);
  const log=d.querySelector('#aiLog'), inp=d.querySelector('#aiIn'), hist=[];
  const e2=s=>String(s==null?'':s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
  const add=(role,html)=>{const e=document.createElement('div');e.className='aiMsg '+(role==='user'?'u':'a');e.innerHTML=html;log.appendChild(e);log.scrollTop=log.scrollHeight;return e;};
  fab.onclick=()=>{d.classList.add('open');inp.focus();if(!log.children.length)add('a','Hi — ask me anything about your '+(cfg.title||'data').toLowerCase()+'. I read what you’re currently looking at.');};
  d.querySelector('.x').onclick=()=>d.classList.remove('open');
  d.querySelectorAll('.aiChip').forEach(c=>c.onclick=()=>{inp.value=c.textContent;go();});
  d.querySelector('#aiSend').onclick=go; inp.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();go();}};
  async function go(){
    const q=inp.value.trim(); if(!q)return; inp.value='';
    add('user',e2(q)); hist.push({role:'user',content:q});
    const wait=add('a','<span class="aiSpin"></span>');
    let ctx=''; try{ctx=typeof cfg.context==='function'?cfg.context():'';}catch(e){}
    let r={}; try{ r=await fetch('/bridge/ai-assist',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({app_id:cfg.app,task:'assist',prompt:q,system:cfg.system,context:ctx,actions:cfg.actions||[],history:hist.slice(0,-1)})}).then(x=>x.json()); }
    catch(e){ r={error:String(e)}; }
    let txt=(r.content||r.error||'(no reply)'), action=null;
    const m=txt.match(/<<ACTION>>([\s\S]*?)<<ACTION>>/);
    if(m){ txt=txt.replace(m[0],'').trim(); try{action=JSON.parse(m[1]);}catch(e){} }
    wait.innerHTML=e2(txt||'(done)').replace(/\n/g,'<br>'); hist.push({role:'assistant',content:txt});
    if(action && (cfg.actions||[]).some(a=>a.name===action.name)){
      const wrap=document.createElement('div');wrap.className='aiAct';
      const b=document.createElement('button');b.textContent='▶ '+(action.label||action.name);
      b.onclick=async()=>{b.disabled=true;const o=b.textContent;b.textContent='…';
        try{const res=await cfg.run(action.name,action.params||{});add('a','✓ '+e2(typeof res==='string'?res:((res&&res.message)||'Done.')));}
        catch(e){b.disabled=false;b.textContent=o;add('a','⚠ '+e2((e&&e.message)||String(e)));return;}
        wrap.remove();};
      wrap.appendChild(b); wait.appendChild(wrap);
    }
  }
}

/* ---- HR Desk assistant ---- */
function aiCtx(){
  const bals={}; try{Object.keys(LEAVE.pol||{}).forEach(t=>{const b=balance(t); if(b)bals[t]=b;});}catch(e){}
  return JSON.stringify({me:ME?{name:ME.name,emp_code:ME.emp_code,manager:ME.manager?nameOfEmp(ME.manager):null}:null,
    leave_balances:bals,
    my_recent_leave:(LEAVE.mine||[]).slice(0,10).map(l=>({type:l.leave_type,from:l.from_date,to:l.to_date,days:l.days,status:l.status})),
    today:new Date().toISOString().slice(0,10)}).slice(0,9000);
}
async function aiRun(name,p){
  document.getElementById('aiDrawer').classList.remove('open');
  const set=(id,v)=>{const e=document.getElementById(id);if(e&&v!=null&&v!=='')e.value=v;};
  if(name==='draft_leave'){TAB='leave';render();await new Promise(r=>setTimeout(r,80));
    set('lt',p.leave_type||'casual');set('lf',p.from_date);set('lto',p.to_date);set('lr',p.reason||'');
    try{lhint();}catch(e){} return 'Opened a pre-filled leave request — review the dates and click Apply for leave.';}
  if(name==='draft_expense'){TAB='expenses';render();await new Promise(r=>setTimeout(r,80));
    set('e_cat',p.category||'travel');set('e_amt',p.amount);set('e_desc',p.description||'');set('e_date',p.incurred_on||'');if(p.project)set('e_proj',p.project);
    return 'Opened a pre-filled expense claim — review and click Submit claim.';}
  throw new Error('unknown action');
}
function mountAI(){AIAssist({app:APP,title:'HR assistant',
  system:"You are the HR assistant inside the HR Desk. You see the signed-in employee, their leave balances (entitlement/accrued/taken/pending/available per type) and recent requests. Answer questions about balances and process, and help them file leave or expense claims. Dates are ISO YYYY-MM-DD; resolve relative dates ('next Monday') from today. When they want time off, propose draft_leave; for a reimbursement, propose draft_expense. Never exceed the available balance without flagging it.",
  chips:['How much casual leave do I have left?','Draft leave for next Mon to Wed','File a travel expense for last Friday','What is pending my approval?'],
  context:aiCtx,
  actions:[{name:'draft_leave',label:'Open pre-filled leave request',description:'params: leave_type (casual|sick|earned|unpaid|other), from_date (YYYY-MM-DD), to_date (YYYY-MM-DD), reason (string)'},
           {name:'draft_expense',label:'Open pre-filled expense claim',description:'params: category (travel|office|meals|other), amount (number INR), description (string), incurred_on (YYYY-MM-DD), project (optional code)'}],
  run:aiRun});}

boot().then(mountAI);
</script>
