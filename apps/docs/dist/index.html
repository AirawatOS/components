<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Docs</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/shared/aos.css">
<link rel="stylesheet" href="/shared/workspace.css">
<style>
  /* App-specific only — tokens from aos.css, the frame from workspace.css. The page itself stays paper-white. */
  :root{--paper:#f7f6f3;--paper-ink:#1a1a1a}
  .titlein{flex:1;min-width:120px;background:transparent;border:1px solid transparent;color:var(--ink);font:600 16px/1.4 var(--sans);padding:4px 8px;border-radius:8px}
  .titlein:hover,.titlein:focus{background:var(--panel2);border-color:var(--line);outline:none}
  .status{font-size:12px;color:var(--dim);white-space:nowrap} .status.saving{color:var(--warn)} .status.saved{color:var(--good)} .status.err{color:var(--danger)}
  .fmt{display:flex;gap:2px;align-items:center;padding:5px 12px;border-bottom:1px solid var(--line);flex-wrap:wrap}
  .tb{background:transparent;border:1px solid transparent;color:var(--dim);border-radius:7px;height:30px;min-width:30px;padding:0 8px;cursor:pointer;font:600 13px/1 var(--sans)}
  .tb:hover{background:var(--panel2);color:var(--ink);border-color:var(--line)} .tb.active{color:var(--ink);background:var(--panel2);border-color:var(--line)}
  .sep{width:1px;height:20px;background:var(--line);margin:0 5px}
  .scroll{flex:1;overflow:auto;display:flex;justify-content:center;align-items:flex-start;padding:26px 18px 60px;min-height:0}
  .paper{width:100%;max-width:780px;background:var(--paper);color:var(--paper-ink);border-radius:8px;box-shadow:0 8px 30px rgba(0,0,0,.35);padding:56px 64px;min-height:70vh;flex:0 0 auto}
  .paper:focus{outline:none}
  .paper h1{font-size:28px;margin:.4em 0 .3em} .paper h2{font-size:22px;margin:.6em 0 .3em} .paper h3{font-size:18px;margin:.6em 0 .3em}
  .paper p{margin:.5em 0} .paper ul,.paper ol{margin:.5em 0 .5em 1.4em} .paper blockquote{border-left:3px solid #d3cfc4;margin:.6em 0;padding:.2em 0 .2em 14px;color:#555}
  .paper a{color:#2f5fdd} .paper code{background:#ececec;border-radius:4px;padding:1px 5px;font-family:var(--mono);font-size:.92em}
  .paper img{max-width:100%;border-radius:6px}
  .paper:empty:before{content:attr(data-ph);color:#b7b3ab}
  /* AI assistant (a tab of the right pane) */
  .ai{display:flex;flex-direction:column;gap:10px}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{background:var(--bg);border:1px solid var(--line);border-radius:16px;padding:5px 11px;font-size:12.5px;cursor:pointer;color:var(--ink)}
  .chip:hover{border-color:var(--accent)}
  .ai textarea{min-height:74px;resize:vertical}
  .ai .res{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px;font-size:13px;white-space:pre-wrap;max-height:34vh;overflow:auto}
  .spin{display:inline-block;width:13px;height:13px;border:2px solid #ffffff55;border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px}
  @keyframes sp{to{transform:rotate(360deg)}}
</style></head>
<body class="ws">
<nav class="ws-top" id="ws-top" aria-label="Location"></nav>
<div class="ws-app">
  <aside class="ws-left" id="ws-left" aria-label="Documents">
    <div class="ws-left-top">
      <input id="ws-search" type="search" placeholder="Search documents…" autocomplete="off" aria-label="Search documents">
      <button class="ws-ib" id="ws-collapse" title="Hide this pane">«</button>
    </div>
    <button class="btn pri ws-new" id="newBtn">＋ New document</button>
    <div class="ws-nav">
      <button class="ws-nav-item on" data-v="mine"><span class="ic">📝</span>My documents<span class="ct"></span></button>
      <button class="ws-nav-item" data-v="recent"><span class="ic">🕒</span>Recent</button>
    </div>
    <div class="ws-sect" id="ws-listhead">All documents</div>
    <div class="ws-scroll" id="ws-list"></div>
    <div class="ws-railbox"><button class="ws-ib" id="ws-expand" title="Show this pane">»</button><div class="ws-railname" id="ws-railname">Docs</div></div>
  </aside>

  <main class="ws-main" id="ws-main">
    <div class="ws-toolbar">
      <input class="titlein" id="title" placeholder="Untitled document" autocomplete="off" aria-label="Document title">
      <span class="status" id="status"></span>
      <button class="btn sm" id="aiToggle" title="AI assistant">✨ AI</button>
      <button class="ws-ib" id="infoBtn" title="Details and history">ⓘ</button>
      <button class="ws-ib" id="delBtn" title="Move to trash">🗑</button>
    </div>
    <div class="fmt" id="toolbar">
      <button class="tb" data-cmd="bold" title="Bold (⌘B)"><b>B</b></button>
      <button class="tb" data-cmd="italic" title="Italic (⌘I)"><i>I</i></button>
      <button class="tb" data-cmd="underline" title="Underline (⌘U)"><u>U</u></button>
      <span class="sep"></span>
      <button class="tb" data-block="H1" title="Heading 1">H1</button>
      <button class="tb" data-block="H2" title="Heading 2">H2</button>
      <button class="tb" data-block="H3" title="Heading 3">H3</button>
      <button class="tb" data-block="P" title="Body text">¶</button>
      <span class="sep"></span>
      <button class="tb" data-cmd="insertUnorderedList" title="Bulleted list">•</button>
      <button class="tb" data-cmd="insertOrderedList" title="Numbered list">1.</button>
      <button class="tb" data-block="BLOCKQUOTE" title="Quote">❝</button>
      <button class="tb" data-cmd="link" title="Link">🔗</button>
      <button class="tb" data-cmd="removeFormat" title="Clear formatting">✕</button>
    </div>
    <div class="scroll"><div class="paper" id="editor" data-voice data-voice-mount="#toolbar" contenteditable="true" spellcheck="true" data-ph="Start writing, or press ✨ AI to draft something…"></div></div>
    <div class="ws-foot"><span id="wc">0 words</span></div>
  </main>

  <aside class="ws-right" id="ws-right" aria-label="Details">
    <div class="ws-right-head"><span class="t"></span><button class="ws-ib" id="ws-rclose" title="Close (Esc)">✕</button></div>
    <div class="ws-right-sub"></div>
    <div class="ws-tabs"><button class="ws-tab on" data-t="info">Info</button><button class="ws-tab" data-t="hist">History</button><button class="ws-tab" data-t="ai">✨ AI</button></div>
    <div class="ws-right-body">
      <div id="rp-info"></div><div id="rp-hist" hidden></div>
      <div id="rp-ai" class="ai" hidden>
        <div class="muted">Acts on your selection — or the whole document if nothing is selected.</div>
        <div class="chips" id="chips"></div>
        <textarea id="aiprompt" data-voice placeholder="Or tell the AI what to write… e.g. 'Draft a project kickoff note for the drainage upgrade'"></textarea>
        <button class="btn pri" id="aigo">Generate</button>
        <div id="airesWrap" style="display:none">
          <div class="muted">Result</div>
          <div class="res" id="aires"></div>
          <div style="display:flex;gap:6px;margin-top:8px">
            <button class="btn pri sm" id="aiInsert">Insert</button>
            <button class="btn sm" id="aiReplace">Replace selection</button>
            <button class="btn sm" id="aiCopy">Copy</button>
          </div>
        </div>
      </div>
    </div>
  </aside>
</div>
<script src="/shared/workspace.js"></script>
<script>
const $=id=>document.getElementById(id);
const esc=s=>(s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let ME={sub:'',tenant:''}, DOCS=[], CUR=null, savet=null, savedRange=null, lastAI='', RTAB='info', LIST=null;

async function api(p,b){return fetch(p,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)}).then(r=>r.json());}
async function boot(){
  try{const s=await fetch('/session').then(r=>r.json()); ME.sub=s.sub||''; ME.tenant=s.tenant||'';}catch(e){}
  WS.init({onTab:t=>{RTAB=t; renderRight();}});
  LIST=WS.itemList({items:()=>DOCS, current:()=>CUR&&CUR.id, open:openDoc, title:d=>d.title||'Untitled document',
    meta:d=>snippet(d.body), noun:'documents', empty:'No documents yet — press ＋ New document.'});
  await loadDocs();
  wireToolbar(); wireEditor(); wireAI();
  $('newBtn').onclick=newDoc;
  $('title').oninput=()=>{ if(CUR){CUR.title=$('title').value; scheduleSave(); renderList(); crumbs(); } };
  $('delBtn').onclick=trashDoc;
  $('infoBtn').onclick=()=>openRight('info');
  if(DOCS.length) openDoc(mostRecent().id); else newDoc();
}
function mostRecent(){ return DOCS.slice().sort((a,b)=>(b.updated_at||'').localeCompare(a.updated_at||''))[0]; }
async function loadDocs(){
  const r=await api('/bridge/query',{app_id:'docs',schema:'doc.document'});
  DOCS=(r.results||[]).map(x=>x.object||x).filter(d=>!d.archived);
  renderList();
}
function snippet(html){ const t=document.createElement('div'); t.innerHTML=html||''; return (t.textContent||'').replace(/\s+/g,' ').trim().slice(0,60); }
function renderList(){ if(LIST) LIST.render(); }
function crumbs(){ WS.crumbs([{label:'My documents'},{label:(CUR&&CUR.title)||'Untitled document'}]); }
function newDoc(){
  const id='ds:'+ME.tenant+':doc/document/'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
  const now=new Date().toISOString();
  CUR={schema:'doc.document',id,title:'',body:'',format:'html',owner:ME.sub,created_at:now,updated_at:now};
  DOCS.unshift(CUR); paint(); renderList(); setTimeout(()=>$('title').focus(),30);
}
function openDoc(id){ const d=DOCS.find(x=>x.id===id); if(!d)return; CUR=d; paint(); renderList(); }
function paint(){
  $('title').value=CUR.title||''; $('editor').innerHTML=CUR.body||'';
  updateWC(); setStatus(CUR._saved?'saved':''); crumbs(); if(WS.isRightOpen()) renderRight();
}
function words(){ const t=($('editor').textContent||'').trim(); return t?t.split(/\s+/).length:0; }
function updateWC(){ $('wc').textContent=words()+' words'; }
function setStatus(s,msg){ const el=$('status'); el.className='status'+(s?' '+s:'');
  el.textContent=s==='saving'?'Saving…':s==='saved'?'Saved':s==='err'?'⚠ '+msg:''; }
function scheduleSave(){ setStatus('saving'); clearTimeout(savet); savet=setTimeout(save,900); }
async function save(){
  if(!CUR)return;
  CUR.body=$('editor').innerHTML; CUR.title=$('title').value; CUR.updated_at=new Date().toISOString();
  const obj={...CUR}; delete obj._saved;
  const r=await api('/bridge/save',{app_id:'docs',object:obj});
  if(r.saved){ CUR._saved=true; setStatus('saved'); renderList(); } else setStatus('err', r.error||'save failed');
}
async function trashDoc(){
  if(!CUR)return; if(!confirm('Move "'+(CUR.title||'Untitled')+'" to trash?'))return;
  CUR.archived=true; await api('/bridge/save',{app_id:'docs',object:{...CUR,archived:true}});
  DOCS=DOCS.filter(d=>d.id!==CUR.id); CUR=null;
  if(DOCS.length)openDoc(mostRecent().id); else newDoc();
}
// ---- right pane: Info · History · AI ----
function openRight(t){ RTAB=t; WS.openRight((CUR&&CUR.title)||'Untitled document','Document'); WS.tab(t); renderRight(); }
function renderRight(){
  if(!CUR) return;
  ['info','hist','ai'].forEach(t=>{ $('rp-'+t).hidden = t!==RTAB; });
  const head=document.querySelector('#ws-right .ws-right-head .t'); if(head) head.textContent=CUR.title||'Untitled document';
  if(RTAB==='info') WS.info($('rp-info'),[['Title',CUR.title||'Untitled document'],['Words',words()],['Created',WS.when(CUR.created_at)],
     ['Last edited',WS.when(CUR.updated_at)],['Owner',String(CUR.owner||'').split('/').pop()],['Saved',CUR._saved||CUR.updated_at!==CUR.created_at?'Yes':'Not yet']]);
  if(RTAB==='hist') WS.history($('rp-hist'),'docs',CUR.id,(o,old)=>o.title!==old.title?'Renamed from “'+(old.title||'Untitled')+'”':'Edited');
}
// ---- toolbar / editor ----
function wireToolbar(){
  $('toolbar').querySelectorAll('[data-cmd]').forEach(b=>b.onmousedown=e=>{e.preventDefault();
    const c=b.dataset.cmd;
    if(c==='link'){ const u=prompt('Link URL:','https://'); if(u)document.execCommand('createLink',false,u); }
    else document.execCommand(c,false,null);
    $('editor').focus(); syncToolbar(); onEdit(); });
  $('toolbar').querySelectorAll('[data-block]').forEach(b=>b.onmousedown=e=>{e.preventDefault();
    document.execCommand('formatBlock',false,b.dataset.block); $('editor').focus(); syncToolbar(); onEdit(); });
}
function syncToolbar(){ try{['bold','italic','underline'].forEach(c=>{const el=document.querySelector('[data-cmd="'+c+'"]'); if(el)el.classList.toggle('active',document.queryCommandState(c));});}catch(e){} }
function onEdit(){ if(!CUR)return; CUR.body=$('editor').innerHTML; updateWC(); scheduleSave(); }
function wireEditor(){
  const ed=$('editor');
  ed.oninput=onEdit; ed.onkeyup=syncToolbar; ed.onmouseup=()=>{saveSel();syncToolbar();};
  ed.onblur=saveSel;
  ed.onkeydown=e=>{ if((e.metaKey||e.ctrlKey)&&e.key==='s'){e.preventDefault();save();} };
}
function saveSel(){ const s=window.getSelection(); if(s&&s.rangeCount&&$('editor').contains(s.anchorNode)) savedRange=s.getRangeAt(0).cloneRange(); }
function restoreSel(){ if(!savedRange)return false; const s=window.getSelection(); s.removeAllRanges(); s.addRange(savedRange); return true; }
function selectedText(){ const s=window.getSelection(); return (savedRange? savedRange.toString() : (s?s.toString():'')) || ''; }
// ---- AI ----
const AI_ACTIONS=[['✍️ Draft','draft'],['➡️ Continue','continue'],['✨ Improve','rewrite'],['✂️ Shorten','shorten'],['➕ Expand','lengthen'],['✅ Fix grammar','grammar'],['📝 Summarise','summarize'],['• To bullets','bullets'],['👔 Professional tone','tone']];
function wireAI(){
  $('chips').innerHTML=AI_ACTIONS.map(([label,task])=>`<span class="chip" data-task="${task}">${label}</span>`).join('');
  $('chips').querySelectorAll('[data-task]').forEach(c=>c.onclick=()=>runAI(c.dataset.task));
  $('aiToggle').onclick=()=>{ saveSel(); if(WS.isRightOpen()&&RTAB==='ai') WS.closeRight(); else openRight('ai'); };
  $('aigo').onclick=()=>runAI('draft');
  $('aiInsert').onclick=()=>insertAI(false); $('aiReplace').onclick=()=>insertAI(true);
  $('aiCopy').onclick=()=>{navigator.clipboard&&navigator.clipboard.writeText(lastAI);};
}
async function runAI(task){
  const prompt=($('aiprompt').value||'').trim();
  const sel=selectedText();
  const context = sel || ($('editor').textContent||'');
  if(task!=='draft' && !context.trim() && !prompt){ $('aiprompt').focus(); return; }
  const go=$('aigo'); go.disabled=true; const oldc=go.innerHTML; go.innerHTML='<span class="spin"></span> Thinking…';
  $('airesWrap').style.display='none';
  try{
    const r=await api('/bridge/ai-assist',{app_id:'docs',task,prompt,context:context.slice(0,9000),format:'html',title:(CUR&&CUR.title)||''});
    lastAI = r.content || ('⚠ '+(r.error||'no response'));
    $('aires').innerHTML = r.content? r.content : esc(lastAI);
    $('airesWrap').style.display='block';
  }catch(e){ $('aires').textContent='⚠ '+e; $('airesWrap').style.display='block'; }
  go.disabled=false; go.innerHTML=oldc;
}
function insertAI(replace){
  if(!lastAI)return;
  $('editor').focus(); restoreSel();
  document.execCommand('insertHTML',false,lastAI);
  onEdit(); saveSel();
}
boot();
</script>
<script src="/shared/voice.js" defer></script>
</body></html>
