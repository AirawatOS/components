# LUCKNOW 3D (kind=app) — a photoreal 3D viewer for the AI-City twin. Renders the greenfield LAND-USE PLAN
# (developable vacant cells → zoning → massing, from the shared planner) over the real building footprints on a
# CesiumJS globe. Tokenless it shows our own geometry; with a Cesium ion token (set at install) it gains world
# terrain + real-city 3D buildings + imagery. Same governed plan as City Scan's "Land-use plan (3D)" overlay —
# ONE plan (LandUsePlan.computePlan), TWO renderers (deck.gl analytical + Cesium premium).
component_id: ds:airawatdeveloper:app/lucknow-3d
kind: app
version: 0.3.0   # 0.3.0: buildings match LAND USE — type + silhouette derive from the zone (AI towers, data-centre sheds, stepped resi, etc.) + land-use ground tint
# 0.2.1: zones/parcels scaled to the ACTUAL district bounds (were tiling the whole AOI) + breadcrumb moved below the title
# 0.2.0: digital-twin Phase 1 — DigitalTwinState + Repository (demo) + LayerManager seam + shell (breadcrumb/lifecycle/lens/inspector) + City→Zone→Parcel→Building drilldown (ES modules over the render)
provider: ds:airawat:developer
display_name: AI City - 3D
entrypoint: index.html
bundle: dist
sandboxed: true
# CSP PROFILE: Cesium needs Web Workers + WebAssembly, which the default app CSP (default-src 'none') blocks.
# app-host emits a relaxed CSP for csp_profile:3d — adds worker-src 'self' blob: + 'wasm-unsafe-eval' + blob: — while
# keeping connect-src pinned to 'self' (all external I/O still flows only through the host bridge). Opt-in, per app.
csp_profile: 3d
required_schemas: [geo.building, viz.layer]   # AI-City extent is an app setting (ai_city_aoi), not read from space.aoi
writes: []
roles: [platform.tenant-admin]
# APP SETTING (ADR-0027 component config): the AI-City precinct bounding box [minLon,minLat,maxLon,maxLat].
# The tenant AOI (space.aoi) covers all of Lucknow; the AI City is a specific precinct, so its extent is a
# separate, adjustable setting — defaulting IN THE APP to the original Sector-15 box. Also settable in the ⚙ panel.
config: [ai_city_aoi]
# INSTALL-TIME SECRET (component setup, ADR-0027): a Cesium ion access token. Kept SERVER-SIDE in Vault (set via the
# Components app → Set/Rotate) and injected by the host's ion tile-proxy — it never reaches the browser, so the app
# holds no credential. Empty ⇒ tokenless preview (our own geometry only). Unlocks photoreal terrain + OSM Buildings.
secrets: [CESIUM_ION_TOKEN]
# DECLARED EGRESS (broker-for-apps): Cesium's terrain/3d-tiles/imagery/ion-endpoint calls are proxied through the
# host's /bridge/tile to these hosts ONLY (the CSP still blocks direct calls); the host injects the ion token.
egress:
  - { host: "*.cesium.com", rate_per_min: 1200 }        # ion API + World Terrain + OSM Buildings 3d-tiles assets
  - { host: "*.arcgisonline.com", rate_per_min: 1800 }  # Esri World Imagery satellite tiles (the basemap — no JSONP)
  - { host: tile.googleapis.com, rate_per_min: 600 }     # Google Photorealistic 3D Tiles (optional)
sources:
  - { ref: "ds:airawat:ref/source/cesium-ion", host: assets.ion.cesium.com, provides: [viz.basemap, viz.terrain] }
