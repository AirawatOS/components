<!doctype html><meta charset="utf-8"><title>Data</title>
<style>
  :root{--bg:#0d1117;--card:#161b22;--line:#21262d;--ink:#e6edf3;--dim:#8b949e;--accent:#3b82f6;--good:#3fb950}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  header{padding:12px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}
  h1{margin:0;font-size:16px} .who{margin-left:auto;color:var(--dim);font-size:12px}
  .layout{display:flex;height:calc(100vh - 49px)}
  .list{width:280px;flex:none;border-right:1px solid var(--line);overflow:auto}
  .it{padding:11px 14px;border-bottom:1px solid #1a1f27;cursor:pointer}
  .it:hover{background:#161b22} .it.sel{background:#1b2530;border-left:2px solid var(--accent)}
  .it .nm{font-weight:600;font-size:13px;text-transform:capitalize} .it .sub{color:#5f6b78;font-size:11px;font-family:ui-monospace,Menlo,monospace}
  .grp{padding:9px 14px 5px;color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.06em;background:#0f141b;border-bottom:1px solid #1a1f27;position:sticky;top:0}
  .detail{flex:1;overflow:auto;padding:18px 20px}
  .lbl{color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.05em;margin:16px 0 6px}
  /* the inline attribution surface — shown WITH the data, in context */
  .attrib{border:1px solid #24304a;background:#0f1723;border-radius:10px;padding:12px 14px;margin:0 0 16px}
  .attrib .hd{color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px}
  .src{margin:0 0 8px} .src:last-child{margin:0}
  .src .cred{color:var(--ink)} .src .meta{font-size:12px;color:var(--dim);margin-top:2px}
  .src a{color:var(--accent);font-size:12px;text-decoration:none;margin-right:12px}
  .chip{display:inline-block;background:#0d1117;border:1px solid var(--line);border-radius:999px;padding:1px 8px;font-size:11px;margin-right:8px;font-family:ui-monospace,Menlo,monospace}
  table{width:100%;border-collapse:collapse;font-size:12px;margin-top:4px}
  th{color:var(--dim);text-align:left;font-weight:500;padding:6px 8px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg)}
  td{padding:5px 8px;border-bottom:1px solid #1a1f27;font-family:ui-monospace,Menlo,monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:280px}
  .empty{color:var(--dim);text-align:center;padding:48px}
  .pager{display:flex;align-items:center;gap:8px;margin-top:12px;color:var(--dim);font-size:12px}
  .pbtn{border:1px solid var(--line);background:#161b22;color:var(--ink);border-radius:6px;padding:3px 9px;cursor:pointer}
  .pbtn:disabled{opacity:.4;cursor:default}
  .tabb{background:none;border:0;border-bottom:2px solid transparent;color:var(--dim);font:inherit;padding:6px 10px;cursor:pointer}
  .tabb.on{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
  .card{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:14px 16px;margin:0 0 16px;max-width:820px}
  .card h3{margin:0 0 10px;font-size:13px}
  .btn{border:1px solid var(--line);background:#161b22;color:var(--ink);border-radius:6px;padding:4px 11px;cursor:pointer;font:inherit;font-size:12px}
  .btn.p{background:var(--accent);border-color:var(--accent);color:#04121f;font-weight:600}
  .btn.d{border-color:#f85149;color:#f85149}
  #net input,#net select,#net textarea{background:#0d1117;border:1px solid var(--line);color:var(--ink);border-radius:6px;padding:5px 8px;font:inherit}
  .row2{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:6px 0}
  .off{border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin:8px 0;background:#0f141b}
  .muted{color:var(--dim);font-size:12px}
  .ver{border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:8px;padding:10px 12px;margin:8px 0;background:#0f141b}
  .ver.tomb{border-left-color:#f85149;opacity:.85}
  .verhd{font-weight:700;font-size:13px;margin-bottom:4px}
  .difflist{margin-top:6px;border-top:1px solid var(--line);padding-top:6px}
  .chg{font:12px/1.6 ui-monospace,Menlo,monospace;color:var(--ink)}
  .chg .del{color:#f85149} .chg .ins{color:var(--good)}
</style>
<header><h1>📂 Data</h1>
  <button class="tabb on" id="tab-browse" onclick="setTab('browse')">Browse</button>
  <button class="tabb" id="tab-net" onclick="setTab('net')">Network 🔗</button>
  <span class="who" id="who"></span></header>
<div id="browse"><div class="layout">
  <div class="list" id="list"></div>
  <div class="detail" id="detail"><div class="empty">Select a dataset to browse the data you have access to.</div></div>
</div></div>
<div id="net" style="display:none;padding:18px 22px;overflow:auto;height:calc(100vh - 49px)"></div>
<script>
// The Data app is a GOVERNED DATA BROWSER: it lists every governed schema that actually has rows in the
// caller's tenant (from /bridge/data-schemas, which excludes sensitivity=sensitive schemas), grouped by
// domain. The user only ever SEES rows the kernel returns under their token — a user's read is tenant-scoped
// and RBAC-gated at the kernel boundary, not here.
const DOMAIN_LABEL={air:'Air quality',cell:'Cells (H3)',geo:'Geospatial',demographics:'Demographics',econ:'Economy',
  environment:'Environment',met:'Meteorology',project:'Projects',finance:'Finance',funding:'Funding',hr:'HR',org:'Organisation',
  waste:'Solid waste',welfare:'Welfare',tax:'Tax',campaign:'Campaigns',chat:'Chat',mail:'Mail',platform:'Platform',
  governance:'Governance',prov:'Provenance',space:'Space / AOI',ref:'Reference',city:'City',metering:'Metering',
  signal:'Signals / alerts',doc:'Documents',knowledge:'Knowledge',justice:'Justice',stat:'Statistics',credential:'Credentials',
  interaction:'Interactions',safety:'Safety',mobility:'Mobility',infra:'Infrastructure',plan:'Planning',viz:'Map layers'};
const DSET=[];                     // discovered [{schema, count, domain}]
let APPID, SEL=null, CUR=null, PAGE=[];
async function jpost(p,b){const r=await fetch(p,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});return {ok:r.ok,status:r.status,j:await r.json().catch(()=>({}))};}
function esc(s){return (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function subject(s){return s.split('.',2)[1]||s;}
function renderList(){
  const byDom={}; DSET.forEach(d=>{(byDom[d.domain]=byDom[d.domain]||[]).push(d);});
  const doms=Object.keys(byDom).sort((a,b)=>(DOMAIN_LABEL[a]||a).localeCompare(DOMAIN_LABEL[b]||b));
  document.getElementById('list').innerHTML = doms.map(dom=>
    `<div class="grp">${esc(DOMAIN_LABEL[dom]||dom)}</div>`+
    byDom[dom].map(d=>`<div class="it" data-s="${esc(d.schema)}">
      <div class="nm">${esc(subject(d.schema).replace(/_/g,' '))}</div>
      <div class="sub">${esc(d.schema)}${d.count!=null?' · '+d.count.toLocaleString():''}</div></div>`).join('')
  ).join('') || '<div class="empty" style="padding:24px">No data in this tenant yet.</div>';
  document.querySelectorAll('.it').forEach(el=>el.onclick=()=>{
    document.querySelectorAll('.it').forEach(x=>x.classList.remove('sel')); el.classList.add('sel');
    SEL={schema:el.dataset.s, name:subject(el.dataset.s).replace(/_/g,' ')}; CUR=null; PAGE=[]; load(true);});
}
async function boot(){
  const cfg=await fetch('./config.json').then(r=>r.json()); APPID=cfg.app_id;
  fetch('/session').then(r=>r.json()).then(s=>{document.getElementById('who').textContent=s.authenticated?('● '+s.sub):'';
    TENANT=s.tenant||(s.sub||'').split('/')[2]||''; ROLES=s.roles||[];}).catch(()=>{});
  document.getElementById('list').innerHTML='<div class="empty" style="padding:24px">Discovering datasets…</div>';
  const r=await jpost('/bridge/data-schemas',{});
  if(r.ok&&r.j.schemas){ DSET.push(...r.j.schemas); renderList(); }
  else { document.getElementById('list').innerHTML=`<div class="empty" style="padding:24px">Could not list datasets (${r.status||'?'}).</div>`; }
}
function attribBox(attr){
  if(!attr||!attr.length) return '<div class="attrib"><div class="hd">Data sources</div><div class="meta" style="color:var(--dim)">no external-source attribution recorded for this data</div></div>';
  const lk=(u,t)=>u?`<a href="${esc(u)}" target="_blank" rel="noopener">${t} ↗</a>`:'';
  return `<div class="attrib"><div class="hd">Data sources — attribution &amp; licence</div>`+
    attr.map(s=>`<div class="src"><div class="cred">${esc(s.attribution||s.source_id)}</div>
      <div class="meta">${s.license&&s.license.id?`<span class="chip">${esc(s.license.id)}</span>`:''}${lk(s.license&&s.license.url,'licence')}${lk(s.terms_url,'terms')}${lk(s.url,'source')}</div></div>`).join('')+
    `</div>`;
}
function columns(rows){
  const skip=new Set(['schema','conforms_to','prov']); const cols=[];
  for(const r of rows.slice(0,20)) for(const k of Object.keys(r)){
    const v=r[k]; if(skip.has(k)||cols.includes(k)) continue;
    if(v==null||typeof v==='object') { if(k!=='space') continue; } cols.push(k);
  }
  const ordered=['id',...cols.filter(c=>c!=='id')]; return ordered.slice(0,7);
}
function cell(v){ if(v==null)return ''; if(typeof v==='object'){ if(v.h3)return v.h3; if(Array.isArray(v))return v.join(','); return JSON.stringify(v).slice(0,40);} return String(v); }
function showRec(i){
  const o=PAGE[i]; if(!o)return;
  const R=document.getElementById('rec'); if(!R)return;
  R.innerHTML=`<div class="row2" style="margin:14px 0 8px">
      <button class="tabb on" id="rt-detail">Record</button>
      <button class="tabb" id="rt-hist">History ⟲</button>
      <span class="muted" style="margin-left:auto">${esc(o.id||'')}</span></div>
    <div id="recbody"></div>`;
  const detail=()=>document.getElementById('recbody').innerHTML=
    `<pre style="background:#0d1117;border:1px solid var(--line);border-radius:8px;padding:12px 14px;overflow:auto;font:12px/1.5 ui-monospace,Menlo,monospace;color:var(--ink);white-space:pre;max-height:340px">${esc(JSON.stringify(o,null,2))}</pre>`;
  const sel=t=>{document.getElementById('rt-detail').classList.toggle('on',t==='d');document.getElementById('rt-hist').classList.toggle('on',t==='h');};
  document.getElementById('rt-detail').onclick=()=>{sel('d');detail();};
  document.getElementById('rt-hist').onclick=()=>{sel('h');renderHistory(o.id);};
  detail(); R.scrollIntoView({behavior:'smooth',block:'nearest'});
}
// The BITEMPORAL registry made visible: /bridge/history returns every version of a record with BOTH time axes
// (valid = true-in-the-world; transaction = when we recorded it), the writing agent (component obo user), and
// tombstones. We render newest-first and diff each version against the next-older one — so you see who changed
// what, when, and under which belief. This is the append-only, attributed, tamper-evident audit trail as UI.
function fmtAgent(a){ if(!a) return '<span class="muted">unknown</span>';
  const m=/component:\/\/([^ ]+?)(?:@[^ ]*)?\s+obo\s+user:\/\/(.+)/.exec(a);
  if(m) return `<b>${esc(m[1].split('/').pop())}</b> <span class="muted">on behalf of</span> ${esc(m[2].split('/').pop())}`;
  return esc(String(a).replace(/^user:\/\//,'').replace(/^component:\/\//,''));
}
function trunc(s){ s=(s==null?'':String(s)); return s.length>60?s.slice(0,57)+'…':s; }
function diffFields(a,b){
  const skip=new Set(['conforms_to','prov','schema','id','tenant']);
  if(!a) return '<div class="chg"><span class="ins">created</span></div>';
  const keys=[...new Set([...Object.keys(a||{}),...Object.keys(b||{})])].filter(k=>!skip.has(k));
  const rows=[];
  for(const k of keys){ const av=JSON.stringify(a?.[k]), bv=JSON.stringify(b?.[k]); if(av===bv) continue;
    rows.push(`<div class="chg"><b>${esc(k)}</b> <span class="del">${esc(trunc(av===undefined?'∅':av))}</span> → <span class="ins">${esc(trunc(bv===undefined?'∅':bv))}</span></div>`); }
  return rows.length?rows.join(''):'<div class="chg muted">no field changes</div>';
}
async function renderHistory(id){
  const B=document.getElementById('recbody'); if(!B) return;
  B.innerHTML='<div class="muted" style="padding:8px">Loading version history…</div>';
  const r=await jpost('/bridge/history',{app_id:APPID,id});
  if(!r.ok){ B.innerHTML=`<div class="muted" style="padding:8px">could not load history (${r.status||'?'})</div>`; return; }
  const H=r.j.history||[];
  if(!H.length){ B.innerHTML='<div class="muted" style="padding:8px">no version history recorded</div>'; return; }
  B.innerHTML=`<div class="muted" style="margin:2px 0 10px">${H.length} version${H.length>1?'s':''} · newest first · valid = true-in-world, recorded = when the system learned it</div>`+
    H.map((v,idx)=>{ const older=H[idx+1]; const tt=v.transaction_time||{}, vt=v.valid_time||{};
      return `<div class="ver${v.retracted?' tomb':''}">
        <div class="verhd">v${esc(v.version)}${v.retracted?' · <span class="del">retracted (tombstone)</span>':idx===0?' · <span class="ins">current</span>':''}</div>
        <div class="meta">recorded ${esc(tt.from||'—')}${tt.to?(' → '+esc(tt.to)):''}</div>
        <div class="meta">valid ${esc(vt.from||'—')}${vt.to?(' → '+esc(vt.to)):''}</div>
        <div class="meta">by ${fmtAgent(v.wrote_by)}</div>
        <div class="difflist">${diffFields(older&&older.object, v.object)}</div></div>`;
    }).join('');
}
async function load(reset){
  const D=document.getElementById('detail');
  const r=await jpost('/bridge/query',{app_id:APPID,schema:SEL.schema,paginate:true,limit:25,cursor:reset?null:CUR});
  if(!r.ok){D.innerHTML=`<div class="empty">could not read ${esc(SEL.schema)} (${r.status})</div>`;return;}
  const rows=(r.j.results||[]).map(x=>x.object||x); PAGE=reset?rows:PAGE.concat(rows); CUR=r.j.next_cursor||null;
  const cols=columns(PAGE);
  D.innerHTML=`<div style="font-weight:600;font-size:15px">${esc(SEL.name)}</div>
    <div class="sub" style="color:#5f6b78;font-family:ui-monospace,Menlo,monospace;font-size:11px;margin:2px 0 14px">${esc(SEL.schema)}</div>
    ${attribBox(r.j.attributions)}
    <div class="lbl">Records (${PAGE.length}${CUR?'+':''})</div>
    ${PAGE.length?`<div style="overflow:auto"><table><tr>${cols.map(c=>`<th>${esc(c)}</th>`).join('')}</tr>
      ${PAGE.map((o,i)=>`<tr data-i="${i}" style="cursor:pointer" title="click for the full record">${cols.map(c=>`<td>${esc(cell(o[c]))}</td>`).join('')}</tr>`).join('')}</table></div>`
      :'<div class="empty">no records you can access in this dataset</div>'}
    <div class="pager">${CUR?'<button class="pbtn" id="more">Load more</button>':'<span>— end —</span>'}</div>
    <div id="rec"></div>`;
  const m=document.getElementById('more'); if(m)m.onclick=()=>load(false);
  document.querySelectorAll('tr[data-i]').forEach(tr=>tr.onclick=()=>showRec(+tr.dataset.i));
}
// ---- Data Exchange (ADR-0087 R1): all network ops go through the GENERIC /bridge/gov proxy — this app declares
//      calls:[network.data_exchange@0.1.0] in its meta; there is NO bespoke host bridge per operation. ----
let TENANT='', ROLES=[];
function setTab(t){
  document.getElementById('browse').style.display = t==='browse'?'':'none';
  document.getElementById('net').style.display = t==='net'?'':'none';
  document.getElementById('tab-browse').classList.toggle('on',t==='browse');
  document.getElementById('tab-net').classList.toggle('on',t==='net');
  if(t==='net') renderNet();
}
async function gov(op,payload){
  const r=await jpost('/bridge/gov',{interface:'network.data_exchange@0.1.0',op,app_id:APPID,payload:payload||{}});
  if(!r.ok) return {__err:(r.j&&r.j.error)||('HTTP '+r.status)};
  return r.j.result||r.j||{};
}
function offSlug(s){return (s||'').replace(/[^a-z0-9]+/gi,'-').toLowerCase();}
async function doPublish(){
  const sch=document.getElementById('pub-sch').value, title=document.getElementById('pub-title').value.trim();
  if(!sch||!title){alert('pick a dataset and enter a title');return;}
  const id=`ds:${TENANT}:offering/${offSlug(subject(sch))}`;
  const res=await gov('publish-offering',{id,title,data_schema:sch,domain:sch.split('.')[0],description:document.getElementById('pub-desc').value.trim(),access_mode:'request'});
  alert(res.__err? ('Publish failed: '+res.__err) : ('Shared on network: '+((res.offering||{}).id||id))); renderNet();
}
async function doRequest(oid){
  const purpose=prompt('Why do you need this data? (purpose, recorded on the request)','')||'';
  // NB: component_id is injected by the host from the app's certificate (the app never asserts its own cid).
  const res=await gov('request',{offering_id:oid,purpose});
  alert(res.__err? ('Request failed: '+res.__err) : ('Request filed — the owner will decide. '+(res.filed||''))); renderNet();
}
// THE READER: once the owner has approved (consumer-bound, offering-scoped grant), read the foreign rows IN
// PLACE via the aggregator lane — /bridge/query with the provider tenant. The kernel authorizes ONLY this
// tenant's copy of the app (consumer_tenant binding) and returns the owner's rows without any copy.
function offTenantSlug(o){ const t=o.tenant||o._prov||''; const m=/^ds:([^:]+):/.exec(t); return m?m[1]:t; }
async function doBrowse(schema, tenant, title){
  const P=document.getElementById('shared-preview');
  P.innerHTML=`<div class="card"><div class="muted">Reading ${esc(schema)} from ${esc(tenant)} in place…</div></div>`;
  const r=await jpost('/bridge/query',{app_id:APPID,schema,tenant,paginate:true,limit:25});
  if(!r.ok){ P.innerHTML=`<div class="card"><b>${esc(title)}</b> — cannot read (HTTP ${r.status}). Request access first, then have the owner approve.</div>`; return; }
  const rows=(r.j.results||[]).map(x=>x.object||x);
  if(!rows.length){ P.innerHTML=`<div class="card"><b>${esc(title)}</b> — 0 rows (no active grant for your tenant, or the dataset is empty).</div>`; return; }
  const cols=columns(rows);
  P.innerHTML=`<div class="card"><b>${esc(title)}</b> <span class="muted">— ${rows.length} rows from <b>${esc(tenant)}</b>, read in place under a signed grant</span>
    <div style="overflow:auto;margin-top:8px"><table><tr>${cols.map(c=>`<th>${esc(c)}</th>`).join('')}</tr>
    ${rows.map(o=>`<tr>${cols.map(c=>`<td>${esc(cell(o[c]))}</td>`).join('')}</tr>`).join('')}</table></div></div>`;
  P.scrollIntoView({behavior:'smooth',block:'nearest'});
}
async function doDecide(rid,dec){ const res=await gov('decide',{request_id:rid,decision:dec}); alert(res.__err?('Failed: '+res.__err):(dec+' → '+((res.grant||{}).issued||res.decision||'done'))); renderNet(); }
async function doRetire(oid){ if(!confirm('Remove from network? Others stop discovering it (existing grants stay until revoked).'))return; const res=await gov('retire-offering',{id:oid}); alert(res.__err?('Failed: '+res.__err):'Retired'); renderNet(); }
async function doRevoke(gid){ if(!confirm('Revoke this access grant? The consumer immediately loses access.'))return; const res=await gov('revoke',{grant_id:gid}); alert(res.__err?('Failed: '+res.__err):'Revoked'); renderNet(); }
function offProvider(o){ const p=o.provider; return typeof p==='object'&&p ? (p.id||p.tenant||'') : (p||''); }
function offSchema(o){ return o.data_schema||o.schema_ref||o.schema||''; }
async function renderNet(){
  const N=document.getElementById('net'); N.innerHTML='<div class="muted">Loading the network Data Exchange…</div>';
  const disc=await gov('discover',{}); const offs=(disc.offerings||[]).map(o=>({...o, _prov:offProvider(o), _schema:offSchema(o)}));
  const mine=offs.filter(o=>o._prov===TENANT||(o._prov||'').includes(':'+TENANT+':')||(o._prov||'').startsWith('ds:'+TENANT)), others=offs.filter(o=>!mine.includes(o));
  const reqs=((await gov('requests',{tenant:TENANT})).requests)||[];
  const opts=DSET.map(d=>`<option value="${esc(d.schema)}">${esc(subject(d.schema).replace(/_/g,' '))} (${esc(d.schema)})</option>`).join('');
  N.innerHTML=`
   <div id="shared-preview"></div>
   <div class="card"><h3>📤 Share a dataset on the network</h3>
     <div class="row2"><select id="pub-sch">${opts||'<option>— no datasets —</option>'}</select>
       <input id="pub-title" placeholder="Offering title" style="min-width:220px"></div>
     <div class="row2"><input id="pub-desc" placeholder="Short description (optional)" style="min-width:360px">
       <button class="btn p" onclick="doPublish()">Share on network</button></div>
     <div class="muted">Shares by REFERENCE — the data stays in your registry; approved consumers read it in place under a signed grant.</div></div>
   <div class="card"><h3>🔎 Discover data on the network (${others.length})</h3>
     ${others.length? others.map(o=>`<div class="off"><b>${esc(o.title||o.id)}</b> <span class="chip">${esc(o._schema)}</span>
        <div class="muted">from <b>${esc(o._prov)}</b>${o.jurisdiction?(' · '+esc(o.jurisdiction)):''} · ${esc(o.access_mode||o.visibility||'request')}</div>
        <div class="muted">${esc(o.description||'')}</div>
        <div class="row2"><button class="btn" onclick="doRequest('${esc(o.id)}')">Request access</button>
          <button class="btn" onclick="doBrowse('${esc(o._schema)}','${esc(offTenantSlug(o))}','${esc(o.title||o.id)}')">Browse shared data</button></div></div>`).join('')
      : '<div class="muted">No offerings from other participants yet.</div>'}</div>
   <div class="card"><h3>📥 Requests for MY data (${reqs.length})</h3>
     ${reqs.length? reqs.map(r=>`<div class="off"><b>${esc(r.requested_by||r.component_id)}</b> requests <span class="chip">${esc((r.reads||[]).join(', ')||r.offering_id||'')}</span>
        <div class="muted">purpose: ${esc(r.purpose||'—')} · status: <b>${esc(r.status)}</b></div>
        <div class="row2">${r.status==='pending'?`<button class="btn p" onclick="doDecide('${esc(r.id)}','approve')">Approve</button>
          <button class="btn d" onclick="doDecide('${esc(r.id)}','reject')">Reject</button>`
          : (r.grant?`<button class="btn d" onclick="doRevoke('${esc(r.grant)}')">Revoke access</button>`:'')}</div></div>`).join('')
      : '<div class="muted">No inbound requests.</div>'}</div>
   <div class="card"><h3>📡 My shared datasets (${mine.length})</h3>
     ${mine.length? mine.map(o=>`<div class="off"><b>${esc(o.title||o.id)}</b> <span class="chip">${esc(o._schema)}</span> · ${esc(o.status||'active')}
        <div class="row2"><button class="btn d" onclick="doRetire('${esc(o.id)}')">Retire (stop sharing)</button></div></div>`).join('')
      : '<div class="muted">You have not shared any datasets yet.</div>'}</div>`;
}
boot();
</script>
