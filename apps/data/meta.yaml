# A UI app (kind=app). It lets a signed-in user BROWSE the data they have access to — every read is
# mediated by the app-host under the USER's token (so it shows only what they may see), and the app-host
# returns, alongside the records, the resolved `attributions` for the data sources behind them. The app
# renders those credits inline where the data is shown — discharging the licence/attribution obligation
# in context (the platform decides what to credit; the app cannot omit it). It declares required_schemas
# (its DATA allow-list) — the datasets it may browse.
component_id: ds:airawat:app/data
kind: app
version: 0.2.5   # 0.2.5: History tab — a record's full bitemporal version lineage (valid + transaction time),
#        writing agent (component obo user), tombstones, and field diffs, via /bridge/history. Visualises the
#        append-only, attributed registry. Requires app-host with the /bridge/history passthrough.
# 0.2.4: THE READER — "Browse shared data" reads a granted foreign schema IN PLACE (aggregator lane,
#        /bridge/query with the provider tenant). Safe because grants are now consumer-bound + offering-scoped
#        (kernel binds consumer_tenant). Requests no longer assert component_id — the host injects the full cid.
# 0.2.3: Network tab robustness — normalize offering provider ({id}|string) + schema (schema_ref) shapes
# 0.2.2: Network tab (Data Exchange) — publish/discover/request/decide/retire/revoke via the
#        GENERIC /bridge/gov proxy (ADR-0087 R1). The app DECLARES `calls: [network.data_exchange@0.1.0]`; there
#        is NO bespoke host bridge per operation and NO app-host rebuild for this or future network capabilities.
# 0.2.1: presence-based (fast, parallel, cached) dataset discovery
# 0.2.0: DATA BROWSER — lists every governed schema that has rows in the caller's tenant (via /bridge/data-schemas,
#        which excludes sensitivity=sensitive), grouped by domain, instead of a hardcoded 5-dataset list. The
#        `data_browser` flag relaxes the app-level read allow-list to any governed schema; the REAL gate is
#        unchanged — the kernel tenant-scopes + RBAC-gates every read under the user's token.
provider: ds:airawat:developer
display_name: Data
icon: 🧭
entrypoint: index.html
bundle: dist
sandboxed: true
data_browser: true
default_install: true   # base-OS default suite — every tenant receives the Data browser (pairs with Files)
required_schemas: [ref.source]
# ADR-0058 declared interfaces: the governed capabilities this app calls. The app-host's generic /bridge/gov
# dispatcher (ADR-0087 R1) verifies this list (fail-closed) before proxying any Data-Exchange op to the network.
calls: [network.data_exchange@0.1.0]
# ADR-0081 App-Agent surface — the DATA plane of the Personal Agent: let it answer questions from the tenant's
# governed data. roles "*" = ANY signed-in user (reads are tenant-scoped + RBAC-gated by the kernel under the
# user's own token, exactly like the Data app's browser — the agent can only read what the user may read).
agent_tools:
  - {name: list_data, kind: read, roles: "*", params: "query", desc: "List the governed data schemas you can query. NOTE the road/street NETWORK is geo.osm_feature (OSM highway ways; named generically, not 'road'); geo.road/geo.road_segment are named-street anchors; cell.roads is per-H3 road density. Other examples: works.work_order, air.quality, geo.building."}
  - {name: query_data, kind: read, roles: "*", params: "schema", desc: "Read one governed schema in your tenant — returns the TRUE total count + a sample. For 'how many roads', query geo.osm_feature (the OSM road network) AND cell.roads (density cells). Tenant-scoped to what you may see."}