# Sheets — the Airawat Workspace spreadsheet (kind=app). PART OF THE BASE OS PRODUCTIVITY SUITE.
# Personal + AI-native: every user has their own sheets, stored as governed doc.sheet facts (cells map ref→raw
# value/formula; bitemporal → version history). A small client formula engine (SUM/AVERAGE/MIN/MAX/COUNT +
# arithmetic + cell refs/ranges) computes values; the inline ✨AI generates a table from a description via the
# shared /bridge/ai-assist (Kimi K3). `personal: true` = self-service + owner-scoped (see app_host workspace runtime).
component_id: ds:airawatdeveloper:app/sheets
kind: app
version: 0.4.0   # 0.4.0: one Import (⤓) for tables and scans, from this computer or from My files (the Files app, owner-scoped via /bridge/vfs): CSV/TSV/TXT (delimiter detected, quoted fields, 1,48,41,881-style numbers optional) and Excel .xlsx (first sheet's values, read in the browser with DecompressionStream — no outside library; formulas without a stored result kept as Sheets formulas when the table starts at A1) into a new sheet or this sheet at the selected cell; scans (PDF/JPG/PNG) go to the register reader as before, and a scan already in My files is not uploaded again. Sheets grow to 52 columns (was a fixed 12). Up to 5,000 rows per import. 0.3.1: scans of any size upload in pieces under the front proxy's 1 MB limit (/bridge/upload-chunk); imported sheets get wider columns; where the register's own sums disagree, 'Keep as written' is the main action. 0.3.0: Import from scan — a scanned paper register (P.F.-1 PF Ledger first) becomes a spreadsheet: engine/register-ocr reads it in-house, cells are coloured by how sure the reading is (corrected / to check / sums disagree), and a Review tab shows each flagged cell cropped from the scan with the reading, the suggestion and the rule, to accept or type; every import is a doc.sheet_import kept with the sheet. Was 0.2.0: 0.2.0: the shared workspace layout (/shared/workspace.css + .js, same frame as Files and Data): left — search, ＋ New, My … / Recent, the list; main — title, save status, actions, the editor; right — Info and History (Docs: also the AI assistant); breadcrumb under the shell's controls; the old header (with a wrong 'not signed in' badge) removed. Was 0.1.0.
provider: ds:airawatdeveloper:developer
display_name: Sheets
icon: 📊
entrypoint: index.html
bundle: dist
sandboxed: true
personal: true
required_schemas: [doc.sheet, doc.sheet_import]
writes: [doc.sheet, doc.sheet_import]
roles: []

default_install: true   # part of the base-OS default suite every tenant receives
# ADR-0081: this app's App-Agent tools — the personal agent discovers + delegates to these
agent_tools:
  - {name: create_sheet, kind: write, params: "title,brief", desc: Draft and create a spreadsheet}
