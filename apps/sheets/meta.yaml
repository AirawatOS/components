# Sheets — the Airawat Workspace spreadsheet (kind=app). PART OF THE BASE OS PRODUCTIVITY SUITE.
# Personal + AI-native: every user has their own sheets, stored as governed doc.sheet facts (cells map ref→raw
# value/formula; bitemporal → version history). A small client formula engine (SUM/AVERAGE/MIN/MAX/COUNT +
# arithmetic + cell refs/ranges) computes values; the inline ✨AI generates a table from a description via the
# shared /bridge/ai-assist (Kimi K3). `personal: true` = self-service + owner-scoped (see app_host workspace runtime).
component_id: ds:airawat:app/sheets
kind: app
version: 0.1.0
provider: ds:airawat:developer
display_name: Sheets
entrypoint: index.html
bundle: dist
sandboxed: true
personal: true
required_schemas: [doc.sheet]
writes: [doc.sheet]
roles: []

default_install: true   # part of the base-OS default suite every tenant receives
