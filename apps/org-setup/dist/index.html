<!doctype html><meta charset="utf-8"><title>Org Setup</title>
<!--
  ORG SETUP (kind=app) — the tenant admin builds its organisation backbone:
  • Units  = department/division/team hierarchy (org.org_unit, self-ref parent → variable depth)
  • Areas  = internal boundary hierarchy zone/ward/locality/street (org.area, self-ref parent)
  • People = employees (org.employee)
  • Postings = assign an employee to a unit + area + role (org.posting)  ← the (emp×unit×area×role) tuple
  • Goals  = objectives for a unit or employee (org.goal)
  Reads via /bridge/query, writes via /bridge/save (delegated: component://org-setup obo the admin).
-->
<style>
  :root{--bg:#0b0f14;--panel:#141a22;--line:#222b36;--ink:#e6edf3;--dim:#8b949e;--accent:#3b82f6;--good:#2ea043;--soft:#0d1117}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  .wrap{display:flex;height:100%}
  .nav{width:190px;flex:0 0 auto;border-right:1px solid var(--line);padding:14px 10px;background:rgba(10,14,20,.4)}
  .nav h1{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--dim);margin:2px 8px 12px}
  .nav a{display:flex;align-items:center;gap:9px;padding:9px 11px;border-radius:9px;color:var(--ink);cursor:pointer;margin-bottom:3px;font-weight:500}
  .nav a:hover{background:#161d27}.nav a.on{background:#17233a;color:#cfe0ff}
  .nav a .c{margin-left:auto;font-size:11px;color:var(--dim);background:#0d1117;border:1px solid var(--line);border-radius:20px;padding:0 7px}
  .main{flex:1;min-width:0;overflow:auto;padding:20px 24px}
  .head{display:flex;align-items:center;margin-bottom:14px}.head h2{margin:0;font-size:18px}.head .sub{color:var(--dim);margin-left:10px;font-size:12px}
  .btn{border:1px solid var(--line);background:#1b232e;color:var(--ink);border-radius:8px;padding:7px 13px;font-size:13px;cursor:pointer}
  .btn:hover{border-color:#33455a}.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}.btn.pri:hover{filter:brightness(1.08)}
  .btn.sm{padding:3px 9px;font-size:12px}.btn.ghost{background:none}.btn.danger:hover{border-color:#8b2c30;color:#ff9b9b}
  .right{margin-left:auto;display:flex;gap:8px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:16px}
  table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);font-size:13px}
  th{color:var(--dim);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.04em}
  tr:hover td{background:#121821}
  .pill{display:inline-block;font-size:11px;padding:1px 8px;border-radius:20px;border:1px solid var(--line);color:var(--dim)}
  .pill.active,.pill.met{color:#7ee2a8;border-color:#1f6f43}.pill.draft{color:#e6c34a;border-color:#7a5c12}
  .tree .node{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:8px}.tree .node:hover{background:#121821}
  .tree .node .nm{font-weight:600}.tree .node .meta{color:var(--dim);font-size:12px}
  .tree .kids{margin-left:20px;border-left:1px solid var(--line);padding-left:8px}
  .empty{color:var(--dim);padding:26px;text-align:center;border:1px dashed var(--line);border-radius:12px}
  label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--dim);margin:0 0 4px}
  input,select{width:100%;background:var(--soft);border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:8px 10px;font-size:13px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.grid.g3{grid-template-columns:1fr 1fr 1fr}
  .row{margin-bottom:12px}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:flex-start;justify-content:center;padding:5vh 16px;z-index:30}
  .modal.open{display:flex}.sheet{background:#0f151d;border:1px solid var(--line);border-radius:14px;padding:20px;width:640px;max-width:100%;max-height:90vh;overflow:auto}
  .sheet h3{margin:0 0 14px}.muted{color:var(--dim)}.err{color:#ff9b9b;font-size:12px;margin-top:8px}
</style>

<div class="wrap">
  <nav class="nav">
    <h1>🏛️ Org Setup</h1>
    <a data-t="units"><span>🗂️</span> Units <span class="c" id="c-units">0</span></a>
    <a data-t="areas"><span>🗺️</span> Areas <span class="c" id="c-areas">0</span></a>
    <a data-t="levels"><span>📶</span> Levels <span class="c" id="c-levels">0</span></a>
    <a data-t="streams"><span>🧭</span> Streams <span class="c" id="c-streams">0</span></a>
    <a data-t="positions"><span>💼</span> Positions <span class="c" id="c-positions">0</span></a>
    <a data-t="people"><span>👥</span> People <span class="c" id="c-people">0</span></a>
    <a data-t="postings"><span>📌</span> Postings <span class="c" id="c-postings">0</span></a>
    <a data-t="goals"><span>🎯</span> Goals <span class="c" id="c-goals">0</span></a>
  </nav>
  <main class="main" id="main"></main>
</div>

<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>

<script>
const api=(p,b)=>fetch(p,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b||{})}).then(r=>r.json());
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const APP='org-setup';
let TENANT='', ROLES=[], DB={units:[],areas:[],levels:[],streams:[],positions:[],people:[],postings:[],goals:[]}, TAB='units';
const SCH={units:'org.org_unit',areas:'org.area',levels:'hr.job_level',streams:'hr.career_stream',positions:'org.position',people:'org.employee',postings:'org.posting',goals:'org.goal'};
const rid=(local,code)=>`ds:${TENANT}:${local}/${(code||('x'+Date.now())).toString().replace(/[^a-z0-9_-]/gi,'-')}`;
const byId=(arr,id)=>arr.find(x=>x.id===id)||{};
const byCode=(arr,code)=>arr.find(x=>x.code===code)||{};
const nameOf=(arr,id)=>{const o=byId(arr,id);return o.name||o.title||o.emp_code||id||'—';};

async function boot(){
  try{const se=await fetch('/session').then(r=>r.json());
    TENANT=se.tenant || (se.sub||'').replace(/^user:\/\//,'').split('/')[0] || 'tenant';}catch(e){TENANT='tenant';}
  try{ROLES=((await api('/bridge/catalog?kind=roles',{})).roles||[]).map(r=>r.role).filter(Boolean).sort();}catch(e){}
  await loadAll(); wireNav(); render();
}
async function loadAll(){ await Promise.all(Object.keys(SCH).map(loadOne)); refreshCounts(); }
async function loadOne(tab){
  try{const r=await api('/bridge/query',{app_id:APP,schema:SCH[tab]});
    DB[tab]=(r.results||[]).map(x=>x.object||x);}catch(e){DB[tab]=[];}
}
function refreshCounts(){ for(const t of Object.keys(SCH)) document.getElementById('c-'+t).textContent=DB[t].length; }
function wireNav(){ document.querySelectorAll('.nav a').forEach(a=>a.onclick=()=>{TAB=a.dataset.t;render();}); }

function render(){
  document.querySelectorAll('.nav a').forEach(a=>a.classList.toggle('on',a.dataset.t===TAB));
  ({units:rUnits,areas:rAreas,levels:rLevels,streams:rStreams,positions:rPositions,people:rPeople,postings:rPostings,goals:rGoals}[TAB])();
}
function header(title,sub,addLabel,addFn){
  return `<div class="head"><h2>${title}</h2><span class="sub">${sub}</span>
    <div class="right"><button class="btn pri" onclick='${addFn}'>＋ ${addLabel}</button></div></div>`;
}

/* ---------- TREE tabs (units, areas) ---------- */
function tree(arr, rootLabel, meta){
  const kids=p=>arr.filter(n=>(n.parent||null)===(p||null));
  const draw=(p)=>{const ks=kids(p);if(!ks.length)return '';
    return `<div class="kids">`+ks.map(n=>`<div class="node">
        <span class="nm">${esc(n.name)}</span> <span class="meta">${meta(n)}</span>
        <button class="btn sm ghost" style="margin-left:auto" onclick='editRow("${TAB}","${esc(n.id)}")'>edit</button>
      </div>${draw(n.id)}`).join('')+`</div>`;};
  const roots=kids(null);
  if(!arr.length) return `<div class="empty">No ${rootLabel} yet. Add the top level to begin.</div>`;
  return `<div class="tree card">`+roots.map(n=>`<div class="node">
      <span class="nm">${esc(n.name)}</span> <span class="meta">${meta(n)}</span>
      <button class="btn sm ghost" style="margin-left:auto" onclick='editRow("${TAB}","${esc(n.id)}")'>edit</button>
    </div>${draw(n.id)}`).join('')+`</div>`;
}
function rUnits(){
  document.getElementById('main').innerHTML=header('Organisation units','departments · divisions · teams — nest to any depth','Add unit','addRow("units")')
    + tree(DB.units,'units',n=>`${n.kind||'unit'}${n.head?' · head: '+esc(nameOf(DB.people,n.head)):''}${n.area?' · '+esc(nameOf(DB.areas,n.area)):''}`);
}
function rAreas(){
  document.getElementById('main').innerHTML=header('Boundary areas','zones · wards · localities · streets — nest to any depth','Add area','addRow("areas")')
    + tree(DB.areas,'areas',n=>`${n.level||'area'}${n.jurisdiction?' · '+esc(n.jurisdiction):''}`);
}
/* ---------- TABLE tabs ---------- */
function rPeople(){
  const rows=DB.people.map(e=>`<tr><td><b>${esc(e.name)}</b></td><td>${esc(e.emp_code)}</td>
     <td>${esc(nameOf(DB.units,e.org_unit))}</td><td>${esc(e.grade||'—')}</td>
     <td>${e.manager?esc(nameOf(DB.people,e.manager)):'—'}</td>
     <td><span class="pill ${e.status==='active'?'active':''}">${esc(e.status||'active')}</span></td>
     <td><button class="btn sm ghost" onclick='editRow("people","${esc(e.id)}")'>edit</button></td></tr>`).join('');
  document.getElementById('main').innerHTML=header('People','employees / staff','Add person','addRow("people")')
    + (DB.people.length?`<div class="card"><table><thead><tr><th>Name</th><th>Emp code</th><th>Unit</th><th>Grade</th><th>Manager</th><th>Status</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>`
       :`<div class="empty">No people yet.</div>`);
}
function rPostings(){
  const rbac=p=>{ if(!p.role) return '<span class="muted">no role</span>';
    if(p.status==='ended') return '<span class="muted">revoked</span>';
    return byId(DB.people,p.employee).citizen ? '<span class="pill met">● live</span>'
      : '<span class="pill draft" title="set the employee’s Login user">pending login</span>'; };
  const rows=DB.postings.map(p=>`<tr><td><b>${esc(nameOf(DB.people,p.employee))}</b></td>
     <td>${esc(nameOf(DB.units,p.org_unit))}</td><td>${p.area?esc(nameOf(DB.areas,p.area)):'—'}</td>
     <td>${p.role?`<span class="pill">${esc(p.role)}</span>`:'—'}</td><td>${esc(p.designation||'—')}</td>
     <td>${p.reporting_to?esc(nameOf(DB.people,p.reporting_to)):'—'}</td>
     <td>${rbac(p)}</td>
     <td><span class="pill ${p.status==='active'?'active':''}">${esc(p.status||'active')}</span></td>
     <td><button class="btn sm ghost" onclick='editRow("postings","${esc(p.id)}")'>edit</button></td></tr>`).join('');
  document.getElementById('main').innerHTML=header('Postings','assign a person to a unit + area + role','Add posting','addRow("postings")')
    + (DB.postings.length?`<div class="card"><table><thead><tr><th>Employee</th><th>Unit</th><th>Area</th><th>Role</th><th>Designation</th><th>Reports to</th><th>RBAC</th><th>Status</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>`
       :`<div class="empty">No postings yet. Add people and units first, then place them.</div>`);
}
function rGoals(){
  const rows=DB.goals.map(g=>`<tr><td><b>${esc(g.title)}</b></td>
     <td>${esc(g.owner_kind==='employee'?nameOf(DB.people,g.owner):nameOf(DB.units,g.owner))}</td>
     <td>${esc(g.metric||'—')}</td><td>${g.target!=null?esc(g.target):'—'}</td><td>${esc(g.period||'—')}</td>
     <td><span class="pill ${g.status==='met'?'met':(g.status==='draft'?'draft':'active')}">${esc(g.status||'draft')}</span></td>
     <td><button class="btn sm ghost" onclick='editRow("goals","${esc(g.id)}")'>edit</button></td></tr>`).join('');
  document.getElementById('main').innerHTML=header('Goals','objectives for a unit or a person','Add goal','addRow("goals")')
    + (DB.goals.length?`<div class="card"><table><thead><tr><th>Goal</th><th>Owner</th><th>Metric</th><th>Target</th><th>Period</th><th>Status</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>`
       :`<div class="empty">No goals yet.</div>`);
}

/* ---------- CLASSIFICATION tabs ---------- */
function rLevels(){
  const rows=DB.levels.slice().sort((a,b)=>(a.rank||0)-(b.rank||0)).map(l=>`<tr><td><b>${esc(l.name)}</b></td><td>${esc(l.code)}</td><td>${esc(l.rank)}</td><td>${esc(l.description||'—')}</td>
     <td><button class="btn sm ghost" onclick='editRow("levels","${esc(l.id)}")'>edit</button></td></tr>`).join('');
  document.getElementById('main').innerHTML=header('Job levels','grades / bands — rank orders seniority (policy uses ≥)','Add level','addRow("levels")')
    + (DB.levels.length?`<div class="card"><table><thead><tr><th>Name</th><th>Code</th><th>Rank</th><th>Description</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>`:`<div class="empty">No levels yet (e.g. L1…L5, Officer, Deputy Commissioner).</div>`);
}
function rStreams(){
  const rows=DB.streams.map(s=>`<tr><td><b>${esc(s.name)}</b></td><td>${esc(s.code)}</td><td>${esc(s.description||'—')}</td>
     <td><button class="btn sm ghost" onclick='editRow("streams","${esc(s.id)}")'>edit</button></td></tr>`).join('');
  document.getElementById('main').innerHTML=header('Career streams','job families / tracks','Add stream','addRow("streams")')
    + (DB.streams.length?`<div class="card"><table><thead><tr><th>Name</th><th>Code</th><th>Description</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>`:`<div class="empty">No streams yet (e.g. Administrative, Technical, Health, Sanitation).</div>`);
}
function rPositions(){
  const rows=DB.positions.map(p=>`<tr><td><b>${esc(p.title)}</b></td>
     <td>${esc(byCode(DB.streams,p.stream).name||p.stream||'—')}</td><td>${esc(byCode(DB.levels,p.level).name||p.level||'—')}</td>
     <td>${esc(nameOf(DB.units,p.org_unit))}</td>
     <td>${(p.eligible_roles||[]).map(r=>`<span class="pill">${esc(r)}</span>`).join(' ')||'—'}</td>
     <td>${p.reports_to?esc(byId(DB.positions,p.reports_to).title||p.reports_to):'—'}</td>
     <td><button class="btn sm ghost" onclick='editRow("positions","${esc(p.id)}")'>edit</button></td></tr>`).join('');
  document.getElementById('main').innerHTML=header('Positions','job slots = stream × level × unit; postings fill them','Add position','addRow("positions")')
    + (DB.positions.length?`<div class="card"><table><thead><tr><th>Title</th><th>Stream</th><th>Level</th><th>Unit</th><th>Eligible roles</th><th>Reports to</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>`:`<div class="empty">No positions yet. A position = a job slot a person is posted into.</div>`);
}

/* ---------- FORMS ---------- */
const opt=(list,sel,labelFn)=>`<option value="">—</option>`+list.map(o=>`<option value="${esc(o.id)}"${o.id===sel?' selected':''}>${esc(labelFn(o))}</option>`).join('');
const optC=(list,sel,labelFn)=>`<option value="">—</option>`+list.map(o=>`<option value="${esc(o.code)}"${o.code===sel?' selected':''}>${esc(labelFn(o))}</option>`).join('');
const optV=(vals,sel)=>`<option value="">—</option>`+vals.map(v=>`<option${v===sel?' selected':''}>${esc(v)}</option>`).join('');
function fields(tab,o){
  const unitsOpt=s=>opt(DB.units,s,u=>u.name);
  const areasOpt=s=>opt(DB.areas,s,a=>a.name+' ('+(a.level||'')+')');
  const pplOpt=s=>opt(DB.people,s,e=>e.name+' · '+e.emp_code);
  const lvlOpt=s=>optC(DB.levels.slice().sort((a,b)=>(a.rank||0)-(b.rank||0)),s,l=>l.name+' (rank '+l.rank+')');
  const strOpt=s=>optC(DB.streams,s,x=>x.name);
  const posOpt=s=>opt(DB.positions,s,p=>p.title);
  if(tab==='levels') return `
    <div class="grid g3"><div class="row"><label>Code</label><input id="f_code" value="${esc(o.code||'')}" placeholder="L3"></div>
      <div class="row"><label>Name</label><input id="f_name" value="${esc(o.name||'')}" placeholder="Senior Officer"></div>
      <div class="row"><label>Rank <span class="muted">(1 = lowest)</span></label><input id="f_rank" type="number" value="${esc(o.rank!=null?o.rank:'')}" placeholder="3"></div></div>
    <div class="row"><label>Description</label><input id="f_description" value="${esc(o.description||'')}"></div>`;
  if(tab==='streams') return `
    <div class="grid"><div class="row"><label>Code</label><input id="f_code" value="${esc(o.code||'')}" placeholder="sanitation"></div>
      <div class="row"><label>Name</label><input id="f_name" value="${esc(o.name||'')}" placeholder="Sanitation"></div></div>
    <div class="row"><label>Description</label><input id="f_description" value="${esc(o.description||'')}"></div>`;
  if(tab==='positions') return `
    <div class="grid"><div class="row"><label>Code</label><input id="f_code" value="${esc(o.code||'')}" placeholder="pos-ward-officer"></div>
      <div class="row"><label>Title</label><input id="f_title" value="${esc(o.title||'')}" placeholder="Ward Officer"></div></div>
    <div class="grid g3"><div class="row"><label>Stream</label><select id="f_stream">${strOpt(o.stream)}</select></div>
      <div class="row"><label>Level</label><select id="f_level">${lvlOpt(o.level)}</select></div>
      <div class="row"><label>Unit</label><select id="f_org_unit">${unitsOpt(o.org_unit)}</select></div></div>
    <div class="row"><label>Eligible roles <span class="muted">— a posting into this position may grant one of these</span></label>
      <div style="display:flex;flex-wrap:wrap;gap:10px;margin-top:4px">${ROLES.map(r=>`<label style="display:flex;align-items:center;gap:5px;font-size:12px;text-transform:none;letter-spacing:0;color:var(--ink)"><input type="checkbox" style="width:auto" data-role="${esc(r)}" ${(o.eligible_roles||[]).includes(r)?'checked':''}> ${esc(r)}</label>`).join('')}</div></div>
    <div class="grid"><div class="row"><label>Reports to (position)</label><select id="f_reports_to">${posOpt(o.reports_to)}</select></div>
      <div class="row"><label>Headcount</label><input id="f_headcount" type="number" value="${esc(o.headcount!=null?o.headcount:'')}" placeholder="1"></div></div>`;
  if(tab==='units') return `
    <div class="grid"><div class="row"><label>Code</label><input id="f_code" value="${esc(o.code||'')}" placeholder="rev-dept"></div>
      <div class="row"><label>Name</label><input id="f_name" value="${esc(o.name||'')}" placeholder="Revenue Department"></div></div>
    <div class="grid g3"><div class="row"><label>Kind</label><select id="f_kind">${optV(['department','division','team','office','unit','board'],o.kind||'department')}</select></div>
      <div class="row"><label>Parent unit</label><select id="f_parent">${unitsOpt(o.parent)}</select></div>
      <div class="row"><label>Area</label><select id="f_area">${areasOpt(o.area)}</select></div></div>
    <div class="grid"><div class="row"><label>Head (person)</label><select id="f_head">${pplOpt(o.head)}</select></div>
      <div class="row"><label>Jurisdiction code <span class="muted">(optional)</span></label><input id="f_jurisdiction" value="${esc(o.jurisdiction||'')}" placeholder="nashik"></div></div>`;
  if(tab==='areas') return `
    <div class="grid"><div class="row"><label>Code</label><input id="f_code" value="${esc(o.code||'')}" placeholder="zone-3"></div>
      <div class="row"><label>Name</label><input id="f_name" value="${esc(o.name||'')}" placeholder="Zone 3 — East"></div></div>
    <div class="grid g3"><div class="row"><label>Level</label><input id="f_level" value="${esc(o.level||'')}" placeholder="zone / ward / locality / street"></div>
      <div class="row"><label>Parent area</label><select id="f_parent">${areasOpt(o.parent)}</select></div>
      <div class="row"><label>Jurisdiction code</label><input id="f_jurisdiction" value="${esc(o.jurisdiction||'')}" placeholder="nashik"></div></div>`;
  if(tab==='people') return `
    <div class="grid"><div class="row"><label>Emp code</label><input id="f_emp_code" value="${esc(o.emp_code||'')}" placeholder="E-1024"></div>
      <div class="row"><label>Full name</label><input id="f_name" value="${esc(o.name||'')}" placeholder="Asha Patil"></div></div>
    <div class="grid g3"><div class="row"><label>Grade</label><input id="f_grade" value="${esc(o.grade||'')}" placeholder="Officer / Grade-B"></div>
      <div class="row"><label>Primary unit</label><select id="f_org_unit">${unitsOpt(o.org_unit)}</select></div>
      <div class="row"><label>Status</label><select id="f_status">${optV(['active','on_leave','separated'],o.status||'active')}</select></div></div>
    <div class="grid g3"><div class="row"><label>Manager</label><select id="f_manager">${pplOpt(o.manager)}</select></div>
      <div class="row"><label>Email</label><input id="f_email" value="${esc((o.contact||{}).email||'')}"></div>
      <div class="row"><label>Phone</label><input id="f_phone" value="${esc((o.contact||{}).phone||'')}"></div></div>
    <div class="row"><label>Login user <span class="muted">— username of their account; links the employee so a posting grants them the role (RBAC)</span></label>
      <input id="f_login" value="${esc((o.citizen||'').replace(/^user:\/\/[^/]+\//,''))}" placeholder="asha.patil"></div>`;
  if(tab==='postings') return `
    <div class="row"><label>Position <span class="muted">(job slot — fills the unit + limits the role to its eligible set)</span></label><select id="f_position" onchange="posPick(this.value)">${posOpt(o.position)}</select></div>
    <div class="grid"><div class="row"><label>Employee</label><select id="f_employee">${pplOpt(o.employee)}</select></div>
      <div class="row"><label>Unit</label><select id="f_org_unit">${unitsOpt(o.org_unit)}</select></div></div>

  else if(t==='postings'){ if(!val('f_employee')||!val('f_org_unit'))return ferr('Employee and unit are required');

    o.id=o.id||rid('posting'); }
  else if(t==='goals'){ if(!val('f_title')||!val('f_owner'))return ferr('Title and owner are required');
    o.title=val('f_title'); o.owner_kind=val('f_owner_kind')||'org_unit'; o.owner=val('f_owner'); set('metric',val('f_metric')); set('period',val('f_period')); o.status=val('f_status')||'draft';
    const tv=val('f_target'); if(tv!==''){ const n=Number(tv); o.target=isNaN(n)?tv:n; } else delete o.target;

function ferr(m){ document.getElementById('ferr').textContent=m; }
async function save(o){
  const r=await api('/bridge/save',{app_id:APP,id:o.id,object:o});
  if(r.error) return ferr(r.error+(r.detail?(' — '+r.detail):''));
  let note='';
  if(TAB==='postings'){                        // project the posting into a live RBAC role-grant
    try{ const a=await api('/bridge/posting-apply',{posting:o});
      note=a.live?('✓ '+(o.role||'role')+' is now live for this employee') :('⚠ role not live — '+(a.reason||'')); }catch(e){}
  }
  if(TAB==='people' && o.citizen){             // auto-provision a tenant login for the staff member
    try{ const p=await api('/bridge/employee-provision',{employee:o});
      const un=(p.subject||'').split('/').pop();
      note=p.error?('⚠ login not created — '+p.error):(p.existed?('login '+un+' already exists') :('✓ login created: '+un)); }catch(e){}
  }
  closeModal(); await loadOne(TAB); refreshCounts(); render();
  if(note) toast(note);
}
function toast(m){ let t=document.getElementById('toast'); if(!t){t=document.createElement('div');t.id='toast';
  t.style.cssText='position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#17233a;border:1px solid #33455a;color:#cfe0ff;padding:10px 16px;border-radius:10px;z-index:50;box-shadow:0 8px 24px rgba(0,0,0,.4)';document.body.appendChild(t);}
  t.textContent=m; t.style.opacity='1'; clearTimeout(t._h); t._h=setTimeout(()=>{t.style.transition='opacity .4s';t.style.opacity='0';},3200); }

/* ===== AI ASSISTANT (baked-in) ===== */
/* ===== Reusable AI Assistant drawer — the SHARED pattern baked into every Airawat app =====
   Grounds the model on cfg.context() (this app's governed data), shows chips + a chat box (with a 🎤 dictate
   button), and — when the model proposes one — renders a CONFIRM button that runs cfg.run(name,params) through
   the app's OWN governed bridge. The AI never acts on its own (ADR-0029). Identical across apps; only cfg differs. */
function _toWav(buf){
  const sr=buf.sampleRate, len=buf.length, nch=buf.numberOfChannels;
  const mono=new Float32Array(len);
  for(let c=0;c<nch;c++){const ch=buf.getChannelData(c);for(let i=0;i<len;i++)mono[i]+=ch[i]/nch;}
  const ab=new ArrayBuffer(44+len*2), dv=new DataView(ab);
  const ws=(o,s)=>{for(let i=0;i<s.length;i++)dv.setUint8(o+i,s.charCodeAt(i));};
  ws(0,"RIFF");dv.setUint32(4,36+len*2,true);ws(8,"WAVE");ws(12,"fmt ");dv.setUint32(16,16,true);
  dv.setUint16(20,1,true);dv.setUint16(22,1,true);dv.setUint32(24,sr,true);dv.setUint32(28,sr*2,true);
  dv.setUint16(32,2,true);dv.setUint16(34,16,true);ws(36,"data");dv.setUint32(40,len*2,true);
  let o=44;for(let i=0;i<len;i++){let s=Math.max(-1,Math.min(1,mono[i]));dv.setInt16(o,s<0?s*0x8000:s*0x7FFF,true);o+=2;}
  return new Blob([ab],{type:"audio/wav"});
}
/* Record in-frame → 16kHz mono WAV → chunk-upload to filestore (beats the 1MB proxy cap) → transcribe by
   file_id → insert into `target`. Unbounded length. Dependency-free; opts.status(msg) surfaces errors. */
async function attachMic(btn,target,opts){ if(!btn||!target)return; opts=opts||{};
  const note=m=>{try{opts.status&&opts.status(m);}catch(e){}};
  let rec=null,chunks=[],on=false,tick=null,secs=0;
  btn.onclick=async(e)=>{ e&&e.preventDefault();
    if(on){ rec&&rec.stop(); return; }
    if(!navigator.mediaDevices||!window.MediaRecorder){ note("Voice input isn’t supported in this browser"); return; }
    let stream; try{ stream=await navigator.mediaDevices.getUserMedia({audio:true}); }catch(err){ note("Microphone permission was denied"); return; }
    chunks=[]; rec=new MediaRecorder(stream); on=true; btn.classList.add("rec"); secs=0; btn.textContent="⏺ 0s";
    tick=setInterval(()=>{secs++;btn.textContent="⏺ "+secs+"s";},1000);
    rec.ondataavailable=ev=>{ if(ev.data&&ev.data.size)chunks.push(ev.data); };
    rec.onstop=async()=>{ on=false; clearInterval(tick); stream.getTracks().forEach(t=>t.stop()); btn.classList.remove("rec"); btn.textContent="…";
      let wav;
      try{ const ab=await new Blob(chunks,{type:(chunks[0]&&chunks[0].type)||"audio/webm"}).arrayBuffer();
        const AC=window.AudioContext||window.webkitAudioContext; let audio=await new AC().decodeAudioData(ab);
        try{ const off=new OfflineAudioContext(1,Math.max(1,Math.ceil(audio.duration*16000)),16000); const s=off.createBufferSource(); s.buffer=audio; s.connect(off.destination); s.start(); audio=await off.startRendering(); }catch(e){}
        wav=_toWav(audio);
      }catch(err){ btn.textContent="🎤"; note("Could not process the recording"); return; }
      let fid=null;
      try{ const up="v"+Date.now().toString(36)+Math.random().toString(36).slice(2,8), CH=700*1024, N=Math.max(1,Math.ceil(wav.size/CH));
        for(let i=0;i<N;i++){ btn.textContent="⇧ "+Math.round(i/N*100)+"%"; const part=wav.slice(i*CH,(i+1)*CH), last=(i===N-1);
          const r=await fetch("/bridge/upload-chunk?up="+up+"&seq="+i+(last?"&fin=1":""),{method:"POST",headers:{"Content-Type":"application/octet-stream"},body:part}).then(x=>x.json());
          if(r.error){ btn.textContent="🎤"; note(r.error); return; } if(last)fid=r.file_id; }
      }catch(err){ btn.textContent="🎤"; note("Upload failed"); return; }
      btn.textContent="…";
      let j={}; try{ j=await fetch("/bridge/transcribe",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({file_id:fid,mime:"audio/wav",language:opts.language||""})}).then(x=>x.json()); }catch(err){ j={error:String(err)}; }
      btn.textContent="🎤";
      if(j.error){ note(j.error); return; }
      const txt=(j.text||"").trim(); if(!txt){ note("No speech detected — try again"); return; }
      const cur=target.value||""; target.value=cur?(cur.replace(/\s*$/,"")+" "+txt):txt; target.dispatchEvent(new Event("input")); target.focus();
    };
    rec.start();
  };
}
function AIAssist(cfg){
  const S=document.createElement('style');S.textContent=`
  #aiFab{position:fixed;right:18px;bottom:18px;z-index:60;background:linear-gradient(135deg,#6d5efc,#9b5efc);color:#fff;border:0;border-radius:999px;padding:11px 16px;font:600 13.5px system-ui;cursor:pointer;box-shadow:0 6px 20px rgba(0,0,0,.4)}
  #aiDrawer{position:fixed;top:0;right:0;height:100%;width:392px;max-width:93vw;background:#0f151d;border-left:1px solid #222b36;z-index:61;display:none;flex-direction:column;box-shadow:-8px 0 30px rgba(0,0,0,.45)}
  #aiDrawer.open{display:flex}
  #aiDrawer header{padding:13px 16px;border-bottom:1px solid #222b36;display:flex;align-items:center;gap:8px}
  #aiDrawer header b{font-size:14px}#aiDrawer header .x{margin-left:auto;cursor:pointer;color:#8b949e;font-size:18px}
  #aiLog{flex:1;overflow:auto;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
  .aiMsg{font-size:13.5px;line-height:1.5}.aiMsg.u{color:#9fd0ff;align-self:flex-end;max-width:85%}
  .aiMsg.a{color:#e6edf3;background:#141a22;border:1px solid #222b36;border-radius:10px;padding:9px 11px;max-width:92%}
  .aiChips{display:flex;flex-wrap:wrap;gap:6px;padding:0 16px 8px}
  .aiChip{font-size:12px;border:1px solid #2a3542;border-radius:999px;padding:5px 10px;color:#a9b6c4;cursor:pointer;background:#121821}
  .aiAct{margin-top:8px}.aiAct button{background:#1f9d55;border:0;color:#fff;border-radius:8px;padding:8px 12px;font:600 13px system-ui;cursor:pointer}
  #aiForm{display:flex;gap:8px;padding:12px 16px;border-top:1px solid #222b36;align-items:flex-end}
  #aiMic{background:#1b232e;border:1px solid #222b36;color:#e6edf3;border-radius:9px;padding:0 11px;height:37px;cursor:pointer;font-size:15px;white-space:nowrap}
  #aiMic.rec{background:#3a1d1d;border-color:#6a2b2b;color:#f0a0a0}
  #aiIn{flex:1;background:#0d1117;border:1px solid #222b36;color:#e6edf3;border-radius:9px;padding:9px 11px;font:13.5px system-ui;resize:none;max-height:120px}
  #aiSend{background:#6d5efc;border:0;color:#fff;border-radius:9px;padding:0 14px;height:37px;cursor:pointer;font:600 13px system-ui}
  .aiSpin{display:inline-block;width:12px;height:12px;border:2px solid #333d49;border-top-color:#9b5efc;border-radius:50%;animation:aisp .7s linear infinite;vertical-align:-2px}
  @keyframes aisp{to{transform:rotate(360deg)}}`;
  document.head.appendChild(S);
  const fab=document.createElement('button');fab.id='aiFab';fab.textContent='✨ Assistant';document.body.appendChild(fab);
  const d=document.createElement('div');d.id='aiDrawer';
  d.innerHTML=`<header><b>✨ ${cfg.title||'Assistant'}</b><span class="x">✕</span></header>
    <div id="aiLog"></div>
    <div class="aiChips">${(cfg.chips||[]).map(c=>`<span class="aiChip">${String(c).replace(/</g,'&lt;')}</span>`).join('')}</div>
    <div id="aiForm"><button id="aiMic" title="Dictate (speak in any language)">🎤</button><textarea id="aiIn" rows="1" placeholder="Ask, or 🎤 speak…"></textarea><button id="aiSend">Send</button></div>`;
  document.body.appendChild(d);
  const log=d.querySelector('#aiLog'), inp=d.querySelector('#aiIn'), hist=[];
  const e2=s=>String(s==null?'':s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
  const add=(role,html)=>{const e=document.createElement('div');e.className='aiMsg '+(role==='user'?'u':'a');e.innerHTML=html;log.appendChild(e);log.scrollTop=log.scrollHeight;return e;};
  fab.onclick=()=>{d.classList.add('open');inp.focus();if(!log.children.length)add('a','Hi — ask me anything about your '+(cfg.title||'data').toLowerCase()+', by typing or 🎤 voice. I read what you’re currently looking at.');};
  d.querySelector('.x').onclick=()=>d.classList.remove('open');
  d.querySelectorAll('.aiChip').forEach(c=>c.onclick=()=>{inp.value=c.textContent;go();});
  d.querySelector('#aiSend').onclick=go; inp.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();go();}};
  attachMic(d.querySelector('#aiMic'), inp, {language:cfg.language||'', status:m=>add('a','🎤 '+e2(m))});
  async function go(){
    const q=inp.value.trim(); if(!q)return; inp.value='';
    add('user',e2(q)); hist.push({role:'user',content:q});
    const wait=add('a','<span class="aiSpin"></span>');
    let ctx=''; try{ctx=typeof cfg.context==='function'?cfg.context():'';}catch(e){}
    let r={}; try{ r=await fetch('/bridge/ai-assist',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({app_id:cfg.app,task:'assist',prompt:q,system:cfg.system,context:ctx,actions:cfg.actions||[],history:hist.slice(0,-1)})}).then(x=>x.json()); }
    catch(e){ r={error:String(e)}; }
    let txt=(r.content||r.error||'(no reply)'), action=null;
    const m=txt.match(/<<ACTION>>([\s\S]*?)<<ACTION>>/);
    if(m){ txt=txt.replace(m[0],'').trim(); try{action=JSON.parse(m[1]);}catch(e){} }
    wait.innerHTML=e2(txt||'(done)').replace(/\n/g,'<br>'); hist.push({role:'assistant',content:txt});
    if(action && (cfg.actions||[]).some(a=>a.name===action.name)){
      const wrap=document.createElement('div');wrap.className='aiAct';
      const b=document.createElement('button');b.textContent='▶ '+(action.label||action.name);
      b.onclick=async()=>{b.disabled=true;const o=b.textContent;b.textContent='…';
        try{const res=await cfg.run(action.name,action.params||{});add('a','✓ '+e2(typeof res==='string'?res:((res&&res.message)||'Done.')));}
        catch(e){b.disabled=false;b.textContent=o;add('a','⚠ '+e2((e&&e.message)||String(e)));return;}
        wrap.remove();};
      wrap.appendChild(b); wait.appendChild(wrap);
    }
  }
}

function aiCtx(){ const c=k=>(DB[k]||[]).length;
  return JSON.stringify({counts:{units:c('units'),areas:c('areas'),levels:c('levels'),streams:c('streams'),positions:c('positions'),people:c('people'),postings:c('postings'),goals:c('goals')},
    levels:(DB.levels||[]).map(l=>({code:l.code,name:l.name,rank:l.rank})),
    streams:(DB.streams||[]).map(s=>({code:s.code,name:s.name})),
    units:(DB.units||[]).map(u=>({name:u.name,kind:u.kind,parent:u.parent||null,head:u.head||null})),
    positions:(DB.positions||[]).map(p=>({code:p.code,title:p.title,level:p.level,stream:p.stream,headcount:p.headcount})),
    people:(DB.people||[]).map(p=>({name:p.name,emp_code:p.emp_code,org_unit:p.org_unit,manager:p.manager||null})),
    roles:ROLES}).slice(0,11000);
}
async function aiRun(name,p){ if(name!=='draft_position')throw new Error('unknown action');
  document.getElementById('aiDrawer').classList.remove('open');
  TAB='positions'; openForm({code:p.code||'',title:p.title||'',level:p.level||'',stream:p.stream||'',headcount:p.headcount});
  return 'Opened a pre-filled position — review the level/stream and Save.';
}
function mountAI(){AIAssist({app:APP,title:'Org assistant',
  system:"You are the org-design assistant inside Org Setup. You see the tenant's org units, job levels (with ranks), career streams, positions, people and governed roles. Help design and audit the structure — spot gaps (levels with no positions, units with no head, people with no manager), explain the hierarchy, and draft new positions. When asked to add or draft a position, propose draft_position with code, title, level (a job level code) and stream (a career stream code).",
  chips:['Summarise the org structure','Which levels have no positions?','Draft a Deputy Engineer position in the technical stream','Who has no manager set?'],
  context:aiCtx,
  actions:[{name:'draft_position',label:'Open pre-filled position',description:'Open the New Position form pre-filled for review + Save. params: code (short code), title (string), level (a job level code from the data), stream (a career stream code from the data), headcount (number, optional)'}],
  run:aiRun});}

boot().then(mountAI);
