<!doctype html><meta charset="utf-8"><title>City Setup</title>
<style>
  :root{--bg:#0d1117;--card:#161b22;--line:#21262d;--ink:#e6edf3;--dim:#8b949e;--muted:#6b7684;--accent:#3b82f6;--ok:#3fb950;--warn:#d29922;--err:#ff9b9b}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:14px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  header{padding:14px 20px;border-bottom:1px solid var(--line);display:flex;align-items:baseline;gap:12px}
  h1{margin:0;font-size:16px} .who{margin-left:auto;color:var(--dim);font-size:12px}
  #view{padding:20px 22px 60px;max-width:900px;margin:0 auto}
  .search{background:#0d1117;border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:7px 10px;font-size:13px}
  .pbtn{border:1px solid var(--line);background:#161b22;color:var(--ink);border-radius:6px;padding:5px 10px;cursor:pointer;font-size:13px}
  .pbtn:hover{border-color:var(--accent)} .pbtn:disabled{opacity:.5;cursor:default}
  .pbtn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
  .muted{color:var(--dim)} a{color:#58a6ff}
  .toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#132a17;border:1px solid #238636;color:#3fb950;padding:9px 16px;border-radius:9px;font-size:13px;opacity:0;transition:opacity .2s;z-index:20}
  .toast.show{opacity:1} .toast.err{background:#3d1418;border-color:#8b2c30;color:#ff9b9b}
  .empty{color:var(--dim);padding:40px;text-align:center}
  .cstile{position:absolute;width:256px;height:256px;pointer-events:none}
  /* stepped wizard */
  .step{border:1px solid var(--line);border-radius:12px;background:var(--card);margin:14px 0;overflow:hidden}
  .sthead{display:flex;align-items:center;gap:12px;padding:14px 16px}
  .snum{flex:none;width:26px;height:26px;border-radius:50%;background:#1f2733;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;color:var(--dim)}
  .step.done .snum{background:#0f2417;border-color:#1c3a25;color:var(--ok)}
  .step.active .snum{background:var(--accent);border-color:var(--accent);color:#fff}
  .sttitle{font-weight:600;font-size:14.5px}
  .stsub{color:var(--dim);font-size:12px;margin-top:1px}
  .stbody{padding:0 16px 16px 54px}
  .lbl{color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.05em;margin:16px 0 8px}
  /* prereq cards */
  .card{border:1px solid var(--line);border-radius:10px;background:#0f141b;margin:10px 0;overflow:hidden}
  .cardhd{display:flex;align-items:center;gap:10px;padding:12px 14px;cursor:pointer}
  .cardhd:hover{background:#12181f}
  .cico{font-size:20px;flex:none}
  .ctitle{font-weight:600} .csub{color:var(--dim);font-size:12px;margin-top:1px}
  .badge{margin-left:auto;font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap}
  .badge.ok{background:#0f2417;color:var(--ok);border:1px solid #1c3a25}
  .badge.warn{background:#2a2413;color:var(--warn);border:1px solid #3d3417}
  .badge.busy{background:#132033;color:#79c0ff;border:1px solid #1f3350}
  .caret{color:var(--dim);font-size:12px;transition:transform .15s}
  .card.open .caret{transform:rotate(90deg)}
  .cardbody{display:none;padding:4px 14px 16px;border-top:1px solid var(--line)}
  .card.open .cardbody{display:block}
  ol.howto{margin:12px 0;padding-left:20px} ol.howto li{margin:7px 0;color:#c9d1d9}
  ol.howto b{color:var(--ink)}
  .keycol{display:flex;gap:8px;align-items:flex-start;flex-wrap:wrap;margin-top:10px}
  textarea.key{width:100%;min-height:96px;background:#0d1117;border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:8px 10px;font:12px/1.45 ui-monospace,Menlo,monospace;resize:vertical}
  .note{background:#0f2417;border:1px solid #1c3a25;border-radius:10px;padding:11px 14px;color:#8ee0a6;font-size:12.5px;display:flex;gap:9px;align-items:center;margin:10px 0}
  .bar{height:7px;background:#0d1117;border:1px solid var(--line);border-radius:6px;overflow:hidden;margin:8px 0}
  .bar>i{display:block;height:100%;width:0;background:var(--accent);transition:width .15s}
  .drop{border:1px dashed var(--line);border-radius:9px;padding:14px;text-align:center;color:var(--dim);font-size:13px;cursor:pointer}
  .drop:hover{border-color:var(--accent);color:var(--ink)}
  /* readiness */
  .rrow{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}
  .rrow:last-child{border-bottom:0}
  .dot{flex:none;width:9px;height:9px;border-radius:50%}
  .dot.ok{background:var(--ok)} .dot.warn{background:var(--warn)}
  .rlayers{color:var(--dim);font-size:12px;margin-left:auto;text-align:right}
</style>
<header><h1>🏙️ City Setup</h1><span class="who" id="who"></span></header>
<div id="view"><div class="empty">loading…</div></div>
<div class="toast" id="toast"></div>
<script>
const MATURITY=['L0 · Requested','L1 · Baseline','L2 · Cells','L3 · Intelligence','L4 · Decisions'];
const esc=s=>(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function jget(p){const r=await fetch(p);if(!r.ok)throw new Error(p+' '+r.status);return r.json();}
async function jpost(p,b){const r=await fetch(p,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});return {ok:r.ok,status:r.status,j:await r.json().catch(()=>({}))};}
function toast(m,e){const t=document.getElementById('toast');t.textContent=m;t.className='toast show'+(e?' err':'');setTimeout(()=>t.className='toast',2600);}

// ── the two prerequisites, in plain language, with real step-by-step instructions ───────────────
const GEE_STEPS=[
 'Open the <a href="https://console.cloud.google.com" target="_blank" rel="noopener">Google Cloud Console</a>, sign in, and create a project (top bar → <b>New Project</b>) or pick an existing one. Note its <b>Project ID</b>.',
 'Register that project for Earth Engine (free for non-commercial &amp; government use): go to <a href="https://code.earthengine.google.com" target="_blank" rel="noopener">code.earthengine.google.com</a> and, if prompted, sign up and register your project.',
 'In the Cloud Console, turn on the API: <b>APIs &amp; Services → Library</b>, search <b>“Earth Engine API”</b>, click <b>Enable</b>.',
 'Create a service account: <b>IAM &amp; Admin → Service Accounts → + Create service account</b>. Name it e.g. <b>airawat-eo</b>, click Create, grant the role <b>Earth Engine Resource Viewer</b> (or Viewer), then Done.',
 'Make a key file: click the new service account → <b>Keys → Add key → Create new key → JSON → Create</b>. A <b>.json</b> file downloads.',
 'Open that <b>.json</b> file in any text editor, copy <b>everything</b>, and paste it into the box below — then click Connect.'];
const OSM_STEPS=[
 'Go to <a href="https://download.geofabrik.de" target="_blank" rel="noopener">download.geofabrik.de</a> — a free directory of OpenStreetMap extracts.',
 'Open your <b>country</b> (e.g. Asia → India). Some countries split into states/regions; others (like India) are one file — either works.',
 'Find the <b>.osm.pbf</b> for the <b>smallest region that fully contains your city</b>, then <b>right-click it → Copy link address</b>.',
 'Paste that link below and click <b>Fetch</b>. The <b>server</b> downloads it — no upload, and large files (even 1&nbsp;GB+) are fine. One-time; every roads &amp; facilities run then reads it locally.'];

let D=null, C=null, OPEN={gee:false,osm:false}, PENDING=null;
function captureForm(){const q=id=>{const el=document.getElementById(id.slice(1));return el?el.value:'';};
  const bbox=['#cs-w','#cs-s','#cs-e','#cs-n'].map(id=>parseFloat(q(id)));
  return {name:q('#cs-name'), bbox:bbox.some(isNaN)?null:bbox};}

function geeComps(){return (C&&C.components||[]).filter(c=>(c.secrets||[]).some(s=>s.name==='GEE_SERVICE_ACCOUNT_KEY'));}
function geeState(){const g=geeComps();if(!g.length)return{s:'warn',set:0,total:0};
  const set=g.filter(c=>c.secrets.some(s=>s.name==='GEE_SERVICE_ACCOUNT_KEY'&&s.set)).length;
  return{s:set===g.length?'ok':(set?'warn':'warn'),set,total:g.length};}
function osmComps(){return (C&&C.components||[]).filter(c=>(c.assets||[]).some(a=>a.name==='OSM_PBF'));}
function osmAsset(){for(const c of osmComps()){const a=(c.assets||[]).find(x=>x.name==='OSM_PBF'&&x.set);if(a)return a;}return null;}
function osmState(){const o=osmComps();if(!o.length)return{s:'warn',set:false};return{s:osmAsset()?'ok':'warn',set:!!osmAsset()};}
function fmtSize(b){if(!b)return'';const m=b/1048576;return m>=1024?(m/1024).toFixed(1)+' GB':m.toFixed(0)+' MB';}

async function loadAll(){
  D=await jget('/bridge/city-onboard');
  if(D.admin){ try{ C=await jget('/bridge/connections'); }catch(e){ C={components:[]}; } }
}

let POLL=null;
async function render(){
  if(POLL){clearInterval(POLL);POLL=null;}
  const V=document.getElementById('view');
  document.getElementById('who').textContent=D.tenant?('● '+D.tenant):'';
  if(!D.admin){ V.innerHTML='<div class="empty">City setup is for tenant admins.</div>'; return; }
  const run=D.run, mat=(D.maturity==null?null:D.maturity), running=run&&(run.status==='running'||run.status==='queued');
  const done=run&&run.status==='done', failed=run&&run.status==='failed';

  // ── running: focused progress view (poll) ─────────────────────────────────────────────
  if(running){
    V.innerHTML=`<div class="lbl">City Digital Baseline</div>
      <div class="step active"><div class="sthead"><div class="snum">⏳</div>
        <div><div class="sttitle">Building your baseline…</div>
        <div class="stsub">Acquiring free satellite &amp; map layers → indexing H3 cells → assessing coverage. This can take several minutes.</div></div></div>
      <div class="stbody">${run&&run.log?`<pre style="white-space:pre-wrap;background:#0d1117;border:1px solid var(--line);border-radius:8px;padding:10px;font-size:11px;max-height:260px;overflow:auto">${esc((run.log||'').slice(-2000))}</pre>`:'<div class="muted">starting…</div>'}</div></div>`;
    POLL=setInterval(async()=>{ D=await jget('/bridge/city-onboard'); render(); },3000); return;
  }

  const state=mat!=null?`<span style="color:var(--ok)">● ${esc(MATURITY[mat]||('L'+mat))}</span>`:`<span class="muted">not set up yet</span>`;
  const gs=geeState(), os=osmState();
  const aoi=D.aoi;
  // prefer an in-progress draw/name (survives a connect/upload re-render); else the persisted AOI
  const ib=(PENDING&&PENDING.bbox)||(aoi&&aoi.bbox&&aoi.bbox.length===4?aoi.bbox:null);
  const nm=(PENDING&&PENDING.name)||(aoi&&aoi.name)||'';
  const hasAoi=!!((PENDING&&PENDING.name)||(aoi&&aoi.name));

  let html=`<div class="lbl">City Digital Baseline</div>
    <div class="muted" style="font-size:12.5px;margin:-2px 0 4px">Tenant <b style="color:var(--ink);font-family:ui-monospace,Menlo,monospace">${esc(D.tenant)}</b> — set up your city once and it pulls free satellite, weather and map data into a live baseline you can explore in City Scan. Current state: ${state}.</div>`;

  if(done) html+=`<div class="note" style="margin:12px 0"><span style="font-size:16px">✓</span><div><b style="color:var(--ok)">Baseline ready${run.steps_ok!=null?` — ${run.steps_ok} layer(s) built`:''}.</b> Open <b>City Scan</b> to explore it. Add the satellite &amp; map layers below, then re-build to enrich it.</div></div>`;
  if(failed) html+=`<div style="background:#2a1416;border:1px solid #4a2226;border-radius:10px;padding:12px 14px;margin:12px 0"><b style="color:var(--err)">Last build had errors.</b>${run.log?`<pre style="white-space:pre-wrap;background:#0d1117;border:1px solid var(--line);border-radius:8px;padding:10px;margin-top:8px;font-size:11px;max-height:200px;overflow:auto">${esc((run.log||'').slice(-1600))}</pre>`:''}</div>`;

  // ── STEP 1 · Name & draw ──────────────────────────────────────────────────────────────
  html+=`<div class="step ${hasAoi?'done':'active'}" id="s1">
    <div class="sthead"><div class="snum">${hasAoi?'✓':'1'}</div>
      <div><div class="sttitle">Name &amp; draw your city</div>
      <div class="stsub">${hasAoi?('Area set: <b style="color:var(--ink)">'+esc(nm)+'</b> — pan/redraw to change it.'):'Draw a rectangle over your city on the map.'}</div></div></div>
    <div class="stbody">
      <label style="display:block;font-size:12px;color:var(--dim);max-width:720px">City / area name
        <input id="cs-name" class="search" style="margin:4px 0 10px;width:100%" placeholder="e.g. Greater Mumbai" value="${esc(nm)}"></label>
      <div style="font-size:12px;color:var(--dim);margin:2px 0 6px">Pan/zoom to your city, click <b style="color:var(--ink)">✏️ Draw area</b>, then drag a rectangle over it.</div>
      <div id="csmap" style="position:relative;height:360px;max-width:720px;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#0d1117;cursor:grab;user-select:none">
        <div id="cstiles" style="position:absolute;inset:0"></div>
        <div id="csrect" style="position:absolute;display:none;border:2px solid var(--accent);background:rgba(59,130,246,.18);pointer-events:none;box-shadow:0 0 0 9999px rgba(3,7,12,.35)"></div>
        <div style="position:absolute;top:8px;right:8px;display:flex;flex-direction:column;gap:6px">
          <button class="pbtn" id="cs-draw" style="font-size:12px">✏️ Draw area</button>
          <div style="display:flex;gap:6px;justify-content:flex-end"><button class="pbtn" id="cs-zin" style="width:30px">+</button><button class="pbtn" id="cs-zout" style="width:30px">−</button></div>
        </div>
        <div style="position:absolute;bottom:4px;right:6px;font-size:10px;color:#8b949e;background:#0d1117aa;padding:1px 5px;border-radius:4px">© OpenStreetMap</div>
      </div>
      <div id="cs-bbox" class="muted" style="font-size:12px;margin:8px 0">${ib?('<b style="color:var(--ink)">Area drawn.</b> Redraw to change it.'):'No area drawn yet — pan/zoom and drag a rectangle.'}</div>
      <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:520px">
        <label style="font-size:11px;color:var(--dim)">West<input id="cs-w" class="search" style="margin:3px 0 0;width:100%" value="${ib?ib[0]:''}"></label>
        <label style="font-size:11px;color:var(--dim)">South<input id="cs-s" class="search" style="margin:3px 0 0;width:100%" value="${ib?ib[1]:''}"></label>
        <label style="font-size:11px;color:var(--dim)">East<input id="cs-e" class="search" style="margin:3px 0 0;width:100%" value="${ib?ib[2]:''}"></label>
        <label style="font-size:11px;color:var(--dim)">North<input id="cs-n" class="search" style="margin:3px 0 0;width:100%" value="${ib?ib[3]:''}"></label>
      </div>
    </div></div>`;

  // ── STEP 2 · Connect your data ────────────────────────────────────────────────────────
  const bothOk=gs.s==='ok'&&os.s==='ok';
  html+=`<div class="step ${bothOk?'done':(hasAoi?'active':'')}" id="s2">
    <div class="sthead"><div class="snum">${bothOk?'✓':'2'}</div>
      <div><div class="sttitle">Connect your data <span class="muted" style="font-weight:400">(optional but recommended)</span></div>
      <div class="stsub">Two free accounts unlock the satellite &amp; map layers. Skip and only the automatic layers build.</div></div></div>
    <div class="stbody">
      ${card('gee','🛰️','Google Earth Engine key','Powers land cover, terrain, hydrology, buildings &amp; population',gs.s,
        gs.s==='ok'?`Connected · ${gs.total} layers`:(gs.set?`${gs.set} of ${gs.total} set`:'Not connected'),
        `<ol class="howto">${GEE_STEPS.map(s=>'<li>'+s+'</li>').join('')}</ol>
         <div class="muted" style="font-size:12px">Paste the whole contents of the downloaded <b>.json</b> key file:</div>
         <textarea id="gee-key" class="key" placeholder='{ "type": "service_account", "project_id": "...", "client_email": "...@...gserviceaccount.com", "private_key": "-----BEGIN PRIVATE KEY-----\\n..." }'></textarea>
         <div class="keycol"><button class="pbtn pri" id="gee-save">Connect key</button>
           <span class="muted" style="font-size:12px;align-self:center">Stored encrypted in your tenant vault — applied to all ${gs.total||6} satellite layers. Never leaves your platform.</span></div>`)}
      ${card('osm','🗺️','OpenStreetMap file','Powers roads &amp; critical facilities',os.s,
        os.s==='ok'?`Uploaded${osmAsset()&&osmAsset().filename?' · '+esc(osmAsset().filename.slice(0,28)):''}`:'Not uploaded',
        `<ol class="howto">${OSM_STEPS.map(s=>'<li>'+s+'</li>').join('')}</ol>
         ${osmAsset()?`<div class="muted" style="font-size:12px;margin-bottom:6px">Current file: <b style="color:var(--ink)">${esc(osmAsset().filename||'set')}</b> ${osmAsset().size_bytes?'· '+fmtSize(osmAsset().size_bytes):''}. Fetch or upload a new one to replace it.</div>`:''}
         <div style="display:flex;gap:8px;align-items:center;margin:6px 0">
           <input id="osm-url" class="search" style="flex:1;min-width:0" placeholder="https://download.geofabrik.de/asia/india-latest.osm.pbf">
           <button class="pbtn pri" id="osm-fetch" style="flex:none">Fetch</button></div>
         <div class="bar" id="osm-bar" style="display:none"><i></i></div>
         <div class="muted" id="osm-prog" style="font-size:12px;margin-top:4px;display:none"></div>
         <details style="margin-top:8px"><summary class="muted" style="cursor:pointer;font-size:12px">…or upload a file from this computer instead</summary>
           <input type="file" id="osm-file" accept=".pbf,.osm.pbf,application/octet-stream" style="display:none">
           <div class="drop" id="osm-drop" style="margin-top:8px">📁 Choose your <b>.osm.pbf</b> file — or drop it here</div>
         </details>`)}
      <div class="note"><span style="font-size:15px">☑</span><div><b style="color:#8ee0a6">Rainfall, heat &amp; forecast are automatic.</b> They pull free open weather data — nothing to set up.</div></div>
    </div></div>`;

  // ── STEP 3 · Build ────────────────────────────────────────────────────────────────────
  const ready=[
    {t:'Rainfall · heat · forecast',ok:true,how:'automatic (open weather data)'},
    {t:'Land cover · terrain · hydrology · buildings · population',ok:gs.s==='ok',how:gs.s==='ok'?'Earth Engine connected':'needs the Earth Engine key above'},
    {t:'Roads · critical facilities',ok:os.s==='ok',how:os.s==='ok'?'OpenStreetMap file uploaded':'needs the OpenStreetMap file above'}];
  const willskip=ready.filter(r=>!r.ok).length;
  html+=`<div class="step ${mat!=null?'':(hasAoi?'active':'')}" id="s3">
    <div class="sthead"><div class="snum">3</div>
      <div><div class="sttitle">Build the baseline</div>
      <div class="stsub">${mat!=null?'Re-build any time to add the layers you just connected.':'Runs everything you’ve connected and produces your City Scan.'}</div></div></div>
    <div class="stbody">
      <div style="max-width:640px">${ready.map(r=>`<div class="rrow"><span class="dot ${r.ok?'ok':'warn'}"></span><span>${r.t}</span><span class="rlayers">${r.ok?'✓ will build':'⚠ '+r.how}</span></div>`).join('')}</div>
      ${willskip?`<div class="muted" style="font-size:12px;margin-top:10px">You can build now — the ready layers run and the rest are skipped until you connect their data. Or connect them above first for the full baseline.</div>`:''}
      <label style="display:block;font-size:12px;color:var(--dim);max-width:520px;margin-top:12px">Priorities (comma) <span class="muted">— optional, guides intelligence layers</span>
        <input id="cs-pri" class="search" style="margin:4px 0 0;width:100%" value="growth, heat"></label>
      <div style="margin-top:14px"><button class="pbtn pri" id="cs-go" style="padding:9px 20px;font-size:14px">${mat!=null?'Re-build baseline':'Build City Baseline'}</button></div>
    </div></div>`;

  V.innerHTML=html;
  setupMap(V, ib);
  wireCards(V);
  V.querySelector('#cs-go').onclick=submitBuild;
}

function card(key,ico,title,sub,status,badgeText,body){
  const cls=OPEN[key]?'card open':'card';
  const bcls=status==='ok'?'badge ok':'badge warn';
  return `<div class="${cls}" data-card="${key}">
    <div class="cardhd"><span class="cico">${ico}</span>
      <div><div class="ctitle">${title}</div><div class="csub">${sub}</div></div>
      <span class="${bcls}" data-badge="${key}">${status==='ok'?'✓ ':'⚠ '}${badgeText}</span>
      <span class="caret">▶</span></div>
    <div class="cardbody">${body}</div></div>`;
}

function wireCards(V){
  V.querySelectorAll('[data-card]').forEach(el=>{
    const key=el.getAttribute('data-card');
    el.querySelector('.cardhd').onclick=()=>{OPEN[key]=!el.classList.contains('open');el.classList.toggle('open');};
  });
  const gk=V.querySelector('#gee-save'); if(gk) gk.onclick=()=>connectGee(V);
  const fb=V.querySelector('#osm-fetch'); if(fb) fb.onclick=()=>fetchOsmUrl(V);
  const uin=V.querySelector('#osm-url'); if(uin) uin.onkeydown=e=>{if(e.key==='Enter')fetchOsmUrl(V);};
  const drop=V.querySelector('#osm-drop'), fin=V.querySelector('#osm-file');
  if(drop&&fin){
    drop.onclick=()=>fin.click();
    fin.onchange=()=>{ if(fin.files[0]) uploadOsm(V,fin.files[0]); };
    drop.ondragover=e=>{e.preventDefault();drop.style.borderColor='var(--accent)';};
    drop.ondragleave=()=>{drop.style.borderColor='';};
    drop.ondrop=e=>{e.preventDefault();drop.style.borderColor='';if(e.dataTransfer.files[0])uploadOsm(V,e.dataTransfer.files[0]);};
  }
}

// ── connect the Earth Engine key: set the same secret on every EO driver ──────────────────
async function connectGee(V){
  const ta=V.querySelector('#gee-key'), raw=(ta.value||'').trim();
  if(!raw) return toast('paste your .json key first',true);
  let kj; try{ kj=JSON.parse(raw); }catch(e){ return toast('that isn’t valid JSON — copy the whole .json file',true); }
  if(!kj.client_email||!kj.private_key) return toast('this doesn’t look like a service-account key (needs client_email + private_key)',true);
  const comps=geeComps(); if(!comps.length) return toast('no satellite layers installed',true);
  const btn=V.querySelector('#gee-save'); btn.disabled=true; btn.textContent='Connecting…';
  let okn=0, err='';
  for(const c of comps){
    const r=await jpost('/bridge/secret',{action:'set',component:c.component,name:'GEE_SERVICE_ACCOUNT_KEY',value:raw});
    if(r.ok) okn++; else err=r.j.error||('HTTP '+r.status);
  }
  btn.disabled=false; btn.textContent='Connect key';
  if(okn){ ta.value=''; OPEN.gee=false; toast(`Earth Engine connected — ${okn} satellite layers ready`); await refresh(); }
  else toast(err||'could not save key',true);
}

// ── fetch the OSM file SERVER-SIDE from a pasted URL → bind to every OSM driver ─────────────
async function fetchOsmUrl(V){
  const comps=osmComps(); if(!comps.length) return toast('no OSM layers installed',true);
  const roads=comps.find(c=>/osm-roads/.test(c.component))||comps[0];
  const others=comps.filter(c=>c.component!==roads.component).map(c=>c.component);
  const url=(V.querySelector('#osm-url').value||'').trim();
  if(!/^https:\/\/\S+\.osm\.pbf$/i.test(url) && !/^https:\/\//i.test(url)) return toast('paste a valid https link to a .osm.pbf file',true);
  const bar=V.querySelector('#osm-bar'), fill=bar.querySelector('i'), prog=V.querySelector('#osm-prog'), btn=V.querySelector('#osm-fetch');
  bar.style.display='block'; prog.style.display='block'; fill.style.background='var(--accent)'; fill.style.width='4%';
  prog.textContent='Starting download…'; btn.disabled=true;
  const r=await jpost('/bridge/asset',{action:'from_url',component:roads.component,asset:'OSM_PBF',
    populates:'OSM_PBF_FILE_ID',url,bind_to:others});
  if(!r.ok){ btn.disabled=false; prog.textContent='Fetch failed: '+(r.j.error||('HTTP '+r.status)); fill.style.background='#f85149'; return toast(r.j.error||'fetch failed',true); }
  // poll progress
  const tick=async()=>{
    const s=await jpost('/bridge/asset',{action:'url_status',component:roads.component,asset:'OSM_PBF'});
    const j=s.j&&s.j.job; if(!j){ return setTimeout(tick,1500); }
    if(j.status==='downloading'){
      const p=j.total?Math.min(0.95,j.downloaded/j.total):0.3;
      fill.style.width=(p*100).toFixed(0)+'%';
      prog.textContent=`Downloading ${fmtSize(j.downloaded)}${j.total?' of '+fmtSize(j.total):''}…`;
      return setTimeout(tick,1200);
    }
    if(j.status==='storing'){ fill.style.width='97%'; prog.textContent='Storing…'; return setTimeout(tick,1200); }
    if(j.status==='done'){ fill.style.width='100%'; prog.textContent='Fetched ✓'; btn.disabled=false; OPEN.osm=false;
      toast('OpenStreetMap file fetched — roads & facilities ready'); return refresh(); }
    if(j.status==='failed'){ btn.disabled=false; fill.style.background='#f85149'; prog.textContent='Fetch failed: '+(j.error||'error'); return toast(j.error||'fetch failed',true); }
    setTimeout(tick,1500);
  };
  setTimeout(tick,1000);
}

// ── upload one OSM file → bind it to every OSM driver (roads + facilities) ─────────────────
async function uploadOsm(V,file){
  const comps=osmComps(); if(!comps.length) return toast('no OSM layers installed',true);
  const roads=comps.find(c=>/osm-roads/.test(c.component))||comps[0];
  const others=comps.filter(c=>c.component!==roads.component);
  const bar=V.querySelector('#osm-bar'), fill=bar.querySelector('i'), prog=V.querySelector('#osm-prog'), drop=V.querySelector('#osm-drop');
  bar.style.display='block'; prog.style.display='block'; drop.style.pointerEvents='none'; drop.style.opacity='.6';
  const setp=(p,t)=>{fill.style.width=(p*100).toFixed(1)+'%';prog.textContent=t;};
  try{
    setp(0,'Preparing upload…');
    const init=await jpost('/bridge/asset',{action:'init',component:roads.component,asset:'OSM_PBF'});
    if(!init.ok) throw new Error(init.j.error||'init failed');
    // 512 KB raw → ~700 KB base64 JSON body, safely under a 1 MB proxy body cap (TLS front default).
    const uid=init.j.upload_id, CH=512*1024;
    for(let off=0;off<file.size;off+=CH){
      const blob=file.slice(off,Math.min(off+CH,file.size));
      const b64=await new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>res(fr.result.split(',')[1]);fr.onerror=rej;fr.readAsDataURL(blob);});
      const ch=await jpost('/bridge/asset',{action:'chunk',upload_id:uid,data_b64:b64});
      if(!ch.ok) throw new Error(ch.j.error||'chunk failed');
      setp(Math.min(off+CH,file.size)/file.size*0.95,`Uploading ${fmtSize(Math.min(off+CH,file.size))} of ${fmtSize(file.size)}…`);
    }
    setp(0.97,'Finalising…');
    const fin=await jpost('/bridge/asset',{action:'finish',upload_id:uid,filename:file.name,size_bytes:file.size,
      content_type:'application/octet-stream',populates:'OSM_PBF_FILE_ID'});
    if(!fin.ok) throw new Error(fin.j.error||'finish failed');
    for(const o of others){ await jpost('/bridge/asset',{action:'bind',component:o.component,asset:'OSM_PBF',
      populates:'OSM_PBF_FILE_ID',file_id:fin.j.file_id,filename:file.name,size_bytes:file.size,
      content_type:'application/octet-stream',from_component:roads.component}); }
    setp(1,'Uploaded ✓');
    OPEN.osm=false; toast(`OpenStreetMap file uploaded — roads & facilities ready`); await refresh();
  }catch(e){ toast('upload failed: '+e.message,true); prog.textContent='Upload failed: '+e.message; fill.style.background='#f85149'; drop.style.pointerEvents=''; drop.style.opacity=''; }
}

async function refresh(){ PENDING=captureForm(); try{ C=await jget('/bridge/connections'); }catch(e){} render(); }

async function submitBuild(){
  const V=document.getElementById('view');
  const name=V.querySelector('#cs-name').value.trim();
  const bbox=['#cs-w','#cs-s','#cs-e','#cs-n'].map(id=>parseFloat(V.querySelector(id).value));
  if(!name) return toast('enter a city name',true);
  if(bbox.some(v=>isNaN(v))) return toast('draw an area on the map first',true);
  if(!(bbox[0]<bbox[2]&&bbox[1]<bbox[3])) return toast('invalid rectangle — draw again',true);
  const priorities=V.querySelector('#cs-pri').value.split(',').map(s=>s.trim()).filter(Boolean);
  const r=await jpost('/bridge/city-onboard',{name,bbox,priorities});
  if(r.ok){ toast('baseline started'); PENDING=null; D=await jget('/bridge/city-onboard'); render(); } else toast(r.j.error||'failed',true);
}

// ── OSM slippy-map AOI picker — tiles via the app's declared /bridge/fetch egress ─────────
function setupMap(V, initBbox){
  const TS=256, P2=z=>Math.pow(2,z);
  const lon2wx=(lo,z)=>(lo+180)/360*TS*P2(z);
  const lat2wy=(la,z)=>{const s=Math.max(-.9999,Math.min(.9999,Math.sin(la*Math.PI/180)));return (0.5-Math.log((1+s)/(1-s))/(4*Math.PI))*TS*P2(z);};
  const wx2lon=(x,z)=>x/(TS*P2(z))*360-180;
  const wy2lat=(y,z)=>{const n=Math.PI*(1-2*y/(TS*P2(z)));return 180/Math.PI*Math.atan(0.5*(Math.exp(n)-Math.exp(-n)));};
  const box=V.querySelector('#csmap'), layer=V.querySelector('#cstiles'), rectEl=V.querySelector('#csrect');
  if(!box) return;
  let M={lat:20.6,lng:78.9,z:5}, SEL=null, MODE='pan', cache={};
  if(initBbox){ M.lng=(initBbox[0]+initBbox[2])/2; M.lat=(initBbox[1]+initBbox[3])/2; M.z=10; SEL={w:initBbox[0],s:initBbox[1],e:initBbox[2],n:initBbox[3]}; }
  const origin=()=>{const W=box.clientWidth||700,H=box.clientHeight||360;return {W,H,ox:lon2wx(M.lng,M.z)-W/2,oy:lat2wy(M.lat,M.z)-H/2};};
  function draw(){
    const {W,H,ox,oy}=origin(), nT=P2(M.z);
    const x0=Math.floor(ox/TS),x1=Math.floor((ox+W)/TS),y0=Math.floor(oy/TS),y1=Math.floor((oy+H)/TS);
    layer.innerHTML='';
    for(let tx=x0;tx<=x1;tx++)for(let ty=y0;ty<=y1;ty++){
      if(ty<0||ty>=nT) continue;
      const wx=((tx%nT)+nT)%nT, key=M.z+'/'+wx+'/'+ty;
      const img=document.createElement('img'); img.className='cstile';
      img.style.left=(tx*TS-ox)+'px'; img.style.top=(ty*TS-oy)+'px';
      if(cache[key]) img.src=cache[key];
      else fetch('/bridge/fetch',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({app_id:'city-setup',url:'https://tile.openstreetmap.org/'+key+'.png'})})
        .then(r=>r.json()).then(o=>{if(o&&o.body_b64){const u='data:'+(o.content_type||'image/png')+';base64,'+o.body_b64;cache[key]=u;img.src=u;}}).catch(()=>{});
      layer.appendChild(img);
    }
    drawRect();
  }
  function drawRect(){
    if(!SEL){ rectEl.style.display='none'; return; }
    const {ox,oy}=origin();
    const a=lon2wx(SEL.w,M.z)-ox,b=lon2wx(SEL.e,M.z)-ox,c=lat2wy(SEL.n,M.z)-oy,e=lat2wy(SEL.s,M.z)-oy;
    rectEl.style.display='block'; rectEl.style.left=Math.min(a,b)+'px'; rectEl.style.top=Math.min(c,e)+'px';
    rectEl.style.width=Math.abs(b-a)+'px'; rectEl.style.height=Math.abs(e-c)+'px';
  }
  const geoAt=(cx,cy)=>{const {ox,oy}=origin();return {lng:wx2lon(ox+cx,M.z),lat:wy2lat(oy+cy,M.z)};};
  function commit(){ if(!SEL)return;
    V.querySelector('#cs-w').value=SEL.w.toFixed(4); V.querySelector('#cs-e').value=SEL.e.toFixed(4);
    V.querySelector('#cs-s').value=SEL.s.toFixed(4); V.querySelector('#cs-n').value=SEL.n.toFixed(4);
    V.querySelector('#cs-bbox').innerHTML='<b style="color:var(--ink)">Area drawn:</b> W '+SEL.w.toFixed(3)+', S '+SEL.s.toFixed(3)+' → E '+SEL.e.toFixed(3)+', N '+SEL.n.toFixed(3);
  }
  const dbtn=V.querySelector('#cs-draw');
  const setMode=m=>{MODE=m; dbtn.style.background=m==='draw'?'var(--accent)':''; dbtn.style.color=m==='draw'?'#fff':''; box.style.cursor=m==='draw'?'crosshair':'grab';};
  dbtn.onclick=()=>setMode(MODE==='draw'?'pan':'draw');
  V.querySelector('#cs-zin').onclick=()=>{M.z=Math.min(18,M.z+1);draw();};
  V.querySelector('#cs-zout').onclick=()=>{M.z=Math.max(2,M.z-1);draw();};
  let drag=null;
  box.addEventListener('mousedown',ev=>{const r=box.getBoundingClientRect();
    if(MODE==='draw'){drag={m:'draw',a:geoAt(ev.clientX-r.left,ev.clientY-r.top)};}
    else{drag={m:'pan',x:ev.clientX,y:ev.clientY,lat:M.lat,lng:M.lng};box.style.cursor='grabbing';}
    ev.preventDefault();});
  addEventListener('mousemove',ev=>{ if(!drag)return; const r=box.getBoundingClientRect();
    if(drag.m==='draw'){const p=geoAt(ev.clientX-r.left,ev.clientY-r.top);
      SEL={w:Math.min(drag.a.lng,p.lng),e:Math.max(drag.a.lng,p.lng),s:Math.min(drag.a.lat,p.lat),n:Math.max(drag.a.lat,p.lat)}; drawRect();}
    else{const cwx=lon2wx(drag.lng,M.z)-(ev.clientX-drag.x), cwy=lat2wy(drag.lat,M.z)-(ev.clientY-drag.y);
      M.lng=wx2lon(cwx,M.z); M.lat=wy2lat(cwy,M.z); draw();}});
  addEventListener('mouseup',()=>{ if(!drag)return; if(drag.m==='draw'&&SEL)commit(); if(drag.m==='pan')box.style.cursor=(MODE==='draw'?'crosshair':'grab'); drag=null;});
  box.addEventListener('wheel',ev=>{ev.preventDefault();M.z=Math.max(2,Math.min(18,M.z+(ev.deltaY<0?1:-1)));draw();},{passive:false});
  if(SEL) commit();
  draw();
}

(async()=>{ try{ await loadAll(); render(); }catch(e){ document.getElementById('view').innerHTML='<div class="empty">not authorized</div>'; } })();
