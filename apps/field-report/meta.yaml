# An APP (kind=app) — Field Report: ground teams & certified volunteers file civic INCIDENTS (Civic vertical, slice 3).
# The form posts to /bridge/report-incident, which writes a governed signal.incident obo the user and derives the
# trust tier (a valid credential.volunteer → certified_volunteer; an ops/ground role → ground_team; else citizen).
# The report-triage engine then classifies each into a civic.issue and routes actionable ones to the agency's Inbox.
