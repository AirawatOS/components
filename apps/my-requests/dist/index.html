<style>
  :root{color-scheme:light dark}
  *{box-sizing:border-box}
  body{font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;margin:0;background:#0d1117;color:#e6edf3}
  header{padding:16px 20px;background:#161b22;border-bottom:1px solid #21262d;font-weight:600;font-size:17px}
  main{max-width:680px;margin:0 auto;padding:18px}
  .card{background:#161b22;border:1px solid #21262d;border-radius:12px;padding:0;margin:12px 0;overflow:hidden}
  .req{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px;border-top:1px solid #21262d}
  .req:first-child{border-top:0}
  .svc{font-weight:600}.by{color:#8b949e;font-size:13px}
  .pill{display:inline-block;border-radius:999px;padding:2px 10px;font-size:12px;text-transform:capitalize}
  .received,.open{background:#0d2b46;color:#58a6ff}.in-progress{background:#3a2e12;color:#d29922}
  .resolved,.closed{background:#12331f;color:#3fb950}.rejected{background:#3a1518;color:#f85149}
  .muted{color:#8b949e;font-size:13px;padding:16px}
  .btn{background:#21262d;color:#e6edf3;border:0;border-radius:8px;padding:7px 12px;cursor:pointer;font-size:13px}
</style>
<header>📋 My Requests <span class="muted" style="font-weight:400;font-size:13px">· across all agencies</span></header>
<main>
  <div style="display:flex;justify-content:flex-end"><button class="btn" onclick="load()">Refresh</button></div>
  <div id="list" class="card"><div class="muted">Loading your requests…</div></div>
</main>
<script>
const api=(p,b)=>fetch(p,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b||{})}).then(r=>r.json());
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const title=s=>String(s||'').replace(/[-_]/g,' ').replace(/\b\w/g,c=>c.toUpperCase());
async function load(){
  let t=[];
  try{ t=((await api('/bridge/service-transactions',{})).transactions||[]).slice().reverse(); }
  catch(e){ document.getElementById('list').innerHTML='<div class="muted">Could not load requests.</div>'; return; }
  document.getElementById('list').innerHTML = t.length ? t.map(x=>{
    const st=(x.status||'received'); const cls=st.replace(/\s+/g,'-');
    const ref=x.case?x.case.split('/').pop():(x.txn||'').split('/').pop();
    return `<div class="req"><div><div class="svc">${esc(title(x.service_id))}</div>
       <div class="by">${x.tenant?'to '+esc(title(x.tenant)):''}${ref?' · ref '+esc(ref):''}</div></div>
       <span class="pill ${esc(cls)}">${esc(title(st))}</span></div>`;
  }).join('') : '<div class="muted">You haven\'t filed any requests yet. Open <b>Jan Seva</b> to get started.</div>';
}
load();
</script>
