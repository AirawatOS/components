<!doctype html><meta charset="utf-8"><title>Marketplace</title>
<style>
  :root{--bg:#0d1117;--card:#161b22;--line:#21262d;--ink:#e6edf3;--dim:#8b949e;--accent:#2ea043;--blue:#3b82f6}
  html,body{margin:0;background:var(--bg);color:var(--ink);font:14px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  header{padding:16px 20px;border-bottom:1px solid var(--line)} h1{margin:0;font-size:18px}
  .sub{color:var(--dim);font-size:12px;margin-top:3px}
  .wrap{max-width:920px;margin:0 auto;padding:16px}
  .bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:6px 0 2px}
  .chip{font-size:12px;color:var(--dim);border:1px solid var(--line);border-radius:999px;padding:4px 12px;cursor:pointer;text-transform:capitalize}
  .chip.on{background:#1b2530;color:var(--ink);border-color:#2f3d4d}
  .count{margin-left:auto;color:var(--dim);font-size:12px}
  h2{font-size:13px;color:var(--dim);text-transform:uppercase;letter-spacing:.08em;margin:20px 0 10px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
  .k{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--dim);border:1px solid var(--line);border-radius:999px;padding:1px 8px}
  .name{font-weight:600;margin:8px 0 2px} .prov{color:var(--dim);font-size:12px}
  .cid{color:#5f6b78;font-size:11px;font-family:ui-monospace,Menlo,monospace;word-break:break-all;margin-top:2px}
  .row{display:flex;align-items:center;gap:8px;margin-top:11px;flex-wrap:wrap}
  .price{font-size:12px} .free{color:var(--accent)} .paid{color:#d29922}
  .cert{font-size:11px;color:var(--accent)} .cert.bad{color:#f85149}
  button{margin-left:auto;background:var(--blue);color:#fff;border:0;border-radius:7px;padding:6px 12px;font-size:12px;cursor:pointer}
  button.danger{background:transparent;color:#f0a3a3;border:1px solid #7a3b3b}
  button.danger:hover{background:#5a2a2a;color:#ffd6d6}
  button:disabled{opacity:.55;cursor:default}
  button:disabled{background:#30363d;color:var(--dim);cursor:default}
  .members{color:var(--dim);font-size:11px;margin-top:6px}
  #msg{margin:10px 0;color:var(--dim);font-size:12px;min-height:16px}
  .pager{display:flex;align-items:center;gap:10px;justify-content:center;margin:16px 0;color:var(--dim);font-size:12px}
  .pbtn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:7px;padding:5px 12px;cursor:pointer}
  .pbtn:disabled{opacity:.4;cursor:default}
  .empty{color:var(--dim);text-align:center;padding:36px}
  .name.link{cursor:pointer} .name.link:hover{color:var(--blue)}
  .more{margin-left:auto;font-size:11px;color:var(--blue);cursor:pointer}
  /* detail modal */
  .ov{position:fixed;inset:0;background:rgba(1,4,9,.66);display:flex;align-items:center;justify-content:center;z-index:30;padding:20px}
  .sheet{background:var(--card);border:1px solid var(--line);border-radius:16px;max-width:640px;width:100%;max-height:88vh;overflow:auto;padding:22px 24px}
  .sheet h2{font-size:19px;color:var(--ink);text-transform:none;letter-spacing:0;margin:0 0 4px}
  .sheet .desc{color:#c9d4e0;line-height:1.6;margin:12px 0 6px}
  .sheet .sec{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.07em;margin:18px 0 8px;border-bottom:1px solid var(--line);padding-bottom:5px}
  .kv2{display:grid;grid-template-columns:130px 1fr;gap:6px 14px;font-size:13px}
  .kv2 .k2{color:var(--dim)}
  .tagm{display:inline-block;font-size:11px;font-family:ui-monospace,Menlo,monospace;background:#0d1117;border:1px solid var(--line);border-radius:6px;padding:2px 8px;margin:0 5px 5px 0;color:#c9d4e0}
  .tagm.r{border-color:#1f6f3f;color:#3fb950} .tagm.w{border-color:#8a6d1a;color:#e3b341} .tagm.e{border-color:#6e40c9;color:#d2a8ff}
  .xclose{float:right;color:var(--dim);cursor:pointer;font-size:18px;line-height:1;margin:-4px -4px 0 0}
</style>
<header><h1>Marketplace</h1><div class="sub" id="who">…</div></header>
<div class="wrap">
  <div class="bar" id="filters"></div>
  <div id="msg"></div>
  <div id="solsWrap"><h2>Solutions</h2><div class="grid" id="sols"></div></div>
  <div id="compsWrap"><h2 id="compsHd">Components</h2><div class="grid" id="comps"></div>
    <div class="pager" id="pager"></div></div>
</div>
<script>
let INSTALLED=[], DATA={components:[],solutions:[]}, FILTER='all', PAGE=0; const SIZE=12;
// One consistent display name for ANY listing: its declared title, else the id's final segment prettified
// (never the raw "kind/name" path). e.g. ds:airawat:app/air-explorer → "Air Explorer".
function pretty(s){return (s||'').replace(/[-_]/g,' ').replace(/\b\w/g,c=>c.toUpperCase());}
const KIND={agent:'AI Expert',skill:'Skill',engine:'Engine',driver:'Driver',model:'Model',app:'App',service:'Service',pipeline:'Pipeline'};
function kindLabel(k){return KIND[k]||k;}
function niceName(o){ if(o.title) return o.title; const id=o.component_id||o.solution_id||''; return pretty(id.split(':').pop().split('/').pop()); }
function priceLabel(p){ p=p||{}; if(p.model==='free'||!p.model) return '<span class="price free">Free</span>';
  if(p.model==='licensed') return `<span class="price paid">Licensed · ${p.price||''} ${p.currency||''}/${p.unit||'yr'}</span>`;
  if(p.model==='metered') return `<span class="price paid">Metered · ${p.price||''} ${p.currency||''}/${p.unit||'call'}</span>`;
  return `<span class="price">${p.model}</span>`; }
function esc(s){return (s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
async function install(kind,id,btn,members){
  btn.disabled=true; btn.textContent='Installing…';
  const m=document.getElementById('msg');
  try{
    const r=await fetch('/bridge/install',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({kind,id})}).then(r=>r.json());
    if(r.error){ m.textContent='✗ '+r.error+' (install needs a tenant-admin session)'; wireInstallBtn(btn,kind,id,{installable:true,label:'Install',members}); return; }
    // `members` is an ARRAY for a component fan-out but an integer COUNT for a solution install — handle both.
    const mem=r.members; const n=Array.isArray(mem)?mem.filter(x=>!x.error).length:(typeof mem==='number'?mem:0);
    const apps=(r.shelved_apps||[]).length;
    m.textContent='✓ installed '+pretty(id.split('/').pop())+(n?` (${n} component${n>1?'s':''})`:'')+(apps?` — added ${apps} app${apps>1?'s':''} to your desktop (refresh to see it)`:'');
    if(!INSTALLED.includes(id)) INSTALLED.push(id);         // now installed → button flips to Uninstall
    wireInstallBtn(btn,kind,id,{installable:true,label:'Install',members});
  }catch(e){                                               // never leave the button stuck on 'Installing…'
    m.textContent='✗ install failed: '+(e && e.message || e); wireInstallBtn(btn,kind,id,{installable:true,label:'Install',members});
  }
}
async function uninstall(kind,id,btn,members){
  btn.disabled=true; btn.textContent='Uninstalling…';
  const m=document.getElementById('msg');
  try{
    const r=await fetch('/bridge/uninstall',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({kind,id,members})}).then(r=>r.json());
    if(r.error){ m.textContent='✗ '+r.error; wireInstallBtn(btn,kind,id,{installable:true,label:'Install',members}); return; }
    m.textContent='✓ uninstalled '+pretty(id.split('/').pop())+(id.includes(':app/')?' — removed from your desktop (refresh)':' — grants revoked')+(r.errors&&r.errors.length?' (some grants could not be revoked)':'');
    INSTALLED=INSTALLED.filter(x=>x!==id);                  // no longer installed → button flips back to Install
    wireInstallBtn(btn,kind,id,{installable:true,label:'Install',members});
  }catch(e){
    m.textContent='✗ uninstall failed: '+(e && e.message || e); wireInstallBtn(btn,kind,id,{installable:true,label:'Install',members});
  }
}
// One place that decides a listing's action button: Uninstall if installed, else Install (or Unavailable).
function wireInstallBtn(b,kind,id,opts){
  opts=opts||{}; const installed=INSTALLED.includes(id); const installable=opts.installable!==false;
  b.classList.toggle('danger', installed);
  if(installed){ b.textContent='Uninstall'; b.disabled=false; b.onclick=()=>uninstall(kind,id,b,opts.members); }
  else if(installable){ b.textContent=opts.label||'Install'; b.disabled=false; b.onclick=()=>install(kind,id,b,opts.members); }
  else { b.textContent='Unavailable'; b.disabled=true; b.onclick=null; }
  return b;
}
function compCard(c){
  const installed=INSTALLED.includes(c.component_id);
  const installable = c.certified && c.serveable!==false;   // apps must be digest-verified serveable by the host
  const badge = c.certified ? '<span class="cert">✓ certified</span>'
              : c.cert_note ? '<span class="cert bad">⚠ cert stale</span>'
              : '<span class="cert bad">uncertified</span>';
  const mem=(c.members||[]);   // an AI Expert (kind=agent) bundles Skills — installing it fans out to them
  const el=document.createElement('div'); el.className='card';
  const dsc=c.description?`<div class="prov" style="margin-top:7px;color:#a9b6c4;line-height:1.5">${esc(c.description.slice(0,110))}${c.description.length>110?'…':''}</div>`:'';
  el.innerHTML=`<span class="k">${esc(kindLabel(c.kind))}</span>
    <div class="name link">${esc(niceName(c))}</div>
    <div class="prov">${esc(c.provider||'')} · v${c.version}</div>
    <div class="cid">${esc(c.component_id)}</div>
    ${dsc}
    ${mem.length?`<div class="members">Includes ${mem.length} skill${mem.length>1?'s':''}: ${mem.map(m=>pretty(m.split('/').pop())).join(' · ')}</div>`:''}
    <div class="row">${priceLabel(c.pricing)}${badge}<span class="more">Details ›</span></div>
    ${c.cert_note?`<div class="prov" style="color:#d29922">${esc(c.cert_note)}</div>`:''}
    <div class="row"></div>`;
  el.querySelector('.name').onclick=()=>detail(c);
  el.querySelector('.more').onclick=()=>detail(c);
  const b=document.createElement('button');
  const label=mem.length?'Install Expert':'Install';
  wireInstallBtn(b,'component',c.component_id,{installable,label,members:mem});
  el.querySelector('.row:last-child').appendChild(b);
  return el;
}
function detail(c){
  const installed=INSTALLED.includes(c.component_id);
  const installable=c.certified && c.serveable!==false;
  const mem=(c.members||[]);
  const reads=c.schemas&&c.schemas.reads||c.reads||[], writes=c.schemas&&c.schemas.writes||c.writes||[];
  const flat=Array.isArray(c.schemas)?c.schemas:[];   // some listings carry a flat schema list
  const secrets=(c.secrets||[]).map(s=>s.name||s), egress=c.egress||[], scopes=c.scopes||[];
  const badge=c.certified?'<span class="cert">✓ certified</span>':'<span class="cert bad">uncertified</span>';
  const tags=(arr,cls)=>arr.length?arr.map(x=>`<span class="tagm ${cls}">${esc(typeof x==='string'?x:(x.scope||x.name||JSON.stringify(x)))}</span>`).join(''):'<span class="prov">none</span>';
  const ov=document.createElement('div'); ov.className='ov';
  ov.innerHTML=`<div class="sheet">
    <span class="xclose" id="xc">✕</span>
    <span class="k">${esc(kindLabel(c.kind))}</span> ${badge}
    <h2>${esc(niceName(c))}</h2>
    <div class="prov">${esc(c.provider||'')} · v${esc(c.version||'')}${c.published_at?' · listed '+esc(String(c.published_at).slice(0,10)):''}</div>
    <div class="cid">${esc(c.component_id)}</div>
    ${c.description?`<div class="desc">${esc(c.description)}</div>`:'<div class="desc" style="color:var(--dim)">No description provided.</div>'}
    ${mem.length?`<div class="sec">Includes (${mem.length})</div><div>${mem.map(m=>`<span class="tagm">${esc(pretty(m.split('/').pop()))}</span>`).join('')}</div>`:''}
    ${(reads.length||writes.length||flat.length)?`<div class="sec">Data it accesses</div>
      ${reads.length?`<div><span class="k2" style="font-size:12px;color:var(--dim)">reads&nbsp;</span>${tags(reads,'r')}</div>`:''}
      ${writes.length?`<div style="margin-top:4px"><span class="k2" style="font-size:12px;color:var(--dim)">writes&nbsp;</span>${tags(writes,'w')}</div>`:''}
      ${flat.length?`<div>${tags(flat,'r')}</div>`:''}`:''}
    ${egress.length?`<div class="sec">Network egress</div><div>${tags(egress,'e')}</div>`:''}
    ${scopes.length?`<div class="sec">Capabilities (scopes)</div><div>${tags(scopes,'w')}</div>`:''}
    ${secrets.length?`<div class="sec">Keys required</div><div>${tags(secrets,'')}</div><div class="prov" style="margin-top:4px">Set in the Components app (Settings → API keys) after install.</div>`:''}
    <div class="sec">Documentation</div><div id="mktdocs" class="prov">loading…</div>
    <div class="sec">Provenance</div>
    <div class="kv2"><div class="k2">Certificate</div><div class="cid" style="margin:0">${esc((c.certificate&&(c.certificate.id||c.certificate))||'—')}</div>
      <div class="k2">Visibility</div><div>${esc(c.visibility||'public')}</div></div>
    <div class="row" style="margin-top:18px"><span>${priceLabel(c.pricing)}</span></div>
  </div>`;
  document.body.appendChild(ov);
  loadMktDocs(c.component_id);                                  // ADR-0102 S3: packaged docs + Docs Assistant, before you install
  ov.querySelector('#xc').onclick=()=>ov.remove();
  ov.onclick=e=>{if(e.target===ov)ov.remove();};
  const btn=document.createElement('button');
  wireInstallBtn(btn,'component',c.component_id,{installable,label:(mem.length?'Install Expert':'Install'),members:mem});
  ov.querySelector('.row:last-child').appendChild(btn);
}
// ADR-0102 S3: render a component's PACKAGED documentation (+ inline Docs Assistant) inside the Marketplace
// detail modal, so a buyer can read the docs and ask questions BEFORE installing.
async function loadMktDocs(cid){
  const box=document.getElementById('mktdocs'); if(!box) return;
  let man={pages:[]};
  try{ man=await fetch('/bridge/component-docs?component='+encodeURIComponent(cid)+'&format=json').then(r=>r.json()); }catch(_){}
  const pages=man.pages||[];
  if(!pages.length){ box.innerHTML='<span style="color:var(--dim)">No documentation yet — the developer adds it in Studio (📝 Docs).</span>'; return; }
  box.innerHTML='<style>#mdbody h1{font-size:1.15rem;margin:.3em 0}#mdbody h2{font-size:1rem;margin:.8em 0 .3em}#mdbody h3{font-size:.95rem}#mdbody pre{overflow:auto;background:rgba(127,127,127,.12);padding:8px;border-radius:6px}#mdbody code{background:rgba(127,127,127,.15);padding:.05em .3em;border-radius:3px}#mdbody table{border-collapse:collapse}#mdbody td,#mdbody th{border:1px solid var(--line,#333);padding:4px 7px}#mdnav .tagm.on{outline:1px solid var(--dim)}</style>'
    +'<div id="mdnav" style="margin-bottom:6px"></div><div id="mdbody" style="line-height:1.55;max-height:340px;overflow:auto"></div>'
    +'<div style="display:flex;gap:6px;margin-top:8px"><input id="mdq" placeholder="Ask about this component…" style="flex:1;padding:6px 8px;border-radius:6px;border:1px solid var(--line,#333);background:transparent;color:inherit"><button id="mda" class="btn" style="padding:6px 10px">Ask</button></div><div id="mdans" style="margin-top:6px;color:var(--dim)"></div>';
  const nav=document.getElementById('mdnav');
  nav.innerHTML=pages.map(p=>`<span class="tagm" data-slug="${esc(p.slug)}" style="cursor:pointer">${esc(p.title||p.slug)}</span>`).join(' ');
  async function show(slug){
    nav.querySelectorAll('[data-slug]').forEach(el=>el.classList.toggle('on',el.dataset.slug===slug));
    try{
      const md=await fetch('/bridge/component-docs?component='+encodeURIComponent(cid)+'&page='+encodeURIComponent(slug)+'&format=md').then(r=>r.text());
      const r=await fetch('/bridge/doc-render',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({markdown:md})}).then(r=>r.json());
      document.getElementById('mdbody').innerHTML=(r&&r.html)||'';
    }catch(_){ document.getElementById('mdbody').textContent='(could not load)'; }
  }
  nav.querySelectorAll('[data-slug]').forEach(el=>el.onclick=()=>show(el.dataset.slug));
  show(pages[0].slug);
  const ask=async()=>{
    const q=(document.getElementById('mdq').value||'').trim(); if(!q)return;
    const a=document.getElementById('mdans'); a.textContent='thinking…';
    try{
      const r=await fetch('/bridge/doc-ask',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({component:cid,question:q})}).then(r=>r.json());
      a.innerHTML=esc(r.answer||r.error||'').replace(/\n/g,'<br>')+((r.sources&&r.sources.length)?'<div style="margin-top:4px;font-size:12px">Sources: '+r.sources.map(s=>esc(s.slug)).join(', ')+'</div>':'');
    }catch(_){ a.textContent='the assistant is unavailable right now.'; }
  };
  document.getElementById('mda').onclick=ask;
  document.getElementById('mdq').addEventListener('keydown',e=>{if(e.key==='Enter')ask();});
}
function solCard(s){
  const el=document.createElement('div'); el.className='card';
  el.innerHTML=`<span class="k">solution</span>
    <div class="name">${esc(niceName(s))}</div><div class="prov">v${s.version} · ${s.members.length} components</div>
    <div class="members">${s.members.map(m=>pretty(m.split('/').pop())).join(' · ')}</div><div class="row"></div>`;
  const b=document.createElement('button'); wireInstallBtn(b,'solution',s.solution_id,{installable:true,label:'Install',members:s.members});
  el.querySelector('.row').appendChild(b); return el;
}
function renderFilters(){
  const kinds=[...new Set(DATA.components.map(c=>c.kind))].sort();
  if((DATA.solutions||[]).length && !kinds.includes('solution')) kinds.push('solution');   // avoid a duplicate 'solution' chip when solutions are also registered as components
  const F=document.getElementById('filters');
  F.innerHTML=['all',...kinds].map(k=>`<span class="chip ${FILTER===k?'on':''}" data-k="${k}">${k==='all'?'all':esc(kindLabel(k))}</span>`).join('');
  F.querySelectorAll('.chip').forEach(el=>el.onclick=()=>{FILTER=el.dataset.k;PAGE=0;render();});
}
function render(){
  renderFilters();
  const showSols=(FILTER==='all'||FILTER==='solution');
  document.getElementById('solsWrap').style.display=showSols&&(DATA.solutions||[]).length?'':'none';
  const ss=document.getElementById('sols'); ss.innerHTML='';
  if(showSols)(DATA.solutions||[]).forEach(s=>ss.appendChild(solCard(s)));
  const showComps=(FILTER!=='solution');
  document.getElementById('compsWrap').style.display=showComps?'':'none';
  const cs=document.getElementById('comps'); cs.innerHTML='';
  let comps=DATA.components.slice().sort((a,b)=>(a.kind+niceName(a)).localeCompare(b.kind+niceName(b)));
  if(FILTER!=='all') comps=comps.filter(c=>c.kind===FILTER);
  document.getElementById('compsHd').textContent=`Components (${comps.length})`;
  const total=comps.length, a=total?PAGE*SIZE:0, b=Math.min((PAGE+1)*SIZE,total);
  if(!total) cs.innerHTML='<div class="empty">no components of this type</div>';
  else comps.slice(a,b).forEach(c=>cs.appendChild(compCard(c)));
  document.getElementById('pager').innerHTML= total>SIZE
    ? `<button class="pbtn" id="prev" ${PAGE<=0?'disabled':''}>‹ Prev</button><span>${a+1}–${b} of ${total}</span><button class="pbtn" id="next" ${b>=total?'disabled':''}>Next ›</button>`
    : '';
  const p=document.getElementById('prev'), n=document.getElementById('next');
  if(p)p.onclick=()=>{if(PAGE>0){PAGE--;render();}}; if(n)n.onclick=()=>{PAGE++;render();};
  document.getElementById('count')&&(document.getElementById('count').textContent='');
}
(async function(){
  fetch('/session').then(r=>r.json()).then(se=>document.getElementById('who').textContent=se.authenticated?('signed in as '+se.sub+(se.roles?' · '+se.roles.join(','):'')):'not signed in');
  const d=await fetch('/bridge/market').then(r=>r.json());
  INSTALLED=d.installed||[]; DATA={components:d.components||[],solutions:d.solutions||[]};
  render();
})();
</script>
