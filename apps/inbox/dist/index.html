<!doctype html><meta charset="utf-8"><title>Inbox</title>
<style>
  :root{--bg:#0d1117;--card:#161b22;--line:#21262d;--ink:#e6edf3;--dim:#8b949e;--accent:#3b82f6}
  html,body{margin:0;background:var(--bg);color:var(--ink);font:14px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  header{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;align-items:baseline;gap:10px}
  h1{margin:0;font-size:18px} .who{color:var(--dim);font-size:12px}
  .wrap{max-width:760px;margin:0 auto;padding:14px 16px}
  .item{display:flex;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:9px;cursor:pointer}
  .item:hover{border-color:#30363d;background:#1a2029}
  .dot{width:9px;height:9px;border-radius:50%;margin-top:5px;flex:none}
  .task{background:#d29922} .notification{background:#3b82f6} .decision{background:#2ea043}
  .it-title{font-weight:600} .it-body{color:var(--dim);font-size:13px;margin-top:2px}
  .meta{color:#6e7681;font-size:11px;margin-top:5px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .pill{border:1px solid var(--line);border-radius:999px;padding:1px 8px;text-transform:uppercase;letter-spacing:.04em}
  .pill.k-task{color:#7cc4ff;border-color:#234a6e} .pill.k-notification{color:#e6c34a;border-color:#5a4d16} .pill.k-decision{color:#c79bff;border-color:#4a3a6e}
  .badge{border-radius:999px;padding:1px 8px;text-transform:uppercase;letter-spacing:.04em;font-weight:700}
  .b-unread{background:#123a5e;color:#7cc4ff} .b-read{background:#1a2333;color:#8b98ad} .b-done{background:#14331f;color:#5fd08a}
  .item.st-unread{border-left:3px solid #2b6cb0} .item.st-unread .it-title{font-weight:700}
  .item.is-done{opacity:.5}
  .more{width:100%;margin-top:4px;padding:10px;background:var(--card);border:1px solid var(--line);border-radius:10px;color:var(--dim);cursor:pointer;font-size:13px}
  .more:hover{border-color:#2b6cb0;color:var(--ink)}
  .empty{color:var(--dim);text-align:center;padding:48px}
  .count{margin-left:10px;color:var(--dim);font-size:12px}
  .filters{margin-left:auto;display:flex;gap:5px}
  .fbtn{background:#141c28;border:1px solid var(--line);color:var(--dim);border-radius:14px;padding:3px 11px;font-size:11.5px;cursor:pointer}
  .fbtn.on{background:#123a5e;color:#7cc4ff;border-color:#2b6cb0}
  .scrim{position:fixed;inset:0;background:rgba(1,4,9,.6);display:none}.scrim.open{display:block}
  .drawer{position:fixed;top:0;right:0;bottom:0;width:min(460px,92vw);background:var(--card);border-left:1px solid var(--line);
          transform:translateX(100%);transition:transform .18s ease;overflow:auto;box-shadow:-16px 0 40px rgba(0,0,0,.4)}
  .drawer.open{transform:translateX(0)}
  .dhead{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:flex-start}
  .dhead h2{margin:0;font-size:15px;flex:1} .x{cursor:pointer;color:var(--dim);font-size:20px;line-height:1}
  .dbody{padding:16px 18px}
  .lbl{color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.05em;margin:14px 0 8px}
  .crumb{color:var(--accent);cursor:pointer;font-size:12px;margin-bottom:6px;display:inline-block}
  .subj{background:#0d1117;border:1px solid var(--line);border-radius:8px;padding:10px 12px;font:12px ui-monospace,SFMono-Regular,Menlo,monospace;color:#c9d1d9;white-space:pre-wrap;word-break:break-word}
  .loc{display:inline-block;font-size:11px;padding:2px 8px;border-radius:999px;margin-left:6px}
  .loc-local{background:#132a17;color:#3fb950;border:1px solid #238636}
  .loc-remote{background:#2b1d0e;color:#e3a008;border:1px solid #9e6a03}
  .loc-connector{background:#1a2233;color:#58a6ff;border:1px solid #1f6feb}
  .note{color:var(--dim);font-size:12px;margin-top:8px;line-height:1.5}
  .handler{color:#6e7681;font-size:11px;margin-top:12px;word-break:break-word}
  .rblk{background:#0d1117;border:1px solid var(--line);border-radius:8px;padding:12px 13px;margin-bottom:10px}
  .rlabel{color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px;display:flex;gap:8px;align-items:center}
  .rk{border:1px solid var(--line);border-radius:4px;padding:0 5px;font-size:9px;color:#6e7681;text-transform:lowercase;letter-spacing:0}
  .ctitle{font-weight:600;font-size:14px} .csub{color:var(--dim);font-size:12px;margin-top:1px;margin-bottom:6px}
  .field{display:flex;justify-content:space-between;gap:12px;padding:4px 0;border-top:1px solid #1a1f27;font-size:13px}
  .field:first-of-type{border-top:none} .fl{color:var(--dim)} .fv{text-align:right;word-break:break-word}
  .tl-row{display:flex;gap:10px;padding:4px 0}
  .tl-dot{width:8px;height:8px;border-radius:50%;background:var(--accent);margin-top:4px;flex:none;box-shadow:0 0 0 3px rgba(59,130,246,.15)}
  .tl-ev{font-size:13px} .tl-meta{color:#6e7681;font-size:11px}
  .mapbox{display:block;background:#0a0e14;border:1px solid var(--line);border-radius:6px;margin-bottom:8px}
  .chip{display:inline-block;background:#161b22;border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:12px;margin-right:6px}
  .controls{margin-top:10px;display:flex;flex-wrap:wrap;gap:8px}
  .btn{border:1px solid var(--line);background:#21262d;color:var(--ink);border-radius:8px;padding:7px 14px;font-size:13px;cursor:pointer}
  .btn:disabled{opacity:.5;cursor:default}
  .btn.approve{background:#238636;border-color:#2ea043} .btn.reject{background:#3d1418;border-color:#8b2c30}
  .btn.primary{background:var(--accent);border-color:var(--accent)}
  .recopt{cursor:pointer;border:1px solid transparent;border-radius:9px;margin-bottom:8px}
  .recopt .rblk{margin-bottom:0}
  .recopt.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
  .receipt{margin-top:14px;border-top:1px solid var(--line);padding-top:10px}
  .ev{font:11px ui-monospace,Menlo,monospace;color:var(--dim);padding:2px 0;word-break:break-word}
  .disc{font-size:12.5px;line-height:1.55;color:var(--ink);white-space:normal}
  .rblk.clk{cursor:pointer} .rblk.clk:hover{border-color:var(--accent)}
  .chip.fact{cursor:pointer;font:11px ui-monospace,Menlo,monospace;margin:3px 6px 0 0} .chip.fact:hover{border-color:var(--accent)}
  .recl{color:var(--dim);font-size:11px;margin:2px 0 6px}
  .ok{color:#3fb950;margin-top:10px;font-size:13px;font-weight:600}
</style>
<header><h1>Inbox</h1><span class="who" id="who">…</span><span class="filters" id="filters"><button class="fbtn on" data-f="open">Open</button><button class="fbtn" data-f="done">Done</button><button class="fbtn" data-f="all">All</button></span><span class="count" id="count"></span></header>
<div class="wrap" id="list"><div class="empty">loading…</div></div>
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer">
  <div class="dhead"><span class="dot" id="d-dot"></span><h2 id="d-title"></h2><span class="x" id="d-close">×</span></div>
  <div class="dbody" id="d-body"></div>
</aside>
<script>
let APPID, ITEMS=[], NAV=[], FILTER='open';
const SCALE={viridis:'#5ec962',reds:'#e5484d',blues:'#4c8dff',aqi:'#f5a524'};
async function bpost(path,body){const r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});return {ok:r.ok,status:r.status,json:await r.json().catch(()=>({}))};}
async function query(schema,filter){const r=await bpost('/bridge/query',{app_id:APPID,schema,filter:filter||{}});if(!r.ok)throw new Error('bridge '+r.status);return r.json.results||[];}
async function resolveRef(ref){const r=await bpost('/bridge/resolve',{ref});if(!r.ok)throw new Error('resolve '+r.status);return r.json;}

async function boot(){
  const cfg=await fetch('./config.json').then(r=>r.json()); APPID=cfg.app_id;
  fetch('/session').then(r=>r.json()).then(se=>{document.getElementById('who').textContent=se.authenticated?se.sub:'';});
  document.querySelectorAll('.fbtn').forEach(b=>b.onclick=()=>{
    FILTER=b.dataset.f; document.querySelectorAll('.fbtn').forEach(x=>x.classList.toggle('on',x===b));
    SHOWN=Math.min(PAGE, filtered().length); paintList(); });
  await loadList();
}
const KIND={task:{i:'📋',l:'Task'}, notification:{i:'🔔',l:'Notice'}, decision:{i:'⚖️',l:'Decision'}};
function rel(ts){                                              // "2 min ago" · "5 days ago"
  const t=Date.parse(ts); if(isNaN(t)) return '';
  let d=(Date.now()-t)/1000; if(d<0) d=0;
  const U=[['year',31536000],['month',2592000],['day',86400],['hour',3600],['min',60]];
  for(const [n,s] of U){ const v=Math.floor(d/s); if(v>=1) return v+' '+n+(v>1&&n!=='min'?'s':'')+' ago'; }
  return 'just now';
}
let SHOWN=0; const PAGE=25;                                    // paging: render newest PAGE, "load more" for older
async function loadList(){
  ITEMS=await query('platform.inbox_item',{});
  ITEMS.sort((a,b)=>(b.created_at||'').localeCompare(a.created_at||''));
  SHOWN=Math.min(PAGE, ITEMS.length);
  paintList();
}
function filtered(){                                            // Open (not done) · Done (closed) · All
  return ITEMS.filter(i=>FILTER==='all'?true:FILTER==='done'?(i.status==='done'):(i.status!=='done'));
}
function paintList(){
  const FI=filtered();
  document.getElementById('count').textContent=FI.length+' '+FILTER+(FI.length===1?' item':' items')+(SHOWN<FI.length?' · showing '+SHOWN:'');
  const list=document.getElementById('list');
  if(!FI.length){list.innerHTML=`<div class="empty">${FILTER==='done'?'No completed items yet.':FILTER==='open'?'No open items — all caught up.':'Nothing in your inbox.'}</div>`;return;}
  const vis=FI.slice(0,SHOWN);
  list.innerHTML=vis.map((i,ix)=>{const K=KIND[i.kind]||{i:'•',l:i.kind};return `
    <div class="item st-${i.status||'unread'} ${i.status==='done'?'is-done':''}" data-ix="${ix}"><span class="dot ${i.kind}"></span>
      <div style="flex:1"><div class="it-title">${esc(i.title)}</div>
        ${i.body?`<div class="it-body">${esc(i.body)}</div>`:''}
        <div class="meta"><span class="pill k-${i.kind}">${K.i} ${K.l}</span><span class="badge b-${i.status||'unread'}">${i.status==='done'?'✓ done':(i.status||'unread')}</span>${i.source?`<span>${esc(i.source)}</span>`:''}<span title="${esc(i.created_at||'')}">${rel(i.created_at)}</span></div>
      </div></div>`;}).join('')
    + (SHOWN<FI.length?`<button id="more" class="more">Load ${Math.min(PAGE,FI.length-SHOWN)} more · ${FI.length-SHOWN} older</button>`:'');
  list.querySelectorAll('.item').forEach(el=>el.addEventListener('click',()=>openItem(FI[+el.dataset.ix])));
  const more=document.getElementById('more'); if(more) more.onclick=()=>{ SHOWN=Math.min(SHOWN+PAGE,filtered().length); paintList(); };
}
function openItem(it){NAV=[]; document.getElementById('d-dot').className='dot '+it.kind; openDrawer(); push(it.ref,{title:it.title,source:it.source,body:it.body});}
async function push(ref,ctx){NAV.push({ref,ctx:ctx||{}}); await render();}
async function back(){NAV.pop(); await render();}
// the drawer renders WHATEVER ref is on top of the nav stack, generically via viz.layer; a task also
// gets its action controls (open case · pick a recommendation · decide). One code path, any domain.
async function render(){
  const {ref,ctx}=NAV[NAV.length-1], b=document.getElementById('d-body');
  document.getElementById('d-title').textContent=ctx.title||ref||'(item)';
  b.innerHTML='<div class="subj">resolving '+esc(ref||'—')+' …</div>';
  if(!ref){b.innerHTML='<div class="note">No linked subject.</div>';return;}
  let res; try{res=await resolveRef(ref);}catch(e){b.innerHTML='<div class="note">Could not resolve '+esc(ref)+' ('+esc(e.message)+').</div>';return;}
  const loc=res.location||'?', o=res.object;
  let html = NAV.length>1 ? '<span class="crumb" id="back">← back</span>' : '';
  if(ctx.body) html += '<div class="note" style="border-left:3px solid #3b82f6"><b>Submitted by applicant</b><br>'+esc(ctx.body)+'</div>';
  html+='<div class="lbl" style="margin-top:0">Subject <span class="loc loc-'+loc+'">'+loc+'</span></div>';
  if(loc==='local'&&o) html+=renderSubject(o,res.viz||[]);
  else if(loc==='local') html+='<div class="note">Local subject '+esc(ref)+' — not found (pending).</div>';
  else if(loc==='remote') html+='<div class="note">Held by <b>'+esc(res.steward||'?')+'</b>'+(res.resolve_via?' → via <b>'+esc(res.resolve_via)+'</b>':'')+'.<br>'+esc(res.note||'')+'</div>';
  else html+='<div class="note">'+esc(res.note||'')+'</div>';
  html+='<div class="handler">ref: '+esc(ref)+(o?' · '+esc(o.schema):'')+(ctx.source?' · from '+esc(ctx.source):'')+'</div>';
  b.innerHTML=html;
  if(NAV.length>1) document.getElementById('back').onclick=back;
  if(o&&o.schema==='platform.task') await taskControls(b,o);
  if(o&&o.schema==='platform.case') await caseDetails(b,o);           // show the citizen's submitted application
  if(o&&o.schema==='governance.decision') await renderReceipt(o,b);   // reconstructable evidence receipt
}
// A governance.decision's evidence_manifest IS the reconstruction manifest (ADR-0046): it pins the
// RECOMMENDATION admitted, the RULE applied, and the FACTS relied on. Render each — resolved + drillable —
// plus the human DISCRETION basis (rationale). From the decision you can walk back to every input.
async function renderReceipt(dec,b){
  const man=(dec.evidence_manifest||[]).filter(x=>typeof x==='string');
  const recs=man.filter(x=>/\/recommendation\//.test(x));
  const rules=man.filter(x=>/\/rule\//.test(x));
  const facts=man.filter(x=>!/\/recommendation\/|\/rule\//.test(x));
  const wrap=document.createElement('div'); wrap.className='receipt';
  wrap.innerHTML='<div class="lbl" style="margin-top:0">Decision receipt — reconstructable basis</div>';
  b.appendChild(wrap);
  if(dec.rationale){const d=document.createElement('div'); d.className='rblk';
    d.innerHTML='<div class="rlabel">Discretion basis <span class="rk">rationale</span></div><div class="disc">'+esc(String(dec.rationale)).replace(/\n/g,'<br>')+'</div>';
    wrap.appendChild(d);}
  for(const rr of recs) await appendResolved(wrap,rr,'Recommendation');
  for(const rl of rules) await appendResolved(wrap,rl,'Rule applied');
  if(facts.length){
    const fb=document.createElement('div'); fb.className='rblk';
    let head='<div class="rlabel">Facts relied on <span class="rk">'+facts.length+' cell'+(facts.length>1?'s':'')+'</span></div>';
    try{const r0=await resolveRef(facts[0]); const o0=r0.object||{};
      const v=[o0.density_sqm,o0.value,o0.people_per_m2,o0.crush_index].find(x=>x!=null);
      const parts=[esc((o0.schema||'cell').replace('cell.',''))];
      if(v!=null) parts.push(esc(String(v))+' /m²'); if(o0.band) parts.push(esc(String(o0.band)));
      head+='<div class="recl">e.g. '+esc(String(o0.id||facts[0]).split('/').pop())+' — '+parts.join(' · ')+'</div>';
    }catch(e){}
    fb.innerHTML=head; wrap.appendChild(fb);
    facts.slice(0,10).forEach(f=>{const c=document.createElement('span'); c.className='chip fact';
      c.textContent=f.split('/').pop(); c.onclick=()=>push(f,{title:'Fact'}); fb.appendChild(c);});
    if(facts.length>10){const m=document.createElement('span'); m.className='recl'; m.textContent=' +'+(facts.length-10)+' more in manifest'; fb.appendChild(m);}
  }
}
async function appendResolved(wrap,ref,label){
  const d=document.createElement('div'); d.className='rblk clk';
  try{const r=await resolveRef(ref); const o=r.object||{};
    d.innerHTML='<div class="rlabel">'+esc(label)+' <span class="rk">'+esc(o.schema||'')+'</span></div>'
      +'<div class="ctitle">'+esc(String(o.title||o.id||ref))+'</div>'
      +(o.summary?'<div class="csub">'+esc(String(o.summary))+'</div>':'')
      +(o.proposed_action?'<div class="recl">→ '+esc(String(o.proposed_action))+'</div>':'');
  }catch(e){ d.innerHTML='<div class="rlabel">'+esc(label)+'</div><div class="ev">'+esc(ref)+'</div>'; }
  d.onclick=()=>push(ref,{title:label}); wrap.appendChild(d);
}
async function caseDetails(b,c){
  // the citizen's submitted APPLICATION lives in a linked civic.submission (same id stem as the case)
  const subId=(c.id||'').replace(':case/',':civic/submission/');
  let sub=null; try{ const r=await resolveRef(subId); sub=r.object; }catch(e){}
  const data=(sub&&sub.data)||{};
  const box=document.createElement('div'); box.className='controls';
  let h='<div class="lbl" style="margin-top:0">Application submitted by the citizen</div>';
  if(Object.keys(data).length){
    h+='<div style="display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px">';
    for(const k of Object.keys(data)) h+='<div style="color:#8b949e">'+esc(k.replace(/[_-]/g,' '))+'</div><div>'+esc(data[k])+'</div>';
    h+='</div>';
  } else { h+='<div class="note">No structured application on file.</div>'; }
  box.innerHTML=h; b.appendChild(box);
}
async function taskControls(b,task){
  const box=document.createElement('div'); box.className='controls';
  if(task.case){const cl=mkbtn('Open case ↗','btn',()=>push(task.case,{title:'Case'})); box.appendChild(cl);}
  b.appendChild(box);
  if(task.order) b.appendChild(mkbtn('View order ↗','btn',()=>push(task.order,{title:'Order'})));
  if(task.status==='done'){
    const d=document.createElement('div'); d.className='ok'; d.textContent=task.decision?'✓ Decided':'✓ Done'; b.appendChild(d);
    if(task.decision) b.appendChild(mkbtn('View decision (receipt) ↗','btn',()=>push(task.decision,{title:'Decision'})));
    return;
  }
  if(task.order){                                          // an SOP fulfilment task → mark it complete
    const c=document.createElement('div'); c.className='controls';
    c.appendChild(mkbtn('Mark complete','btn primary',()=>complete(task.id)));
    b.appendChild(c); return;
  }
  if(task.decision_kind==='select' && (task.options||[]).length){
    const lab=document.createElement('div'); lab.className='lbl'; lab.textContent='Recommendations — choose one'; b.appendChild(lab);
    let SEL=null; const cards=[];
    for(const optRef of task.options){
      let r; try{r=await resolveRef(optRef);}catch(e){continue;} if(!r.object) continue;
      const el=document.createElement('div'); el.className='recopt'; el.innerHTML=renderSubject(r.object,r.viz||[]);
      el.onclick=()=>{SEL=optRef; cards.forEach(c=>c.classList.remove('sel')); el.classList.add('sel'); go.disabled=false;};
      b.appendChild(el); cards.push(el);
    }
    const go=mkbtn('Record decision','btn primary',()=>decide(task.id,'selected',SEL)); go.disabled=true; b.appendChild(go);
  } else {
    const acts=document.createElement('div'); acts.className='controls';
    acts.appendChild(mkbtn('Approve','btn approve',()=>decide(task.id,'approved',null)));
    acts.appendChild(mkbtn('Reject','btn reject',()=>decide(task.id,'rejected',null)));
    b.appendChild(acts);
  }
}
// the payoff: an action WRITES a governance.decision (evidence_manifest = receipt), the task closes,
// and the event lands in the case history. We then render the decision itself — via its viz.layer.
async function decide(taskId,outcome,selected){
  const r=await bpost('/bridge/decide',{task:taskId,outcome,selected});
  const b=document.getElementById('d-body');
  if(!r.ok){const n=document.createElement('div'); n.className='note'; n.textContent='Action refused ('+r.status+').'; b.appendChild(n); return;}
  if(r.json && r.json.via==='workflow'){                  // a SERVICE-WORKFLOW step: advanced / closed (no decision receipt)
    const rc=document.createElement('div'); rc.className='ok';
    rc.textContent = r.json.case_closed
      ? ('✓ '+(outcome==='rejected'?'Rejected — case closed':'Approved — completed'+(r.json.issued?' · credential issued to the applicant':'')))
      : ('✓ Approved — advanced to “'+(r.json.advanced_to||'next step')+'”'+(r.json.routed_to?' · now with '+r.json.routed_to:''));
    b.appendChild(rc); loadList(); return;
  }
  const dec=r.json.decision;                              // classic decision path → render the receipt
  if(dec&&dec.id){ await push(dec.id,{title:'Decision recorded'});
    const rc=document.createElement('div'); rc.className='ok'; rc.textContent='✓ recorded to case history · case closed'; b.appendChild(rc); }
  loadList();
}
async function complete(taskId){
  const r=await bpost('/bridge/complete',{task:taskId});
  const b=document.getElementById('d-body');
  const n=document.createElement('div'); n.className=r.ok?'ok':'note';
  n.textContent=r.ok?('✓ Completed'+(r.json.case_closed?' — all steps done, case closed':'')):('Complete refused ('+r.status+')');
  b.appendChild(n); loadList();
}
function mkbtn(label,cls,fn){const btn=document.createElement('button'); btn.className=cls; btn.textContent=label; btn.onclick=fn; return btn;}
function renderSubject(o,viz){
  if(!viz.length) return '<div class="rblk"><div class="rlabel">'+esc(o.schema)+' <span class="rk">no viz.layer</span></div><div class="subj">'+esc(JSON.stringify(o,null,2))+'</div></div>';
  return viz.map(L=>{const k=L.render||'map'; return k==='card'||k==='form'||k==='table'?renderCard(o,L):k==='timeline'?renderTimeline(o,L):k==='map'?renderMap(o,L):'';}).join('');
}
function renderCard(o,L){
  const title=L.title_field?path(o,L.title_field):(o.title||o.id), sub=L.subtitle_field?path(o,L.subtitle_field):'';
  const rows=(L.fields||[]).map(f=>{let v=path(o,f.path); if(v&&typeof v==='object') v=JSON.stringify(v);
    return '<div class="field"><span class="fl">'+esc(f.label||f.path)+'</span><span class="fv">'+esc(String(v==null?'—':v))+'</span></div>';}).join('');
  return '<div class="rblk"><div class="rlabel">'+esc(L.label)+' <span class="rk">card</span></div><div class="ctitle">'+esc(String(title||''))+'</div>'+(sub?'<div class="csub">'+esc(String(sub))+'</div>':'')+rows+'</div>';
}
function renderTimeline(o,L){
  const arr=path(o,L.event_path)||[], ef=L.event_fields||{}; if(!Array.isArray(arr)||!arr.length) return '';
  const rows=arr.map(e=>{const at=e[ef.at||'at']||'',lab=e[ef.label||'event']||'',who=e[ef.actor||'actor']||'';
    return '<div class="tl-row"><span class="tl-dot"></span><div><div class="tl-ev">'+esc(String(lab))+'</div><div class="tl-meta">'+esc(String(at).replace('T',' ').replace('Z',''))+(who?' · '+esc(String(who)):'')+'</div></div></div>';}).join('');
  return '<div class="rblk"><div class="rlabel">'+esc(L.label)+' <span class="rk">timeline</span></div>'+rows+'</div>';
}
function renderMap(o,L){
  const ring=(o.space||{}).boundary, fill=SCALE[L.color_scale]||'#3b82f6'; let svg='';
  if(Array.isArray(ring)&&ring.length){
    const xs=ring.map(p=>p[0]),ys=ring.map(p=>p[1]),mnx=Math.min(...xs),mxx=Math.max(...xs),mny=Math.min(...ys),mxy=Math.max(...ys),W=260,H=140,pad=12;
    const sx=v=>pad+(v-mnx)/((mxx-mnx)||1)*(W-2*pad), sy=v=>H-pad-(v-mny)/((mxy-mny)||1)*(H-2*pad);
    const pts=ring.map(p=>sx(p[0]).toFixed(1)+','+sy(p[1]).toFixed(1)).join(' ');
    svg='<svg class="mapbox" viewBox="0 0 '+W+' '+H+'" width="100%"><polygon points="'+pts+'" fill="'+fill+'" fill-opacity="0.45" stroke="'+fill+'" stroke-width="1.5"/></svg>';
  }
  let chip=''; if(L.value_field){const v=path(o,L.value_field); chip='<span class="chip" style="border-color:'+fill+'">'+esc(L.short_label||L.label)+': '+esc(String(v))+(L.unit?' '+esc(L.unit):'')+'</span>';}
  return '<div class="rblk"><div class="rlabel">'+esc(L.label)+' <span class="rk">map</span></div>'+svg+'<div>'+chip+'</div>'+(L.interpretation?'<div class="note">'+esc(L.interpretation)+'</div>':'')+'</div>';
}
function openDrawer(){document.getElementById('scrim').classList.add('open');document.getElementById('drawer').classList.add('open');}
function closeDrawer(){document.getElementById('scrim').classList.remove('open');document.getElementById('drawer').classList.remove('open');}
document.getElementById('scrim').addEventListener('click',closeDrawer);
document.getElementById('d-close').addEventListener('click',closeDrawer);
function path(o,p){return (p||'').split('.').reduce((a,k)=>a==null?a:a[k],o);}
function esc(s){return (s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
boot();
</script>
