# Unified Inbox (kind=app). Every task/notification/decision for the signed-in user, from any solution,
# in one place. Reads platform.inbox_item as the user (host scopes to actor==sub).
component_id: ds:airawatdeveloper:app/inbox
kind: app
version: 0.2.0
provider: ds:airawatdeveloper:developer
display_name: Tasks
icon: 📥
entrypoint: index.html
bundle: dist
sandboxed: true
required_schemas: [platform.inbox_item]

default_install: true   # part of the base-OS default suite every tenant receives
# ADR-0081: this app's App-Agent tools — the personal agent discovers + delegates to these
agent_tools:
  - {name: list_tasks, kind: read, desc: List your open tasks from the Inbox}
