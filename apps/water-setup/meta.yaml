component_id: ds:airawatdeveloper:app/water-setup
kind: app
version: 0.1.0
provider: ds:airawat:developer
display_name: Water Intelligence Setup
entrypoint: dist/index.html
roles: [platform.tenant-admin]          # a board admin configures the solution
