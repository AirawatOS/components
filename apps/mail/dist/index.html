<!doctype html><meta charset="utf-8"><title>Mail</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{--bg:#0d1117;--panel:#161b22;--panel2:#0f141a;--line:#21262d;--txt:#e6edf3;--dim:#8b949e;--accent:#7c5cff;--accent2:#2f81f7;--good:#3fb950;--warn:#d29922;--err:#f85149;--unread:#1b2430}
  *{box-sizing:border-box} html,body{height:100%;margin:0}
  body{background:var(--bg);color:var(--txt);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;overflow:hidden}
  .hbar{display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--line);flex:0 0 auto}
  .brand{font-weight:700;display:flex;align-items:center;gap:7px} .brand .logo{width:22px;height:22px;border-radius:6px;background:linear-gradient(135deg,var(--accent2),var(--accent));display:grid;place-items:center;font-size:13px}
  .me{margin-left:auto;font-size:12px;color:var(--dim);border:1px solid var(--line);border-radius:16px;padding:3px 10px}
  .body{flex:1;display:flex;min-height:0}
  .side{width:190px;background:var(--panel2);border-right:1px solid var(--line);display:flex;flex-direction:column;flex:0 0 auto;padding:10px}
  .compose{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border:0;border-radius:10px;padding:10px;font:600 14px/1 inherit;cursor:pointer;margin-bottom:12px}
  .fold{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;cursor:pointer;color:var(--txt)} .fold:hover{background:#1b222c} .fold.on{background:#1b2430}
  .fold .c{margin-left:auto;font-size:12px;background:var(--accent2);color:#fff;border-radius:10px;padding:0 7px;min-width:20px;text-align:center}
  .list{width:340px;border-right:1px solid var(--line);overflow:auto;flex:0 0 auto}
  .mi{padding:10px 12px;border-bottom:1px solid var(--line);cursor:pointer} .mi:hover{background:#12181f} .mi.on{background:var(--unread)} .mi.unread{background:#0f1722}
  .mi .top{display:flex;gap:8px} .mi .who{font-weight:600;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis} .mi.unread .who{color:#fff} .mi .dt{font-size:11px;color:var(--dim);flex:0 0 auto}
  .mi .subj{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px} .mi.unread .subj{font-weight:600}
  .mi .snip{font-size:12px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .read{flex:1;overflow:auto;min-width:0} .read .rh{padding:16px 20px;border-bottom:1px solid var(--line)}
  .read h2{margin:0 0 8px;font-size:20px} .read .meta{font-size:13px;color:var(--dim)} .read .meta b{color:var(--txt);font-weight:600}
  .read .rb{padding:18px 20px;white-space:pre-wrap;word-wrap:break-word;font-size:15px;line-height:1.6}
  .racts{display:flex;gap:8px;padding:10px 20px;border-top:1px solid var(--line)}
  .btn{background:#21262d;color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:7px 13px;font:inherit;cursor:pointer} .btn.primary{background:var(--accent2);border-color:var(--accent2);color:#fff}
  .welcome{flex:1;display:grid;place-items:center;color:var(--dim);text-align:center;padding:30px}
  .modal{position:fixed;inset:0;background:rgba(4,7,12,.6);display:flex;align-items:center;justify-content:center;z-index:60}
  .sheet{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;width:640px;max-width:94vw;display:flex;flex-direction:column;gap:8px}
  .sheet h3{margin:0} .in{width:100%;background:var(--bg);color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:9px 10px;font:inherit} textarea.in{resize:vertical;min-height:180px;line-height:1.55}
  .row{display:flex;gap:8px;align-items:center} .row .lbl{width:64px;color:var(--dim);font-size:13px}
  .aiBtn{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border:0;border-radius:8px;padding:7px 12px;font:600 13px/1 inherit;cursor:pointer}
  .sub{color:var(--dim);font-size:12px} .spin{display:inline-block;width:12px;height:12px;border:2px solid #ffffff55;border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px} @keyframes sp{to{transform:rotate(360deg)}}
  .atts{display:flex;flex-wrap:wrap;gap:6px} .chip{background:var(--bg);border:1px solid var(--line);border-radius:16px;padding:4px 10px;font-size:12px;display:inline-flex;gap:6px;align-items:center} .chip .x{cursor:pointer;color:var(--dim)} .chip .x:hover{color:var(--err)}
  .attlist{display:flex;flex-wrap:wrap;gap:8px;padding:0 20px 14px} .att{display:inline-flex;gap:6px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 11px;color:var(--txt);text-decoration:none;font-size:13px} .att:hover{border-color:var(--accent2)} .att .sz{color:var(--dim);font-size:11px}
  .rcpt{flex:1;display:flex;flex-wrap:wrap;gap:5px;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:5px 7px;position:relative;min-width:0}
  .rcpt input{flex:1;min-width:120px;background:transparent;border:0;color:var(--txt);font:inherit;outline:none;padding:3px}
  .rcpt .chip{background:#1b2430;border-color:#2b3a55} .chips{display:contents}
  .sug{position:absolute;left:0;right:0;top:100%;margin-top:3px;background:var(--panel);border:1px solid var(--line);border-radius:8px;z-index:5;max-height:200px;overflow:auto;box-shadow:0 8px 24px rgba(0,0,0,.4)}
  .sug div{padding:7px 10px;cursor:pointer;font-size:13px} .sug div:hover{background:var(--accent2);color:#fff}
  .ccbcc{font-size:12px;color:var(--accent2);cursor:pointer;white-space:nowrap} .ccbcc:hover{text-decoration:underline}
</style>
<div class="hbar">
  <span class="brand"><span class="logo">✉️</span>Mail</span>
  <span class="me" id="me"></span>
</div>
<div class="body">
  <div class="side">
    <button class="compose" id="composeBtn">✉️ Compose</button>
    <div class="fold on" data-f="inbox">📥 Inbox <span class="c" id="unread" style="display:none">0</span></div>
    <div class="fold" data-f="sent">📤 Sent</div>
  </div>
  <div class="list" id="list"></div>
  <div class="read" id="read"><div class="welcome">Select a message, or ✉️ Compose one.</div></div>
</div>
<script>
const $=id=>document.getElementById(id);
const esc=s=>(s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uname=p=>(p||'').replace(/^user:\/\/[^/]+\//,'').replace(/^participant:\/\//,'');
let ME='',TENANT='',FOLDER='inbox',MSGS=[],CUR=null;
async function api(p,b){return fetch(p,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b||{})}).then(r=>r.json());}
// attachments: stored on the fact as delimited strings (schema items:string); filestore-backed via /bridge/file*
const encAtt=a=>btoa(unescape(encodeURIComponent(JSON.stringify({file_id:a.file_id,filename:a.filename,content_type:a.content_type||'',size:a.size||0}))));
const decAtt=s=>{try{return JSON.parse(decodeURIComponent(escape(atob(s))));}catch(e){return {file_id:String(s),filename:'file',content_type:'',size:0};}};
const fileUrl=a=>'/bridge/file?id='+encodeURIComponent(a.file_id)+'&name='+encodeURIComponent(a.filename)+'&type='+encodeURIComponent(a.content_type||'');
const fmtSize=n=>n<1024?n+' B':n<1048576?(n/1024).toFixed(0)+' KB':(n/1048576).toFixed(1)+' MB';
async function uploadFile(file){
  const q='?name='+encodeURIComponent(file.name)+'&type='+encodeURIComponent(file.type||'application/octet-stream');
  return fetch('/bridge/file-upload'+q,{method:'POST',headers:{'X-Upload-Type':file.type||'application/octet-stream'},body:file}).then(r=>r.json());
}
function fmtWhen(s){if(!s)return'';const d=new Date(s);if(isNaN(d))return'';const now=new Date();
  if(now.toDateString()===d.toDateString())return d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
  return d.toLocaleDateString([],{month:'short',day:'numeric'});}
function snip(b){return (b||'').replace(/\s+/g,' ').trim().slice(0,80);}
async function boot(){
  try{const s=await fetch('/session').then(r=>r.json());ME=s.sub||'';TENANT=s.tenant||'';}catch(e){}
  $('me').textContent=uname(ME)+' · '+TENANT;
  $('composeBtn').onclick=()=>compose();
  document.querySelectorAll('.fold').forEach(el=>el.onclick=()=>{document.querySelectorAll('.fold').forEach(f=>f.classList.remove('on'));el.classList.add('on');FOLDER=el.dataset.f;load();});
  load();
}
async function load(){const r=await api('/bridge/mail-list',{folder:FOLDER});MSGS=r.messages||[];
  const u=r.unread||0;const b=$('unread');b.style.display=u?'':'none';b.textContent=u;renderList();}
function renderList(){const L=$('list');
  if(!MSGS.length){L.innerHTML='<div class="welcome" style="height:auto;padding:40px 16px">No '+(FOLDER==='sent'?'sent mail':'mail')+' yet.</div>';return;}
  L.innerHTML=MSGS.map(m=>{const unread=FOLDER==='inbox'&&!(m.read_by||[]).includes(ME);
    const who=FOLDER==='sent'?('To: '+(m.recipients||[]).map(uname).join(', ')):uname(m.sender);
    return `<div class="mi ${CUR&&m.id===CUR.id?'on':''} ${unread?'unread':''}" data-id="${esc(m.id)}">
      <div class="top"><span class="who">${esc(who)}</span><span class="dt">${esc(fmtWhen(m.observed_at))}</span></div>
      <div class="subj">${esc(m.subject||'(no subject)')}</div><div class="snip">${esc(snip(m.body))}</div></div>`;}).join('');
  L.querySelectorAll('[data-id]').forEach(el=>el.onclick=()=>openMsg(el.dataset.id));
}
async function openMsg(id){const r=await api('/bridge/mail-get',{id});if(!r.message)return;CUR=r.message;renderRead();
  // update local read state + unread badge
  if(!(CUR.read_by||[]).includes(ME)){CUR.read_by=(CUR.read_by||[]).concat(ME);}
  const m=MSGS.find(x=>x.id===id);if(m)m.read_by=CUR.read_by;renderList();
  const u=MSGS.filter(x=>FOLDER==='inbox'&&!(x.read_by||[]).includes(ME)).length;const b=$('unread');b.style.display=u?'':'none';b.textContent=u;}
function renderRead(){const m=CUR;$('read').innerHTML=`
  <div class="rh"><h2>${esc(m.subject||'(no subject)')}</h2>
    <div class="meta">${(()=>{const cc=m.cc||[],bcc=m.bcc||[],to=(m.recipients||[]).filter(r=>!cc.includes(r)&&!bcc.includes(r));
      return '<b>'+esc(uname(m.sender))+'</b> → '+esc(to.map(uname).join(', ')||'—')
        +(cc.length?' · Cc: '+esc(cc.map(uname).join(', ')):'')
        +(bcc.length?' · <span style="color:var(--warn)">Bcc: '+esc(bcc.map(uname).join(', '))+'</span>':'')
        +' · '+esc(new Date(m.observed_at).toLocaleString());})()}</div></div>
  <div class="rb">${esc(m.body||'')}</div>
  ${(m.attachments&&m.attachments.length)?'<div class="attlist">'+m.attachments.map(s=>{const a=decAtt(s);return '<a class="att" href="'+fileUrl(a)+'" target="_blank" rel="noopener">📎 '+esc(a.filename)+' <span class="sz">'+esc(fmtSize(a.size))+'</span></a>';}).join('')+'</div>':''}
  <div class="racts"><button class="btn primary" id="reply">↩ Reply</button><button class="btn" id="replyall">↩ Reply all</button><button class="btn" id="fwd">➟ Forward</button></div>`;
  $('reply').onclick=()=>reply(false);$('replyall').onclick=()=>reply(true);
  $('fwd').onclick=()=>compose({subject:'Fwd: '+(m.subject||''),body:quoted(m)});
}
function quoted(m){return '\n\n———\nOn '+new Date(m.observed_at).toLocaleString()+', '+uname(m.sender)+' wrote:\n'+(m.body||'').split('\n').map(l=>'> '+l).join('\n');}
function reply(all){const m=CUR;const others=(m.recipients||[]).filter(r=>r!==ME&&r!==m.sender);
  compose({to:[m.sender],cc:all?others:[],subject:(/^re:/i.test(m.subject||'')?'':'Re: ')+(m.subject||''),body:quoted(m),thread_ref:m.thread_ref||m.id,replyCtx:m});}
function toPrincipal(v){v=(v||'').trim();return v?(v.includes('://')?v:('user://'+TENANT+'/'+v)):'';}
function compose(pf){pf=pf||{};
  const TOA=(pf.to||[]).map(toPrincipal).filter(Boolean), CCA=(pf.cc||[]).map(toPrincipal).filter(Boolean), BCCA=(pf.bcc||[]).map(toPrincipal).filter(Boolean);
  const rrow=(lbl,id,extra)=>`<div class="row" id="${id}Row" ${extra||''}><span class="lbl">${lbl}</span><div class="rcpt" id="${id}R"><span class="chips"></span><input placeholder="search people…" autocomplete="off"><div class="sug"></div></div>${lbl==='To'?'<span class="ccbcc" id="ccbccToggle">Cc/Bcc</span>':''}</div>`;
  const m=modal(`<h3>${pf.replyCtx?'Reply':pf.subject&&/^fwd/i.test(pf.subject)?'Forward':'New message'}</h3>
    ${rrow('To','to')}
    ${rrow('Cc','cc','style="display:none"')}
    ${rrow('Bcc','bcc','style="display:none"')}
    <div class="row"><span class="lbl">Subject</span><input class="in" id="subj" value="${esc(pf.subject||'')}"></div>
    <textarea class="in" id="bodyx" placeholder="Write your message…">${esc(pf.body||'')}</textarea>
    <div class="row"><button class="btn" id="attach">📎 Attach</button><input type="file" id="fileinp" multiple style="display:none"><span class="atts" id="atts"></span></div>
    <div class="row"><button class="aiBtn" id="ai">✨ ${pf.replyCtx?'Draft reply':'Draft with AI'}</button><span class="sub" id="s"></span><span style="flex:1"></span>
      <button class="btn" id="x">Cancel</button><button class="btn primary" id="send">Send</button></div>`);
  m.q('#x').onclick=m.close;
  // recipient fields with tenant address-book autocomplete
  function recipField(arr, root){
    const inp=root.querySelector('input'), chips=root.querySelector('.chips'), sug=root.querySelector('.sug');
    function draw(){chips.innerHTML=arr.map((r,i)=>`<span class="chip">${esc(uname(r))} <span class="x" data-i="${i}">✕</span></span>`).join('');
      chips.querySelectorAll('[data-i]').forEach(el=>el.onclick=()=>{arr.splice(+el.dataset.i,1);draw();});}
    function add(v){const p=toPrincipal(v);if(p&&!arr.includes(p))arr.push(p);inp.value='';sug.innerHTML='';draw();}
    let t=null;
    inp.oninput=()=>{clearTimeout(t);const q=inp.value.trim();if(!q){sug.innerHTML='';return;}
      t=setTimeout(async()=>{let r={};try{r=await api('/bridge/user-search',{q});}catch(e){}
        const us=(r.users||[]).filter(u=>!arr.includes(u.sub));
        sug.innerHTML=us.map(u=>`<div data-sub="${esc(u.sub)}">${esc(u.username)}${(u.roles&&u.roles.length)?' <span class="sub">· '+esc(u.roles.join(', '))+'</span>':''}</div>`).join('');
        sug.querySelectorAll('[data-sub]').forEach(el=>el.onmousedown=e=>{e.preventDefault();add(el.dataset.sub);});},180);};
    inp.onkeydown=e=>{if((e.key==='Enter'||e.key===',')&&inp.value.trim()){e.preventDefault();add(inp.value);}else if(e.key==='Backspace'&&!inp.value&&arr.length){arr.pop();draw();}};
    inp.onblur=()=>setTimeout(()=>{sug.innerHTML='';},180);
    draw();
  }
  recipField(TOA,m.q('#toR')); recipField(CCA,m.q('#ccR')); recipField(BCCA,m.q('#bccR'));
  m.q('#ccbccToggle').onclick=()=>{m.q('#ccRow').style.display='';m.q('#bccRow').style.display='';m.q('#ccbccToggle').style.display='none';};
  if(CCA.length)m.q('#ccRow').style.display=''; if(BCCA.length)m.q('#bccRow').style.display='';
  const PEND=[];
  function renderAtts(){m.q('#atts').innerHTML=PEND.map((a,i)=>`<span class="chip">📎 ${esc(a.filename)} <span class="x" data-i="${i}">✕</span></span>`).join('');
    m.q('#atts').querySelectorAll('[data-i]').forEach(el=>el.onclick=()=>{PEND.splice(+el.dataset.i,1);renderAtts();});}
  m.q('#attach').onclick=()=>m.q('#fileinp').click();
  m.q('#fileinp').onchange=async e=>{const s=m.q('#s');for(const f of e.target.files){s.innerHTML='<span class="spin"></span> uploading '+esc(f.name)+'…';
      try{const r=await uploadFile(f);if(r.file_id)PEND.push({file_id:r.file_id,filename:r.filename,content_type:r.content_type,size:r.size});}catch(err){}}
    s.textContent='';renderAtts();e.target.value='';};
  m.q('#ai').onclick=async()=>{m.q('#s').innerHTML='<span class="spin"></span> drafting…';
    const instr=prompt('What should the '+(pf.replyCtx?'reply':'message')+' say? (a short instruction)','');if(instr===null){m.q('#s').textContent='';return;}
    const ctx=pf.replyCtx?('You are replying to this message:\nFrom: '+uname(pf.replyCtx.sender)+'\nSubject: '+pf.replyCtx.subject+'\n\n'+(pf.replyCtx.body||'')):'';
    let r={};try{r=await api('/bridge/ai-assist',{app_id:'mail',task:'draft',prompt:instr+'\n\nWrite a clear, professional email body only (no subject line, no salutations placeholders like [Name]).',context:ctx,format:'plain'});}catch(e){}
    if(r.content){const cur=m.q('#bodyx').value;m.q('#bodyx').value=r.content+(cur?'\n'+cur:'');m.q('#s').textContent='';}else m.q('#s').textContent='⚠ '+(r.error||'no response');};
  m.q('#send').onclick=async()=>{
    if(!TOA.length&&!CCA.length&&!BCCA.length){m.q('#toR').querySelector('input').focus();return;}
    m.q('#send').disabled=true;
    const r=await api('/bridge/mail-send',{to:TOA,cc:CCA,bcc:BCCA,subject:m.q('#subj').value,body:m.q('#bodyx').value,thread_ref:pf.thread_ref,attachments:PEND.map(encAtt)});
    m.close();if(FOLDER==='sent')load();};
}
function modal(html){const w=document.createElement('div');w.className='modal';w.innerHTML=`<div class="sheet">${html}</div>`;document.body.appendChild(w);w.onclick=e=>{if(e.target===w)w.remove();};return{q:s=>w.querySelector(s),close:()=>w.remove()};}
boot();
</script>
