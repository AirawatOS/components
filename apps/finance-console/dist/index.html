<!doctype html><meta charset="utf-8"><title>Finance Console</title>
<link rel="stylesheet" href="/shared/aos.css">
<!--
  FINANCE CONSOLE — the ledger backbone. Chart of ACCOUNTS + BUDGET heads + a double-entry JOURNAL (balanced
  debit/credit lines). Entries post via /bridge/finance-post (auto-balances a convenience posting, validates
  explicit lines, checks budget availability, rolls the charge into the budget). This is the seam Expense /
  Travel / Payroll settle into. Extends cleanly to full double-entry (the entries already ARE balanced lines).
-->
<style>
  /* tokens (theme-aware) from /shared/aos.css */
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  .wrap{display:flex;height:100%}
  .nav{width:180px;flex:0 0 auto;border-right:1px solid var(--line);padding:14px 10px;background:rgba(10,14,20,.4)}
  .nav h1{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--dim);margin:2px 8px 12px}
  .nav a{display:flex;align-items:center;gap:9px;padding:9px 11px;border-radius:9px;color:var(--ink);cursor:pointer;margin-bottom:3px;font-weight:500}
  .nav a:hover{background:#161d27}.nav a.on{background:#14311f;color:#9fe6bf}
  .nav a .c{margin-left:auto;font-size:11px;color:var(--dim);background:#0d1117;border:1px solid var(--line);border-radius:20px;padding:0 7px}
  .main{flex:1;min-width:0;overflow:auto;padding:20px 24px}
  .head{display:flex;align-items:center;margin-bottom:14px}.head h2{margin:0;font-size:18px}.head .sub{color:var(--dim);margin-left:10px;font-size:12px}
  .right{margin-left:auto;display:flex;gap:8px}
  .btn{border:1px solid var(--line);background:#1b232e;color:var(--ink);border-radius:8px;padding:7px 13px;font-size:13px;cursor:pointer}
  .btn:hover{border-color:#33455a}.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}.btn.pri:hover{filter:brightness(1.1)}
  .btn.sm{padding:3px 9px;font-size:12px}.btn.ghost{background:none}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:0;margin-bottom:12px;overflow:hidden}
  table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:8px 12px;border-bottom:1px solid var(--line);font-size:13px}
  th{color:var(--dim);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.04em}
  td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
  tr:hover td{background:#121821}
  tr.sub td{background:#0f1620;color:var(--ink)} tfoot td{border-top:2px solid var(--line)}
  .pill{display:inline-block;font-size:11px;padding:1px 8px;border-radius:20px;border:1px solid var(--line);color:var(--dim)}
  .pill.expense{color:#ff9b9b;border-color:#6d2b2b}.pill.asset{color:#9fd0ff;border-color:#274a6b}.pill.liability{color:#e6c34a;border-color:#7a5c12}
  .pill.revenue{color:#7ee2a8;border-color:#1f6f43}.pill.equity{color:#d8ccff;border-color:#3a2f66}
  .pill.posted{color:#7ee2a8;border-color:#1f6f43}.pill.committed{color:#e6c34a;border-color:#7a5c12}
  .bar{height:7px;border-radius:6px;background:#0d1117;border:1px solid var(--line);overflow:hidden;min-width:120px}
  .bar > i{display:block;height:100%;background:linear-gradient(90deg,#2ea043,#d29922)}
  .empty{color:var(--dim);padding:24px;text-align:center;border:1px dashed var(--line);border-radius:12px}
  label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--dim);margin:0 0 4px}
  input,select{width:100%;background:#0d1117;border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:8px 10px;font-size:13px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.grid.g3{grid-template-columns:1fr 1fr 1fr}.row{margin-bottom:12px}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:flex-start;justify-content:center;padding:5vh 16px;z-index:30}
  .modal.open{display:flex}.sheet{background:#0f151d;border:1px solid var(--line);border-radius:14px;padding:20px;width:560px;max-width:100%;max-height:90vh;overflow:auto}
  .sheet h3{margin:0 0 14px}.muted{color:var(--dim)}.err{color:#ff9b9b;font-size:12px;margin-top:8px}
  .ln{font-size:12px;color:var(--dim)} .ln b{color:var(--ink)}
  #toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#14311f;border:1px solid #2a6b45;color:#9fe6bf;padding:10px 16px;border-radius:10px;z-index:50;opacity:0;transition:opacity .3s}
</style>

<div class="wrap">
  <nav class="nav">
    <h1>💰 <span data-i18n="fin.title">Finance</span></h1>
    <a data-t="accounts"><span>📒</span> <span data-i18n="fin.accounts">Accounts</span> <span class="c" id="c-accounts">0</span></a>
    <a data-t="budgets"><span>🎯</span> <span data-i18n="fin.budgets">Budgets</span> <span class="c" id="c-budgets">0</span></a>
    <a data-t="journal"><span>📓</span> <span data-i18n="fin.journal">Journal</span> <span class="c" id="c-journal">0</span></a>
    <a data-t="reports"><span>📊</span> <span data-i18n="fin.reports">Reports</span></a>
    <a data-t="payroll"><span>🧑‍💼</span> <span data-i18n="fin.payroll">Payroll</span> <span class="c" id="c-payroll">0</span></a>
  </nav>
  <main class="main" id="main"></main>
</div>
<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
<div id="toast"></div>

<script src="/shared/i18n.js"></script>
<script src="/shared/aos.js"></script>
<script>
AI18n.add({
  en:{"fin.title":"Finance","fin.accounts":"Accounts","fin.budgets":"Budgets","fin.journal":"Journal",
      "fin.reports":"Reports","fin.payroll":"Payroll","fin.h.accounts":"Chart of accounts","fin.h.budgets":"Budgets",
      "fin.h.journal":"Journal","fin.h.reports":"Financial statements","fin.h.payroll":"Payroll → projects"},
  hi:{"fin.title":"वित्त","fin.accounts":"खाते","fin.budgets":"बजट","fin.journal":"जर्नल",
      "fin.reports":"रिपोर्ट","fin.payroll":"वेतन","fin.h.accounts":"खातों का चार्ट","fin.h.budgets":"बजट",
      "fin.h.journal":"जर्नल","fin.h.reports":"वित्तीय विवरण","fin.h.payroll":"वेतन → परियोजनाएँ"}
});
const api=AOS.post;                       // shared App Runtime (/shared/aos.js)
const esc=AOS.esc;
const APP='finance-console';
const NORMAL={asset:'debit',expense:'debit',liability:'credit',equity:'credit',revenue:'credit'};
// Standard chart-of-accounts SUB-TYPES per account type (the "usual" set; editable per install later).
const SUBTYPES={
  asset:['Current Asset','Bank & Cash','Accounts Receivable','Inventory','Prepaid Expense','Fixed Asset','Investment'],
  liability:['Current Liability','Accounts Payable','Accrued Liability','Duties & Taxes','Loan / Borrowing','Long-term Liability'],
  equity:['Share Capital','Reserves & Surplus','Retained Earnings'],
  revenue:['Operating Revenue','Other Income','Grants & Subsidies'],
  expense:['Direct Expense','Indirect Expense','Operating Expense','Financial Expense','Depreciation & Amortization']};
// VOUCHER TYPES — each drives which two GL sides the entry debits/credits + the party label. Double-entry stays
// intact: the app builds the balanced 2 lines and posts them through /bridge/finance-post (budget check + rollup).
const VTYPES={
  payment :{label:'Payment',  dir:'expenditure', drLabel:'Expense / Payable (debit)',   crLabel:'Paid from — Bank/Cash (credit)', party:'Paid to',        crHint:'asset'},
  receipt :{label:'Receipt',  dir:'revenue',     drLabel:'Received into — Bank/Cash (debit)', crLabel:'Income / Receivable (credit)', party:'Received from', drHint:'asset'},
  contra  :{label:'Contra',   dir:null,          drLabel:'To — Bank/Cash (debit)',      crLabel:'From — Bank/Cash (credit)',      party:null,             drHint:'asset', crHint:'asset'},
  journal :{label:'Journal',  dir:null,          drLabel:'Debit account',               crLabel:'Credit account',                 party:null},
  sales   :{label:'Sales',    dir:'revenue',     drLabel:'Receivable / Bank (debit)',   crLabel:'Revenue (credit)',               party:'Customer',       crHint:'revenue'},
  purchase:{label:'Purchase', dir:'expenditure', drLabel:'Expense / Asset (debit)',     crLabel:'Payable / Bank (credit)',        party:'Supplier',       crHint:'liability'}};
let TENANT='', TAB='accounts', ACC=[], BUD=[], TXN=[], UNITS=[];
const money=n=>AOS.n(Number(n||0));       // locale-aware digit grouping via the runtime
const acctName=id=>{const a=ACC.find(x=>x.id===id);return a?(a.code+' '+a.name):(id||'—');};
const val=id=>{const e=document.getElementById(id);return e?e.value.trim():'';};
const toast=AOS.toast;
const query=s=>AOS.query(s);              // app_id injected by the runtime
const save=o=>AOS.save(o);

async function boot(){
  await AOS.boot(); TENANT=AOS.tenant||((AOS.session_&&AOS.session_.sub)||'').replace(/^user:\/\//,'').split('/')[0];   // shared boot: session+config+i18n
  await reload();
  document.querySelectorAll('.nav a').forEach(a=>a.onclick=()=>{TAB=a.dataset.t;render();});
  render();
}
let EMP=[],COMP=[],ALLOC=[],PROJ=[],SCHED={};
async function reload(){ [ACC,BUD,TXN,UNITS,EMP,COMP,ALLOC,PROJ]=await Promise.all([query('finance.account'),query('finance.budget'),query('finance.transaction'),query('org.org_unit'),query('org.employee'),query('hr.compensation'),query('project.allocation'),query('project.project')]);
  try{SCHED=await api('/bridge/payroll-schedule',{app_id:APP,action:'get'})||{};}catch(e){SCHED={};}
  document.getElementById('c-accounts').textContent=ACC.length; document.getElementById('c-budgets').textContent=BUD.length; document.getElementById('c-journal').textContent=TXN.length;
  const cp=document.getElementById('c-payroll'); if(cp)cp.textContent=COMP.length; }
function render(){ document.querySelectorAll('.nav a').forEach(a=>a.classList.toggle('on',a.dataset.t===TAB)); ({accounts:rAcc,budgets:rBud,journal:rJnl,reports:rReports,payroll:rPay}[TAB])(); }
const empName=id=>{const e=EMP.find(x=>(x.citizen===id||x.id===id));return e?(e.name||e.id):(id||'—');};
const projName=id=>{const p=PROJ.find(x=>x.id===id);return p?(p.code||p.name):(id||'—');};
const compFor=eid=>COMP.filter(c=>c.employee===eid&&c.status!=='ended').sort((a,b)=>(b.effective_from||'').localeCompare(a.effective_from||''))[0];

/* ---------- ACCOUNTS ---------- */
function rAcc(){                                            // declarative screen via the shared UI primitives (AOS.page/table)
  const actions=[]; if(!ACC.length)actions.push({label:'Seed default chart',onClick:seedChart}); actions.push({label:'＋ Account',onClick:addAcc,primary:true});
  const rows=ACC.slice().sort((a,b)=>(a.code||'').localeCompare(b.code||''));
  AOS.page('main',{title:AI18n.t('fin.h.accounts'),sub:'the GL backbone',actions},
    AOS.table(rows,[
      {key:'code',label:'Code'},{key:'name',label:'Name',bold:true},{key:'type',label:'Type',fmt:'pill'},
      {key:'subtype',label:'Sub-type'},{label:'Normal',render:a=>a.normal||NORMAL[a.type]},
      {label:'',render:a=>AOS.btn('edit',()=>editAcc(a.id),{small:true})}
    ],{caption:'Chart of accounts',empty:'No accounts yet — seed a default chart to get started.'}));
}
async function seedChart(){
  const defs=[['1000','Cash / Bank','asset','Bank & Cash'],['1100','Accounts Receivable','asset','Accounts Receivable'],
    ['2000','Payables','liability','Accounts Payable'],['2100','Duties & Taxes','liability','Duties & Taxes'],['3000','Reserves','equity','Reserves & Surplus'],
    ['4000','Revenue','revenue','Operating Revenue'],['5000','Expenses','expense','Direct Expense'],
    ['5100','Travel expense','expense','Indirect Expense'],['5200','Office expense','expense','Operating Expense']];
  for(const [code,name,type,subtype] of defs){ await save({schema:'finance.account',id:`ds:${TENANT}:finance/account/${code}`,code,name,type,subtype,normal:NORMAL[type],tenant:TENANT,created_at:new Date().toISOString()}); }
  await reload(); toast('Seeded '+defs.length+' accounts'); render();
}
function addAcc(){ openAcc({}); } function editAcc(id){ openAcc(ACC.find(a=>a.id===id)||{}); }
function openAcc(a){ document.getElementById('sheet').innerHTML=`<h3>${a.id?'Edit':'New'} account</h3>
    <div class="grid"><div class="row"><label>Code</label><input id="a_code" value="${esc(a.code||'')}" placeholder="5300"></div>
      <div class="row"><label>Name</label><input id="a_name" value="${esc(a.name||'')}" placeholder="Utilities expense"></div></div>
    <div class="grid"><div class="row"><label>Type</label><select id="a_type" onchange="subOpts()">${['asset','liability','equity','revenue','expense'].map(t=>`<option${a.type===t?' selected':''}>${t}</option>`).join('')}</select></div>
      <div class="row"><label>Sub-type</label><select id="a_subtype"></select></div></div>
    <div id="ferr" class="err"></div><div style="display:flex;gap:8px;margin-top:14px"><button class="btn pri" onclick="saveAcc('${esc(a.id||'')}')">Save</button><button class="btn ghost" onclick="closeM()">Cancel</button></div>`;
  document.getElementById('modal').classList.add('open'); subOpts(a.subtype); }
// (re)fill the Sub-type dropdown for the chosen Type; keep the current value selected when it still applies.
function subOpts(sel){ const t=val('a_type'); const cur=sel!=null?sel:val('a_subtype'); const list=SUBTYPES[t]||[];
  document.getElementById('a_subtype').innerHTML='<option value="">— none —</option>'+list.map(s=>`<option${s===cur?' selected':''}>${esc(s)}</option>`).join(''); }
async function saveAcc(id){ const code=val('a_code'),name=val('a_name'),type=val('a_type'),subtype=val('a_subtype'); if(!code||!name)return ferr('Code and name required');
  const o={schema:'finance.account',id:id||`ds:${TENANT}:finance/account/${code}`,code,name,type,normal:NORMAL[type],tenant:TENANT,created_at:new Date().toISOString()};
  if(subtype)o.subtype=subtype;
  const r=await save(o);
  if(r.error)return ferr(r.error); closeM(); await reload(); render(); }

/* ---------- BUDGETS ---------- */
function rBud(){
  const rows=BUD.map(b=>{const av=(b.allocated||0)-(b.committed||0)-(b.spent||0); const used=(b.allocated? (100*((b.committed||0)+(b.spent||0))/b.allocated):0);
    return `<tr><td><b>${esc(b.name)}</b><div class="muted" style="font-size:11px">${esc(b.fiscal_year)}${b.account?' · '+esc(acctName(b.account)):''}</div></td>
      <td class="num">${money(b.allocated)}</td><td class="num">${money(b.committed)}</td><td class="num">${money(b.spent)}</td>
      <td class="num"><b>${money(av)}</b></td><td><div class="bar"><i style="width:${Math.min(100,used).toFixed(0)}%"></i></div></td>
      <td><button class="btn sm ghost" onclick='editBud("${esc(b.id)}")'>edit</button></td></tr>`;}).join('');
  document.getElementById('main').innerHTML=`<div class="head"><h2>${AI18n.t('fin.h.budgets')}</h2><span class="sub">allocation control per fiscal year</span><div class="right"><button class="btn pri" onclick='addBud()'>＋ Budget</button></div></div>`
    + (BUD.length?`<div class="card"><table><thead><tr><th>Head</th><th class="num">Allocated</th><th class="num">Committed</th><th class="num">Spent</th><th class="num">Available</th><th>Used</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>`
       :`<div class="empty">No budgets yet.</div>`);
}
function addBud(){ openBud({}); } function editBud(id){ openBud(BUD.find(b=>b.id===id)||{}); }
function openBud(b){ const exp=ACC.filter(a=>a.type==='expense');
  document.getElementById('sheet').innerHTML=`<h3>${b.id?'Edit':'New'} budget</h3>
    <div class="grid"><div class="row"><label>Code</label><input id="b_code" value="${esc(b.code||'')}" placeholder="B-TRAVEL-26"></div>
      <div class="row"><label>Name</label><input id="b_name" value="${esc(b.name||'')}" placeholder="Travel — FY2026"></div></div>
    <div class="grid g3"><div class="row"><label>Fiscal year</label><input id="b_fy" value="${esc(b.fiscal_year||'FY2026')}"></div>
      <div class="row"><label>Expense account</label><select id="b_account"><option value="">—</option>${exp.map(a=>`<option value="${esc(a.id)}"${a.id===b.account?' selected':''}>${esc(a.code+' '+a.name)}</option>`).join('')}</select></div>
      <div class="row"><label>Org unit</label><select id="b_unit"><option value="">—</option>${UNITS.map(u=>`<option value="${esc(u.id)}"${u.id===b.org_unit?' selected':''}>${esc(u.name)}</option>`).join('')}</select></div></div>
    <div class="row" style="max-width:220px"><label>Allocated</label><input id="b_alloc" type="number" value="${esc(b.allocated!=null?b.allocated:'')}" placeholder="500000"></div>
    <div id="ferr" class="err"></div><div style="display:flex;gap:8px;margin-top:14px"><button class="btn pri" onclick="saveBud('${esc(b.id||'')}')">Save</button><button class="btn ghost" onclick="closeM()">Cancel</button></div>`;
  document.getElementById('modal').classList.add('open'); }
async function saveBud(id){ const code=val('b_code'),name=val('b_name'),alloc=val('b_alloc'); if(!code||!name||alloc==='')return ferr('Code, name and allocated required');
  const cur=BUD.find(x=>x.id===id)||{};
  const o={schema:'finance.budget',id:id||`ds:${TENANT}:finance/budget/${code}`,code,name,fiscal_year:val('b_fy')||'FY2026',allocated:Number(alloc),
    committed:cur.committed||0,spent:cur.spent||0,status:'active',tenant:TENANT,created_at:cur.created_at||new Date().toISOString()};
  if(val('b_account'))o.account=val('b_account'); if(val('b_unit'))o.org_unit=val('b_unit');
  const r=await save(o); if(r.error)return ferr(r.error); closeM(); await reload(); render(); }

/* ---------- JOURNAL ---------- */
function rJnl(){
  const rows=TXN.slice().sort((a,b)=>(b.created_at||'').localeCompare(a.created_at||'')).map(t=>{
    const lns=(t.lines||[]).map(l=>`<div class="ln">${esc(acctName(l.account))} — ${l.debit?('Dr <b>'+money(l.debit)+'</b>'):('Cr <b>'+money(l.credit)+'</b>')}</div>`).join('');
    const meta=[t.party?('· '+esc(t.party)):'', t.invoice_ref?('· Inv '+esc(t.invoice_ref)):'',
      t.invoice_url?`· <a href="${esc(t.invoice_url)}" target="_blank" rel="noopener" style="color:#7ee2a8">invoice ↗</a>`:''].filter(Boolean).join(' ');
    const vt=t.voucher_type?`<span class="pill">${esc((VTYPES[t.voucher_type]||{}).label||t.voucher_type)}</span>`:(t.direction?`<span class="pill">${esc(t.direction)}</span>`:'');
    return `<tr><td>${esc(t.date)}</td><td><b>${esc(t.memo||'—')}</b>${meta?`<div class="muted" style="font-size:11px">${meta}</div>`:''}${t.source_kind?`<div class="muted" style="font-size:11px">${esc(t.source_kind)}</div>`:''}<div style="margin-top:3px">${lns}</div></td>
      <td class="num">${money(t.amount)}</td><td>${vt}</td><td><span class="pill ${esc(t.status)}">${esc(t.status)}</span></td></tr>`;}).join('');
  document.getElementById('main').innerHTML=`<div class="head"><h2>${AI18n.t('fin.h.journal')}</h2><span class="sub">double-entry — every entry balances (Σ Dr = Σ Cr)</span><div class="right"><button class="btn pri" onclick='newEntry()'>＋ Entry</button></div></div>`
    + (TXN.length?`<div class="card"><table><thead><tr><th>Date</th><th>Entry (lines)</th><th class="num">Amount</th><th>Dir</th><th>Status</th></tr></thead><tbody>${rows}</tbody></table></div>`
       :`<div class="empty">No journal entries yet. Post one — or an Expense/Travel approval will.</div>`);
}
function acctOpts(sel){ return ACC.map(a=>`<option value="${esc(a.id)}"${a.id===sel?' selected':''}>${esc(a.code+' '+a.name)}</option>`).join(''); }
function newEntry(){ const today=new Date().toISOString().slice(0,10);
  document.getElementById('sheet').innerHTML=`<h3>New voucher</h3>
    <div class="grid"><div class="row"><label>Voucher type</label><select id="v_type" onchange="vChange()">${Object.keys(VTYPES).map(k=>`<option value="${k}">${VTYPES[k].label}</option>`).join('')}</select></div>
      <div class="row"><label>Date</label><input id="v_date" type="date" value="${today}"></div></div>
    <div class="row" id="v_party_row"><label id="v_party_lbl">Party</label><input id="v_party" placeholder="Name of party"></div>
    <div class="grid"><div class="row"><label id="v_dr_lbl">Debit account</label><select id="v_dr">${acctOpts()}</select></div>
      <div class="row"><label id="v_cr_lbl">Credit account</label><select id="v_cr">${acctOpts()}</select></div></div>
    <div class="grid"><div class="row"><label>Amount</label><input id="v_amt" type="number" placeholder="12000"></div>
      <div class="row"><label>Charge to budget</label><select id="v_bud" onchange="budAcct()"><option value="">— none —</option>${BUD.map(b=>`<option value="${esc(b.id)}" data-acct="${esc(b.account||'')}">${esc(b.name)}</option>`).join('')}</select></div></div>
    <div class="grid"><div class="row"><label>Invoice no. / ref</label><input id="v_inv" placeholder="INV-2026-014"></div>
      <div class="row"><label>Invoice link (URL)</label><input id="v_invurl" placeholder="https://…/invoice.pdf"></div></div>
    <div class="grid"><div class="row"><label>Status</label><select id="v_status">${['posted','committed'].map(s=>`<option>${s}</option>`).join('')}</select></div>
      <div class="row"><label>Memo</label><input id="v_memo" placeholder="Narration"></div></div>
    <div id="ferr" class="err"></div><div style="display:flex;gap:8px;margin-top:14px"><button class="btn pri" onclick="postEntry()">Post</button><button class="btn ghost" onclick="closeM()">Cancel</button></div>`;
  document.getElementById('modal').classList.add('open'); vChange(); }
// adapt the voucher form to the chosen type: line labels + party field visibility.
function vChange(){ const v=VTYPES[val('v_type')]||VTYPES.journal;
  document.getElementById('v_dr_lbl').textContent=v.drLabel; document.getElementById('v_cr_lbl').textContent=v.crLabel;
  const pr=document.getElementById('v_party_row'); pr.style.display=v.party?'block':'none';
  if(v.party)document.getElementById('v_party_lbl').textContent=v.party; }
function budAcct(){ const s=document.getElementById('v_bud'); const acct=s.options[s.selectedIndex].dataset.acct; if(acct){document.getElementById('v_dr').value=acct;} }
async function postEntry(){ const vt=val('v_type'), v=VTYPES[vt]||VTYPES.journal, amt=Number(val('v_amt'));
  if(!amt||amt<=0)return ferr('Amount required');
  const dr=val('v_dr'), cr=val('v_cr'); if(!dr||!cr)return ferr('Pick both accounts'); if(dr===cr)return ferr('Debit and credit accounts must differ');
  const body={app_id:APP,voucher_type:vt,direction:v.dir||undefined,date:val('v_date')||undefined,status:val('v_status'),memo:val('v_memo'),
    lines:[{account:dr,debit:amt,credit:0},{account:cr,debit:0,credit:amt}]};
  if(v.party&&val('v_party'))body.party=val('v_party');
  if(val('v_inv'))body.invoice_ref=val('v_inv');
  if(val('v_invurl'))body.invoice_url=val('v_invurl');

  const r=await api('/bridge/finance-post',body);
  if(r.error)return ferr(r.error); closeM(); await reload(); render(); toast(v.label+' posted · '+money(r.amount)+(r.committed?' · committed to budget':'')); }

/* ---------- PAYROLL → PROJECT APPORTIONMENT ---------- */
let PREVIEW=null;
function curPeriod(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');}
function rPay(){
  const compRows=EMP.map(e=>{const c=compFor(e.id);const alloc=ALLOC.filter(a=>a.employee===e.id&&a.status!=='ended');
    return `<tr><td><b>${esc(e.name||e.id)}</b><div class="muted" style="font-size:11px">${alloc.map(a=>esc(projName(a.project))+' '+a.percent+'%').join(' · ')||'no allocations'}</div></td>
      <td class="num">${c?money(c.monthly_cost):'<span class="muted">— not set —</span>'}</td>
      <td><button class="btn sm ghost" onclick='setComp("${esc(e.id)}")'>${c?'edit':'set cost'}</button></td></tr>`;}).join('');
  const salaryTxn=TXN.filter(t=>t.source_kind==='payroll').sort((a,b)=>(b.created_at||'').localeCompare(a.created_at||''));
  const txnRows=salaryTxn.map(t=>`<tr><td>${esc((t.memo||'').replace('Salary apportionment ',''))}</td><td>${esc(projName(t.project))}</td><td class="num">${money(t.amount)}</td><td><span class="pill posted">${esc(t.status)}</span></td></tr>`).join('');
  const sc=SCHED||{};
  const schedCard=`<div class="card"><div style="padding:12px 16px;display:flex;gap:14px;align-items:center;flex-wrap:wrap">
      <div><b>⏱ Automatic monthly run</b><div class="muted" style="font-size:12px">${sc.enabled?('ON · day '+sc.day+' each month'):'off'}${sc.next_run?(' · next '+String(sc.next_run).slice(0,10)):''}${sc.last_run?(' · last '+String(sc.last_run).slice(0,10)+' ('+(sc.last_status||'')+')'):''}</div></div>
      <label style="display:flex;align-items:center;gap:6px;margin:0;text-transform:none;letter-spacing:0"><span class="muted">Day of month</span><input id="sc_day" type="number" min="1" max="28" value="${sc.day||28}" style="width:66px"></label>
      <button class="btn ${sc.enabled?'':'pri'}" onclick="toggleSchedule(${sc.enabled?'false':'true'})">${sc.enabled?'Turn off':'Turn on'}</button>
      ${sc.enabled?'<button class="btn ghost" onclick="toggleSchedule(true)">Save day</button>':''}
      <span class="muted" style="margin-left:auto;font-size:12px">Apportions the current month, hands-off (the platform scheduler fires it).</span>
    </div></div>`;
  document.getElementById('main').innerHTML=`<div class="head"><h2>${AI18n.t('fin.h.payroll')}</h2><span class="sub">apportion labour cost to projects by allocation %</span></div>`
    + schedCard
    + `<div class="card"><div style="padding:12px 16px;display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap">
        <div style="max-width:150px"><label>Period</label><input id="pay_period" value="${curPeriod()}" placeholder="2026-08"></div>
        <button class="btn" onclick="previewPay()">Preview</button>
        <button class="btn pri" onclick="runPay()">Run apportionment</button>
        <span class="muted" style="margin-left:auto">Posts a project-tagged salary entry per active allocation (idempotent).</span></div>
      <div id="pay_result"></div></div>
    <div class="head" style="margin-top:6px"><h2 style="font-size:15px">Compensation</h2><span class="sub">monthly cost-to-org (the apportionment basis)</span></div>
    <div class="card"><table><thead><tr><th>Employee · allocations</th><th class="num">Monthly cost</th><th></th></tr></thead><tbody>${compRows||'<tr><td colspan=3 class="muted" style="padding:16px">No employees.</td></tr>'}</tbody></table></div>
    ${salaryTxn.length?`<div class="head" style="margin-top:6px"><h2 style="font-size:15px">Apportioned salary entries</h2></div>
      <div class="card"><table><thead><tr><th>Line</th><th>Project</th><th class="num">Amount</th><th>Status</th></tr></thead><tbody>${txnRows}</tbody></table></div>`:''}`;
}
function setComp(eid){const c=compFor(eid)||{};                       // form via the shared primitive (AOS.form) — modal + validation + save in one spec
  AOS.form('Monthly cost · '+empName(eid),[
    {id:'cost',label:'Monthly cost (₹)',type:'number',value:c.monthly_cost!=null?c.monthly_cost:'',required:true,placeholder:'120000'},
    {id:'from',label:'Effective from',type:'date',value:c.effective_from||''}
  ],{onSave:async v=>{
    const cost=Number(v.cost); if(!cost||cost<=0)return {error:'A positive monthly cost is required'};
    const cur=compFor(eid)||{}; const id=cur.id||`ds:${TENANT}:hr/compensation/${eid.split('/').pop()}`;
    const r=await save({schema:'hr.compensation',id,employee:eid,monthly_cost:cost,currency:'INR',effective_from:v.from||(new Date().toISOString().slice(0,10)),status:'active',tenant:TENANT,created_at:cur.created_at||new Date().toISOString()});
    if(r.error)return r; await reload(); render(); toast('Compensation saved'); return r;
  }});
}
async function previewPay(){const period=val('pay_period');const r=await api('/bridge/payroll-preview',{app_id:APP,period});
  const el=document.getElementById('pay_result');
  if(r.error){el.innerHTML=`<div class="err" style="padding:12px 16px">${esc(r.error)}</div>`;return;}
  PREVIEW=r;const lines=(r.lines||[]).map(l=>`<tr><td>${esc(l.employee_name||l.employee)}</td><td>${esc(projName(l.project))}</td><td class="num">${l.percent}%</td><td class="num">${money(l.monthly_cost)}</td><td class="num"><b>${money(l.cost)}</b>${l.prorated?('<div class="muted" style="font-size:11px">pro-rata '+l.active_days+'/'+l.days_in_month+'d</div>'):''}</td></tr>`).join('');
  const skip=(r.skipped||[]).map(s=>`<tr><td>${esc(s.employee_name||s.employee)}</td><td>${esc(projName(s.project))}</td><td colspan=3 class="muted">skipped — ${esc(s.reason)}</td></tr>`).join('');
  el.innerHTML=`<div style="padding:0 16px 14px"><table><thead><tr><th>Employee</th><th>Project</th><th class="num">%</th><th class="num">Monthly</th><th class="num">Apportioned</th></tr></thead><tbody>${lines}${skip}</tbody></table>
    <div style="margin-top:8px" class="muted">${r.count} line(s) · total <b>${money(r.total)}</b>${r.skipped.length?(' · '+r.skipped.length+' skipped'):''}</div></div>`;
}
async function toggleSchedule(enabled){const day=Number(val('sc_day'))||28;
  const r=await api('/bridge/payroll-schedule',{app_id:APP,action:'set',enabled,day});
  if(r.error){toast(r.error);return;}
  SCHED=r; render(); toast(enabled?('Automatic run ON · day '+r.day+(r.install==='ready'?'':(r.install?(' ('+r.install+')'):'')) ):'Automatic run OFF');
}
async function runPay(){const period=val('pay_period');const r=await api('/bridge/payroll-apportion',{app_id:APP,period});
  if(r.error){document.getElementById('pay_result').innerHTML=`<div class="err" style="padding:12px 16px">${esc(r.error)}</div>`;return;}
  await reload();render();
  toast(`Posted ${r.posted_count} entr${r.posted_count===1?'y':'ies'} · ${money(r.posted_total)}${r.already_posted?(' · '+r.already_posted+' already'):''}${r.skipped.length?(' · '+r.skipped.length+' skipped'):''}`);
}

/* ---------- REPORTS: Trial Balance · P&L · Balance Sheet ---------- */
// Balance per account = Σdebit − Σcredit over POSTED entries (committed = a reservation, excluded from actuals).
function acctBal(){ const bal={}; TXN.filter(t=>(t.status||'posted')==='posted').forEach(t=>(t.lines||[]).forEach(l=>{ bal[l.account]=(bal[l.account]||0)+(Number(l.debit)||0)-(Number(l.credit)||0); })); return bal; }
function bySub(type,bal,amtFn){ const g={}; ACC.filter(a=>a.type===type).forEach(a=>{ const amt=amtFn(bal[a.id]||0); if(Math.abs(amt)<0.005)return; const s=a.subtype||'Unclassified'; (g[s]=g[s]||[]).push({a,amt}); });
  return Object.keys(g).sort().map(s=>({sub:s,rows:g[s],total:g[s].reduce((x,y)=>x+y.amt,0)})); }
function secRows(groups){ return groups.map(gp=>`<tr class="sub"><td colspan="2"><b>${esc(gp.sub)}</b></td><td class="num muted">${money(gp.total)}</td></tr>`
    +gp.rows.map(r=>`<tr><td style="padding-left:26px">${esc(r.a.code)}</td><td>${esc(r.a.name)}</td><td class="num">${money(r.amt)}</td></tr>`).join('')).join(''); }
function rReports(){
  const bal=acctBal(); const posted=TXN.filter(t=>(t.status||'posted')==='posted').length;
  // TRIAL BALANCE — every account with a balance, split into its debit/credit column; totals must match.
  const tbRows=ACC.slice().sort((a,b)=>(a.code||'').localeCompare(b.code||'')).map(a=>{const b=bal[a.id]||0; if(Math.abs(b)<0.005)return'';
      return `<tr><td>${esc(a.code)}</td><td>${esc(a.name)}</td><td class="num">${b>0?money(b):''}</td><td class="num">${b<0?money(-b):''}</td></tr>`;}).join('');
  const tbDr=Object.entries(bal).reduce((s,[,b])=>s+(b>0?b:0),0), tbCr=Object.entries(bal).reduce((s,[,b])=>s+(b<0?-b:0),0);
  // P&L — income = credit balances of revenue; expense = debit balances of expense; net = income − expense.
  const inc=bySub('revenue',bal,b=>-b), exp=bySub('expense',bal,b=>b);
  const incT=inc.reduce((s,g)=>s+g.total,0), expT=exp.reduce((s,g)=>s+g.total,0), net=incT-expT;
  // BALANCE SHEET — assets (debit) vs liabilities+equity (credit); current-year net result folds into equity.
  const asset=bySub('asset',bal,b=>b), liab=bySub('liability',bal,b=>-b), eq=bySub('equity',bal,b=>-b);
  const assetT=asset.reduce((s,g)=>s+g.total,0), liabT=liab.reduce((s,g)=>s+g.total,0), eqBase=eq.reduce((s,g)=>s+g.total,0), eqT=eqBase+net;
  const bsBalanced=Math.abs(assetT-(liabT+eqT))<0.5;
  const T=(head,body,foot)=>`<div class="card"><table><thead><tr>${head}</tr></thead><tbody>${body}</tbody>${foot?`<tfoot>${foot}</tfoot>`:''}</table></div>`;
  document.getElementById('main').innerHTML=`<div class="head"><h2>${AI18n.t('fin.h.reports')}</h2><span class="sub">from ${posted} posted entr${posted===1?'y':'ies'} · as of ${new Date().toISOString().slice(0,10)}</span></div>`
    + `<div class="head" style="margin:6px 0"><h2 style="font-size:15px">Trial Balance</h2></div>`
    + (tbRows?T(`<th>Code</th><th>Account</th><th class="num">Debit</th><th class="num">Credit</th>`, tbRows,
        `<tr><td></td><td><b>Total</b></td><td class="num"><b>${money(tbDr)}</b></td><td class="num"><b>${money(tbCr)}</b></td></tr>`
        +(Math.abs(tbDr-tbCr)<0.5?'':`<tr><td colspan="4" class="err" style="padding:8px 12px">⚠ out of balance by ${money(Math.abs(tbDr-tbCr))}</td></tr>`))
      :`<div class="empty">No posted entries yet.</div>`)
    + `<div class="head" style="margin:14px 0 6px"><h2 style="font-size:15px">Profit &amp; Loss</h2></div>`
    + T(`<th>Code</th><th>Account</th><th class="num">Amount</th>`,
        `<tr class="sub"><td colspan="3"><b>Income</b></td></tr>${secRows(inc)||'<tr><td colspan=3 class="muted" style="padding-left:26px">—</td></tr>'}`
        +`<tr><td></td><td><b>Total income</b></td><td class="num"><b>${money(incT)}</b></td></tr>`
        +`<tr class="sub"><td colspan="3"><b>Expenses</b></td></tr>${secRows(exp)||'<tr><td colspan=3 class="muted" style="padding-left:26px">—</td></tr>'}`
        +`<tr><td></td><td><b>Total expenses</b></td><td class="num"><b>${money(expT)}</b></td></tr>`,
        `<tr><td></td><td><b>${net>=0?'Surplus (Net Profit)':'Deficit (Net Loss)'}</b></td><td class="num"><b style="color:${net>=0?'#7ee2a8':'#ff9b9b'}">${money(net)}</b></td></tr>`)
    + `<div class="head" style="margin:14px 0 6px"><h2 style="font-size:15px">Balance Sheet</h2>${bsBalanced?'<span class="sub">✓ balances</span>':'<span class="sub err">⚠ does not balance</span>'}</div>`
    + T(`<th>Code</th><th>Account</th><th class="num">Amount</th>`,
        `<tr class="sub"><td colspan="3"><b>Assets</b></td></tr>${secRows(asset)||'<tr><td colspan=3 class="muted" style="padding-left:26px">—</td></tr>'}`
        +`<tr><td></td><td><b>Total assets</b></td><td class="num"><b>${money(assetT)}</b></td></tr>`
        +`<tr class="sub"><td colspan="3"><b>Liabilities</b></td></tr>${secRows(liab)||'<tr><td colspan=3 class="muted" style="padding-left:26px">—</td></tr>'}`
        +`<tr class="sub"><td colspan="3"><b>Equity</b></td></tr>${secRows(eq)}`
        +`<tr><td style="padding-left:26px">—</td><td>Current-year result</td><td class="num">${money(net)}</td></tr>`,
        `<tr><td></td><td><b>Total liabilities + equity</b></td><td class="num"><b>${money(liabT+eqT)}</b></td></tr>`);
}

function ferr(m){ const e=document.getElementById('ferr'); if(e)e.textContent=m; }
function closeM(){ document.getElementById('modal').classList.remove('open'); }

/* AI assistant drawer + 🎤 mic now come from the shared App Runtime — see AOS.assistant / AOS.mic. */
/* ---- Finance Console assistant config (grounded on accounts/budgets/journal + computed statements) ---- */
function aiFinanceContext(){
  const bal=acctBal();
  const accounts=ACC.map(a=>({code:a.code,name:a.name,type:a.type,subtype:a.subtype||'',balance:Math.round(bal[a.id]||0)}));
  const budgets=BUD.map(b=>{const av=(b.allocated||0)-(b.committed||0)-(b.spent||0);
    return {name:b.name,fy:b.fiscal_year,allocated:b.allocated||0,committed:b.committed||0,spent:b.spent||0,available:av,util_pct:b.allocated?Math.round(100*((b.committed||0)+(b.spent||0))/b.allocated):0};});
  const inc=bySub('revenue',bal,b=>-b), exp=bySub('expense',bal,b=>b);
  const incT=inc.reduce((s,g)=>s+g.total,0), expT=exp.reduce((s,g)=>s+g.total,0);
  const tbDr=Object.values(bal).reduce((s,b)=>s+(b>0?b:0),0), tbCr=Object.values(bal).reduce((s,b)=>s+(b<0?-b:0),0);
  const recent=TXN.slice().sort((a,b)=>(b.created_at||'').localeCompare(a.created_at||'')).slice(0,20)
    .map(t=>({date:t.date,memo:t.memo,amount:t.amount,status:t.status,type:t.voucher_type||t.direction||''}));
  return JSON.stringify({currency:'INR',accounts,budgets,
    profit_and_loss:{income:Math.round(incT),expense:Math.round(expT),net:Math.round(incT-expT)},
    trial_balance:{debit_total:Math.round(tbDr),credit_total:Math.round(tbCr),balanced:Math.abs(tbDr-tbCr)<0.5},
    recent_journal:recent}).slice(0,11000);
}
async function aiFinanceRun(name,p){
  if(name!=='draft_voucher')throw new Error('unknown action');
  document.getElementById('aiDrawer').classList.remove('open');
  TAB='journal'; render(); newEntry();                 // open the (fresh) New Voucher modal, then pre-fill it
  const set=(id,v)=>{const e=document.getElementById(id); if(e&&v!=null&&v!=='')e.value=v;};
  if(p.voucher_type&&VTYPES[p.voucher_type]){const s=document.getElementById('v_type'); if(s){s.value=p.voucher_type; vChange();}}
  set('v_amt',p.amount); set('v_memo',p.memo||''); if(p.party)set('v_party',p.party);
  const byCode=c=>{const a=ACC.find(x=>String(x.code)===String(c)); return a?a.id:'';};
  if(p.debit_code){const id=byCode(p.debit_code); if(id)set('v_dr',id);}
  if(p.credit_code){const id=byCode(p.credit_code); if(id)set('v_cr',id);}
  return 'Opened a pre-filled voucher — review the lines and click Post to record it.';
}
function mountAI(){ AOS.assistant({ app:APP, title:'Finance assistant',
  system:'You are the finance assistant inside the Finance Console. You see the chart of accounts (with live balances), budgets (allocated/committed/spent/util%), recent journal entries, and computed Trial Balance / P&L totals. Explain balances, budget utilisation, surplus/deficit and anomalies clearly. All amounts are INR. When the user asks to record a payment/receipt/expense, propose the draft_voucher action with the right accounts (by code) and amount.',
  chips:['Explain my P&L','Which budgets are over-utilised?','Summarise recent journal entries','Is my trial balance balanced?'],
  context:aiFinanceContext,
  actions:[{name:'draft_voucher',label:'Open pre-filled voucher',
    description:'Open the New Voucher form pre-filled for the user to review and Post. params: voucher_type (one of payment,receipt,contra,journal,sales,purchase), amount (number, INR), memo (string), party (string, optional), debit_code (account code from the chart), credit_code (account code from the chart), budget (optional budget name)'}],
  run:aiFinanceRun }); }

boot().then(mountAI);
</script>
