<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Model Lab</title>
<style>
  :root{--bg:#0b1520;--panel:#0f1d2b;--edge:#1f3247;--edge2:#2a4560;--ink:#e6edf5;--muted:#9fb3c8;--dim:#7c8fa3;--accent:#38bdf8;--good:#34d399;--warn:#fbbf24;--bad:#f87171}
  *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,Segoe UI,sans-serif}
  header{padding:10px 22px 0 84px;border-bottom:1px solid var(--edge)} h1{margin:0 0 4px;font-size:18px} .sub{color:var(--muted);margin:0 0 10px;font-size:13px}
  .tabs{display:flex;gap:4px} .tab{background:none;border:0;border-bottom:2px solid transparent;color:var(--dim);padding:8px 14px;font-size:14px;cursor:pointer}
  .tab.on{color:var(--ink);border-color:var(--accent)} main{padding:18px 22px;max-width:1280px}
  table{border-collapse:collapse;width:100%;font-size:13px} th,td{border-bottom:1px solid var(--edge);padding:7px 9px;text-align:left;vertical-align:top}
  th{color:var(--muted);font-weight:600;font-size:12px} td.n{text-align:right;font-variant-numeric:tabular-nums} tr.click{cursor:pointer} tr.click:hover td{background:#13263a}
  .btn{background:var(--panel);border:1px solid var(--edge2);color:var(--ink);border-radius:8px;padding:6px 12px;font-size:13px;cursor:pointer}
  .btn.p{background:var(--accent);color:#04121f;border-color:var(--accent);font-weight:600} .btn:disabled{opacity:.5;cursor:default}
  .card{background:var(--panel);border:1px solid var(--edge);border-radius:12px;padding:14px 16px;margin:0 0 14px}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:6px 0} label{color:var(--muted);font-size:12.5px}
  input,select,textarea{background:#0a1622;border:1px solid var(--edge2);color:var(--ink);border-radius:7px;padding:6px 8px;font:13px system-ui}
  textarea{width:100%;font-family:ui-monospace,Menlo,monospace;font-size:12px} pre{white-space:pre-wrap;word-break:break-word;background:#0a1622;border:1px solid var(--edge);border-radius:8px;padding:10px;font-size:12px;max-height:340px;overflow:auto;margin:6px 0}
  .pill{display:inline-block;border-radius:999px;padding:1px 8px;font-size:11.5px;border:1px solid var(--edge2);color:var(--muted)}
  .pill.good{color:var(--good);border-color:var(--good)} .pill.warn{color:var(--warn);border-color:var(--warn)} .pill.bad{color:var(--bad);border-color:var(--bad)}
  .bar{height:8px;border-radius:4px;background:var(--edge);overflow:hidden;min-width:80px} .bar i{display:block;height:100%;background:var(--accent)}
  .msg{color:var(--muted);font-size:13px;margin:8px 0} .err{color:var(--bad)} .grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:12px}
  .muted{color:var(--muted)} .small{font-size:12px}
</style></head>
<body>
<header>
  <div class="tabs"><button class="tab on" data-t="suites">Suites</button><button class="tab" data-t="cases">Cases</button><button class="tab" data-t="models">Models</button><button class="tab" data-t="runs">Runs</button><button class="tab" data-t="results">Results</button><button class="tab" data-t="pick">Pick</button></div>
</header>
<main id="main"><p class="msg">Loading…</p></main>
<script>
const APPID="model-lab", ENGINE="ds:airawatdeveloper:engine/model-eval";
let TENANT="", ME="", TAB="suites", CASES=[], RUNS=[], DOCS=[], MODELS=[], MINFO=[], SELECTED=new Set(), SUITE=null, RUN=null, CASE=null;
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const iso=()=>new Date().toISOString().replace(/\.\d+Z$/,"Z");
const slug=s=>String(s||"").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,48)||"x";
async function q(schema,extra){ let out=[], cursor=null;
  for(let p=0;p<40;p++){ const body=Object.assign({app_id:APPID,schema,limit:2000},extra||{}); if(cursor) body.cursor=cursor;
    const r=await fetch("/bridge/query",{method:"POST",credentials:"same-origin",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
    if(!r.ok) throw new Error(schema+" "+r.status); const d=await r.json(); const rows=(d.results||[]).map(x=>x.object||x);
    out=out.concat(rows); cursor=d.next_cursor; if(!cursor||!rows.length) break; }
  return out.filter(o=>String(o.id||"").startsWith("ds:"+TENANT+":")); }
async function save(obj){ const r=await fetch("/bridge/save",{method:"POST",credentials:"same-origin",headers:{"Content-Type":"application/json"},body:JSON.stringify({app_id:APPID,object:obj})});
  const t=await r.text(); if(!r.ok) throw new Error(t.slice(0,200)); return t; }
async function runEngine(env){ const r=await fetch("/bridge/run",{method:"POST",credentials:"same-origin",headers:{"Content-Type":"application/json"},body:JSON.stringify(env?{component:ENGINE,env}:{component:ENGINE})});
  const t=await r.text(); if(!r.ok) throw new Error(t.slice(0,200)); return t; }
function suites(){ const m={}; for(const c of CASES){ const s=m[c.suite]=m[c.suite]||{name:c.suite,cases:0,active:0,labelled:0,task:c.task,vis:{}}; s.cases++; if(c.status==="active") s.active++; if(c.labelled) s.labelled++; s.vis[c.visibility]=1; }
  for(const r of RUNS){ const s=m[r.suite]; if(s&&(!s.last||String(r.requested_at)>String(s.last.requested_at))) s.last=r; }
  return Object.values(m).sort((a,b)=>a.name.localeCompare(b.name)); }
function setTab(t){ TAB=t; document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("on",b.dataset.t===t)); render(); }
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>setTab(b.dataset.t));
const pct=x=>x==null?"—":Math.round(x*100)+"%";
const scorePill=x=>x==null?'<span class="pill">—</span>':`<span class="pill ${x>=0.8?"good":x>=0.5?"warn":"bad"}">${pct(x)}</span>`;

function render(){ const el=$("main");
  if(TAB==="suites") return renderSuites(el);
  if(TAB==="cases") return renderCases(el);
  if(TAB==="models") return renderModels(el);
  if(TAB==="runs") return renderRuns(el);
  if(TAB==="pick") return renderPick(el);
  return renderResults(el); }

function renderSuites(el){ const ss=suites();
  el.innerHTML=`<div class="card"><b>Build a suite from a document</b><p class="msg">One test case per section that mentions the focus words — each case is exactly the call the norm extractor makes. Expected answers come from norms already approved for that section; the rest are labelled in the Cases tab.</p>
    <div class="row"><label>Document</label><select id="sdoc">${DOCS.map(d=>`<option value="${esc(d.doc_id)}">${esc(d.title)}</option>`).join("")||"<option value=''>No documents in this tenant's knowledge base</option>"}</select>
    <label>Focus words</label><input id="sfocus" size="40" value="per capita, lpcd, water supply, sewage, solid waste">
    <label>Cases</label><input id="slimit" type="number" value="30" style="width:70px"><button class="btn p" id="sgo">Build suite</button></div><div id="smsg" class="msg"></div></div>
  <table><tr><th>Suite</th><th>Task</th><th class="n">Cases</th><th class="n">Labelled</th><th>Visibility</th><th>Last run</th><th>Best model</th></tr>
  ${ss.map(s=>{ const best=s.last&&s.last.summary?Object.entries(s.last.summary).sort((a,b)=>b[1].score-a[1].score)[0]:null;
    return `<tr class="click" data-s="${esc(s.name)}"><td><b>${esc(s.name)}</b></td><td>${esc(s.task)}</td><td class="n">${s.active}/${s.cases}</td><td class="n">${s.labelled}</td><td>${Object.keys(s.vis).map(v=>`<span class="pill">${esc(v)}</span>`).join(" ")}</td>
    <td>${s.last?`${esc(String(s.last.requested_at||"").slice(0,16).replace("T"," "))} <span class="pill">${esc(s.last.status)}</span>`:'<span class="muted">none</span>'}</td><td>${best?`${esc(best[0])} ${scorePill(best[1].score)}`:"—"}</td></tr>`; }).join("")||'<tr><td colspan="7" class="muted">No suites yet — build one from a document above.</td></tr>'}</table>`;
  el.querySelectorAll("tr[data-s]").forEach(tr=>tr.onclick=()=>{ SUITE=tr.dataset.s; setTab("cases"); });
  $("sgo").onclick=async()=>{ const doc=$("sdoc").value; if(!doc) return; const name="norms-"+slug(doc).slice(0,40);
    $("sgo").disabled=true; $("smsg").textContent="Building suite "+name+"…";
    try{ await runEngine({SEED_DOC:doc,SEED_SUITE:name,SEED_FOCUS:$("sfocus").value,SEED_LIMIT:String($("slimit").value||30)});
      $("smsg").textContent="Started — the cases appear here in a minute or two (refreshing)."; SUITE=name; setTimeout(()=>reload().then(render),60000); }
    catch(e){ $("smsg").innerHTML='<span class="err">'+esc(e.message)+"</span>"; } finally{ $("sgo").disabled=false; } }; }

function renderCases(el){ const ss=suites(); SUITE=SUITE||(ss[0]||{}).name;
  const cs=CASES.filter(c=>c.suite===SUITE).sort((a,b)=>a.id.localeCompare(b.id));
  if(cs.some(c=>(c.inputs||[]).length)) return renderImageLabelling(el,ss,cs.filter(c=>c.status!=="retired"));   // retired images are out of the working set
  const c=CASE&&cs.find(x=>x.id===CASE.id);
  el.innerHTML=`<div class="row"><label>Suite</label><select id="csuite">${ss.map(s=>`<option ${s.name===SUITE?"selected":""}>${esc(s.name)}</option>`).join("")}</select><span class="muted small">${cs.length} cases · ${cs.filter(x=>x.labelled).length} labelled</span></div>
  <div class="grid2"><div><table><tr><th>Case</th><th>Labelled</th><th>Status</th></tr>${cs.map(x=>`<tr class="click" data-c="${esc(x.id)}"><td>${esc((x.source||{}).label||x.title)}</td><td>${x.labelled?`<span class="pill good">${expectCount(x)} ${expectOf(x).word}</span>`:((x.expected||{}).draft?`<span class="pill" title="Drafted — open to review and save">draft · ${((x.expected||{}).norms||[]).length}</span>`:'<span class="pill">not yet</span>')}</td><td><span class="pill">${esc(x.status)}</span></td></tr>`).join("")||'<tr><td colspan="3" class="muted">No cases.</td></tr>'}</table></div>
  <div>${c?caseEditor(c):'<p class="msg">Pick a case to see its prompt and label its expected answer.</p>'}</div></div>`;
  $("csuite").onchange=e=>{ SUITE=e.target.value; CASE=null; render(); };
  el.querySelectorAll("tr[data-c]").forEach(tr=>tr.onclick=()=>{ CASE=CASES.find(x=>x.id===tr.dataset.c); render(); });
  if(c) bindEditor(c); }
const EXPECT={norms:{key:"norms",list:true,word:"norms",help:'Expected norms — a JSON list of {metric, operator, value, unit}; an empty list means "this section states no quantitative norm".'},
  json_fields:{key:"fields",list:false,word:"fields",help:"Expected answer — a JSON object of field: value. Numbers match within 1%; text matches ignoring case."},
  contains:{key:"contains",list:true,word:"phrases",help:"Phrases the answer must contain — a JSON list of strings."},
  exact:{key:"answer",list:false,word:"answer",help:"The exact answer — a JSON string."}};
const expectOf=c=>EXPECT[c.scorer||"norms"]||EXPECT.norms;
function expectCount(c){ const e=expectOf(c), v=(c.expected||{})[e.key]; return Array.isArray(v)?v.length:(v&&typeof v==="object")?Object.keys(v).length:(v==null?0:1); }
// ---- image suites: label once per image, saved to that image's case in every test (ADR-0134) ----
let IMG=null, IMGFILTER="todo", DETS=null, DETSLOADING=false, SHOWBOX=true, ZOOM=false;
const BOXCOL={car:"#60a5fa",two_wheeler:"#f59e0b",three_wheeler:"#34d399",bus:"#f472b6",truck:"#a78bfa",bicycle:"#f87171",pedestrian:"#e5e7eb",cattle:"#a3e635",dog:"#fb923c",other_animal:"#2dd4bf",other:"#94a3b8"};
async function loadDets(){                       // the latest in-house detector answer per image: boxes, classes, scores
  const byCase={}; for(const c of CASES) byCase[c.id]=c; const out={};
  for(const r of await q("intelligence.eval_result")){ const m=r.metrics||{}; if(!String(r.model).startsWith("component:")||!m.detections) continue;
    const c=byCase[r.case_ref], fid=c&&((c.inputs||[])[0]||{}).file_id; if(!fid) continue;
    if(!out[fid]||String(out[fid].at)<String(r.at)) out[fid]={at:r.at,model:r.model,detections:m.detections,size:m.image_size,threshold:m.threshold}; }
  // prefer the fullest pipeline's latest run (people and animals too) over a vehicles-only one
  DETS=out; }
// ---- box review: the reviewer's boxes are the image's ground truth; counts and classes follow from them ----
let EDIT={}, DRAWCLS="two_wheeler", SEL=-1;
function boxClasses(g){ const cl=t=>((((g.cases.find(c=>c.test_id===t)||{}).label_form)||[])[0]||{}).classes||[];   // vehicles, pedestrian, animals
  return [...new Set([...(cl("B03").length?cl("B03"):["car","two_wheeler","three_wheeler","bus","truck","bicycle"]),"pedestrian",...(cl("B09").length?cl("B09"):["cattle","dog","other_animal"])])]; }
function boxState(g){                            // saved review if any, else the detector's boxes (unreviewed)
  if(EDIT[g.file_id]) return EDIT[g.file_id];
  const b03=g.cases.find(c=>c.test_id==="B03"), saved=b03&&b03.labelled&&(b03.expected||{}).boxes, d=DETS&&DETS[g.file_id];
  const boxes=saved?saved.map(x=>({class:x.class,box:x.box.slice(),origin:x.origin,score:x.score}))
    :(d?d.detections.filter(x=>x.class!=="other"&&!x.rider&&x.score>=(d.threshold||0)).map(x=>({class:x.class,box:x.box.slice(),origin:"detector",score:x.score})):[]);
  return EDIT[g.file_id]={boxes,removed:0,size:(d&&d.size)||null,saved:!!saved,src:d?{model:d.model,threshold:d.threshold}:null}; }
function boxCounts(st){ const n={}; st.boxes.forEach(b=>n[b.class]=(n[b.class]||0)+1); return n; }
function syncFields(g){                          // B03 vehicle counts, B04 pedestrians, B01 classes present ← the boxes
  const st=boxState(g), n=boxCounts(st);
  for(const c of g.cases){ const f=(c.label_form||[])[0]||{}, id="lf-"+String(c.test_id||"x").toLowerCase();
    if(c.test_id==="B03"||c.test_id==="B04"||c.test_id==="B09") document.querySelectorAll(`input[data-f="${id}"]`).forEach(x=>x.value=String(n[x.dataset.k]||0));
    if(c.test_id==="B01"){ const present=new Set(Object.keys(n)); document.querySelectorAll(`input[data-f="${id}"]`).forEach(x=>x.checked=x.value==="none"?present.size===0:present.has(x.value)); } } }
function boxSvg(st){ if(!st.size) return "";
  const [w,h]=st.size, fs=Math.max(14,Math.round(w/90)), sw=Math.max(2,Math.round(w/600));
  return `<svg id="lsvg" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" style="position:absolute;inset:0;width:100%;height:100%;cursor:crosshair;touch-action:none"><rect data-bg="1" x="0" y="0" width="${w}" height="${h}" fill="rgba(0,0,0,0)"/>${st.boxes.map((x,i)=>{ const [x1,y1,x2,y2]=x.box, col=BOXCOL[x.class]||BOXCOL.other, sel=i===SEL;
    return `<rect data-i="${i}" x="${x1}" y="${y1}" width="${x2-x1}" height="${y2-y1}" fill="${sel?"rgba(255,255,255,.12)":"rgba(0,0,0,0)"}" stroke="${col}" stroke-width="${sel?sw*2:sw}" ${x.origin==="added"?`stroke-dasharray="${sw*3} ${sw*2}"`:""} style="cursor:pointer"/><text x="${x1+2}" y="${Math.max(fs,y1-4)}" font-size="${fs}" fill="${col}" stroke="#000" stroke-width="${Math.max(1,sw/2)}" paint-order="stroke" pointer-events="none">${esc(x.class)}${x.origin==="detector"||x.origin==="kept"?" "+Math.round((x.score||0)*100):""}${x.origin==="added"?" +":""}</text>`; }).join("")}<rect id="ldraft" x="0" y="0" width="0" height="0" fill="none" stroke="#fff" stroke-width="${sw}" stroke-dasharray="${sw*3} ${sw*2}" pointer-events="none"/></svg>`; }
function boxBar(g){ const st=boxState(g), n=boxCounts(st), cls=boxClasses(g), b=st.boxes[SEL];
  const added=st.boxes.filter(x=>x.origin==="added").length, changed=st.boxes.filter(x=>x.origin==="changed").length;
  return `<div class="row small"><b>Boxes</b> <span class="muted">${st.boxes.length} · ${Object.entries(n).map(([k,v])=>`<span style="color:${BOXCOL[k]||"#94a3b8"}">${esc(k)} ${v}</span>`).join(" ")||"none"}</span>
      <span class="muted">· ${st.saved?"your saved review":st.src?"detector boxes (≥ "+st.src.threshold+"), not reviewed yet":"no detector boxes — draw them"}${added||changed||st.removed?` · ${added} added, ${changed} changed, ${st.removed} removed`:""}</span></div>
    <div class="row small"><label>Draw as</label>${cls.map(k=>`<label style="color:${BOXCOL[k]||"#94a3b8"}"><input type="radio" name="ldraw" value="${esc(k)}" ${k===DRAWCLS?"checked":""}> ${esc(k)}</label>`).join(" ")}
      <button class="btn" id="lzoom">${ZOOM?"Fit":"Zoom"}</button></div>
    ${b?`<div class="row small"><b>Selected:</b> <select id="lselcls">${cls.map(k=>`<option ${k===b.class?"selected":""}>${esc(k)}</option>`).join("")}</select><button class="btn" id="ldel">Delete box</button><span class="muted">${b.origin==="added"?"drawn by you":b.origin==="changed"?"class changed by you":"from the detector"+(b.score?" ("+Math.round(b.score*100)+"%)":"")} · Del removes · Esc deselects</span></div>`
      :`<div class="small muted">Drag on the image to draw a missed object as the class above. Click a box to change its class or delete it. Counts below follow the boxes.</div>`}`; }
function redrawBoxes(g){ const st=boxState(g); $("lwrap").querySelector("svg")?.remove(); $("lwrap").insertAdjacentHTML("beforeend",boxSvg(st));
  $("lbar").innerHTML=boxBar(g); wireBoxes(g); syncFields(g); }
function wireBoxes(g){ const st=boxState(g), svg=$("lsvg");
  document.querySelectorAll('input[name="ldraw"]').forEach(x=>x.onchange=()=>{ DRAWCLS=x.value; });
  if($("lzoom")) $("lzoom").onclick=()=>{ ZOOM=!ZOOM; $("lwrap").style.maxWidth=ZOOM?"none":"100%"; $("limg").style.maxWidth=ZOOM?"none":"100%"; $("lzoom").textContent=ZOOM?"Fit":"Zoom"; };
  if($("lselcls")) $("lselcls").onchange=e=>{ const b=st.boxes[SEL]; if(!b) return; b.class=e.target.value; if(b.origin!=="added") b.origin="changed"; redrawBoxes(g); };
  if($("ldel")) $("ldel").onclick=()=>{ const b=st.boxes[SEL]; if(!b) return; if(b.origin!=="added") st.removed++; st.boxes.splice(SEL,1); SEL=-1; redrawBoxes(g); };
  if(!svg) return;
  const pt=e=>{ const r=svg.getBoundingClientRect(); return [Math.max(0,Math.min(st.size[0],(e.clientX-r.left)/r.width*st.size[0])),Math.max(0,Math.min(st.size[1],(e.clientY-r.top)/r.height*st.size[1]))]; };
  let start=null;
  svg.onpointerdown=e=>{ const t=e.target;
    if(t.dataset.i!==undefined){ SEL=+t.dataset.i; redrawBoxes(g); return; }
    if(!t.dataset.bg) return; start=pt(e); svg.setPointerCapture(e.pointerId); };
  svg.onpointermove=e=>{ if(!start) return; const [x,y]=pt(e), d=$("ldraft");
    d.setAttribute("x",Math.min(start[0],x)); d.setAttribute("y",Math.min(start[1],y)); d.setAttribute("width",Math.abs(x-start[0])); d.setAttribute("height",Math.abs(y-start[1])); };
  svg.onpointerup=e=>{ if(!start) return; const [x,y]=pt(e), s0=start; start=null;
    const minpx=Math.max(4,st.size[0]/400);
    if(Math.abs(x-s0[0])<minpx||Math.abs(y-s0[1])<minpx){ SEL=-1; redrawBoxes(g); return; }        // a click on empty space deselects
    st.boxes.push({class:DRAWCLS,box:[Math.min(s0[0],x),Math.min(s0[1],y),Math.max(s0[0],x),Math.max(s0[1],y)].map(v=>Math.round(v*10)/10),origin:"added"});
    SEL=st.boxes.length-1; redrawBoxes(g); }; }
document.addEventListener("keydown",e=>{ if(!IMG||!EDIT[IMG.file_id]||/INPUT|SELECT|TEXTAREA/.test((e.target||{}).tagName||"")) return;
  const st=EDIT[IMG.file_id];
  if((e.key==="Delete"||e.key==="Backspace")&&st.boxes[SEL]){ e.preventDefault(); if(st.boxes[SEL].origin!=="added") st.removed++; st.boxes.splice(SEL,1); SEL=-1; redrawBoxes(IMG); }
  else if(e.key==="Escape"&&SEL>=0){ SEL=-1; redrawBoxes(IMG); } });
const tagOf=(c,k)=>((c.tags||[]).find(t=>t.startsWith(k+":"))||"").slice(k.length+1);
function imageGroups(cs){ const g={}; for(const c of cs){ const inp=(c.inputs||[])[0]; if(!inp) continue; const k=inp.file_id;
  const x=g[k]=g[k]||{file_id:k,name:inp.name||(c.source||{}).label||k.slice(0,16),cases:[],site:tagOf(c,"site"),view:tagOf(c,"view"),split:tagOf(c,"split")}; x.cases.push(c); }
  return Object.values(g).sort((a,b)=>a.name.localeCompare(b.name)); }
const imgUrl=g=>"/bridge/file?id="+encodeURIComponent(g.file_id)+"&name="+encodeURIComponent(g.name)+"&type=image%2Fjpeg&inline=1";
function fieldValue(c){ const f=(c.label_form||[])[0]||{}, e=c.expected||{};
  if(f.kind==="choice") return typeof e.labels==="string"?e.labels:""; if(f.kind==="multi") return Array.isArray(e.labels)?e.labels:[];
  if(f.kind==="counts") return e.counts||{}; return e.text||{}; }
function fieldHtml(c){ const f=(c.label_form||[])[0]||{}, v=fieldValue(c), id="lf-"+String(c.test_id||"x").toLowerCase();
  const dr=(c.expected||{}).draft;
  const head=`<div class="small muted" style="margin-top:10px"><b>${esc(c.test_id||"")}</b> ${esc(f.label||"")} ${c.labelled?'<span class="pill good">labelled</span>':dr?`<span class="pill warn" title="${esc(dr.by||"")}">draft — check before saving</span>`:""}</div>`
    +(dr&&!c.labelled&&dr.note?`<div class="small muted">${esc(dr.note)}</div>`:"")
    +(f.help?`<details class="small muted"><summary>Definition</summary>${esc(f.help)}</details>`:"");

// ---- PICK (ADR-0134): for each test, the cheapest candidate that meets the accuracy bar ------------------------------
// Scores are each candidate's latest scored answer per labelled case (any run). Candidates are compared on the cases
// they ALL answered ("shared"), so nobody is ranked on an easier set. Cost order: classical CV and detectors on our CPU,
// then in-house vision-language models (GPU), then hosted models; within a tier, the faster wins.
const PICKBAR_KEY="modellab.pick.bars";
function pickBars(){ try{ return JSON.parse(localStorage.getItem(PICKBAR_KEY)||"{}"); }catch(e){ return {}; } }
function setPickBar(t,v){ const b=pickBars(); b[t]=v; try{ localStorage.setItem(PICKBAR_KEY,JSON.stringify(b)); }catch(e){} }
function candKind(m){ m=String(m); if(/image-quality/.test(m)) return "classical CV"; if(/rtdetr|detect/.test(m)) return "detector"; if(m.startsWith("component:")) return "component"; return "vision-language model"; }
function median(a){ if(!a.length) return null; const b=a.slice().sort((x,y)=>x-y), i=b.length>>1; return b.length%2?b[i]:(b[i-1]+b[i])/2; }
function fmtMs(ms){ return ms==null?"—":ms<1000?Math.round(ms)+" ms":(ms/1000).toFixed(ms<10000?1:0)+" s"; }
async function renderPick(el){
  const img=suites().filter(s=>CASES.some(c=>c.suite===s.name&&(c.inputs||[]).length));
  SUITE=img.some(s=>s.name===SUITE)?SUITE:(img[0]||{}).name;
  if(!SUITE){ el.innerHTML='<p class="msg">No image suite yet.</p>'; return; }
  el.innerHTML='<p class="msg">Comparing candidates…</p>';
  const res=await q("intelligence.eval_result");
  const cs=CASES.filter(c=>c.suite===SUITE&&c.status==="active"); const byId={}; cs.forEach(c=>byId[c.id]=c);
  const tests=[...new Set(cs.map(c=>c.test_id))].filter(Boolean).sort();
  const inHouse={};                              // a model that answered a private image case is in-house (the privacy guard refuses others)
  const latest={};                               // model → case → latest result
  for(const r of res){ const c=byId[r.case_ref]; if(!c) continue;
    if(!r.error&&(c.visibility||"private")==="private"&&(c.inputs||[]).length) inHouse[r.model]=true;
    const k=r.model+"|"+r.case_ref; if(!latest[k]||String(r.at)>String(latest[k].at)) latest[k]=r; }
  const MINN=+($("pminn")&&$("pminn").value||5), bars=pickBars();
  const rows=tests.map(t=>{
    const lab=cs.filter(c=>c.test_id===t&&c.labelled), cand={};
    for(const c of lab) for(const k in latest){ const r=latest[k]; if(r.case_ref!==c.id||r.score==null) continue; (cand[r.model]=cand[r.model]||[]).push(r); }
    const models=Object.keys(cand).filter(m=>cand[m].length>=MINN);
    let shared=null; for(const m of models){ const ids=new Set(cand[m].map(r=>r.case_ref)); shared=shared?new Set([...shared].filter(x=>ids.has(x))):ids; }
    const list=Object.keys(cand).map(m=>{ const rs=cand[m], sh=shared&&models.includes(m)?rs.filter(r=>shared.has(r.case_ref)):[];
      const tier=m.startsWith("component:")?0:inHouse[m]?1:2;
      const toks=rs.map(r=>{ const u=r.usage||{}; return u.total_tokens||((u.prompt_tokens||0)+(u.completion_tokens||0))||null; }).filter(x=>x);
      return {m, n:rs.length, err:rs.filter(r=>r.error).length, score:rs.reduce((a,r)=>a+r.score,0)/rs.length,
        shared:sh.length?sh.reduce((a,r)=>a+r.score,0)/sh.length:null, nshared:sh.length, ms:median(rs.map(r=>r.latency_ms).filter(x=>x!=null)),
        toks:toks.length?Math.round(toks.reduce((a,b)=>a+b,0)/toks.length):null, tier, kind:candKind(m), enough:rs.length>=MINN}; });
    const bar=bars[t]!=null?bars[t]:0.85;
    const ok=list.filter(x=>x.enough&&(x.shared!=null&&models.length>1?x.shared:x.score)>=bar).sort((a,b)=>a.tier-b.tier||(a.ms||0)-(b.ms||0));
    const best=list.filter(x=>x.enough).sort((a,b)=>(b.shared??b.score)-(a.shared??a.score))[0];
    return {t, title:((((cs.find(c=>c.test_id===t)||{}).label_form||[])[0]||{}).label)||t, nlab:lab.length, list:list.sort((a,b)=>a.tier-b.tier||(b.score-a.score)), bar, pick:ok[0], best, nshared:shared?shared.size:0, multi:models.length>1};
  });
  const where=x=>x.tier===0?"in-house · CPU":x.tier===1?"in-house · GPU":"hosted";
  el.innerHTML=`<div class="row"><label>Suite</label><select id="psuite">${img.map(s=>`<option ${s.name===SUITE?"selected":""}>${esc(s.name)}</option>`).join("")}</select>
      <label>Fewest labelled cases to count</label><input id="pminn" type="number" min="1" value="${MINN}" style="width:64px">
      <span class="msg">The pick is the cheapest candidate whose score meets the bar — CPU before in-house GPU before hosted, then the faster. Scores compare candidates on the labelled cases they all answered.</span></div>
    ${rows.map(r=>`<div class="card"><div class="row" style="justify-content:space-between"><div><b>${esc(r.t)}</b> ${esc(r.title)} <span class="muted small">· ${r.nlab} labelled${r.multi?" · "+r.nshared+" answered by all":""}</span></div>
        <div class="row"><label>Bar</label><input type="number" step="0.05" min="0" max="1" value="${r.bar}" data-bar="${esc(r.t)}" style="width:70px">
        ${r.pick?`<span class="pill good">Pick: ${esc(r.pick.m.replace("component:",""))}</span>`:r.best?`<span class="pill warn">None meets the bar · best ${esc(r.best.m.replace("component:",""))}</span>`:'<span class="pill">Not enough labels yet</span>'}</div></div>
      ${r.list.length?`<table><tr><th>Candidate</th><th>Kind</th><th>Runs on</th><th class="n">Score</th>${r.multi?'<th class="n">On shared cases</th>':""}<th class="n">Scored</th><th class="n">Errors</th><th class="n">Median time</th><th class="n">Tokens / case</th></tr>
        ${r.list.map(x=>`<tr style="${r.pick&&r.pick.m===x.m?"background:#10283a":""}"><td>${esc(x.m.replace("component:",""))}${x.enough?"":' <span class="muted small">(too few)</span>'}</td><td>${esc(x.kind)}</td><td>${where(x)}</td>
          <td class="n">${scorePill(x.score)}</td>${r.multi?`<td class="n">${x.shared==null?"—":scorePill(x.shared)}</td>`:""}<td class="n">${x.n}</td><td class="n">${x.err||""}</td><td class="n">${fmtMs(x.ms)}</td><td class="n">${x.toks==null?"—":x.toks.toLocaleString()}</td></tr>`).join("")}</table>`
        :'<p class="msg">No scored answers on labelled cases yet.</p>'}</div>`).join("")}`;
  $("psuite").onchange=e=>{ SUITE=e.target.value; renderPick(el); };
  $("pminn").onchange=()=>renderPick(el);
  el.querySelectorAll("[data-bar]").forEach(i=>i.onchange=()=>{ setPickBar(i.dataset.bar,Math.max(0,Math.min(1,+i.value||0))); renderPick(el); });
}
async function renderResults(el){ const runs=RUNS.slice().sort((a,b)=>String(b.requested_at).localeCompare(String(a.requested_at)));
  RUN=RUN||runs[0]; if(!RUN){ el.innerHTML='<p class="msg">No runs yet.</p>'; return; }
  el.innerHTML='<p class="msg">Loading results…</p>';
  let res=[]; try{ res=(await q("intelligence.eval_result")).filter(r=>r.run_ref===RUN.id); }catch(e){ el.innerHTML='<p class="err">'+esc(e.message)+"</p>"; return; }
  const models=RUN.models||[], byCase={}; for(const r of res){ (byCase[r.case_ref]=byCase[r.case_ref]||{})[r.model]=r; }
  const agg=models.map(m=>{ const rs=res.filter(r=>r.model===m), n=rs.length||1;
    const s=RUN.summary&&RUN.summary[m], sc=rs.filter(r=>typeof r.score==="number");
    return {m, n:rs.length, scored:sc.length, score:sc.length?sc.reduce((a,r)=>a+r.score,0)/sc.length:null, ans:rs.filter(r=>(r.metrics||{}).answered).length,
      empty:rs.filter(r=>!r.error&&!(r.metrics||{}).answered).length, errs:rs.filter(r=>r.error).length, lat:rs.reduce((a,r)=>a+(r.latency_ms||0),0)/n,
      tok:rs.reduce((a,r)=>a+(((r.usage||{}).completion_tokens)||0),0)/n, served:[...new Set(rs.map(r=>r.served_by).filter(Boolean))].join(", ")}; }).sort((a,b)=>b.score-a.score);
  const caseTitle=id=>{ const c=CASES.find(x=>x.id===id); return c?((c.source||{}).label||c.title):id.split("/").pop(); };
  el.innerHTML=`<div class="row"><label>Run</label><select id="rsel">${runs.map(r=>`<option value="${esc(r.id)}" ${r.id===RUN.id?"selected":""}>${esc(String(r.requested_at||"").slice(0,16).replace("T"," "))} · ${esc(r.suite)} · ${esc(r.status)}</option>`).join("")}</select><button class="btn" id="rref">Refresh</button><button class="btn" id="rresc" title="Score this run again with the current scorers and labels — no new model calls, except answers that had been cut off">Rescore</button><span id="rrmsg" class="msg"></span></div>
  <div class="card"><b>Leaderboard</b> <span class="muted small">${esc(RUN.suite)} · ${res.length} answers so far</span>
  <table><tr><th>Model</th><th>Score</th><th></th><th class="n">Answered</th><th class="n">Empty</th><th class="n">Errors</th><th class="n">Avg time</th><th class="n">Avg tokens</th><th>Served by</th></tr>
  ${agg.map(a=>`<tr><td><b>${esc(a.m)}</b></td><td>${scorePill(a.n?a.score:null)}</td><td><div class="bar"><i style="width:${Math.round(a.score*100)}%"></i></div></td><td class="n">${a.ans}/${a.n}</td><td class="n">${a.empty}</td><td class="n">${a.errs}</td><td class="n">${(a.lat/1000).toFixed(1)} s</td><td class="n">${Math.round(a.tok)}</td><td class="small">${esc(a.served)}</td></tr>`).join("")}</table>
  <p class="small muted">Unlabelled cases score whether the model answered with valid norms whose numbers all appear in the section; labelled cases score against their expected answer (F1 on norms, or the share of expected fields matched).</p></div>
  ${(()=>{ const byCase={}; for(const c of CASES) byCase[c.id]=c;                 // image suites: by test, and by view
      const rows=res.map(r=>({r,c:byCase[r.case_ref]})).filter(x=>x.c&&x.c.test_id&&typeof x.r.score==="number");
      if(!rows.length) return "";
      const tg=(c,k)=>((c.tags||[]).find(t=>t.startsWith(k+":"))||"").slice(k.length+1);
      const groups=[...new Set(rows.map(x=>x.c.test_id))].sort(), views=[...new Set(rows.map(x=>tg(x.c,"view")).filter(Boolean))].sort();
      const cell=(m,f)=>{ const xs=rows.filter(x=>x.r.model===m&&f(x.c)).map(x=>x.r.score); return xs.length?`${scorePill(xs.reduce((a,b)=>a+b,0)/xs.length)} <span class="small muted">${xs.length}</span>`:'<span class="muted">—</span>'; };
      return `<div class="card"><b>By test</b> <span class="small muted">labelled cases only · the small number is how many cases</span><table><tr><th>Test</th>${models.map(m=>`<th>${esc(m)}</th>`).join("")}</tr>
        ${groups.map(t=>`<tr><td>${esc(t)} <span class="small muted">${esc(((CASES.find(c=>c.test_id===t)||{}).title||"").split(" · ")[0])}</span></td>${models.map(m=>`<td>${cell(m,c=>c.test_id===t)}</td>`).join("")}</tr>`).join("")}
        ${views.map(v=>`<tr><td class="muted">all tests · view ${esc(v)}</td>${models.map(m=>`<td>${cell(m,c=>tg(c,"view")===v)}</td>`).join("")}</tr>`).join("")}</table></div>`; })()}
  <div class="card"><b>Answers side by side</b><table><tr><th>Case</th>${models.map(m=>`<th>${esc(m)}</th>`).join("")}</tr>
  ${Object.keys(byCase).sort().map(cid=>`<tr class="click" data-cc="${esc(cid)}"><td>${esc(caseTitle(cid))}</td>${models.map(m=>{ const r=byCase[cid][m]; if(!r) return "<td class='muted'>…</td>";
    const mt=r.metrics||{}; return `<td>${scorePill(r.score)} <span class="small muted">${r.error?"error":mt.answered?(mt.valid??"")+" valid, "+(mt.grounded??"")+" grounded":"empty"} · ${((r.latency_ms||0)/1000).toFixed(1)} s</span></td>`; }).join("")}</tr>
    <tr id="x-${esc(slug(cid))}" hidden><td colspan="${models.length+1}"><div class="grid2">${models.map(m=>{ const r=byCase[cid][m]||{}; return `<div><b class="small">${esc(m)}</b>${r.error?`<p class="err small">${esc(r.error)}</p>`:""}<pre>${esc(r.output||"(no answer)")}</pre></div>`; }).join("")}</div></td></tr>`).join("")}</table></div>`;
  $("rsel").onchange=e=>{ RUN=RUNS.find(x=>x.id===e.target.value); render(); };
  $("rref").onclick=async()=>{ await reload(); RUN=RUNS.find(x=>x.id===RUN.id)||RUN; render(); };
  $("rresc").onclick=async()=>{ $("rresc").disabled=true; try{ await runEngine({RESCORE_RUN:RUN.id,RERUN_TRUNCATED:"1"}); $("rrmsg").textContent="Rescoring — press Refresh in a minute."; }catch(e){ $("rrmsg").innerHTML='<span class="err">'+esc(e.message)+"</span>"; } finally{ $("rresc").disabled=false; } };
  el.querySelectorAll("tr[data-cc]").forEach(tr=>tr.onclick=()=>{ const x=document.getElementById("x-"+slug(tr.dataset.cc)); if(x) x.hidden=!x.hidden; }); }

async function reload(){ [CASES,RUNS]=await Promise.all([q("intelligence.eval_case"),q("intelligence.eval_run")]); }
(async()=>{ try{ const s=await (await fetch("/session",{credentials:"same-origin"})).json(); TENANT=s.tenant||""; ME=s.sub||"";
    await reload();
    try{ DOCS=(await q("knowledge.document")).filter(d=>d.status==="acquired"||d.current_version||d.status==="ready"); }catch(e){ DOCS=[]; }
    try{ const prov=await fetch("/bridge/query",{method:"POST",credentials:"same-origin",headers:{"Content-Type":"application/json"},body:JSON.stringify({app_id:APPID,schema:"intelligence.provider",limit:200})}).then(r=>r.json());
      MINFO=modelInfo((prov.results||[]).map(x=>x.object||x)); MODELS=MINFO.map(m=>m.name); }catch(e){ MINFO=[]; MODELS=[]; }
    if(!MODELS.length){ MODELS=["kimi-k3"]; MINFO=[{name:"kimi-k3",task:"chat",where:"—",provider:"—"}]; }
    MINFO.filter(m=>m.task==="chat").forEach(m=>SELECTED.add(m.name));
    render(); }
  catch(e){ $("main").innerHTML='<p class="err">Could not load ('+esc(e.message)+").</p>"; } })();
</script>
